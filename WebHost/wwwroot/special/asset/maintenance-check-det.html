<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title>维修实施明细</title>
    <script src="../../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%; overflow:auto;">
    <form id="mainform" style="width:97%; margin-bottom: 50px;">
    </form>
    <script type="text/javascript">
        'use strict';
        var business = {
            setConfig: function () {
                var me = this;
                me.config = {
                    form: {
                        labelwidth: 220,
                        fields: [
                            {
                                display: "记录状态", name: "AUDITING_CHECK", width: 300, type: "select", options: {
                                    type: "select",
                                    data: me.auditing,
                                    disabled: true
                                }, group: "基础信息"
                            },
                            { display: "维修申请单号", name: "APPLY_CODE", width: 300, type: "text", options: { disabled: true } },
                            {
                                display: "修复状态", name: "REPORT_STATE", width: 300, type: "select", validate: { required: true }, options: {
                                    type: "select",
                                    data: me.reportState,
                                }
                            },
                            { display: "申请提交时间", name: "APPLY_DATE", width: 300, type: "date", options: { disabled: true } },
                            { display: "实施提交时间", name: "CHECK_DATE", width: 300, type: "date", options: { disabled: true } },

                            { display: "设备编码", name: "ASSET_CODE", width: 300, type: "text", options: { disabled: true }, group: "设备信息" },
                            { display: "设备名称", name: "ASSET_NAME", width: 300, type: "text", options: { disabled: true } },
                            { display: "设备类型", name: "TYPE_NAME", width: 300, type: "text", options: { disabled: true } },
                            { display: "使用部门", name: "DEPT_NAME", width: 300, type: "text", options: { disabled: true } },
                            { display: "使用人", name: "CARD_USER", width: 300, type: "text", options: { disabled: true } },
                            { display: "责任人", name: "PERSON", width: 300, type: "text", options: { disabled: true } },
                            { display: "资产编号", name: "ASSETNO", width: 300, type: "text", options: { disabled: true } },
                            { display: "型号", name: "ASSET_TYPE", width: 300, type: "text", options: { disabled: true } },
                            { display: "品牌", name: "BRAND", width: 300, type: "text", options: { disabled: true } },

                            { display: "故障发生时间", name: "FAILURE_TIME", width: 300, type: "date", options: { disabled: true }, group: "故障信息" },
                            { display: "故障现象描述", name: "FAILURE_DESCRIBE", width: 1146, type: "textarea", options: { disabled: true } },

                            { display: "申请部门", name: "APPLY_DEPT", width: 300, type: "text", options: { disabled: true }, group: "申请信息" },
                            { display: "申请人", name: "APPLY_USER", width: 300, type: "text", options: { disabled: true } },
                            { display: "申请人联系电话", name: "APPLY_TEL", width: 300, type: "text", options: { disabled: true } },
                            { display: "申请备注", name: "APPLY_MEMO", width: 1146, type: "textarea", options: { disabled: true } },

                            //实际为处理部门ID
                            {
                                display: "处理部门", name: "CHECK_DEPTID", width: 300, type: "select", validate: { required: true }, options: {
                                    type: "select",
                                    data: me.corp,
                                    autocomplete: true,
                                    valueField: "ID",
                                    textField: "TEXT",
                                    onChangeValue: function (input, value, g) {
                                        if (g.selected != undefined) {
                                            $('#CHECK_DEPT').val(g.selected.TEXT ?? '');
                                        }
                                    }
                                }, group: "实施信息"
                            },
                            //实际为处理人ID
                            {
                                display: "处理人", name: "CHECK_USERID", width: 300, type: "select", validate: { required: true }, options: {
                                    type: "select",
                                    data: me.user,
                                    autocomplete: true,
                                    valueField: "ID",
                                    textField: "TEXT",
                                    onChangeValue: function (input, value, g) {
                                        if (g.selected != undefined) {
                                            $('#CHECK_USER').val(g.selected.TEXT ?? '');
                                        }
                                    }
                                }
                            },
                            {
                                display: "开始处理时间", name: "CHECK_BEGIN", width: 300, type: "date", validate: { required: true }, format: "yyyy-MM-dd hh:mm ", options: {
                                    format: "yyyy-MM-dd hh:mm ",
                                    showTime: true
                                }
                            },
                            {
                                display: "结束处理时间", name: "CHECK_END", width: 300, type: "date", validate: { required: true }, format: "yyyy-MM-dd hh:mm ", options: {
                                    format: "yyyy-MM-dd hh:mm ",
                                    showTime: true
                                }
                            },
                            { display: "故障原因", name: "FAILURE_CAUSE", width: 1146, type: "textarea" },
                            { display: "处理方式", name: "CHECK_METH", width: 1146, type: "textarea" },
                            { display: "处理备注", name: "CHECK_MEMO", width: 1146, type: "textarea" },
                            //隐藏
                            { display: "主键", name: "REPORT_ID", width: 300, type: "hidden" },
                            { display: "IT设备ID", name: "ASSET_ID", width: 300, type: "hidden" },
                            { display: "申请部门ID", name: "APPLY_DEPTID", width: 300, type: "hidden" },
                            { display: "申请人ID", name: "APPLY_USERID", width: 300, type: "hidden" },
                            { display: "处理部门", name: "CHECK_DEPT", minWidth: 100, type: "hidden" },
                            { display: "处理人", name: "CHECK_USER", minWidth: 100, type: "hidden" },
                        ]
                    }
                };
            },
            auditing: [],
            user: [],
            reportState: [],
            corp: [],
            dialog: null,
            dialogData: null,
            callback: null,
            sid: null,
            isView: true,
            mainform: null,
            menuNo: getQueryStringByName("MenuNo"),
            formButtons: [],
            orginData: {},
            //成功提示框，当已有提示框未关闭时不会重复弹出
            showSuccessMessage: function (message = '成功') {
                var me = this;
                if (me.showSuccessMessage.isShown) return;
                me.showSuccessMessage.isShown = true;
                LG.showSuccess(message, function () {
                    me.showSuccessMessage.isShown = false;
                });
            },
            //获取下拉框数据
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'Special/AssetReport/ComboxData',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        me.auditing = data.Auditing;
                        me.reportState = data.ReportState;
                        me.user = data.User;
                        me.corp = data.Corp;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            //表单初始化
            setForm: function () {
                var me = this;
                me.config.form.fields.removeNull();
                var $formsearch = $("#mainform")
                //搜索表单应用ligerui样式
                me.mainform = $formsearch.ligerForm({
                    EnterMoveNextControl: true,
                    labelAlign: 'right',
                    space: 3,
                    validate: true,
                    fields: me.config.form.fields,
                    labelWidth: 120,
                    readonly: me.isView,
                    onAfterSetFields: function (g) {
                        me.mainform = g;
                        me.buttons = g.options.buttons;
                    }
                });
                me.setFormDefaultBtn();
            },
            //表单底部按钮
            setFormDefaultBtn: function (cancelCallback, savedCallback) {
                var me = this;
                var buttons = [];
                if (!me.isView) {
                    buttons.push({
                        text: '重置', icon: 'fa fa-undo', onclick: function () {
                            $.ligerDialog.confirm("确定重置数据吗?", function (confirm) {
                                if (confirm) {
                                    //me.loadData();
                                    me.mainform.setData(me.orginData);
                                }
                            });
                        }
                    });
                }
                buttons.push({ text: '关闭', icon: 'fa fa-window-close', onclick: me.close.bind(me) });
                if (!me.isView) buttons.push({
                    text: '保存', icon: 'fa fa-save', onclick: function () {
                        me.save();
                    }.bind(me)
                });

                LG.addFormButtons(buttons);
                me.formButtons = buttons;
            },
            //关闭表单
            close: function () {
                var me = this;
                function inner(callback) {
                    var data = me.mainform.getData();
                    var updateFields = LG.getFormCombChanges(data, me.orginData, true);
                    if (updateFields) {
                        $.ligerDialog.confirm($.ligerDefaults.GridString.isContinueByDataChanged, function (confirm) {
                            if (confirm) {
                                if (callback) callback(2);
                            }
                            else {
                                if (callback) callback(0);
                            }
                        });
                        if (callback) return callback(-1);
                        return false;
                    }
                    if (callback) return callback(1);
                    return true;
                }
                inner(function (status) {
                    if (status > 0) {
                        if (me.dialog) me.dialog.close();
                        if (me.callback) me.callback(false);
                    }
                });
            },
            //保存前验证
            vertifyBeforeSave: function () {
                var me = this;
                var data = me.mainform.getData();
                //验证结束时间在开始时间之后
                if (data.CHECK_BEGIN && data.CHECK_END && data.CHECK_END <= data.CHECK_BEGIN) {
                    LG.showError("结束时间应在开始时间之后");
                    return false;
                }
                return true;
            },
            //保存表单
            save: function () {
                var me = this;
                //未通过验证时停止保存
                if (!me.vertifyBeforeSave()) return;
                if ($.isEmptyObject(LG.getFormCombChanges(me.mainform.getData(), me.orginData, true))) {
                    me.showSuccessMessage('无修改');
                    return;
                }
                if (!me.mainform.valid()) {
                    me.mainform.showInvalid();
                    return;
                }
                function handle(data) {
                    data.GRID = encrypt(data.GRID);
                    data.SEARCH = encrypt(data.SEARCH);
                    data.FORM = encrypt(data.FORM);
                    return data;
                }
                var data = handle(me.mainform.getData());
                var original = handle(me.orginData);

                var changeRow = new Object();
                changeRow["updated"] = [data];
                changeRow["original"] = [original];
                
                LG.ajax({
                    jsToken: true,
                    url: 'Special/AssetReport/Save',
                    loading: '正在保存中...',
                    data: { request: changeRow },
                    success: function (result) {
                        me.showSuccessMessage('保存成功');
                        me.loadData();
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            //表单数据
            loadData: function () {
                var me = this;
                function inner() {
                    var data = me.mainform.getData();
                    me.orginData = data;
                }
                function initializeData(data) {
                    me.mainform.setOrginData(data);
                    inner();
                    //对于修改模式，若处理人无值则设置处理人为当前登录用户，若处理部门无值处理部门为该用户部门
                    if (!me.isView) {
                        data.CHECK_USERID = data.CHECK_USERID ?? window.session.UserID;
                        data.CHECK_USER = data.CHECK_USER ?? window.session.RealName;
                        data.CHECK_DEPTID = data.CHECK_DEPTID ?? window.session.Corp.CorpID;
                        data.CHECK_DEPT = data.CHECK_DEPT ?? window.session.Corp.CName;
                    }
                    me.mainform.setData(data);
                }
                LG.ajax({
                    async: false,
                    url: 'Special/AssetReport/Get',
                    loading: '正在获取中...',
                    data: { id: me.sid },
                    success: function (data, message) {
                        initializeData(data);
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            //初始化
            init: function () {
                var me = this;
                debugger
                if (frameElement && frameElement.dialog) {
                    me.dialog = frameElement.dialog;
                    me.dialogData = me.dialog.get('data');
                    me.callback = me.dialogData.callback;
                    if (me.dialogData.sid != undefined) me.sid = me.dialogData.sid;
                    if (me.dialogData.isView != undefined) me.isView = me.dialogData.isView;
                }

                //获取下拉框数据
                me.loadComboxData();
                //加载基础信息
                me.setConfig();
                me.setForm();
                me.loadData();
                return me;
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>

</html>
