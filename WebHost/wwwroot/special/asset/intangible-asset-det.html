<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title>无形资产登记明细</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%; overflow:auto;">
    <form id="mainform" style="width:97%;">
    </form>
    <script type="text/javascript">
        'use strict';
        var business = {
            setConfig: function () {
                var me = this;
                me.config = {
                    form: {
                        labelwidth: me.formLabelWidth,
                        inputWidth: me.formInputWidth,
                        fields: [
                            {
                                display: "记录状态", name: "AUDITING", width: me.formInputWidth, type: "select", options: {
                                    type: "select",
                                    data: me.Auditing,
                                    disabled: true
                                }
                            },
                            { display: "记录编码", name: "ASSET_CODE", width: me.formInputWidth, type: "text", options: { disabled: true } },
                            { display: "采购日期", name: "PUR_DATE", width: me.formInputWidth, type: "date", validate: { required: true }, options: {} },
                            { display: "资产名称", name: "ASSET_NAME", width: me.formInputWidth, type: "text", validate: { required: true }, options: {} },
                            { display: "资产简称", name: "SHORT_NAME", width: me.formInputWidth, type: "text", validate: { required: true }, options: {} },
                            { display: "版本", name: "VERSION", width: me.formInputWidth, type: "text", options: {} },
                            { display: "序列号", name: "SERIAL_NUM", width: me.formInputWidth, type: "text", options: {} },
                            {
                                display: "使用部门", name: "DEPT_NAME", width: me.formInputWidth, type: "select", validate: { required: true }, options: {
                                    type: "select",
                                    data: me.Corp,
                                    autocomplete: true,
                                    valueField: "TEXT",
                                    textField: "TEXT",
                                    onChangeValue: function (input, value, g) {
                                        if (g.selected != undefined) {
                                            $('#DEPT_ID').val(g.selected.ID ?? '');
                                        }
                                    }
                                }
                            },
                            { display: "许可数量", name: "LICENSE_NUM", width: me.formInputWidth, type: "int", options: {} },
                            {
                                display: "产品类型", name: "PRODUCT_TYPE", width: me.formInputWidth, type: "select", options: {
                                    type: "select",
                                    data: me.AssetProductType
                                }
                            },
                            {
                                display: "管理人", name: "MANAGER_USER", width: me.formInputWidth, type: "select", options: {
                                    type: "select",
                                    data: me.User,
                                    autocomplete: true,
                                    valueField: "TEXT",
                                    textField: "TEXT",
                                    onChangeValue: function (input, value, g) {
                                        if (g.selected != undefined) {
                                            $('#MANAGER_USERID').val(g.selected.ID ?? '');
                                        }
                                    }
                                }
                            },
                            {
                                display: "编辑人", name: "MODIFY_USERID", width: me.formInputWidth, type: "select", options: {
                                    type: "select",
                                    data: me.User,
                                    disabled: true
                                }
                            },
                            { display: "备注", name: "MEMO", newline: true, width: me.getTextareaWidth(), type: "textarea", options: {} },
                            //隐藏
                            { display: "主键", name: "ASSET_ID", type: "hidden" },
                            { display: "是否有形资产", name: "IS_TANGIBLE", type: "hidden" },
                            { display: "使用部门ID", name: "DEPT_ID", type: "hidden" },
                            { display: "管理人ID", name: "MANAGER_USERID", type: "hidden" }
                        ]
                    }
                };
            },
            Auditing: [],
            User: [],
            AssetProductType: [],
            Corp: [],
            dialog: null,
            dialogData: null,
            callback: null,
            sid: null,
            isNew: false,
            isView: true,
            mainform: null,
            menuNo: getQueryStringByName("MenuNo"),
            formButtons: [],
            formLabelWidth: 120,
            formInputWidth: 180,
            getTextareaWidth: function () {
                var me = this;
                var fieldWidth = me.formLabelWidth + me.formInputWidth + 3;
                return Math.floor(($("#mainform").width() - 10) / fieldWidth) * fieldWidth - (me.formLabelWidth + 3);
            },
            //获取下拉框数据
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'Special/AssetCard/ComboxData',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        me.Auditing = data.Auditing;
                        me.User = data.User;
                        me.AssetProductType = data.AssetProductType;
                        me.Corp = data.Corp;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            //表单初始化
            setForm: function () {
                var me = this;
                me.config.form.fields.removeNull();
                var $formsearch = $("#mainform")
                //搜索表单应用ligerui样式
                me.mainform = $formsearch.ligerForm({
                    labelWidth: me.formLabelWidth,
                    inputWidth: me.formInputWidth,
                    EnterMoveNextControl: true,
                    labelAlign: 'right',
                    space: 3,
                    validate: true,
                    fields: me.config.form.fields,
                    readonly: me.isView,
                    onAfterSetFields: function (g) {
                        me.mainform = g;
                        me.buttons = g.options.buttons;
                    }
                });
                me.setFormDefaultBtn();
            },
            //表单底部按钮
            setFormDefaultBtn: function (cancelCallback, savedCallback) {
                var me = this;
                var buttons = [];
                if (!me.isView) {
                    buttons.push({
                        text: '重置', icon: 'fa fa-undo', onclick: function () {
                            $.ligerDialog.confirm("确定重置数据吗?", function (confirm) {
                                if (confirm) {
                                    //me.loadData();
                                    me.mainform.setData(me.mainform.getOrginData());
                                }
                            });
                        }
                    });
                }
                buttons.push({ text: '关闭', icon: 'fa fa-window-close', onclick: me.close.bind(me) });
                if (!me.isView) buttons.push({
                    text: '保存', icon: 'fa fa-save', onclick: function () {
                        me.save();
                    }.bind(me)
                });

                LG.addFormButtons(buttons);
                me.formButtons = buttons;
            },
            //关闭表单
            close: function () {
                var me = this;
                function inner(callback) {
                    var data = me.mainform.getData();
                    var updateFields = LG.getFormCombChanges(data, me.mainform.getOrginData(), true);
                    if (updateFields) {
                        $.ligerDialog.confirm($.ligerDefaults.GridString.isContinueByDataChanged, function (confirm) {
                            if (confirm) {
                                if (callback) callback(2);
                            }
                            else {
                                if (callback) callback(0);
                            }
                        });
                        if (callback) return callback(-1);
                        return false;
                    }
                    if (callback) return callback(1);
                    return true;
                }
                inner(function (status) {
                    if (status > 0) {
                        if (me.dialog) me.dialog.close();
                        if (me.callback) me.callback(false);
                    }
                });
            },
            //保存表单
            save: function () {
                var me = this;
                if ($.isEmptyObject(me.mainform.getChanges())) {
                    LG.showSuccess('无修改');
                    return;
                }
                if (!me.mainform.valid()) {
                    me.mainform.showInvalid();
                    return;
                }
                function handle(data) {
                    data.GRID = encrypt(data.GRID);
                    data.SEARCH = encrypt(data.SEARCH);
                    data.FORM = encrypt(data.FORM);
                    return data;
                }
                var data = handle(me.mainform.getData());
                var original = handle(me.mainform.getOrginData());

                var changeRow = new Object();
                if (me.isNew) {
                    changeRow["added"] = [data];
                }
                else {
                    changeRow["updated"] = [data];
                    changeRow["original"] = [original];
                }
                LG.ajax({
                    jsToken: true,
                    url: 'Special/AssetCard/Save',
                    loading: '正在保存中...',
                    data: { request: changeRow },
                    success: function (result) {
                        LG.showSuccess('保存成功');
                        //保存过一次后自动变为修改模式
                        me.isNew = false;
                        me.loadData();
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            //表单数据
            loadData: function () {
                var me = this;
                if (me.isNew) {
                    //设置主键，设置记录状态的初值为未提交，设置为无形资产
                    //设置编辑人为当前登录用户，设置使用部门为登录用户部门
                    me.mainform.setData({
                        ASSET_ID: me.sid,
                        AUDITING: "0",
                        IS_TANGIBLE: "0",
                        MODIFY_USERID: window.session.UserID,
                        DEPT_ID: window.session.Corp.CorpID,
                        DEPT_NAME: window.session.Corp.CName
                    });
                    me.mainform.setOrginData(me.mainform.getData());
                }
                else {
                    LG.ajax({
                        async: false,
                        url: 'Special/AssetCard/Get',
                        loading: '正在获取中...',
                        data: { id: me.sid },
                        success: function (data, message) {
                            me.mainform.setOrginData(data);
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }
            },
            //初始化
            init: function () {
                var me = this;
                if (frameElement && frameElement.dialog) {
                    me.dialog = frameElement.dialog;
                    me.dialogData = me.dialog.get('data');
                    me.callback = me.dialogData.callback;
                    if (me.dialogData.sid != undefined) me.sid = me.dialogData.sid;
                    if (me.dialogData.isNew != undefined) me.isNew = me.dialogData.isNew;
                    if (me.dialogData.isView != undefined) me.isView = me.dialogData.isView;

                    //对于新增对话框，先生成并获取主键
                    if (me.isNew) {
                        LG.ajax({
                            async: false,
                            url: 'Common/General/CreatePrimaryKey',
                            loading: '正在获取中...',
                            data: {},
                            success: function (data, message) {
                                me.sid = data;
                            },
                            error: function (message) {
                                LG.showError(message);
                            }
                        });
                    }
                }

                //获取下拉框数据
                me.loadComboxData();
                //加载基础信息
                me.setConfig();
                me.setForm();
                me.loadData();
                return me;
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>

</html>
