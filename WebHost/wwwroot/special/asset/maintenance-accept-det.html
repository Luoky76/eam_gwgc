<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title>维修验收</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%; overflow:auto;">
    <form id="mainform" style="width:97%; margin-bottom: 50px;">
    </form>
    <script type="text/javascript">
        'use strict';
        var business = {
            setConfig: function () {
                var me = this;
                me.config = {
                    form: {
                        labelwidth: me.formLabelWidth,
                        inputWidth: me.formInputWidth,
                        fields: [
                            {
                                display: "验收状态", name: "AUDITING_ACCEPT", width: me.formInputWidth, type: "select", options: {
                                    type: "select",
                                    data: me.accept,
                                    disabled: true
                                }, group: "基础信息"
                            },
                            { display: "维修申请单号", name: "APPLY_CODE", width: me.formInputWidth, type: "text", options: { disabled: true } },
                            {
                                display: "修复状态", name: "REPORT_STATE", width: me.formInputWidth, type: "select", validate: { required: true }, options: {
                                    type: "select",
                                    data: me.reportState,
                                    disabled: true
                                }
                            },

                            { display: "设备编码", name: "ASSET_CODE", width: me.formInputWidth, type: "text", options: { disabled: true }, group: "设备信息" },
                            { display: "设备名称", name: "ASSET_NAME", width: me.formInputWidth, type: "text", options: { disabled: true } },
                            { display: "设备类型", name: "TYPE_NAME", width: me.formInputWidth, type: "text", options: { disabled: true } },
                            { display: "使用部门", name: "DEPT_NAME", width: me.formInputWidth, type: "text", options: { disabled: true } },
                            { display: "使用人", name: "CARD_USER", width: me.formInputWidth, type: "text", options: { disabled: true } },
                            { display: "责任人", name: "PERSON", width: me.formInputWidth, type: "text", options: { disabled: true } },
                            { display: "资产编号", name: "ASSETNO", width: me.formInputWidth, type: "text", options: { disabled: true } },
                            { display: "型号规格", name: "ASSET_SIZE", width: me.formInputWidth, type: "text", options: { disabled: true } },
                            { display: "品牌、厂家", name: "PRODUCE", width: me.formInputWidth, type: "text", options: { disabled: true } },

                            { display: "故障发生时间", name: "FAILURE_TIME", width: me.formInputWidth, type: "text", options: { disabled: true }, group: "故障信息" },
                            { display: "故障现象描述", name: "FAILURE_DESCRIBE", width: me.getTextareaWidth(), type: "textarea", options: { disabled: true } },

                            { display: "申请提交时间", name: "APPLY_DATE", width: me.formInputWidth, type: "text", options: { disabled: true }, group: "申请信息" },
                            { display: "申请部门", name: "APPLY_DEPT", width: me.formInputWidth, type: "text", options: { disabled: true } },
                            { display: "申请人", name: "APPLY_USER", width: me.formInputWidth, type: "text", options: { disabled: true } },
                            { display: "申请人联系电话", name: "APPLY_TEL", width: me.formInputWidth, type: "text", options: { disabled: true } },
                            { display: "申请备注", name: "APPLY_MEMO", width: me.getTextareaWidth(), type: "textarea", options: { disabled: true } },

                            { display: "实施提交时间", name: "CHECK_DATE", width: me.formInputWidth, type: "text", options: { disabled: true }, group: "实施信息" },
                            { display: "处理部门", name: "CHECK_DEPT", width: me.formInputWidth, type: "text", options: { disabled: true } },
                            { display: "处理人", name: "CHECK_USER", width: me.formInputWidth, type: "text", options: { disabled: true } },
                            { display: "开始处理时间", name: "CHECK_BEGIN", width: me.formInputWidth, type: "text", options: { disabled: true } },
                            { display: "结束处理时间", name: "CHECK_END", width: me.formInputWidth, type: "text", options: { disabled: true } },
                            { display: "故障原因", name: "FAILURE_CAUSE", width: me.getTextareaWidth(), type: "textarea", options: { disabled: true } },
                            { display: "处理方式", name: "CHECK_METH", width: me.getTextareaWidth(), type: "textarea", options: { disabled: true } },
                            { display: "处理备注", name: "CHECK_MEMO", width: me.getTextareaWidth(), type: "textarea", options: { disabled: true } },

                            { display: "委外提交时间", name: "OUTSOURCE_DATE", width: me.formInputWidth, type: "text", options: { disabled: true }, group: "委外信息" },
                            {
                                display: "是否在保修期内", name: "IS_UNDER_WARRANTY", width: me.formInputWidth, type: "select", options: {
                                    type: "select",
                                    data: me.yesOrNo,
                                    disabled: true
                                }
                            },
                            { display: "供应商", name: "PROVIDER", width: me.formInputWidth, type: "text", options: { disabled: true } },
                            { display: "供应商联系电话", name: "PROVIDER_TEL", width: me.formInputWidth, type: "text", options: { disabled: true } },
                            { display: "委外备注", name: "OUTSOURCE_MEMO", width: me.getTextareaWidth(), type: "textarea", options: { disabled: true } },

                            { display: "验收时间", name: "ACCEPT_DATE", width: me.formInputWidth, type: "text", options: { disabled: true }, group: "验收信息" },
                            { display: "验收情况", name: "ACCEPT_DESC", width: me.formInputWidth, type: "text", options: {} },
                            {
                                display: "验收评价", name: "ACCEPT_APPRAISE", width: me.formInputWidth, type: "select", validate: { required: true }, options: {
                                    type: "select",
                                    data: me.appraise
                                }
                            },
                            //隐藏
                            { display: "主键", name: "REPORT_ID", width: me.formInputWidth, type: "hidden" },
                        ]
                    }
                };
            },
            accept: [{ ID: "0", TEXT: "未验收" }, { ID: "1", TEXT: "已验收" }],
            yesOrNo: [{ ID: "0", TEXT: "否" }, { ID: "1", TEXT: "是" }],
            appraise: [],
            reportState: [],
            dialog: null,
            dialogData: null,
            callback: null,
            sid: null,
            isView: true,
            mainform: null,
            menuNo: getQueryStringByName("MenuNo"),
            formButtons: [],
            orginData: {},
            formLabelWidth: 120,
            formInputWidth: 180,
            getTextareaWidth: function () {
                var me = this;
                var fieldWidth = me.formLabelWidth + me.formInputWidth + 3;
                return Math.floor(($("#mainform").width() - 10) / fieldWidth) * fieldWidth - (me.formLabelWidth + 3);
            },
            //获取下拉框数据
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'Special/AssetReport/ComboxData',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        me.reportState = data.ReportState;
                        me.appraise = data.Appraise;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            //表单初始化
            setForm: function () {
                var me = this;
                me.config.form.fields.removeNull();
                //若不是委外维修，则删除委外维修字段
                if (me.orginData.REPORT_STATE != "4") {
                    me.config.form.fields.splice(27, 5);
                }

                var $formsearch = $("#mainform")
                //搜索表单应用ligerui样式
                me.mainform = $formsearch.ligerForm({
                    EnterMoveNextControl: true,
                    labelAlign: 'right',
                    space: 3,
                    validate: true,
                    fields: me.config.form.fields,
                    labelWidth: me.formLabelWidth,
                    inputWidth: me.formInputWidth,
                    readonly: me.isView,
                    onAfterSetFields: function (g) {
                        me.mainform = g;
                        me.buttons = g.options.buttons;
                    }
                });
                me.setFormDefaultBtn();
                me.mainform.setOrginData(me.orginData);
            },
            //表单底部按钮
            setFormDefaultBtn: function (cancelCallback, savedCallback) {
                var me = this;
                var buttons = [];
                if (!me.isView) {
                    buttons.push({
                        text: '重置', icon: 'fa fa-undo', onclick: function () {
                            $.ligerDialog.confirm("确定重置数据吗?", function (confirm) {
                                if (confirm) {
                                    //me.loadData();
                                    me.mainform.setData(me.orginData);
                                }
                            });
                        }
                    });
                }
                buttons.push({ text: '关闭', icon: 'fa fa-window-close', onclick: me.close.bind(me) });
                if (!me.isView) buttons.push({
                    text: '保存', icon: 'fa fa-save', onclick: function () {
                        me.save();
                    }.bind(me)
                });

                LG.addFormButtons(buttons);
                me.formButtons = buttons;
            },
            //关闭表单
            close: function () {
                var me = this;
                function inner(callback) {
                    var data = me.mainform.getData();
                    var updateFields = LG.getFormCombChanges(data, me.orginData, true);
                    if (updateFields) {
                        $.ligerDialog.confirm($.ligerDefaults.GridString.isContinueByDataChanged, function (confirm) {
                            if (confirm) {
                                if (callback) callback(2);
                            }
                            else {
                                if (callback) callback(0);
                            }
                        });
                        if (callback) return callback(-1);
                        return false;
                    }
                    if (callback) return callback(1);
                    return true;
                }
                inner(function (status) {
                    if (status > 0) {
                        if (me.dialog) me.dialog.close();
                        if (me.callback) me.callback(false);
                    }
                });
            },
            //保存表单
            save: function () {
                var me = this;
                if ($.isEmptyObject(LG.getFormCombChanges(me.mainform.getData(), me.orginData, true))) {
                    LG.showSuccess('无修改');
                    return;
                }
                if (!me.mainform.valid()) {
                    me.mainform.showInvalid();
                    return;
                }
                function handle(data) {
                    data.GRID = encrypt(data.GRID);
                    data.SEARCH = encrypt(data.SEARCH);
                    data.FORM = encrypt(data.FORM);
                    return data;
                }
                var data = handle(me.mainform.getData());
                var original = handle(me.orginData);

                var changeRow = new Object();
                changeRow["updated"] = [data];
                changeRow["original"] = [original];

                LG.ajax({
                    jsToken: true,
                    url: 'Special/AssetReport/Save',
                    loading: '正在保存中...',
                    data: { request: changeRow },
                    success: function (result) {
                        LG.showSuccess('保存成功');
                        me.loadData();
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            //表单数据
            loadData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'Special/AssetReport/Get',
                    loading: '正在获取中...',
                    data: { id: me.sid },
                    success: function (data, message) {
                        me.orginData = data;
                        if (me.mainform) me.mainform.setOrginData(data);
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            //初始化
            init: function () {
                var me = this;
                if (frameElement && frameElement.dialog) {
                    me.dialog = frameElement.dialog;
                    me.dialogData = me.dialog.get('data');
                    me.callback = me.dialogData.callback;
                    if (me.dialogData.sid != undefined) me.sid = me.dialogData.sid;
                    if (me.dialogData.isView != undefined) me.isView = me.dialogData.isView;
                }

                //获取下拉框数据
                me.loadComboxData();
                //加载基础信息
                me.setConfig();

                //特殊处理，先获取数据，然后根据数据决定显示的字段
                me.loadData();
                me.setForm();
                return me;
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>

</html>
