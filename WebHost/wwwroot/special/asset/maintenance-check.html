<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title>维修实施</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 2px; height: 100%;">
    <div id="layout">
        <div position="center" title="">
            <div id="mainsearch">
                <form action="" id="formsearch" class="l-form">
                </form>
            </div>
            <div id="iframeloading" class='l-loading' style="display:none;">
            </div>
            <form id="mainform">
                <div id="maingrid" style="margin: 2px;"></div>
            </form>
        </div>
    </div>
    <script type="text/javascript">
        'use strict';
        var business = {
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            {
                                display: "修复状态", name: "_search_DEPT_NAME", dbname: "REPORT_STATE", type: "select", options: {
                                    type: "select",
                                    data: me.reportState
                                }
                            },
                            { display: "设备名称", name: "_search_ASSET_NAME", dbname: "ASSET_NAME", type: "text" },
                            { display: "设备类型", name: "_search_TYPE_NAME", dbname: "TYPE_NAME", type: "text" }
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "已提交", name: "AUDITING_CHECK", minWidth: 100, type: "chk" },
                            { display: "维修申请单号", name: "APPLY_CODE", minWidth: 100, type: "text" },
                            {
                                display: "修复状态", name: "REPORT_STATE", minWidth: 100, type: "select", editor: {
                                    type: "select",
                                    data: me.reportState,
                                    disabled: true
                                }
                            },
                            { display: "设备编码", name: "ASSET_CODE", minWidth: 100, type: "text" },
                            { display: "设备名称", name: "ASSET_NAME", minWidth: 100, type: "text" },
                            { display: "设备类型", name: "TYPE_NAME", minWidth: 100, type: "text" },
                            { display: "故障现象描述", name: "FAILURE_DESCRIBE", minWidth: 100, type: "text" },
                            { display: "申请提交时间", name: "APPLY_DATE", minWidth: 100, type: "date" },
                            { display: "申请人", name: "APPLY_USER", minWidth: 100, type: "text" },
                            { display: "申请人联系电话", name: "APPLY_TEL", minWidth: 100, type: "text" },
                            { display: "处理部门", name: "CHECK_DEPT", minWidth: 100, type: "text" },
                            { display: "处理人", name: "CHECK_USER", minWidth: 100, type: "text" },
                            { display: "实施提交时间", name: "CHECK_DATE", minWidth: 100, type: "date" },
                            { display: "故障原因", name: "FAILURE_CAUSE", minWidth: 100, type: "text" },
                            { display: "处理方式", name: "CHECK_METH", minWidth: 100, type: "text" },
                            { display: "处理备注", name: "CHECK_MEMO", minWidth: 100, type: "text" },
                            //隐藏
                            { display: "主键", name: "REPORT_ID", minWidth: 100, type: "text", hide: true },
                            { display: "委外维修已提交", name: "AUDITING_OUTSOURCE", minWidth: 100, type: "chk", hide: true },
                            { display: "已验收", name: "AUDITING_ACCEPT", minWidth: 100, type: "chk", hide: true },
                            { display: "IT设备ID", name: "ASSET_ID", minWidth: 100, type: "text", hide: true },
                            { display: "申请部门ID", name: "APPLY_DEPTID", minWidth: 100, type: "text", hide: true },
                            { display: "申请人ID", name: "APPLY_USERID", minWidth: 100, type: "long", hide: true },
                            { display: "资产编号", name: "ASSETNO", minWidth: 100, type: "text", hide: true },
                            { display: "型号规格", name: "ASSET_SIZE", minWidth: 100, type: "text", hide: true },
                            { display: "品牌、厂家", name: "PRODUCE", minWidth: 100, type: "text", hide: true },
                            { display: "申请备注", name: "APPLY_MEMO", minWidth: 100, type: "text", hide: true },
                            { display: "故障发生时间", name: "FAILURE_TIME", minWidth: 100, type: "date", hide: true },
                            { display: "使用部门", name: "DEPT_NAME", minWidth: 100, type: "text", hide: true },
                            { display: "使用人", name: "CARD_USER", minWidth: 100, type: "text", hide: true },
                            { display: "责任人", name: "PERSON", minWidth: 100, type: "text", hide: true },
                            { display: "申请部门", name: "APPLY_DEPT", minWidth: 100, type: "text", hide: true },
                            { display: "处理部门ID", name: "CHECK_DEPTID", minWidth: 100, type: "text", hide: true },
                            { display: "处理人ID", name: "CHECK_USERID", minWidth: 100, type: "long", hide: true },
                            { display: "开始处理时间", name: "CHECK_BEGIN", minWidth: 100, type: "date", hide: true },
                            { display: "结束处理时间", name: "CHECK_END", minWidth: 100, type: "date", hide: true },
                        ]
                    }
                };
            },
            //明细页面大小
            detailWidth: null,
            detailHeight: null,
            setDialogSize: function () {
                var me = this;
                me.detailWidth = window.innerWidth * 0.9;
                me.detailHeight = window.innerHeight * 0.9;
            },
            menuNo: getQueryStringByName("MenuNo"),
            grid: null,
            searchForm: null,
            buttons: null,
            user: [],
            reportState: [],
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'Special/AssetReport/Comboxdata',
                    loading: '正在获取中...',
                    success: function (data) {
                        me.user = data.User;
                        me.reportState = data.ReportState;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    autoWidth: true,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    usePager: false,
                    dataAction: 'server',
                    toolbar: {},
                    url: 'Special/AssetReport/CheckList',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: 'REPORT_ID',
                    sortOrder: 'dsc',
                    width: '98%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: true,
                    clickToEdit: true,
                    onBeforeEdit: function (editParm) {
                        switch (editParm.column.name) {
                            case "":
                                if (editParm.record.__status == "add") return true;
                                else return false;
                                break;
                        }
                    },
                    onSuccess: function (data, g) {
                        if (data && data.Rows) {
                            var rows = data.Rows || [];
                            for (var i = 0, len = rows.length; i < len; i++) {
                                var row = rows[i];
                                row.OLDROLEID = row.ROLEID;
                            }
                        }
                    },
                    rowAttrRender: function (rowdata, rowid) {
                        return "";
                    },
                    onDblClickRow: function (data, rowid, rowdata) {
                        me.view(rowid);
                    }
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            isSelectRow: function () {
                var me = this;
                var rows = me.grid.getSelectedRows();
                if (rows.length == 0) {
                    LG.tip("请选择一行");
                    return false;
                }
                return true;
            },
            isSelectSingleRow: function () {
                var me = this;
                var rows = me.grid.getSelectedRows();
                if (rows.length > 1) {
                    LG.tip("不能选择多行");
                    return false;
                } else if (rows.length == 0) {
                    LG.tip("请选择一行");
                    return false;
                }
                return true;
            },
            isAudited: function () {
                var me = this;
                var selecteds = me.grid.getSelectedRows();
                for (let row of selecteds) {
                    if (row.AUDITING == "1") {
                        LG.tip("有数据已提交，无法变更！");
                        return true;
                    }
                }
                return false;
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "modify":
                            if (!me.isSelectSingleRow() || me.isAudited()) break;
                            me.modify();
                            break;
                        case "submit":
                            if (!me.isSelectRow() || me.isAudited()) break;
                            $.ligerDialog.confirm("提交后不可修改，是否继续？", function (confirm) {
                                if (confirm) {
                                    me.submit();
                                }
                            });
                            break;
                        case "revoke":
                            if (!me.isSelectSingleRow()) break;
                            me.revoke();
                            break;
                        case "Excel":
                            $.ligerDialog.open({
                                url: "../System/Export.html?exporttype=xls",
                                modal: true
                            });
                            break;
                        case "Word":
                            $.ligerDialog.open({
                                url: "../System/Export.html?exporttype=doc",
                                modal: true
                            });
                            break;
                    }
                }
                //仅加载group为main的按钮
                me.grid.toolbarManager.options.group = 'main';
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            view: function () { //查看
                var me = this;
                var selected = me.grid.getSelectedRow();
                if (!selected) {
                    LG.tip('请选择行!');
                    return;
                }
                $.ligerDialog.open({
                    width: me.detailWidth,
                    height: me.detailHeight,
                    allowClose: true,
                    title: '[查看]维修实施',
                    url: "maintenance-check-det.html?MenuNo=" + me.menuNo,
                    isHidden: false,
                    showMax: false,
                    showToggle: false,
                    showMin: false,
                    isResize: true,
                    slide: false,
                    onClosed: me.reload.bind(me),
                    data: { "sid": selected.REPORT_ID, "isNew": false, "isView": true }
                });
            },
            modify: function () { //修改
                var me = this;
                var selected = me.grid.getSelectedRow();
                $.ligerDialog.open({
                    width: me.detailWidth,
                    height: me.detailHeight,
                    allowClose: true,
                    title: '[修改]维修实施',
                    url: "maintenance-check-det.html?MenuNo=" + me.menuNo,
                    isHidden: false,
                    showMax: false,
                    showToggle: false,
                    showMin: false,
                    isResize: true,
                    slide: false,
                    onClosed: me.reload.bind(me),
                    data: { "sid": selected.REPORT_ID, "isNew": false, "isView": false }
                });
            },
            submit: function () { //提交
                var me = this;
                var selecteds = me.grid.getSelectedRows();
                if (selecteds) {
                    var updatedarr = [];
                    var orginarr = [];
                    for (var i = 0; i < selecteds.length; i++) {
                        var ori = JSON.parse(JSON.stringify(selecteds[i]));
                        var upd = JSON.parse(JSON.stringify(selecteds[i]));
                        upd.AUDITING_CHECK = "1";
                        //记录提交时间
                        upd.CHECK_DATE = new Date().toJSON();
                        orginarr.push(ori);
                        updatedarr.push(upd)
                    }
                    var changeRow = new Object();
                    changeRow["updated"] = updatedarr;
                    changeRow["original"] = orginarr;
                    LG.ajax({
                        jsToken: true,
                        url: 'Special/AssetReport/Save',
                        loading: '正在提交中...',
                        data: changeRow,
                        success: function () {
                            LG.showSuccess('提交成功');
                            me.grid.isDataChanged = false;
                            me.reload();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }
            },
            revoke: function () { //撤销提交
                var me = this;
                var selected = me.grid.getSelectedRow();
                var updatedarr = [];
                var orginarr = [];
                var ori = JSON.parse(JSON.stringify(selected));
                var upd = JSON.parse(JSON.stringify(selected));
                if (ori.AUDITING_CHECK == "0") {
                    LG.tip("未提交数据无需撤销！");
                    return;
                }
                else if (selected.AUDITING_OUTSOURCE == "1") {
                    LG.tip("委外维修已提交，无法撤销！");
                    return;
                }
                else if (selected.AUDITING_ACCEPT == "1") {
                    LG.tip("维修已验收，无法撤销！");
                    return;
                }
                else {
                    upd.AUDITING_CHECK = "0";
                    orginarr.push(ori);
                    updatedarr.push(upd)
                }
                var changeRow = new Object();
                changeRow["updated"] = updatedarr;
                changeRow["original"] = orginarr;
                LG.ajax({
                    jsToken: true,
                    url: 'Special/AssetReport/Save',
                    loading: '正在撤销中...',
                    data: changeRow,
                    success: function () {
                        LG.showSuccess('撤销成功');
                        me.grid.isDataChanged = false;
                        me.reload();
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            reload: function () { //刷新
                var me = this;
                me.grid.loadData();
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Word',
                        text: '导出Word',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-word-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch = $("#formsearch")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    EnterMoveNextControl: true,
                    space: 3,
                    labelAlign: 'right',
                    labelWidth: 82,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                    }
                });
            },
            init: function () {
                debugger
                var me = this;
                me.setDialogSize();
                me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.setGrid();
                me.reload();
                return me;
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>
</html>
