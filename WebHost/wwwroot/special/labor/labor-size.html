
<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title>劳保人员尺码明细</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <form id="mainform">
    </form>
    <div id="maingrid">
    </div>
    <script type="text/javascript">
        'use strict';
        var business = {
            dialogData: {},
            isView: true,
           
            sid: getQueryStringByName("sid"),
            menuNo: getQueryStringByName("MenuNo"),
            dataCorp: [],
            setConfig: function () {
                var me = this;
                me.config = {
                    grid: {
                        columns: [
                            { display: "类型编码", name: "TYPE_CODE", width: 150, minWidth: 150, type: "text" },
                            { display: "类型名称", name: "TYPE_NAME", width: 400, minWidth: 400, type: "text" },
                            {
                                display: "USER_ID", name: "USER_ID", width: 150, hide: true, minWidth: 150, type: "text", render: function () {
                                    return me.sid;
                                } },
                            { display: "尺码", name: "SIZE_NAME", width: 60, minWidth: 60, type: "text", editor: { type: "float" } },
                            
                        ]
                    },
                };
            },
            auditing: [],
            user: [],
            mainform: null,
            grid: null,
            buttons: null,
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'special/labor/comboxdata',
                    loading: '正在获取中...',
                    success: function (data) {
                        me.auditing = data.Auditing;
                        me.user = data.User;
                        me.rentstate = data.RentState
                        me.dataCorp = data.Corp;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            loadData: function () {
                var me = this;
               
                    LG.ajax({
                        async: false,
                        url: 'special/labor/LaborSizeList',
                        loading: '正在获取中...',
                        data: { userID: me.sid },
                        success: function (data, message) {
                            me.grid.loadData(data);
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                  
            },
            save: function () { //保存
                var me = this;
                var gridEdit = false;
                if (me.grid.endEdit() != false) {
                    if (!me.grid.isDataChanged) {
                        gridEdit = false;
                    }
                    else gridEdit = true;
                }
                if (!me.grid.validChangeRows()) return false;
                function handle(data) {
                    return data;
                }

                if ( gridEdit) {
                 
                    var changeRowDet = me.grid.getChangedRows();
                    for (let key in changeRowDet) {
                        if (changeRowDet[key]) {
                            for (var i = 0; i < changeRowDet[key].length; i++) {
                                changeRowDet[key][i].USER_ID = me.sid;
                            }
                        }
                       
                     

                    }


                    LG.ajax({
                        jsToken: true,
                        url: 'special/labor/SaveSize',
                        loading: '正在保存中...',
                        data: { request: changeRowDet },
                        success: function () {
                            LG.showSuccess('保存成功', function () {
                                location.reload(true);
                            });
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }
                else { LG.showSuccess('无修改'); }
            },
            delete: function () { //删除
                var me = this;
                if (me.grid.endEdit() != false) {
                    var selected = me.grid.getSelectedRows();
                  
                    if (selected.length > 0) {
                        $.ligerDialog.confirm('确定删除吗?', function (confirm) {
                            if (confirm) {
                                me.grid.deleteSelectedRow();
                                me.save();
                            }
                        });
                    } else {
                        LG.tip('请选择行!');
                    }
                }
            },
            //导入库存
            import: function () {
                var me = this;
                var gridData = me.grid.getData();
                var gridKeys = [];
                for (var item of gridData) {
                    gridKeys.push(item.SP_CODE);
                }
                var dataOptions = {
                    values: gridKeys,
                    options: {
                        url: 'special/labor/LaborUserCataLogList?code=suit',
                        rowKey: "STORE_ID",
                        columns: [
                            { display: "物资编码", name: "SP_CODE", minWidth: 100, type: "text", },
                            { display: "物资名称", name: "SP_NAME", minWidth: 300, type: "text", },
                            { display: "规格/型号", name: "SP_SIZE", minWidth: 200, type: "text", },
                            { display: "库存数量", name: "NUM", minWidth: 100, type: "text" },
                            { display: "计量单位", name: "UNIT", minWidth: 100, type: "text" },
                            { display: "仓库名称", name: "HOUSE_NAME", minWidth: 100, type: "text" },
                            { display: "库位名称", name: "STOCK_NAME", minWidth: 100, type: "text" },
                            { display: "入库日期", name: "IN_DATE", minWidth: 100, type: "date", editor: { format: "yyyy-MM-dd" } },
                            { display: "入库批次号", name: "STORE_CODE", minWidth: 100, type: "text" },
                            { display: "类别名称", name: "TYPE_NAME", minWidth: 100, type: "text" },
                            { display: "来源类型", name: "SRC_TYPE", minWidth: 100, type: "text" }
                        ]
                    },
                    fields: [
                        { display: "物资编码", name: "SP_CODE", width: 100, type: "text" },
                        { display: "物资名称", name: "SP_NAME", width: 300, type: "text" }
                    ],
                    callback: function (values, rows) {
                        var currentSet = new Set(gridKeys);
                        for (let item of rows) {
                            if (!currentSet.has(item.SP_CODE)) {
                                me.grid.addEditRow({
                                    TYPE_CODE: item.SP_CODE,
                                    TYPE_NAME: item.SP_NAME,
                                }, true);
                            }
                        }
                    }
                }
                $.ligerDialog.open({
                    width: 1000,
                    height: 400,
                    title: '选择维保项目清单',
                    url: window.gksybConfigs.urlBase + "popup-select/common.html",
                    isResize: true,
                    slide: false,
                    data: dataOptions
                });
            },
            close: function (skipConfirm) {
                var me = this;
                function inner(callback) {
                    if (!skipConfirm && !$.isEmptyObject(me.mainform.getChanges())) {
                        $.ligerDialog.confirm($.ligerDefaults.GridString.isContinueByDataChanged, function (confirm) {
                            if (confirm) {
                                if (callback) callback(2);
                            }
                            else {
                                if (callback) callback(0);
                            }
                        });
                        if (callback) return callback(-1);
                        return false;
                    }
                    if (callback) return callback(1);
                    return true;
                }
                inner(function (status) {
                    if (status > 0) {
                        if (me.dialog) {
                            me.dialog.close();
                            return;
                        }
                        var win = parent || window;
                        if (win.closeCurrentTab) win.closeCurrentTab();
                        else win.close();
                    }
                });
            },
            //setFormDefaultBtn: function () {
            //    var me = this;
            //    //表单底部按钮
            //    var buttons = [];
            //    /*if (!me.isView) {
            //        buttons.push({
            //            text: '重置', onclick: function () {
            //                $.ligerDialog.confirm("确定重置数据吗?", function (confirm) {
            //                    if (confirm) {
            //                        location.reload(true);
            //                    }
            //                });
            //            }
            //        });
            //    }*/
            //    buttons.push({ text: '关闭', onclick: me.close.bind(me) });
            //    if (!me.isView) buttons.push({ text: '保存', onclick: me.save.bind(me) });
            //    LG.addFormButtons(buttons);
            //    me.formButtons = buttons;
            //},
            //setForm: function () {
            //    var me = this;
            //    me.config.form.fields.removeNull();
            //    var $mainform = $("#mainform")
            //    //搜索表单应用ligerui样式
            //    me.mainform = $mainform.ligerForm({
            //        EnterMoveNextControl: true,
            //        labelAlign: 'right',
            //        space: 3,
            //        validate: true,
            //        fields: me.config.form.fields,
            //        labelWidth: 120,
            //        onAfterSetFields: function (g) {
            //            me.mainform = g;
            //            me.buttons = g.options.buttons;
            //        }
            //    });
            //    me.setFormDefaultBtn();
            //},
            //租借明细表
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    dateFormat: "yyyy-MM-dd hh:mm",
                    autoWidth: true,
                    delayLoad: true,
                    usePager: false,
                    validate: true,
                    columns: me.config.grid.columns,
                    dataAction: 'server',
                    toolbar: { group: "size" },
                    url: 'special/labor/LaborSizeList',
                    parms: {
                        userID: me.sid
                    },
                    sortName: 'TYPE_CODE',
                    sortOrder: 'desc',
                    width: '99%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: true,
                    clickToEdit: true,
                    onSuccess: function (data, g) {
                        //me.iframeloading.hide();
                    },
                    async: false
                });
                me.grid.isValid = true;

                me.loadToolbar();
            },
            //明细按钮组
            loadToolbar: function () {
                var me = this;
                me.ToolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "save":
                            me.save();
                            break;
                        case "import":
                            me.import();
                            //me.grid.addEditRow({}, true);
                            break;
                        case "delete":
                            me.delete();
                            break;
                        default:
                            break;
                    }
                }
                //加载collect按钮
                LG.loadToolbar(me.grid, me.ToolbarBtnItemClick);
            },
            init: function () {
                var me = this;
                if (frameElement && frameElement.dialog) {
                    me.dialog = frameElement.dialog;
                    me.dialogData = me.dialog.get('data') || {};
                    if (me.dialogData.callback) me.callback = me.dialogData.callback;
                    if (me.dialogData.sid) me.sid = me.dialogData.sid;
                    if (me.dialogData.isView) me.isView = me.dialogData.isView === "1";
                }
                me.isView = false;
                me.loadComboxData();
                me.setConfig();
                me.setGrid();
                me.loadData();
                return me;
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>

</html>
