            <ul style="display: block; width: 100%;" id="ulGrid">
                <li style=" width: 100%;">
                    <div style="margin-bottom: 50px; width: 100%;" id="plandetgird2">

    </div>


    <script type="text/javascript">
        'use strict';
        var business = {
            dialogData: {},
            isView: true,
            sid: getQueryStringByName("sid"),
            dataCorp: [],
            setConfig: function () {
                var me = this;
                me.config = {
                    form: {
                        fields: [
                            { display: "记录状态", name: "AUDITING", newline: false, upper: true, type: "text", options: {}, group: "基本信息" },
                            { display: "劳保需求单号", name: "REQUEST_CODE", newline: false, upper: true, type: "text", options: {}, group: "基本信息" },
                            { display: "需求分类", name: "REQUEST_SPTYPE", newline: false, upper: true, type: "text", options: {}, group: "基本信息" },
                            { display: "所属年份", name: "REQUEST_YEAR", newline: false, upper: true, type: "text", options: {}, group: "基本信息" },
                            { display: "所属月份", name: "REQUEST_MONTH", newline: false, upper: true, type: "text", options: {}, group: "基本信息" },
                            { display: "申请日期", name: "REQUEST_DATE", newline: false, upper: true, type: "date", options: {}, group: "基本信息" },
                            { display: "申请部门ID", name: "DEPT_ID", newline: false, upper: true, type: "text", options: {}, group: "基本信息" },
                            { display: "申请部门", name: "DEPT_NAME", newline: false, upper: true, type: "text", options: {}, group: "基本信息" },
                            { display: "类别", name: "REQUEST_TYPE", newline: false, upper: true, type: "text", options: {}, group: "基本信息" },
                            { display: "备注", name: "MEMO", newline: false, upper: true, type: "text", options: {}, group: "基本信息" },

                        ],
                        grid: {
                            columns: [
                                { display: "主键", name: "REQUEST_LIST_ID", width: 100, type: "text", editor: { type: 'text' }, hide: true },
                                { display: "需求单ID", name: "REQUEST_ID", width: 100, type: "text", editor: { type: 'text' }, hide: true },
                                { display: "申请部门", name: "DEPT_NAME", width: 100, type: "text", editor: { type: 'text' } },
                                { display: "申请人", name: "USER_NAME", width: 100, type: "text", editor: { type: 'text' } },
                                { display: "人员ID", name: "USER_ID", width: 100, type: "text", editor: { type: 'text' }, hide: true },
                                { display: "部门ID", name: "DEPT_ID", width: 100, type: "text", editor: { type: 'text' }, hide: true },

                                { display: "申请人编码", name: "USER_CODE", width: 100, type: "text", editor: { type: 'text' }, hide: true },
                                { display: "申请部门编码", name: "DEPT_CODE", width: 100, type: "text", editor: { type: 'text' }, hide: true },
                                //{ display: "添加人ID", name: "CREATE_USERID", width: 100, type: "text", editor: { type: 'text' } },
                                //{ display: "添加时间", name: "CREATEDATE", width: 100, type: "date", editor: { type: 'date', showTime: true, format: "yyyy-MM-dd hh:mm" } },
                                //{ display: "修改人ID", name: "MODIFY_USERID", width: 100, type: "text", editor: { type: 'text' } },
                                //{ display: "修改时间", name: "MODIFYDATE", width: 100, type: "date", editor: { type: 'date', showTime: true, format: "yyyy-MM-dd hh:mm" } }
                            ]
                            , columns2: [
                                { display: "物资编码", name: "SP_CODE", width: 100, type: "text", editor: { type: 'text' } },
                                { display: "物资名称", name: "SP_NAME", width: 100, type: "text", editor: { type: 'text' } },
                                { display: "型号规格", name: "SP_SIZE", width: 100, type: "text", editor: { type: 'text' } },
                                { display: "品牌、厂家", name: "PRODUCE", width: 100, type: "text", editor: { type: 'text' } },
                                { display: "申请数量", name: "REQUEST_NUM", width: 100, type: "decimal", editor: { type: 'decimal' } },
                                { display: "计量单位", name: "UNIT", width: 100, type: "text", validate: { required: true }, editor: { type: 'text' } },
                                { display: "用途", name: "PURPOSE", width: 100, type: "text", editor: { type: 'text' } },
                                { display: "制造厂", name: "FACTORY", width: 100, type: "text", editor: { type: 'text' } },
                                { display: "其他编号", name: "OTHER_CODE", width: 100, type: "text", editor: { type: 'text' } },
                                { display: "英文名称", name: "SP_ENGNAME", width: 100, type: "text", editor: { type: 'text' } },
                                { display: "上次申请时间(今年内)", name: "LAST_REQUEST_DATE", width: 100, type: "text", editor: { type: 'text' } },
                                { display: "上次领用时间(今年内)", name: "LAST_OUT_DATE", width: 100, type: "text", editor: { type: 'text' } },
                                { display: "备注", name: "MEMO", width: 100, type: "text", editor: { type: 'text' } },

                                //{ display: "物资状态", name: "SP_STATUS", width: 100, type: "text", editor: { type: 'text' } },
                                //{ display: "代码", name: "SP_DAIMA", width: 100, type: "text", editor: { type: 'text' } },
                                //{ display: "图号/设备", name: "SP_TUHAO", width: 100, type: "text", editor: { type: 'text' } },
                                //{ display: "可领用数量", name: "CAN_OUT_NUM", width: 100, type: "decimal", editor: { type: 'decimal' } },
                                //{ display: "库位ID", name: "STOCK_ID", width: 100, type: "text", editor: { type: 'text' } },
                                //{ display: "物资类别编码", name: "TYPE_CODE", width: 100, type: "text", editor: { type: 'text' } },
                                //{ display: "库位名称", name: "STOCK_NAME", width: 100, type: "text", editor: { type: 'text' } },
                                //{ display: "库位编码", name: "STOCK_CODE", width: 100, type: "text", editor: { type: 'text' } },
                                //{ display: "物资类别名称", name: "TYPE_NAME", width: 100, type: "text", editor: { type: 'text' } },
                                //{ display: "物资类别ID", name: "TYPE_ID", width: 100, type: "text", editor: { type: 'text' } },
                                //{ display: "物资申请人", name: "APPLY_USER", width: 100, type: "text", editor: { type: 'text' } },
                                //{ display: "物资申请人ID", name: "APPLY_USERID", width: 100, type: "text", editor: { type: 'text' } },
                                //{ display: "序号", name: "APPLY_ID", width: 100, type: "text", editor: { type: 'text' } },
                                //{ display: "主键", name: "REQUEST_DET_ID", width: 100, type: "text", editor: { type: 'text' } },
                                //{ display: "物资需求计划ID", name: "REQUEST_ID", width: 100, type: "text", editor: { type: 'text' } },
                                //{ display: "物资品种ID", name: "SP_ID", width: 100, type: "text", editor: { type: 'text' } },
                                //{ display: "添加人ID", name: "CREATE_USERID", width: 100, type: "text", editor: { type: 'text' } },
                                //{ display: "添加时间", name: "CREATEDATE", width: 100, type: "date", editor: { type: 'date', showTime: true, format: "yyyy-MM-dd hh:mm" } },
                                //{ display: "修改人ID", name: "MODIFY_USERID", width: 100, type: "text", editor: { type: 'text' } },
                                //{ display: "修改时间", name: "MODIFYDATE", width: 100, type: "date", editor: { type: 'date', showTime: true, format: "yyyy-MM-dd hh:mm" } },
                                { display: "申请单ID", name: "REQUEST_LIST_ID", width: 100, type: "text", editor: { type: 'text' }, hide: true },
                                //{ display: "部门编码", name: "DEPT_CODE", width: 100, type: "text", editor: { type: 'text' } },
                                //{ display: "部门名称", name: "DEPT_NAME", width: 100, type: "text", editor: { type: 'text' } },
                                //{ display: "人员编号", name: "USER_CODE", width: 100, type: "text", editor: { type: 'text' } },
                                //{ display: "人员名称", name: "USER_NAME", width: 100, type: "text", editor: { type: 'text' } }
                            ]

                        }

                    }
                };
            },
            mainform: null,
            buttons: null,
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'special/Labor/comboxdata',
                    loading: '正在获取中...',
                    success: function (data) {
                        me.dataCorp = data.corpData;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#plandetgird").ligerGrid({
                    autoWidth: true,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    usePager: false,
                    dataAction: 'server',
                    toolbar: {},
                    url: 'special/Labor/laborrequestListList',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: 'SP_STATUS',
                    sortOrder: 'asc',
                    width: '98%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: true,
                    clickToEdit: true,
                    onBeforeEdit: function (editParm) {
                        switch (editParm.column.name) {
                            case "":
                                if (editParm.record.__status == "add") return true;
                                else return false;
                                break;
                        }
                    },
                    onSuccess: function (data, g) {
                        if (data && data.Rows) {
                            var rows = data.Rows || [];
                            for (var i = 0, len = rows.length; i < len; i++) {
                                var row = rows[i];
                                row.OLDROLEID = row.ROLEID;
                            }
                        }
                    },
                    rowAttrRender: function (rowdata, rowid) {
                        return "";
                    }
                });
                me.grid2 = $("#plandetgird2").ligerGrid({
                    autoWidth: true,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    usePager: false,
                    dataAction: 'server',
                    toolbar: {},
                    url: 'special/Labor/laborrequestdet',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: 'SP_STATUS',
                    sortOrder: 'asc',
                    width: '98%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: true,
                    clickToEdit: true,
                    onBeforeEdit: function (editParm) {
                        switch (editParm.column.name) {
                            case "":
                                if (editParm.record.__status == "add") return true;
                                else return false;
                                break;
                        }
                    },
                    onSuccess: function (data, g) {
                        if (data && data.Rows) {
                            var rows = data.Rows || [];
                            for (var i = 0, len = rows.length; i < len; i++) {
                                var row = rows[i];
                                row.OLDROLEID = row.ROLEID;
                            }
                        }
                    },
                    rowAttrRender: function (rowdata, rowid) {
                        return "";
                    }
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },

            loadData: function () {
                var me = this;
                if (!me.sid) {
                    me.mainform.setOrginData({});
                }
                else {
                    LG.ajax({
                        async: false,
                        url: 'LaborRequest/Get',
                        loading: '正在获取中...',
                        data: { id: me.sid },
                        success: function (data, message) {
                            me.mainform.setOrginData(data);
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                    if (me.isView) {
                        me.mainform.setReadonly(true);
                    }
                }
                me.mainform.focus();
            },
            save: function () { //保存
                var me = this;
                if ($.isEmptyObject(me.mainform.getChanges())) {
                    LG.showSuccess('无修改');
                    return;
                }
                if (!me.mainform.valid()) {
                    me.mainform.showInvalid();
                    return;
                }
                function handle(data) {
                    return data;
                }
                var data = handle(me.mainform.getData());
                var original = handle(me.mainform.getOrginData());
                var changeRow = new Object();
                if (!me.sid) {
                    changeRow["added"] = [data];
                }
                else {
                    changeRow["updated"] = [data];
                    changeRow["original"] = [original];
                }
                LG.ajax({
                    jsToken: true,
                    url: 'LaborRequest/Save',
                    loading: '正在保存中...',
                    data: changeRow,
                    success: function () {
                        LG.showSuccess('保存成功', function () {
                            location.reload(true);
                        });
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            close: function () {
                var me = this;
                function inner(callback) {
                    var data = me.mainform.getChanges();
                    if (!$.isEmptyObject(data)) {
                        $.ligerDialog.confirm($.ligerDefaults.GridString.isContinueByDataChanged, function (confirm) {
                            if (confirm) {
                                if (callback) callback(2);
                            }
                            else {
                                if (callback) callback(0);
                            }
                        });
                        if (callback) return callback(-1);
                        return false;
                    }
                    if (callback) return callback(1);
                    return true;
                }
                inner(function (status) {
                    if (status > 0) {
                        if (me.dialog) {
                            me.dialog.close();
                            return;
                        }
                        var win = parent || window;
                        if (win.closeCurrentTab) win.closeCurrentTab();
                        else win.close();
                    }
                });
            },
            setFormDefaultBtn: function () {
                var me = this;
                //表单底部按钮
                var buttons = [];
                if (!me.isView) {
                    buttons.push({
                        text: '重置', onclick: function () {
                            $.ligerDialog.confirm("确定重置数据吗?", function (confirm) {
                                if (confirm) {
                                    location.reload(true);
                                }
                            });
                        }
                    });
                }
                buttons.push({ text: '关闭', onclick: me.close.bind(me) });
                if (!me.isView) buttons.push({ text: '保存', onclick: me.save.bind(me) });
                LG.addFormButtons(buttons);
                me.formButtons = buttons;
            },
            setForm: function () {
                var me = this;
                me.config.form.fields.removeNull();
                var $mainform = $("#mainform")
                //搜索表单应用ligerui样式
                me.mainform = $mainform.ligerForm({
                    EnterMoveNextControl: true,
                    labelAlign: 'right',
                    space: 3,
                    validate: true,
                    fields: me.config.form.fields,
                    labelWidth: 60,
                    onAfterSetFields: function (g) {
                        me.mainform = g;
                        me.buttons = g.options.buttons;
                    }
                });
                me.setFormDefaultBtn();
            },
            init: function () {
                var me = this;
                if (frameElement && frameElement.dialog) {
                    me.dialog = frameElement.dialog;
                    me.dialogData = me.dialog.get('data') || {};
                    if (me.dialogData.callback) me.callback = me.dialogData.callback;
                    if (me.dialogData.sid) me.sid = me.dialogData.sid;
                    if (me.dialogData.isView) me.isView = me.dialogData.isView === "1";
                }
                me.isView = false;
                me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.loadData();
                return me;
            }
        };
        business.init();
    </script>
</body>

</html>
