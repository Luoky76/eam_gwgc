
<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title> 劳保需求申请</title>
    <script src="../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <form id="mainform">
    </form>
    <script type="text/javascript">
        'use strict';
        var business = {
            dialogData: {},
            isView: true,
            sid: getQueryStringByName("sid"),
            dataCorp: [],
            setConfig: function () {
                var me = this;
                me.config = {
                    form: {
                        fields: [
                            { display: "记录状态", name: "AUDITING", newline: false, upper: true, type: "text", options: {}, group: "基本信息" },
                            { display: "需求计划单号", name: "REQUEST_CODE", newline: false, upper: true, type: "text", options: {}, group: "基本信息" },
                            { display: "需求计划单号", name: "REQUEST_CODE", newline: false, upper: true, type: "text", options: {}, group: "基本信息" },
                            { display: "需求分类", name: "REQUEST_SPTYPE", newline: false, upper: true, type: "text", options: {}, group: "" },

                            { display: "申请日期", name: "REQUEST_DATE", newline: false, upper: true, type: "date", options: {}, group: "基本信息" },
                            { display: "所属月份", name: "REQUEST_MONTH", newline: false, upper: true, type: "text", options: {}, group: "基本信息" },
                            { display: "所属年份", name: "REQUEST_YEAR", newline: false, upper: true, type: "text", options: {}, group: "基本信息" },
                            { display: "申请人", name: "REQUEST_USER", newline: false, upper: true, type: "text", options: {}, group: "" },
                            { display: "申请人ID", name: "REQUEST_USERID", newline: false, upper: true, type: "text", options: {}, group: "" },
                            { display: "申请部门编号", name: "DEPT_CODE", newline: false, upper: true, type: "text", options: {}, group: "" },
                            { display: "申请部门", name: "DEPT_NAME", newline: false, upper: true, type: "text", options: {}, group: "" },
                            { display: "申请部门ID", name: "DEPT_ID", newline: false, upper: true, type: "text", options: {}, group: "" },
                            { display: "物资归属船舶", name: "SHIP_NAME", newline: false, upper: true, type: "text", options: {}, group: "" },
                            { display: "物资归属船舶ID", name: "SHIP_ID", newline: false, upper: true, type: "text", options: {}, group: "" },
                            { display: "物资归属船舶编码", name: "SHIP_CODE", newline: false, upper: true, type: "text", options: {}, group: "" },
                            { display: "二级单位", name: "SEC_DEPT", newline: false, upper: true, type: "text", options: {}, group: "" },
                            { display: "二级单位ID", name: "SEC_DEPTID", newline: false, upper: true, type: "text", options: {}, group: "" },
                            { display: "备注", name: "MEMO", newline: false, upper: true, type: "text", options: {}, group: "" },
                            { display: "类别", name: "REQUEST_TYPE", newline: false, upper: true, type: "text", options: {}, group: "" },
                            { display: "格式号", name: "FORM_ID", newline: false, upper: true, type: "text", options: {}, group: "" },
                            { display: "来源单号", name: "SRC_CODE", newline: false, upper: true, type: "text", options: {}, group: "" },
                            { display: "主键", name: "REQUEST_ID", newline: false, upper: true, type: "text", validate: { required: true }, options: {}, group: "" },
                            { display: "添加人ID", name: "CREATE_USERID", newline: false, upper: true, type: "text", options: {}, group: "" },
                            { display: "添加时间", name: "CREATEDATE", newline: false, upper: true, type: "date", options: {}, group: "" },
                            { display: "修改人ID", name: "MODIFY_USERID", newline: false, upper: true, type: "text", options: {}, group: "" },
                            { display: "修改时间", name: "MODIFYDATE", newline: false, upper: true, type: "date", options: {}, group: "" }
                        ]
                    }
                };
            },
            mainform: null,
            buttons: null,
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'LaborRequest/ComboxData',
                    loading: '正在获取中...',
                    success: function (data) {
                        me.dataCorp = data.corpData;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            loadData: function () {
                var me = this;
                if (!me.sid) {
                    me.mainform.setOrginData({});
                }
                else {
                    LG.ajax({
                        async: false,
                        url: 'LaborRequest/Get',
                        loading: '正在获取中...',
                        data: { id: me.sid },
                        success: function (data, message) {
                            me.mainform.setOrginData(data);
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                    if (me.isView) {
                        me.mainform.setReadonly(true);
                    }
                }
                me.mainform.focus();
            },
            save: function () { //保存
                var me = this;
                if ($.isEmptyObject(me.mainform.getChanges())) {
                    LG.showSuccess('无修改');
                    return;
                }
                if (!me.mainform.valid()) {
                    me.mainform.showInvalid();
                    return;
                }
                function handle(data) {
                    return data;
                }
                var data = handle(me.mainform.getData());
                var original = handle(me.mainform.getOrginData());
                var changeRow = new Object();
                if (!me.sid) {
                    changeRow["added"] = [data];
                }
                else {
                    changeRow["updated"] = [data];
                    changeRow["original"] = [original];
                }
                LG.ajax({
                    jsToken: true,
                    url: 'LaborRequest/Save',
                    loading: '正在保存中...',
                    data: changeRow,
                    success: function () {
                        LG.showSuccess('保存成功', function () {
                            location.reload(true);
                        });
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            close: function () {
                var me = this;
                function inner(callback) {
                    var data = me.mainform.getChanges();
                    if (!$.isEmptyObject(data)) {
                        $.ligerDialog.confirm($.ligerDefaults.GridString.isContinueByDataChanged, function (confirm) {
                            if (confirm) {
                                if (callback) callback(2);
                            }
                            else {
                                if (callback) callback(0);
                            }
                        });
                        if (callback) return callback(-1);
                        return false;
                    }
                    if (callback) return callback(1);
                    return true;
                }
                inner(function (status) {
                    if (status > 0) {
                        if (me.dialog) {
                            me.dialog.close();
                            return;
                        }
                        var win = parent || window;
                        if (win.closeCurrentTab) win.closeCurrentTab();
                        else win.close();
                    }
                });
            },
            setFormDefaultBtn: function () {
                var me = this;
                //表单底部按钮
                var buttons = [];
                if (!me.isView) {
                    buttons.push({
                        text: '重置', onclick: function () {
                            $.ligerDialog.confirm("确定重置数据吗?", function (confirm) {
                                if (confirm) {
                                    location.reload(true);
                                }
                            });
                        }
                    });
                }
                buttons.push({ text: '关闭', onclick: me.close.bind(me) });
                if (!me.isView) buttons.push({ text: '保存', onclick: me.save.bind(me) });
                LG.addFormButtons(buttons);
                me.formButtons = buttons;
            },
            setForm: function () {
                var me = this;
                me.config.form.fields.removeNull();
                var $mainform = $("#mainform")
                //搜索表单应用ligerui样式
                me.mainform = $mainform.ligerForm({
                    EnterMoveNextControl: true,
                    labelAlign: 'right',
                    space: 3,
                    validate: true,
                    fields: me.config.form.fields,
                    labelWidth: 60,
                    onAfterSetFields: function (g) {
                        me.mainform = g;
                        me.buttons = g.options.buttons;
                    }
                });
                me.setFormDefaultBtn();
            },
            init: function () {
                var me = this;
                if (frameElement && frameElement.dialog) {
                    me.dialog = frameElement.dialog;
                    me.dialogData = me.dialog.get('data') || {};
                    if (me.dialogData.callback) me.callback = me.dialogData.callback;
                    if (me.dialogData.sid) me.sid = me.dialogData.sid;
                    if (me.dialogData.isView) me.isView = me.dialogData.isView === "1";
                }
                me.isView = false;
                me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.loadData();
                return me;
            }
        };
        business.init();
    </script>
</body>

</html>
