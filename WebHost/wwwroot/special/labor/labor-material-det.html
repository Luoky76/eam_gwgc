
<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title>船舶常规物料清册报表</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%; overflow:auto;">
    <form id="mainform" style="width:97%;">
    </form>
    <div style="width: 94.5%;" class="l-form">
        <div class="l-form-container">
            <div class="l-group" style="width: 100%;"><span>常规物料明细</span></div>
            <ul style="display: block; width: 100%;" id="ulGrid">
                <li style="width: 100%;">
                    <div style="margin-bottom: 50px; width: 100%;" id="det-grid">
                    </div>
                </li>
            </ul>
        </div>
    </div>
    <script type="text/javascript">
        'use strict';
        var business = {
            setConfig: function () {
                var me = this;
                me.config = {
                    form: {
                        fields: [
                            {
                                display: "记录状态", name: "AUDITING", type: "select", options: {
                                    data: me.auditing,
                                    value: "0",
                                    disabled: true
                                }
                            },
                            {
                                display: "船名", name: "SHIP_NAME", type: "text", options: {
                                    value: window.session.Corp.CName,
                                    disabled: true
                                }
                            },
                            {
                                display: "部门", name: "DEPT_NAME", type: "text", options: {
                                    value: window.session.Corp.CName,
                                    disabled: true
                                }
                            },
                            { display: "日期", name: "DATE", type: "date", options:{} },
                            //隐藏
                            { display: "主键", name: "LABOR_MATERIAL_ID", type: "hidden", options: {} },
                            {
                                display: "部门ID", name: "DEPT_ID", type: "hidden", options: {
                                    value: window.session.Corp.CorpID
                                }
                            },
                        ]
                    },
                    grid: {
                        columns: []
                    }
                };
            },
            dialogData: {},
            mainform: null,
            buttons: null,
            grid: null,
            //主表主键
            sid: "",
            isNew: false,
            isView: true,
            auditing: [],
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'Special/LaborMaterial/ComboxData',
                    loading: '正在获取中...',
                    success: function (data) {
                        me.auditing = data.Auditing;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            loadData: function () {
                var me = this;
                if (me.isNew) {
                    var originData = {};
                    LG.ajax({
                        async: false,
                        url: 'Special/LaborMaterial/CreatePrimaryKey',
                        loading: '正在获取中...',
                        success: function (data, message) {
                            me.sid = data;
                            originData["LABOR_MATERIAL_ID"] = data;
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                    me.mainform.setOrginData(originData);
                }
                else {
                    LG.ajax({
                        async: false,
                        url: 'Special/LaborMaterial/Get',
                        loading: '正在获取中...',
                        data: { id: me.sid },
                        success: function (data, message) {
                            me.mainform.setOrginData(data);
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                    if (me.isView) {
                        me.mainform.setReadonly(true);
                    }
                }
                me.mainform.focus();
            },
            save: function () { //保存
                var me = this;
                if (!me.isNew && $.isEmptyObject(me.mainform.getChanges())) {
                    LG.showSuccess('无修改');
                    return;
                }
                if (!me.mainform.valid()) {
                    me.mainform.showInvalid();
                    return;
                }
                function handle(data) {
                    return data;
                }
                var data = handle(me.mainform.getData());
                var original = handle(me.mainform.getOrginData());
                var changeRow = new Object();
                if (me.isNew) {
                    changeRow["added"] = [data];
                }
                else {
                    changeRow["updated"] = [data];
                    changeRow["original"] = [original];
                }
                LG.ajax({
                    jsToken: true,
                    url: 'Special/LaborMaterial/Save',
                    loading: '正在保存中...',
                    data: changeRow,
                    success: function () {
                        LG.showSuccess('保存成功', function () {
                            //location.reload(true);
                            //主表保存过后变为修改模式
                            me.isNew = false;
                            me.loadData();
                        });
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            close: function (skipConfirm) {
                var me = this;
                function inner(callback) {
                    if (!skipConfirm && !$.isEmptyObject(me.mainform.getChanges())) {
                        $.ligerDialog.confirm($.ligerDefaults.GridString.isContinueByDataChanged, function (confirm) {
                            if (confirm) {
                                if (callback) callback(2);
                            }
                            else {
                                if (callback) callback(0);
                            }
                        });
                        if (callback) return callback(-1);
                        return false;
                    }
                    if (callback) return callback(1);
                    return true;
                }
                inner(function (status) {
                    if (status > 0) {
                        if (me.dialog) {
                            me.dialog.close();
                            return;
                        }
                        var win = parent || window;
                        if (win.closeCurrentTab) win.closeCurrentTab();
                        else win.close();
                    }
                });
            },
            setFormDefaultBtn: function () {
                var me = this;
                //表单底部按钮
                var buttons = [];
                if (!me.isView) {
                    buttons.push({
                        text: '重置', onclick: function () {
                            $.ligerDialog.confirm("确定重置数据吗?", function (confirm) {
                                if (confirm) {
                                    location.reload(true);
                                }
                            });
                        }
                    });
                    buttons.push({
                        text: '保存',
                        icon: 'fa fa-save',
                        onclick: function () {
                            me.save();
                            //子表有修改而未保存时，保存子表
                            if (me.gird && me.grid.isDataChanged) me.saveGrid();
                        }.bind(me)
                    });
                }
                buttons.push({
                    text: '关闭',
                    onclick: function () {
                        var me = this;
                        me.close(false);
                    }.bind(me)
                });
                LG.addFormButtons(buttons);
                me.formButtons = buttons;
            },
            setForm: function () {
                var me = this;
                me.config.form.fields.removeNull();
                var $mainform = $("#mainform")
                //搜索表单应用ligerui样式
                me.mainform = $mainform.ligerForm({
                    EnterMoveNextControl: true,
                    labelAlign: 'right',
                    space: 3,
                    validate: true,
                    fields: me.config.form.fields,
                    labelWidth: 120,
                    readonly: me.isView,
                    onAfterSetFields: function (g) {
                        me.mainform = g;
                        me.buttons = g.options.buttons;
                    }
                });
                me.setFormDefaultBtn();
            },
            init: function () {
                debugger
                var me = this;
                if (frameElement && frameElement.dialog) {
                    me.dialog = frameElement.dialog;
                    me.dialogData = me.dialog.get('data') || {};
                    if (me.dialogData.callback) me.callback = me.dialogData.callback;
                    if (me.dialogData.sid) me.sid = me.dialogData.sid;
                    if (me.dialogData.hasOwnProperty('isView')) me.isView = me.dialogData.isView;
                    if (me.dialogData.hasOwnProperty('isNew')) me.isNew = me.dialogData.isNew;
                }

                me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.loadData();

                //加载明细表
                //me.setGrid();
                //me.reloadGrid();

                return me;
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>

</html>
