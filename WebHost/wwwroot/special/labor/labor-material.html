<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title>常规物料清点表</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <div id="layout">
        <div position="center" title="">
            <div id="mainsearch">
                <form action="" id="formsearch" class="l-form">
                </form>
            </div>
            <div id="iframeloading" class='l-loading' style="display:none;">
            </div>
            <form id="mainform">
                <div id="maingrid" style="margin: 2px;"></div>
            </form>
        </div>
    </div>
    <script type="text/javascript">
        'use strict';
        var business = {
            formLabelWidth: 120,
            formInputWidth: 180,
            getTextareaWidth: function () {
                var me = this;
                var fieldWidth = me.formLabelWidth + me.formInputWidth + 3;
                return Math.floor(($("#mainform").width() - 10) / fieldWidth) * fieldWidth - (me.formLabelWidth + 3);
            },
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            { display: "船名", name: "_search_SHIP_NAME", dbname: "SHIP_NAME", type: "text" },
                            {
                                display: "部门", name: "_search_DEPT_ID", dbname: "DEPT_ID", type: "select", op: "equal", options: {
                                    data: me.corp
                                }
                            },
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "已提交", name: "AUDITING", width: 100, type: "chk" },
                            { display: "船名", name: "SHIP_NAME", minWidth: 100, type: "text" },
                            { display: "部门", name: "DEPT_NAME", minWidth: 100, type: "text" },
                            { display: "日期", name: "DATE", minWidth: 100, type: "date", editor: { type: 'date', showTime: true, format: "yyyy-MM-dd hh:mm" } },
                            //隐藏
                            { display: "主键", name: "LABOR_MATERIAL_ID", minWidth: 100, type: "text", hide: true },
                            { display: "部门ID", name: "DEPT_ID", minWidth: 100, type: "text", hide: true },
                        ]
                    }
                };
            },
            //明细页面大小
            detailWidth: window.innerWidth * 0.9,
            detailHeight: window.innerHeight * 0.9,
            menuNo: getQueryStringByName("MenuNo"),
            grid: null,
            searchForm: null,
            buttons: null,
            corp: [],
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'Special/LaborMaterial/Comboxdata',
                    loading: '正在获取中...',
                    success: function (data) {
                        me.corp = data.Corp;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    autoWidth: true,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    usePager: false,
                    dataAction: 'server',
                    toolbar: {},
                    url: 'Special/LaborMaterial/List',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: 'LABOR_MATERIAL_ID',
                    sortOrder: 'asc',
                    width: '98%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: true,
                    clickToEdit: true,
                    onBeforeEdit: function (editParm) {
                        switch (editParm.column.name) {
                            case "":
                                if (editParm.record.__status == "add") return true;
                                else return false;
                                break;
                        }
                    },
                    onSuccess: function (data, g) {
                        if (data && data.Rows) {
                            var rows = data.Rows || [];
                            for (var i = 0, len = rows.length; i < len; i++) {
                                var row = rows[i];
                                row.OLDROLEID = row.ROLEID;
                            }
                        }
                    },
                    rowAttrRender: function (rowdata, rowid) {
                        return "";
                    },
                    onDblClickRow: function (data, rowid, rowdata) {
                        me.view(rowid);
                    }
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            isSelectRow: function () {
                var me = this;
                var rows = me.grid.getSelectedRows();
                if (rows.length == 0) {
                    LG.tip("请选择一行");
                    return false;
                }
                return true;
            },
            isSelectSingleRow: function () {
                var me = this;
                var rows = me.grid.getSelectedRows();
                if (rows.length > 1) {
                    LG.tip("不能选择多行");
                    return false;
                } else if (rows.length == 0) {
                    LG.tip("请选择一行");
                    return false;
                }
                return true;
            },
            isAllUnaudited: function ({ msg = "有数据已提交，无法变更！" } = {}) {
                var me = this;
                var selecteds = me.grid.getSelectedRows();
                for (let row of selecteds) {
                    if (row.AUDITING == "1") {
                        if (msg) { LG.tip(msg); }
                        return false;
                    }
                }
                return true;
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "add":
                            me.add();
                            break;
                        case "modify":
                            if (me.isSelectSingleRow() && me.isAllUnaudited()) {
                                me.modify();
                            }
                            break;
                        case "delete":
                            if (me.isSelectRow() && me.isAllUnaudited()) {
                                me.delete();
                            }
                            break;
                        case "save":
                            me.save();
                            break;
                        case "submit":
                            if (me.isSelectRow() && me.isAllUnaudited()) {
                                $.ligerDialog.confirm("提交后不可修改，是否继续？", function (confirm) {
                                    if (confirm) {
                                        me.submit();
                                    }
                                });
                            }
                            break;
                        case "Excel":
                            $.ligerDialog.open({
                                url: window.gksybConfigs.getUrl("System/Export.html?exporttype=xls", window.gksybConfigs.urlBase),
                                modal: true
                            });
                            break;
                        case "Pdf":
                            $.ligerDialog.open({
                                url: window.gksybConfigs.getUrl("System/Export.html?exporttype=pdf", window.gksybConfigs.urlBase),
                                modal: true
                            });
                            break;
                    }
                }
                me.grid.toolbarManager.options.group = 'main';
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            openDetail: function ({ sid = null, isNew = false, isView = false } = {}) {
                var me = this;
                $.ligerDialog.open({
                    width: me.detailWidth,
                    height: me.detailHeight,
                    allowClose: true,
                    title: isNew ? "[新增]船舶常规物料清册" : (isView ? "[查看]船舶常规物料清册" : "[修改]船舶常规物料清册"),
                    url: "labor-material-det.html?MenuNo=" + me.menuNo,
                    isHidden: false,
                    showMax: false,
                    showToggle: false,
                    showMin: false,
                    isResize: true,
                    slide: false,
                    onClosed: me.reload.bind(me),
                    data: { sid: sid, isNew: isNew, isView: isView }
                });
            },
            add: function () {
                this.openDetail({ sid: null, isNew: true, isView: false });
            },
            view: function (rowid) {
                var me = this;
                var selected = rowid != undefined ? me.grid.records[rowid] : me.grid.getSelectedRow();
                if (!selected) {
                    LG.tip('请选择行!');
                    return;
                }
                me.openDetail({ sid: selected.LABOR_MATERIAL_ID, isNew: false, isView: true });
            },
            modify: function () {
                var me = this;
                var selected = me.grid.getSelectedRow();
                if (!selected) {
                    LG.tip('请选择行!');
                    return;
                }
                me.openDetail({ sid: selected.LABOR_MATERIAL_ID, isNew: false, isView: false });
            },
            save: function () { //保存
                var me = this;
                if (me.grid.endEdit() != false) {
                    if (!me.grid.isDataChanged) {
                        LG.showSuccess('无修改');
                        return;
                    }
                    if (!me.grid.validChangeRows()) return false;
                    var changeRow = me.grid.getChangedRows();
                    LG.ajax({
                        jsToken: true,
                        url: 'Special/LaborMaterial/Save',
                        loading: '正在保存中...',
                        data: changeRow,
                        success: function () {
                            LG.showSuccess('保存成功');
                            me.grid.isDataChanged = false;
                            me.reload();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }
            },
            submit: function () {
                var me = this;
                var selecteds = me.grid.getSelectedRows();
                if (selecteds.length == 0) {
                    LG.tip('请选择行!');
                    return;
                }
                var sids = [];
                for (var i = 0; i < selecteds.length; i++) {
                    sids.push(selecteds[i].LABOR_MATERIAL_ID);
                }
                LG.ajax({
                    jsToken: true,
                    url: 'Special/LaborMaterial/Submit',
                    loading: '正在提交中...',
                    data: { sids: sids },
                    success: function () {
                        LG.showSuccess('提交成功');
                        me.grid.isDataChanged = false;
                        me.reload();
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            reload: function () { //刷新
                var me = this;
                me.grid.loadData();
            },
            delete: function () { //删除
                var me = this;
                if (me.grid.endEdit() != false) {
                    var selected = me.grid.getSelectedRows();
                    if (selected.length > 0) {
                        $.ligerDialog.confirm('确定删除吗?', function (confirm) {
                            if (confirm) {
                                me.grid.deleteSelectedRow();
                                me.save();
                            }
                        });
                    }
                }
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Pdf',
                        text: '??Pdf',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-pdf-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch = $("#formsearch")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    labelWidth: me.formLabelWidth,
                    inputWidth: me.formInputWidth,
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    EnterMoveNextControl: true,
                    space: 3,
                    labelAlign: 'right',
                    labelWidth: me.formLabelWidth,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                    }
                });
            },
            init: function () {
                var me = this;
                me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.setGrid();
                me.reload();
                return me;
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>
</html>
