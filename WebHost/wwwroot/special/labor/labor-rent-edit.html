
<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title>劳保用品租借明细</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <form id="mainform">
    </form>
    <div id="maingrid">
    </div>
    <script type="text/javascript">
        'use strict';
        var business = {
            dialogData: {},
            isView: true,
            sid: getQueryStringByName("sid"),
            menuNo: getQueryStringByName("MenuNo"),
            dataCorp: [],
            setConfig: function () {
                var me = this;
                me.config = {
                    form: {
                        fields: [
                            { display: "记录状态", name: "AUDITING", newline: false, upper: true, type: "select", options: { disabled: true, data: me.auditing, value: "0" } },
                            { display: "租借单号", name: "RENT_CODE", newline: false, upper: true, type: "text", options: { disabled: true } },
                            { display: "租借状态", name: "RENT_STATUS", newline: false, upper: true, type: "select", options: { disabled: true } },
                            { display: "租借提交日期", name: "RENT_DATE", newline: false, upper: true, type: "date", options: { disabled: true } },
                            { display: "租借开始日期", name: "BEGIN_DATE", newline: true, upper: true, type: "date", options: {} },
                            { display: "租借结束日期", name: "END_DATE", newline: false, upper: true, type: "date", options: { disabled: true } },
                            { display: "经办部门", name: "DEPT_NAME", newline: false, upper: true, type: "select", options: { disabled: true } },
                            { display: "经办人", name: "USER_NAME", newline: false, upper: true, type: "text", options: { disabled: true } },
                            { display: "租借部门", name: "RENT_DEPT", newline: true, upper: true, type: "select", options: { data: me.dataCorp } },
                            { display: "租借人", name: "RENT_USER", newline: false, upper: true, type: "select", options: { data: me.user } },
                            { display: "租借原因", name: "RENT_REASON", newline: true, upper: true, type: "textarea", width: 1250, options: {} },
                            { display: "备注", name: "MEMO", newline: true, upper: true, type: "textarea", width: 1250, options: {} }
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "物资编码", name: "SP_CODE", minWidth: 100, type: "text", editor: { type: "text" } },
                            { display: "物资名称", name: "SP_NAME", minWidth: 200, type: "text", editor: { type: "text" } },
                            { display: "物资型号", name: "SP_TYPE", minWidth: 100, type: "text", editor: { type: "text" } },
                            { display: "品牌", name: "BRAND", minWidth: 100, type: "text", editor: { type: "text" } },
                            { display: "租借数量", name: "RENT_NUM", minWidth: 60, type: "float", editor: { type: "float" } },
                            { display: "计量单位", name: "UNIT", minWidth: 60, type: "text", editor: { type: "text" } },
                            { display: "制造厂", name: "FACTORY", minWidth: 100, type: "text", editor: { type: "text" } },
                            { display: "其他编号", name: "OTHER_CODE", minWidth: 100, type: "text", editor: { type: "text" } },
                            { display: "物资类别名称", name: "TYPE_NAME", minWidth: 80, type: "text", editor: { type: "text" } },
                            { display: "备注", name: "MEMO", minWidth: 100, type: "text", editor: { type: "text" } }
                        ]
                    },
                };
            },
            auditing: [],
            user: [],
            mainform: null,
            grid: null,
            buttons: null,
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'special/labor/comboxdata',
                    loading: '正在获取中...',
                    success: function (data) {
                        me.auditing = data.Auditing;
                        me.user = data.User;
                        me.dataCorp = data.Corp;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            loadData: function () {
                var me = this;
                if (!me.sid) {
                    me.mainform.setOrginData({});
                }
                else {
                    LG.ajax({
                        async: false,
                        url: 'special/labor/LaborRentGet',
                        loading: '正在获取中...',
                        data: { rentId: me.sid },
                        success: function (data, message) {
                            me.mainform.setOrginData(data.maindata);
                            me.grid.loadData(data.detdata);
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                    if (me.isView) {
                        me.mainform.setReadonly(true);
                    }
                }
                me.mainform.focus();
            },
            save: function () { //保存
                var me = this;
                if ($.isEmptyObject(me.mainform.getChanges())) {
                    LG.showSuccess('无修改');
                    return;
                }
                if (!me.mainform.valid()) {
                    me.mainform.showInvalid();
                    return;
                }
                function handle(data) {
                    return data;
                }
                var data = handle(me.mainform.getData());
                var original = handle(me.mainform.getOrginData());
                var changeRow = new Object();
                if (!me.sid) {
                    changeRow["added"] = [data];
                }
                else {
                    changeRow["updated"] = [data];
                    changeRow["original"] = [original];
                }
                var changeRowDet = me.grid.getChangedRows();

                debugger;

                LG.ajax({
                    jsToken: true,
                    url: 'special/labor/LaborRentSave',
                    loading: '正在保存中...',
                    data: { request: changeRow, requestdet: changeRowDet },
                    success: function () {
                        LG.showSuccess('保存成功', function () {
                            location.reload(true);
                        });
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            close: function (skipConfirm) {
                var me = this;
                function inner(callback) {
                    if (!skipConfirm && !$.isEmptyObject(me.mainform.getChanges())) {
                        $.ligerDialog.confirm($.ligerDefaults.GridString.isContinueByDataChanged, function (confirm) {
                            if (confirm) {
                                if (callback) callback(2);
                            }
                            else {
                                if (callback) callback(0);
                            }
                        });
                        if (callback) return callback(-1);
                        return false;
                    }
                    if (callback) return callback(1);
                    return true;
                }
                inner(function (status) {
                    if (status > 0) {
                        if (me.dialog) {
                            me.dialog.close();
                            return;
                        }
                        var win = parent || window;
                        if (win.closeCurrentTab) win.closeCurrentTab();
                        else win.close();
                    }
                });
            },
            setFormDefaultBtn: function () {
                var me = this;
                //表单底部按钮
                var buttons = [];
                /*if (!me.isView) {
                    buttons.push({
                        text: '重置', onclick: function () {
                            $.ligerDialog.confirm("确定重置数据吗?", function (confirm) {
                                if (confirm) {
                                    location.reload(true);
                                }
                            });
                        }
                    });
                }*/
                buttons.push({ text: '关闭', onclick: me.close.bind(me) });
                if (!me.isView) buttons.push({ text: '保存', onclick: me.save.bind(me) });
                LG.addFormButtons(buttons);
                me.formButtons = buttons;
            },
            setForm: function () {
                var me = this;
                me.config.form.fields.removeNull();
                var $mainform = $("#mainform")
                //搜索表单应用ligerui样式
                me.mainform = $mainform.ligerForm({
                    EnterMoveNextControl: true,
                    labelAlign: 'right',
                    space: 3,
                    validate: true,
                    fields: me.config.form.fields,
                    labelWidth: 100,
                    onAfterSetFields: function (g) {
                        me.mainform = g;
                        me.buttons = g.options.buttons;
                    }
                });
                me.setFormDefaultBtn();
            },
            //租借明细表
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    dateFormat: "yyyy-MM-dd hh:mm",
                    autoWidth: true,
                    delayLoad: true,
                    usePager: false,
                    columns: me.config.grid.columns,
                    dataAction: 'server',
                    toolbar: { group: "detlist" },
                    url: 'special/labor/GetLaborRentDetList',
                    parms: {
                        rentId: me.sid
                    },
                    sortName: 'SP_CODE',
                    sortOrder: 'desc',
                    width: '99%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: true,
                    clickToEdit: true,
                    onSuccess: function (data, g) {
                        //me.iframeloading.hide();
                    },
                    async: false
                });
                me.grid.isValid = true;
                me.loadToolbar();
            },
            //明细按钮组
            loadToolbar: function () {
                var me = this;
                me.ToolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "import":
                            me.import();
                            break;
                        case "delete":
                            me.delete();
                            break;
                        case "detadd":
                            me.grid.addEditRow({}, true);
                            break;
                        default:
                            break;
                    }
                }
                //加载collect按钮
                LG.loadToolbar(me.grid, me.ToolbarBtnItemClick);
            },
            init: function () {
                var me = this;
                if (frameElement && frameElement.dialog) {
                    me.dialog = frameElement.dialog;
                    me.dialogData = me.dialog.get('data') || {};
                    if (me.dialogData.callback) me.callback = me.dialogData.callback;
                    if (me.dialogData.sid) me.sid = me.dialogData.sid;
                    if (me.dialogData.isView) me.isView = me.dialogData.isView === "1";
                }
                me.isView = false;
                me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.setGrid();
                me.loadData();
                return me;
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>

</html>
