
<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title>劳保需求申请查询</title>
    <script src="../../lib/LGboot.js"  type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <div id="mainsearch" style="width: 98%">
        <form action="" id="formsearch" class="l-form">
        </form>
    </div>
    <form action="" id="mainform">
        <div id="maingrid">
        </div>
    </form>
    <script type="text/javascript">
        'use strict';
        var business = {
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            { display: "记录状态", name: "_search_AUDITING", dbname: "AUDITING", newline: false, upper: true, type: "text", options: {} },
                            { display: "需求计划单号", name: "_search_REQUEST_CODE", dbname: "REQUEST_CODE", newline: false, upper: true, type: "text", options: {} },
                            { display: "申请日期", name: "_search_REQUEST_DATE", dbname: "REQUEST_DATE", newline: false, upper: true, type: "date", options: {} },
                            { display: "所属月份", name: "_search_REQUEST_MONTH", dbname: "REQUEST_MONTH", newline: false, upper: true, type: "text", options: {} },
                            { display: "所属年份", name: "_search_REQUEST_YEAR", dbname: "REQUEST_YEAR", newline: false, upper: true, type: "text", options: {} },
                            { display: "申请人", name: "_search_REQUEST_USER", dbname: "REQUEST_USER", newline: false, upper: true, type: "text", options: {} },
                            { display: "申请人ID", name: "_search_REQUEST_USERID", dbname: "REQUEST_USERID", newline: false, upper: true, type: "text", options: {} },
                            { display: "申请部门编号", name: "_search_DEPT_CODE", dbname: "DEPT_CODE", newline: false, upper: true, type: "text", options: {} },
                            { display: "申请部门", name: "_search_DEPT_NAME", dbname: "DEPT_NAME", newline: false, upper: true, type: "text", options: {} },
                            { display: "申请部门ID", name: "_search_DEPT_ID", dbname: "DEPT_ID", newline: false, upper: true, type: "text", options: {} },
                            { display: "物资归属船舶", name: "_search_SHIP_NAME", dbname: "SHIP_NAME", newline: false, upper: true, type: "text", options: {} },
                            { display: "物资归属船舶ID", name: "_search_SHIP_ID", dbname: "SHIP_ID", newline: false, upper: true, type: "text", options: {} },
                            { display: "物资归属船舶编码", name: "_search_SHIP_CODE", dbname: "SHIP_CODE", newline: false, upper: true, type: "text", options: {} },
                            { display: "二级单位", name: "_search_SEC_DEPT", dbname: "SEC_DEPT", newline: false, upper: true, type: "text", options: {} },
                            { display: "二级单位ID", name: "_search_SEC_DEPTID", dbname: "SEC_DEPTID", newline: false, upper: true, type: "text", options: {} },
                            { display: "备注", name: "_search_MEMO", dbname: "MEMO", newline: false, upper: true, type: "text", options: {} },
                            { display: "类别", name: "_search_REQUEST_TYPE", dbname: "REQUEST_TYPE", newline: false, upper: true, type: "text", options: {} },
                            { display: "格式号", name: "_search_FORM_ID", dbname: "FORM_ID", newline: false, upper: true, type: "text", options: {} },
                            { display: "需求分类", name: "_search_REQUEST_SPTYPE", dbname: "REQUEST_SPTYPE", newline: false, upper: true, type: "text", options: {} },
                            { display: "来源单号", name: "_search_SRC_CODE", dbname: "SRC_CODE", newline: false, upper: true, type: "text", options: {} },
                            { display: "主键", name: "_search_REQUEST_ID", dbname: "REQUEST_ID", newline: false, upper: true, type: "text", options: {} },
                            { display: "添加人ID", name: "_search_CREATE_USERID", dbname: "CREATE_USERID", newline: false, upper: true, type: "text", options: {} },
                            { display: "添加时间", name: "_search_CREATEDATE", dbname: "CREATEDATE", newline: false, upper: true, type: "date", options: {} },
                            { display: "修改人ID", name: "_search_MODIFY_USERID", dbname: "MODIFY_USERID", newline: false, upper: true, type: "text", options: {} },
                            { display: "修改时间", name: "_search_MODIFYDATE", dbname: "MODIFYDATE", newline: false, upper: true, type: "date", options: {} }
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "记录状态", name: "AUDITING", width: 100, type: "text", editor: { type: 'text' } },
                            { display: "需求计划单号", name: "REQUEST_CODE", width: 100, type: "text", editor: { type: 'text' } },
                            { display: "申请日期", name: "REQUEST_DATE", width: 100, type: "date", editor: { type: 'date', showTime: true, format: "yyyy-MM-dd hh:mm" } },
                            { display: "所属月份", name: "REQUEST_MONTH", width: 100, type: "text", editor: { type: 'text' } },
                            { display: "所属年份", name: "REQUEST_YEAR", width: 100, type: "text", editor: { type: 'text' } },
                            { display: "申请人", name: "REQUEST_USER", width: 100, type: "text", editor: { type: 'text' } },
                            { display: "申请人ID", name: "REQUEST_USERID", width: 100, type: "text", editor: { type: 'text' } },
                            { display: "申请部门编号", name: "DEPT_CODE", width: 100, type: "text", editor: { type: 'text' } },
                            { display: "申请部门", name: "DEPT_NAME", width: 100, type: "text", editor: { type: 'text' } },
                            { display: "申请部门ID", name: "DEPT_ID", width: 100, type: "text", editor: { type: 'text' } },
                            { display: "物资归属船舶", name: "SHIP_NAME", width: 100, type: "text", editor: { type: 'text' } },
                            { display: "物资归属船舶ID", name: "SHIP_ID", width: 100, type: "text", editor: { type: 'text' } },
                            { display: "物资归属船舶编码", name: "SHIP_CODE", width: 100, type: "text", editor: { type: 'text' } },
                            { display: "二级单位", name: "SEC_DEPT", width: 100, type: "text", editor: { type: 'text' } },
                            { display: "二级单位ID", name: "SEC_DEPTID", width: 100, type: "text", editor: { type: 'text' } },
                            { display: "备注", name: "MEMO", width: 100, type: "text", editor: { type: 'text' } },
                            { display: "类别", name: "REQUEST_TYPE", width: 100, type: "text", editor: { type: 'text' } },
                            { display: "格式号", name: "FORM_ID", width: 100, type: "text", editor: { type: 'text' } },
                            { display: "需求分类", name: "REQUEST_SPTYPE", width: 100, type: "text", editor: { type: 'text' } },
                            { display: "来源单号", name: "SRC_CODE", width: 100, type: "text", editor: { type: 'text' } },
                            { display: "*主键", name: "REQUEST_ID", width: 100, type: "text", validate: { required: true }, editor: { type: 'text' } },
                            { display: "添加人ID", name: "CREATE_USERID", width: 100, type: "text", editor: { type: 'text' } },
                            { display: "添加时间", name: "CREATEDATE", width: 100, type: "date", editor: { type: 'date', showTime: true, format: "yyyy-MM-dd hh:mm" } },
                            { display: "修改人ID", name: "MODIFY_USERID", width: 100, type: "text", editor: { type: 'text' } },
                            { display: "修改时间", name: "MODIFYDATE", width: 100, type: "date", editor: { type: 'date', showTime: true, format: "yyyy-MM-dd hh:mm" } }
                        ]
                    }
                };
            },
            grid: null,
            searchForm: null,
            buttons: null,
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'LaborRequest/comboxdata',
                    loading: '正在获取中...',
                    success: function (data) {
                        me.dataCorp = data.corpData;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    autoWidth: true,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    usePager: false,
                    dataAction: 'local',
                    toolbar: {},
                    url: 'LaborRequest/list',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: 'AUDITING',
                    sortOrder: 'asc',
                    width: '98%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: true,
                    clickToEdit: true,
                    onBeforeEdit: function (editParm) {
                        switch (editParm.column.name) {
                            case "":
                                if (editParm.record.__status == "add") return true;
                                else return false;
                                break;
                        }
                    },
                    onSuccess: function (data, g) {
                        if (data && data.Rows) {
                            var rows = data.Rows || [];
                            for (var i = 0, len = rows.length; i < len; i++) {
                                var row = rows[i];
                                row.OLDROLEID = row.ROLEID;
                            }
                        }
                    },
                    rowAttrRender: function (rowdata, rowid) {
                        return "";
                    }
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "add":
                            me.add();
                            break;
                        case "modify":
                            me.modify();
                            break;
                        case "delete":
                            me.delete();
                            break;
                        case "save":
                            me.save();
                            break;
                        case "Excel":
                            $.ligerDialog.open({
                                url: "../System/Export.html?exporttype=xls",
                                modal: true
                            });
                            break;
                        case "Word":
                            $.ligerDialog.open({
                                url: "../System/Export.html?exporttype=doc",
                                modal: true
                            });
                            break;
                    }
                }
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            add: function () { //新增
                var me = this;
                //$.ligerDialog.open({
                //    width: me.detailWidth,
                //    height: me.detailHeight,
                //    allowClose: true,
                //    title: '[新增]',
                //    url: "view-detail.html",
                //    isHidden: false,
                //    showMax: false,
                //    showToggle: false,
                //    showMin: false,
                //    isResize: true,
                //    slide: false,
                //    onClosed: me.reload.bind(me),
                //    data: { "sid": null }
                //});
                me.grid.addEditRow({}, true);
            },
            modify: function () { //修改
                var me = this;
                var selected = me.grid.getSelectedRow();
                if (!selected) {
                    LG.tip('请选择行!');
                    return;
                }
                var sid = selected.SID;
                $.ligerDialog.open({
                    width: me.detailWidth,
                    height: me.detailHeight,
                    allowClose: true,
                    title: '[修改]',
                    url: "view-detail.html",
                    isHidden: false,
                    showMax: false,
                    showToggle: false,
                    showMin: false,
                    isResize: true,
                    slide: false,
                    onClosed: me.reload.bind(me),
                    data: { "sid": sid }
                });
            },
            save: function () { //保存
                var me = this;
                if (me.grid.endEdit() != false) {
                    if (!me.grid.isDataChanged) {
                        LG.showSuccess('无修改');
                        return;
                    }
                    if (!me.grid.validChangeRows()) return false;
                    var changeRow = me.grid.getChangedRows();
                    LG.ajax({
                        jsToken: true,
                        url: 'LaborRequest/save',
                        loading: '正在保存中...',
                        data: changeRow,
                        success: function () {
                            LG.showSuccess('保存成功');
                            me.grid.isDataChanged = false;
                            me.reload();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }

            },
            reload: function () { //刷新
                var me = this;
                me.buttons[0].click();
            },
            delete: function () { //删除
                var me = this;
                if (me.grid.endEdit() != false) {
                    var selected = me.grid.getSelectedRows();
                    if (selected.length > 0) {
                        $.ligerDialog.confirm('确定删除吗?', function (confirm) {
                            if (confirm) {
                                for (var i = 0, len = selected.length; i < len; i++) {
                                    me.grid.deleteRow(selected[i]);
                                }
                                me.save();
                            }
                        });
                    } else {
                        LG.tip('请选择行!');
                    }
                }
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Word',
                        text: '导出Word',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-word-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch = $("#formsearch")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                    }
                });
            },
            init: function () {
                var me = this;
                me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.setGrid();
                me.reload();
                return me;
            }
        };
        business.init();
    </script>
</body>
</html>
