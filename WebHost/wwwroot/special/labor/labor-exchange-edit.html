
<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title>劳保用品退换明细</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <form id="mainform">
    </form>
    <div id="maingrid">
    </div>
    <script type="text/javascript">
        'use strict';
        var business = {
            formLabelWidth: 120,
            formInputWidth: 180,
            getTextareaWidth: function () {
                var me = this;
                var fieldWidth = me.formLabelWidth + me.formInputWidth + 3;
                return Math.floor(($("#mainform").width() - 10) / fieldWidth) * fieldWidth - (me.formLabelWidth + 3);
            },
            dialogData: {},
            isView: true,
            sid: getQueryStringByName("sid"),
            menuNo: getQueryStringByName("MenuNo"),
            dataCorp: [],
            exchangeType: [
                {
                    "ID": "1",
                    "TEXT": "换货",
                    "VALUE": "1",
                },
                {
                    "ID": "2",
                    "TEXT": "退货",
                    "VALUE": "2",
                },
               {
                    "ID": "3",
                    "TEXT": "退库",
                    "VALUE": "3",
                }
            ],
            setConfig: function () {
                var me = this;
                me.config = {
                    form: {
                        fields: [
                            { display: "记录状态", name: "AUDITING", newline: false, upper: true, type: "select", options: { disabled: true, data: me.auditing } },
                            { display: "退换单号", name: "EXCHANGE_CODE", newline: false, upper: true, type: "text", options: { disabled: true } },
                            { display: "退换日期", name: "EXCHANGE_DATE", newline: false, upper: true, type: "date", options: { disabled: true } },
                            { display: "退换类型", name: "EXCHANGE_TYPE", newline: false, upper: true, type: "select", options: { data: me.exchangeType }, validate: { required: true } },
                            { display: "申请人", name: "EXCHANGE_USER", newline: false, upper: true, type: "select", options: { data: me.user } },
                            { display: "申请部门", name: "EXCHANGE_DEPT", newline: false, upper: true, type: "select", options: { data: me.dataCorp }, validate: { required: true } },
                            { display: "退换原因", name: "EXCHANGE_REASON", newline: false, upper: true, type: "text", options: {}, validate: { required: true } },
                            { display: "备注", name: "MEMO", newline: false, upper: true, type: "text", options: {} },
                        ]
                    },
                    grid: {
                        columns: [

                            { display: "物资编码", name: "SP_CODE", width: 150, minWidth: 150, type: "text" },
                            { display: "物资名称", name: "SP_NAME", width: 400, minWidth: 400, type: "text" },
                            { display: "型号规格", name: "SP_SIZE", width: 150, minWidth: 150, type: "text" },
                            { display: "品牌、厂家", name: "PRODUCE", width: 60, minWidth: 60, type: "text" },
                            { display: "退换数量", name: "EXCHANGE_NUM", width: 60, minWidth: 60, type: "float", editor: { type: "float" }, validate: { required: true } },
                            { display: "计量单位", name: "UNIT", width: 60, minWidth: 60, type: "text" },
                            { display: "制造厂", name: "FACTORY", width: 60, minWidth: 60, type: "text" },
                            { display: "其他编号", name: "OTHER_CODE", width: 100, minWidth: 100, type: "text" },
                            { display: "物资类别名称", name: "TYPE_NAME", width: 120, minWidth: 120, type: "text" },
                            { display: "备注", name: "MEMO", width: 200, minWidth: 200, type: "text" }
                        ]
                    },
                };
            },
            auditing: [],
            user: [],
            mainform: null,
            grid: null,
            buttons: null,
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'special/labor/comboxdata',
                    loading: '正在获取中...',
                    success: function (data) {
                        me.auditing = data.Auditing;
                        me.user = data.User;
                        me.rentstate = data.RentState
                        me.dataCorp = data.Corp;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            loadData: function () {
                var me = this;
                if (!me.sid) {
                    me.mainform.setOrginData({});
                }
                else {
                    LG.ajax({
                        async: false,
                        url: 'special/labor/LaboExchangeGet',
                        loading: '正在获取中...',
                        data: { id: me.sid },
                        success: function (data, message) {
                            me.mainform.setOrginData(data.MainData);
                            me.grid.loadData(data.DetData);
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                    if (me.isView) {
                        me.mainform.setReadonly(true);
                    }
                }
                me.mainform.focus();
            },
            save: function () { //保存
                var me = this;
                var formEdit = false, gridEdit = false;
                if ($.isEmptyObject(me.mainform.getChanges())) {
                    formEdit = false;
                }
                else formEdit = true;
                if (!me.mainform.valid()) {
                    me.mainform.showInvalid();
                    return;
                }
                if (me.grid.endEdit() != false) {
                    if (!me.grid.isDataChanged) {
                        gridEdit = false;
                    }
                    else gridEdit = true;
                }
                if (!me.grid.validChangeRows()) return false;
                function handle(data) {
                    return data;
                }

                if (formEdit || gridEdit) {
                    var data = handle(me.mainform.getData());
                    var original = handle(me.mainform.getOrginData());
                    var changeRow = new Object();
                    if (!me.sid) {
                        changeRow["added"] = [data];
                    }
                    else {
                        changeRow["updated"] = [data];
                        changeRow["original"] = [original];
                    }
                    var changeRowDet = me.grid.getChangedRows();

                    LG.ajax({
                        jsToken: true,
                        url: 'special/labor/LaborExchangeSave',
                        loading: '正在保存中...',
                        data: { request: changeRow, requestdet: changeRowDet },
                        success: function () {
                            LG.showSuccess('保存成功', function () {
                                location.reload(true);
                            });
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }
                else { LG.showSuccess('无修改'); }
            },
            delete: function () { //删除
                var me = this;
                if (me.grid.endEdit() != false) {
                    var selected = me.grid.getSelectedRows();
                    for (var i = 0; i < selected.length; i++) {
                        if (selected[i].AUDITING_APPLY == "1") {
                            LG.showError("选中数据有部分已提交,无法删除");
                            return;
                        }
                    }
                    if (selected.length > 0) {
                        $.ligerDialog.confirm('确定删除吗?', function (confirm) {
                            if (confirm) {
                                me.grid.deleteSelectedRow();
                                me.save();
                            }
                        });
                    } else {
                        LG.tip('请选择行!');
                    }
                }
            },
            //导入库存
            import: function () {
                var me = this;
                var gridData = me.grid.getData();
                var gridKeys = [];
                for (var item of gridData) {
                    gridKeys.push(item.STD_CODE);
                }
                var dataOptions = {
                    values: gridKeys,
                    options: {
                        url: 'special/labor/LaborStoreList',
                        rowKey: "STORE_ID",
                        columns: [
                            { display: "物资编码", name: "SP_CODE", minWidth: 100, type: "text", },
                            { display: "物资名称", name: "SP_NAME", minWidth: 300, type: "text", },
                            { display: "型号规格", name: "SP_SIZE", minWidth: 200, type: "text", },
                            { display: "库存数量", name: "NUM", minWidth: 100, type: "text" },
                            { display: "计量单位", name: "UNIT", minWidth: 100, type: "text" },
                            { display: "仓库名称", name: "HOUSE_NAME", minWidth: 100, type: "text" },
                            { display: "库位名称", name: "STOCK_NAME", minWidth: 100, type: "text" },
                            { display: "入库日期", name: "IN_DATE", minWidth: 100, type: "date", editor: { format: "yyyy-MM-dd" } },
                            { display: "入库批次号", name: "STORE_CODE", minWidth: 100, type: "text" },
                            { display: "类别名称", name: "TYPE_NAME", minWidth: 100, type: "text" },
                            { display: "来源类型", name: "SRC_TYPE", minWidth: 100, type: "text" }
                        ]
                    },
                    fields: [
                        { display: "物资编码", name: "SP_CODE", width: 100, type: "text" },
                        { display: "物资名称", name: "SP_NAME", width: 300, type: "text" }
                    ],
                    callback: function (values, rows) {
                        var currentSet = new Set(gridKeys);
                        for (let item of rows) {
                            if (!currentSet.has(item.STORE_ID)) {
                                me.grid.addEditRow({
                                    SP_CODE: item.SP_CODE,
                                    SP_NAME: item.SP_NAME,
                                    SP_SIZE: item.SP_SIZE,
                                    RENT_NUM: 1,
                                    UNIT: item.UNIT,
                                    OTHER_CODE: item.OTHER_CODE,
                                    TYPE_NAME: item.TYPE_NAME,
                                    MEMO: item.MEMO,
                                }, true);
                            }
                        }
                    }
                }
                $.ligerDialog.open({
                    width: 1000,
                    height: 400,
                    title: '选择维保项目清单',
                    url: window.gksybConfigs.urlBase + "popup-select/common.html",
                    isResize: true,
                    slide: false,
                    data: dataOptions
                });
            },
            close: function (skipConfirm) {
                var me = this;
                function inner(callback) {
                    if (!skipConfirm && !$.isEmptyObject(me.mainform.getChanges())) {
                        $.ligerDialog.confirm($.ligerDefaults.GridString.isContinueByDataChanged, function (confirm) {
                            if (confirm) {
                                if (callback) callback(2);
                            }
                            else {
                                if (callback) callback(0);
                            }
                        });
                        if (callback) return callback(-1);
                        return false;
                    }
                    if (callback) return callback(1);
                    return true;
                }
                inner(function (status) {
                    if (status > 0) {
                        if (me.dialog) {
                            me.dialog.close();
                            return;
                        }
                        var win = parent || window;
                        if (win.closeCurrentTab) win.closeCurrentTab();
                        else win.close();
                    }
                });
            },
            setFormDefaultBtn: function () {
                var me = this;
                //表单底部按钮
                var buttons = [];
                /*if (!me.isView) {
                    buttons.push({
                        text: '重置', onclick: function () {
                            $.ligerDialog.confirm("确定重置数据吗?", function (confirm) {
                                if (confirm) {
                                    location.reload(true);
                                }
                            });
                        }
                    });
                }*/
                buttons.push({ text: '关闭', onclick: me.close.bind(me) });
                if (!me.isView) buttons.push({ text: '保存', onclick: me.save.bind(me) });
                LG.addFormButtons(buttons);
                me.formButtons = buttons;
            },
            setForm: function () {
                var me = this;
                me.config.form.fields.removeNull();
                var $mainform = $("#mainform")
                //搜索表单应用ligerui样式
                me.mainform = $mainform.ligerForm({
                    labelWidth: me.formLabelWidth,
                    inputWidth: me.formInputWidth,
                    EnterMoveNextControl: true,
                    labelAlign: 'right',
                    space: 3,
                    validate: true,
                    fields: me.config.form.fields,
                    labelWidth: me.formLabelWidth,
                    onAfterSetFields: function (g) {
                        me.mainform = g;
                        me.buttons = g.options.buttons;
                    }
                });
                me.setFormDefaultBtn();
            },
            //租借明细表
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    dateFormat: "yyyy-MM-dd hh:mm",
                    autoWidth: true,
                    delayLoad: true,
                    usePager: false,
                    validate: true,
                    columns: me.config.grid.columns,
                    dataAction: 'server',
                    toolbar: { group: "detlist" },
                    url: 'special/labor/GetLaborExchangeAppDetList',
                    parms: {
                        id: me.sid
                    },
                    sortName: 'SP_CODE',
                    sortOrder: 'desc',
                    width: '99%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: true,
                    clickToEdit: true,
                    onSuccess: function (data, g) {
                        //me.iframeloading.hide();
                    },
                    async: false
                });
                me.grid.isValid = true;
                me.loadToolbar();
            },
            //明细按钮组
            loadToolbar: function () {
                var me = this;
                me.ToolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "import":
                            me.import();
                            //me.grid.addEditRow({}, true);
                            break;
                        case "delete":
                            me.delete();
                            break;
                        default:
                            break;
                    }
                }
                //加载collect按钮
                LG.loadToolbar(me.grid, me.ToolbarBtnItemClick);
            },
            init: function () {
                var me = this;
                if (frameElement && frameElement.dialog) {
                    me.dialog = frameElement.dialog;
                    me.dialogData = me.dialog.get('data') || {};
                    if (me.dialogData.callback) me.callback = me.dialogData.callback;
                    if (me.dialogData.sid) me.sid = me.dialogData.sid;
                    if (me.dialogData.isView) me.isView = me.dialogData.isView === "1";
                }
                me.isView = false;
                me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.setGrid();
                me.loadData();
                return me;
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>

</html>
