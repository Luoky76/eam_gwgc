
<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title>劳保用品退换</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <div id="mainsearch" style="width: 98%">
        <form action="" id="formsearch" class="l-form">
        </form>
    </div>
    <form action="" id="mainform">
        <div id="maingrid">
        </div>
    </form>
    <script type="text/javascript">
        'use strict';
        var business = {
            exchangeType: [
                {
                    "ID": "1",
                    "TEXT": "换货",
                    "VALUE": "1",
                },
                {
                    "ID": "2",
                    "TEXT": "退货",
                    "VALUE": "2",
                },
                {
                    "ID": "3",
                    "TEXT": "退库",
                    "VALUE": "3",
                }
            ],
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            { display: "记录状态", name: "_search_AUDITING", dbname: "AUDITING", newline: false, upper: true, type: "select", options: { data: me.auditing } },
                            { display: "退换单号", name: "_search_EXCHANGE_CODE", dbname: "EXCHANGE_CODE", newline: false, upper: true, type: "text", options: {} },
                            { display: "申请部门", name: "_search_EXCHANGE_DEPT", dbname: "EXCHANGE_DEPT", newline: false, upper: true, type: "text", options: { data: me.dataCorp } },
                            { display: "申请人", name: "_search_EXCHANGE_USER", dbname: "EXCHANGE_USER", newline: false, upper: true, type: "text", options: { data: me.user } },
                            { display: "退换类型", name: "_search_EXCHANGE_TYPE", dbname: "EXCHANGE_TYPE", newline: false, upper: true, type: "select", options: { data: me.exchangeType } },
                        ]
                    },
                    grid: {
                        columns: [

                            { display: "记录状态", name: "AUDITING", width: 100, type: "select", editor: { type: 'select', data: me.auditing } },
                            { display: "主键", name: "EXCHANGE_ID", width: 100, type: "text", hide:true,editor: { type: 'text' } },
                            { display: "退换单号", name: "EXCHANGE_CODE", width: 100, type: "text", editor: { type: 'text' } },
                            { display: "退换日期", name: "EXCHANGE_DATE", width: 100, type: "date", editor: { type: 'date', format: "yyyy-MM-dd hh:mm" } },
                            { display: "申请部门", name: "EXCHANGE_DEPT", width: 100, type: "select", editor: { type: 'select', data: me.dataCorp } },
                            { display: "申请人", name: "EXCHANGE_USER", width: 100, type: "select", editor: { type: 'select', data: me.user } },
                            { display: "退换类型", name: "EXCHANGE_TYPE", width: 100, type: "select", editor: { type: 'select', data: me.exchangeType } },
                            { display: "退换原因", name: "EXCHANGE_REASON", width: 100, type: "text", editor: { type: 'text' } }
                        ]
                    }
                };
            },
            grid: null,
            searchForm: null,
            buttons: null,
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'special/labor/comboxdata',
                    loading: '正在获取中...',
                    success: function (data) {
                        me.auditing = data.Auditing;
                        me.user = data.User;
                        me.rentstate = data.RentState
                        me.dataCorp = data.Corp;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    autoWidth: true,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    usePager: false,
                    dataAction: 'local',
                    toolbar: { group: "main" },
                    url: 'special/labor/LaborExchangeList',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: 'AUDITING',
                    sortOrder: 'asc',
                    width: '98%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: false,
                    clickToEdit: false,
                    onBeforeEdit: function (editParm) {
                        switch (editParm.column.name) {
                            case "":
                                if (editParm.record.__status == "add") return true;
                                else return false;
                                break;
                        }
                    },
                    onSuccess: function (data, g) {
                        if (data && data.Rows) {
                            var rows = data.Rows || [];
                            for (var i = 0, len = rows.length; i < len; i++) {
                                var row = rows[i];
                                row.OLDROLEID = row.ROLEID;
                            }
                        }
                    },
                    rowAttrRender: function (rowdata, rowid) {
                        return "";
                    }
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "add":
                            me.add();
                            break;
                        case "modify":
                            me.modify();
                            break;
                        case "delete":
                            me.delete();
                            break;
                        case "submit":
                            me.submit();
                            break;
                        case "rentend":
                            me.rentend();
                            break;
                        case "save":
                            me.save();
                            break;
                        case "Excel":
                            $.ligerDialog.open({
                                url: "../System/Export.html?exporttype=xls",
                                modal: true
                            });
                            break;
                        case "Word":
                            $.ligerDialog.open({
                                url: "../System/Export.html?exporttype=doc",
                                modal: true
                            });
                            break;
                    }
                }
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            add: function () { //新增
                var me = this;
                $.ligerDialog.open({
                    width: 1400,
                    height: 800,
                    allowClose: true,
                    title: '[新增]',
                    url: "labor-exchange-edit.html?MenuNo=labor_exchange",
                    isHidden: false,
                    showMax: false,
                    showToggle: false,
                    showMin: false,
                    isResize: true,
                    slide: false,
                    onClosed: me.reload.bind(me),
                    data: { "sid": null }
                });
                //me.grid.addEditRow({}, true);
            },
            modify: function () { //修改
                var me = this;
                var selected = me.grid.getSelectedRow();
                if (!selected) {
                    LG.tip('请选择行!');
                    return;
                }
                var sid = selected.EXCHANGE_ID;
                $.ligerDialog.open({
                    width: 1400,
                    height: 800,
                    allowClose: true,
                    title: '[修改]',
                    url: "labor-exchange-edit.html?MenuNo=labor_exchange",
                    isHidden: false,
                    showMax: false,
                    showToggle: false,
                    showMin: false,
                    isResize: true,
                    slide: false,
                    onClosed: me.reload.bind(me),
                    data: { "sid": sid }
                });
            },
            save: function () { //保存
                var me = this;
                if (me.grid.endEdit() != false) {
                    if (!me.grid.isDataChanged) {
                        LG.showSuccess('无修改');
                        return;
                    }
                    if (!me.grid.validChangeRows()) return false;
                    var changeRow = me.grid.getChangedRows();
                    LG.ajax({
                        jsToken: true,
                        url: 'special/labor/LaborExchangeSave',
                        loading: '正在保存中...',
                        data: { request: changeRow, requestdet: null },
                        success: function () {
                            LG.showSuccess('保存成功');
                            me.grid.isDataChanged = false;
                            me.reload();
                        },
                        error: function (message) {
                            LG.showError(message);
                            me.reload();
                        }
                    });
                }

            },
            reload: function () { //刷新
                var me = this;
                me.buttons[0].click();
            },
            delete: function () { //删除
                var me = this;
                if (me.grid.endEdit() != false) {
                    var selected = me.grid.getSelectedRows();
                    if (selected.length > 0) {
                        $.ligerDialog.confirm('确定删除吗?', function (confirm) {
                            if (confirm) {
                                for (var i = 0, len = selected.length; i < len; i++) {
                                    me.grid.deleteRow(selected[i]);
                                }
                                me.save();
                            }
                        });
                    } else {
                        LG.tip('请选择行!');
                    }
                }
            },
            submit: function () {  //提交
                var me = this;
                var selected = me.grid.getSelectedRows();
                var dateSysDate = {};
                LG.getSysdate({ DateFormat: "yyyy-MM-dd HH:mm:ss" }, dateSysDate);
                selected.forEach(x => {
                    if (x.AUDITING == "0" ) {
                        me.grid.updateCell("EXCHANGE_DATE", dateSysDate.ID.format("yyyy-MM-dd HH:mm:ss"), x.__index)
                    }
                });
                me.save();
            },
   
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Word',
                        text: '导出Word',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-word-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch = $("#formsearch")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                    }
                });
            },
            init: function () {
                var me = this;
                me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.setGrid();
                me.reload();
                return me;
            }
        };
        business.init();
    </script>
</body>
</html>
