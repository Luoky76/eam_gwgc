
<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title>劳保人员清单</title>
    <script src="../../lib/LGboot.js"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <div id="mainsearch" style="width: 98%">
        <form action="" id="formsearch" class="l-form">
        </form>
    </div>
    <form action="" id="mainform">
        <div id="maingrid">
        </div>
    </form>
    <script type="text/javascript">
        'use strict';
        var sexselect = [{ "ID": 0, "TEXT": "男", "VALUE": "0" }, {"ID":1,"TEXT":"女","VALUE":"1"}]
        var business = {

            formLabelWidth: 120,
            formInputWidth: 180,
            getTextareaWidth: function () {
                var me = this;
                var fieldWidth = me.formLabelWidth + me.formInputWidth + 3;
                return Math.floor(($("#mainform").width() - 10) / fieldWidth) * fieldWidth - (me.formLabelWidth + 3);
            },
setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            { display: "姓名", name: "_search_USER_NAME", dbname: "USER_NAME", newline: false, upper: true, type: "text", options: {} },
                            { display: "部门名称", name: "_search_DEPT_NAME", dbname: "DEPT_NAME", newline: false, upper: true, type: "text", options: {} },
                            { display: "人员编码", name: "_search_USER_CODE", dbname: "USER_CODE", newline: false, upper: true, type: "text", options: {} },
                        ]
                    },

                    grid: {
                        columns: [
                            { display: "人员编码", name: "USER_CODE", width: 100, type: "text",  editor: { type: 'text'} },
                            { display: "姓名", name: "USER_NAME", width: 100, type: "text",  editor: { type: 'text'} },
                            { display: "部门编码", name: "DEPT_ID", width: 100, type: "text", editor: { type: 'text' }, hide: true },
                            {
                                display: "部门名称", name: "DEPT_NAME", width: 100, type: "select", editor: {
                                    type: 'select', data: me.Corp, onChangeValue: function (input, value, g) {
                                        if (value) {
                                            let dataText = g.data.filter(x => x.ID == g.selectedValue)[0]?.TEXT;
                                            let ID = g.data.filter(x => x.ID == g.selectedValue)[0]?.ID;
                                            g.options.editParm.record.DEPT_NAME = dataText;
                                            g.options.editParm.record.DEPT_ID = ID;
                                        }

                                        return ;

                                    }
                                }
                            },
                            { display: "人员ID", name: "USER_ID", width: 100, type: "text",hide:true, editor: { type: 'text'} },
                            //{ display: "部门ID", name: "DEPT_ID", width: 100, type: "text",  editor: { type: 'text'} },
                            { display: "性别", name: "SEX", width: 100, type: "select", editor: { type: 'select', data: sexselect } },
                            { display: "生日", name: "BIRTHDAY", width: 100, type: "date", editor: { type: 'date', format: "yyyy-MM-dd"} },
                            { display: "是否注销", name: "IS_NOVALID", width: 60, type: "chk", editor: { type: 'chkStr' } },
                            { display: "尺码数量", name: "Count", width: 100, type: "text", hide: true, editor: { type: 'text' } },
                            {
                                display: "尺码", name: "ROLE", isSort: false, width: 100, minWidth: 130, type: "text", align: "center", formatType: "select", format: {
                                    data: function () { return me.dataRole; }, split: ",", formatRender: function (value, rowdata, column) {
                                        var strHref = `javascript:business.laborSizeSelect('${rowdata.USER_ID}')`;
                                        var strUrl = `<a style=\"color:blue\" href="${strHref}">设置(${rowdata.Count??0})</a>`;
                                        return strUrl;
                                    }
                                }, export: function (value, rowdata, column) {//导出处理
                                    return this.options.formatters['select'](value, column, rowdata, function (value) {
                                        return value.join(",");
                                    });
                                }
                            },

                            //{ display: "生产系统人员ID", name: "USER_SID", width: 100, type: "text",  editor: { type: 'text'} }
                        ]
                    }
                };
            },
            grid: null,
            searchForm: null,
            buttons: null,
            Corp:[],
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'special/Labor/comboxdata',
                    loading: '正在获取中...',
                    success: function (data) {
                        me.Corp = data.Corp;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    autoWidth: true,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    usePager: false,
                    dataAction: 'server',
                    toolbar: { group: "master" },
                    url: 'special/Labor/laborUserList',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: 'USER_CODE',
                    sortOrder: 'asc',
                    width: '98%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: true,
                    clickToEdit: true,
                    onBeforeEdit: function (editParm) {
                        switch (editParm.column.name) {
                            case "DEPT_NAME":
                                break;
                        }
                    },
                    onSuccess: function (data, g) {
                        if (data && data.Rows) {
                            var rows = data.Rows || [];
                            for (var i = 0, len = rows.length; i < len; i++) {
                                var row = rows[i];
                                row.OLDROLEID = row.ROLEID;
                            }
                        }
                    },
                    rowAttrRender: function (rowdata, rowid) {
                        return "";
                    }
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "add":
                            me.add();
                            break;
                        case "modify":
                            me.modify();
                            break;
                        case "delete":
                            me.delete();
                            break;
                        case "save":
                            me.save();
                            break;
                        case "Excel":
                            $.ligerDialog.open({
                                url: window.gksybConfigs.getUrl("System/Export.html?exporttype=xls", window.gksybConfigs.urlBase),
                                modal: true
                            });
                            break;
                        case "Pdf":
                            $.ligerDialog.open({
                                url: window.gksybConfigs.getUrl("System/Export.html?exporttype=pdf", window.gksybConfigs.urlBase),
                                modal: true
                            });
                            break;
                    }
                }
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            add: function () { //新增
                var me = this;
                //$.ligerDialog.open({
                //    width: me.detailWidth,
                //    height: me.detailHeight,
                //    allowClose: true,
                //    title: '[新增]',
                //    url: "view-detail.html",
                //    isHidden: false,
                //    showMax: false,
                //    showToggle: false,
                //    showMin: false,
                //    isResize: true,
                //    slide: false,
                //    onClosed: me.reload.bind(me),
                //    data: { "sid": null }
                //});
                me.grid.addEditRow({}, true);
            },
            modify: function () { //修改
                var me = this;
                var selected = me.grid.getSelectedRow();
                if (!selected) {
                    LG.tip('请选择行!');
                    return;
                }
                var sid = selected.SID;
                $.ligerDialog.open({
                    width: me.detailWidth,
                    height: me.detailHeight,
                    allowClose: true,
                    title: '[修改]',
                    url: "view-detail.html",
                    isHidden: false,
                    showMax: false,
                    showToggle: false,
                    showMin: false,
                    isResize: true,
                    slide: false,
                    onClosed: me.reload.bind(me),
                    data: { "sid": sid }
                });
            },
            save: function () { //保存
                var me = this;
                if (me.grid.endEdit() != false) {
                    if (!me.grid.isDataChanged) {
                        LG.showSuccess('无修改');
                        return;
                    }
                    if (!me.grid.validChangeRows()) return false;
                    var changeRow = me.grid.getChangedRows();
                    LG.ajax({
                        jsToken: true,
                        url: 'special/Labor/laborUserSave',
                        loading: '正在保存中...',
                        data: changeRow,
                        success: function () {
                            LG.showSuccess('保存成功');
                            me.grid.isDataChanged = false;
                            me.reload();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }

            },
            reload: function () { //刷新
                var me = this;
                me.buttons[0].click();
            },
            delete: function () { //删除
                var me = this;
                if (me.grid.endEdit() != false) {
                    var selected = me.grid.getSelectedRows();
                    if (selected.length > 0) {
                        $.ligerDialog.confirm('确定删除吗?', function (confirm) {
                            if (confirm) {
                                for (var i = 0, len = selected.length; i < len; i++) {
                                    me.grid.deleteRow(selected[i]);
                                }
                                me.save();
                            }
                        });
                    } else {
                        LG.tip('请选择行!');
                    }
                }
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Pdf',
                        text: '??Pdf',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-pdf-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch = $("#formsearch")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    labelWidth: me.formLabelWidth,
                    inputWidth: me.formInputWidth,
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                    }
                });
            },
            laborSizeSelect: function (userID) {
                var me = this;
                $.ligerDialog.open({
                    width: 1400,
                    height: 800,
                    allowClose: true,
                    title: '尺码设置',
                    url: "labor-size.html?MenuNo=labor-user",
                    isHidden: false,
                    showMax: false,
                    showToggle: false,
                    showMin: false,
                    isResize: true,
                    slide: false,
                    onClosed: me.reload.bind(me),
                    data: { "sid": userID }
                });
            },

            init: function () {
                var me = this;
                me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.setGrid();
                me.reload();
                return me;
            }
        };
        business.init();
    </script>
</body>
</html>
