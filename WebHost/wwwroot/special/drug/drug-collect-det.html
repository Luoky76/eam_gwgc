<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title>药品采购登记明细</title>
    <script src="../../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%; overflow:auto;">
    <div id="mainform" style="width:97%;">
    </div>
    <div style="width: 94.5%;" class="l-form">
        <div class="l-form-container">
            <ul style="display: block; width: 100%;" id="ulGrid">
                <li style="width: 100%">
                    <div class="l-group" style="display: inline-block; width: 100%"><span>药品采购明细</span></div>
                    <div style="margin-bottom: 50px; width: 100%;" id="drug-collect-grid">
                    </div>
                </li>
                <li style="width: 100%">
                    <div class="l-group" style="display: inline-block; width: 100%"><span>药品采购需求明细</span></div>
                    <div style="margin-bottom: 50px; width: 100%;" id="drug-request-grid">
                    </div>
                </li>
            </ul>
        </div>
    </div>
    <script type="text/javascript">
        'use strict';
        var business = {
            setConfig: function () {
                var me = this;
                me.config = {
                    form: {
                        labelwidth: 220,
                        fields: [
                            {
                                display: "记录状态", name: "AUDITING", width: 300, type: "select", options: {
                                    type: "select",
                                    data: me.auditing,
                                    disabled: true
                                }
                            },
                            { display: "请购单号", name: "COLLECT_CODE", width: 300, type: "text", options: { disabled: true } },
                            { display: "请购日期", name: "CREATEDATE", width: 300, type: "date", options: { disabled: true } },
                            {
                                display: "采购人", name: "CREATE_USERID", width: 300, type: "select", options: {
                                    type: "select",
                                    data: me.user,
                                    disabled: true
                                }
                            },
                            { display: "采购部门", name: "DEPT_NAME", width: 300, type: "text", options: { disabled: true } },
                            { display: "采购方式", name: "COLLECT_METHOD", width: 300, type: "text", validate: { required: true }, options: {} },
                            { display: "物资分类", name: "COLLECT_SPTYPE", width: 300, type: "text", options: { disabled: true } },
                            { display: "总金额", name: "COLLECT_PRICE", width: 300, type: "float", options: { disabled: true } },
                            { display: "备注", name: "MEMO", newline: true, minWidth: 1147, type: "text", options: {} },
                            //隐藏
                            { display: "主键", name: "COLLECT_ID", width: 300, type: "hidden" },
                            { display: "采购部门ID", name: "DEPT_ID", width: 300, type: "hidden" },
                        ]
                    },
                    collectGrid: {
                        columns: [
                            { display: "物资编码", name: "SP_CODE", minWidth: 200, type: "text", editor: { type: 'text' } },
                            { display: "物资名称", name: "SP_NAME", minWidth: 200, type: "text", editor: { type: 'text' } },
                            { display: "物资型号", name: "SP_TYPE", minWidth: 200, type: "text", editor: { type: 'text' } },
                            { display: "制造厂", name: "FACTORY", minWidth: 200, type: "text", editor: { type: 'text' } },
                            { display: "采购数量", name: "COLLECT_NUM", minWidth: 100, type: "float", editor: { type: 'float' } },
                            { display: "计量单位", name: "UNIT", minWidth: 100, type: "text", editor: { type: 'text' } }
                            //隐藏
                            { display: "主键", name: "COLLECT_DET_ID", type: "text", hide: true },
                            { display: "物资请购单ID", name: "COLLECT_ID", type: "text", hide: true },
                            { display: "物资品种ID", name: "SP_ID", type: "text", hide: true },
                            { display: "需求计划明细ID", name: "REQUEST_DET_ID", type: "text", hide: true }
                        ]
                    },
                    requestGrid: {
                        columns: [
                            { display: "需求计划单号", name: "REQUEST_CODE", minWidth: 100, type: "text", editor: { type: 'text' } },
                            { display: "物资编码", name: "SP_CODE", minWidth: 100, type: "text", editor: { type: 'text' } },
                            { display: "物资名称", name: "SP_NAME", minWidth: 100, type: "text", editor: { type: 'text' } },
                            { display: "物资型号", name: "SP_TYPE", minWidth: 100, type: "text", editor: { type: 'text' } },
                            { display: "品牌", name: "BRAND", minWidth: 100, type: "text", editor: { type: 'text' } },
                            { display: "申请数量", name: "REQUEST_NUM", minWidth: 100, type: "float", editor: { type: 'float' } },
                            { display: "采购数量", name: "COLLECT_NUM", minWidth: 100, type: "float", editor: { type: 'float' } },
                            { display: "计量单位", name: "UNIT", minWidth: 100, type: "text", editor: { type: 'text' } },
                            { display: "采购金额", name: "COLLECT_MONEY", minWidth: 100, type: "float", editor: { type: 'float' } },
                            { display: "申请部门", name: "DEPT_NAME", minWidth: 100, type: "text", editor: { type: 'text' } },
                            { display: "申请部门ID", name: "DEPT_ID", minWidth: 100, type: "text", editor: { type: 'text' } },
                            { display: "申请人", name: "REQUEST_USER", minWidth: 100, type: "text", editor: { type: 'text' } },
                            { display: "申请人ID", name: "REQUEST_USERID", minWidth: 100, type: "text", editor: { type: 'text' } },
                            { display: "制造厂", name: "FACTORY", minWidth: 100, type: "text", editor: { type: 'text' } },
                            { display: "备注", name: "MEMO", minWidth: 100, type: "text", editor: { type: 'text' } },
                            //隐藏
                            { display: "主键", name: "COLLECT_REQUEST_ID", minWidth: 100, type: "text", hide: true },
                            { display: "备件请购单ID", name: "COLLECT_ID", minWidth: 100, type: "text", hide: true },
                            { display: "备件请购明细ID", name: "COLLECT_DET_ID", minWidth: 100, type: "text", hide: true },
                            { display: "需求计划明细ID", name: "REQUEST_DET_ID", minWidth: 100, type: "text", hide: true },
                            { display: "物资ID", name: "SP_ID", minWidth: 100, type: "text", hide: true },
                            { display: "含税单价(元)", name: "TAX_PRICE", minWidth: 100, type: "float", hide: true },
                            { display: "含税总金额(元)", name: "TAX_MONEY", minWidth: 100, type: "float", hide: true },
                            { display: "不含税单价(元)", name: "NOTAX_PRICE", minWidth: 100, type: "float", hide: true },
                            { display: "不含税总金额(元)", name: "NOTAX_MONEY", minWidth: 100, type: "float", hide: true },
                            { display: "是否全数购买", name: "IS_FULLBUY", minWidth: 100, type: "text", hide: true },
                        ]
                    }
                };
            },
            auditing: [],
            user: [],
            //获取下拉框数据
            loadComboxData: function () {
                var me = this;
                var dataControl = [];
                LG.ajax({
                    async: false,
                    url: 'Special/DrugCollect/ComboxData',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        me.auditing = data.Auditing;
                        me.user = data.User;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
                return dataControl;
            },
            //初始化
            init: function () {
                var me = this;
                debugger
                if (frameElement && frameElement.dialog) {
                    me.dialog = frameElement.dialog;
                    me.dialogData = me.dialog.get('data');
                    me.callback = me.dialogData.callback;
                    if (me.dialogData.sid != undefined) me.sid = me.dialogData.sid;
                    if (me.dialogData.isNew != undefined) me.isNew = me.dialogData.isNew;
                    if (me.dialogData.isView != undefined) me.isView = me.dialogData.isView;

                    //对于新增对话框，先生成并获取主键
                    if (me.isNew) {
                        LG.ajax({
                            async: false,
                            url: 'Material/ProviderAssessTask/CreatePrimaryKey',
                            loading: '正在获取中...',
                            data: {},
                            success: function (data, message) {
                                me.sid = data;
                            },
                            error: function (message) {
                                LG.showError(message);
                            }
                        });
                    }
                }

                //获取下拉框数据
                me.loadComboxData();
                //加载基础信息
                me.setConfig();
                me.setForm();
                me.loadData();

                //加载采购明细
                me.setCollectGrid();
                me.reloadCollect();

                //加载需求明细
                me.setRequestGrid();
                me.reloadRequest();

                return me;
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>

</html>
