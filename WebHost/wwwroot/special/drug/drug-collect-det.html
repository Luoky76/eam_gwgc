<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title>药品采购登记明细</title>
    <script src="../../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%; overflow:auto;">
    <div id="mainform" style="width:97%;">
    </div>
    <div style="width: 94.5%;" class="l-form">
        <div class="l-form-container">
            <ul style="display: block; width: 100%;" id="ulGrid">
                <li style="width: 100%">
                    <div class="l-group" style="display: inline-block; width: 100%"><span>药品采购明细</span></div>
                    <div style="margin-bottom: 50px; width: 100%;" id="drug-collect-grid">
                    </div>
                </li>
                <li style="width: 100%">
                    <div class="l-group" style="display: inline-block; width: 100%"><span>药品采购需求明细</span></div>
                    <div style="margin-bottom: 50px; width: 100%;" id="drug-request-grid">
                    </div>
                </li>
            </ul>
        </div>
    </div>
    <script type="text/javascript">
        'use strict';
        var business = {
            setConfig: function () {
                var me = this;
                me.config = {
                    form: {
                        labelwidth: 220,
                        fields: [

                        ]
                    },
                    collectGrid: {
                        columns: [

                        ]
                    },
                    requestGrid: {
                        columns: [

                        ]
                    }
                };
            },
            //初始化
            init: function () {
                var me = this;
                debugger
                if (frameElement && frameElement.dialog) {
                    me.dialog = frameElement.dialog;
                    me.dialogData = me.dialog.get('data');
                    me.callback = me.dialogData.callback;
                    if (me.dialogData.sid != undefined) me.sid = me.dialogData.sid;
                    if (me.dialogData.isNew != undefined) me.isNew = me.dialogData.isNew;
                    if (me.dialogData.isView != undefined) me.isView = me.dialogData.isView;

                    //对于新增对话框，先生成并获取主键
                    if (me.isNew) {
                        LG.ajax({
                            async: false,
                            url: 'Material/ProviderAssessTask/CreatePrimaryKey',
                            loading: '正在获取中...',
                            data: {},
                            success: function (data, message) {
                                me.sid = data;
                            },
                            error: function (message) {
                                LG.showError(message);
                            }
                        });
                    }
                }

                //获取下拉框数据
                me.loadComboxData();
                //加载基础信息
                me.setConfig();
                me.setForm();
                me.loadData();

                //加载采购明细
                me.setCollectGrid();
                me.reloadCollect();

                //加载需求明细
                me.setRequestGrid();
                me.reloadRequest();

                return me;
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>

</html>
