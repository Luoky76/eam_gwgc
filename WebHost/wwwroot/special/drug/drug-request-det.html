<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title>药品需求登记</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%; overflow:auto;">
    <form id="mainform" style="width:97%;">
    </form>
    <div style="width: 94.5%;" class="l-form">
        <div class="l-form-container">
            <div class="l-group" style="width: 100%;"><span>药品需求明细</span></div>
            <ul style="display: block; width: 100%;" id="ulGrid">
                <li style="width: 100%;">
                    <div style="margin-bottom: 50px; width: 100%;" id="det-grid">
                    </div>
                </li>
            </ul>
        </div>
    </div>
    <script type="text/javascript">
        'use strict';
        var business = {
            formLabelWidth: 120,
            formInputWidth: 180,
            getTextareaWidth: function () {
                var me = this;
                var fieldWidth = me.formLabelWidth + me.formInputWidth + 3;
                return Math.floor(($("#mainform").width() - 10) / fieldWidth) * fieldWidth - (me.formLabelWidth + 3);
            },
            setConfig: function () {
                var me = this;
                me.config = {
                    form: {
                        fields: [
                            {
                                display: "记录状态", name: "AUDITING", width: me.formInputWidth, type: "select", options: {
                                    type: "select",
                                    data: me.Auditing,
                                    disabled: true
                                }
                            },
                            { display: "需求计划单号", name: "REQUEST_CODE", width: me.formInputWidth, type: "text", options: { disabled: true } },
                            { display: "申请日期", name: "CREATEDATE", width: me.formInputWidth, type: "string", options: { disabled: true } },
                            {
                                display: "所属月份", name: "REQUEST_MONTH", width: me.formInputWidth, type: "select", validate: { required: true }, options: {
                                    type: "select",
                                    data: me.month
                                }
                            },
                            {
                                display: "所属年份", name: "REQUEST_YEAR", width: me.formInputWidth, type: "select", validate: { required: true }, options: {
                                    type: "select",
                                    data: me.year
                                }
                            },
                            {
                                display: "申请人", name: "CREATE_USERID", width: me.formInputWidth, type: "select", options: {
                                    type: "select",
                                    data: me.User,
                                    disabled: true
                                }
                            },
                            { display: "申请部门", name: "DEPT_NAME", width: me.formInputWidth, type: "text", options: { disabled: true } },
                            {
                                display: "港内/港外", name: "POSITION", width: me.formInputWidth, type: "select", validate: { required: true }, options: {
                                    type: "select",
                                    data: me.position
                                }
                            },
                            {
                                display: "类别", name: "REQUEST_TYPE", width: me.formInputWidth, type: "select", validate: { required: true }, options: {
                                    type: "select",
                                    data: me.RequestType
                                }
                            },
                            { display: "备注", name: "MEMO", width: me.getTextareaWidth(), newline: "true", type: "textarea", options: {} },
                            //隐藏
                            { display: "主键", name: "REQUEST_ID", width: me.formInputWidth, type: "hidden" },
                            { display: "申请部门ID", name: "DEPT_ID", width: me.formInputWidth, type: "hidden" },
                            { display: "申请部门编号", name: "DEPT_CODE", width: me.formInputWidth, type: "hidden" },
                            { display: "物资归属船舶ID", name: "SHIP_ID", width: me.formInputWidth, type: "hidden" },
                            { display: "物资归属船舶", name: "SHIP_NAME", width: me.formInputWidth, type: "hidden" },
                            { display: "物资归属船舶编码", name: "SHIP_CODE", width: me.formInputWidth, type: "hidden" },
                            { display: "二级单位ID", name: "SEC_DEPTID", width: me.formInputWidth, type: "hidden" },
                            { display: "二级单位", name: "SEC_DEPT", width: me.formInputWidth, type: "hidden" },
                            { display: "格式号", name: "FORM_ID", width: me.formInputWidth, type: "hidden" },
                            { display: "来源单号", name: "SRC_CODE", width: me.formInputWidth, type: "hidden" },
                            { display: "申请人", name: "REQUEST_USER", width: me.formInputWidth, type: "hidden" },
                            { display: "修改人ID", name: "MODIFY_USERID", width: me.formInputWidth, type: "hidden" },
                            { display: "修改时间", name: "MODIFYDATE", width: me.formInputWidth, type: "hidden" }
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "物资编号", name: "SP_CODE", minWidth: 100, type: "text" },
                            { display: "物资名称", name: "SP_NAME", minWidth: 100, type: "text" },
                            { display: "品牌、厂家", name: "PRODUCE", minWidth: 100, type: "text" },
                            {
                                display: "申请数量", name: "REQUEST_NUM", minWidth: 100, type: "float", editor: {
                                    type: 'float',
                                    onChanged: function (record) {
                                        if (record.value < 0) {
                                            $('#REQUEST_NUM').val(0);
                                        }
                                    }
                                }
                            },
                            { display: "剩余数量", name: "LEFTOVER", minWidth: 100, type: "float" },
                            { display: "计量单位", name: "UNIT", minWidth: 100, type: "text" },
                            { display: "物资型号", name: "SP_SIZE", minWidth: 100, type: "text" },
                            { display: "用途", name: "PURPOSE", minWidth: 200, type: "text", editor: { type: 'text' } },
                            { display: "备注", name: "MEMO", minWidth: 200, type: "text", editor: { type: 'text' } },
                            //隐藏
                            { display: "主键", name: "REQUEST_DET_ID", width: 100, type: "text", hide: true },
                            { display: "物资需求ID", name: "REQUEST_ID", width: 100, type: "text", hide: true },
                            { display: "物资品种ID", name: "SP_ID", width: 100, type: "text", hide: true },
                            { display: "物资类别ID", name: "TYPE_ID", width: 100, type: "text", hide: true },
                            { display: "物资类别名称", name: "TYPE_NAME", width: 100, type: "text", hide: true },
                            { display: "物资类别编码", name: "TYPE_CODE", width: 100, type: "text", hide: true }
                        ]
                    }
                };
            },
            mainform: null,
            buttons: null,
            //主表主键
            sid: "",
            isNew: false,
            isView: true,
            Auditing: [],
            User: [],
            RequestType: [],
            position: [{ ID: "1", TEXT: "港内" }, { ID: "2", TEXT: "港外" }],
            month: [],
            year: [],
            loadMonth: function () {
                var me = this;
                for (var i = 1; i <= 12; ++i) {
                    me.month.push({ ID: i, TEXT: i + "月" });
                }
            },
            loadYear: function () {
                var me = this;
                var date = new Date();
                var currentYear = date.getFullYear();
                for (var i = 2019; i <= currentYear; ++i) {
                    me.year.push({ ID: i, TEXT: i + "年" });
                }
            },
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'Special/DrugRequest/ComboxData',
                    loading: '正在获取中...',
                    success: function (data) {
                        me.Auditing = data.Auditing;
                        me.User = data.User;
                        me.RequestType = data.RequestType;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });

                //加载其它下拉数据
                me.loadMonth();
                me.loadYear();
            },
            loadData: function () {
                var me = this;
                if (me.isNew) {
                    var originData = {};
                    LG.ajax({
                        async: false,
                        url: 'Common/General/CreatePrimaryKey',
                        loading: '正在获取中...',
                        success: function (data, message) {
                            me.sid = data;
                            originData["REQUEST_ID"] = data;
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                    $.extend(originData, {
                        AUDITING: "0",
                        DEPT_ID: window.session.Corp.CorpID,
                        DEPT_NAME: window.session.Corp.CName,
                        DEPT_CODE: window.session.Corp.CNO,
                        REQUEST_USER: window.session.RealName,
                        CREATE_USERID: window.session.UserID
                    });
                    me.mainform.setOrginData(originData);
                }
                else {
                    LG.ajax({
                        async: false,
                        url: 'Special/DrugRequest/Get',
                        loading: '正在获取中...',
                        data: { id: me.sid },
                        success: function (data, message) {
                            me.mainform.setOrginData(data);
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                    if (me.isView) {
                        me.mainform.setReadonly(true);
                    }
                }
                me.mainform.focus();
            },
            save: function (isAsync = true) { //保存
                var me = this;
                if (!me.isNew && $.isEmptyObject(me.mainform.getChanges())) {
                    LG.showSuccess('无修改');
                    return;
                }
                if (!me.mainform.valid()) {
                    me.mainform.showInvalid();
                    return;
                }
                function handle(data) {
                    data.GRID = encrypt(data.GRID);
                    data.SEARCH = encrypt(data.SEARCH);
                    data.FORM = encrypt(data.FORM);
                    return data;
                }
                var data = handle(me.mainform.getData());
                var original = handle(me.mainform.getOrginData());
                var changeRow = new Object();
                if (me.isNew) {
                    changeRow["added"] = [data];
                }
                else {
                    changeRow["updated"] = [data];
                    changeRow["original"] = [original];
                }
                LG.ajax({
                    jsToken: true,
                    url: 'Special/DrugRequest/Save',
                    loading: '正在保存中...',
                    data: changeRow,
                    async: isAsync,
                    success: function () {
                        LG.showSuccess('保存成功', function () {
                            //location.reload(true);
                            //主表保存过后变为修改模式
                            me.isNew = false;
                            me.loadData();
                        });
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            close: function (skipConfirm) {
                var me = this;
                function inner(callback) {
                    if (!skipConfirm && (!$.isEmptyObject(me.mainform.getChanges()) || me.grid.isDataChanged)) {
                        $.ligerDialog.confirm($.ligerDefaults.GridString.isContinueByDataChanged, function (confirm) {
                            if (confirm) {
                                if (callback) callback(2);
                            }
                            else {
                                if (callback) callback(0);
                            }
                        });
                        if (callback) return callback(-1);
                        return false;
                    }
                    if (callback) return callback(1);
                    return true;
                }
                inner(function (status) {
                    if (status > 0) {
                        if (me.dialog) {
                            me.dialog.close();
                            return;
                        }
                        var win = parent || window;
                        if (win.closeCurrentTab) win.closeCurrentTab();
                        else win.close();
                    }
                });
            },
            setFormDefaultBtn: function () {
                var me = this;
                //表单底部按钮
                var buttons = [];
                buttons.push({
                    text: '关闭',
                    onclick: function () {
                        var me = this;
                        me.close(false);
                    }.bind(me)
                });
                if (!me.isView) buttons.push({
                    text: '保存',
                    icon: 'fa fa-save',
                    onclick: function () {
                        //子表有修改而未保存时，询问是否保存子表
                        if (me.grid.isDataChanged) {
                            $.ligerDialog.confirm("药品需求明细未保存，是否保存？", function (confirm) {
                                if (confirm) {
                                    me.saveGrid();
                                }
                                else {
                                    me.save();
                                }
                            });
                        }
                        else {
                            me.save();
                        }
                    }.bind(me)
                });

                LG.addFormButtons(buttons);
                me.formButtons = buttons;
            },
            setForm: function () {
                var me = this;
                me.config.form.fields.removeNull();
                var $mainform = $("#mainform")
                //搜索表单应用ligerui样式
                me.mainform = $mainform.ligerForm({
                    labelWidth: me.formLabelWidth,
                    inputWidth: me.formInputWidth,
                    EnterMoveNextControl: true,
                    labelAlign: 'right',
                    space: 3,
                    validate: true,
                    fields: me.config.form.fields,
                    labelWidth: me.formLabelWidth,
                    readonly: me.isView,
                    onAfterSetFields: function (g) {
                        me.mainform = g;
                        me.buttons = g.options.buttons;
                    }
                });
                me.setFormDefaultBtn();
            },
            grid: null,
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#det-grid").ligerGrid({
                    dateFormat: "yyyy-MM-dd hh:mm",
                    autoWidth: true,
                    delayLoad: true,
                    usePager: false,
                    columns: me.config.grid.columns,
                    dataAction: 'server',
                    toolbar: {},
                    url: 'Special/DrugRequestDet/GetCertainRequest',
                    parms: {
                        requestId: me.sid
                    },
                    sortName: 'SP_NAME',
                    sortOrder: 'asc',
                    width: '99%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: !me.isView,
                    clickToEdit: true,
                    onSuccess: function (data, g) {
                        //me.iframeloading.hide();
                    }
                });
                me.grid.isValid = true;
                if (!me.isView) {
                    me.loadToolbar();
                }
                me.bindGridEvent();
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Pdf',
                        text: '??Pdf',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-pdf-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reloadGrid();
                            break;
                        case "import":
                            //导入前需要先保存主表
                            if (me.isNew || !$.isEmptyObject(me.mainform.getChanges())) {
                                $.ligerDialog.confirm("导入前需先保存主表，是否保存？", function (confirm) {
                                    if (confirm) {
                                        me.save();
                                    }
                                });
                            }
                            else me.importGrid();
                            break;
                        case "delete":
                            me.deleteGrid();
                            break;
                        case "save":
                            me.saveGrid();
                            break;
                        case "Excel":
                            $.ligerDialog.open({
                                url: window.gksybConfigs.getUrl("System/Export.html?exporttype=xls&MenuNo=" + me.menuNo, window.gksybConfigs.urlBase),
                                modal: true
                            });
                            break;
                        case "Pdf":
                            $.ligerDialog.open({
                                url: window.gksybConfigs.getUrl("System/Export.html?exporttype=pdf&MenuNo=" + me.menuNo, window.gksybConfigs.urlBase),
                                modal: true
                            });
                            break;
                        default:
                            break;
                    }
                }
                //加载detail按钮
                me.grid.toolbarManager.options.group = 'detail';
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            //刷新
            reloadGrid: function () {
                var me = this;
                me.grid.loadData();
            },
            //新增
            addGrid: function (row = {}) {
                var me = this;
                $.extend(row, {
                    REQUEST_ID: me.sid
                });
                me.grid.addEditRow(row, true);
            },
            //导入
            importGrid: function () {
                var me = this;
                var gridData = me.grid.getData();
                var gridKeys = [];
                for (var item of gridData) {
                    gridKeys.push(item.SP_ID);
                }
                var dataOptions = {
                    values: gridKeys,
                    options: {
                        url: 'Special/DrugLimit/ExtendList',
                        parms: { requestId: me.sid },
                        sortName: 'SP_NAME',
                        rowKey: "SP_ID",
                        columns: [
                            { display: "物资编号", name: "SP_CODE", width: 200, type: "text" },
                            { display: "物资名称", name: "SP_NAME", width: 200, type: "text" },
                            { display: "剩余数量", name: "LEFTOVER", width: 200, type: "float" },
                            { display: "计量单位", name: "UNIT", width: 200, type: "text" },
                            { display: "物资型号", name: "SP_SIZE", width: 200, type: "text" },
                        ]
                    },
                    fields: [
                        { display: "物资名称", name: "SP_NAME", width: 200, type: "text" }
                    ],
                    callback: function (values, rows) {
                        var currentSet = new Set(gridKeys);
                        for (let item of rows) {
                            if (!currentSet.has(item.SP_ID)) {
                                item.REQUEST_NUM = 0;
                                me.addGrid(item);
                            }
                        }
                        me.saveGrid();
                    }
                }
                $.ligerDialog.open({
                    width: 1300,
                    height: 400,
                    title: '挑选药品',
                    url: window.gksybConfigs.urlBase + "popup-select/common.html",
                    isResize: true,
                    slide: false,
                    data: dataOptions
                });
            },
            //删除
            deleteGrid: function () {
                var me = this;
                if (me.grid.endEdit() != false) {
                    var selected = me.grid.getSelectedRows();
                    if (selected.length > 0) {
                        $.ligerDialog.confirm('确定删除吗?', function (confirm) {
                            if (confirm) {
                                me.grid.deleteSelectedRow();
                                me.saveGrid();
                            }
                        });
                    } else {
                        LG.tip('请选择行!');
                    }
                }
            },
            //保存前验证
            vertifyBeforeSave: function () {
                var me = this;
                me.grid.endEdit();
                var formData = me.mainform.getData();
                var girdData = me.grid.getData();
                for (let item of girdData) {
                    //除临时需求外，不允许需求量超过剩余量
                    if (formData.REQUEST_TYPE != "3" && item.REQUEST_NUM > item.LEFTOVER) {
                        LG.showError('药品' + item.SP_NAME + '的需求量超过剩余量！');
                        return false;
                    }
                    //不允许负数需求量
                    if (item.REQUEST_NUM < 0) {
                        LG.showError('药品' + item.SP_NAME + '的需求量小于零！');
                        return false;
                    }
                }
                return true;
            },
            //保存
            saveGrid: function () {
                var me = this;
                //未通过验证时停止保存
                if (!me.vertifyBeforeSave()) return;

                if (me.grid.endEdit() != false) {
                    if (!me.grid.isDataChanged) {
                        LG.showSuccess('无修改');
                        return;
                    }
                    if (!me.grid.validChangeRows()) return false;
                    var changeRow = me.grid.getChangedRows();
                    LG.ajax({
                        jsToken: true,
                        url: 'Special/DrugRequestDet/Save',
                        data: { requestId: me.sid },
                        loading: '正在保存中...',
                        data: changeRow,
                        success: function () {
                            var me = this;
                            //子表已保存，主表尚未保存时，保存主表
                            if (!$.isEmptyObject(me.mainform.getChanges())) {
                                me.save();
                            }
                            else {
                                LG.showSuccess('保存成功');
                            }
                            me.grid.isDataChanged = false;
                            me.reloadGrid();
                        }.bind(me),
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }
            },
            init: function () {
                var me = this;
                if (frameElement && frameElement.dialog) {
                    me.dialog = frameElement.dialog;
                    me.dialogData = me.dialog.get('data') || {};
                    if (me.dialogData.callback) me.callback = me.dialogData.callback;
                    if (me.dialogData.sid) me.sid = me.dialogData.sid;
                    if (me.dialogData.hasOwnProperty('isView')) me.isView = me.dialogData.isView;
                    if (me.dialogData.hasOwnProperty('isNew')) me.isNew = me.dialogData.isNew;
                }

                me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.loadData();

                //加载明细表
                me.setGrid();
                me.reloadGrid();

                return me;
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>

</html>
