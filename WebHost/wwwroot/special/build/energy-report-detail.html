            loadData: function () {
                var me = this;
                function inner() {
                    var data = me.mainform.getData();
                    LG.getFormCombChanges(data, me.orginData, true);
                    delete me.orginData;
                    me.orginData = data;
                }
                if (me.isNew) {
                    me.mainform.setData({});
                    inner();
                }
                else {
                    LG.ajax({
                        async: false,
                        url: 'Special/EnergyReport/Get',
                        loading: '正在获取中...',
                        data: { id: me.sid },
                        success: function (data, message) {
                            data.OLDMODIFYDATE = data.MODIFYDATE;
                            me.mainform.setData(data);
                            inner();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                    if (me.isView) {
                        me.mainform.setReadonly(true);
                    }
                }
                var input = me.mainform.getEditor(me.config.form.fields[0].name).inputText;
                input.focus();
                input.select();
            },
            save: function () { //保存
                var me = this;
                if (!me.mainform.valid()) {
                    me.mainform.showInvalid();
                    return;
                }
                function handle(data) {
                    data.GRID = encrypt(data.GRID);
                    data.SEARCH = encrypt(data.SEARCH);
                    data.FORM = encrypt(data.FORM);
                    return data;
                }
                var data = handle(me.mainform.getData());
                var original = handle(me.orginData);
                var changeRow = new Object();
                if (me.isNew) {
                    changeRow["added"] = [data];
                }
                else {
                    changeRow["updated"] = [data];
                    changeRow["original"] = [original];
                }
                LG.ajax({
                    jsToken: true,
                    url: 'Special/EnergyReport/Save',
                    loading: '正在保存中...',
                    data: changeRow,
                    success: function () {
                        LG.showSuccess('保存成功', function () {
                            //location.reload(true);
                            if (me.dialog) me.dialog.close();
                        });
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            close: function () {
                var me = this;
                function inner(callback) {
                    var data = me.mainform.getData();
                    var updateFields = LG.getFormCombChanges(data, me.orginData, true);
                    if (updateFields) {
                        $.ligerDialog.confirm($.ligerDefaults.GridString.isContinueByDataChanged, function (confirm) {
                            if (confirm) {
                                if (callback) callback(2);
                            }
                            else {
                                if (callback) callback(0);
                            }
                        });
                        if (callback) return callback(-1);
                        return false;
                    }
                    if (callback) return callback(1);
                    return true;
                }
                inner(function (status) {
                    if (status > 0) {
                        if (me.dialog) me.dialog.close();
                        if (me.callback) me.callback(false);
                    }
                });
            },

                var fsc_qy1 = parseFloat(d.NONPRODUCTION_GASOLINE_MONEY == '' ? '0' : d.NONPRODUCTION_GASOLINE_MONEY);//汽油
                var fsc_zy1 = parseFloat(d.NONPRODUCTION_HEAVY_OIL_MONEY == '' ? '0' : d.NONPRODUCTION_HEAVY_OIL_MONEY);//重油
                var fsc_d1 = parseFloat(d.NONPRODUCTION_ELECTRIC_MONEY == '' ? '0' : d.NONPRODUCTION_ELECTRIC_MONEY);//电

                //完成生产量
                var scl = parseFloat(d.FINISH_PEOPLE_NUM == '' ? '0' : d.FINISH_PEOPLE_NUM);//万TEU、万人、艘次
                var sc2 = parseFloat(d.FINISH_TONS == '' ? '0' : d.FINISH_TONS);//吨标煤/万吨
                var sc3 = parseFloat(d.FINISH_MONEY == '' ? '0' : d.FINISH_MONEY);//吨标煤/万元

                //其他能耗
                var qt_d = parseFloat(d.OTHER_ELECTRIC_WATT_HOUR == '' ? '0' : d.OTHER_ELECTRIC_WATT_HOUR);//其它电耗
                var qt_y = parseFloat(d.OTHER_OIL_TONS == '' ? '0' : d.OTHER_OIL_TONS);//其它油耗
                var qt_sr = parseFloat(d.OTHER_INCOME == '' ? '0' : d.OTHER_INCOME);//其它收入

                //计算
                //生产小计
                var count_sc = sc_cy * 1.4571 + sc_qy * 1.4714 + sc_zy * 3 + sc_d * 0.1229 + sc_trq * 1.2143;
                var count_sc1 = sc_cy1 + sc_qy1 + sc_zy1 + sc_d1 + sc_trq1;
                m.setData({ "PRODUCTION_TOTAL_TONS": count_sc });
                m.setData({ "PRODUCTION_TOTAL_MONEY": count_sc1 });

                //非生产小计
                var count_fsc = fsc_cy * 1.4571 + fsc_qy * 1.4714 + fsc_zy * 3 + fsc_d * 0.1229;
                var count_fsc1 = fsc_cy1 + fsc_qy1 + fsc_zy1 + fsc_d1;
                m.setData({ "NONPRODUCTION_TOTAL_TONS": count_fsc });
                m.setData({ "NONPRODUCTION_TOTAL_MONEY": count_fsc1 });

                //综合能耗
                m.setData({ "COMPRE_DIESEL_OIL_TONS": sc_cy + fsc_cy });
                m.setData({ "COMPRE_GASOLINE_TONS": sc_qy + fsc_qy });
                m.setData({ "COMPRE_HEAVY_OIL_TONS": sc_zy + fsc_zy });
                m.setData({ "COMPRE_ELECTRIC_TONS": sc_d + fsc_d });
                m.setData({ "COMPRE_NATURAL_GAS_TONS": sc_trq });

                m.setData({ "COMPRE_DIESEL_OIL_MONEY": sc_cy1 + fsc_cy1 });
                m.setData({ "COMPRE_GASOLINE_MONEY": sc_qy1 + fsc_qy1 });
                m.setData({ "COMPRE_HEAVY_OIL_MONEY": sc_zy1 + fsc_zy1 });
                m.setData({ "COMPRE_ELECTRIC_MONEY": sc_d1 + fsc_d1 });
                m.setData({ "COMPRE_NATURAL_GAS_MONEY": sc_trq1 });

                m.setData({ "COMPRE_TOTAL_TONS": count_sc + count_fsc });
                m.setData({ "COMPRE_TOTAL_MONEY": count_sc1 + count_fsc1 });

                //其它能耗
                m.setData({ "OTHER_ELECTRIC_TONS": qt_d * 0.1229 });
                m.setData({ "OTHER_OIL_TONS_COAL": qt_y * 1.4571 });
                var count_qtAll = qt_d * 0.1229 + qt_y * 1.4571;
                m.setData({ "OTHER_TOTAL": count_qtAll });
                var count_qt_dh = qt_sr == 0 ? 0 : Math.round((count_qtAll / qt_sr) * 10000) / 10000;
                m.setData({ "OTHER_OUTPUT_VALUE": count_qt_dh });

                //综合能源单耗
                var zh_dh_c = scl == 0 ? 0 : Math.round(((count_sc + count_fsc - count_qtAll) / scl) * 10000) / 10000;
                var zh_dh_d = sc2 == 0 ? 0 : Math.round(((count_sc + count_fsc - count_qtAll) / sc2) * 10000) / 10000;
                var zh_dh_e = sc3 == 0 ? 0 : Math.round(((count_sc + count_fsc) / sc3) * 10000) / 10000;
                m.setData({ "COMPRE_COAL_C": zh_dh_c });
                m.setData({ "COMPRE_COAL_D": zh_dh_d });
                m.setData({ "COMPRE_COAL_E": zh_dh_e });

            },
            init: function () {
                var me = this;
                if (frameElement && frameElement.dialog) {
                    me.dialog = frameElement.dialog;
                    me.dialogData = me.dialog.get('data');
                    me.callback = me.dialogData.callback;
                    if (me.dialogData.sid) me.sid = me.dialogData.sid
                    if (me.dialogData.pid) me.pid = me.dialogData.pid
                    me.isView = me.dialogData.isView === "1";
                }
                if ((me.sid || "0") === "0") me.sid = "";
                me.isNew = (me.sid === "");
                me.isView = (me.dialogData.isView || "" === "1") === "1";
                me.setConfig();
                me.setForm();
                me.loadData();
                return me;
            }
        };
        business.init();
    </script>
</body>

</html>
