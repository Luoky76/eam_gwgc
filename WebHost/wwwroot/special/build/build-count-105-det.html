
<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title> 明细</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <form id="mainform" style="margin-bottom: 50px">
    </form>
    <script type="text/javascript">
        'use strict';
        var business = {
            formLabelWidth: 120,
            formInputWidth: 180,
            getTextareaWidth: function () {
                var me = this;
                var fieldWidth = me.formLabelWidth + me.formInputWidth + 3;
                return Math.floor(($("#mainform").width() - 10) / fieldWidth) * fieldWidth - (me.formLabelWidth + 3);
            },
            menuNo: getQueryStringByName("MenuNo"),
            dialogData: {},
            isView: true,
            sid: getQueryStringByName("sid"),
            dataCorp: [],
            shipinfo: [],
            setConfig: function () {
                var me = this;
                me.config = {
                    form: {
                        fields: [
                            { display: "主键", name: "BUILD_ID", type: "hidden" },
                            { display: "日期", name: "STARTDATE", width: me.formInputWidth, type: "date", validate: { required: true }, options: {}, group: "基础信息" },
                            { display: "船舶名称", name: "DEVICE_NAME", width: me.formInputWidth, type: "text", options: {}, editor: { disabled: true } },
                            { display: "设备ID", name: "DEVICE_ID", width: me.formInputWidth, type: "hidden", options: {} },

                            { display: "作业量（万元）", name: "WORK_INCOME", newline: true, width: me.formInputWidth, type: "float", options: {}, group: "作业量" },

                            { display: "作业时间", name: "WORK_TIME", width: me.formInputWidth, type: "duration", options: {}, group: "施工时间（小时:分钟）" },
                            { display: "锚泊时间", name: "ANCHOR_TIME", width: me.formInputWidth, type: "duration", options: {} },

                            { display: "检修时间", name: "REPAIRTIME", newline: true, width: me.formInputWidth, type: "duration", options: {}, group: "停工时间（小时:分钟）" },
                            { display: "天气影响", name: "WEATHEREFFECT", width: me.formInputWidth, type: "duration", options: {} },
                            { display: "待工", name: "WAIT_WORK", width: me.formInputWidth, type: "duration", options: {} },

                            { display: "运行时间", name: "MAIN_ENGINE_RUNTIME", width: me.formInputWidth, type: "duration", options: {}, group: "主机运行时间（小时:分钟）" },
                            { display: "累计时间", name: "MAIN_ENGINE_CUMTIME", width: me.formInputWidth, type: "duration", options: { disabled: true } },

                            { display: "运行时间", name: "MAIN_RUNTIME", width: me.formInputWidth, type: "duration", options: {}, group: "发电机运行时间（小时:分钟）" },
                            { display: "累计时间", name: "MAIN_CUMTIME", width: me.formInputWidth, type: "duration", options: { disabled: true } },

                            { display: "消耗(吨)", name: "DAILYCONSUMPTION", width: me.formInputWidth, type: "float", options: {}, group: "淡水" },
                            { display: "补充(吨)", name: "SUPPLEMENT", width: me.formInputWidth, type: "float", options: {} },
                            { display: "库存(吨)", name: "STOCK", width: me.formInputWidth, type: "float", options: { disabled: true } },
                            
                            { display: "消耗(吨)", name: "SUBTOTAL", width: me.formInputWidth, type: "float", options: {}, group: "柴油" },
                            { display: "补充(吨)", name: "SUPPLEMENT2", width: me.formInputWidth, type: "float", options: {} },
                            { display: "库存(吨)", name: "STOCK2", width: me.formInputWidth, type: "float", options: { disabled: true } },

                            { display: "消耗(吨)", name: "LUBRICATE", newline: true, width: me.formInputWidth, type: "float", options: { precision: 3 }, group: "滑油" },
                            { display: "补充(吨)", name: "LUBRICATE_SUPPLEMENT", width: me.formInputWidth, type: "float", options: { precision: 3 } },
                            { display: "库存(吨)", name: "LUBRICATE_STOCK", width: me.formInputWidth, type: "float", options: { precision: 3, disabled: true } },

                            { display: "简要说明", name: "MEMO", newline: true, width: me.getTextareaWidth(), type: "textarea", options: {}, group: "其它信息" }
                        ]
                    }
                };
            },
            mainform: null,
            buttons: null,
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'Special/Build/ComboxData',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        me.shipinfo = data.shipInfo;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            sum: function (zhu, fu, ban) {
                var total = Number(zhu) + Number(fu) + Number(ban);
                $('#SUBTOTAL').val(total);
            },
            loadData: function () {
                var me = this;
                if (!me.sid) {
                    me.mainform.setOrginData({ DEVICE_ID: "1701416739972247552", DEVICE_NAME: "厦港工105" });
                }
                else {
                    LG.ajax({
                        async: false,
                        url: 'Special/Build/GET',
                        loading: '正在获取中...',
                        data: { id: me.sid },
                        success: function (data, message) {
                            me.mainform.setOrginData(data[0]);
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                    if (me.isView) {
                        me.mainform.setReadonly(true);
                    }
                }
                me.mainform.focus();
            },
            save: function () { //保存
                var me = this;
                if ($.isEmptyObject(me.mainform.getChanges())) {
                    LG.showSuccess('无修改');
                    return;
                }
                if (!me.mainform.valid()) {
                    me.mainform.showInvalid();
                    return;
                }
                function handle(data) {
                    return data;
                }
                var data = handle(me.mainform.getData());
                var original = handle(me.mainform.getOrginData());
                var changeRow = new Object();
                if (!me.sid) {
                    changeRow["added"] = [data];
                }
                else {
                    changeRow["updated"] = [data];
                    changeRow["original"] = [original];
                }
                LG.ajax({
                    jsToken: true,
                    url: 'Special/Build/Save',
                    loading: '正在保存中...',
                    data: { request: changeRow },
                    success: function () {
                        LG.showSuccess('保存成功', function () {
                            if (me.dialog) me.dialog.close();
                        });
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            close: function (skipConfirm) {
                var me = this;
                function inner(callback) {
                    if (!skipConfirm && !$.isEmptyObject(me.mainform.getChanges())) {
                        $.ligerDialog.confirm($.ligerDefaults.GridString.isContinueByDataChanged, function (confirm) {
                            if (confirm) {
                                if (callback) callback(2);
                            }
                            else {
                                if (callback) callback(0);
                            }
                        });
                        if (callback) return callback(-1);
                        return false;
                    }
                    if (callback) return callback(1);
                    return true;
                }
                inner(function (status) {
                    if (status > 0) {
                        if (me.dialog) {
                            me.dialog.close();
                            return;
                        }
                        var win = parent || window;
                        if (win.closeCurrentTab) win.closeCurrentTab();
                        else win.close();
                    }
                });
            },
            setFormDefaultBtn: function () {
                var me = this;
                //表单底部按钮
                var buttons = [];
                if (!me.isView) {
                    buttons.push({
                        text: '重置', onclick: function () {
                            $.ligerDialog.confirm("确定重置数据吗?", function (confirm) {
                                if (confirm) {
                                    location.reload(true);
                                }
                            });
                        }
                    });
                }
                buttons.push({ text: '关闭', onclick: me.close.bind(me) });
                if (!me.isView) buttons.push({ text: '保存', onclick: me.save.bind(me) });
                LG.addFormButtons(buttons);
                me.formButtons = buttons;
            },
            setForm: function () {
                var me = this;
                me.config.form.fields.removeNull();
                var $mainform = $("#mainform")
                //搜索表单应用ligerui样式
                me.mainform = $mainform.ligerForm({
                    EnterMoveNextControl: true,
                    labelAlign: 'right',
                    space: 3,
                    validate: true,
                    fields: me.config.form.fields,
                    labelWidth: me.formLabelWidth,
                    onAfterSetFields: function (g) {
                        me.mainform = g;
                        me.buttons = g.options.buttons;
                    }
                });
                me.setFormDefaultBtn();
            },
            init: function () {
                var me = this;
                if (frameElement && frameElement.dialog) {
                    me.dialog = frameElement.dialog;
                    me.dialogData = me.dialog.get('data') || {};
                    if (me.dialogData.callback) me.callback = me.dialogData.callback;
                    if (me.dialogData.sid) me.sid = me.dialogData.sid;
                    me.isView = me.dialogData.isView ?? true;
                }
                me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.loadData();
                return me;
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>

</html>
