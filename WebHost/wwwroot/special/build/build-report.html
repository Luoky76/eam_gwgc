                            {

                                {

                            },
                            {
                                display: "柴油（吨）", columns: [

                                    },

                                    },
                                    {

                                        {

                                    },
                                    {

                            {

                                    {

                                        {
                                            type: 'sum',
                                            align: 'center',
                                            render: function (e) {
                                                return "<div>" + e.sum + "</div>";
                                            }
                                        }
                                    },
                                    {
                                        display: "补充", name: "LUBRICATE_SUPPLEMENT", minWidth: 100, type: "float", editor: { type: 'float' }, totalSummary:
                                        {

                            //{ display: "简要说明", name: "MEMO", minWidth: 300, type: "text", editor: { type: 'text' } }

                };
            },
            grid: null,
            searchForm: null,
            buttons: null,
            shipinfo: [],
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'Special/Build/ComboxData',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        me.shipinfo = data.shipInfo;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    autoWidth: true,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    usePager: false,
                    dataAction: 'local',
                    toolbar: { group: "list" },
                    url: 'Special/Build/QryYear',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: '',
                    sortOrder: '',
                    width: '98%',
                    height: '100%',
                    checkbox: true,
                    onBeforeEdit: function (editParm) {
                        switch (editParm.column.name) {
                            case "":
                                if (editParm.record.__status == "add") return true;
                                else return false;
                                break;
                        }
                    },
                    onSuccess: function (data, g) {
                        if (data && data.Rows) {
                            var rows = data.Rows || [];
                            for (var i = 0, len = rows.length; i < len; i++) {
                                var row = rows[i];
                                row.OLDROLEID = row.ROLEID;
                            }
                        }
                    },
                    rowAttrRender: function (rowdata, rowid) {
                        return "";
                    },
                    onDblClickRow: function (data, rowid, rowdata) {
                        me.view(rowid);
                    }
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "import":
                            me.import();
                            break;
                        case "add":
                            me.add();
                            break;
                        case "modify":
                            me.modify();
                            break;
                        case "delete":
                            me.delete();
                            break;
                        case "save":
                            me.save();
                            break;
                        case "export":
                            me.export();
                            break;
                        case "export-month":
                            me.exportmonth();
                            break;
                        case "Excel":
                            $.ligerDialog.open({
                                url: "../../System/Export.html?exporttype=xls",
                                modal: true
                            });
                            break;
                        case "Word":
                            $.ligerDialog.open({
                                url: "../../System/Export.html?exporttype=doc",
                                modal: true
                            });
                            break;
                    }
                }
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            view: function (rowid) { //查看
                var me = this;
            },
            export: function () { //模板导出
                var date = new Date($("#_search_STARTDATE").val());
                var me = this;
                // var rules = LG.bulidFilterGroup(me.searchForm.id);
                LG.download({
                    url: 'Special/Build/ExportYearList',
                    type: "post",
                    loading: '正在导出中...',
                    data: { year: date.getFullYear() },
                    callback: function (status, data) {
                        if (status) {
                            LG.showSuccess(data.Message);
                        }
                        else LG.showError(data.Message);
                    }
                });
            },
            exportmonth: function () { //模板导出
                var date = new Date($("#_search_STARTDATE").val());
                var me = this;
                // var rules = LG.bulidFilterGroup(me.searchForm.id);
                LG.download({
                    url: 'Special/Build/ExportMonthList',
                    type: "post",
                    loading: '正在导出中...',
                    data: { year: date.getFullYear() },
                    callback: function (status, data) {
                        if (status) {
                            LG.showSuccess(data.Message);
                        }
                        else LG.showError(data.Message);
                    }
                });
            },
            import: function () {
                var me = this;
                LG.showUpload({
                    title: "施工统计表数据导入",
                    server: "Special/Build/Import",
                    //mouldFileName: "contract/ExportExcelHeader",
                    mouldFileName: function () {
                        window.open(gksybConfigs.urlBase + "base/施工统计表数据导入.xlsx");
                    },
                    multiple: false,
                    extensions: 'xls,xlsx',
                    mimeTypes: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel',
                    compress: {
                        width: 1920
                    },
                    showSuccess: false,
                    data: { folder: '../../Adv' },
                    callback: function (status, data) {

                        if (status) {
                            LG.showSuccess("导入成功");
                            me.reload();
                        }
                        else LG.showError(data.Message);
                    }
                });
            },
            add: function () { //新增
                var me = this;
                $.ligerDialog.open({
                    width: 1100,
                    height: 520,
                    allowClose: true,
                    title: '[新增]',
                    url: "build-count-detail.html?MenuNo=" + me.menuNo,
                    isHidden: false,
                    showMax: false,
                    showToggle: false,
                    showMin: false,
                    isResize: true,
                    slide: false,
                    onClosed: me.reload.bind(me),
                    data: { "sid": null }
                });
                //me.grid.addEditRow({}, true);
            },
            modify: function () { //修改
                var me = this;
                var selected = me.grid.getSelectedRow();
                if (!selected) {
                    LG.tip('请选择行!');
                    return;
                }
                var sid = selected.BUILD_ID;
                $.ligerDialog.open({
                    width: 1100,
                    height: 520,
                    allowClose: true,
                    title: '[修改]',
                    url: "build-count-detail.html?MenuNo=" + me.menuNo,
                    isHidden: false,
                    showMax: false,
                    showToggle: false,
                    showMin: false,
                    isResize: true,
                    slide: false,
                    onClosed: me.reload.bind(me),
                    data: { "sid": sid }
                });
            },
            save: function () { //保存
                var me = this;
                if (me.grid.endEdit() != false) {
                    if (!me.grid.isDataChanged) {
                        LG.showSuccess('无修改');
                        return;
                    }
                    if (!me.grid.validChangeRows()) return false;
                    var changeRow = me.grid.getChangedRows();
                    LG.ajax({
                        jsToken: true,
                        url: 'Special/Build/Save',
                        loading: '正在保存中...',
                        data: changeRow,
                        success: function () {
                            LG.showSuccess('保存成功');
                            me.grid.isDataChanged = false;
                            me.reload();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }

            },
            reload: function () { //刷新
                var me = this;
                me.buttons[0].click();
            },
            delete: function () { //删除
                var me = this;
                if (me.grid.endEdit() != false) {
                    var selected = me.grid.getSelectedRows();
                    if (selected.length > 0) {
                        $.ligerDialog.confirm('确定删除吗?', function (confirm) {
                            if (confirm) {
                                for (var i = 0, len = selected.length; i < len; i++) {
                                    me.grid.deleteRow(selected[i]);
                                }
                                me.save();
                            }
                        });
                    } else {
                        LG.tip('请选择行!');
                    }
                }
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Word',
                        text: '导出Word',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-word-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch = $("#formsearch")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                             
                            // 获取 _search_ENDDATE 的值
                            var endDateValue = liger.get('_search_ENDDATE').getValue();

                            // 将获取的字符串日期值转换为日期对象
                            var endDate = new Date(endDateValue);

                            // 增加一个月，处理跨年情况
                            endDate.setMonth(endDate.getMonth() + 1);

                            me.grid.options.NoFirstSearch = false;
                            me.grid.options.parms = { startdate: liger.get('_search_STARTDATE').getValue().format('yyyy-MM-dd'), enddate: endDate.format('yyyy-MM-dd') };
                            LG.commonSearch($formsearch, me.grid);
                            //var year = date.getFullYear();
                        },
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                        var nowDate = new Date();
                        var nowDate = new Date(); // 获取当前日期
                        var beginDate = nowDate.getFullYear() + "-01"; // 当前年份的第一月

                        var endDate = nowDate.getFullYear() + "-12"; // 当前年份的最后一月

                        me.searchForm.setData({ "_search_STARTDATE": beginDate });
                        me.searchForm.setData({ "_search_ENDDATE": endDate });
                    }
                });
            },
            init: function () {
                var me = this;
                me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.setGrid();
                me.reload();
                return me;
            }
        };
        $(function () {
            business.init();
        });
    </script>
