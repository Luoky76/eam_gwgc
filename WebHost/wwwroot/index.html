<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title>生产管理系统</title>
    <link href="lib/dist/css/normalize.css" rel="stylesheet" />
    <link href="lib/dist/css/bootstrap.css" rel="stylesheet" />
    <link href="lib/dist/css/font-awesome.css" rel="stylesheet" />
    <link href="lib/dist/css/app-frame.css?v=1" rel="stylesheet" />
    <link href="lib/dist/css/index.css" rel="stylesheet" />
    <!--[if lt IE 9]>
      <script src="lib/dist/js/shim.js" type="text/javascript"></script>
    <![endif]-->
</head>

<body class="hold-transition skin-ui sidebar-mini fixed">
    <div class="wrapper" id="wrapper">
        <header class="main-header">
            <a href="#" class="logo">
                <span class="logo-mini"><img src="lib/dist/img/logo.png" alt="logo" style="height:36px;"></span>
                <span class="logo-lg">生产管理系统</span>
            </a>
            <nav class="navbar navbar-static-top">
                <a href="#" class="sidebar-toggle" data-toggle="push-menu" role="button">
                    <span class="sr-only">导航切换</span>
                </a>
                <div class="navbar-custom-menu">
                    <ul class="nav navbar-nav">
                        <li class="dropdown notifications-menu">
                            <!-- Menu toggle button -->
                            <a id="user-message" href="javascript:void(0);">
                                <i class="fa fa-bell-o" style="font-size:18px;"></i>
                                <span id="unread-count" class="label label-danger" style="font-size:12px;"></span>
                            </a>
                        </li>
                        <li class="dropdown user user-menu">
                            <a href="#" class="dropdown-toggle" data-toggle="dropdown">
                                <i class="user-fa fa fa-user-circle"></i>
                                <span id="realname" name="realname"></span>
                            </a>
                            <ul class="dropdown-menu">
                                <li class="user-header">
                                    <img src="lib/dist/img/user.png" class="img-circle" alt="User Image">
                                    <p>
                                    </p>
                                </li>
                                <li class="user-footer">
                                    <div class="pull-left">
                                        <a href="#" class="btn btn-default btn-flat" data-toggle="modal" data-target="#myModal">
                                            修改密码
                                        </a>
                                    </div>
                                    <div class="pull-left" style="padding-left: 5px;">
                                        <a href="#" class="btn btn-default btn-flat" data-toggle="modal" data-target="#myModal1">
                                            当前组织
                                        </a>
                                    </div>
                                    <div class="pull-right">
                                        <a href="javascript:f_exit()" class="btn btn-default btn-flat">退出</a>
                                    </div>
                                </li>
                            </ul>
                        </li>
                    </ul>
                </div>
                <div class="collapse navbar-collapse" id="navbar-collapse" style="margin-left:40px;margin-right:160px;">
                    <ul id="rootMenu" class="nav navbar-nav">
                    </ul>
                </div>
            </nav>
        </header>
        <aside class="main-sidebar">
            <section class="sidebar">
                <div class="search-menu-panel">
                    <div class="input-group">
                        <input type="text" id="searchMenu" name="searchMenu">
                    </div>
                </div>
                <ul class="sidebar-menu" data-widget="tree" data-follow-link="true" data-animation-speed="200" data-accordion="false" style="z-index:99999"></ul>
            </section>
        </aside>
        <div class="content-wrapper">
            <div class="content-tabs">
                <button class="roll-nav roll-left tabLeft" onclick="scrollTabLeft()">
                    <i class="fa fa-backward"></i>
                </button>
                <nav class="page-tabs menuTabs tab-ui-menu" id="tab-menu">
                    <div class="page-tabs-content" style="margin-left: 0px;">

                    </div>
                </nav>
                <button class="roll-nav roll-right tabRight" onclick="scrollTabRight()">
                    <i class="fa fa-forward" style="margin-left: 3px;"></i>
                </button>
                <div class="btn-group roll-nav roll-right">
                    <button class="dropdown tabClose" data-toggle="dropdown">
                        页签操作<i class="fa fa-caret-down"></i>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-right" style="min-width: 128px;">
                        <li><a class="tabReload" href="javascript:refreshTab();">刷新当前</a></li>
                        <li><a class="tabCloseCurrent" href="javascript:closeCurrentTab();">关闭当前</a></li>
                        <li><a class="tabCloseAll" href="javascript:closeOtherTabs(true);">全部关闭</a></li>
                        <li><a class="tabCloseOther" href="javascript:closeOtherTabs();">除此之外全部关闭</a></li>
                    </ul>
                </div>
                <button class="roll-nav roll-right fullscreen" onclick="App.handleFullScreen()">
                    <i class="fa fa-arrows-alt"></i>
                </button>
            </div>
            <div class="content-iframe" style="background-color: #ffffff;">
                <div class="tab-content" id="tab-content">
                </div>
            </div>
        </div>
        <aside class="control-sidebar control-sidebar-dark">
        </aside>
        <div class="control-sidebar-bg">
        </div>
    </div>
    <div style="position: absolute; width: 100%; z-index: 1100; display: none; top: 0;">
        <div class="modal fade" id="myModal" tabindex="-1" role="dialog" aria-labelledby="myModalLabel"
             aria-hidden="true">
            <div class="modal-dialog modal-sm" role="document">
                <div class="modal-content" style="border-radius: 6px;">
                    <div class="modal-header">
                        <button type="button" class="close" data-dismiss="modal" aria-hidden="true">
                            ×
                        </button>
                        <h4 class="modal-title" id="myModalLabel">
                            修改密码
                        </h4>
                    </div>
                    <div class="modal-body">
                        <form class="form-horizontal" role="form">
                            <div class="form-group">
                                <label for="OldPassword" class="col-sm-4 control-label">
                                    旧密码
                                </label>
                                <div class="col-sm-8">
                                    <input type="password" class="form-control" id="OldPassword" placeholder="请输入旧密码">
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="NewPassword" class="col-sm-4 control-label">
                                    新密码
                                </label>
                                <div class="col-sm-8">
                                    <input type="password" class="form-control" id="NewPassword" placeholder="请输入新密码">
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="equalPassword" class="col-sm-4 control-label">
                                    确认密码
                                </label>
                                <div class="col-sm-8">
                                    <input type="password" class="form-control" id="equalPassword" placeholder="再次输入新密码">
                                </div>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-default" data-dismiss="modal">
                            关闭
                        </button>
                        <button type="button" class="btn btn-primary" id="passwordSubmit">
                            提交
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div style="position: absolute; width: 100%; z-index: 1100; display: none; top: 0;">
        <div class="modal fade" id="myModal1" tabindex="-1" role="dialog" aria-labelledby="myModalLabel1"
             aria-hidden="true">
            <div class="modal-dialog modal-sm" role="document">
                <div class="modal-content" style="border-radius: 6px;">
                    <div class="modal-header">
                        <button type="button" class="close" data-dismiss="modal" aria-hidden="true">
                            ×
                        </button>
                        <h4 class="modal-title" id="myModalLabel1">
                            当前组织
                        </h4>
                    </div>
                    <div class="modal-body">
                        <div id="corp">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-default" data-dismiss="modal">
                            关闭
                        </button>
                        <button type="button" class="btn btn-primary" id="corpSubmit">
                            提交
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="lib/LGboot.js?ver=1.1" type="text/javascript"></script>
    <script src="lib/dist/js/bootstrap.js" type="text/javascript"></script>
    <script src="lib/dist/js/bootstrap-treeview.js" type="text/javascript"></script>
    <script src="lib/dist/js/app-frame.js" type="text/javascript"></script>
    <script src="lib/third-party/broadcast/broadcast.js"></script>
    <script>
        'use strict';
        var IsAdmin = window.session.IsAdmin;
        window["rootPath"] = "";

        function f_exit() {
            $.ajax({
                type: 'post',
                cache: false,
                dataType: 'json',
                url: 'auth/exit',
                beforeSend: function (jqXHR) {
                    jqXHR.setRequestHeader("ticket", window.ticket);
                },
                success: function (result) {
                    if (!result) {
                        $.ligerDialog.error('退出失败');
                    } else {
                        window.ticket = null;
                        window.session = null;
                        location.href = "login.html";
                    }
                },
                error: function () {
                    $.ligerDialog.error('发送系统错误,请与系统管理员联系!');
                }
            });
        }
        //组织初始化
        function corp_init() {
            $('#myModal1').modal({
                show: false
            });
            $('#myModal1').on('show.bs.modal', function () {
                $(this).parent().show();
            });
            $('#myModal1').on('hide.bs.modal', function () {
                $(this).parent().hide();
            });
            var corpInit = function () {
                LG.ajax({
                    async: false,
                    url: 'auth/usercorps',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        $("#corp").ligerRadioList({
                            valueField: "CorpID",
                            textField: 'CName',
                            rowSize: 1,
                            data: data,
                            value: message
                        });
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });

                $('#corpSubmit').click(function () {
                    var ids = liger.get("corp").getValue();
                    if (ids) {
                        LG.ajax({
                            async: false,
                            url: 'auth/changecorp',
                            data: {
                                "corpid": ids
                            },
                            loading: '正在切换中...',
                            success: function (data, message) {
                                location.href = location.href;
                            },
                            error: function (message) {
                                LG.showError(message);
                            }
                        });
                    } else {
                        LG.showError('请至少选取一个组织!');
                    }
                });

            }
            corpInit();
        }
        //增加tab项的函数
        function f_addTab(tabid, text, url) {
            if (!tabid) tabid = undefined;
            addTabs({
                id: tabid,
                title: text,
                close: true,
                url: url
            });
        }
        var menus = null;
        var menuList = [];
        $(function () {
            $("body").on("expanded.pushMenu", function () {
                liger.get($("#searchMenu")).wrapper.show();
            }).on("collapsed.pushMenu", function () {
                liger.get($("#searchMenu")).wrapper.hide();
            });
            App.setbasePath("");
            App.setGlobalImgPath("lib/dist/img/");
            App.onClose = function (pageId, title, tabPanel) { //关闭
                try {
                    var ifr = $("iframe", tabPanel)[0];
                    if (ifr) {
                        var win = ifr.window || ifr.contentWindow; // 考虑兼容性问题
                        if (win && win.onClose) {
                            if (win.onClose(pageId, title) == false) return false;
                        }
                    }
                } catch (err) { }
            };
            App.onSelectChange = function (pageId, title, tabPanel) { //关闭
                try {
                    var ifr = $("iframe", tabPanel)[0];
                    if (ifr) {
                        var win = ifr.window || ifr.contentWindow; // 考虑兼容性问题
                        if (win && win.onSelectChange) {
                            if (win.onSelectChange(pageId, title) === false) return false;
                        }
                    }
                } catch (err) { }
                return false;
            };
            App.onActive = function (pageId, title, tabPanel) { //激活
                $(".menu-active").removeClass("menu-active");
                if (menus) {
                    for (var i = 0, len = (menus || []).length; i < len; i++) {
                        var $parent = menus[i];
                        if ($parent.children) {
                            treeMap($parent.children, function (menu) {
                                if (menu.id == pageId) {
                                    var $o = $("li[mid='" + ($parent.id) + "']");
                                    if (!$o.hasClass("current")) {
                                        $o.click();
                                    }
                                }
                            });
                        }
                    }
                }
                var $active = $("li[mid='" + pageId + "']");
                $active.parents("li").each(function (i, o) {
                    var $o = $(o);
                    if (!$o.hasClass("menu-open")) {
                        $(">a", $o).click();
                    }
                });
                $active.addClass("menu-active");
                try {
                    var ifr = $("iframe", tabPanel)[0];
                    if (ifr) {
                        var win = ifr.window || ifr.contentWindow; // 考虑兼容性问题
                        if (!win) return;
                        win.onActive && win.onActive(pageId, title);
                        win.f_getfocus && win.f_getfocus(pageId, title);
                    }
                } catch (err) { }
            };
            addTabs({
                id: 'welcome',
                title: '首页',
                close: false,
                url: 'welcome.html'
            });

            //查找菜单
            function searchMenu(value) {
                for (var i = 0, len = (menuList || []).length; i < len; i++) {
                    var menu = menuList[i];
                    if ((menu.targetType === "iframe-tab") && (menu.id || "") == value) {
                        addTabs({
                            id: menu.id,
                            title: menu.text,
                            close: true,
                            url: menu.url
                        });
                        return true;
                    }
                }
                for (var i = 0, len = (menuList || []).length; i < len; i++) {
                    var menu = menuList[i];
                    if ((menu.targetType === "iframe-tab") && (menu.MENUNO || "") == value) {
                        addTabs({
                            id: menu.id,
                            title: menu.text,
                            close: true,
                            url: menu.url
                        });
                        return true;
                    }
                }
                return false;
            }

            //查找下拉初始化
            var $searchMenu = $("#searchMenu").ligerComboBox({
                data: [],
                valueField: 'id', //实际值
                textField: 'text', //显示值
                triggerIcon: "fa fa-search",
                selectBoxHeight: 350,
                onChangeValue: function (input, value, g) {
                    if (!value) return;
                    if (searchMenu(value)) {
                        g.clear();
                    }
                }
            });

            $("#rootMenu").on("click", "li", function () {
                var $this = $(this);
                var index = parseInt($this.attr("index"));
                if (isNaN(index)) return;
                $(".navbar-nav .current").removeClass("current");
                $this.addClass("current");
                if (menus && menus.length) {
                    var $menu = $('.sidebar-menu');
                    $menu.html("");
                    $menu.sidebarMenu({
                        data: menus[index].children
                    });
                    setTimeout(function () {
                        if ($menu.find(".menu-open").length) return;
                        $menu.find(".treeview-menu:first").prev().click();
                    }, 100);
                }
            });

            function treeMap(columns, f) { //遍历所有列执行函数f
                for (var i = (columns.length - 1); i >= 0; i--) {
                    var column = columns[i];
                    if (column.children) {
                        treeMap(column.children, f);
                    }
                    f(column, i, columns);
                }
            }

            function setMenu() { //设置菜单
                $("#rootMenu").html("");
                $('.sidebar-menu').html("");
                var menu = null;
                var width = $("#navbar-collapse").width();
                var height = $("#navbar-collapse").height() * 1.5;
                var dropdown = false;
                var $menu = $("#rootMenu");
                for (var i = 0, l = menus.length; i < l; i++) {
                    menu = menus[i];
                    var $o = $('<li mid="' + menu.id + '" index="' + i + '"><a href="javascript:void(0)"><i class="' + menu.icon + '"></i>' + menu.text + '</a></li>')
                    if (menu.targetType === "blank") {
                        $o.find("a").attr("href", menu.url).attr("target", "_blank");
                    }
                    $o.appendTo($menu);
                    if (!dropdown) {
                        if (($menu.offset().top + $menu.height()) > height) {
                            $("li:last", $menu).remove();
                            i--;
                            $menu.append('<li class="dropdown"><a href="#" class="dropdown-toggle" data-toggle="dropdown"><span class="caret"></span></a><ul class="dropdown-menu" role="menu"><ul></li>');
                            if (($menu.offset().top + $menu.height()) > height) {
                                $("li[index=" + (i--) + "]", $menu).remove();
                            }
                            $menu = $(".dropdown-menu", $menu);
                            if (i < 0) i = 0;
                            dropdown = true;
                        }
                    }
                }
                if ($("body").width() < 600) {
                    $("#rootMenu").html("");
                    $('.sidebar-menu').sidebarMenu({
                        data: menus
                    });
                } else {
                    $("#rootMenu li:first").click();
                }
            }

            $.ajax({
                type: 'post',
                dataType: 'json',
                url: 'auth/mymenus',
                _toLogin: true,
                success: function (result) {
                    business.init();
                    if (!result) return;
                    if (result.IsError) {
                        $.ligerDialog.error(result.Message);
                        return;
                    }
                    menus = result.Data;
                    for (var i = 0, l = menus.length; i < l; i++) {
                        var menu = menus[i];
                        var url = menu.MENUURL || "";
                        url = url.replace(/.aspx/i, ".html");
                        var regExp = new RegExp("[\?\&]targetType=([^\&]+)", "i");
                        var result = url.match(regExp);
                        if (result == null || result.length < 1) {
                            menu.targetType = "iframe-tab";
                        } else {
                            menu.targetType = result[1];
                        }
                        url = url.replace(regExp, "");
                        if (menu.MENUNO) {
                            if (url.indexOf('?') > -1) url += "&";
                            else url += "?";
                            if (url.indexOf('?MenuNo=') > -1 || url.indexOf('&MenuNo=') > -1) {
                                url += "MenuNo2=" + menu.MENUNO;
                            } else {
                                url += "MenuNo=" + menu.MENUNO;
                            }
                            url += "&ver=" + new Date().format("yyyyMMddhhmmss");
                        }

                        menu.id = menu.MENUID;
                        menu.text = menu.MENUNAME;
                        menu.url = url;
                        menu.icon = menu.MENUICON || "";
                        if (menu.icon.indexOf("fa") < 0) {
                            menu.icon = "fa-circle-o";
                        }
                        menu.icon = "fa " + menu.icon;
                        if (menu.id && url.indexOf('.') > -1) {
                            menuList.push(menu);
                        }
                    }
                    //menus.push({ ICON: "fa fa-link", MENUICON: "fa fa-link", MENUNAME: "", MENUNO: "", MENUPARENTNO: null, MENUURL: "?targetType=blank", TEXT: "" });
                    menus = menus.toTree("MENUNO", "MENUPARENTNO");
                    $searchMenu.setData(menuList);
                    setMenu();
                    $(window).resize(function () {
                        setTimeout(setMenu, 200);
                    });
                    var menuno = getQueryStringByName("menuno");
                    if (menuno) {
                        searchMenu(menuno);
                    }
                    //$('.sidebar-menu').sidebarMenu({ data: menus });
                    //$("#rootMenu").html(html.join(''));
                }
            });
            //修改密码
            $('#myModal').modal({
                show: false
            });
            $('#myModal').on('show.bs.modal', function () {
                $(this).parent().show();
            });
            $('#myModal').on('hide.bs.modal', function () {
                $(this).parent().hide();
            });

            $('#passwordSubmit').click(function (e) {
                var OldPassword = $("#OldPassword").val();
                var LoginPassword = $("#NewPassword").val();
                var equalPassword = $("#equalPassword").val();
                if (OldPassword.length == 0 || LoginPassword.length == 0 || equalPassword.length == 0) {
                    $.ligerDialog.error("输入框内不能为空");
                    return;
                }

                if (LoginPassword != equalPassword) {
                    $.ligerDialog.error("两次密码输入不一致");
                } else {
                    OldPassword = encrypt(OldPassword);
                    LoginPassword = encrypt(LoginPassword);
                    LG.ajax({
                        type: 'post',
                        dataType: 'json',
                        jsToken: "Auth/Login",
                        url: 'auth/changepassword',
                        data: {
                            OldPassword: OldPassword,
                            NewPassword: LoginPassword
                        },
                        loading: '正在修改中...',
                        success: function (data, message) {
                            LG.showSuccess("密码修改成功", function () {
                                $('#myModal').modal("hide");
                            });
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }
            });
            corp_init();
        });
        var business = {
            showMessageCenter: function () {
                var me = this;
                $.ligerDialog.open({
                    width: 800,
                    height: 600,
                    allowClose: true,
                    title: '消息中心',
                    url: "message/message-center.html",
                    modal: false,
                    isHidden: false,
                    showMax: false,
                    showToggle: false,
                    showMin: false,
                    isResize: true,
                    slide: false,
                    onClosed: null,
                    data: {
                        callback: function () {
                            me.refershUnReadCount();
                        }
                    }
                });
            },
            bindEvent: function () {
                var me = this;
                $("#user-message").click(function () {
                    me.showMessageCenter();
                });
            },
            toDetail: function (dom,title, href, target) {
                liger.get($(dom).parents(".l-dialog")).close();
                LG.toDetail(title, href, target);
            },
            showMessage: function (info) {
                var dialogMode = info.DialogMode || "提示";
                var dialogType = info.DialogType || "info";
                var content = info.Content;
                var time = undefined;
                if (info.Href) {
                    content = '<a href="javascript:void(0);" onclick="business.toDetail(this,\'' + info.Title + '\',\'' + info.Href + '\', \'' + (info.Target || "") + '\');">' + content + '</a>';
                    time = 0;
                }
                switch (dialogMode) {
                    case '通知':
                        $.ligerDialog.notification({
                            title: info.Title,
                            content: content,
                            type: dialogType,
                            time: time
                        });
                        break;
                    case '对话框':
                        $.ligerDialog.alert(content, info.Title, dialogType);
                        break;
                    default:
                        $.ligerDialog.tip({
                            title: info.Title,
                            content: content,
                            type: dialogType
                        });
                }
            },
            initMessageCenter: function () {//消息中心
                var me = this;
                me.refershUnReadCount();
                var channel = Broadcast.getInstance();//创建广播通道
                channel.onMessageCenter = function (info) {
                    me.showMessage(info);
                    me.refershUnReadCount();
                };
            },
            refershUnReadCount: function () {
                $.ajax({
                    type: 'post',
                    dataType: 'json',
                    url: 'message/unReadCount',
                    success: function (result) {
                        if (!result || result.IsError) return;
                        $("#unread-count").html(result.Data > 99 ? "99+" : (result.Data || ""));
                    }
                });
            },
            init: function () {
                var me = this;
                $("#realname").text(window.session.RealName);
                me.bindEvent();
                me.initMessageCenter();
            }
        };
    </script>
</body>
</html>
