<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title>人员列表</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
    <style type="text/css">
        #maintree {
            margin-bottom: 50px
        }
    </style>
</head>

<body style="padding: 2px; height: 100%; overflow:hidden;">
    <div id="layout">
        <div id="center" position="center" title="人员列表">
            <form id="mainform">
                <div id="maingrid" style="margin: 2px;"></div>
            </form>
        </div>
    </div>
    <script type="text/javascript">
        'use strict';
        var staffnoArr = [];
        var staffnameArr = [];
        var gridData = [];
        var currentCorpUser = [];
        var business = {
            menuNo: getQueryStringByName("MenuNo"),
            ver: getQueryStringByName("ver"),
            tree: null,
            detailWidth: 920,
            detailHeight: 450,
            setConfig: function () {
                var me = this;
                me.config = {
                    grid: {
                        columns: [
                            { display: "账号", name: "LOGINNAME", minWidth: 100, type: "text", align: "center" },
                            { display: "姓名", name: "REALNAME", minWidth: 100, type: "text", align: "center" },
                            { display: "部门", name: "DEPT_NAME", minWidth: 150, type: "text", align: "center" },
                            { display: "公司", name: "CORP_SNAME", minWidth: 150, type: "text", align: "center" },
                            { display: "CORPID", name: "CORPID", minWidth: 100, type: "text", align: "center", hide: true },
                            { display: "DEPT_ID", name: "DEPT_ID", minWidth: 100, type: "text", align: "center", hide: true },
                        ]
                    }
                };
            },
            grid: null,
            loadDefaultData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'SelectUser/GetCurentGorpUserList',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        currentCorpUser = data
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            setGrid: function () {
                var me = this;
                var columns = me.config.grid.columns;
                for (var i = columns.length - 1; i >= 0; i--) {
                    if (!columns[i]) columns.splice(i, 1);
                }
                me.grid = $("#maingrid").ligerGrid({
                    dateFormat: "yyyy-MM-dd",
                    autoWidth: true,
                    delayLoad: false,
                    usePager: true,
                    columns: me.config.grid.columns,
                    toolbar: {},
                    url: 'SelectUser/GetCurentGorpUserList',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    height: '100%',
                    checkbox: true,
                    enabledEdit: false,
                    clickToEdit: false,
                    /*isChecked: function (rowdata) {
                        if (staffnoArr.includes(rowdata.STAFFNO)) {
                            return true
                        }
                        return false
                    },*/
                    onBeforeEdit: function (editParm) {
                        switch (editParm.column.name) {
                            case "":
                                if (editParm.record.__status == "add") return true;
                                else return false;
                                break;
                        }
                    },
                    onCheckRow: function (checked, rowdata, rowid, data) {
                        var me = this
                        var staffno = rowdata.LOGINNAME

                        //alert("checked:" + checked + "data:" + data + "rowid:" + rowid + "rowdata:" + rowdata)
                        if (checked) {
                            if (!staffnoArr.includes(staffno)) {
                                staffnoArr.push(staffno);
                            }

                        } else {
                            if (staffnoArr.includes(staffno)) {
                                var no = staffnoArr.indexOf(staffno);
                                if (no > -1) {
                                    staffnoArr.splice(no, 1);
                                }

                            }
                        }
                    },
                    onCheckAllRow: function (checked, element) {
                        var me = this
                        if (checked) {
                            for (var i = 0; i < gridData.length; i++) {
                                if (!staffnoArr.includes(gridData[i].LOGINNAME)) {
                                    staffnoArr.push(gridData[i].LOGINNAME);
                                }
                            }
                        } else {
                            for (var i = 0; i < gridData.length; i++) {
                                if (staffnoArr.includes(gridData[i].LOGINNAME)) {
                                    var no = staffnoArr.indexOf(gridData[i].LOGINNAME);
                                    if (no > -1) {
                                        staffnoArr.splice(no, 1);
                                    }
                                }
                            }
                        }

                    },
                    onBeforeShowData: function (currentData) {
                        gridData = currentData.Rows

                    }
                });
                me.grid.isValid = true;
                //me.loadToolbar();
                me.bindGridEvent();
                me.setFormDefaultBtn()
            },
            setFormDefaultBtn: function () {
                var me = this
                var buttons = [];
                buttons.push({
                    text: '关闭', onclick: function () {
                        me.dialog.close()
                    }
                });
                buttons.push({
                    text: '确定', onclick: function () {
                        me.f_save()
                    }
                });
                LG.addFormButtons(buttons);
            },

            f_cancel: function () {
                var me = this
                me.dialog.close()
            },

            f_save: function () {
                var me = this
                if (staffnoArr.length == 0) {
                    LG.showError("请选择人员！")
                    return
                }
                var checkStaffNameArr = []
                var checkStaffDeptArr = []
                var checkStaffDeptNoArr = []
                for (var i = 0; i < currentCorpUser.Rows.length; i++) {
                    var staffno = currentCorpUser.Rows[i].LOGINNAME
                    var staffname = currentCorpUser.Rows[i].REALNAME
                    var staffdept = currentCorpUser.Rows[i].DEPT_NAME
                    var staffdeptno = currentCorpUser.Rows[i].DEPT_ID
                    if (staffnoArr.includes(staffno) && !checkStaffNameArr.includes(staffname) && !checkStaffDeptArr.includes(staffdept)) {
                        checkStaffNameArr.push(staffname)
                        checkStaffDeptArr.push(staffdept)
                        checkStaffDeptNoArr.push(staffdeptno)
                    }
                }
                me.dialog.frame.checkstaffnoArr = staffnoArr
                me.dialog.frame.checkstaffnameArr = checkStaffNameArr
                me.dialog.frame.checkStaffdeptArr = checkStaffDeptArr
                me.dialog.frame.checkStaffdeptnoArr = checkStaffDeptNoArr
                me.dialog.close()
            },
            reload: function () { //刷新
                var me = this;
                me.grid.loadData();
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Word',
                        text: '导出Word',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-word-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            init: function () {
                var me = this;
                if (frameElement && frameElement.dialog) {
                    me.dialog = frameElement.dialog
                    me.dialogData = me.dialog.get('data')
                    //me.comboxData = me.dialogData.terminalData
                    if (me.dialogData.staffNoStr) {
                        me.staffNoStr = me.dialogData.staffNoStr
                        var staffNoStrArr = me.staffNoStr.split(";");
                        staffnoArr = staffNoStrArr
                    }
                }
                $("#layout").ligerLayout({ leftWidth: 240 });
                //me.iframeloading.show();
                
                me.setConfig();
                me.setGrid();
                me.loadDefaultData();
                //me.staffnoArr = new Array();
                //me.staffnameArr = new Array();
                return me;
            }
        };
        business.init();
    </script>
</body>
</html>
