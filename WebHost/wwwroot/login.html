<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, minimal-ui, viewport-fit=cover">
    <title>设备效能管理系统</title>
    <script src="lib/jquery/jquery.js" type="text/javascript"></script>
    <script src="lib/js/common.js?v=1" type="text/javascript"></script>
    <style type="text/css">
        * {
            padding: 0;
            margin: 0;
        }

        html {
            background: #F6F5F6;
            overflow: hidden;
        }

        body {
            overflow: hidden;
        }

        #div-head {
            height: 80px;
            text-align: left;
        }

        #img-logo {
            margin: 10px;
            height: 60px;
        }

        #div-center {
            width: 100%;
            height: 520px;
            background-image: url("lib/images/login/login-bg.jpg?v=1");
            background-position: center;
            background-size: cover;
            position: relative;
            padding-top: 60px;
        }

        #div-login-panel {
            float: right;
            margin-right: 20%;
            text-align: left;
            width: 383px;
            height: 337px;
            position: relative;
            background-image: url("lib/images/login/login-panel.png?v=1");
        }

            #div-login-panel .login-title {
                padding-top: 20px;
                text-align: center;
                color: #1A58A1;
                line-height: 1.2em;
                font-size: 28px;
                font-weight: bold;
                letter-spacing: 2px;
            }

            #div-login-panel .login-panel {
                position: absolute;
                left: 90px;
                top: 100px;
            }

        #div-footer {
            width: 100%;
            position: fixed;
            bottom: 30px;
            text-align: center;
            color: #2B2B2B;
            font-size: 12px;
            z-index: -1;
        }

        .moda-input {
            line-height: 30px;
            display: block;
            width: 230px;
            height: 36px;
            margin: 0 auto;
            padding-left: 10px;
            color: #333;
        }

        .login-input {
            position: relative;
            text-align: left;
            height: 40px;
            line-height: 40px;
            margin-bottom: 15px;
        }

        .login-text {
            position: absolute;
            left: 5px;
            top: 0px;
            height: 40px;
            line-height: 40px;
            width: 250px;
            border: none;
            font-size: 18px;
            outline: none;
            background-color: transparent;
        }

        .login-null {
            user-select: none;
            font-size: 16px;
            color: #9B9B9B;
            cursor: text;
            white-space: nowrap;
            z-index: 10;
        }

        #verifyCode.login-input {
            margin-left: -40px;
        }

        #verifyCode .login-text {
            background-color: white;
            width: 270px;
            border-radius: 8px;
            -webkit-box-shadow: inset 0 1px 1px rgba(0, 0, 0, .075);
            box-shadow: inset 0 1px 1px rgba(0, 0, 0, .075);
            -webkit-transition: border-color ease-in-out .15s, -webkit-box-shadow ease-in-out .15s;
            -o-transition: border-color ease-in-out .15s, box-shadow ease-in-out .15s;
            transition: border-color ease-in-out .15s, box-shadow ease-in-out .15s;
        }

        #verifyCode .login-null {
            padding-left: 20px;
            width: 230px;
        }

        #verifyCode img {
            position: absolute;
            top: 0px;
            right: 0px;
            z-index: 999;
        }

        #btnLogin {
            margin-left: -30px;
            width: 260px;
            height: 41px;
            line-height: 41px;
            background-color: #2e75e3;
            border: 1px solid #2e75e3;
            border-radius: 20px;
            text-align: center;
            color: white;
            z-index: 999;
            font-size: 20px;
            letter-spacing: 3px;
            cursor: pointer;
        }

        .none {
            display: none;
        }

        .hidden {
            visibility: hidden;
        }

        @media(max-width:800px) {
            #div-login-panel {
                float: none;
                margin-right: 0;
            }
        }

        /*** 弹出框*****/
        .myModa {
            position: fixed;
            z-index: 9000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            _height: expression(document.body.offsetHeight+"px");
            pointer-events: auto;
            background-color: rgba(0, 0, 0, .3);
            _position: absolute;
        }

            .myModa .myAlertBox {
                font-size: 16px;
                width: 300px;
                border-radius: 5px;
                border: 1px solid #d9d9d9;
                background-color: #fff;
                -webkit-background-clip: content;
                box-shadow: 1px 1px 50px rgba(0, 0, 0, .3);
                -webkit-overflow-scrolling: touch;
                margin: 0 auto;
            }

                .myModa .myAlertBox h6 {
                    font-size: 16px;
                    line-height: 42px;
                    overflow: hidden;
                    height: 42px;
                    padding: 0 80px 0 20px;
                    white-space: nowrap;
                    text-overflow: ellipsis;
                    color: #333;
                    border-bottom: 1px solid #eee;
                    border-radius: 2px 2px 0 0;
                    background-color: #f8f8f8;
                }

                .myModa .myAlertBox p {
                    padding: 20px;
                    line-height: 26px;
                    font-size: 16px;
                    overflow: hidden;
                    overflow-x: hidden;
                    overflow-y: auto;
                    word-break: break-all;
                }

                .myModa .myAlertBox .btn {
                    display: block;
                    text-align: center;
                    vertical-align: middle;
                    -ms-touch-action: manipulation;
                    touch-action: manipulation;
                    cursor: pointer;
                    background-image: none;
                    border: 1px solid #2d8cf0;
                    white-space: nowrap;
                    -webkit-user-select: none;
                    -moz-user-select: none;
                    -ms-user-select: none;
                    user-select: none;
                    width: 80px;
                    border-radius: 5px;
                    line-height: 36px;
                    text-align: center;
                    font-size: 16px;
                    margin: 0 auto 20px;
                    color: #fff;
                    background-color: #2d8cf0;
                }

                    .myModa .myAlertBox .btn:active, .myModa .myAlertBox .btn:focus {
                        outline: 0;
                    }

        .myLoadding {
            border-radius: 8px;
            position: fixed;
            max-width: 280px;
            _width: expression(this.offsetWidth > 280 ? '280px': 'auto');
            *width: expression(this.offsetWidth > 280 ? '280px': 'auto');
            padding: 10px;
            text-align: center;
            background-color: #fff;
        }
    </style>
</head>

<body class="page-current">
    <center>
        <div id="div-head">
            <!--<img id="img-logo" src="lib/images/login/logo.png?v=1" alt="logo" />-->
        </div>
        <div id="div-center">
            <div id="div-login-panel">
                <div class="login-title">设备效能管理系统</div>
                <div class="login-panel">
                    <div class="login-input">
                        <input type="text" name="txtUsername" id="txtUsername" value="" class="login-text" />
                        <span class="login-text login-null">
                            请输入账号
                        </span>
                    </div>
                    <div class="login-input">
                        <input type="password" name="txtPassword" id="txtPassword" value="" class="login-text" />
                        <span class="login-text login-null">
                            请输入密码
                        </span>
                    </div>
                    <div id="verifyCode" class="login-input none">
                        <img id="imgcode" src="" width="80" height="40" alt="" />
                        <input type="text" name="txtVerifyCode" id="txtVerifyCode" value="" class="login-text" />
                        <span class="login-text login-null">
                            请输入验证码
                        </span>
                    </div>
                    <div id="btnLogin">
                        立即登录
                    </div>
                </div>
            </div>
        </div>
        <div id="div-footer">
            技术支持：厦门自贸试验区电子口岸有限公司
        </div>
    </center>

                message: "",
                callback: function () { }

                option.message = options
            } else {
                option = $.extend(option, options)
            }
            var top = $(window).height() * 0.3;
            $('body').append('<div class="myModa"><div class="myAlertBox"  style="margin-top:' + top + 'px"><h6>' +
                option.title + '</h6><p>' + option.message + '</p><button class="btn sure">确定</button></div></div>');
            $('.btn.sure').keydown(function (e) {
                if (e.keyCode == 13) {
                    e.preventDefault();
                    $(this).click();
                }
            }).click(function () {
                if (option.handleValue) option.handleValue();
                $('.myModa').remove();
                option.callback()
            }).focus();
            if (option.init) option.init();
        };

                'left': left + 'px'

        var business = {
            _noInner: true,
            success: function (data) {
                var toUrl = getQueryStringByName("FromUrl");
                if (((toUrl || "").toLowerCase().indexOf("http") >= 0) && (toUrl.indexOf(location.host) < 0)) toUrl = "";
                toUrl = toUrl || "index.html";
                window.ticket = data.Ticket;
                delete data.Ticket;
                window.session = data;
                location.href = toUrl;
            },
            phoneSelect: function (phones) {
                if (!phones || phones.length < 1) {
                    myAlert({
                        message: "找不到可选取的手机号",
                        callback: function () {
                            location.reload();
                        }
                    });
                    return;
                }
                var me = this;
                var htmls = [];
                htmls.push('<select name="phone-select" id="phone-select" class="moda-input">');
                htmls.push('<option value="">请选取手机</option>');
                for (var i = 0, l = phones.length; i < l; i++) {
                    var item = phones[i];
                    htmls.push('<option value="' + item.Key + '">' + (item.Value || item.Key) + '</option>');
                }
                htmls.push('</select>');
                var phone;
                myAlert({
                    message: htmls.join(""),
                    handleValue: function () {
                        phone = $("#phone-select").val();
                    },
                    callback: function () {
                        if (!phone) {
                            myAlert({
                                message: "请选取手机号",
                                callback: function () {
                                    me.phoneSelect(phones);
                                }
                            });
                            return;
                        }
                        $.ajax({
                            noGlobal: true,
                            type: 'post',
                            cache: false,
                            dataType: 'json',
                            url: 'auth/phoneselect',
                            jsToken: { url: "auth/logintoken" },
                            data: {
                                key: window.GksybIMEI,
                                value: encrypt(phone)
                            },
                            success: function (result) {
                                if (result.IsError) {
                                    myAlert({
                                        message: result.Message,
                                        callback: function () {
                                            location.reload();
                                        }
                                    });
                                    return;
                                }
                                me.smsAuth();
                            }
                        });
                    }
                });
            },
            smsAuth: function () {
                var me = this;
                var code;
                myAlert({
                    title: "验证码",
                    message: '<input id="sms-code" name="sms-code" type="text" class="moda-input" />',
                    init: function () {
                        $("#sms-code").focus();
                    },
                    handleValue: function () {
                        code = $("#sms-code").val();
                    },
                    callback: function () {
                        if (!code) {
                            myAlert({
                                message: "请输入短信验证码",
                                callback: function () {
                                    me.smsAuth();
                                }
                            });
                            return;
                        }
                        $.ajax({
                            noGlobal: true,
                            type: 'post',
                            cache: false,
                            dataType: 'json',
                            url: 'auth/smsauth',
                            jsToken: { url: "auth/logintoken" },
                            data: {
                                key: window.GksybIMEI,
                                value: encrypt(code)
                            },
                            success: function (result) {
                                if (result.IsError) {
                                    myAlert({
                                        message: result.Message,
                                        callback: function () {
                                            location.reload();
                                        }
                                    });
                                    return;
                                }
                                if (result.Message === "99") {
                                    myAlert({
                                        message: result.Data,
                                        callback: function () {
                                            me.smsAuth();
                                        }
                                    });
                                    return;
                                }
                                me.success(result.Data);
                            }
                        });
                    }
                });
            },
            submit: function () { //提交
                var me = this;
                var formData = {
                    username: $.trim($("#txtUsername").val() || ""),
                    password: $.trim($("#txtPassword").val() || ""),
                    verifycode: $.trim($("#txtVerifyCode").val() || "")
                };
                if (me._noInner && !formData.verifycode) {
                    myAlert({
                        message: '验证码不能为空!',
                        callback: function () {
                            $("#txtVerifyCode").focus();
                        }
                    });
                    return;
                }
                if (!formData.username) {
                    myAlert({
                        message: '账号不能为空!',
                        callback: function () {
                            $("#txtUsername").focus();
                        }
                    });
                    return;
                }
                if (!formData.password) {
                    myAlert({
                        message: '密码不能为空!',
                        callback: function () {
                            $("#txtPassword").focus();
                        }
                    });
                    return;
                }
                formData.username = encrypt(formData.username);
                formData.password = encrypt(formData.password);
                formData.imei = window.GksybIMEI;
                $.ajax({
                    noGlobal: true,
                    type: 'post',
                    cache: false,
                    dataType: 'json',
                    url: 'Auth/Login',
                    jsToken: {
                        url: "auth/logintoken"
                    },
                    data: formData,
                    success: function (result) {
                        $('.myModa').remove();
                        if (result && !result.IsError) {
                            if (result.Message === "99") {
                                me.smsAuth();
                                return;
                            }
                            if (result.Message === "999") {
                                me.phoneSelect(result.Data);
                                return;
                            }
                            me.success(result.Data);
                            return;
                        }
                        if (result.Data === "1") {
                            myAlert({
                                message: result ? result.Message : "账号密码错误",
                                callback: function () {
                                    location.href = "change-pwd.html?FromUrl=" + encodeURIComponent(location.href);
                                }
                            });
                            return;
                        }
                        $("#txtVerifyCode").val("");
                        myAlert({
                            message: result.Message,
                            callback: function () {
                                if (me._noInner) {
                                    $("#imgcode").click();
                                    $("#txtVerifyCode").focus().select();
                                } else {
                                    $("#txtUsername").focus().select();
                                }
                            }
                        });
                    },
                    error: function () {
                        $('.myModa').remove();
                        myAlert('发送系统错误,请与系统管理员联系!');
                    },
                    beforeSend: function () {
                        myLoadding();
                    }
                });
            },
            innerHandler: function () { //内部IP处理
                var me = this;
                $.ajax({
                    dataType: 'json',
                    url: 'Auth/IsInnerIP',
                    success: function (result) {
                        me._noInner = result.Data !== "1";
                        if (me._noInner) {
                            $("#imgcode").click();
                            $("#verifyCode").show();
                        }
                    }
                });
            },
            eventBind: function () {
                var me = this;
                $(".login-null").bind('click', function () {
                    $(this).prev(".login-text").focus();
                });
                $(".login-text").bind('focus.textBox', function () {
                    $(this).next(".login-null").hide();
                }).bind('blur.textBox', function () {
                    if (!$(this).val()) {
                        $(this).next(".login-null").show();
                    } else {
                        $(this).next(".login-null").hide();
                    }
                }).focus(function () {
                    $(this).addClass("login-text-focus");
                }).blur(function () {
                    $(this).removeClass("login-text-focus");
                });

                $("#imgcode").off("click").click(function () {
                    $("#imgcode").attr("src", gksybConfigs.getUrl("Auth/VerifyCode?time=" + Math.random()));
                });
                $("#btnLogin").off("click").click(function () {
                    me.submit();
                });
                $("#txtUsername").keydown(function (e) {
                    if (e.keyCode == 13) {
                        e.preventDefault();
                        $("#txtPassword").focus().select();
                    }
                });
                $("#txtPassword").keydown(function (e) {
                    if (e.keyCode == 13) {
                        e.preventDefault();
                        $("#txtVerifyCode").focus().select();
                        if (!me._noInner) me.submit();
                    }
                });
                $("#txtVerifyCode").keydown(function (e) {
                    if (e.keyCode == 13) {
                        e.preventDefault();
                        me.submit();
                    }
                });
            },
            init: function () { //初始化
                var me = this;
                me.eventBind();
                me.innerHandler();
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>
</html>
