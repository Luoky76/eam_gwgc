<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title></title>
    <script src="lib/LGboot.js" type="text/javascript"></script>
    <style>
        html {
            font-family: sans-serif;
            -ms-text-size-adjust: 100%;
            -webkit-text-size-adjust: 100%;
            width: 100%;
            height: 100%;
        }

        body {
            margin: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <iframe id="iframe" frameborder=0 style="width: 100%; height: 100%; border: none;" src="about:blank"></iframe>
    <script type="text/javascript">
        'use strict';
        var business = {
            getQueryStringByName: function (name) {
                var result = location.search.match(new RegExp("[\?\&]" + name + "=([^\&]+)", "i"));
                if (result == null || result.length < 1) return "";
                return decodeURIComponent(result[1]);
            },
            setOptions: function () {
                var me = this;
                var p = window._dialogOptions;
                window.onload = function () {
                    if (p.onLoaded) p.onLoaded();
                };
                window.onunload = function (e) {
                    if (p.onUnload) p.onUnload(window);
                }
                setTimeout(function () {
                    var width = (p.width || 500), height = (p.height || 300);
                    window.resizeTo(width, height);
                    setTimeout(function () {
                        me.widthAdd = width - document.body.clientWidth;
                        me.heightAdd = height - document.body.clientHeight;
                        if (p.width && p.height && (me.widthAdd !== 0 || me.heightAdd !== 0)) {
                            width = p.width + me.widthAdd;
                            height = p.height + me.heightAdd;
                            window.resizeTo(width, height);
                        }
                        me.setIframe();
                    }, 20);
                }, 20);
            },
            setIframe: function () {
                var me = this;
                var iframe = document.getElementById("iframe");
                iframe.src = me.url;
                iframe.dialog = {
                    options: window._dialogOptions,
                    get: function (name) {
                        return this.options[name];
                    },
                    resize: function (w, h) {
                        w = w + me.widthAdd;
                        h = h + me.heightAdd;
                        window.resizeTo(w, h);
                    },
                    show: function () {

                    },
                    close: function () {
                        window.close();
                    }
                };
            },
            init: function () {
                var me = this;
                me.uid = me.getQueryStringByName("uid");
                me.url = me.getQueryStringByName("url");
                document.title = me.getQueryStringByName("title");
                if (window.opener && window.opener._dialogData) window._dialogOptions = window.opener._dialogData[me.uid];
                window._dialogOptions = window._dialogOptions || {};
                me.setOptions();
            }
        }
        $(function () {
            business.init();
        });
    </script>
</body>
</html>
