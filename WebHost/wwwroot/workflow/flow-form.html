<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title>流程表单</title>
    <script src="../lib/LGboot.js" type="text/javascript"></script>
    <style type="text/css">
        #script-error {
            display: none;
            position: absolute;
            width: 300px;
            height: 300px;
            top: 10px;
            right: 0px;
            z-index: 999;
            color: red;
        }
        #layout-panel .l-layout-bottom {
            border: none !important;
        }
            #layout-panel .l-layout-bottom .l-layout-content {
                overflow:hidden !important;
            }
    </style>
</head>

<body style="padding: 5px; height: 100%;">
    <div id="script-error"></div>
    <div id="layout-panel">
        <div position="center">
            <form id="form-display">
            </form>
        </div>
        <div position="bottom">
            <form id="mainform" style="margin:0px;">
            </form>
        </div>
    </div>
    <script type="text/javascript">
        'use strict';
        var business = {
            dialogData: {},
            render: function (json) {
                window._displayOptions = {};
                var $error = $("#script-error");
                $error.hide();
                try {
                    eval("window._displayOptions = " + (json || "{}"));
                    if (!$.isPlainObject(window._displayOptions)) {
                        window._displayOptions = {};
                    }
                }
                catch (e) {
                    $error.html(e);
                    $error.show();
                    return;
                }
                $("#form-display").ligerForm(window._displayOptions);
            },
            setConfig: function () {
                var me = this;
                var width = $(window).width() -10;
                me.config = {
                    form: {
                        fields: [
                            {
                                display: "", hideLabel: true, name: "FLOW_FORM", newline: true, width: width, type: "textarea", options: {
                                    height: 200,
                                    onInput: function (input, value, g) {
                                        me.render(value);
                                    },
                                    onChangeValue: function (input, value, g) {
                                        me.render(value);
                                    }
                                }
                            }
                        ]
                    }
                };
            },
            mainform: null,
            buttons: null,
            loadData: function () {
                var me = this;
                me.mainform.setOrginData({ FLOW_FORM: me.dialogData.FLOW_FORM },true);
                me.mainform.focus();
            },
            confirm: function () { //保存
                var me = this;
                if (!me.mainform.valid()) {
                    me.mainform.showInvalid();
                    return;
                }
                me.close(true);
            },
            closeQuery: function (callback) {
                var me = this;
                if (me._skipConfirm === true || $.isEmptyObject(me.mainform.getChanges())) {
                    callback();
                    delete me._skipConfirm;
                    return;
                }
                $.ligerDialog.confirm($.ligerDefaults.GridString.isContinueByDataChanged, function (confirm) {
                    if (!confirm) return;
                    callback();
                });
            },
            close: function (skipConfirm) {
                var me = this;
                me._skipConfirm = skipConfirm === true ? true : false;
                if (me.dialog) {
                    me.dialog.close();
                    return;
                }
                me.closeQuery(function () {
                    var win = parent || window;
                    if (win.closeCurrentTab) win.closeCurrentTab();
                    else win.close();
                });
            },
            setFormDefaultBtn: function () {
                var me = this;
                //表单底部按钮
                var buttons = [];
                buttons.push({ text: '关闭', onclick: function () { me.close(); } });
                if (!me.isView) buttons.push({ text: '保存', onclick: function () { me.save() } });
                LG.addFormButtons(buttons);
                me.formButtons = buttons;
            },
            setForm: function () {
                var me = this;
                me.config.form.fields.removeNull();
                var $formsearch = $("#mainform");
                //搜索表单应用ligerui样式
                me.mainform = $formsearch.ligerForm({
                    enterMoveNextControl: true,
                    labelAlign: 'right',
                    space: 3,
                    validate: true,
                    fields: me.config.form.fields,
                    labelWidth: 150,
                    onAfterSetFields: function (g) {
                        me.mainform = g;
                        me.buttons = g.options.buttons;
                    }
                });
                me.setFormDefaultBtn();
            },
            initLayout: function () {
                $("#layout-panel").ligerLayout({
                    heightDiff: -45,
                    bottomHeight: 210,
                    allowBottomResize: false,
                    onResize: function () {

                    }
                });
            },
            init: function () {
                var me = this;
                if (frameElement && frameElement.dialog) {
                    me.dialog = frameElement.dialog;
                    if (me.closeQuery) me.dialog.options.closeQuery = me.closeQuery.bind(me);
                    me.dialogData = me.dialog.get('data') || {};
                    me.callback = me.dialogData.callback;
                }
                me.initLayout();
                me.setConfig();
                me.setForm();
                me.loadData();
                return me;
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>

</html>
