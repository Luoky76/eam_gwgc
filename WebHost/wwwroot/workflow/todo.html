<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title>待办任务</title>
    <script src="../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <div id="mainsearch">
        <form action="" id="formsearch" class="l-form">
        </form>
    </div>
    <form action="" id="mainform">
        <div id="maingrid">
        </div>
    </form>
    <script type="text/javascript">
        'use strict';
        var business = {
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            { display: "流程标题", name: "_search_Title", dbname: "Title", newline: false, upper: true, type: "text", options: {} }
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "流程标题", name: "Title", minWidth: 300, type: "text" },
                            { display: "节点", name: "NodeName", type: "text" },
                            { display: "处理人", name: "Operator", type: "text" },
                            { display: "启动时间", name: "StartDate", type: "date" },
                            { display: "发起人", name: "Creator", type: "text" },
                            { display: "发起时间", name: "CreateDate", type: "date" },
                            {
                                display: "操作", name: "Action", type: "text", minWidth: 100, render: function (rowdata, _rowindex, value) {
                                    return '<a class="l-grid-row-button" href="javascript:business.handle()"><i class="fa fa-pencil" style="padding-right:2px;" aria-hidden="true" /></i>处理</a>';
                                }
                            }
                        ]
                    }
                };
            },
            grid: null,
            searchForm: null,
            buttons: null,
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    dateFormat: 'yyyy-MM-dd HH:mm',
                    autoWidth: true,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    usePager: false,
                    dataAction: 'local',
                    toolbar: {},
                    url: 'workflow/query/todo',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: 'Id',
                    sortOrder: 'desc',
                    width: '100%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: true,
                    clickToEdit: true,
                    onBeforeEdit: function (editParm) {
                        switch (editParm.column.name) {
                            case "":
                                if (editParm.record.__status == "add") return true;
                                else return false;
                                break;
                        }
                    },
                    rowAttrRender: function (rowdata, rowid) {
                        return "";
                    }
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "Excel":
                            $.ligerDialog.open({
                                url: "../System/Export.html?exporttype=xls",
                                modal: true
                            });
                            break;
                        case "Word":
                            $.ligerDialog.open({
                                url: "../System/Export.html?exporttype=doc",
                                modal: true
                            });
                            break;
                    }
                }
            },
            addTab: function (text, url, data) {
                var me = this;
                if (parent.f_addTab) {
                    parent.f_addTab(undefined, text, gksybConfigs.urlBase + "workflow/" + url);
                    return;
                }
                $.ligerDialog.open({
                    width: 1100,
                    height: 800,
                    allowClose: true,
                    title: text,
                    url: url,
                    isHidden: false,
                    showMax: false,
                    showToggle: false,
                    showMin: false,
                    isResize: true,
                    slide: false,
                    data: data,
                    onClosed: me.reload.bind(me)
                });
            },
            handle: function () { //处理
                var me = this;
                var selected = me.grid.getSelectedRow();
                if (!selected) {
                    LG.tip('请选择行!');
                    return;
                }
                me.addTab(selected.Title, 'flow-detail.html?nid=' + selected.Id);
            },
            reload: function () { //刷新
                var me = this;
                me.buttons[0].click();
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Word',
                        text: '导出Word',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-word-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch = $("#formsearch")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                    }
                });
            },
            init: function () {
                var me = this;
                me.setConfig();
                me.setForm();
                me.setGrid();
                me.reload();
                return me;
            }
        };
        $(function () {
            business.init();
            window.onActive = function () {
                business.reload();
            };
        });
    </script>
</body>
</html>
