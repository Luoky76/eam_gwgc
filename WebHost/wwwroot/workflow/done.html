<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title>已办任务</title>
    <script src="../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <div id="mainsearch">
        <form action="" id="formsearch" class="l-form">
        </form>
    </div>
    <form action="" id="mainform">
        <div id="maingrid">
        </div>
    </form>
    <script type="text/javascript">
        'use strict';
        var business = {
            dataStatus: [],
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            { display: "启动时间从", name: "sdate", dbname: "StartDate", newline: false, upper: true, type: "date", op: "greaterorequal", options: { format: "yyyy-MM-dd hh:mm" } },
                            { display: "到", name: "edate", dbname: "StartDate", newline: false, upper: true, type: "date", op: "lessorequal", options: { format: "yyyy-MM-dd hh:mm" } },
                            { display: "流程标题", name: "_search_Title", dbname: "Title", newline: false, upper: true, type: "text", options: {} }
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "流程标题", name: "Title", type: "text" },
                            { display: "节点", name: "NodeName", type: "text" },
                            { display: "处理人", name: "Operator", type: "text" },
                            {
                                display: "结果", name: "NodeStatus", type: "select", format: {
                                    data: function () { return me.dataStatus; }, formatRender: function (value, rowdata, column) {
                                        if (value.length < 1) return "";
                                        var text = value.join(",");
                                        var cls = "";
                                        switch (text) {
                                            case "同意":
                                                cls = "l-tag-success";
                                                break;
                                            case "拒绝":
                                                cls = "l-tag-error";
                                                break;
                                        }
                                        return '<div class="l-tag ' + cls + '">' + text + '</div>';
                                    }
                                }
                            },
                            {
                                display: "意见", name: "NodeReason", type: "text", render: function (rowdata, rowindex, value, column) {
                                    if (value === undefined || value === null) return value;
                                    return value === (me.dataStatus[rowdata.NodeStatus] || {}).TEXT ? "" : value;
                                }
                            },
                            { display: "启动时间", name: "StartDate", type: "date" },
                            { display: "完成时间", name: "FinishDate", type: "date" },
                            { display: "耗时", name: "Elapsed", type: "text" },
                            { display: "发起人", name: "Creator", type: "text" },
                            {
                                display: "操作", name: "Action", type: "text", minWidth: 100, render: function (rowdata, _rowindex, value) {
                                    return '<a class="l-grid-row-button" href="javascript:business.handle()"><i class="fa fa-search" aria-hidden="true" /></i>详情</a>';
                                }
                            }
                        ]
                    }
                };
            },
            grid: null,
            searchForm: null,
            buttons: null,
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'workflow/query/statusData',
                    success: function (data) {
                        me.dataStatus = data;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    dateFormat: 'yyyy-MM-dd hh:mm',
                    autoWidth: true,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    usePager: false,
                    dataAction: 'local',
                    toolbar: {},
                    url: 'workflow/query/done',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: 'Id',
                    sortOrder: 'desc',
                    width: '100%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: true,
                    clickToEdit: true,
                    onBeforeEdit: function (editParm) {
                        switch (editParm.column.name) {
                            case "":
                                if (editParm.record.__status == "add") return true;
                                else return false;
                                break;
                        }
                    },
                    onLoadSuccess: function (data, g) {
                        if (data && data.Rows) {
                            var rows = data.Rows || [];
                            for (var i = 0, len = rows.length; i < len; i++) {
                                var row = rows[i];
                                if (row.FinishDate) {
                                    var minute = parseInt((row.FinishDate.toDate() - row.StartDate.toDate()) / (1000 * 60));
                                    var hour = parseInt(minute / 60);
                                    row.Elapsed = (hour > 0 ? hour + "小时" : "") + (minute % 60) + "分钟";
                                }
                            }
                        }
                    },
                    rowAttrRender: function (rowdata, rowid) {
                        return "";
                    }
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "Excel":
                            $.ligerDialog.open({
                                url: "../System/Export.html?exporttype=xls",
                                modal: true
                            });
                            break;
                        case "Pdf":
                            $.ligerDialog.open({
                                url: "../System/Export.html?exporttype=pdf",
                                modal: true
                            });
                            break;
                    }
                }
            },
            addTab: function (text, url, data) {
                var me = this;
                if (parent.f_addTab) {
                    parent.f_addTab(undefined, text, gksybConfigs.urlBase + "workflow/" + url);
                    return;
                }
                $.ligerDialog.open({
                    width: 1100,
                    height: 800,
                    allowClose: true,
                    title: text,
                    url: url,
                    isHidden: false,
                    showMax: false,
                    showToggle: false,
                    showMin: false,
                    isResize: true,
                    slide: false,
                    data: data,
                    onClosed: me.reload.bind(me)
                });
            },
            handle: function () { //处理
                var me = this;
                var selected = me.grid.getSelectedRow();
                if (!selected) {
                    LG.tip('请选择行!');
                    return;
                }
                me.addTab(selected.Title, 'flow-detail.html?nid=' + selected.Id + '&isView=1');
            },
            reload: function () { //刷新
                var me = this;
                me.buttons[0].click();
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Pdf',
                        text: '导出Pdf',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-word-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch = $("#formsearch")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                        g.setData({ sdate: LG.addDays(new Date(), -90), edate: LG.truncDate(LG.addDays(new Date(), 1), "") });
                    }
                });
            },
            init: function () {
                var me = this;
                me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.setGrid();
                me.reload();
                return me;
            }
        };
        $(function () {
            business.init();
            window.onActive = function () {
                business.reload();
            };
        });
    </script>
</body>
</html>
