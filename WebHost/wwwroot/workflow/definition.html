<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title>流程定义</title>
    <script src="../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <div id="mainsearch">
        <form action="" id="formsearch" class="l-form">
        </form>
    </div>
    <form action="" id="mainform">
        <div id="maingrid">
        </div>
    </form>
    <script type="text/javascript">
        'use strict';
        var business = {
            dataCorp: [],
            dataFlag: [{ ID: "1", TEXT: "正常" }, { ID: "0", TEXT: "已下线" }],
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            { display: "组织", name: "_search_CORPID", width: 180, type: "select", options: { data: function () { return me.dataCorp; }, autocomplete: true } },
                            { display: "流程名称", name: "_search_FLOW_NAME", newline: false, upper: true, type: "text", options: {} },
                            { display: "流程标题", name: "_search_FLOW_TITLE", newline: false, upper: true, type: "text", options: {} },
                            { display: "状态", name: "_search_FLAG", width: 100, newline: false, upper: true, type: "select", options: { data: me.dataFlag } }
                        ]
                    },
                    grid: {
                        columns: [
                            {
                                display: "流程名称", name: "FLOW_NAME", width: 100, type: "text", render: function (_rowdata, _rowindex, value) {
                                    return '<a class="l-grid-row-button" href="javascript:business.modify()">' + value + '</a>';
                                }
                            },
                            { display: "流程标题", name: "FLOW_TITLE", width: 100, type: "text" },
                            { display: "所属组织", name: "CORPID", width: 200, type: "select", format: { data: function () { return me.dataCorp; } } },
                            {
                                display: "流程版本", name: "FLOW_VERSION", width: 100, type: "int", render: function (rowdata, rowindex, value, column) {
                                    return '<div class="l-tag">V' + (value || "0") + '</div>';
                                }
                            },
                            { display: '顺序', name: 'FLOW_ORDER', width: 80, validate: { required: true }, editor: { type: 'int' } },
                            { display: "状态", name: "FLAG", width: 100, type: "select", format: { data: function () { return me.dataFlag; } } },
                            { display: "创建人", name: "CREATEUSER", width: 100, type: "text" },
                            { display: "创建日期", name: "CREATEDATE", width: 100, type: "date" },
                            { display: "最后修改人", name: "MODIFYUSER", width: 100, type: "text" },
                            { display: "修改日期", name: "MODIFYDATE", width: 100, type: "date" }
                        ]
                    }
                };
            },
            grid: null,
            searchForm: null,
            buttons: null,
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'workflow/definition/comboxdata',
                    loading: '正在获取中...',
                    success: function (data) {
                        me.dataCorp = data.corpData;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    autoWidth: true,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    usePager: false,
                    dateFormat: "yyyy-MM-dd hh:mm",
                    dataAction: 'local',
                    toolbar: {},
                    url: 'workflow/definition/list',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: 'FLOW_ORDER',
                    sortOrder: 'asc',
                    width: '100%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: true,
                    clickToEdit: true,
                    onBeforeEdit: function (editParm) {
                        switch (editParm.column.name) {
                            case "":
                                if (editParm.record.__status == "add") return true;
                                else return false;
                                break;
                        }
                    },
                    onSuccess: function (data, g) {
                        if (data && data.Rows) {
                            var rows = data.Rows || [];
                            for (var i = 0, len = rows.length; i < len; i++) {
                                var row = rows[i];
                                row.OLDROLEID = row.ROLEID;
                            }
                        }
                    },
                    rowAttrRender: function (rowdata, rowid) {
                        if (rowdata && rowdata.FLAG && rowdata.FLAG === "0") {
                            return "style='color:red;'";
                        }
                        return "";
                    }
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "add":
                            me.add();
                            break;
                        case "modify":
                            me.modify();
                            break;
                        case "delete":
                            me.delete();
                            break;
                        case "save":
                            me.save();
                            break;
                        case "Excel":
                            $.ligerDialog.open({
                                url: "../System/Export.html?exporttype=xls",
                                modal: true
                            });
                            break;
                        case "Word":
                            $.ligerDialog.open({
                                url: "../System/Export.html?exporttype=doc",
                                modal: true
                            });
                            break;
                    }
                }
                me.grid.set({
                    toolbar: {
                        "items": [
                            { id: "add", text: '增加', click: me.toolbarBtnItemClick, icon: "fa fa-plus" },
                            { id: "modify", text: '修改', click: me.toolbarBtnItemClick, icon: "fa fa-edit" },
                            { id: "delete", text: '删除', click: me.toolbarBtnItemClick, icon: "fa fa-times" },
                            { id: "save", text: '保存', click: me.toolbarBtnItemClick, icon: "fa fa-save" }
                        ]
                    }
                });
            },
            addTab: function (text, url, data) {
                var me = this;
                if (parent.f_addTab) {
                    parent.f_addTab(undefined, text, gksybConfigs.urlBase + "workflow/" + url);
                    return;
                }
                $.ligerDialog.open({
                    width: 1100,
                    height: 800,
                    allowClose: true,
                    title: text,
                    url: url,
                    isHidden: false,
                    showMax: false,
                    showToggle: false,
                    showMin: false,
                    isResize: true,
                    slide: false,
                    data: data,
                    onClosed: me.reload.bind(me)
                });
            },
            add: function () { //新增
                var me = this;
                me.addTab('新建流程设计', 'flow-design.html');
            },
            modify: function () { //修改
                var me = this;
                var selected = me.grid.getSelectedRow();
                if (!selected) {
                    LG.tip('请选择行!');
                    return;
                }
                var sid = selected.ID
                me.addTab('【' + selected.FLOW_NAME + '】流程设计', 'flow-design.html?sid=' + sid);
            },
            save: function () { //保存
                var me = this;
                if (me.grid.endEdit() != false) {
                    if (!me.grid.isDataChanged) {
                        LG.showSuccess('无修改');
                        return;
                    }
                    if (!me.grid.validChangeRows()) return false;
                    var changeRow = me.grid.getChangedRows();
                    LG.ajax({
                        jsToken: true,
                        url: 'workflow/definition/saveOrder',
                        loading: '正在保存中...',
                        data: changeRow,
                        success: function () {
                            me.grid.isDataChanged = false;
                            LG.showSuccess('保存成功', function () {
                                me.reload();
                            });
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }

            },
            reload: function () { //刷新
                var me = this;
                me.buttons[0].click();
            },
            delete: function () { //删除
                var me = this;
                if (me.grid.endEdit() != false) {
                    var selected = me.grid.getSelectedRows();
                    if (selected.length > 0) {
                        $.ligerDialog.confirm('确定删除吗?', function (confirm) {
                            if (confirm) {
                                for (var i = 0, len = selected.length; i < len; i++) {
                                    me.grid.deleteRow(selected[i]);
                                }
                                me.save();
                            }
                        });
                    } else {
                        LG.tip('请选择行!');
                    }
                }
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Word',
                        text: '导出Word',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-word-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch = $("#formsearch")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                        me.searchForm.setData({ _search_FLAG: "1" });
                    }
                });
                me.buttons[0].click(); //查询
            },
            init: function () {
                var me = this;
                me.loadComboxData();
                me.setConfig();
                me.setGrid();
                me.setForm();
                return me;
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>
</html>
