<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title>通用穿梭框</title>
    <script src="../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px;overflow:hidden;">
    <div id="transfer">
    </div>
    <script type="text/javascript">
        'use strict';
        var business = {
            grid: null,
            searchForm: null,
            buttons: null,
            initTransfer: function () {
                var me = this;
                var $window = $(window);
                var options = {
                    url: me.data.url,
                    data: me.data.data,
                    title: me.data.display,
                    title2: me.data.display ? ("已选" + me.data.display) : me.data.display,
                    value: me.data.values,
                    width: (($window.width() - 60) / 2),
                    height: ($window.height() - 130),
                    split: me.data.split
                };
                options = $.extend(options, me.data.options);
                me.transfer = $("#transfer").ligerTransfer(options);
            },
            close: function () {
                var me = this;
                function inner(callback) {
                    if (callback) return callback(1);
                    return true;
                }
                inner(function (status) {
                    if (status > 0) {
                        if (me.dialog) {
                            me.dialog.close();
                            return;
                        }
                        var win = parent || window;
                        if (win.closeCurrentTab) win.closeCurrentTab();
                        else win.close();
                    }
                });
            },
            setFormButtons: function () {
                var me = this;
                //表单底部按钮
                var buttons = [];
                buttons.push({ text: '关闭', onclick: me.close.bind(me) });
                buttons.push({ text: '确定', onclick: me.save.bind(me) });
                LG.addFormButtons(buttons);
                me.formButtons = buttons;
            },
            save: function () {
                var me = this;
                var rows = me.transfer.getSelectedItems() || [];
                var values = [];
                for (var i = 0, l = rows.length; i < l; i++) {
                    var row = rows[i];
                    values.push(row[me.transfer.options.valueField]);
                }
                if (me.data.callback) {
                    me.data.callback(values, rows);
                }
                me.close();
            },
            init: function () {
                var me = this;
                if (frameElement && frameElement.dialog) {
                    me.dialog = frameElement.dialog;
                    if (me.dialog.options.title === null) me.dialog.dialog.removeClass("l-dialog-notitle");
                    me.data = frameElement.dialog.get('data') || {};
                    //me.data = {
                    //    url: 'popup/users',
                    //    display:"标题",
                    //    values: "123,456,789",//[123,456,789]
                    //    //split:",",
                    //    //options: {
                    //    //    columns: [
                    //    //        { header: 'ID', name: 'ID', width: 20 },
                    //    //        { header: '名字', name: 'TEXT' },
                    //    //        { header: '值', name: 'VALUE' }
                    //    //    ]
                    //    //},
                    //    callback: function (values, rows) {
                    //    }
                    //};
                }
                if (!me.data) {
                    LG.showError("参数不完整");
                    return;
                }
                me.data.split = me.data.split || ",";
                me.setFormButtons();
                me.initTransfer();
                return me;
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>
</html>
