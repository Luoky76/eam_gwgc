<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title>通用树形挑选</title>
    <script src="../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;overflow:hidden;">
    <div id="mainsearch" style="display:none;">
        <form action="" id="formsearch" class="l-form">
        </form>
    </div>
    <form action="" id="mainform">
        <div id="maingrid">
        </div>
    </form>
    <script type="text/javascript">
        'use strict';
        var business = {
            grid: null,
            searchForm: null,
            buttons: null,
            setGrid: function () {
                var me = this;
                var options = $.extend({
                    url: me.data.url,
                    autoWidth: true,
                    delayLoad: false,
                    usePager: false,
                    dataAction: 'local',
                    toolbar: {},
                    rowKey: "ID",
                    sortName: 'TEXT',
                    sortOrder: 'asc',
                    width: '100%',
                    height: '100%',
                    heightDiff: -40,
                    checkbox: true,
                    autoCheckChildren: false,
                    isMultiSelect: true,
                    allowUnSelectRow: false,
                    tree: {
                        idField: "ID",
                        parentIDField: "PID",
                        columnName: "TEXT",
                        isExtend: function (rowData, parent, level) {
                            return level < 2;
                        }
                    },
                    columns: [
                        { display: me.data.display || "类型", name: "TEXT", type: "text" }
                    ],
                    rowAttrRender: function () {
                        return "style='user-select:none;'";
                    },
                    enabledEdit: false,
                    clickToEdit: false,
                    isChecked: function (item) {
                        if (me._storageSelect) {
                            var key = item[this.rowKey];
                            var isSelect = me._storageSelect[key] === true;
                            delete me._storageSelect[key];
                            if (isSelect) return true;
                        }
                        return false;
                    },
                    onComplete: function () {
                        var row = this.getSelectedRow();
                        if (!row && me._storageSelect) {
                            var rows = this.rows || [];
                            for (var i = 0, l = rows.length; i < l; i++) {
                                var item = rows[i];
                                var key = item[this.options.rowKey];
                                if (me._storageSelect[key] === true) {
                                    row = item;
                                    break;
                                }
                            }
                        }
                        if (row) {
                            this.scrollToRow(row["__index"]);
                        }
                    }
                }, me.data.options);
                options.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid(options);
            },
            reload: function () { //刷新
                var me = this;
                me.buttons[0].click();
            },
            setForm: function () {
                var me = this;
                var $formsearch = $("#formsearch")
                var options = {
                    fields: me.data.fields || [
                        { display: me.data.display || "类型", name: "TEXT", width: 180, type: "text" }
                    ],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            var p = me.grid.options;
                            LG.commonSearch($formsearch, me.grid, undefined, (p.usePager && p.pageCount > 1));
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                    }
                };
                options.fields.removeNull();
                if (options.fields.length > 0) $("#mainsearch").show();
                me.searchForm = $formsearch.ligerForm(options);
            },
            close: function () {
                var me = this;
                function inner(callback) {
                    if (callback) return callback(1);
                    return true;
                }
                inner(function (status) {
                    if (status > 0) {
                        if (me.dialog) {
                            me.dialog.close();
                            return;
                        }
                        var win = parent || window;
                        if (win.closeCurrentTab) win.closeCurrentTab();
                        else win.close();
                    }
                });
            },
            setFormButtons: function () {
                var me = this;
                //表单底部按钮
                var buttons = [];
                buttons.push({ text: '关闭', onclick: me.close.bind(me) });
                buttons.push({ text: '确定', onclick: me.save.bind(me) });
                LG.addFormButtons(buttons);
                me.formButtons = buttons;
            },
            save: function () {
                var me = this;
                var rows = me.grid.getSelectedRows() || [];
                var values = [];
                for (var i = 0, l = rows.length; i < l; i++) {
                    var row = rows[i];
                    values.push(row[me.grid.options.rowKey]);
                }
                if (me.data.callback) {
                    me.data.callback(values, rows);
                }
                me.close();
            },
            initSelect: function () {
                var me = this;
                var values = $.isArray(me.data.values) ? me.data.values : (me.data.values || "").split(me.data.split);
                var select = {};
                for (var i = 0, l = values.length; i < l; i++) {
                    var item = values[i];
                    select[item] = true;
                }
                me._storageSelect = select;
            },
            init: function () {
                var me = this;
                if (frameElement && frameElement.dialog) {
                    me.dialog = frameElement.dialog;
                    me.data = frameElement.dialog.get('data') || {};
                    //me.data = {
                    //    url: 'popup/users',
                    //    display: "列名",//默认值中的列名
                    //    values: "123,456,789",//[123,456,789]
                    //    //split:",",
                    //    options: {
                    //        columns: [
                    //            { display: "表格列", name: "TEXT", type: "text" }
                    //        ]
                    //    },
                    //    fields: [
                    //        { display: "查询条件", name: "TEXT", type: "text" }
                    //    ],
                    //    callback: function (values, rows) {
                    //    }
                    //};
                }
                if (!me.data || !me.data.options) {
                    LG.showError("参数不完整");
                    return;
                }
                me.data.split = me.data.split || ",";
                me.initSelect();
                me.setGrid();
                me.setForm();
                me.setFormButtons();
                return me;
            }
        };
        business.init();
    </script>
</body>
</html>
