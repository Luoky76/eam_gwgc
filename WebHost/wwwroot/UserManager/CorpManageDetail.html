<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title>组织架构 明细</title>
    <script src="../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <form id="mainform">
    </form>
    <script type="text/javascript">
        'use strict';
        var business = {
            dialogData: {},
            isAddNew: false,
            isView: true,
            sid: getQueryStringByName("sid"),
            pid: "",
            dataCorp: [],
            dataCorpType: [{ ID: "G", TEXT: "公司" }, { ID: "B", TEXT: "部门" }],
            setConfig: function () {
                var me = this;
                me.config = {
                    form: {
                        fields: [
                            { name: "CORPID", type: "hidden", vt: "number" },
                            {
                                display: "组织全称", name: "CNAME", newline: false, labelWidth: 110, width: 180,
                                validate: { required: true, maxlength: 100 }, type: "text", options: {}
                            },
                            {
                                display: "组织简称", name: "CORP_SNAME", newline: false, labelWidth: 110, width: 180,
                                validate: { required: true, maxlength: 50 }, type: "text", options: {}
                            },
                            {
                                display: "组织类型", name: "CLASSFLAG", newline: false, labelWidth: 110, width: 180,
                                validate: { required: true }, type: "select", options: { data: me.dataCorpType }
                            },
                            {
                                display: "组织机构代码", name: "CNO", newline: false, upper: true, labelWidth: 110, width: 180,
                                validate: { required: true }, type: "text", options: {}
                            },
                            {
                                display: "组织英文全称", name: "CORP_ENAME", newline: false, labelWidth: 110, width: 180,
                                validate: { maxlength: 100 }, type: "text", options: {}
                            },
                            {
                                display: "上级组织", name: "CORPPARENTID", newline: false, labelWidth: 110, width: 180,
                                type: "select", options: { autocomplete: true, data: me.dataCorp }
                            },
                            {
                                display: "通讯地址", name: "CORP_ADDRESS", newline: false, labelWidth: 110, width: 180,
                                validate: { maxlength: 180 }, type: "text", options: {}
                            },
                            {
                                display: "公司联系电话", name: "CORP_TELE", newline: false, labelWidth: 110, width: 180,
                                validate: { maxlength: 20 }, type: "text", options: {}
                            },
                            {
                                display: "公司传真", name: "CORP_FAX", newline: false, labelWidth: 110, width: 180,
                                validate: { maxlength: 20 }, type: "text", options: {}
                            },
                            {
                                display: "公司Email", name: "CORP_EMAIL", newline: false, labelWidth: 110, width: 180,
                                validate: { maxlength: 50 }, type: "text", options: {}
                            },
                            {
                                display: "主要联系人", name: "CORP_LINK_MAN", newline: false, labelWidth: 110, width: 180,
                                validate: { maxlength: 20 }, type: "text", options: {}
                            },

                            {
                                display: "联系人电话", name: "LINK_MAN_TELE", newline: false, labelWidth: 110, width: 180,
                                validate: { maxlength: 20 }, type: "text", options: {}
                            },

                            {
                                display: "联系人Email", name: "LINK_MAN_EMAIL", newline: false, labelWidth: 110, width: 180,
                                validate: { maxlength: 20 }, type: "text", options: {}
                            },
                            {
                                display: "纳税人识别号", name: "FEECLIENT_ID", newline: false, upper: true, labelWidth: 110, width: 180,
                                validate: { maxlength: 20 }, type: "text", options: {}
                            },
                            {
                                display: "开户行", name: "BANK", newline: false, upper: true, labelWidth: 110, width: 180,
                                validate: { maxlength: 20 }, type: "text", options: {}
                            },
                            {
                                display: "开户行帐号", name: "ACCONTNO", newline: false, upper: true, labelWidth: 110, width: 180,
                                validate: { maxlength: 100 }, type: "text", options: {}
                            },
                            {
                                display: "财务电话", name: "CWTELE", newline: false, labelWidth: 110, width: 180,
                                validate: { maxlength: 100 }, type: "text", options: {}
                            },
                            {
                                display: "备注", name: "REMARK", newline: false, labelWidth: 110, width: 180,
                                validate: { maxlength: 1000 }, type: "text", options: {}
                            },
                            {
                                display: "有效标志", name: "VALIDFLAG", newline: false, labelWidth: 110, width: 180,
                                validate: { maxlength: 1 }, type: "chkStr", options: {}
                            }
                        ]
                    }
                };
            },
            mainform: null,
            buttons: null,
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'corp/comboxData',
                    loading: '正在获取中...',
                    success: function (data) {
                        me.dataCorp = data.corpData;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            loadData: function () {
                var me = this;
                me.loadComboxData();
                if (me.isAddNew) {
                    me.mainform.setOrginData({ "CORPPARENTID": me.pid, CLASSFLAG: (me.dialogData.corpType || "G"), "VALIDFLAG": "1" });
                }
                else {
                    LG.ajax({
                        async: false,
                        url: 'corp/get',
                        loading: '正在获取中...',
                        data: { id: me.sid },
                        success: function (data) {
                            data.OLDMODIFYDATE = data.MODIFYDATE;
                            me.mainform.setOrginData(data);
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                    if (me.isView) {
                        me.mainform.setReadonly(true);
                    }
                }
                me.mainform.focus();
            },
            save: function () { //保存
                var me = this;
                if ($.isEmptyObject(me.mainform.getChanges())) {
                    LG.showSuccess('无修改');
                    return;
                }
                if (!me.mainform.valid()) {
                    me.mainform.showInvalid();
                    return;
                }
                function handle(data) {
                    return data;
                }
                var data = handle(me.mainform.getData());
                var original = handle(me.mainform.getOrginData());
                var changeRow = new Object();
                if (me.isAddNew) {
                    changeRow["added"] = [data];
                }
                else {
                    changeRow["updated"] = [data];
                    changeRow["original"] = [original];
                }
                LG.ajax({
                    jsToken: true,
                    url: 'corp/save',
                    loading: '正在保存中...',
                    data: changeRow,
                    success: function () {
                        LG.showSuccess('保存成功', function () {
                            location.reload(true);
                        });
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            close: function (skipConfirm) {
                var me = this;
                function inner(callback) {
                    if (!skipConfirm && !$.isEmptyObject(me.mainform.getChanges())) {
                        $.ligerDialog.confirm($.ligerDefaults.GridString.isContinueByDataChanged, function (confirm) {
                            if (confirm) {
                                if (callback) callback(2);
                            }
                            else {
                                if (callback) callback(0);
                            }
                        });
                        if (callback) return callback(-1);
                        return false;
                    }
                    if (callback) return callback(1);
                    return true;
                }
                inner(function (status) {
                    if (status > 0) {
                        if (me.dialog) {
                            me.dialog.close();
                            return;
                        }
                        var win = parent || window;
                        if (win.closeCurrentTab) win.closeCurrentTab();
                        else win.close();
                    }
                });
            },
            setFormDefaultBtn: function () {
                var me = this;
                //表单底部按钮
                var buttons = [];
                if (!me.isView) {
                    buttons.push({
                        text: '重置', onclick: function () {
                            $.ligerDialog.confirm("确定重置数据吗?", function (confirm) {
                                if (confirm) {
                                    location.reload(true);
                                }
                            });
                        }
                    });
                }
                buttons.push({ text: '关闭', onclick: me.close.bind(me) });
                if (!me.isView) buttons.push({ text: '保存', onclick: me.save.bind(me) });
                LG.addFormButtons(buttons);
                me.formButtons = buttons;
            },
            setForm: function () {
                var me = this;
                me.config.form.fields.removeNull();
                var $mainform = $("#mainform")
                //搜索表单应用ligerui样式
                me.mainform = $mainform.ligerForm({
                    enterMoveNextControl: true,
                    labelAlign: 'right',
                    space: 3,
                    validate: true,
                    fields: me.config.form.fields,
                    labelWidth: 150,
                    onAfterSetFields: function (g) {
                        me.mainform = g;
                        me.buttons = g.options.buttons;
                    }
                });
                me.setFormDefaultBtn();
            },
            init: function () {
                var me = this;
                if (frameElement && frameElement.dialog) {
                    me.dialog = frameElement.dialog;
                    me.dialogData = me.dialog.get('data');
                    me.callback = me.dialogData.callback;
                    if (me.dialogData.sid) me.sid = me.dialogData.sid
                    if (me.dialogData.pid) me.pid = me.dialogData.pid
                    me.isView = me.dialogData.view === "1";
                }
                if ((me.sid || "0") === "0") me.sid = "";
                me.isAddNew = (me.sid === "");
                me.isView = false;
                me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.loadData();
                return me;
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>
</html>
