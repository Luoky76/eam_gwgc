<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title>组织</title>
    <script src="../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 2px; height: 100%;">
    <div id="layout">
        <div position="left" title="组织结构模块" id="mainmenu">
            <ul id="maintree"></ul>
        </div>
        <div position="center" title="组织结构列表">
            <div id="iframeloading" class='l-loading'>
            </div>
            <form id="mainform">
                <div id="maingrid"></div>
            </form>
        </div>
    </div>
    <script type="text/javascript">
        'use strict';
        var business = {
            rootValue: "ROOT",
            iframeloading: $("#iframeloading"),
            tree: null,
            detailWidth: 920,
            detailHeight: 450,
            dataCorpType: [{ ID: "G", TEXT: "公司" }, { ID: "B", TEXT: "部门" }],
            setConfig: function () {
                var me = this;
                me.config = {
                    grid: {
                        columns: [
                            { display: "组织简称", name: "CORP_SNAME", width: 100, type: "text", align: "center" },
                            { display: "组织机构代码", name: "CNO", width: 100, type: "text", align: "center" },
                            { display: "组织全称", name: "CNAME", width: 100, type: "text", align: "center" },
                            { display: "组织类型", name: "CLASSFLAG", type: "select", format: { data: me.dataCorpType } },
                            { display: "上级组织", name: "CORPPARENTID", type: "select", format: { data: me.dataCorp } },
                            { display: "客户组织英文全称", name: "CORP_ENAME", width: 100, type: "text", align: "center" },
                            { display: "排序", name: "CORP_SORT", width: 100, type: "int" },
                            { display: "通讯地址", name: "CORP_ADDRESS", width: 100, type: "text", align: "center" },
                            { display: "公司联系电话", name: "CORP_TELE", width: 100, type: "text", align: "center" },
                            { display: "公司传真", name: "CORP_FAX", width: 100, type: "text", align: "center" },
                            { display: "公司Email", name: "CORP_EMAIL", width: 100, type: "text", align: "center" },
                            { display: "主要联系人", name: "CORP_LINK_MAN", width: 100, type: "text", align: "center" },
                            { display: "联系人电话", name: "LINK_MAN_TELE", width: 100, type: "text", align: "center" },
                            { display: "联系人邮箱", name: "LINK_MAN_EMAIL", width: 100, type: "text", align: "center" },
                            { display: "开户证明", name: "OPENING_CERTIFICAT", width: 100, type: "text", align: "center" },
                            { display: "开户行", name: "BANK", dbname: "BANK", width: 100, type: "text", align: "center" },
                            { display: "帐号", name: "ACCONTNO", dbname: "ACCONTNO", width: 100, type: "text", align: "center" },
                            { display: "财务电话", name: "CWTELE", dbname: "CWTELE", width: 100, type: "text", align: "center" },
                            { display: "有效否", name: "VALIDFLAG", width: 100, type: "text", formatType: "chk", align: "center" },
                            { display: "修改人", name: "MODIFYUSER", dbname: "MODIFYUSER", width: 100, type: "text", align: "center" },
                            { display: "修改日期", name: "MODIFYDATE", dbname: "MODIFYDATE", width: 100, type: "date", align: "center" }
                        ]
                    }
                };
            },
            grid: null,
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'corp/comboxData',
                    loading: '正在获取中...',
                    success: function (data) {
                        me.dataCorp = data.corpData;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    title: '<input id="showAll" />',
                    dateFormat: "yyyy-MM-dd hh:mm",
                    autoWidth: true,
                    delayLoad: true,
                    usePager: false,
                    columns: me.config.grid.columns,
                    dataAction: 'server',
                    toolbar: {},
                    url: 'corp/list',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: 'CORP_SORT,CORPPARENTID,CORP_SNAME',
                    sortOrder: 'asc',
                    width: '100%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: false,
                    clickToEdit: false,
                    onBeforeEdit: function (editParm) {
                        switch (editParm.column.name) {
                            case "":
                                if (editParm.record.__status == "add") return true;
                                else return false;
                                break;
                        }
                    },
                    onSuccess: function (data, g) {
                        me.iframeloading.hide();
                    },
                    rowAttrRender: function (rowdata, rowid) {
                        if (rowdata && rowdata.VALIDFLAG && rowdata.VALIDFLAG !== "1") {
                            return "style='color:red;'";
                        }
                        return "";
                    },
                    onDblClickRow: function (data, rowid, rowdata) {
                        me.modify(rowid);
                    }
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "add":
                            me.add();
                            break;
                        case "modify":
                            me.modify();
                            break;
                        case "delete":
                            me.delete();
                            break;
                        case "save":
                            me.save();
                            break;
                        case "Excel":
                            $.ligerDialog.open({
                                url: "../System/Export.html?exporttype=xls",
                                modal: true
                            });
                            break;
                        case "Pdf":
                            $.ligerDialog.open({
                                url: "../System/Export.html?exporttype=pdf",
                                modal: true
                            });
                            break;
                    }
                }
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            add: function () { //新增
                var me = this;
                me.dialog = $.ligerDialog.open({
                    width: me.detailWidth,
                    height: me.detailHeight,
                    allowClose: true,
                    title: '[新增]' + document.title,
                    url: "CorpManageDetail.html",
                    isHidden: false,
                    showMax: false,
                    showToggle: false,
                    showMin: false,
                    isResize: true,
                    slide: false,
                    onClosed: me.reloadTree.bind(me),
                    data: { "sid": null, "pid": me.currentMenuParentNo, "corpType": me.corpType }
                });
            },
            modify: function (rowid) { //修改
                var me = this;
                var row = rowid ? me.grid.getRow(rowid) : me.grid.getSelectedRow();
                if (!row) {
                    LG.tip('请选择行!');
                    return;
                }
                me.dialog = $.ligerDialog.open({
                    width: me.detailWidth,
                    height: me.detailHeight,
                    allowClose: true,
                    title: '[修改]' + document.title,
                    url: "CorpManageDetail.html",
                    isHidden: false,
                    showMax: false,
                    showToggle: false,
                    showMin: false,
                    isResize: true,
                    slide: false,
                    onClosed: me.reloadTree.bind(me),
                    data: { "sid": row.CORPID }
                });
            },
            save: function () { //保存
                var me = this;
                if (me.grid.endEdit() != false) {
                    if (!me.grid.isDataChanged) {
                        LG.showSuccess('无修改');
                        return;
                    }
                    if (!me.grid.validChangeRows()) return false;
                    var changeRow = me.grid.getChangedRows();
                    LG.ajax({
                        jsToken: true,
                        url: 'Corp/Save',
                        loading: '正在保存中...',
                        data: changeRow,
                        success: function () {
                            LG.showSuccess('保存成功');
                            me.grid.isDataChanged = false;
                            me.reloadTree();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }
            },
            reloadTree: function () {
                var me = this;
                me.selectNode = me.tree.getSelected();
                me.tree.reload();
            },
            reload: function () { //刷新
                var me = this;
                var node = me.tree.getSelected();
                if (node && node.data) {
                    var nodeData = node.data;
                    var showAll = liger.get("showAll").getValue();
                    var parentNo = nodeData.ID;
                    var andRules = [], orRules = [];
                    if (parentNo === me.rootValue) {
                        parentNo = "";
                        if (!showAll) {
                            orRules.push({ field: 'CORPPARENTID', value: parentNo, op: 'equal' });
                            orRules.push({ field: "CORPPARENTID", op: "isnull" });
                            orRules.push({ field: "CORPPARENTID", op: "equal", value: "0" });
                        }
                    }
                    else {
                        if (showAll) {
                            andRules.push({ field: 'CORPID', value: nodeData.ID, op: 'notequal' });
                            andRules.push({ field: 'CORP_PATH', value: nodeData.CORP_PATH, op: 'startwith' });
                        }
                        else {
                            andRules.push({ field: 'CORPPARENTID', value: parentNo, op: 'equal' });
                        }
                    }
                    me.grid.set('parms', {
                        "where": JSON2.stringify({
                            op: "and",
                            rules: andRules,
                            groups: [{
                                op: "or",
                                rules: orRules
                            }]
                        })
                    });
                    me.currentMenuParentNo = parentNo;
                    me.corpType = nodeData.CLASSFLAG;
                }
                me.grid.loadData();
            },
            delete: function () { //删除
                var me = this;
                if (me.grid.endEdit() != false) {
                    var selected = me.grid.getSelectedRows();
                    if (selected.length > 0) {
                        $.ligerDialog.confirm('确定删除吗?', function (confirm) {
                            if (confirm) {
                                for (var i = 0, len = (selected || []).length; i < len; i++) {
                                    me.grid.deleteRow(selected[i]);
                                }
                                me.save();
                            }
                        });
                    } else {
                        LG.tip('请选择行!');
                    }
                }
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Pdf',
                        text: '导出Pdf',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-word-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            setTree: function () {
                var me = this;
                $("#showAll").ligerCheckBox({
                    type: "switch",
                    label: "全部下级组织",
                    value: true,
                    onChangeValue: function (input, value, g) {
                        me.reload();
                    }
                });
                me.tree = $("#maintree").ligerTree({
                    url: "corp/tree",
                    parms: {},
                    slide: false,
                    checkbox: false,
                    single: true,
                    needCancel: false,
                    parentIDFieldName: 'PARENTID',
                    iconClsFieldName: "ICON",
                    isExpand: 2,
                    filter: true,
                    onSuccess: function (data) {
                        if (me.selectNode && me.selectNode.data) this.selectNode(me.selectNode.data.ID);
                        else me.tree.selectNode(me.rootValue);
                    },
                    onSelect: function (node) {
                        me.iframeloading.show();
                        me.reload();
                    }
                });
            },
            init: function () {
                var me = this;
                me.loadComboxData();
                $("#layout").ligerLayout({ leftWidth: 240 });
                me.iframeloading.show();
                me.setConfig();
                me.setGrid();
                me.setTree();
                window.closeQuery = function (callback) {
                    if (!me.dialog) return callback();
                    return me.dialog.frame.business.closeQuery(callback);
                };
                return me;
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>
</html>
