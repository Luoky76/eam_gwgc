<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title>用户管理</title>
    <script src="../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <div id="mainsearch">
        <form action="" id="formsearch" class="l-form">
        </form>
    </div>
    <form action="" id="mainform">
        <div id="maingrid">
        </div>
    </form>
    <script type="text/javascript">
        'use strict';
        var business = {
            dataRole: [],
            dataCorp: [],
            initPassword: "",
            setConfig: function () {
                var me = this;
                var charLength = 7;
                me.config = {
                    search: {
                        fields: [
                            { display: "用户名", name: "_search_LOGINNAME", width: 100, upper: true, type: "text" },
                            { display: "名称", name: "_search_REALNAME", width: 100, upper: true, type: "text" },
                            { display: "角色", name: "_search_ROLE", width: 180, userSearch: false, type: "select", options: { data: [], autocomplete: true } },
                            { display: "组织", name: "_search_CORP", width: 180, userSearch: false, type: "select", options: { data: [], autocomplete: true } }
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "用户名", name: "LOGINNAME", width: 100, type: "text", validate: { required: true, maxlength: 50 }, editor: { upper: true, type: 'text' } },
                            {
                                display: "隶属角色", name: "ROLE", isSort: false, width: 100, minWidth: 130, type: "text", align: "center", formatType: "select", format: {
                                    data: function () { return me.dataRole; }, split: ",", formatRender: function (value, rowdata, column) {
                                        var strHref = "javascript:business.transferSelect('角色','" + column.name + "','user/roleData')";
                                        var strUrl = "<a style=\"color:Red\" href=" + strHref + ">设置</a>";
                                        if (value.length < 1) return strUrl;
                                        var texts = value.join(",");
                                        return "<a href=" + strHref + ">" + "<acronym title=\"" + texts + "\">" + (texts.length > charLength ? texts.substring(0, charLength) + "..." : texts) + "</acronym></a>";
                                    }
                                }, export: function (value, rowdata, column) {//导出处理
                                    return this.options.formatters['select'](value, column, rowdata, function (value) {
                                        return value.join(",");
                                    });
                                }
                            },
                            { display: "名称", name: "REALNAME", width: 100, type: "text", validate: { required: true, maxlength: 100 }, editor: { type: 'text' } },
                            { display: "本司否", name: "CLASS", width: 60, type: "chk", editor: { type: 'chkStr' } },
                            {
                                display: "组织岗位", name: "CORP", isSort: false, width: 120, type: "text", align: "center", formatType: "select", format: {
                                    data: function () { return me.dataCorp; }, split: ",", formatRender: function (value, rowdata, column,ids) {
                                        var strHref = "javascript:business.corpSelect('组织','" + column.name + "','user/corpData')";
                                        var strUrl = "<a style=\"color:Red\" href=" + strHref + ">设置</a>";
                                        if (value.length < 1) return strUrl;
                                        var txts = [];
                                        for (var i = 0, l = value.length; i < l; i++) {
                                            var station = rowdata.CorpStation[ids[i]];
                                            txts.push(station ? (value[i] + '(' + station + ')') : value[i]);
                                        }
                                        var texts = txts.join(",");
                                        return "<a href=" + strHref + ">" + "<acronym title=\"" + texts + "\">" + (texts.length > charLength ? texts.substring(0, charLength) + "..." : texts) + "</acronym></a>";
                                    }
                                }, export: function (value, rowdata, column) {//导出处理
                                    return this.options.formatters['select'](value, column, rowdata, function (value) {
                                        return value.join(",");
                                    });
                                }
                            },
                            { display: "所属组", name: "STATION", width: 100, type: "text", editor: { type: 'text' } },
                            {
                                display: "微信", name: "QQ", dbname: "QQ", width: 80, type: "text", align: "left", render: function (rowdata, rowindex, value, column) {
                                    return value ? "绑定" : "未绑定";
                                }
                            },
                            { display: "最后登录时间", name: "LASTLOGINTIME", width: 140, type: "date", format: "yyyy-MM-dd hh:mm", align: "left" },
                            { display: "有效否", name: "FLAG", width: 80, type: "chk", editor: { type: 'chkStr' } }
                        ]
                    }
                };
            },
            grid: null,
            searchForm: null,
            buttons: null,
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'user/comboxData',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        me.dataRole = data.role;
                        me.dataCorp = data.corp;
                        me.dataStation = data.station;
                        me.initPassword = data.initPassword;
                        if (me.grid) {
                            me.grid.set('title', '<span style="color: Red; ">初始密码为' + me.initPassword + '</span>');
                        }
                        var editor = null;
                        if (me.searchForm) {
                            editor = me.searchForm.getEditor("_search_ROLE");
                            if (editor) editor.setData(me.dataRole);
                            editor = me.searchForm.getEditor("_search_CORP");
                            if (editor) editor.setData(me.dataCorp);
                        }
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    title: '<span style="color: Red; ">初始密码为' + me.initPassword + '</span>',
                    autoWidth: true,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    usePager: false,
                    dataAction: 'local',
                    toolbar: {},
                    url: 'user/list',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: 'LOGINNAME',
                    sortOrder: 'asc',
                    width: '100%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: true,
                    clickToEdit: true,
                    onBeforeEdit: function (editParm) {
                        switch (editParm.column.name) {
                            case "LOGINNAME":
                                if (editParm.record.__status == "add") return true;
                                else return false;
                                break;
                        }
                    },
                    onSuccess: function (data, g) {
                        if (data && data.Rows) {
                            var rows = data.Rows;
                            for (var i = 0, len = (rows || []).length; i < len; i++) {
                                rows[i].OLDUSERID = rows[i].USERID;
                            }
                        }
                    },
                    rowAttrRender: function (rowdata, rowid) {
                        if (rowdata && rowdata.FLAG && rowdata.FLAG == "0") {
                            return "style='color:red;'";
                        }
                        return "";
                    }
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            transferSelect: function (detailType, name, url, width, height, options) {
                var me = this;
                var row = me.grid.getSelectedRow();
                options = $.extend({
                    url: url,
                    display: detailType,
                    values: row[name],
                    options: options,
                    callback: function (values) {
                        var newRowData = {};
                        newRowData[name] = values.join(",");
                        me.grid.updateRow(row, newRowData);
                    }
                }, options);
                $.ligerDialog.open({
                    width: width || 350,
                    height: height || 400,
                    title: null,
                    allowClose: false,
                    url: window.gksybConfigs.urlBase + "popup-select/transfer.html",
                    isResize: false,
                    slide: false,
                    data: options
                });
            },
            corpSelect: function (detailType, name, url) {
                var me = this;
                var row = me.grid.getSelectedRow();
                me.transferGridSelect(detailType, name, url, 600, 500, {
                    leftWidth: '38%',
                    callback: function (values, rows) {
                        var corpStation = {};
                        for (var i = 0, l = rows.length; i < l; i++) {
                            var item = rows[i];
                            corpStation[item.ID] = item.Station;
                        }
                        var newRowData = { CorpStation: corpStation };
                        newRowData[name] = values.join(",");
                        me.grid.updateRow(row, newRowData);
                    },
                    grid2: {
                        corpStation: row.CorpStation,
                        enabledEdit: true,
                        clickToEdit: true,
                        onLoadData: function (data) {
                            var g = this, p = g.options;
                            var rows = data[p.root];
                            for (var i = 0, l = rows.length; i < l; i++) {
                                var row = rows[i];
                                row.Station = p.corpStation[row.ID];
                            }
                        },
                        columns: [
                            { display: "组织", name: "TEXT", type: "text" },
                            {
                                display: "岗位", name: "Station", type: "select",minWidth:180, editor: {
                                    isMultiSelect: true, split:",",
                                    type: 'select', data: me.dataStation
                                }
                            }
                        ]
                    }
                });
            },
            transferGridSelect: function (detailType, name, url, width, height, options) {
                var me = this;
                var row = me.grid.getSelectedRow();
                options = $.extend({
                    url: url,
                    display: detailType,
                    values: row[name],
                    options: options,
                    callback: function (values) {
                        var newRowData = {};
                        newRowData[name] = values.join(",");
                        me.grid.updateRow(row, newRowData);
                    }
                }, options);
                $.ligerDialog.open({
                    width: width || 500,
                    height: height || 500,
                    title: '挑选' + detailType,
                    url: window.gksybConfigs.urlBase + "popup-select/transfer-grid.html",
                    isResize: true,
                    slide: false,
                    data: options
                });
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "add":
                            me.add();
                            break;
                        case "delete":
                            me.delete();
                            break;
                        case "save":
                            me.save();
                            break;
                        case "initPassword":
                            me.doInitPassword();
                            break;
                        case "Excel":
                            $.ligerDialog.open({ url: "../System/Export.html?exporttype=xls", modal: true });
                            break;
                        case "Word":
                            $.ligerDialog.open({ url: "../System/Export.html?exporttype=doc", modal: true });
                            break;
                    }
                }
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            doInitPassword: function () {
                var me = this;
                var grid = me.grid;
                if (grid.endEdit() != false) {
                    var selected = grid.getSelectedRows();
                    if (selected.length > 0) {
                        if (selected.length != 1) {
                            LG.tip('只能选择一行做密码初始化服务!');
                            return;
                        }
                        jQuery.ligerDialog.confirm('确定初始化密码为' + me.initPassword + '吗?', function (confirm) {
                            if (confirm) {
                                for (var i = 0, len = (selected || []).length; i < len; i++) {
                                    if (selected[i].USERID) {
                                        LG.ajax({
                                            jsToken: true,
                                            url: 'user/doInitPassword',
                                            loading: '正在保存中...',
                                            data: { id: selected[i].USERID },
                                            success: function () {
                                                LG.showSuccess('密码被初始化为' + me.initPassword);
                                            },
                                            error: function (message) {
                                                LG.showError(message);
                                            }
                                        });
                                    }
                                    else {
                                        LG.tip('此记录还未保存,无法进行密码初始化!');
                                        return;
                                    }
                                }
                            }
                        });
                    }
                    else {
                        LG.tip('请选择行!');
                    }
                }
            },
            add: function () { //新增
                var me = this;
                me.grid.addEditRow({ "CLASS": "0", "FLAG": "1" }, true);
            },
            save: function () { //保存
                var me = this;
                if (me.grid.endEdit() != false) {
                    if (!me.grid.isDataChanged) {
                        LG.showSuccess('无修改');
                        return;
                    }
                    if (!me.grid.validChangeRows()) return false;
                    var changeRow = me.grid.getChangedRows();
                    LG.ajax({
                        jsToken: true,
                        url: 'user/save',
                        loading: '正在保存中...',
                        data: changeRow,
                        success: function () {
                            LG.showSuccess('保存成功');
                            me.grid.isDataChanged = false;
                            me.reload();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }

            },
            reload: function () { //刷新
                var me = this;
                me.buttons[0].click();
            },
            delete: function () { //删除
                var me = this;
                if (me.grid.endEdit() != false) {
                    var selected = me.grid.getSelectedRows();
                    if (selected.length > 0) {
                        $.ligerDialog.confirm('确定删除吗?', function (confirm) {
                            if (confirm) {
                                for (var i = 0, len = (selected || []).length; i < len; i++) {
                                    me.grid.deleteRow(selected[i]);
                                }
                                me.save();
                            }
                        });
                    } else {
                        LG.tip('请选择行!');
                    }
                }
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Word',
                        text: '导出Word',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-word-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch = $("#formsearch")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid, function (form) {
                                var parms = me.grid.options.parms;
                                var data = form.getData();
                                delete parms.ROLE;
                                delete parms.CORP;
                                if (data._search_ROLE) parms.ROLE = data._search_ROLE;
                                if (data._search_CORP) parms.CORP = data._search_CORP;
                                return true;
                            });
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                    }
                });
            },
            init: function () {
                var me = this;
                me.setConfig();
                me.setGrid();
                me.setForm();
                me.loadComboxData();
                me.buttons[0].click(); //查询
                return me;
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>
</html>
