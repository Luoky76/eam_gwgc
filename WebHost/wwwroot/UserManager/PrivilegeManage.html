<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title>权限管理</title>
    <script src="../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 2px; height: 100%;">
    <div id="layout">
        <div position="center" id="mainmenu" title="权限管理">
            <div id="tabcontainer">
                <div id="rolelist" title="角色" tabid="rolelist">
                    <div class="searchbox">
                        <form id="formsearch">
                        </form>
                    </div>
                    <div id="rolegrid">
                    </div>
                </div>
                <div id="userlist" title="用户" tabid="userlist">
                    <div class="searchbox">
                        <form id="formsearch2">
                        </form>
                    </div>
                    <div id="usergrid">
                    </div>
                </div>
            </div>
        </div>
        <div position="bottom" title="权限控制">
            <div id="rightgrid">
            </div>
        </div>
    </div>
    <script type="text/javascript">
        'use strict';
        (function ($) {
            var config = [];
            var currentAppName = getQueryStringByName("appName");
            var roleAppName = getQueryStringByName("roleAppName");
            var IsAdmin = window.session.IsAdmin;
            IsAdmin = true;

            var layout = $("#layout").ligerLayout({
                //5分之3的高度
                bottomHeight: $(window).height() / 2,
                heightDiff: -6,
                onEndResize: updateGridHeight,
                onHeightChanged: updateGridHeight
            });
            var bottomHeader = $(".l-layout-bottom > .l-layout-header:first");

            var tab = $("#tabcontainer").ligerTab({ type: "brief" });
            if (!IsAdmin) {
                tab.removeTabItem("rolelist");
            }
            var selectedUserName, selectedRoleName;

            //屏蔽系统管理员
            var gridUserFilter = {
                op: 'and',
                rules: [
                ]
            };
            //屏蔽系统管理员角色
            var gridRoleFilter = {
                op: 'and',
                rules: [
                ]
            };

            var rolelistLoaded = false;
            var userlistLoaded = false;
            var gridRole, gridUser;

            //判断是否有权限
            function checkPermit(rowdata, data) {
                if (!data || !data.length) return false;
                var isButton = rowdata.BTNID != null && rowdata.BTNID != 0;
                for (var i = 0, l = data.length; i < l; i++) {
                    if (isButton && data[i].BTNNO == rowdata.ACCESSNO)
                        return true;
                    if (!isButton && data[i].MENUNO == rowdata.ACCESSNO)
                        return true;
                }
                return false;
            }

            //权限 保存按钮
            var toolbarOptions = {
                items: [
                    { text: '保存', cls: "confirmBtn commonBtn", click: f_save, icon: "fa fa-save" },
                    { text: '全部收起', cls: "confirmBtn commonBtn", click: f_collapse, icon: "fa fa-plus-square-o" },
                    { text: '全部展开', cls: "confirmBtn commonBtn", click: f_expand, icon: "fa fa-minus-square-o" }
                ]
            };

            //权限
            var gridRight = $("#rightgrid").ligerGrid({
                columns:
                    [
                        {
                            display: '权限', name: 'Permit', width: 60, minWidth: 60, isAllowHide: false, render: function (rowdata) {
                                var iconHtml = '<div class="access-icon access-permit l-checkbox';
                                if (rowdata.Permit) {
                                    iconHtml += " access-icon-selected l-checkbox-checked";
                                    if (!f_select(rowdata)) iconHtml += " access-icon-incomplete l-checkbox-incomplete";
                                }
                                iconHtml += '"';
                                iconHtml += ' rowid = "' + rowdata['__id'] + '"';
                                iconHtml += '></div>';
                                return iconHtml;
                            }
                        },
                        { display: '菜单-按钮', name: 'ACCESSNAME', align: 'left', width: 200, minWidth: 60 }
                    ], showToggleColBtn: false, width: '100%', height: 200, fixedCellHeight: true,
                columnWidth: 100, frozen: false, usePager: false, checkbox: false, rownumbers: false, toolbar: toolbarOptions,
                tree: { columnName: 'ACCESSNAME' },
                data: [], onAfterShowData: function (g) {
                    gridRight = this;
                    f_collapse();
                }
            });

            //分配权限、禁止权限按钮的事件
            $(document).on('click', "div.access-icon", function () {
                var selected = !$(this).hasClass("access-icon-selected");
                var ispermit = $(this).hasClass("access-permit");
                var rowid = $(this).attr("rowid");
                var rowdata = gridRight.records[rowid];
                if (ispermit) {
                    f_Permit(rowdata, selected);
                }
                else {
                    f_Forbid(rowdata, selected);
                }
            });

            //遍历是否全选中
            function f_select(rowdata) {
                var children = rowdata.children;
                if (!children || children.length == 0) return rowdata.Permit || false;
                for (var i = 0, len = (children || []).length; i < len; i++) {
                    if (!f_select(children[i])) return false;
                }
                return true;

            }
            //为当前选择记录 分配权限
            //1,同时分配给下级记录
            function f_Permit(rowdata, selected) {
                selected = selected ? true : false;
                rowdata.Permit = rowdata.Permit ? true : false;
                if (rowdata.Permit == selected) return;
                rowdata.Permit = selected;
                var parent = gridRight.getParent(rowdata);
                if (selected) {
                    while (parent) {
                        parent.Permit = selected;
                        gridRight.reRender({ rowdata: parent });
                        parent = gridRight.getParent(parent);
                    }
                }
                else {
                    while (parent) {
                        var childselected = false;
                        var parentchild = gridRight.getChildren(parent);
                        for (var i = 0, l = parentchild.length; i < l; i++) {
                            childselected = childselected || parentchild[i].Permit;
                        }
                        if (!childselected) {
                            parent.Permit = selected;
                            gridRight.reRender({ rowdata: parent });
                        }
                        parent = gridRight.getParent(parent);
                    }
                }
                var children = gridRight.getChildren(rowdata);
                if (children) {
                    for (var i = 0, l = children.length; i < l; i++) {
                        f_Permit(children[i], selected);
                    }
                }
                gridRight.reRender({ rowdata: rowdata });
            }
            //为当前选择记录 禁止权限
            //1,同时对下级记录做禁止权限操作
            function f_Forbid(rowdata, selected) {
                selected = selected ? true : false;
                rowdata.Forbid = rowdata.Forbid ? true : false;
                if (rowdata.Forbid == selected) return;
                rowdata.Forbid = selected;
                if (selected) {
                    var children = gridRight.getChildren(rowdata);
                    if (children) {
                        for (var i = 0, l = children.length; i < l; i++) {
                            f_Forbid(children[i], selected);
                        }
                    }
                }
                gridRight.reRender({ rowdata: rowdata });
            }

            //加载 菜单-按钮数据
            function f_loadMenu(appName, userId) {
                if (userId) {
                    LG.ajax({
                        async: false,
                        data: { AppName: appName, UserId: userId },
                        loading: '正在加载菜单按钮中...',
                        url: "privilege/userMenuButton",
                        success: function (data) {
                            gridRight.set('data', { Rows: data.toTree("ID", "PID") });
                        }
                    });
                }
                else {
                    LG.ajax({
                        async: false,
                        data: { AppName: appName },
                        loading: '正在加载菜单按钮中...',
                        url: "privilege/menuButton",
                        success: function (data) {
                            gridRight.set('data', { Rows: data.toTree("ID", "PID") });
                        }
                    });
                }
            }

            //在tab选择的时候才加载表格和表格数据
            tab.bind('afterSelectTabItem', function (tabid) {
                f_loadMenu("@#")
                if (tabid == "rolelist" && !rolelistLoaded) {
                    rolelistLoaded = true;

                    //角色
                    gridRole = $("#rolegrid").ligerGrid({
                        columns:
                            [
                                { display: '角色', name: 'ROLENAME', width: 450, align: 'left' },
                                { display: '角色描述', name: 'ROLEDESC', width: 450, align: 'left' }
                            ], showToggleColBtn: false, width: '100%', height: 200, fixedCellHeight: true,
                        columnWidth: 100, frozen: false, sortName: 'ROLENAME', usePager: false, checkbox: false, rownumbers: true,
                        url: 'privilege/roleList', parms: { appName: roleAppName, where: JSON2.stringify(gridRoleFilter) }
                    });

                    gridRole.bind('SelectRow', function (rowdata) {
                        selectedUserName = null;
                        selectedRoleName = rowdata.ROLENAME;
                        //隐藏禁止权限列
                        gridRight.toggleCol('Forbid', false);

                        bottomHeader.html("设置角色【" + rowdata.ROLEDESC + "】的权限");

                        f_loadMenu(currentAppName);

                        LG.ajax({
                            loading: '正在加载角色权限中...',
                            url: "privilege/rolePrivilege",
                            data: { roleName: selectedRoleName, "AppName": currentAppName },
                            success: function (data) {
                                var rows = gridRight.rows;
                                for (var i = 0, l = rows.length; i < l; i++) {
                                    rows[i].Permit = checkPermit(rows[i], data);
                                }
                                gridRight.reRender();
                            }
                        });
                    });
                }

                if (tabid == "userlist" && !userlistLoaded) {
                    userlistLoaded = true;
                    //用户
                    gridUser = $("#usergrid").ligerGrid({
                        columns:
                            [
                                { display: '用户名', name: 'LOGINNAME', width: 200, minWidth: 60 },
                                { display: '名称', name: 'REALNAME', width: 200, minWidth: 60 }
                            ], showToggleColBtn: false, width: '100%', height: 200, fixedCellHeight: true,
                        columnWidth: 100, frozen: false, sortName: 'LOGINNAME', usePager: false, checkbox: false, rownumbers: true,
                        url: 'privilege/userList', parms: { where: JSON2.stringify(gridUserFilter) }
                    });
                    gridUser.bind('SelectRow', function (rowdata) {
                        selectedUserName = rowdata.LOGINNAME;
                        selectedRoleName = null;
                        //隐藏禁止权限列
                        gridRight.toggleCol('Forbid', false);

                        bottomHeader.html("给用户【" + rowdata.LOGINNAME + "】 单独设置权限");

                        f_loadMenu(currentAppName, rowdata.USERID);

                        LG.ajax({
                            loading: '正在加载用户权限中...',
                            url: "privilege/userPrivilege",
                            data: { userID: rowdata.USERID, userName: selectedUserName, "AppName": currentAppName },
                            success: function (data) {
                                var rows = gridRight.rows;
                                for (var i = 0, l = rows.length; i < l; i++) {
                                    rows[i].Permit = checkPermitUser(rows[i], data);
                                    rows[i].Forbid = !rows[i].Permit;
                                }
                                gridRight.reRender();
                            }
                        });
                    });
                }
                updateGridHeight();
            });

            //判断是否有权限控制(按钮的，或菜单的)
            function checkPermitUser(rowdata, data) {
                var Permit = false;
                if (!data || !data.length) return false;
                var isButton = rowdata.BTNID != null && rowdata.BTNID != 0;
                for (var i = 0, l = data.length; i < l; i++) {
                    if (isButton && data[i].BTNNO == rowdata.ACCESSNO) {
                        Permit = data[i].Permit;
                        return Permit;
                    }
                    if (!isButton && data[i].MENUNO == rowdata.ACCESSNO) {
                        Permit = data[i].Permit;
                        return Permit;
                    }
                }
                return Permit;
            }

            function f_save() {
                if (!selectedRoleName && !selectedUserName) return;
                var data = [];
                for (var i = 0, l = gridRight.rows.length; i < l; i++) {
                    var row = gridRight.rows[i];
                    var o = new Object();
                    o.Accessno = row.ACCESSNO || '';
                    o.Masterkey = selectedRoleName || selectedUserName;
                    o.IsButton = (row.BTNID || "0").toString() === "0" ? false : true;
                    o.IsUser = selectedRoleName ? false : true;
                    o.Permit = row.Permit ? true : false;
                    o.Forbid = row.Forbid;
                    o.AppName = currentAppName;
                    data.push(o);
                }
                LG.ajax({
                    loading: '正在保存权限设置中...',
                    url: 'privilege/privilegeSave',
                    data: data,
                    success: function () {
                        LG.showSuccess("保存成功!");
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            }
            function f_expand() {
                gridRight.expandAll();
            }

            function f_collapse() {
                gridRight.collapseAll();
            }

            function updateGridHeight() {
                var $center = $("#layout > .l-layout-center");
                var $bottom = $("#layout > .l-layout-bottom");
                var topHeight = $center.height();
                var bottomHeight = $bottom.height();
                if (gridUser) {
                    gridUser.set('height', topHeight - (gridUser.grid.offset().top - $center.offset().top + 0));
                }
                if (gridRole) {
                    gridRole.set('height', topHeight - (gridRole.grid.offset().top - $center.offset().top + 0));
                }
                if (gridRight) {
                    gridRight.set('height', bottomHeight - (gridRight.grid.offset().top - $bottom.offset().top + 0));
                }
            }
            if (!IsAdmin) {
                tab.selectTabItem("userlist");
            }
            else {
                tab.selectTabItem("rolelist");
            }

            config.Search = {
                fields: [
                    { display: "角色名称", name: "_search_ROLENAME", type: "text" },
                    { display: "角色描述", name: "_search_ROLEDESC", type: "text" }
                ], fields2: [
                    { display: "用户名", name: "_search_LOGINNAME", upper: true, type: "text" },
                    { display: "名称", name: "_search_REALNAME", type: "text" }
                ]
            };

            //加载数据
            function f_loadData(grid, form) {
                if (grid.options.url && grid.isDataChanged && !confirm(grid.options.isContinueByDataChanged))
                    return false;
                if (form) {
                    var mainform = liger.get(form);
                    if (!mainform.valid()) {
                        mainform.showInvalid();
                        return false;
                    }
                }
                var rule = LG.bulidFilterGroup(form);
                var parms = grid.options.parms;
                if (rule.rules.length) {
                    if (!grid.options.NoFirstSearch) {
                        grid.options.NoFirstSearch = true;
                        if (!parms.where) parms.where = "{}";
                        parms.orginwhere = parms.where;
                    }
                    var rules = { groups: [], op: 'and' };
                    if (parms.orginwhere) rules.groups.push(JSON2.parse(parms.orginwhere));
                    rules.groups.push(rule);
                    parms.where = JSON2.stringify(rules);
                } else {
                    if (grid.options.NoFirstSearch) parms.where = parms.orginwhere;
                }
                if (!parms.where) parms.where = "{}";
                grid.options.newPage = 1;
                grid.loadData();
            }

            function f_getData() {
                f_loadData(gridRole, $("#formsearch"));
            }

            function f_getData2() {
                f_loadData(gridUser, $("#formsearch2"));
            }

            $("#formsearch").ligerForm({
                fields: config.Search.fields,
                buttons: [
                    { text: '查询', width: 60, click: f_getData }
                ],
                enterMoveNextControl: true,
                appendID: true,
                validate: true
            });

            $("#formsearch2").ligerForm({
                fields: config.Search.fields2,
                buttons: [
                    { text: '查询', width: 60, click: f_getData2 }
                ],
                enterMoveNextControl: true,
                appendID: true,
                validate: true,
                toJSON: JSON2.stringify
            });
            updateGridHeight();
        })(jQuery);
    </script>
</body>
</html>
