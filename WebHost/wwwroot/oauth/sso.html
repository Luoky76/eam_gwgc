<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title></title>
</head>

<body>
    <h3 id="error"></h3>
    <script type="text/javascript">
        'use strict';
        var business = {
            getQueryStringByName: function (name) {
                var result = location.search.match(new RegExp("[\?\&]" + name + "=([^\&]+)", "i"));
                if (result == null || result.length < 1) {
                    return "";
                }
                return decodeURIComponent(result[1]);
            },
            getBaseUrl: function (root) {
                var url = (location.origin + location.pathname);
                return url.substring(0, url.lastIndexOf("/") + 1) + root;
            },
            error: function (xhr, msg) {
                msg = (xhr.status || "") + " " + (xhr.statusText || "") + " " + msg;
                document.getElementById("error").innerHTML = msg;
            },
            httpRequest: function (p) {
                var me = this;
                var xhr = new XMLHttpRequest();
                xhr.open("POST", me.baseUrl + p.url, false);
                xhr.setRequestHeader('Content-Type', 'application/json');
                xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
                if (p.headers) {
                    for (var key in p.headers) {
                        xhr.setRequestHeader(key, p.headers[key]);
                    }
                }
                p.error = p.error || me.error;
                xhr.onload = function onload() {
                    var errorMsg;
                    if (xhr.status === 200) {
                        if (p.dataType === "text") {
                            if (p.dataType) p.success(xhr.responseText);
                            return;
                        }
                        var responseData;
                        try {
                            responseData = JSON.parse(xhr.responseText);
                        } catch (err) {
                            errorMsg = "parseerror";
                        }
                        if (!errorMsg) {
                            if (!responseData.IsError) {
                                if (p.success) p.success(responseData.Data, responseData.Message);
                                return;
                            }
                            errorMsg = responseData.Message;
                        }
                    }
                    p.error(xhr, errorMsg);
                };
                xhr.onerror = function onerror() {
                    p.error(xhr);
                };
                xhr.ontimeout = function () {
                    p.error(xhr, "timeout");
                };
                if (p.beforeSend) p.beforeSend(xhr, p);
                xhr.send();
            },
            init: function () {
                var me = this;
                me.baseUrl = me.getBaseUrl("../");
                var toUrl = me.getQueryStringByName("redirect_uri") || (me.baseUrl + "index.html");
                me.httpRequest({
                    url: 'oauth/sso',
                    headers: {
                        token: me.getQueryStringByName("token"),
                        menuAppname: me.getQueryStringByName("menuAppname")
                    },
                    success: function (data) {
                        window.localStorage.setItem("GksybTicket", data.Ticket);
                        delete data.Ticket;
                        window.localStorage.setItem("GksybData", JSON.stringify(data));
                        window.open(toUrl, "_self", "noreferrer noopener");
                    },
                    beforeSend: function (jqXHR, options) {
                        me.httpRequest({
                            url: "oauth/jstoken",
                            dataType: "text",
                            success: function (result) {
                                eval(result);
                            }
                        });
                    }
                });
            }
        };
        business.init();
    </script>
</body>
</html>
