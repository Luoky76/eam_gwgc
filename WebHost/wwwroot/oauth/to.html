<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title></title>
    <script src="../lib/jquery/jquery.js" type="text/javascript"></script>
    <script src="../lib/js/common.js" type="text/javascript"></script>
</head>

<body>
    <script type="text/javascript">
        'use strict';
        var business = {
            init: function () {
                var toUrl = getQueryStringByName("redirect_uri");
                if (!toUrl) return;
                $.ajax({
                    type: 'post',
                    dataType: 'json',
                    jsToken: true,
                    _toLogin: true,
                    url: 'oauth/ssoToken',
                    data: { userType: getQueryStringByName("userType") },
                    success: function (result) {
                        if (result.IsError) {
                            location.href = "../login.html?FromUrl=" + encodeURIComponent(location.href);
                            return;
                        }
                        toUrl += (toUrl.indexOf("?") < 0 ? "?" : "&") + "token=" + result.Data;
                        window.open(toUrl, "_self", "noreferrer noopener");
                    }
                });
            }
        };
        business.init();
    </script>
</body>
</html>
