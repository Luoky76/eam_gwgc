
<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title></title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <div id="mainsearch" style="width: 98%">
        <form action="" id="formsearch" class="l-form">
        </form>
    </div>
    <form action="" id="mainform">
        <div id="maingrid">
        </div>
    </form>
    <script type="text/javascript">
        'use strict';
        var rootPath = "../";
        window["encryptUrl"] = ["/Apis/"];
        var tableName;
        var dataId;
        var isView;
        var fileMark;
        var business = {

            formLabelWidth: 120,
            formInputWidth: 180,
            getTextareaWidth: function () {
                var me = this;
                var fieldWidth = me.formLabelWidth + me.formInputWidth + 3;
                return Math.floor(($("#mainform").width() - 10) / fieldWidth) * fieldWidth - (me.formLabelWidth + 3);
            },
dialogData: {},
            dialogData: null,
            sid: getQueryStringByName("sid"),
            menuNo: getQueryStringByName("MenuNo"),
            ver: getQueryStringByName("ver"),
            detailWidth: 920,
            detailHeight: 450,
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            { display: "档案编号", name: "_search_DOC_CODE", dbname: "DOC_CODE", newline: false, upper: true, type: "text",options:{} },
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "档案编号", name: "DOC_CODE", width: 100, type: "text",  editor: { type: 'text'} },
                            { display: "资料名称", name: "DOC_NAME", width: 100, type: "text",  editor: { type: 'text'} },
                            { display: "份数", name: "DOC_NUM", width: 100, type: "int",  editor: { type: 'int'} },
                            { display: "存放地点", name: "DOC_SITE", width: 100, type: "text",  editor: { type: 'text'} },
                            { display: "说明", name: "DOC_EXPLAIN", width: 100, type: "text",  editor: { type: 'text'} },
                            { display: "设备ID", name: "DEVICE_ID", width: 100, type: "text", editor: { type: 'text' }, hide: true },
                            { display: "主键", name: "DOC_ID", width: 100, type: "text", editor: { type: 'text' }, hide: true }
                        ]
                    }
                };
            },
            grid: null,
            searchForm: null,
            buttons: null,
            loadComboxData: function () {
                var me = this;
                var param = {
                    "Common": {},
                };
                LG.ajax({
                    async: false,
                    url: rootPath + 'Apis/Common/JsonValueMul/Get',
                    data: { "parm": JSON2.stringify(param) },
                    loading: '正在获取中...',
                    success: function (data, message) {
                        me.dataCommon = data.Common;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            setGrid: function () {
                var me = this;
                var columns = me.config.grid.columns;
                for (var i = columns.length - 1; i >= 0; i--) {
                    if (!columns[i]) columns.splice(i, 1);
                }
                me.grid = $("#maingrid").ligerGrid({
                    autoWidth: true,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    dataAction: 'server',
                    toolbar: { group: "doc" },
                    url: rootPath + 'DEVICE/DeviceCard/DocList',
                    //url: rootPath + 'handler/grid.ashx',
                    parms: {
                        //"view": "device_doc",
                        where: JSON.stringify({
                            op: 'and',
                            rules: [{ field: 'DEVICE_ID', value: me.sid, op: 'equal' },]
                        })
                    },
                    sortName: 'DOC_CODE',
                    sortOrder: 'desc',
                    width: '100%',
                    height: '100%',
                    dateFormat: 'yyyy-MM-dd HH:mm',
                    checkbox: true,
                    enabledEdit: true,
                    clickToEdit: true,
                    onBeforeEdit: function (editParm) {
                        switch (editParm.column.name) {
                            case "":
                                if (editParm.record.__status == "add") return true;
                                else return false;
                                break;
                        }
                    },
                    onSuccess: function (data, g) {
                        if (data && data.Rows) {
                            var rows = data.Rows;
                            for (var i = 0, len = (rows || []).length; i < len; i++) {
                                rows[i].OLDDOC_ID = rows[i].DOC_ID;
                                rows[i].OLDMODIFYDATE = rows[i].MODIFYDATE;
                            }
                        }
                    },
                    rowAttrRender: function (rowdata, rowid) {
                        return "";
                    }
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "add":
                            me.add();
                            break;
                        case "modify":
                            me.modify();
                            break;
                        case "upload":
                            me.upload();
                            break;
                        case "delete":
                            me.delete();
                            break;
                        case "save":
                            me.save();
                            break;
                        case "Excel":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=xls", window.gksybConfigs.urlBase), modal: true });
                            break;
                        case "Pdf":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=pdf", window.gksybConfigs.urlBase), modal: true });
                            break;
                    }
                }
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            upload: function () {
                var me = this;
                if (me.grid.endEdit() != false) {
                    var selected = me.grid.getSelectedRows();
                    if (selected.length == 1) {
                        if (selected[0].DOC_ID != undefined) {
                            me.f_rowAttachManage(selected[0].DOC_ID);
                        } else {
                            LG.showError("请先保存该记录再上传！");
                        }
                    }
                    else {
                        LG.tip('请选择一项记录!');
                    }
                }
            },
            //附件管理
            f_rowAttachManage: function (dataid) {
                var me = this;
                isView = false;
                dataId = dataid;
                fileMark = 0;
                tableName = "DEVICE_DOC"; // 表名
                $.ligerDialog.open({
                    width: 960,
                    height: 540,
                    allowClose: true,
                    isHidden: false,
                    //data: { "tableName": tableName, "dataId": dataid, "isView": isView },
                    url: '../../filemanager/file-attachment-content.html',
                    title: '附件管理',
                    onClose: function () {
                        me.reload();
                    }
                });
            },
            add: function () { //新增
                var me = this;
                // $.ligerDialog.open({
                //     width: detailWidth,
                //     height: detailHeight,
                //     allowClose: true,
                //     title: '[新增]',
                //     url: "Detail.aspx?MenuNo=" + me.menuNo + "&ver=" + me.ver,
                //     isHidden: false,
                //     showMax: false,
                //     showToggle: false,
                //     showMin: false,
                //     isResize: true,
                //     slide: false,
                //     onClosed: me.reload.bind(me),
                //     data: { "sid": null }
                // });
                me.grid.addEditRow({ DEVICE_ID: me.sid }, true);
            },
            save: function () { //保存
                var me = this;
                if (me.grid.endEdit() != false) {
                    if (!me.grid.isDataChanged) {
                        LG.showSuccess('无修改');
                        return;
                    }
                    if (!me.grid.validChangeRows()) return false;
                    var changeRow = me.grid.getChangedRows();
                    LG.ajax({
                        jsToken: true,
                        url: rootPath + 'Device/DeviceCard/SaveDoc',
                        loading: '正在保存中...',
                        data: changeRow,
                        success: function () {
                            LG.showSuccess('保存成功');
                            me.grid.isDataChanged = false;
                            me.reload();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }

            },
            reload: function () { //刷新
                var me = this;
                me.buttons[0].click();
            },
            delete: function () { //删除
                var me = this;
                if (me.grid.endEdit() != false) {
                    var selected = me.grid.getSelectedRows();
                    if (selected.length > 0) {
                        $.ligerDialog.confirm('确定删除吗?', function (confirm) {
                            if (confirm) {
                                for (var i = 0, len = (selected || []).length; i < len; i++) {
                                    me.grid.deleteRow(selected[i]);
                                }
                                me.save();
                            }
                        });
                    } else {
                        LG.tip('请选择行!');
                    }
                }
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Pdf',
                        text: '导出Pdf',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-pdf-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            setForm: function () {
                var me = this;
                var columns = me.config.search.fields;
                for (var i = columns.length - 1; i >= 0; i--) {
                    if (!columns[i]) columns.splice(i, 1);
                }
                var $formsearch = $("#formsearch")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    labelWidth: me.formLabelWidth,
                    inputWidth: me.formInputWidth,
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                    }
                });
                me.buttons[0].click(); //查询
            },
            init: function () {
                var me = this;
                if (frameElement && frameElement.dialog) {
                    me.dialog = frameElement.dialog;
                    me.dialogData = me.dialog.get('data') || {};
                    if (me.dialogData.sid) me.sid = me.dialogData.sid;
                }
                me.setConfig();
                me.setGrid();
                me.setForm();
                return me;
            }
        };
        business.init();
    </script>
</body>

</html>
