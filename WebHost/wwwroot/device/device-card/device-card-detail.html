<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title>明细</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <form id="mainform" style="margin-bottom: 50px">
    </form>
    <script type="text/javascript">
        'use strict';
        var business = {
            dialogData: {},
            menuNo: getQueryStringByName("MenuNo"),
            isView: false,
            sid: getQueryStringByName("sid"),
            dataCorp: [],
            rootPath: "../",
            dialog: null,
            dialogData: null,
            callback: null,
            orginData: {},
            devicetype: [],
            assetStatus: [
                { ID: "1", TEXT: "在用", VALUE: "1" }
            ],
            yesno: [
                { "ID": "0", "TEXT": "否" }, { "ID": "1", "TEXT": "是" }
            ],
            purpose: [
                { "ID": "0", "TEXT": "非生产" }, { "ID": "1", "TEXT": "生产" }
            ],
            dataCorp: [],
            auditing: [],
            user: [],
            stopSource: [],
            malType: [],
            deviceInfo: [],
            start: null,
            deptid: null,
            deptname: null,
            setConfig: function () {
                var me = this;
                me.config = {
                    form: {
                        fields: [
                            { display: "DEVICE_ID", name: "DEVICE_ID", type: "hidden" },
                            { display: "记录状态", name: "AUDITING", type: "hidden" },
                            { display: "设备编号", name: "DEVICE_NO", newline: false, width: 300, type: "text", options: {}, validate: { required: true }, group: "基础信息" },
                            
                            { display: "设备名称", name: "DEVICE_NAME", newline: false, width: 300, type: "text", options: {} },
                            
                            {
                                display: "设备类别", name: "TYPE_ID", newline: false, width: 300, type: "select", editor: { type: 'select', disabled: true, data: me.devicetype }, validate: { required: true }, options: {
                                    onChangeValue: function (input, value, g) {
                                        if (value) {
                                            for (var i = 0; i < me.devicetype.length; i++) {
                                                if (value == me.devicetype[i].ID) {
                                                    $("#TYPE_NAME").val(me.devicetype[i].TEXT);
                                                }
                                            }
                                        } else {
                                            $("#TYPE_NAME").val('');
                                        }
                                    }
                                }
                            },
                            { display: "设备机型", name: "TYPE_NAME", newline: false, width: 300, type: "hidden" },
                            { display: "设备型号", name: "DEVICE_TYPE", newline: false, width: 300, type: "text", options: {} },
                            {
                                display: "使用部门", name: "DEPT_ID", newline: false, width: 300, type: "hidden", editor: { type: 'select', disabled: true, data: me.dataCorp }, options: {
                                    
                                }
                            },
                            {
                                display: "维保部门", name: "WDEPT_ID", newline: false, width: 300, type: "hidden",editor: { type: 'select', disabled: true, data: me.dataCorp }, options: {
                                    
                                }
                            },
                            { display: "使用部门", name: "DEPT_NAME", newline: false, width: 300, type: "text", editor: { disabled: true } },
                            { display: "维保部门", name: "WDEPT_NAME", newline: false, width: 300, type: "text", editor: { disabled: true } },
                            
                            { display: "供应商", name: "PROVIDER_NAME", newline: false, width: 300, type: "text", options: {} },
                            { display: "制造厂", name: "FACTORY", newline: false, width: 300, type: "text", options: {} },
                            
                        ]
                    }
                };
            },
            mainform: null,
            buttons: null,
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'Device/DeviceCard/comboxdata',
                    loading: '正在获取中...',
                    success: function (data) {
                        me.devicetype = data.BCCode;
                        me.auditing = data.Auditing;
                        me.user = data.User;
                        me.dataCorp = data.Corp;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            loadData: function () {
                var me = this;
                if (!me.sid) {
                    //注：原默认为未提交，现默认为已提交，2023.10.07
                    me.mainform.setOrginData({ AUDITING: "1", TYPE_ID: "2", TYPE_NAME: "设备", DEPT_ID: me.deptid, WDEPT_ID: me.deptid, DEPT_NAME: me.deptname, WDEPT_NAME: me.deptname });
                }
                else {
                    LG.ajax({
                        async: false,
                        url: 'Device/DeviceCard/Get',
                        loading: '正在获取中...',
                        data: { id: me.sid },
                        success: function (data, message) {
                            if (me.isView) {
                                me.mainform.setReadonly(true);
                            }
                            me.mainform.setOrginData(data[0]);
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }
                me.mainform.focus();
            },
            save: function () { //保存
                var me = this;
                if ($.isEmptyObject(me.mainform.getChanges())) {
                    LG.showSuccess('无修改');
                    return;
                }
                if (!me.mainform.valid()) {
                    me.mainform.showInvalid();
                    return;
                }
                function handle(data) {
                    return data;
                }
                var data = handle(me.mainform.getData());
                var original = handle(me.mainform.getOrginData());
                var changeRow = new Object();
                if (!me.sid) {
                    changeRow["added"] = [data];
                }
                else {
                    changeRow["updated"] = [data];
                    changeRow["original"] = [original];
                }
                LG.ajax({
                    jsToken: true,
                    url: 'Device/DeviceCard/Save',
                    loading: '正在保存中...',
                    data: changeRow,
                    success: function () {
                        LG.showSuccess('保存成功', function () { if (me.dialog) { me.dialog.close(); } });
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            close: function (skipConfirm) {
                var me = this;
                function inner(callback) {
                    if (!skipConfirm && !$.isEmptyObject(me.mainform.getChanges())) {
                        $.ligerDialog.confirm($.ligerDefaults.GridString.isContinueByDataChanged, function (confirm) {
                            if (confirm) {
                                if (callback) callback(2);
                            }
                            else {
                                if (callback) callback(0);
                            }
                        });
                        if (callback) return callback(-1);
                        return false;
                    }
                    if (callback) return callback(1);
                    return true;
                }
                inner(function (status) {
                    if (status > 0) {
                        if (me.dialog) {
                            me.dialog.close();
                            return;
                        }
                        var win = parent || window;
                        if (win.closeCurrentTab) win.closeCurrentTab();
                        else win.close();
                    }
                });
            },
            setFormDefaultBtn: function () {
                var me = this;
                //表单底部按钮
                var buttons = [];
                if (!me.isView) {
                    buttons.push({
                        text: '重置', onclick: function () {
                            $.ligerDialog.confirm("确定重置数据吗?", function (confirm) {
                                if (confirm) {
                                    location.reload(true);
                                }
                            });
                        }
                    });
                }
                buttons.push({ text: '关闭', onclick: me.close.bind(me) });
                if (!me.isView) buttons.push({ text: '保存', onclick: me.save.bind(me) });
                LG.addFormButtons(buttons);
                me.formButtons = buttons;
            },
            setForm: function () {
                var me = this;
                me.config.form.fields.removeNull();
                var $mainform = $("#mainform")
                //搜索表单应用ligerui样式
                me.mainform = $mainform.ligerForm({
                    EnterMoveNextControl: true,
                    labelAlign: 'right',
                    space: 3,
                    validate: true,
                    fields: me.config.form.fields,
                    labelWidth: 120,
                    onAfterSetFields: function (g) {
                        me.mainform = g;
                        me.buttons = g.options.buttons;
                    }
                });
                me.setFormDefaultBtn();
            },
            init: function () {
                debugger
                var me = this;
                if (frameElement && frameElement.dialog) {
                    me.dialog = frameElement.dialog;
                    me.dialogData = me.dialog.get('data') || {};
                    if (me.dialogData.callback) me.callback = me.dialogData.callback;
                    if (me.dialogData.sid) me.sid = me.dialogData.sid;
                    if (me.dialogData.deptid) me.deptid = me.dialogData.deptid;
                    if (me.dialogData.deptname) me.deptname = me.dialogData.deptname;
                    if (me.dialogData.isView) me.isView = me.dialogData.isView;
                }
                me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.loadData();
                return me;
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>

</html>
