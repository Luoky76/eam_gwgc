
<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title></title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 2px; height: 100%;">
    <div id="layout">
        <div position="left" title="设备" id="mainmenu">
            <ul id="maintree" style="margin-top:5px;"></ul>
        </div>
        <div position="center" title="设备列表">
            <div id="mainsearch">
                <form action="" id="formsearch" class="l-form">
                </form>
            </div>
            <form id="mainform">
                <div id="maingrid" style="float: left">
                </div>
            </form>
        </div>
    </div>
    <script type="text/javascript">
        'use strict';
        var business = {
            menuNo: getQueryStringByName("MenuNo"),
            ver: getQueryStringByName("ver"),
            //明细页面大小
            detailWidth: window.innerWidth * 0.9,
            detailHeight: window.innerHeight * 0.9,
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            {
                                display: "通用搜索",
                                name: "_search_all",
                                hideLabel: true,
                                filter: [
                                    { op: "like", field: "DEVICE_NO", type: "string" },
                                    { op: "like", field: "DEVICE_NAME", type: "string" }
                                ],
                                options: {
                                    //回车自动搜索
                                    onEnter: function () {
                                        var me = this;
                                        var $formsearch = $("#formsearch");
                                        LG.commonSearch($formsearch, me.grid);
                                    }.bind(me)
                                },
                            },
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "设备编号", name: "DEVICE_NO", type: "text", editor: { type: 'text' } },
                            { display: "设备名称", name: "DEVICE_NAME", type: "text", editor: { type: 'text' } },
                            { display: "设备型号", name: "DEVICE_TYPE", type: "text", editor: { type: 'text' } },
                            {
                                display: "使用部门", name: "DEPT_ID", type: "select", editor: {
                                    type: 'select',
                                    data: me.dataCorp,
                                    onChange: function (rowdata) {
                                        rowdata.grid.updateCell("DEPT_NAME", rowdata.selected?.TEXT ?? "", rowdata.record);
                                    }
                                }
                            },
                            { display: "供应商", name: "PROVIDER_NAME", type: "text", editor: { type: 'text' } },
                            { display: "制造厂", name: "FACTORY", type: "text", editor: { type: 'text' } },
                            //隐藏字段
                            { display: "主键", name: "DEVICE_ID", type: "text", hide: true },
                            { display: "使用部门", name: "DEPT_NAME", type: "text", hide: true },
                            { display: "上级设备ID", name: "PRE_DEVICE_ID", type: "text", hide: true },
                        ]
                    }
                };
            },
            grid: null,
            searchForm: null,
            buttons: null,
            //当前选中的树节点
            selectedNode: null,
            //下拉数据
            dataCorp: [],
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'Device/DeviceCard/Comboxdata',
                    loading: '正在获取中...',
                    success: function (data) {
                        me.dataCorp = data.Corp;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    autoWidth: true,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    usePager: false,
                    dataAction: 'server',
                    toolbar: { group: "list" },
                    url: 'Device/DeviceCard/List',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: [{ field: 'TYPE_ID', op: 'equal', value: "2" }]
                        })
                    },
                    sortName: '',
                    sortOrder: '',
                    width: '98%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: true,
                    clickToEdit: true,
                    onBeforeEdit: function (editParm) {
                        switch (editParm.column.name) {
                            case "":
                                if (editParm.record.__status == "add") return true;
                                else return false;
                                break;
                        }
                    },
                    onSuccess: function (data, g) {
                    },
                    rowAttrRender: function (rowdata, rowid) {
                        return "";
                    },
                    onDblClickRow: function (rowdata) {
                        me.openDetail({ sid: rowdata.DEVICE_ID, isNew: false, isView: true });
                    }
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            setTree: function () {
                var me = this;
                var rootValue = "ROOT";
                me.tree = $("#maintree").ligerTree({
                    url: "Device/DeviceCard/Tree",
                    parms: {},
                    nodeWidth: 160,
                    slide: false,
                    checkbox: false,
                    single: true,
                    needCancel: false,
                    idFieldName: 'DEVICE_ID',
                    textFieldName: 'DEVICE_NAME',
                    parentIDFieldName: 'PARENTID',
                    iconClsFieldName: "ICON",
                    isExpand: 2,
                    onSuccess: function (data) {
                        $(".l-tree .l-body span").each(function () {
                            var $this = $(this);
                            var text = $this.text();
                            $this.html('<acronym title="' + text + '"><span> ' + text + '</span></acronym>');
                        });
                        if (!$.isEmptyObject(me.selectedNode)) this.selectNode(me.selectedNode?.data?.DEVICE_ID);
                        me.reload();
                    },
                    onSelect: function (node) {
                        me.reload();
                    }
                });
            },
            isSelectRow: function () {
                var me = this;
                var rows = me.grid.getSelectedRows();
                if (rows.length == 0) {
                    LG.tip("请选择一行");
                    return false;
                }
                return true;
            },
            isSelectSingleRow: function () {
                var me = this;
                var rows = me.grid.getSelectedRows();
                if (rows.length > 1) {
                    LG.tip("不能选择多行");
                    return false;
                } else if (rows.length == 0) {
                    LG.tip("请选择一行");
                    return false;
                }
                return true;
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "add":
                            me.add();
                            break;
                        case "modify":
                            if (me.isSelectSingleRow()) {
                                me.openDetail({ isNew: false, isView: false });
                            }
                            break;
                        case "delete":
                            if (me.isSelectRow()) {
                                me.delete();
                            }
                            break;
                        case "save":
                            me.save();
                            break;
                        case "Excel":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=xls", window.gksybConfigs.urlBase), modal: true });
                            break;
                        case "Pdf":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=pdf", window.gksybConfigs.urlBase), modal: true });
                            break;
                    }
                };
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            //打开明细
            openDetail: function ({ sid, isNew = false, isView = true } = {}) {
                var me = this;
                if (!isNew && !sid) {
                    sid = me.grid.getSelectedRow().DEVICE_ID;
                }
                $.ligerDialog.open({
                    width: me.detailWidth,
                    height: me.detailHeight,
                    allowClose: true,
                    title: (isNew ? '[新增]' : isView ? '[查看]' : '[修改]') + document.title,
                    url: "device-card-detail.html?MenuNo=" + me.menuNo,
                    isHidden: false,
                    showMax: false,
                    showToggle: false,
                    showMin: false,
                    isResize: true,
                    slide: false,
                    onClosed: me.reload.bind(me),
                    data: { sid: sid, isNew: isNew, isView: isView }
                });
            },
            add: function () { //新增
                var me = this;
                var selectedNode = me.tree.getSelected();
                if ($.isEmptyObject(selectedNode) || selectedNode.data.DEVICE_ID == "ROOT") {
                    LG.tip('请选择左侧设备!');
                    return;
                }
                me.grid.addEditRow({
                    PRE_DEVICE_ID: selectedNode.data.DEVICE_ID,
                    //新增类型均为设备
                    TYPE_ID: "2"
                }, true);
            },
            save: function () { //保存
                var me = this;
                if (!me.grid.endEdit()) return;
                if (!me.grid.isDataChanged) {
                    LG.showSuccess('无修改');
                    return;
                }
                if (!me.grid.validChangeRows()) return false;
                var changeRow = me.grid.getChangedRows();
                LG.ajax({
                    jsToken: true,
                    url: 'Device/DeviceCard/Save',
                    loading: '正在保存中...',
                    data: changeRow,
                    success: function () {
                        LG.showSuccess('保存成功');
                        me.grid.isDataChanged = false;
                        me.reload();
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            reload: function () { //刷新
                var me = this;
                me.selectedNode = me.tree.getSelected();
                //设置过滤条件
                var where = {
                    rules: [{ field: 'TYPE_ID', op: 'equal', value: "2" }],
                    op: "and"
                };
                if (!$.isEmptyObject(me.selectedNode) && me.selectedNode.data.DEVICE_ID != "ROOT") {
                    where.rules.push({ field: 'TREE_NODE', value: me.selectedNode.data.TREE_NODE, op: 'startwith' });
                }
                me.grid.set('parms', { where: JSON2.stringify(where) });
                me.grid.loadData();
            },
            delete: function () { //删除
                var me = this;
                if (!me.grid.endEdit()) return;
                var selected = me.grid.getSelectedRows();
                for (var i = 0; i < selected.length; i++) {
                    $.ligerDialog.confirm('确定删除吗?', function (confirm) {
                        if (confirm) {
                            for (var i = 0, len = (selected || []).length; i < len; i++) {
                                me.grid.deleteRow(selected[i]);
                            }
                            me.save();
                        }
                    });
                    break;
                }
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Pdf',
                        text: '导出Pdf',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-pdf-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch = $("#formsearch");
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                    }
                });
            },
            init: function () {
                var me = this;
                $("#layout").ligerLayout({ leftWidth: 200 });
                me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.setGrid();
                me.setTree();
                me.reload();
                return me;
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>
    </html>
