<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title>委外维修确认</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <div id="mainsearch" style="width: 98%">
        <form action="" id="formsearch" class="l-form">
        </form>
    </div>
    <form action="" id="mainform">
        <div id="maingrid">
        </div>
    </form>
    <script type="text/javascript">
        'use strict';
        var business = {

            formLabelWidth: 120,
            formInputWidth: 180,
            getTextareaWidth: function () {
                var me = this;
                var fieldWidth = me.formLabelWidth + me.formInputWidth + 3;
                return Math.floor(($("#mainform").width() - 10) / fieldWidth) * fieldWidth - (me.formLabelWidth + 3);
            },
detailWidth: 1020,
            detailHeight: 550,
            auditing: [{ "ID": "1", "TEXT": "已提交" }, { "ID": "0", "TEXT": "未提交" }],
            MaintDept: [],
            RepSourceType: [],
            RepOutType: [],
            isleave: [{ "ID": "1", "TEXT": "是" }, { "ID": "0", "TEXT": "否" }],
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            { display: "船舶名称", name: "_search_DEVICE_NAME", dbname: "DEVICE_NAME", newline: false, upper: true, type: "text", options: {} },
                            {
                                display: "实际开工时间", name: "_search_ACT_START_DATE", dbname: "ACT_START_DATE",  newline: false, type: "date", op: 'greaterorequal', vt: 'date',
                                options: {
                                    format: "yyyy-MM-dd"
                                }
                            },
                            {
                                display: "实际完工时间", name: "_search_ACT_END_DATE", dbname: "ACT_END_DATE",  newline: false, type: "date", op: 'lessorequal', vt: 'date',
                                options: {
                                    format: "yyyy-MM-dd"
                                }
                            },
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "已提交", name: "AUDITING", width: 100, type: "chk" },
                            { display: "委外状态", name: "OUT_STATUS", minWidth: 150, type: "select", format: {  data: me.RepOutType } },
                            { display: "委外单号", name: "OUT_CODE", minWidth: 150, type: "text", },
                            { display: "船舶名称", name: "DEVICE_NAME", minWidth: 150, type: "text", },
                            //{ display: "维保部门", name: "WDEPT_NAME", width: 100, type: "text" },
                            { display: "维保部门", name: "WDEPT_ID", width: 100, type: "select", format: { data: me.MaintDept } },
                            { display: "维修设备名称", name: "REP_DEVICE", width: 100, type: "text", },
                            //{ display: "实际完工时间", name: "REAL_ENDTIME", width: 100, type: "date" },
                            //{ display: "实际开工时间", name: "REAL_BEGINTIME", width: 100, type: "date" },
                            { display: "是否有遗留问题", name: "IS_LEAVE", width: 100, type: "select", format: { data: me.isleave } },
                            { display: "船舶编号", name: "DEVICE_NO", width: 100, type: "text", },
                            { display: "船舶型号", name: "DEVICE_TYPE", width: 100, type: "text", },
                            { display: "来源单号", name: "SRC_CODE", width: 100, type: "text", },
                            { display: "来源类型", name: "SRC_TYPE", width: 100, type: "select", format: { data: me.RepSourceType } },
                            { display: "使用部门", name: "DEPT_NAME", width: 100, type: "text", },
                            //{ display: "使用部门ID", name: "DEPT_ID", width: 100, type: "text" },
                            { display: "地理区域", name: "SITE_NAME", minWidth: 150, type: "text", },
                            { display: "安装地点", name: "INSTALL_SITE", minWidth: 150, type: "text", },
                            { display: "主键", name: "OUT_ID", width: 100, type: "text", hide: true },
                        ]
                    }
                };
            },
            grid: null,
            searchForm: null,
            buttons: null,
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'Device/RepOut/ComboxData',
                    loading: '正在获取中...',
                    success: function (data) {
                        me.MaintDept = data.MaintDept;
                        me.RepSourceType = data.RepSourceType;
                        me.RepOutType = data.RepOutType;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    autoWidth: true,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    usePager: false,
                    dataAction: 'server',
                    toolbar: {},
                    url: 'Device/RepOut/GetRepOutCheckList',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    width: '98%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: false,
                    clickToEdit: false,
                    onBeforeEdit: function (editParm) {
                        switch (editParm.column.name) {
                            case "":
                                if (editParm.record.__status == "add") return true;
                                else return false;
                                break;
                        }
                    },
                    onSuccess: function (data, g) {
                        if (data && data.Rows) {
                            var rows = data.Rows || [];
                            for (var i = 0, len = rows.length; i < len; i++) {
                                var row = rows[i];
                                row.OLDROLEID = row.ROLEID;
                            }
                        }
                    },
                    rowAttrRender: function (rowdata, rowid) {
                        return "";
                    }
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "modify":
                            me.modify();
                            break;
                        case "submit":
                            me.submit();
                            break;
                        case "Excel":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=xls", window.gksybConfigs.urlBase), modal: true });
                            break;
                        case "Pdf":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=pdf", window.gksybConfigs.urlBase), modal: true });
                            break;
                    }
                }
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },

            modify: function () { //委外维修确认单
                var me = this;
                var selected = me.grid.getSelectedRow();
                if (selected) {
                    var sid = selected.OUT_ID;
                    var auditing = selected.AUDITING;
                    $.ligerDialog.open({
                        width: me.detailWidth,
                        height: me.detailHeight,
                        allowClose: true,
                        title: '[委外维修确认单]',
                        url: "repoutcheckdetail.html?MenuNo=" + me.menuNo + "&ver=" + me.ver,
                        isHidden: false,
                        showMax: false,
                        showToggle: false,
                        showMin: false,
                        isResize: true,
                        slide: false,
                        onClosed: me.reload.bind(me),
                        data: { "sid": sid, "auditing": auditing }
                    });
                }
                else {
                    LG.tip('请选择行!');
                }
            },

            submit: function () {    //提交
                var me = this;
                var selected = me.grid.getSelectedRows();
                for (var i = 0; i < selected.length; i++) {
                    if (selected[i].AUDITING == "1") {
                        me.alreadySubmitted = true;
                        break;
                    }
                }
                if (selected) {
                    if (me.alreadySubmitted) {
                        LG.tip('已提交，无法再次提交!');
                        me.alreadySubmitted = false;
                    }
                    else {
                        var sids = [];
                        selected.forEach((a) => {
                            sids.push(a.OUT_ID)
                        })
                        LG.ajax({
                            jsToken: true,
                            url: 'Device/RepOut/SubmitRepOutCheck',
                            loading: '正在保存中...',
                            data: { "sids": sids },
                            success: function () {
                                LG.showSuccess('保存成功');
                                me.grid.isDataChanged = false;
                                me.reload();
                            },
                            error: function (message) {
                                LG.showError(message);
                            }
                        });
                    }

                }
                else {
                    LG.tip('请选择行!');
                }
            },
            reload: function () { //刷新
                var me = this;
                me.buttons[0].click();
            },
            delete: function () { //删除
                var me = this;
                if (me.grid.endEdit() != false) {
                    var selected = me.grid.getSelectedRows();
                    if (selected.length > 0) {
                        $.ligerDialog.confirm('确定删除吗?', function (confirm) {
                            if (confirm) {
                                for (var i = 0, len = selected.length; i < len; i++) {
                                    me.grid.deleteRow(selected[i]);
                                }
                                me.save();
                            }
                        });
                    } else {
                        LG.tip('请选择行!');
                    }
                }
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Pdf',
                        text: '导出Pdf',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-pdf-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch = $("#formsearch")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    labelWidth: me.formLabelWidth,
                    inputWidth: me.formInputWidth,
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                    }
                });
            },
            init: function () {
                var me = this;
                me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.setGrid();
                me.reload();
                return me;
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>
</html>
