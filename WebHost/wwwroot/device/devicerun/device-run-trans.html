<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title>设备运行状态转换</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>
<body style="padding: 5px; height: 100%;">
    <div id="mainsearch" style="width: 100%">
        <form action="" id="formsearch" class="l-form">
            <div id="formsearch1">
            </div>
        </form>
    </div>
    <form action="" id="mainform">
        <div id="gridform">
            <div id="maingrid" hidetitle=true>
            </div>
        </div>
    </form>
    <script type="text/javascript">
        'use strict';

        var business = {

            formLabelWidth: 120,
            formInputWidth: 180,
            getTextareaWidth: function () {
                var me = this;
                var fieldWidth = me.formLabelWidth + me.formInputWidth + 3;
                return Math.floor(($("#mainform").width() - 10) / fieldWidth) * fieldWidth - (me.formLabelWidth + 3);
            },
menuNo: getQueryStringByName("MenuNo"),
            ver: getQueryStringByName("ver"),
            voyagecodedata: null,
            runStatus: [],
            auditing: [{ "ID": "1", "TEXT": "已提交" }, { "ID": "0", "TEXT": "未提交" }],
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            {
                                display: "设备编号", name: "_search_DEVICE_NO", dbname: "DEVICE_NO", newline: false, width: 150, upper: true, type: "text", options: {}
                            },
                            {
                                display: "状态转换时间", name: "_search_TRANS_DATE", dbname: "TRANS_DATE", width: 150, newline: false, type: "date", op: 'greaterorequal', vt: 'date',
                                options: {
                                    format: "yyyy-MM-dd"
                                }
                            },
                            {
                                display: "至", name: "_search_TRANS_DATE", dbname: "TRANS_DATE", width: 150, newline: false, type: "date", op: 'lessorequal', vt: 'date',
                                options: {
                                    format: "yyyy-MM-dd"
                                }
                            },
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "已提交", name: "AUDITING", width: 100, type: "chk" },
                            { display: "状态转换时间", name: "TRANS_DATE", dbname: "TRANS_DATE", minWidth: 150, type: "date", editor: { type: 'date', showTime: true, format: "yyyy-MM-dd" }, format: "yyyy-MM-dd" },
                            { display: "设备编号", name: "DEVICE_NO", dbname: "DEVICE_NO", minWidth: 200, type: "text",  editor: { type: 'text' } },
                            { display: "设备名称", name: "DEVICE_NAME", dbname: "DEVICE_NAME", minWidth: 200, type: "text",  editor: { type: 'text' } },

                            { display: "原状态", name: "RUN_STATUS", dbname: "RUN_STATUS", minWidth: 200, type: "text",  editor: { type: 'text' } },
                            { display: "现状态", name: "NEW_RUN_STATUS", dbname: "NEW_RUN_STATUS", minWidth: 200, type: "text",  editor: { type: 'text' } },
                            { display: "转换原因", name: "TRANS_MEMO", dbname: "TRANS_MEMO",  width: 100, minWidth: 200, maxWidth: 300, type: "text", editor: { type: 'text' } },
                            { display: "使用部门", name: "DEPT_NAME", dbname: "DEPT_NAME",  minWidth: 200, maxWidth: 400, type: "text", editor: { type: 'text' } },
                            { display: "二级单位", name: "SEC_DEPT", dbname: "SEC_DEPT",  minWidth: 200, maxWidth: 400, type: "text", editor: { type: 'text' } },
                            { display: "DEVICE_ID", name: "DEVICE_ID", hide: true },
                            { display: "TRANS_ID", name: "TRANS_ID", hide: true },
                        ]
                    },
                };
            },
            grid: null,
            searchForm: null,
            buttons: null,
            searchForm2: null,
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'Device/DeviceRun/ComboxData',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        me.runStatus = data.RunStatus;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                //me.config.gridtop.columns.removeNull();
                //me.config.gridcenter.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    fixedCellHeight: true,
                    autoWidth: true,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    dataAction: 'server',
                    toolbar: {},
                    url: 'Device/DeviceRun/GetRun',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    //sortName: 'RECEIVEDATE',
                    //sortOrder: 'desc',
                    width: '98%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: false,
                    clickToEdit: false,
                    page: 1,
                    pageSize: 50,
                    //isSingleCheck: true,
                    //usePager: false,
                    onBeforeEdit: function (editParm, isSkip) {
                        if (isSkip) return;
                    },
                    onSuccess: function (data, g) {

                    },
                    rowAttrRender: function (rowdata, rowid) {

                    },
                    rowAttrRender: function (rowdata, rowid) {

                    },
                    onDblClickRow: function (rowdata) {
                        me.view(rowdata);
                    }

                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "add":
                            me.add();
                            break;
                        case "modify":
                            me.modify();
                            break;
                        case "return":
                            me.return();
                            break;
                        case "save":
                            me.save();
                            break;
                        case "delete":
                            me.delete();
                            break;
                        case "submit":
                            me.submit();
                            break;
                        case "Excel":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=xls", window.gksybConfigs.urlBase), modal: true });
                            break;
                        case "Pdf":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=pdf", window.gksybConfigs.urlBase), modal: true });
                            break;
                    }
                }
                me.loadtoolbar(me.grid, me.toolbarBtnItemClick);
            },
            loadtoolbar: function (grid, toolbarBtnItemClick) {
                var me = this;
                var MenuNo = LG.getPageMenuNo();
                LG.ajax({
                    loading: '正在加载工具条中...',
                    url: "Auth/MyButtons",
                    data: {
                        MenuNo: MenuNo,
                        Prefix: grid.toolbarManager.options.prefix
                    },
                    success: function (data) {
                        if (!data || !data.length) {
                            grid.set({
                                "toolbar": null
                            });
                            grid._onResize();
                            return;
                        };
                        var items = [];
                        var items2 = [];
                        for (var i = 0, l = data.length; i < l; i++) {
                            var o = data[i];
                            items[items.length] = {
                                parentGrid: grid,
                                type: "info",
                                cls: o.BTNCLASS || "",
                                click: toolbarBtnItemClick,
                                text: (o.BTNNAME || "").split("_")[0],
                                icon: o.BTNICON,
                                id: o.BTNNO
                            };
                        }
                        grid.set({
                            "toolbar": {
                                "items": items
                            }
                        });
                        grid._onResize();
                    }
                });
            },
            reload: function () { //刷新
                var me = this;
                me.buttons[0].click();
            },
            submit: function () {    //提交
                var me = this;
                var rows = me.grid.getSelectedRows();
                if (rows.length > 1) {
                    LG.showError("不能选择多行")
                    return
                } else if (rows.length == 0) {
                    LG.showError("请选择一行")
                    return
                }
                var selected = me.grid.getSelectedRow();
                if (selected) {
                    if (selected.AUDITING == "1") {
                        LG.tip('已提交，无法再次提交!');
                    }
                    else {
                        LG.ajax({
                            jsToken: true,
                            url: 'Device/DeviceRun/Submit',
                            loading: '正在保存中...',
                            data: { "sids": selected.TRANS_ID, "deid": selected.DEVICE_ID, "newStatus": selected.NEW_RUN_STATUS },
                            success: function () {
                                LG.showSuccess('保存成功');
                                me.grid.isDataChanged = false;
                                me.reload();
                            },
                            error: function (message) {
                                LG.showError(message);
                            }
                        });
                    }

                }
                else {
                    LG.tip('请选择行!');
                }
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Pdf',
                        text: '导出Pdf',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-pdf-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch1 = $("#formsearch1")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch1.ligerForm({
                    labelWidth: me.formLabelWidth,
                    inputWidth: me.formInputWidth,
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch1, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                    }
                });
                LG.commonSearch($formsearch1, me.grid);
            },
            openDetail: function (options) {
                var me = this;
                options = options || {};
                $.ligerDialog.open({
                    width: 1100,
                    height: 350,
                    allowClose: true,
                    title: options.title,
                    url: "device-run-trans-detail.html?MenuNo=" + me.menuNo,
                    isHidden: false,
                    showMax: false,
                    showToggle: false,
                    showMin: false,
                    isResize: true,
                    slide: false,
                    onClosed: me.reload.bind(me),
                    data: { sid: options.sid || null, isNew: !!options.isNew, isView: !!options.isView }
                });
            },
            add: function () {
                var me = this;
                me.openDetail({ title: '新增转换记录', sid: null, isNew: true, isView: false });
            },
            view: function (rowdata) { //查看
                var me = this;
                var selected = rowdata || me.grid.getSelectedRow();
                if (!selected) {
                    LG.tip('请选择行!');
                    return;
                }
                me.openDetail({ title: '查看转换记录', sid: selected.TRANS_ID, isNew: false, isView: true });
            },
            modify: function (rowdata) { //修改
                var me = this;
                var selected = rowdata;
                if (!selected) {
                    var rows = me.grid.getSelectedRows();
                    if (!rows || rows.length === 0) {
                        LG.showError("请选择一行");
                        return;
                    }
                    if (rows.length > 1) {
                        LG.showError("不能选择多行");
                        return;
                    }
                    selected = rows[0];
                }
                if (selected.AUDITING == "1") {
                    LG.tip('已提交，无法修改!');
                    return;
                }
                me.openDetail({ title: '修改运行状态', sid: selected.TRANS_ID, isNew: false, isView: false });
            },

            delete: function () { //删除
                var me = this;
                if (me.grid.endEdit() != false) {
                    var selected = me.grid.getSelectedRows();
                    if (selected.length > 0) {
                        for (var i = 0; i < selected.length; i++) {
                            if (selected[i].AUDITING == "1") {
                                LG.tip('已提交，无法删除!');
                                break;
                            }
                            else {
                                $.ligerDialog.confirm('确定删除吗?', function (confirm) {
                                    if (confirm) {
                                        for (var i = 0, len = (selected || []).length; i < len; i++) {
                                            me.grid.deleteRow(selected[i]);
                                        }
                                        me.save();
                                    }
                                }); break;
                            }
                        }
                    } else {
                        LG.tip('请选择行!');
                    }
                }

            },

            save: function () { //保存
                var me = this;
                if (me.grid.endEdit() != false) {
                    if (!me.grid.isDataChanged) {
                        LG.showSuccess('无修改');
                        return;
                    }
                    if (!me.grid.validChangeRows()) return false;
                    var changeRow = me.grid.getChangedRows();
                    LG.ajax({
                        jsToken: true,
                        url: 'Device/DeviceRun/Manage',
                        loading: '正在保存中...',
                        data: changeRow,
                        success: function () {
                            LG.showSuccess('保存成功');
                            me.grid.isDataChanged = false;
                            me.reload();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }
            },

            initSearchData: function () {

            },

            init: function () {
                var me = this;
                me.loadComboxData();
                me.setConfig();
                me.setGrid();
                me.setForm();
                return me;
            }
        };
        business.init();
        $("#gridform").ligerLayout({
            leftWidth: '58%',
            allowRightCollapse: false,
            allowLeftCollapse: false,
        });</script>
</body>
</html>
