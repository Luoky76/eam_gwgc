<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title>船舶停机管理明细</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <form id="mainform">
    </form>
    <script type="text/javascript">
        'use strict';
        var business = {
            formLabelWidth: 120,
            formInputWidth: 180,
            getTextareaWidth: function () {
                var me = this;
                var fieldWidth = me.formLabelWidth + me.formInputWidth + 3;
                return Math.floor(($("#mainform").width() - 10) / fieldWidth) * fieldWidth - (me.formLabelWidth + 3);
            },
            dialogData: {},
            isView: false,
            sid: getQueryStringByName("sid"),
            dataCorp: [],
            rootPath: "../",
            dialog: null,
            dialogData: null,
            callback: null,
            orginData: {},
            auditing: [{ "ID": "1", "TEXT": "已提交" }, { "ID": "0", "TEXT": "未提交" }],
            runStatus: [],
            stopSource: [],
            repType: [],
            malType : [],
            deviceInfo: [],
            start : null,
            setConfig: function () {
                var me = this;
                me.config = {
                    form: {
                        fields: [
                            {
                                display: "记录状态", name: "AUDITING", dbname: "AUDITING", minWidth: 200, type: "select", align: "left", options: { data: me.auditing }, editor: { disabled: true }, group: "设备停机记录"
                            },

                            { display: "停机编码", name: "STOP_CODE", newline: false, upper: true, type: "text", options: {}, editor: { disabled: true }, },
                            {
                                display: "船舶编号", name: "DEVICE_ID", dbname: "DEVICE_ID", width: me.formInputWidth, type: "select", align: "left", validate: { required: true },
                                options: {
                                    data: me.deviceInfo,
                                    autocomplete: true,
                                    selectBoxWidth: 350,
                                    valueField: "ID",
                                    textField: "TEXT",
                                    columns: [
                                        { header: '船舶编号', name: 'VALUE', width: me.formInputWidth },
                                        { header: '船舶名称', name: 'TEXT' }
                                    ],
                                    onChangeValue: function (input, value, g) {
                                        if (g.selected != undefined) {
                                            $('#DEVICE_NO').val(g.selected.VALUE == null ? '' : g.selected.VALUE);
                                            $('#DEVICE_NAME').val(g.selected.TEXT == null ? '' : g.selected.TEXT);
                                            $('#DEVICE_TYPE').val(g.selected.EXTEND1 == null ? '' : g.selected.EXTEND1);
                                            $('#TYPE_NAME').val(g.selected.EXTEND2 == null ? '' : g.selected.EXTEND2);
                                        }
                                    }
                                }
                            },
                            { display: "船舶名称", name: "DEVICE_NAME", newline: false, upper: true, type: "text", options: {}, editor: { disabled: true } },
                            { display: "船舶型号", name: "DEVICE_TYPE", newline: false, upper: true, type: "text", options: {}, editor: { disabled: true } },
                            { display: "设备分类", name: "TYPE_NAME", newline: false, upper: true, type: "text", options: {}, editor: { disabled: true } },
                            { display: "停机分类名称", name: "STOP_SOURCE", newline: false, upper: true, type: "select", validate: { required: true }, options: { data: me.stopSource } },
                            {
                                display: "停机开始时间", name: "RUN_START", newline: false, upper: true, type: "date", validate: { required: true },
                                options: {
                                    format: 'yyyy-MM-dd HH',
                                    onChangeValue: function (input, value, g) {
                                        $('#RUN_START').val(value + ":00");
                                        me.updateWorkHours($('#RUN_START').val(), $('#RUN_END').val());
                                    },
                                },
                            },
                            {
                                display: "停机结束时间", name: "RUN_END", newline: false, upper: true, type: "date",
                                options: {
                                    format: 'yyyy-MM-dd HH',
                                    onChangeValue: function (input, value, g) {
                                        $('#RUN_END').val(value + ":00");
                                        me.updateWorkHours($('#RUN_START').val(), $('#RUN_END').val());
                                    },
                                }
                            },
                            { display: "总停机台时(h)", name: "STOP_HOURS", newline: false, upper: true, type: "float", options: {}, editor: { disabled: true } },
                            { display: "编制人", name: "EDIT_USER", newline: false, upper: true, type: "text", options: {}, editor: { disabled: true } },
                            { display: "编制部门", name: "DEPT_NAME", newline: false, upper: true, type: "text", options: {}, editor: { disabled: true } },
                            { display: "二级单位", name: "SEC_DEPT", newline: false, upper: true, type: "text", options: {}, editor: { disabled: true } },
                            { display: "编制日期", name: "EDIT_DATE", newline: false, upper: true, type: "date", options: {}, editor: { disabled: true } },
                            { display: "停机过程描述", name: "STOP_DESC", newline: true, upper: true, width: me.getTextareaWidth(), type: "textarea", validate: { required: true }, options: {} },

                            { display: "分析人", name: "CHECK_USER", newline: false, upper: true, type: "text", options: {}, group: "停机分析报告" },
                            { display: "分析人ID", name: "CHECK_USERID", newline: false, upper: true, type: "hidden", options: {} },
                            { display: "分析部门", name: "CHECK_DEPT", newline: false, upper: true, type: "text", options: {}, editor: { disabled: true } },
                            { display: "分析日期", name: "CHECK_DATE", newline: false, upper: true, type: "date", options: {} },
                            { display: "故障分类", name: "MAL_TYPE_ID", newline: false, upper: true, type: "select", options: { data: me.repType } },
                            { display: "故障部位", name: "MAL_PARTS", newline: false, upper: true, type: "text", options: {} },
                            { display: "主要原因", name: "CHECK_DESC", newline: true, upper: true, width: me.getTextareaWidth(), type: "textarea", options: {} },
                            { display: "计划后续措施", name: "MEMO", newline: true, upper: true, width: me.getTextareaWidth(), type: "textarea", options: {} },

                            { display: "使用部门ID", name: "DEPT_ID", newline: false, upper: true, type: "hidden", options: {} },
                            { display: "二级单位ID", name: "SEC_DEPTID", newline: false, upper: true, type: "hidden", options: {} },
                            { display: "编制人ID", name: "EDIT_USERID", newline: false, upper: true, type: "hidden", options: {} },
                            { display: "使用部门", name: "APPLY_DEPT", newline: false, upper: true, type: "hidden", options: {} },
                            { display: "使用部门ID", name: "APPLY_DEPTID", newline: false, upper: true, type: "hidden", options: {} },
                            { display: "设备编号", name: "DEVICE_NO", newline: false, upper: true, type: "hidden", options: {} },
                            { display: "分类ID", name: "TYPE_ID", newline: false, upper: true, type: "hidden", options: {} },
                            { display: "故障报修ID", name: "REPORT_ID", newline: false, upper: true, type: "hidden", options: {} },
                            { display: "故障台账ID", name: "PROBLEM_ID", newline: false, upper: true, type: "hidden", options: {} },
                            //{ display: "故障分类ID", name: "MAL_TYPE_ID", newline: false, upper: true, type: "hidden", options: {} },
                            { display: "分析部门ID", name: "CHECK_DEPTID", newline: false, upper: true, type: "hidden", options: {} },
                            { display: "主键", name: "RUN_STOP_ID", newline: false, upper: true, type: "hidden", options: {} },
                            { display: "添加人ID", name: "CREATE_USERID", newline: false, upper: true, type: "hidden", options: {} },
                            { display: "添加时间", name: "CREATEDATE", newline: false, upper: true, type: "hidden", options: {} },
                            { display: "修改人ID", name: "MODIFY_USERID", newline: false, upper: true, type: "hidden", options: {} },
                            { display: "修改时间", name: "MODIFYDATE", newline: false, upper: true, type: "hidden", options: {} }
                        ]
                    }
                };
            },
            mainform: null,
            buttons: null,
            //时间判断
            updateWorkHours: function (startDate, completeDate) {
                var start = new Date(startDate);
                var complete = new Date(completeDate);

                if (!startDate || !completeDate) {
                    $('#STOP_HOURS').val("");
                    return;
                }

                if (start > complete) {
                    $('#RUN_START').val("");
                    $('#RUN_END').val("");
                    $('#STOP_HOURS').val("");
                    LG.showError("停机开始时间不能大于停机结束时间！请重新选择！");
                    return;
                }

                var timeDiff = complete - start;
                var minutesDiff = (timeDiff / (1000 * 60 * 60)).toFixed(2);
                $('#STOP_HOURS').val(minutesDiff);
            },
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'Device/DeviceStop/ComboxData',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        me.stopSource = data.StopSource;
                        me.malType = data.MalType;
                        me.deviceInfo = data.DeviceInfo;
                        me.repType = data.RepType;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            f_select_man: function () {
                var me = this;
                var userId = me.mainform.getData().CHECK_USERID || "";
                $.ligerDialog.open({
                    width: 500,
                    height: 500,
                    title: '人员挑选',
                    url: window.gksybConfigs.urlBase + "popup-select/common.html",
                    isResize: true,
                    slide: false,
                    data: {
                        values: [userId],
                        options: {
                            url: 'popup/users', sortName: 'Name', rowKey: "Id", isSingleCheck: true,
                            columns: [
                                { display: "姓名", name: "Name", type: "text" },
                                { display: "公司岗位", name: "Station", type: "text" }
                            ]
                        },
                        fields: [
                            { display: "姓名", name: "Name", width: 100, type: "text" },
                            { display: "公司岗位", name: "Station", width: 100, type: "text" }
                        ],
                        callback: function (values, rows) {
                            if (rows.length < 1) {
                                me.mainform.setData({
                                    "CHECK_USER": null,
                                    "CHECK_USERID": null,
                                    "CHECK_DEPT": null,
                                    "CHECK_DEPTID": null
                                });
                                return;
                            }
                            var row = rows[0];
                            var corp = row.Corps.length > 0 ? row.Corps[0] : {};
                            me.mainform.setData({
                                "CHECK_USER": row.Name,
                                "CHECK_USERID": row.Id,
                                "CHECK_DEPT": corp.CName,
                                "CHECK_DEPTID": corp.CorpID
                            });
                        }
                    }
                });

            },
            loadData: function () {
                var me = this;
                if (!me.sid) {
                    me.mainform.setOrginData({ AUDITING: "0" });
                }
                else {
                    LG.ajax({
                        async: false,
                        url: 'Device/DeviceStop/GetStopListDetail',
                        loading: '正在获取中...',
                        data: { id: me.sid },
                        success: function (data, message) {
                            me.mainform.setOrginData(data);
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                    if (me.isView) {
                        me.mainform.setReadonly(true);
                    }
                }
                me.mainform.focus();
            },
            save: function () { //保存
                var me = this;
                if ($.isEmptyObject(me.mainform.getChanges())) {
                    LG.showSuccess('无修改');
                    return;
                }
                if (!me.mainform.valid()) {
                    me.mainform.showInvalid();
                    return;
                }
                function handle(data) {
                    return data;
                }
                var data = handle(me.mainform.getData());
                var original = handle(me.mainform.getOrginData());
                var changeRow = new Object();
                if (!me.sid) {
                    changeRow["added"] = [data];
                }
                else {
                    changeRow["updated"] = [data];
                    changeRow["original"] = [original];
                }
                LG.ajax({
                    jsToken: true,
                    url: 'Device/DeviceStop/ManageStop',
                    loading: '正在保存中...',
                    data: changeRow,
                    success: function () {
                        LG.showSuccess('保存成功', function () { if (me.dialog) { me.dialog.close(); } });
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            close: function (skipConfirm) {
                var me = this;
                function inner(callback) {
                    if (!skipConfirm && !$.isEmptyObject(me.mainform.getChanges())) {
                        $.ligerDialog.confirm($.ligerDefaults.GridString.isContinueByDataChanged, function (confirm) {
                            if (confirm) {
                                if (callback) callback(2);
                            }
                            else {
                                if (callback) callback(0);
                            }
                        });
                        if (callback) return callback(-1);
                        return false;
                    }
                    if (callback) return callback(1);
                    return true;
                }
                inner(function (status) {
                    if (status > 0) {
                        if (me.dialog) {
                            me.dialog.close();
                            return;
                        }
                        var win = parent || window;
                        if (win.closeCurrentTab) win.closeCurrentTab();
                        else win.close();
                    }
                });
            },
            setFormDefaultBtn: function () {
                var me = this;
                //表单底部按钮
                var buttons = [];
                if (!me.isView) {
                    buttons.push({
                        text: '重置', onclick: function () {
                            $.ligerDialog.confirm("确定重置数据吗?", function (confirm) {
                                if (confirm) {
                                    location.reload(true);
                                }
                            });
                        }
                    });
                }
                buttons.push({ text: '关闭', onclick: me.close.bind(me) });
                if (!me.isView) buttons.push({ text: '保存', onclick: me.save.bind(me) });
                LG.addFormButtons(buttons);
                me.formButtons = buttons;
            },
            setForm: function () {
                var me = this;
                me.config.form.fields.removeNull();
                var $mainform = $("#mainform")
                //搜索表单应用ligerui样式
                me.mainform = $mainform.ligerForm({
                    labelWidth: me.formLabelWidth,
                    inputWidth: me.formInputWidth,
                    EnterMoveNextControl: true,
                    labelAlign: 'right',
                    space: 3,
                    validate: true,
                    fields: me.config.form.fields,
                    labelWidth: me.formLabelWidth,
                    onAfterSetFields: function (g) {
                        me.mainform = g;
                        me.buttons = g.options.buttons;
                    }
                });
                me.setFormDefaultBtn();
            },
            init: function () {
                var me = this;
                if (frameElement && frameElement.dialog) {
                    me.dialog = frameElement.dialog;
                    me.dialogData = me.dialog.get('data') || {};
                    if (me.dialogData.callback) me.callback = me.dialogData.callback;
                    if (me.dialogData.sid) me.sid = me.dialogData.sid;
                    if (me.dialogData.isView != undefined) me.isView = me.dialogData.isView;
                }
                me.loadComboxData();
                me.setConfig();
                me.setForm();
                if (!me.isView) {
                    $('#CHECK_USER').bind('click', function () {
                        me.f_select_man();
                    });
                }
                me.loadData();
                return me;
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>

</html>
