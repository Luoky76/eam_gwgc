<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title>查看盘点任务明细</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <div id="mainsearch" style="width: 98%">
        <form action="" id="formsearch" class="l-form">
        </form>
    </div>
    <form action="" id="mainform">
        <div id="maingrid">
        </div>
    </form>
    <script type="text/javascript">
        'use strict';
        var rootPath = "../";
        window["encryptUrl"] = ["/Apis/"];
        var business = {

            formLabelWidth: 120,
            formInputWidth: 180,
            getTextareaWidth: function () {
                var me = this;
                var fieldWidth = me.formLabelWidth + me.formInputWidth + 3;
                return Math.floor(($("#mainform").width() - 10) / fieldWidth) * fieldWidth - (me.formLabelWidth + 3);
            },
menuNo: getQueryStringByName("MenuNo"),
            ver: getQueryStringByName("ver"),
            detailWidth: 920,
            detailHeight: 450,
            status:[],
            handle: [{ "ID": "0", "TEXT": "否" }, { "ID": "1", "TEXT": "是" }],
            scanresult: [{ "ID": "盘盈", "TEXT": "盘盈" }, { "ID": "盘亏", "TEXT": "盘亏" }, { "ID": "正常", "TEXT": "正常" }],
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            { display: "已处理", name: "_search_HANDLE", dbname: "HANDLE", newline: false, type: "select", options: { data: me.handle } },
                            { display: "盘点结果", name: "_search_SCAN_RESULT", dbname: "SCAN_RESULT", newline: false, type: "select", options: { data: me.scanresult } },
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "已处理", name: "HANDLE", width: 100, type: "select", format: { data: me.handle } },
                            { display: "盘点结果", name: "SCAN_RESULT", width: 100, type: "select", editor: { type: 'select', data: me.scanresult } },
                            { display: "设备编号", name: "DEVICE_NO", width: 100, type: "text", },
                            { display: "资产编号", name: "ASSET_CODE", width: 100, type: "text", },
                            { display: "设备名称", name: "DEVICE_NAME", width: 100, type: "text", },
                            { display: "设备类别", name: "TYPE_NAME", width: 100, type: "text", },
                            { display: "设备型号", name: "DEVICE_TYPE", width: 100, type: "text", },
                            { display: "使用部门", name: "DEPT_NAME", width: 100, type: "text", },
                            { display: "当前管理状态", name: "STATUS", width: 100, type: "select", format: { data: me.status } },
                            //{ display: "二级单位", name: "SEC_DEPT", width: 100, type: "text", },
                            { display: "备注", name: "MEMO", minWidth: 300, type: "text", editor: { type: 'text' } },

                        ]
                    }
                };
            },
            grid: null,
            searchForm: null,
            buttons: null,
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'Device/InventoryTask/ComboxData',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        me.status = data.Status;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            setGrid: function () {
                var me = this;
                var columns = me.config.grid.columns;
                for (var i = columns.length - 1; i >= 0; i--) {
                    if (!columns[i]) columns.splice(i, 1);
                }
                me.grid = $("#maingrid").ligerGrid({
                    autoWidth: true,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    //dataAction: 'server',
                    toolbar: {},
                    url: 'Device/InventoryTask/GetDeviceScanDetails',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: [{ field: 'SCAN_ID', value: me.sid, op: 'equal' },]
                        })
                    },
                    width: '100%',
                    height: '100%',
                    dateFormat: 'yyyy-MM-dd',
                    checkbox: false,
                    enabledEdit: true,
                    clickToEdit: true,
                    usePager: false,
                    onBeforeEdit: function (editParm) {
                    },
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            setForm: function () {
                var me = this;
                var columns = me.config.search.fields;
                for (var i = columns.length - 1; i >= 0; i--) {
                    if (!columns[i]) columns.splice(i, 1);
                }
                var $formsearch = $("#formsearch")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    labelWidth: me.formLabelWidth,
                    inputWidth: me.formInputWidth,
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                    }
                });
                me.buttons[0].click(); //查询
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "save":
                            me.save();
                            break;
                        case "submit":
                            me.submit();
                            break;
                        case "Excel":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=xls", window.gksybConfigs.urlBase), modal: true });
                            break;
                        case "Pdf":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=pdf", window.gksybConfigs.urlBase), modal: true });
                            break;
                    }
                }
                me.grid.toolbarManager.options.group = 'detail';
                if (me.isView == false) {
                    LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
                }
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Pdf',
                        text: '导出Pdf',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-pdf-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            save: function () { //保存
                var me = this;
                if (me.grid.endEdit() != false) {
                    if (!me.grid.isDataChanged) {
                        LG.showSuccess('无修改');
                        return;
                    }
                    if (!me.grid.validChangeRows()) return false;
                    var changeRow = me.grid.getChangedRows();
                    LG.ajax({
                        jsToken: true,
                        url: 'Device/InventoryTask/ManageScanDetail',
                        loading: '正在保存中...',
                        data: changeRow,
                        success: function () {
                            LG.showSuccess('保存成功');
                            me.grid.isDataChanged = false;
                            me.reload();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }
            },

            submit: function () {    //提交盘点结果
                var me = this;
                $.ligerDialog.confirm('确定提交吗?', function (confirm) {
                    if (confirm) {
                        LG.ajax({
                            jsToken: true,
                            url: 'Device/InventoryTask/SubmitScanDet',
                            loading: '正在保存中...',
                            data: { "sid": me.sid },
                            success: function () {
                                LG.showSuccess('保存成功');
                                me.grid.isDataChanged = false;
                                me.reload();
                            },
                            error: function (message) {
                                LG.showError(message);
                            }
                        });
                    }
                });

            },
            reload: function () { //刷新
                var me = this;
                me.buttons[0].click();
            },
            init: function () {
                var me = this;
                if (frameElement && frameElement.dialog) {
                    me.dialog = frameElement.dialog;
                    me.dialogData = me.dialog.get('data');
                    me.callback = me.dialogData.callback;
                    if (me.dialogData.sid) me.sid = me.dialogData.sid
                    if (me.dialogData.auditing) me.auditing = me.dialogData.auditing
                    if (me.dialogData.scanstatus) me.scanstatus = me.dialogData.scanstatus
                    me.isView = me.dialogData.isView === "1";
                }
                if ((me.sid || "0") === "0") me.sid = "";
                me.loadComboxData();
                me.setConfig();
                me.setGrid();
                me.setForm();
                if (me.dialogData.scanstatus == "3") {
                    const commonGridOptions = {
                        enabledEdit: false,
                    };
                    me.grid.setOptions(commonGridOptions);
                }
                return me;
            }
        };
        business.init();
    </script>
</body>

</html>
