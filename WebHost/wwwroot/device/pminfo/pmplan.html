<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title>维保计划</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>
<body style="padding: 5px; height: 100%;">
    <div id="mainsearch" style="width: 100%">
        <form action="" id="formsearch" class="l-form">
            <div id="formsearch1">
            </div>
        </form>
    </div>
    <form action="" id="mainform">
        <div id="gridform">
            <div id="maingrid" hidetitle=true>
            </div>
        </div>
    </form>
    <script type="text/javascript">
        'use strict';

        var business = {
            menuNo: getQueryStringByName("MenuNo"),
            ver: getQueryStringByName("ver"),
            voyagecodedata: null,
            auditing: [{ "ID": "1", "TEXT": "已提交" }, { "ID": "0", "TEXT": "未提交" }],
            disposeType: [],
            faultStatus: [],
            faultSrc: [],
            alreadySubmitted: false,
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            {
                                display: "船舶名称", name: "_search_DEVICE_NAME", dbname: "DEVICE_NAME", newline: false, width: 150, upper: true, type: "text", options: {}
                            },
                            {
                                display: "保养计划单号", name: "_search_PLAN_CODE", dbname: "PLAN_CODE", newline: false, width: 150, upper: true, type: "text", options: {}
                            },
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "已提交", name: "AUDITING", width: 100, type: "chk" },
                            { display: "保养计划单号", name: "PLAN_CODE", minWidth: 150, type: "text", editor: { type: 'text' } },
                            //{ display: "资产编号", name: "ASSET_CODE", minWidth: 100, type: "text", editor: { type: 'text' } },
                            { display: "船舶编号", name: "DEVICE_CODE", minWidth: 100, type: "text", editor: { type: 'text' } },
                            { display: "船舶名称", name: "DEVICE_NAME", minWidth: 100, type: "text", editor: { type: 'text' } },
                            { display: "使用部门", name: "DEPT_NAME", minWidth: 100, type: "text", editor: { type: 'text' } },
                            { display: "维保部门", name: "SHIP_DEPT", minWidth: 100, type: "text", editor: { type: 'text' } },
                            { display: "实施人员", name: "EXE_USER", minWidth: 100, type: "text", editor: { type: 'text' } },
                            { display: "计划维保完成时间", name: "PLAN_FINISH_TIME", minWidth: 100, type: "date", editor: { type: 'date', showTime: true, format: "yyyy-MM-dd hh:mm" } },
                            { display: "计划编制人", name: "EDIT_USER", minWidth: 100, type: "text", editor: { type: 'text' } },
                            { display: "计划编制日期", name: "EDIT_DATE", minWidth: 100, type: "date", editor: { type: 'date', showTime: true, format: "yyyy-MM-dd hh:mm" } },
                            { display: "备注", name: "MEMO", minWidth: 300, type: "text", editor: { type: 'text' } },
                            { display: "EXE_ID", name: "EXE_ID", hide: true },
                        ]
                    },
                };
            },
            grid: null,
            searchForm: null,
            buttons: null,
            searchForm2: null,
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'Device/PmInfo/ComboxData',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        me.faultStatus = data.faultStatus;
                        me.disposeType = data.disposeType;
                        me.faultSrc = data.faultSrc;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    fixedCellHeight: true,
                    autoWidth: true,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    toolbar: {},
                    url: 'Device/PmInfo/GetPmPlanList',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    width: '98%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: false,
                    clickToEdit: false,
                    page: 1,
                    pageSize: 50,
                    usePager: false,
                    onBeforeEdit: function (editParm) {

                    },
                    onSuccess: function (data, g) {

                    },
                    rowAttrRender: function (rowdata, rowid) {

                    },
                    rowAttrRender: function (rowdata, rowid) {

                    },
                    onDblClickRow: function (rowdata) {
                        me.view(rowdata);
                    }
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "attach":
                            me.attach();
                            break;
                        case "add":
                            me.add();
                            break;
                        case "modify":
                            me.modify();
                            break;
                        case "return":
                            me.return();
                            break;
                        case "delete":
                            me.delete();
                            break;
                        case "submit":
                            me.submit();
                            break;
                        case "revoke":
                            me.revoke();
                            break;
                        case "Excel":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=xls", window.gksybConfigs.urlBase), modal: true });
                            break;
                        case "Pdf":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=pdf", window.gksybConfigs.urlBase), modal: true });
                            break;
                    }
                }
                me.grid.toolbarManager.options.group = 'main';
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            revoke: function () {    //反提交
                var me = this;
                var selected = me.grid.getSelectedRows();
                if (selected.length !== 1) {
                    LG.tip('请选择且仅选择一行！');
                }
                else {
                    if (selected[0].AUDITING == "0") {
                        LG.tip('未提交！');
                    }
                    else {
                        var sid = [];
                        selected.forEach((a) => {
                            sid.push(a.EXE_ID)
                        })
                        LG.ajax({
                            jsToken: true,
                            url: 'Device/PmInfo/UnSubmitPmPlan',
                            loading: '正在提交中...',
                            data: { "sid": sid[0] },
                            success: function () {
                                LG.showSuccess('撤回提交成功');
                                me.grid.isDataChanged = false;
                                me.reload();
                            },
                            error: function (message) {
                                LG.showError(message);
                            }
                        });
                    }
                }
            },
            attach: function () {
                var me = this;
                var selected = me.grid.getSelectedRow();
                if (selected) {
                    var me = this;
                    LG.showUpload({
                        multiple: false,
                        extensions: 'xls,xlsx',
                        mimeTypes: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel',
                        compress: {
                            width: 1920
                        },
                        showSuccess: false,
                        //data: { folder: '../../Adv' },
                        callback: function (status, data) {
                            if (status) {
                                LG.showSuccess("导入成功");
                                me.reload();
                            }
                            else LG.showError(data.Message);
                        }
                    });
                }
                else {
                    LG.tip('请选择行!');
                }
            },
            reload: function () { //刷新
                var me = this;
                me.buttons[0].click();
            },
            submit: function () {    //提交
                var me = this;
                var selected = me.grid.getSelectedRows();
                for (var i = 0; i < selected.length; i++) {
                    if (selected[i].AUDITING == "1") {
                        me.alreadySubmitted = true;
                        break;
                    }
                }
                if (selected.length > 0) {
                    if (me.alreadySubmitted) {
                        LG.tip('已提交，无法再次提交!');
                        me.alreadySubmitted = false;
                    }
                    else {
                        var sids = [];
                        selected.forEach((a) => {
                            sids.push(a.EXE_ID)
                        })
                        LG.ajax({
                            jsToken: true,
                            url: 'Device/PmInfo/SubmitPmPlan',
                            loading: '正在保存中...',
                            data: { "sids": sids },
                            success: function () {
                                LG.showSuccess('保存成功');
                                me.grid.isDataChanged = false;
                                me.reload();
                            },
                            error: function (message) {
                                LG.showError(message);
                            }
                        });
                    }

                }
                else {
                    LG.tip('请选择行!');
                }
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Pdf',
                        text: '导出Pdf',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-pdf-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch1 = $("#formsearch1")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch1.ligerForm({
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch1, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                    }
                });
                LG.commonSearch($formsearch1, me.grid);
            },
            openDetail: function (options) {
                var me = this;
                options = options || {};
                $.ligerDialog.open({
                    width: 1100,
                    height: 620,
                    allowClose: true,
                    title: options.title,
                    url: "pmplandet.html?MenuNo=" + me.menuNo,
                    isHidden: false,
                    showMax: false,
                    showToggle: false,
                    showMin: false,
                    isResize: true,
                    slide: false,
                    onClosed: me.reload.bind(me),
                    data: { sid: options.sid || null, isNew: !!options.isNew, isView: !!options.isView }
                });
            },
            add: function () {
                var me = this;
                me.openDetail({ title: '新增维保计划', sid: null, isNew: true, isView: false });
            },
            view: function (rowdata) { //查看
                var me = this;
                var selected = rowdata || me.grid.getSelectedRow();
                if (!selected) {
                    LG.tip('请选择行!');
                    return;
                }
                me.openDetail({ title: '查看维保计划', sid: selected.EXE_ID, isNew: false, isView: true });
            },
            modify: function (rowdata) { //修改
                var me = this;
                var selected = rowdata;
                if (!selected) {
                    var rows = me.grid.getSelectedRows();
                    if (!rows || rows.length === 0) {
                        LG.showError("请选择一行");
                        return;
                    }
                    if (rows.length > 1) {
                        LG.showError("不能选择多行");
                        return;
                    }
                    selected = rows[0];
                }
                if (selected.AUDITING == "1") {
                    LG.tip('已提交，无法修改!');
                    return;
                }
                me.openDetail({ title: '修改维保计划', sid: selected.EXE_ID, isNew: false, isView: false });
            },

            save: function () { //保存
                var me = this;
                if (me.grid.endEdit() != false) {
                    if (!me.grid.isDataChanged) {
                        LG.showSuccess('无修改');
                        return;
                    }
                    if (!me.grid.validChangeRows()) return false;
                    var changeRow = me.grid.getChangedRows();
                    LG.ajax({
                        jsToken: true,
                        url: 'Device/PmInfo/ManagePmPlan',
                        loading: '正在保存中...',
                        data: changeRow,
                        success: function () {
                            LG.showSuccess('保存成功');
                            me.grid.isDataChanged = false;
                            me.reload();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }
            },
            delete: function () { //删除
                var me = this;
                if (me.grid.endEdit() != false) {
                    var selected = me.grid.getSelectedRows();
                    if (selected.length > 0) {
                        for (var i = 0; i < selected.length; i++) {
                            if (selected[i].AUDITING == "1") {
                                LG.tip('已提交，无法删除!');
                                break;
                            }
                            else {
                                $.ligerDialog.confirm('确定删除吗?', function (confirm) {
                                    if (confirm) {
                                        for (var i = 0, len = (selected || []).length; i < len; i++) {
                                            me.grid.deleteRow(selected[i]);
                                        }
                                        me.save();
                                    }
                                }); break;
                            }
                        }
                    } else {
                        LG.tip('请选择行!');
                    }
                }
            },
            init: function () {
                var me = this;
                me.loadComboxData();
                me.setConfig();
                me.setGrid();
                me.setForm();
                return me;
            }
        };
        business.init();
        $("#gridform").ligerLayout({
            leftWidth: '58%',
            allowRightCollapse: false,
            allowLeftCollapse: false,
        });</script>
</body>
</html>
