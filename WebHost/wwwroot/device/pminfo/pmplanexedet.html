<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title>维保实施明细</title>
    <script src="../../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%; overflow:auto;">
    <form id="mainform" style="width:97%;">
    </form>
    <div style="width: 94.5%;" class="l-form">
        <div class="l-form-container">
            <div class="l-group" style="width: 100%;"><span>保养实施明细</span></div>
            <ul style="display: block; width: 100%;" id="ulGrid">
                <li style=" width: 100%;">
                    <div style="margin-bottom: 50px; width: 100%;" id="plandetgird">
                    </div>
                </li>
            </ul>
            <div class="l-group" style="width: 100%;"><span>物资明细</span></div>
            <ul style="display: block; width: 100%;" id="ulGrid">
                <li style=" width: 100%;">
                    <div style="margin-bottom: 50px; width: 100%;" id="spgird">
                    </div>
                </li>
            </ul>
            <div class="l-group" style="width: 100%;"><span>人员明细</span></div>
            <ul style="display: block; width: 100%;" id="ulGrid">
                <li style=" width: 100%;">
                    <div style="margin-bottom: 50px; width: 100%;" id="pepgird">
                    </div>
                </li>
            </ul>
            <div class="l-group" id="work" style="width: 100%;"><span>航租、拖带、护航、接送人员、抗台避台等特殊作业清单</span></div>
            <ul style="display: block; width: 100%;" id="ulGrid">
                <li style=" width: 100%;">
                    <div style="margin-bottom: 50px; width: 100%;" id="workgird">
                    </div>
                </li>
            </ul>
        </div>
    </div>

    <script type="text/javascript">
        'use strict';
        var tableName;
        var dataId;
        var isView;
        var fileMark;
        var business = {
            formLabelWidth: 140,
            formInputWidth: 180,
            getTextareaWidth: function () {
                var me = this;
                var fieldWidth = me.formLabelWidth + me.formInputWidth + 3;
                return Math.floor(($("#mainform").width() - 10) / fieldWidth) * fieldWidth - (me.formLabelWidth + 3);
            },
            menuNo: getQueryStringByName("MenuNo"),
            dialogData: {},
            sid: getQueryStringByName("sid"),
            isNew: false,
            isView: false,
            orginData: {},
            auditing: [{ "ID": "1", "TEXT": "已提交" }, { "ID": "0", "TEXT": "未提交" }],
            complete: [{ "ID": "1", "TEXT": "已完成" }, { "ID": "0", "TEXT": "未完成" }],
            BySource: [],
            PmType: [],
            DeviceInfo: [],
            MaintDept: [],
            StoreSou: [],
            WorkState: [],
            btime: null,
            etime: null,
            MaintCycle: [],
            planMonth: [{ "ID": "1月", "TEXT": "1月" }, { "ID": "2月", "TEXT": "2月" }, { "ID": "3月", "TEXT": "3月" }, { "ID": "4月", "TEXT": "4月" }, { "ID": "5月", "TEXT": "5月" }
                , { "ID": "6月", "TEXT": "6月" }, { "ID": "7月", "TEXT": "7月" }, { "ID": "8月", "TEXT": "8月" }, { "ID": "9月", "TEXT": "9月" }, { "ID": "10月", "TEXT": "10月" }
                , { "ID": "11月", "TEXT": "11月" }, { "ID": "12月", "TEXT": "12月" }],
            stdLevel: [{ "ID": "临时保养", "TEXT": "临时保养" }, { "ID": "定期保养", "TEXT": "定期保养" }],
            isLose: [{ "ID": "1", "TEXT": "是" }, { "ID": "0", "TEXT": "否" }],
            setConfig: function () {
                var me = this;
                me.config = {
                    form: {
                        labelwidth: me.formLabelWidth,
                        inputWidth: me.formInputWidth,
                        fields: [
                            //基础信息
                            { display: "记录状态", name: "AUDITING_EXE", type: "select", options: { type: "select", disabled: true, data: me.auditing },  group: "基础信息" },
                            { display: "保养计划单号", name: "PLAN_CODE",  type: "text", options: { disabled: true } },
                            { display: "保养来源", name: "SOURCE", type: "select", options: { type: "select", data: me.BySource } },
                            {
                                display: "船舶名称", name: "DEVICE_ID", dbname: "DEVICE_ID", width: me.formInputWidth, type: "select", align: "left", 
                                options: { type: "select", disabled: true, data: me.DeviceInfo }
                            },
                            { display: "船舶名称", name: "DEVICE_NAME", type: "hidden", options: {} },
                            { display: "船舶编号", name: "DEVICE_CODE",  options: { disabled: true } },
                            { display: "船舶型号", name: "DEVICE_TYPE",  options: { disabled: true } },
                            { display: "资产编号", name: "ASSET_CODE", type: "text",  options: { disabled: true } },
                            { display: "安装地点", name: "INSTALL_SITE", type: "text",  options: { disabled: true } },
                            { display: "维护类别", name: "PM_TYPE", type: "select",  options: { type: "select", disabled: true, data: me.PmType } },

                            //{ display: "计划编制日期", name: "EDIT_DATE", type: "date", editor: { disabled: true }, options: {} },
                            { display: "计划完成时间", name: "PLAN_FINISH_TIME",  type: "date", options: { disabled: true } },
                            { display: "计划编制人", name: "EDIT_USER", type: "text",  options: { disabled: true } },

                            { display: "使用部门", name: "DEPT_NAME", type: "text",  options: { disabled: true } },
                            {
                                display: "维保部门", name: "WDEPT_ID", type: "select",  options: { type: "select", disabled: true, data: me.MaintDept }
                            },
                            { display: "维保部门", name: "SHIP_DEPT", type: "hidden", options: {} },
                            { display: "保养负责人", name: "EXE_USER", type: "text",  options: { disabled: true } },
                            { display: "是否有遗留问题", name: "IS_LOSE", type: "select", options: { type: "select", data: me.isLose }, validate: { required: true }, },
                            { display: "遗留问题描述", name: "LEG_DESC", newline: true, width: me.getTextareaWidth(), type: "textarea", options: {} },
                            { display: "备注", name: "MEMO", newline: true, width: me.getTextareaWidth(), type: "textarea", options: {} },

                            {
                                display: "保养开始时间", name: "BEGIN_DATE", type: "date", validate: { required: true },
                                options: {
                                    format: 'yyyy-MM-dd HH:mm:ss',
                                    onChangeValue: function (input, value, g) {
                                        me.updateWorkHours(value, $('#END_DATE').val());
                                    },
                                }, group: "实施信息"
                            },
                            {
                                display: "保养结束时间", name: "END_DATE", type: "date", validate: { required: true },
                                options: {
                                    format: 'yyyy-MM-dd HH:mm:ss',
                                    onChangeValue: function (input, value, g) {
                                        me.updateWorkHours($('#BEGIN_DATE').val(), value);
                                    },
                                }
                            },
                            { display: "保养时长（小时）", name: "MAINTENANCE_HOUR", type: "float", validate: { required: true } },

                            //隐藏
                            { display: "主键", name: "EXE_ID", type: "hidden", options: {} },]
                    },
                    grid: {
                        columns: [
                            { display: "完成情况", name: "COMPLETE", type: "select", minWidth: 100, validate: { required: true }, editor: { type: 'select', data: me.complete } },
                            { display: "执行岗位", name: "EXE_USER", minWidth: 100, type: "text", editor: { type: 'text' } },
                            { display: "执行人", name: "EXECUTE_USER", minWidth: 100, type: "text", validate: { required: true }, editor: { type: 'text' } },
                            { display: "检查岗位", name: "CHK_USER", minWidth: 100, type: "text", editor: { type: 'text' } },
                            { display: "检查人", name: "CHECK_USER", minWidth: 100, type: "text", validate: { required: true }, editor: { type: 'text' } },
                            {
                                display: "附件材料", name: "ATTACH_EXE", dbname: "ATTACH_EXE", width: 90, type: "text",
                                render: function (rowdata, index, value) {
                                    return '<a href="javascript:void(0)" onclick="business.f_exeAttachManage(\'' + rowdata.DONEITEM_ID + '\')"><span class="badge">' + value + '</span></i></a>';
                                }
                            },
                            {
                                display: "保养计划附件", name: "ATTACH_PLAN", dbname: "ATTACH_PLAN", width: 90, type: "text",
                                render: function (rowdata, index, value) {
                                    return '<a href="javascript:void(0)" onclick="business.f_planAttachManage(\'' + rowdata.DONEITEM_ID + '\')"><span class="badge">' + value + '</span></i></a>';
                                }
                            },
                            { display: "标准编号", name: "STD_CODE", minWidth: 100, type: "text", },
                            { display: "保养项目", name: "OBJECT_NAME", minWidth: 150, type: "text", },
                            { display: "保养内容", name: "CONTENT", minWidth: 250, type: "text", },
                            { display: "保养类型", name: "STD_LEVEL", minWidth: 100, type: "select", format: { data: me.stdLevel } },
                            { display: "作业时设备状态", name: "WORK_STATE", minWidth: 140, type: "select", format: { data: me.WorkState } },
                            { display: "保养周期", name: "MAINT_CYCLE", minWidth: 100, type: "select", format: { data: me.MaintCycle } },
                            { display: "计划保养月份", name: "PLAN_MONTH", minWidth: 100, type: "select", format: { data: me.planMonth } },
                            { display: "上次完成时间", name: "LAST_COMP_DATE", minWidth: 100, type: "date", },
                            { display: "下次保养截止日期", name: "NEXT_ENDDATE", minWidth: 100, type: "date", },
                            { display: "备注", name: "MEMO", minWidth: 300, type: "text", },
                            { display: "主键", name: "DONEITEM_ID", minWidth: 100, hide: true },
                            { display: "计划ID", name: "EXE_ID", width: 100, hide: true },

                        ]
                    },
                    grid2: {
                        columns: [
                            { display: "来源", name: "SP_SOURCE", minWidth: 100, type: "select", format: { data: me.StoreSou } },
                            { display: "备件品种编码", name: "SP_CODE", minWidth: 100, type: "text", },
                            { display: "备件品种名称", name: "SP_NAME", minWidth: 100, type: "text", },
                            { display: "型号规格", name: "SP_SIZE", minWidth: 100, type: "text", },

                            { display: "仓库名称", name: "HOUSE_NAME", minWidth: 100, type: "text", },
                            { display: "库位名称", name: "STOCK_NAME", minWidth: 100, type: "text", },
                            { display: "库存数量", name: "STORE_NUM", minWidth: 100, type: "float", },
                            { display: "实际消耗数量", name: "FACT_NUM", minWidth: 100, validate: { required: true }, type: "float", editor: { type: 'float' } },
                            { display: "计量单位", name: "UNIT", minWidth: 100, type: "text", },
                            { display: "含税金额(元)", name: "TAX_MONEY", minWidth: 100, type: "float" },
                            { display: "不含税金额(元)", name: "UNTAX_MONEY", minWidth: 100, type: "float" },
                            { display: "主键", name: "FAULT_SP_ID", minWidth: 100, hide: true },
                            { display: "外键", name: "EXE_ID", minWidth: 100, hide: true },
                            { display: "备注", name: "MEMO", minWidth: 100, type: "text", editor: { type: 'text' } },
                            { display: "外键", name: "DONEITEM_ID", width: 100, hide: true },
                            { display: "外键", name: "STORE_ID", width: 100, hide: true },


                        ]
                    },
                    grid3: {
                        columns: [
                            { display: "人员姓名", name: "USER_NAME", minWidth: 200, type: "text", editor: { type: 'text' } },
                            { display: "人员ID", name: "LABOR_ID", minWidth: 100, hide: true },
                            { display: "工时(H)", name: "PLAN_DATE", minWidth: 200, validate: { required: true }, type: "float", editor: { type: 'float' } },
                            { display: "备注", name: "MEMO", minWidth: 300, type: "text", editor: { type: 'text' } },
                            { display: "主键", name: "PLAN_LABOR_ID", width: 100, hide: true },
                            { display: "外键", name: "EXE_ID", width: 100, hide: true },
                            { display: "外键", name: "DONEITEM_ID", width: 100, hide: true },

                        ]
                    },
                    grid4: {
                        columns: [
                            { display: "特殊作业", name: "WORK_NAME", minWidth: 150, validate: { required: true }, type: "text", editor: { type: 'text' } },
                            {
                                display: "日期", name: "WORK_DATE", minWidth: 100, validate: { required: true }, type: "date",
                                editor: {
                                    type: 'date',
                                    showTime: true, format: "yyyy-MM-dd hh:mm",
                                    onChange: function (rowdata, rowIndex) {
                                        me.btime = rowdata.value
                                        me.etime = rowdata.value
                                        if (rowdata.value) {
                                            liger.get("workgird").updateCell("BEGIN_TIME", rowdata.value, rowdata.record);
                                            liger.get("workgird").updateCell("END_TIME", rowdata.value, rowdata.record);
                                        } else {
                                            liger.get("workgird").updateCell("BEGIN_TIME", "", rowdata.record);
                                            liger.get("workgird").updateCell("END_TIME", "", rowdata.record);
                                        }
                                    },
                                }
                            },
                            {
                                display: "开始时间", name: "BEGIN_TIME", minWidth: 100, validate: { required: true }, type: "date",
                                editor: {
                                    type: 'date', showTime: true,
                                    format: "yyyy-MM-dd hh:mm",
                                    onChange: function (rowdata, rowIndex) {
                                        me.btime = rowdata.value
                                        if (me.etime == null) {
                                            liger.get("workgird").updateCell("END_TIME", "", rowdata.record);
                                            LG.showError("请选结束时间！");
                                        }
                                        else {
                                            if (me.etime < me.btime) {
                                                LG.showError("开始时间不可大于结束时间！");
                                            }
                                            else {
                                                var date1 = new Date(me.btime);
                                                var date2 = new Date(me.etime);
                                                // 计算时间差值（单位为毫秒）
                                                var timeDiff = date2.getTime() - date1.getTime();
                                                // 将时间差值转换为小时数
                                                var minutesDiff = Math.round(timeDiff / 1000 / 60 / 60).toFixed(2);;
                                                liger.get("workgird").updateCell("WORK_HOUR", minutesDiff, rowdata.record);
                                            }
                                        }
                                    },
                                }
                            },
                            {
                                display: "结束时间", name: "END_TIME", minWidth: 100, validate: { required: true }, type: "date",
                                editor: {
                                    type: 'date',
                                    showTime: true, format: "yyyy-MM-dd hh:mm",
                                    onChange: function (rowdata, rowIndex) {
                                        me.etime = rowdata.value
                                        if (me.btime == null) {
                                            liger.get("workgird").updateCell("BEGIN_TIME", "", rowdata.record);
                                            LG.showError("请选开始时间！");
                                        }
                                        else {
                                            if (me.etime < me.btime) {
                                                LG.showError("结束时间不小于开始时间！");
                                            }
                                            else {
                                                var date1 = new Date(me.btime);
                                                var date2 = new Date(me.etime);
                                                // 计算时间差值（单位为毫秒）
                                                var timeDiff = date2.getTime() - date1.getTime();
                                                // 将时间差值转换为小时数
                                                var minutesDiff = Math.round(timeDiff / 1000 / 60 / 60).toFixed(2);
                                                liger.get("workgird").updateCell("WORK_HOUR", minutesDiff, rowdata.record);
                                            }
                                        }
                                    },
                                }
                            },
                            { display: "作业时间/小时", name: "WORK_HOUR", minWidth: 100, type: "float", editor: { type: 'float', disabled: true } },
                            { display: "作业耗油/吨", name: "WORK_OIL", minWidth: 100, validate: { required: true }, type: "float", editor: { type: 'float' } },
                            { display: "备注", name: "MEMO", minWidth: 300, type: "text", editor: { type: 'text' } },
                            { display: "主键", name: "WORK_ID", minWidth: 100, type: "text", hide: true },
                            { display: "实施单ID", name: "EXE_ID", minWidth: 100, type: "text", hide: true },

                        ]
                    },
                };
            },
            mainform: null,
            buttons: null,
            //时间判断
            updateWorkHours: function (startDate, completeDate) {
                var start = new Date(startDate);
                var complete = new Date(completeDate);

                if (start >= complete) {
                    $('#BEGIN_DATE').val("");
                    $('#END_DATE').val("");
                    LG.showError("保养开始时间不能大于保养结束时间！请重新选择！");
                    return;
                }
            },
            //实施附件管理
            f_exeAttachManage: function (dataid) {
                var me = this;
                isView = me.isView;
                dataId = dataid;
                fileMark = 0;
                tableName = "PM_PLAN_EXE"; // 表名
                $.ligerDialog.open({
                    width: 960,
                    height: 540,
                    allowClose: true,
                    isHidden: false,
                    //data: { "tableName": tableName, "dataId": dataid, "isView": isView },
                    url: '../../filemanager/file-attachment-content.html',
                    title: '附件管理',
                    onClose: function () {
                        me.reloadDet();
                    }
                });
            },
            //保养计划附件管理
            f_planAttachManage: function (dataid) {
                var me = this;
                isView = true;
                dataId = dataid;
                fileMark = 0;
                tableName = "PM_PLAN_DONEITEM"; // 表名
                $.ligerDialog.open({
                    width: 960,
                    height: 540,
                    allowClose: true,
                    isHidden: false,
                    //data: { "tableName": tableName, "dataId": dataid, "isView": isView },
                    url: '../../filemanager/file-attachment-content.html',
                    title: '附件管理',
                    onClose: function () {
                        me.reloadDet();
                    }
                });
            },
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'Device/PmInfo/ComboxData',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        me.MaintDept = data.MaintDept;
                        me.PmType = data.PmType;
                        me.DeviceInfo = data.DeviceInfo;
                        me.BySource = data.BySource;
                        me.WorkState = data.WorkState;
                        me.MaintCycle = data.MaintCycle;
                        me.StoreSou = data.StoreSou;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            loadData: function () {
                var me = this;
                function inner() {
                    var data = me.mainform.getData();
                    LG.getFormCombChanges(data, me.orginData, true);
                    delete me.orginData;
                    me.orginData = data;
                }
                if (me.isNew) {
                    LG.ajax({
                        async: false,
                        url: 'Common/General/CreatePrimaryKey',
                        loading: '正在获取中...',
                        success: function (data) {
                            me.sid = data;
                            me.EXE_ID = data;
                            me.mainform.setData({ EXE_ID: data, AUDITING_EXE: "0", SOURCE: "3", PM_TYPE: "maint" });
                            inner();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }
                else {
                    LG.ajax({
                        async: false,
                        url: 'Device/PmInfo/GetPmPlanListDetail',
                        loading: '正在获取中...',
                        data: { id: me.sid },
                        success: function (data, message) {
                            data.OLDMODIFYDATE = data.MODIFYDATE;
                            me.EXE_ID = data.EXE_ID;
                            me.mainform.setData(data);
                            inner();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                    if (me.isView) {
                        me.mainform.setReadonly(true);
                    }
                }
                var input = me.mainform.getEditor(me.config.form.fields[0].name).inputText;
                input.focus();
                input.select();
            },
            //同时保存所有
            saveAll: function () {
                var me = this;
                //保存前验证
                if (!me.grid.endEdit() || !me.grid2.endEdit() || !me.grid3.endEdit() || !me.grid4.endEdit()) return;
                if ($.isEmptyObject(me.mainform.getChanges()) && !me.grid.isDataChanged && !me.grid2.isDataChanged && !me.grid3.isDataChanged && !me.grid4.isDataChanged) {
                    LG.showSuccess('无修改');
                    return;
                }
                if (!me.mainform.valid()) {
                    me.mainform.showInvalid();
                    return;
                }

                //构造保存请求
                function handle(data) {
                    data.GRID = encrypt(data.GRID);
                    data.SEARCH = encrypt(data.SEARCH);
                    data.FORM = encrypt(data.FORM);
                    return data;
                }
                var data = handle(me.mainform.getData());
                var original = handle(me.orginData);

                var changeRow1 = new Object();
                if (me.isNew) {
                    changeRow1["added"] = [data];
                }
                else {
                    changeRow1["updated"] = [data];
                    changeRow1["original"] = [original];
                }

                var changeRow2 = new Object();
                if (me.grid.validChangeRows()) changeRow2 = me.grid.getChangedRows();

                var changeRow3 = new Object();
                if (me.grid2.validChangeRows()) changeRow3 = me.grid2.getChangedRows();

                var changeRow4 = new Object();
                if (me.grid3.validChangeRows()) changeRow4 = me.grid3.getChangedRows();

                var changeRow5 = new Object();
                if (me.grid4.validChangeRows()) changeRow5 = me.grid4.getChangedRows();

                //统一保存请求
                LG.ajax({
                    jsToken: true,
                    url: 'Device/PmInfo/SaveAll',
                    loading: '正在保存中...',
                    data: { request1: changeRow1, request2: changeRow2, request3: changeRow3, request4: changeRow4, request5: changeRow5 },
                    success: function (result) {
                        LG.showSuccess('保存成功', function () {
                            if (me.isNew && me.dialog) {
                                me.dialog.close();
                            }
                            else {
                                //保存后原始数据变为当前数据
                                me.orginData = data;
                                me.loadData();
                                me.grid.isDataChanged = false;
                                me.reloadDet();
                                me.grid2.isDataChanged = false;
                                me.reloadSp();
                                me.grid3.isDataChanged = false;
                                me.reloadPep();
                                me.grid4.isDataChanged = false;
                                me.reloadWork();
                            }
                        });
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            close: function () {
                var me = this;
                function inner(callback) {
                    var data = me.mainform.getData();
                    var updateFields = LG.getFormCombChanges(data, me.orginData, true);
                    var isChangedGrid = me.grid.getChangedRows();
                    if (updateFields || isChangedGrid.updated.length > 0) {
                        $.ligerDialog.confirm($.ligerDefaults.GridString.isContinueByDataChanged, function (confirm) {
                            if (confirm) {
                                if (callback) callback(2);
                            }
                            else {
                                if (callback) callback(0);
                            }
                        });
                        if (callback) return callback(-1);
                        return false;
                    }
                    if (callback) return callback(1);
