<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title>维保查询</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>
<body style="padding: 5px; height: 100%;">
    <div id="mainsearch" style="width: 100%">
        <form action="" id="formsearch" class="l-form">
            <div id="formsearch1">
            </div>
        </form>
    </div>
    <form action="" id="mainform">
        <div id="gridform">
            <div id="maingrid" hidetitle=true>
            </div>
        </div>
    </form>
    <script type="text/javascript">
        'use strict';

        var business = {

            formLabelWidth: 70,
            formInputWidth: 180,
            getTextareaWidth: function () {
                var me = this;
                var fieldWidth = me.formLabelWidth + me.formInputWidth + 3;
                return Math.floor(($("#mainform").width() - 10) / fieldWidth) * fieldWidth - (me.formLabelWidth + 3);
            },
menuNo: getQueryStringByName("MenuNo"),
            ver: getQueryStringByName("ver"),
            voyagecodedata: null,
            isLose: [{ "ID": "1", "TEXT": "是" }, { "ID": "0", "TEXT": "否" }],
            alreadySubmitted: false,
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            {
                                display: "保养计划单号", name: "_search_PLAN_CODE", dbname: "PLAN_CODE", newline: false, width: 200, upper: true, type: "text", options: {}
                            },
                            {
                                display: "使用部门", name: "_search_DEPT_NAME", dbname: "DEPT_NAME", newline: false, width: 200, upper: true, type: "text", options: {}
                            },
                            {
                                display: "维保部门", name: "_search_SHIP_DEPT", dbname: "SHIP_DEPT", newline: false, width: 200, upper: true, type: "text", options: {}
                            },
                            {
                                display: "计划完成时间", name: "_search_PLAN_FINISH_TIME_FROM", dbname: "PLAN_FINISH_TIME", width: 200, newline: true, type: "date", op: 'greaterorequal', vt: 'date',
                                options: {
                                    format: "yyyy-MM-dd"
                                }
                            },
                            {
                                display: "至", name: "_search_PLAN_FINISH_TIME_TO", dbname: "PLAN_FINISH_TIME", labelWidth: me.formLabelWidth, width: 200, newline: false, type: "date", op: 'lessorequal', vt: 'date',
                                options: {
                                    format: "yyyy-MM-dd"
                                }
                            },
                            {
                                display: "实际完成时间", name: "_search_AUDIT_TIME_FROM", dbname: "AUDIT_TIME", width: 200, newline: true, type: "date", op: 'greaterorequal', vt: 'date',
                                options: {
                                    format: "yyyy-MM-dd"
                                }
                            },
                            {
                                display: "至", name: "_search_AUDIT_TIME_TO", dbname: "AUDIT_TIME", labelWidth: me.formLabelWidth, width: 200, newline: false, type: "date", op: 'lessorequal', vt: 'date',
                                options: {
                                    format: "yyyy-MM-dd"
                                }
                            },
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "计划已提交", name: "AUDITING", type: "chk" },
                            { display: "实施已提交", name: "AUDITING_EXE", type: "chk" },
                            { display: "保养计划单号", name: "PLAN_CODE", minWidth: 150, type: "text" },
                            { display: "使用部门", name: "DEPT_NAME", minWidth: 100, type: "text" },
                            { display: "维保部门", name: "SHIP_DEPT", minWidth: 100, type: "text" },
                            { display: "保养开始时间", name: "BEGIN_DATE", minWidth: 100, type: "date", showTime: true, format: "yyyy-MM-dd hh:mm" },
                            { display: "保养结束时间", name: "END_DATE", minWidth: 100, type: "date", showTime: true, format: "yyyy-MM-dd hh:mm" },
                            { display: "已完成", name: "COMPLETE", type: "chk" },
                            {
                                display: "计划附件", name: "ATTACH_PLAN", dbname: "ATTACH_PLAN", width: 90, type: "text",
                                render: function (rowdata, index, value) {
                                    return '<a href="javascript:void(0)" onclick="business.f_planAttachManage(\'' + rowdata.DONEITEM_ID + '\')"><span class="badge">' + value + '</span></i></a>';
                                }
                            },
                            {
                                display: "实施附件", name: "ATTACH_EXE", dbname: "ATTACH_EXE", width: 90, type: "text",
                                render: function (rowdata, index, value) {
                                    return '<a href="javascript:void(0)" onclick="business.f_exeAttachManage(\'' + rowdata.DONEITEM_ID + '\')"><span class="badge">' + value + '</span></i></a>';
                                }
                            },
                            { display: "保养项目", name: "OBJECT_NAME", minWidth: 150, type: "text" },
                            { display: "保养内容", name: "CONTENT", minWidth: 250, type: "text" },
                            { display: "执行人", name: "EXECUTE_USER", minWidth: 100, type: "text" },
                            { display: "备注", name: "MEMO", minWidth: 300, type: "text" },
                            //隐藏字段
                            { display: "主表主键", name: "EXE_ID", hide: true },
                            { display: "子表主键", name: "DONEITEM_ID", hide: true }
                        ]
                    },
                };
            },
            grid: null,
            searchForm: null,
            buttons: null,
            searchForm2: null,
            //实施附件管理
            f_exeAttachManage: function (dataid) {
                var me = this;
                $.ligerDialog.open({
                    width: 960,
                    height: 540,
                    allowClose: true,
                    isHidden: false,
                    data: { "tableName": "PM_PLAN_EXE", "dataId": dataid, "isView": true, "fileMark": 0 },
                    url: '../../filemanager/file-attachment-content.html',
                    title: '附件管理',
                    onClose: function () {}
                });
            },
            //计划附件管理
            f_planAttachManage: function (dataid) {
                var me = this;
                $.ligerDialog.open({
                    width: 960,
                    height: 540,
                    allowClose: true,
                    isHidden: false,
                    data: { "tableName": "PM_PLAN_DONEITEM", "dataId": dataid, "isView": true, "fileMark": 0 },
                    url: '../../filemanager/file-attachment-content.html',
                    title: '附件管理',
                    onClose: function () {}
                });
            },
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'Device/PmInfo/ComboxData',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        me.FaultStatus = data.FaultStatus;
                        me.DisposeType = data.DisposeType;
                        me.FaultSrc = data.FaultSrc;
                        me.DeviceStatus = data.DeviceStatus;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    fixedCellHeight: true,
                    autoWidth: true,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    toolbar: {},
                    url: 'Device/PmInfo/GetExtendPlanList',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: 'PLAN_CODE',
                    sortOrder: 'DESC',
                    width: '98%',
                    height: '100%',
                    checkbox: false,
                    enabledEdit: false,
                    clickToEdit: false,
                    page: 1,
                    pageSize: 50,
                    isSingleCheck: false,
                    usePager: false,
                    onBeforeEdit: function (editParm) {

                    },
                    onSuccess: function (data, g) {

                    },
                    rowAttrRender: function (rowdata, rowid) {

                    },
                    rowAttrRender: function (rowdata, rowid) {

                    }
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "Excel":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=xls", window.gksybConfigs.urlBase), modal: true });
                            break;
                        case "Pdf":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=pdf", window.gksybConfigs.urlBase), modal: true });
                            break;
                    }
                }
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            reload: function () { //刷新
                var me = this;
                me.buttons[0].click();
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Pdf',
                        text: '导出Pdf',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-pdf-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch1 = $("#formsearch1")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch1.ligerForm({
                    labelWidth: me.formLabelWidth,
                    inputWidth: me.formInputWidth,
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch1, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                    }
                });
                LG.commonSearch($formsearch1, me.grid);
            },
            initSearchData: function () {

            },

            init: function () {
                var me = this;
                me.loadComboxData();
                me.setConfig();
                me.setGrid();
                me.setForm();
                return me;
            }
        };
        business.init();
        $("#gridform").ligerLayout({
            leftWidth: '58%',
            allowRightCollapse: false,
            allowLeftCollapse: false,
        });</script>
</body>
</html>
