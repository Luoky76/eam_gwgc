<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title>通用挑选</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <div id="mainsearch" style="display:none;">
        <form action="" id="formsearch" class="l-form">
        </form>
    </div>
    <form action="" id="mainform">
        <div id="maingrid">
        </div>
    </form>
    <script type="text/javascript">
        'use strict';
        var business = {
            deviceId: null,
            deptId: null,
            grid: null,
            searchForm: null,
            buttons: null,
            setGrid: function () {
                var me = this;
                var options = $.extend({
                    autoWidth: true,
                    delayLoad: false,
                    async: false,
                    usePager: false,
                    dataAction: 'server',
                    toolbar: {},
                    sortOrder: 'asc',
                    width: '100%',
                    height: '100%',
                    heightDiff: -40,
                    checkbox: true,
                    enabledEdit: false,
                    clickToEdit: false,
                    isChecked: function (item) {
                        if (me._storageSelect) {
                            var key = item[me.data.options.rowKey];
                            var isSelect = me._storageSelect[key] === true;
                            delete me._storageSelect[key];
                            if (isSelect) return true;
                        }
                        return false;
                    }
                }, me.data.options);
                options.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid(options);
            },
            reload: function () { //刷新
                var me = this;
                debugger
                me.buttons[0].click();
            },
            setForm: function () {
                var me = this;
                var $formsearch = $("#formsearch")
                var options = {
                    fields: me.data.fields || [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            var p = me.grid.options;
                            LG.commonSearch($formsearch, me.grid, undefined, (p.usePager && p.pageCount > 1));
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                        if (me.deviceId != null) {
                            me.searchForm.setData({ "DEVICE_ID": me.deviceId });
                            me.searchForm.setData({ "DEPARTMENT": me.deptId });
                        }
                    }
                };
                options.fields.removeNull();
                if (options.fields.length > 0) $("#mainsearch").show();
                me.searchForm = $formsearch.ligerForm(options);
            },
            close: function () {
                var me = this;
                function inner(callback) {
                    if (callback) return callback(1);
                    return true;
                }
                inner(function (status) {
                    if (status > 0) {
                        if (me.dialog) {
                            me.dialog.close();
                            return;
                        }
                        var win = parent || window;
                        if (win.closeCurrentTab) win.closeCurrentTab();
                        else win.close();
                    }
                });
            },
            setFormButtons: function () {
                var me = this;
                //表单底部按钮
                var buttons = [];
                buttons.push({ text: '关闭', onclick: me.close.bind(me) });
                buttons.push({ text: '确定', onclick: me.save.bind(me) });
                LG.addFormButtons(buttons);
                me.formButtons = buttons;
            },
            save: function () {
                var me = this;
                var rows = me.grid.getSelectedRows() || [];
                var values = [];
                for (var i = 0, l = rows.length; i < l; i++) {
                    var row = rows[i];
                    values.push(row[me.data.options.rowKey]);
                }
                if (me.data.callback) {
                    me.data.callback(values, rows);
                }
                me.close();
            },
            initSelect: function () {
                var me = this;
                var values = $.isArray(me.data.values) ? me.data.values : (me.data.values || "").split(me.data.split);
                var select = {};
                for (var i = 0, l = values.length; i < l; i++) {
                    var item = values[i];
                    select[item] = true;
                }
                me._storageSelect = select;
            },
            init: function () {
                var me = this;
                if (frameElement && frameElement.dialog) {
                    me.dialog = frameElement.dialog;
                    me.data = frameElement.dialog.get('data') || {};
                    //me.data = {
                    //    values: "123,456,789,",//[123,456,789]
                    //    //split:",",
                    //    options: {
                    //        url: 'popup/users', sortName: 'Name', rowKey: "",
                    //        columns: [
                    //            { display: "表格列", name: "column", type: "text" }
                    //        ]
                    //    },
                    //    fields: [
                    //        { display: "查询条件", name: "name", type: "text" }
                    //    ],
                    //    callback: function (values, rows) {
                    //    }
                    //};
                }
                if (!me.data || !me.data.options) {
                    LG.showError("参数不完整");
                    return;
                }

                me.deviceId = me.data.options.deviceId;
                me.deptId = me.data.options.deptId;
                me.data.split = me.data.split || ",";
                me.initSelect();
                me.setGrid();
                me.setForm();
                me.setFormButtons();
                me.reload();
                return me;
            }
        };
        business.init();
    </script>
</body>
</html>
