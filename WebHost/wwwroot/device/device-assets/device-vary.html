
<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title></title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <div id="mainsearch" style="width: 98%">
        <form action="" id="formsearch" class="l-form">
        </form>
    </div>
    <form action="" id="mainform">
        <div id="maingrid">
        </div>
    </form>
    <script type="text/javascript">
        'use strict';
        var business = {

            formLabelWidth: 120,
            formInputWidth: 180,
            getTextareaWidth: function () {
                var me = this;
                var fieldWidth = me.formLabelWidth + me.formInputWidth + 3;
                return Math.floor(($("#mainform").width() - 10) / fieldWidth) * fieldWidth - (me.formLabelWidth + 3);
            },
setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            { display: "记录状态", name: "_search_AUDITING", dbname: "AUDITING", newline: false, upper: true, type: "select", options: { type: 'select', data: me.auditingData }},
                            { display: "变动单号", name: "_search_VARY_CODE", dbname: "VARY_CODE", newline: false, upper: true, type: "text", options: {} },
                            { display: "变动类型", name: "_search_VARY_TYPE", dbname: "VARY_TYPE", newline: false, upper: true, type: "select", options: { type: 'select', data: me.VaryType }},
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "主键", name: "VARY_ID", type: "text", editor: { type: 'text' }, hide: true },
                            { display: "已提交", name: "AUDITING", minWidth: 120, type: "chk" },
                            { display: "变动类型", name: "VARY_TYPE", minWidth: 120,  type: "select", editor: { type: 'select', data: me.VaryType, selectBoxHeight: 100 } },
                            { display: "变动单号", name: "VARY_CODE", minWidth: 120,  type: "text", editor: { type: 'text' } },
                            { display: "登记人", name: "EIDT_USER", minWidth: 120,  type: "text", editor: { type: 'text' } },
                            { display: "调出使用部门", name: "DEPT_NAME", minWidth: 120,  type: "text", editor: { type: 'text' } },
                            { display: "调入使用部门", name: "WDEPT_NAME", minWidth: 120,  type: "text", editor: { type: 'text' } },
                            { display: "申请日期", name: "APPLY_DATE", minWidth: 120, type: "date", editor: { type: 'date', showTime: true, format: "yyyy-MM-dd hh:mm" } },
                            { display: "变动完成日期", name: "VARY_DATE", minWidth: 120,  type: "date", editor: { type: 'date', showTime: true, format: "yyyy-MM-dd hh:mm" } },
                            { display: "计划启用日期", name: "PLAN_START_DATE",  minWidth: 120, type: "date", editor: { type: 'date', showTime: true, format: "yyyy-MM-dd hh:mm" } },
                            { display: "设备总原值(元)", name: "SUM_ORG_VALUE",  minWidth: 120,  type: "decimal", editor: { type: 'decimal' } },
                            { display: "设备总净值(元)", name: "SUM_NET_VALUE",  minWidth: 120,  type: "decimal", editor: { type: 'decimal' } },
                            { display: "总已提折旧(元)", name: "SUM_DEP_VALUE",  minWidth: 120,  type: "decimal", editor: { type: 'decimal' } },
                            { display: "变卖总金额(元)", name: "SUM_ALLOT_MONEY", minWidth: 120,   type: "decimal", editor: { type: 'decimal' } },
                            { display: "变动原因", name: "REASONS", minWidth: 120,  type: "text", editor: { type: 'text' } },
                            { display: "设备技术状态", name: "TECH_STATUS", minWidth: 120,   type: "text", editor: { type: 'text' } },
                            { display: "备注", name: "MEMO", type: "text", minWidth: 120, editor: { type: 'text' } },
                            { display: "鉴定结果", name: "RESULT", minWidth: 120, type: "text", editor: { type: 'text' } },
                        ]
                    }
                };
            },
            grid: null,
            searchForm: null,
            type: null,
            buttons: null,
            VaryType:[],
            auditingData: [
                { ID: "0", TEXT: "未提交", VALUE: "0" },
                { ID: "1", TEXT: "已提交", VALUE: "1" }
            ],
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'Device/DeviceVary/ComboxData',
                    loading: '正在获取中...',
                    success: function (data, message) {

                        me.VaryType = data.VaryType;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    autoWidth: false,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    usePager: false,
                    dataAction: 'server',
                    toolbar: {},
                    url: 'Device/DeviceVary/list',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: 'AUDITING',
                    sortOrder: 'asc',
                    width: '100%',
                    height: '100%',
                    checkbox: true,
                    onBeforeEdit: function (editParm) {
                        switch (editParm.column.name) {
                            case "":
                                if (editParm.record.__status == "add") return true;
                                else return false;
                                break;
                        }
                    },
                    onSuccess: function (data, g) {
                        if (data && data.Rows) {
                            var rows = data.Rows || [];
                            for (var i = 0, len = rows.length; i < len; i++) {
                                var row = rows[i];
                                row.OLDROLEID = row.ROLEID;
                            }
                        }
                    },
                    rowAttrRender: function (rowdata, rowid) {
                        return "";
                    }
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "add":
                            me.add();
                            break;
                        case "modify":
                            me.modify();
                            break;
                        case "delete":
                            me.delete();
                            break;
                        case "save":
                            me.save();
                            break;
                        case "sumbit":
                            if (!me.isSelectRow() || !me.isAllUnaudited()) return;
                            $.ligerDialog.confirm("提交后不可修改，是否继续？", function (confirm) {
                                if (confirm) {
                                    me.submit();
                                }
                            });
                            break;
                        case "Excel":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=xls", window.gksybConfigs.urlBase), modal: true });
                            break;
                        case "Pdf":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=pdf", window.gksybConfigs.urlBase), modal: true });
                            break;
                    }
                }
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            isSelectRow: function () {
                var me = this;
                var rows = me.grid.getSelectedRows();
                if (!rows || rows.length === 0) {
                    LG.tip('请选择行!');
                    return false;
                }
                return true;
            },
            isSelectSingleRow: function () {
                var me = this;
                var rows = me.grid.getSelectedRows();
                if (!rows || rows.length === 0) {
                    LG.showError("请选择一行");
                    return false;
                }
                if (rows.length > 1) {
                    LG.showError("不能选择多行");
                    return false;
                }
                return true;
            },
            isAllAudited: function () {
                var me = this;
                var rows = me.grid.getSelectedRows();
                for (var i = 0; i < rows.length; i++) {
                    if (rows[i].AUDITING !== "1") {
                        LG.showError("选中数据有未提交记录");
                        return false;
                    }
                }
                return true;
            },
            isAllUnaudited: function () {
                var me = this;
                var rows = me.grid.getSelectedRows();
                for (var i = 0; i < rows.length; i++) {
                    if (rows[i].AUDITING === "1") {
                        LG.showError("该数据已提交，无法重复提交！");
                        return false;
                    }
                }
                return true;
            },
            openDetail: function (options) {
                var me = this;
                options = options || {};
                $.ligerDialog.open({
                    width: options.width || 1100,
                    height: 650,
                    allowClose: true,
                    title: options.title,
                    url: "device-vary-detail.html?MenuNo=" + me.menuNo + "&ver=" + me.ver,
                    isHidden: false,
                    showMax: false,
                    showToggle: false,
                    showMin: false,
                    isResize: true,
                    slide: false,
                    onClosed: me.reload.bind(me),
                    data: { sid: options.sid || null, isNew: !!options.isNew, isView: !!options.isView }
                });
            },
            add: function () { //新增
                var me = this;
                me.openDetail({ title: '[新增]', sid: null, isNew: true, isView: false, width: 1100 });
                //me.grid.addEditRow({}, true);
            },
            modify: function () { //修改
                var me = this;
                if (!me.isSelectSingleRow()) return;
                var selected = me.grid.getSelectedRows()[0];
                if (selected.AUDITING == "1") {
                    LG.tip('已提交，无法修改!');
                    return;
                }
                me.openDetail({ title: '[修改]', sid: selected.VARY_ID, isNew: false, isView: false, width: 1200 });
            },
            save: function () { //保存
                var me = this;
                if (me.grid.endEdit() != false) {
                    if (!me.grid.isDataChanged) {
                        LG.showSuccess('无修改');
                        return;
                    }
                    if (!me.grid.validChangeRows()) return false;
                    var changeRow = me.grid.getChangedRows();
                    LG.ajax({
                        jsToken: true,
                        url: 'Device/DeviceVary/save',
                        loading: '正在保存中...',
                        data: changeRow,
                        success: function () {
                            LG.showSuccess('保存成功');
                            me.grid.isDataChanged = false;
                            me.reload();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }

            },
            submit: function () { //提交
                var me = this;
                if (!me.isSelectRow() || !me.isAllUnaudited()) return;
                var selecteds = me.grid.getSelectedRows();
                var sids = [];
                for (var i = 0; i < selecteds.length; i++) {
                    sids.push(selecteds[i].VARY_ID);
                }
                LG.ajax({
                    jsToken: true,
                    url: 'Device/DeviceVary/Submit',
                    loading: '正在提交中...',
                    data: { sids: sids },
                    success: function () {
                        LG.showSuccess('提交成功');
                        me.grid.isDataChanged = false;
                        me.reload();
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            reload: function () { //刷新
                var me = this;
                me.buttons[0].click();
            },
            delete: function () { //删除
                var me = this;
                if (me.grid.endEdit() != false) {
                    var selected = me.grid.getSelectedRows();
                    if (selected.length > 0) {
                        for (var i = 0; i < selected.length; i++) {
                            if (selected[i].AUDITING == "1") {
                                LG.tip('已提交，无法删除!');
                                break;
                            }
                            else {
                                $.ligerDialog.confirm('确定删除吗?', function (confirm) {
                                    if (confirm) {
                                        for (var i = 0, len = (selected || []).length; i < len; i++) {
                                            me.grid.deleteRow(selected[i]);
                                        }
                                        me.save();
                                    }
                                }); break;
                            }
                        }
                    } else {
                        LG.tip('请选择行!');
                    }
                }
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Pdf',
                        text: '导出Pdf',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-pdf-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch = $("#formsearch")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    labelWidth: me.formLabelWidth,
                    inputWidth: me.formInputWidth,
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                    }
                });
            },
            init: function () {
                var me = this;
                me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.setGrid();
                me.reload();
                return me;
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>
</html>
