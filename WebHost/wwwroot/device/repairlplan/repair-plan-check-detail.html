<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title>明细</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%; overflow: auto;">
    <form id="mainform" style="width:97%;">
    </form>
    <div style="margin-bottom: 5px; width: 98%;" id="paramform">
    </div>
    <div style="width: 94.5%;" class="l-form">
        <div class="l-form-container">
            <div class="l-group" style="width: 100%;"><span>维修项目明细</span></div>
            <ul style="display: block; width: 100%;" id="ulGrid">
                <li style=" width: 100%;">
                    <div style="margin-bottom: 50px; width: 100%;" id="maingrid">
                    </div>
                </li>
            </ul>
        </div>
    </div>
    <script type="text/javascript">
        'use strict';
        var business = {
            dialogData: {},
            menuNo: getQueryStringByName("MenuNo"),
            isView: false,
            sid: getQueryStringByName("sid"),
            dataCorp: [],
            rootPath: "../",
            dialog: null,
            dialogData: null,
            callback: null,
            orginData: {},
            auditing: [{ "ID": "1", "TEXT": "已提交" }, { "ID": "0", "TEXT": "未提交" }],
            runStatus: [],
            maintdept: [],
            repairtype: [],
            shiplist: [],
            iscomplete: [{ "ID": "1", "TEXT": "是" }, { "ID": "0", "TEXT": "否" }],
            repairhandtype: [],
            repairhandtype1: [{ "ID": "自修", "TEXT": "自修" }, { "ID": "厂修", "TEXT": "厂修" }],
            stopSource: [],
            malType: [],
            deviceInfo: [],
            plan_state: [],
            start: null,
            setConfig: function () {
                var me = this;
                me.config = {
                    form: {
                        fields: [
                            { display: "记录状态", name: "AUDITING_D", newline: false, upper: true, type: "select", options: { data: me.auditing }, editor: { disabled: true }, group: "维修计划-设备信息" },
                            { display: "故障申报单号", name: "EXE_CODE", newline: false, upper: true, type: "text", editor: { disabled: true }, options: {} },
                            { display: "维修状态", name: "PLAN_STATE", newline: false, upper: true, type: "select", editor: { disabled: true }, options: { data: me.plan_state } },
                            { display: "船舶名称", name: "DEVICE_NAME", newline: true, upper: true, type: "text", editor: { disabled: true }, options: {} },
                            { display: "船舶编号", name: "DEVICE_NO", newline: false, upper: true, type: "text", editor: { disabled: true }, options: {} },
                            { display: "船舶型号", name: "DEVICE_TYPE", newline: false, upper: true, type: "text", editor: { disabled: true }, options: {} },
                            { display: "资产编号", name: "ASSET_CODE", newline: true, upper: true, type: "text", editor: { disabled: true }, options: {} },
                            { display: "使用部门", name: "DEPT_NAME", newline: false, upper: true, type: "text", editor: { disabled: true }, options: {} },
                            { display: "维保部门", name: "WSEC_DEPT", newline: false, upper: true, type: "select", editor: { disabled: true }, options: { data: me.maintdept } },
                            { display: "维修类型", name: "MAINT_TYPE", newline: true, upper: true, type: "select", editor: { disabled: true }, options: { data: me.repairtype } },
                            { display: "维修处理方式", name: "DEAL_TYPE", newline: false, upper: true, type: "select", editor: { disabled: true }, options: { data: me.repairhandtype } },
                            { display: "安装地点", name: "INSTALL_SITE", newline: true, width: 880, upper: true, type: "text", editor: { disabled: true }, options: {} },
                            { display: "故障现象描述", name: "FAULT_DESCRIBE", newline: true, width: 880, upper: true, type: "textarea", editor: { disabled: true }, options: { rows: "2" } },
                            { display: "备注", name: "PLAN_MEMO", newline: true, width: 880, upper: true, type: "textarea", editor: { disabled: true }, options: { rows: "2" } },
                            { display: "计划开工时间", name: "PLAN_START_DATE", newline: true, upper: true, type: "date", editor: { disabled: true }, options: {} },
                            { display: "计划完工时间", name: "PLAN_END_DATE", newline: false, upper: true, type: "date", editor: { disabled: true }, options: {} },
                            { display: "负责人", name: "CHARGE_USER", newline: true, upper: true, type: "text", editor: { disabled: true }, options: {} },
                            { display: "采购方式", name: "COLLECT_METHOD", newline: false, upper: true, type: "text", editor: { disabled: true }, options: {} },
                            { display: "预估维修金额", name: "PLAN_MONEY", newline: false, upper: true, type: "text", editor: { disabled: true }, options: {} },
                            { display: "维修内容", name: "REPAIR_MEMO", newline: true, upper: true, type: "text", editor: { disabled: true }, options: {} },
                            { display: "实际开工时间", name: "ACT_START_DATE", newline: true, upper: true, type: "date", editor: { disabled: true }, options: {}, group: "维修实施" },
                            { display: "实际完工时间", name: "ACT_END_DATE", newline: false, upper: true, type: "date", editor: { disabled: true }, options: {} },
                            { display: "维修工时", name: "ACT_STOP_TIME", newline: false, upper: true, type: "text", options: {}, editor: { disabled: true } },
                            { display: "实施人", name: "EXE_USER", newline: true, upper: true, type: "text", options: {}, editor: { disabled: true } },
                            { display: "实施提交日期", name: "EIDT_DATE", newline: false, upper: true, type: "text", options: {}, editor: { disabled: true } },
                            { display: "是否有遗留问题", name: "IS_LEAVE", newline: false, upper: true, type: "text", options: {}, editor: { disabled: true } },
                            { display: "协助人", name: "ASSIST_USER", newline: true, upper: true, type: "text", options: {}, editor: { disabled: true } },
                            { display: "遗留问题描述", name: "LEAVE_MEMO", newline: true, width: 880, upper: true, type: "textarea", options: { rows: "2" }, editor: { disabled: true } },
                            { display: "实施情况登记", name: "EXE_DESC", newline: true, width: 880, upper: true, type: "textarea", options: { rows: "2" }, editor: { disabled: true } },
                            { display: "验收人", name: "CHECK_USER", newline: true, upper: true, type: "text", options: {}, editor: { disabled: true }, group: "维修验收" },
                            { display: "验收时间", name: "CHECK_DATE", newline: false, upper: true, type: "date", validate: { required: true }, options: {} },
                            { display: "验收情况", name: "CHECK_DESC", newline: true, width: 880, upper: true, type: "textarea", options: { rows: "2" } },
                            { display: "备注", name: "CHECK_MEMO", newline: true, width: 880, upper: true, type: "textarea", options: { rows: "2" }},
                        ]
                    },
                    grid: {
                        columns: [
                            {
                                display: "是否完成", name: "IS_COMPLETE", width: 150, type: "select", editor: { type: 'select', data: me.iscomplete, selectBoxHeight: 100 }, validate: { required: true }
                            },
                            { display: "维修项目", name: "DEVICE_NAME", width: 150, type: "text", },
                            { display: "序号", name: "REP_INDEX", width: 150, type: "text", },
                            { display: "维修内容", name: "REP_CONTENT", width: 150, type: "text", },
                            { display: "维修项目分类", name: "ITEM_TYPE", width: 150, type: "text", },
                            { display: "维修处理方式", name: "DEAL_TYPE", width: 150, type: "select", editor: { type: 'select', data: me.repairhandtype, selectBoxHeight: 100 } },
                            { display: "检修负责人", name: "STOCK_NAME", type: "text", width: 80 },
                            {
                                display: "实际开工时间", name: "BEGIN_TIME", width: 120, type: "date" 
                            },
                            {
                                display: "实际完工时间", name: "END_TIME", width: 100, type: "date" 
                            },
                            { display: "花费时间", name: "TAKE_TIME", width: 100, type: "text" },
                            { display: "备注", name: "MEMO", width: 100, type: "text" },
                        ]
                    }
                };
            },
            mainform: null,
            buttons: null,
            grid:null,
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'Repair/RepairPlan/ComboxData',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        me.maintdept = data.MaintDept;
                        me.repairtype = data.RepairType;
                        me.repairhandtype = data.RepairDealType;
                        me.plan_state = data.PlanState;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
                LG.ajax({
                    async: false,
                    url: 'Repair/RepairPlan/ShipList',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        me.shiplist = data;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            loadData: function () {
                var me = this;
                if (!me.sid) {
                    me.mainform.setOrginData({ AUDITING: "0" });
                }
                else {
                    LG.ajax({
                        async: false,
                        url: 'Repair/RepairPlan/GetExeDetail',
                        loading: '正在获取中...',
                        data: { id: me.sid },
                        success: function (data, message) {
                            me.mainform.setOrginData(data[0]);
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                    if (me.isView) {
                        me.mainform.setReadonly(true);
                    }
                }
                me.mainform.focus();
            },
            save: function () { //保存
                var me = this;
                if ($.isEmptyObject(me.mainform.getChanges())) {
                    LG.showSuccess('无修改');
                    return;
                }
                if (!me.mainform.valid()) {
                    me.mainform.showInvalid();
                    return;
                }
                function handle(data) {
                    return data;
                }
                var data = handle(me.mainform.getData());
                var original = handle(me.mainform.getOrginData());
                var changeRow = new Object();
                if (!me.sid) {
                    changeRow["added"] = [data];
                }
                else {
                    changeRow["updated"] = [data];
                    changeRow["original"] = [original];
                }
                var changeRowDet = me.grid.getChangedRows();
                LG.ajax({
                    jsToken: true,
                    url: 'Repair/RepairPlan/SaveExe',
                    loading: '正在保存中...',
                    data: { request: changeRow, requestdet: changeRowDet },
                    success: function () {
                        LG.showSuccess('保存成功', function () { if (me.dialog) { me.dialog.close(); } });
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            close: function (skipConfirm) {
                var me = this;
                function inner(callback) {
                    if (!skipConfirm && !$.isEmptyObject(me.mainform.getChanges())) {
                        $.ligerDialog.confirm($.ligerDefaults.GridString.isContinueByDataChanged, function (confirm) {
                            if (confirm) {
                                if (callback) callback(2);
                            }
                            else {
                                if (callback) callback(0);
                            }
                        });
                        if (callback) return callback(-1);
                        return false;
                    }
                    if (callback) return callback(1);
                    return true;
                }
                inner(function (status) {
                    if (status > 0) {
                        if (me.dialog) {
                            me.dialog.close();
                            return;
                        }
                        var win = parent || window;
                        if (win.closeCurrentTab) win.closeCurrentTab();
                        else win.close();
                    }
                });
            },
            setFormDefaultBtn: function () {
                var me = this;
                //表单底部按钮
                var buttons = [];
                if (!me.isView) {
                    buttons.push({
                        text: '重置', onclick: function () {
                            $.ligerDialog.confirm("确定重置数据吗?", function (confirm) {
                                if (confirm) {
                                    location.reload(true);
                                }
                            });
                        }
                    });
                }
                buttons.push({ text: '关闭', onclick: me.close.bind(me) });
                if (!me.isView) buttons.push({ text: '保存', onclick: me.save.bind(me) });
                LG.addFormButtons(buttons);
                me.formButtons = buttons;
            },
            setForm: function () {
                var me = this;
                me.config.form.fields.removeNull();
                var $mainform = $("#mainform")
                //搜索表单应用ligerui样式
                me.mainform = $mainform.ligerForm({
                    EnterMoveNextControl: true,
                    labelAlign: 'right',
                    space: 3,
                    validate: true,
                    fields: me.config.form.fields,
                    labelWidth: 120,
                    onAfterSetFields: function (g) {
                        me.mainform = g;
                        me.buttons = g.options.buttons;
                    }
                });
                me.setFormDefaultBtn();
            },
            grid: null,
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    dateFormat: "yyyy-MM-dd hh:mm",
                    autoWidth: true,
                    usePager: true,
                    columns: me.config.grid.columns,
                    dataAction: 'server',
                    toolbar: {},
                    url: 'Repair/RepairPlan/ExeItemList',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: [{ field: 'EXE_ID', op: 'equal', value: me.sid }]
                        })
                    },
                    //sortName: 'MODIFY_DATE',
                    //sortOrder: 'desc',
                    width: '99%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: true,
                    clickToEdit: true,
                    onBeforeEdit: function (editParm) {
                        switch (editParm.column.name) {
                            case "":
                                if (editParm.record.__status == "add") return true;
                                else return false;
                                break;
                        }
                    },
                    onSuccess: function (data, g) {
                        //me.iframeloading.hide();
                    }
                });
                me.grid.isValid = true;
                if (!me.isView) {
                    me.loadToolbar();
                }
            },
            init: function () {
                var me = this;
                if (frameElement && frameElement.dialog) {
                    me.dialog = frameElement.dialog;
                    me.dialogData = me.dialog.get('data') || {};
                    if (me.dialogData.callback) me.callback = me.dialogData.callback;
                    if (me.dialogData.sid) me.sid = me.dialogData.sid;
                    if (me.dialogData.isView) me.isView = me.dialogData.isView;
                }
                me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.loadData();
                me.setGrid();

                if (me.dialogData.isView != undefined) {
                    const commonGridOptions = {
                        enabledEdit: false,
                    };
                    me.grid.setOptions(commonGridOptions);
                }
                return me;
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>

</html>
