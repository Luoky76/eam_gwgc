<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">

<body style="padding: 5px; height: 100%; overflow: auto;">
    <form id="mainform" style="width:97%;">
    </form>
    <div style="margin-bottom: 5px; width: 98%;" id="paramform">
    </div>
    <div style="width: 94.5%;" class="l-form">
        <div class="l-form-container">
            <div class="l-group" style="width: 100%;"><span>维修项目明细</span></div>
            <ul style="display: block; width: 100%;" id="ulGrid">
                <li style=" width: 100%;">
                    <div style="margin-bottom: 50px; width: 100%;" id="maingrid">
                    </div>
                </li>
            </ul>
        </div>
    </div>
    <script type="text/javascript">
        'use strict';
        var tableName;
        var dataId;
        var isView;
        var fileMark;
        var business = {
            formLabelWidth: 120,
            formInputWidth: 180,
            getTextareaWidth: function () {
                var me = this;
                var fieldWidth = me.formLabelWidth + me.formInputWidth + 3;
                return Math.floor(($("#mainform").width() - 10) / fieldWidth) * fieldWidth - (me.formLabelWidth + 3);
            },
            dialogData: {},
            menuNo: getQueryStringByName("MenuNo"),
            isView: false,
            sid: getQueryStringByName("sid"),
            dataCorp: [],
            rootPath: "../",
            dialog: null,
            dialogData: null,
            callback: null,
            orginData: {},
            auditing: [{ "ID": "1", "TEXT": "已提交" }, { "ID": "0", "TEXT": "未提交" }],
            runStatus: [],
            MaintDept: [],
            RepairType: [],
            shiplist: [],
            iscomplete: [{ "ID": "1", "TEXT": "是" }, { "ID": "0", "TEXT": "否" }],
            RepairDealType: [],
            repairhandtype1: [{ "ID": "自修", "TEXT": "自修" }, { "ID": "厂修", "TEXT": "厂修" }],
            stopSource: [],
            malType: [],
            PlanState: [],
            RepitemType: [],
            deviceInfo: [],
            start: null,
            setConfig: function () {
                var me = this;
                me.config = {
                    form: {
                        fields: [
                            { display: "记录状态", name: "AUDITING_C", newline: false, type: "select", options: { type: "select", disabled: true, data: me.auditing },  group: "维修计划-设备信息" },
                            { display: "故障申报单号", name: "EXE_CODE", newline: false, type: "text",  options: { disabled: true } },
                            { display: "维修状态", name: "PLAN_STATE", newline: false, type: "select",  options: { type: "select", disabled: true, data: me.PlanState } },
                            { display: "船舶名称", name: "DEVICE_NAME", newline: true, type: "text",  options: { disabled: true } },
                            { display: "维保部门", name: "WSEC_DEPT", newline: false, type: "select",  options: { type: "select", disabled: true, data: me.MaintDept } },
                            { display: "维修类型", name: "MAINT_TYPE", newline: false, type: "select",  options: { type: "select", disabled: true, data: me.RepairType } },
                            { display: "维修处理方式", name: "DEAL_TYPE", newline: false, type: "select",  options: { type: "select", disabled: true, data: me.RepairDealType } },
                            { display: "故障现象描述", name: "FAULT_DESCRIBE", newline: true, width: me.getTextareaWidth(), type: "textarea",  options: { disabled: true, rows: "2" } },
                            { display: "备注", name: "PLAN_MEMO", newline: true, width: me.getTextareaWidth(), type: "textarea",  options: { disabled: true, rows: "2" } },
                            { display: "计划开工时间", name: "PLAN_START_DATE", newline: true, type: "date",  options: { disabled: true, format: 'yyyy-MM-dd HH:mm' } },
                            { display: "计划完工时间", name: "PLAN_END_DATE", newline: false, type: "date",  options: { disabled: true, format: 'yyyy-MM-dd HH:mm' } },
                            { display: "计划停机时间(H)", name: "PLAN_STOP_TIME", newline: false, type: "text",  options: { disabled: true } },
                            { display: "负责人", name: "CHARGE_USER", newline: true, type: "text",  options: { disabled: true } },
                            { display: "采购方式", name: "COLLECT_METHOD", newline: false, type: "text",  options: { disabled: true } },
                            { display: "预估维修金额", name: "PLAN_MONEY", newline: false, type: "text",  options: { disabled: true } },
                            { display: "维修内容", name: "REPAIR_MEMO", newline: true, width: me.getTextareaWidth(), type: "textarea",  options: { disabled: true, rows: "2" } },
                            {
                                display: "实际开工时间", name: "ACT_START_DATE", newline: true, type: "date", validate: { required: true }, options: {
                                    format: 'yyyy-MM-dd HH:mm',
                                    onChangeValue: function (input, value, g) {
                                        me.updateWorkHours(value, $('#ACT_END_DATE').val());
                                    }
                                }, group: "维修实施"
                            },
                            {
                                display: "实际完工时间", name: "ACT_END_DATE", newline: false, type: "date", validate: { required: true }, options: {
                                    format: 'yyyy-MM-dd HH:mm',
                                    onChangeValue: function (input, value, g) {
                                        me.updateWorkHours($('#ACT_START_DATE').val(), value);
                                    }
                                }
                            },
                            { display: "维修工时(H)", name: "ACT_STOP_TIME", newline: false, type: "float", options: { disabled: true } },
                            { display: "维修金额", name: "ACT_MONEY", newline: true, type: "float", options: {} },
                            { display: "实施人", name: "EXE_USER", newline: false, type: "text", options: { disabled: true } },
                            { display: "是否有遗留问题", name: "IS_LEAVE", newline: false, type: "select", options: { type: "select", data: me.iscomplete } },
                            { display: "协助人", name: "ASSIST_USER", newline: true, type: "text", options: {} },
                            { display: "遗留问题描述", name: "LEAVE_MEMO", newline: true, width: me.getTextareaWidth(), type: "textarea", options: { rows: "2" } },
                            { display: "实施情况登记", name: "EXE_DESC", newline: true, width: me.getTextareaWidth(), type: "textarea", options: { rows: "2" } },
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "序号", name: "REP_INDEX", width: 150, type: "text", editor: { type: 'text' } },
                            {
                                display: "是否完成", name: "IS_COMPLETE", width: 150, type: "select", editor: { type: 'select', data: me.iscomplete, selectBoxHeight: 100 }, validate: { required: true }
                            },
                            { display: "设备编号", name: "DEVICE_NO", width: 150, type: "text", },
                            //{ display: "设备名称", name: "DEVICE_NAME", width: 150, type: "text", editor: { type: 'text' } },
                            { display: "设备规格", name: "DEVICE_SIZE", width: 150, type: "text" },
                            { display: "设备型号", name: "DEVICE_TYPE", width: 150, type: "text" },
                            { display: "设备名称", name: "DEVICE_NAME", width: 150, type: "text", },
                            {
                                display: "设备数量", name: "DEVICE_NUM", width: 150, type: "float", editor: {
                                    type: 'float',
                                    onChange: function (rowdata, rowIndex) {
                                        if (rowdata.value < 0) {
                                            LG.showError("数量不可为负数！");
                                        }
                                    }
                                },
                            },
                            { display: "维修内容", name: "REP_CONTENT", width: 150, type: "text", editor: { type: 'text' } },
                            { display: "维修项目分类", name: "ITEM_TYPE", width: 100, type: "select", editor: { type: 'select', data: me.RepitemType, selectBoxHeight: 100 } },
                            {
                                display: "是否月度询价", name: "IS_ASKBID", width: 150, type: "select", editor: { type: 'select', data: me.iscomplete, selectBoxHeight: 100 },
                            },
                            { display: "维修处理方式", name: "DEAL_TYPE", width: 150, type: "select", editor: { type: 'select', data: me.RepairDealType, selectBoxHeight: 100 }, validate: { required: true } },
                            { display: "检修负责人", name: "STOCK_NAME", type: "text", width: 80, editor: { type: 'text' }, },

                            {
                                display: "实际开工时间", name: "BEGIN_TIME", minWidth: 100, validate: { required: true }, type: "date",
                                editor: {
                                    type: 'date', showTime: true,
                                    format: "yyyy-MM-dd hh:mm",
                                    onChange: function (rowdata, rowIndex) {
                                        me.btime = rowdata.value
                                        if (me.etime == null) {
                                            LG.showError("请选实际完工时间！");
                                        }
                                        else {
                                            if (me.etime < me.btime) {
                                                LG.showError("开始时间不可大于实际完工时间！");
                                            }
                                            else {
                                                var date1 = new Date(me.btime);
                                                var date2 = new Date(me.etime);
                                                // 计算时间差值（单位为毫秒）
                                                var timeDiff = date2.getTime() - date1.getTime();
                                                // 将时间差值转换为小时数
                                                var minutesDiff = Math.round(timeDiff / 1000 / 60 / 60).toFixed(2);
                                                liger.get("maingrid").updateCell("TAKE_TIME", minutesDiff, rowdata.record);
                                            }
                                        }
                                    },
                                }
                            },
                            {
                                display: "实际完工时间", name: "END_TIME", minWidth: 100, validate: { required: true }, type: "date",
                                editor: {
                                    type: 'date',
                                    showTime: true, format: "yyyy-MM-dd hh:mm",
                                    onChange: function (rowdata, rowIndex) {
                                        me.etime = rowdata.value
                                        if (me.btime == null) {
                                            LG.showError("请选开始时间！");
                                        }
                                        else {
                                            if (me.etime < me.btime) {
                                                LG.showError("实际完工时间不小于开始时间！");
                                            }
                                            else {
                                                var date1 = new Date(me.btime);
                                                var date2 = new Date(me.etime);
                                                // 计算时间差值（单位为毫秒）
                                                var timeDiff = date2.getTime() - date1.getTime();
                                                // 将时间差值转换为小时数
                                                var minutesDiff = Math.round(timeDiff / 1000 / 60 / 60 ).toFixed(2);
                                                liger.get("maingrid").updateCell("TAKE_TIME", minutesDiff, rowdata.record);

                                            }
                                        }
                                    },
                                }
                            },
                            { display: "花费时间(H)", name: "TAKE_TIME", width: 100, type: "text" },
                            { display: "备注", name: "MEMO", minWidth: 300, type: "text", editor: { type: 'text' } },
                            { display: "维修部位ID", name: "DEVICE_ID", width: 100, type: "text", editor: { type: 'text' }, hide: true },
                            { display: "EXE_ITEM_ID", name: "EXE_ITEM_ID", width: 100, type: "text", editor: { type: 'text' }, hide: true },
                        ]
                    }
                };
            },
            mainform: null,
            buttons: null,
            grid: null,
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'Repair/RepairPlan/ComboxData',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        me.MaintDept = data.MaintDept;
                        me.RepairType = data.RepairType;
                        me.RepitemType = data.RepitemType;
                        me.RepairDealType = data.RepairDealType;
                        me.PlanState = data.PlanState;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
                LG.ajax({
                    async: false,
                    url: 'Repair/RepairPlan/ShipList',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        me.shiplist = data;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            updateWorkHours: function (startDate, completeDate) {
                var start = new Date(startDate);
                var complete = new Date(completeDate);

                if (start >= complete) {
                    $('#ACT_START_DATE').val("");
                    $('#ACT_END_DATE').val("");
                    LG.showError("开始时间不能大于实际完工时间！");
                    return;
                }
                var timeDiff = complete - start;
                var minutesDiff = Math.round(timeDiff / 1000 / 60 / 60).toFixed(2);
                $('#ACT_STOP_TIME').val(minutesDiff);
            },
            loadData: function () {
                var me = this;
                function inner() {
                    var data = me.mainform.getData();
                    LG.getFormCombChanges(data, me.orginData, true);
                    delete me.orginData;
                    me.orginData = data;
                }
                if (me.isNew) {
                    var originData = {};
                    LG.ajax({
                        async: false,
                        url: 'Common/General/CreatePrimaryKey',
                        loading: '正在获取中...',
                        success: function (data, message) {
                            me.sid = data;
                            originData.EXE_ID = data;
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                    $.extend(originData, {
                        AUDITING_C: "0",
                    });
                    me.mainform.setOrginData(originData);
                    inner();
                }
                else {
                    LG.ajax({
                        async: false,
                        url: 'Repair/RepairPlan/GetExeDetail',
                        loading: '正在获取中...',
                        data: { id: me.sid },
                        success: function (data, message) {
                            me.mainform.setOrginData(data);
                            inner();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }
                me.mainform.focus();
            },
            save: function () { //保存
                var me = this;
                var flag = true;
                var formEdit = false, gridEdit = false;
                if ($.isEmptyObject(me.mainform.getChanges())) {
                    formEdit = false;
                }
                else formEdit = true;
                if (!me.mainform.valid()) {
                    me.mainform.showInvalid();
                    return;
                }
                if (me.grid.endEdit() != false) {
                    if (!me.grid.isDataChanged) {
                        gridEdit = false;
                    }
                    else gridEdit = true;
                }
                if (!me.grid.validChangeRows()) return false;
                function handle(data) {
                    return data;
                }

                if (formEdit || gridEdit) {
                    var data = handle(me.mainform.getData());
                    var original = handle(me.mainform.getOrginData());
                    var changeRow = new Object();
                    if (me.isNew) {
                        changeRow["added"] = [data];
                    }
                    else {
                        changeRow["updated"] = [data];
                        changeRow["original"] = [original];
                    }
                    var changeRowDet = me.grid.getChangedRows();
                    for (var i = 0; i < changeRowDet.updated.length; i++) {
                        var row = changeRowDet.updated[i];
                        if (row.DEVICE_NUM < 0) {
                            flag = false;
                            LG.showSuccess('数量不可为负数！');
                            break;
                        }
                    }
                    if (flag) {
                        LG.ajax({
                            jsToken: true,
                            url: 'Repair/RepairPlan/SaveExe',
                            loading: '正在保存中...',
                            data: { request: changeRow, requestdet: changeRowDet },
                            success: function () {
                                LG.showSuccess('保存成功');
                                me.isNew = false;
                                me.loadData();
                                me.grid.isDataChanged = false;
                                me.grid.loadData();
                            },
                            error: function (message) {
                                LG.showError(message);
                            }
                        });
                    }
                }
                else { LG.showSuccess('无修改'); }
            },
            close: function () {
                var me = this;
                function inner(callback) {
                    var data = me.mainform.getData();
                    var updateFields = LG.getFormCombChanges(data, me.orginData, true);
                    var isChangedGrid = me.grid.getChangedRows();
                    if (updateFields || isChangedGrid.updated.length > 0 || isChangedGrid.added.length > 0) {
                        $.ligerDialog.confirm($.ligerDefaults.GridString.isContinueByDataChanged, function (confirm) {
                            if (confirm) {
                                if (callback) callback(2);
                            }
                            else {
                                if (callback) callback(0);
                            }
                        });
                        if (callback) return callback(-1);
                        return false;
                    }
                    if (callback) return callback(1);
                    return true;
                }
                inner(function (status) {
                    if (status > 0) {
                        if (me.dialog) me.dialog.close();
                        if (me.callback) me.callback(false);
                    }
                });
            },
            setFormDefaultBtn: function () {
                var me = this;
                //表单底部按钮
                var buttons = [];
                if (!me.isView) {
                    buttons.push({
                        text: '重置', onclick: function () {
                            $.ligerDialog.confirm("确定重置数据吗?", function (confirm) {
                                if (confirm) {
                                    location.reload(true);
                                }
                            });
                        }
                    });
                }
                buttons.push({ text: '关闭', onclick: me.close.bind(me) });
                if (!me.isView) buttons.push({ text: '保存', onclick: me.save.bind(me) });
                LG.addFormButtons(buttons);
                me.formButtons = buttons;
            },
            setForm: function () {
                var me = this;
                me.config.form.fields.removeNull();
                var $mainform = $("#mainform")
                //搜索表单应用ligerui样式
                me.mainform = $mainform.ligerForm({
                    labelWidth: me.formLabelWidth,
                    inputWidth: me.formInputWidth,
                    EnterMoveNextControl: true,
                    labelAlign: 'right',
                    space: 3,
                    validate: true,
                    fields: me.config.form.fields,
                    readonly: me.isView,
                    onAfterSetFields: function (g) {
                        me.mainform = g;
                        me.buttons = g.options.buttons;
                    }
                });
                me.setFormDefaultBtn();
            },
            grid: null,
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    dateFormat: "yyyy-MM-dd hh:mm",
                    autoWidth: true,
                    usePager: true,
                    columns: me.config.grid.columns,
                    dataAction: 'server',
                    toolbar: { group: 'item' },
                    url: 'Repair/RepairPlan/ExeItemList',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: [{ field: 'EXE_ID', op: 'equal', value: me.sid }]
                        })
                    },
                    width: '99%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: !me.isView,
                    clickToEdit: true,
                    onBeforeEdit: function (editParm) {

                    },
                    onSuccess: function (data, g) {

                    }
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "add":
                            me.add();
                            break;
                        case "import":
                            me.import();
                            break;
                        case "upload":
                            me.upload();
                            break;
                        case "delete":
                            me.delete();
                            break;
                        case "Excel":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=xls", window.gksybConfigs.urlBase), modal: true });
                            break;
                        case "Pdf":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=pdf", window.gksybConfigs.urlBase), modal: true });
                            break;
                    }
                }
                if (!me.isView) {
                    LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
                }
            },
            //新增
            add: function () {
                var me = this;
                me.grid.addEditRow({ "EXE_ID": $('#EXE_ID').val(), DEAL_TYPE: $('#DEAL_TYPE').val() });
                me.grid._applyEditor.ligerDefer(me.grid, 200, [me.grid.getCellObj(0, 2)]);
            },
            import: function () { //新增
                var me = this;

                var me = this;
                var gridData = me.grid.getData();
                var gridKeys = [];
                for (var item of gridData) {
                    gridKeys.push(item.DEVICE_ID);
                }

                var dataOptions = {
                    values: gridKeys,
                    options: {
                        url: 'Repair/RepairPlan/GetDevice',
                        rowKey: "DEVICE_ID",
                        columns: [
                            { display: "DEVICE_ID", name: "DEVICE_ID", width: 100, type: "text", hide: true },
                            { display: "设备编号", name: "DEVICE_NO", width: 100, type: "text", editor: { type: 'text' } },
                            { display: "设备名称", name: "DEVICE_NAME", width: 100, type: "text", editor: { type: 'text' } },
                            { display: "设备类别", name: "TYPE_NAME", width: 100, type: "text", editor: { type: 'text' } },
                            { display: "设备型号", name: "DEVICE_TYPE", width: 100, type: "text", editor: { type: 'text' } },
                            { display: "设备规格", name: "DEVICE_SIZE", width: 100, type: "text", editor: { type: 'text' } },

                        ]
                    },
                    fields: [
                        { display: "设备编号", name: "_search_DEVICE_NO", dbname: "DEVICE_NO", newline: false, type: "text", options: {} },
                        { display: "设备名称", name: "_search_DEVICE_NAME", dbname: "DEVICE_NAME", newline: false, type: "text", options: {} }
                    ],
                    callback: function (values, rows) {
                        var currentSet = new Set(gridKeys);
                        for (let item of rows) {
                            if (!currentSet.has(item.DEVICE_ID)) {
                                me.grid.addEditRow({
                                    EXE_ID: me.sid,
                                    DEAL_TYPE: $("#DEAL_TYPE").val(),
                                    DEVICE_NO: item.DEVICE_NO,
                                    DEVICE_TYPE: item.DEVICE_TYPE,
                                    DEVICE_SIZE: item.DEVICE_SIZE,
                                    DEVICE_ID: item.DEVICE_ID,
                                    DEVICE_NAME: item.DEVICE_NAME
                                });
                            }
                        }
                    }
                }
                $.ligerDialog.open({
                    width: 1000,
                    height: 400,
                    title: '选择设备',
                    url: window.gksybConfigs.urlBase + "popup-select/common.html",
                    isResize: true,
                    slide: false,
                    data: dataOptions
                });

            },
            upload: function () {
                var me = this;
                if (me.grid.endEdit() != false) {
                    var selected = me.grid.getSelectedRows();
                    if (selected.length == 1) {
                        if (selected[0].EXE_ITEM_ID != undefined) {
                            me.f_rowAttachManage(selected[0].EXE_ITEM_ID);
                        } else {
                            LG.showError("请先保存该记录再上传！");
                        }
                    }
                    else {
                        LG.tip('请选择一项记录!');
                    }
                }
            },

            //附件管理
            f_rowAttachManage: function (dataid) {
                var me = this;
                isView = false;
                dataId = dataid;
                fileMark = 0;
                tableName = "REP_PLAN_EXE_ITEM"; // 表名
                $.ligerDialog.open({
                    width: 960,
                    height: 540,
                    allowClose: true,
                    isHidden: false,
                    //data: { "tableName": tableName, "dataId": dataid, "isView": isView },
                    url: '../../filemanager/file-attachment-content.html',
                    title: '附件管理',
                    onClose: function () {
                        me.loadData();
                    }
                });
            },
            delete: function () { //删除
                var me = this;
                if (me.grid.endEdit() != false) {
                    me.grid.deleteSelectedRow();
                    me.save();
                }
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Pdf',
                        text: '导出Pdf',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-pdf-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            init: function () {
                var me = this;
                if (frameElement && frameElement.dialog) {
                    me.dialog = frameElement.dialog;
                    me.dialogData = me.dialog.get('data') || {};
                    if (me.dialogData.callback) me.callback = me.dialogData.callback;
                    if (me.dialogData.sid) me.sid = me.dialogData.sid;
                    if (me.dialogData.hasOwnProperty('isView')) me.isView = me.dialogData.isView;
                    if (me.dialogData.hasOwnProperty('isNew')) me.isNew = me.dialogData.isNew;
                }
                me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.loadData();
                me.setGrid();
                return me;
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>

</html>
