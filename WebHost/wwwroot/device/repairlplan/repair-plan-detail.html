<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title>明细</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <form id="mainform">
    </form>
    <script type="text/javascript">
        'use strict';
        var business = {
            dialogData: {},
            menuNo: getQueryStringByName("MenuNo"),
            isView: false,
            sid: getQueryStringByName("sid"),
            dataCorp: [],
            rootPath: "../",
            dialog: null,
            dialogData: null,
            callback: null,
            orginData: {},
            auditing: [{ "ID": "1", "TEXT": "已提交" }, { "ID": "0", "TEXT": "未提交" }],
            runStatus: [],
            maintdept: [],
            repairtype: [],
            plan_state: [],
            shiplist:[],
            repairhandtype: [],
            stopSource: [],
            malType: [],
            deviceInfo: [],
            start: null,
            setConfig: function () {
                var me = this;
                me.config = {
                    form: {
                        fields: [
                            { display: "记录状态", name: "AUDITING", newline: false, upper: true, type: "select", options: { data: me.auditing }, editor: { disabled: true }, group: "维修计划-设备信息" },
                            { display: "计划单号", name: "PLAN_CODE", newline: false, upper: true, type: "text", editor: { disabled: true }, options: {} },
                            { display: "维修状态", name: "PLAN_STATE", newline: false, upper: true, type: "select", editor: { disabled: true }, options: { data: me.plan_state } },
                            {
                                display: "船舶名称", name: "DEVICE_ID", newline: true, upper: true, type: "select", options: {
                                    data: me.shiplist,
                                    autocomplete: true,
                                    selectBoxWidth: 400,
                                    valueField: "DEVICE_ID",
                                    textField: "DEVICE_NAME",
                                    columns: [
                                        { header: "船舶名称", name: "DEVICE_NAME", width: 100 },
                                        { header: "设备编号", name: "DEVICE_NO", width: 100 },
                                        { header: "使用部门", name: "DEPT_NAME", width: 100 }
                                    ],
                                    onChangeValue: function (input, value, g) {
                                        if (g.selected != undefined) {
                                            
                                            $("#DEVICE_ID").val(g.selected.DEVICE_ID);
                                            $("#DEVICE_NAME").val(g.selected.DEVICE_NAME);
                                            $("#DEVICE_NO").val(g.selected.DEVICE_NO);
                                            $("#DEPT_NAME").val(g.selected.DEPT_NAME);
                                            $("#DEPT_ID").val(g.selected.DEPT_ID);
                                            $("#ASSET_CODE").val(g.selected.ASSET_CODE);
                                            $("#DEVICE_TYPE").val(g.selected.DEVICE_TYPE);
                                        }
                                    }
                                }
                            },
                            { display: "船舶编号", name: "DEVICE_NO", newline: false, upper: true, type: "text", editor: { disabled: true }, options: {} },
                            { display: "船舶型号", name: "DEVICE_TYPE", newline: false, upper: true, type: "text", editor: { disabled: true }, options: {} },
                            { display: "资产编号", name: "ASSET_CODE", newline: true, upper: true, type: "text", editor: { disabled: true }, options: {} },
                            { display: "使用部门", name: "DEPT_NAME", newline: false, upper: true, type: "text", editor: { disabled: true }, options: {} },
                            { display: "DEPT_ID", name: "DEPT_ID", newline: false, upper: true, type: "hidden", editor: { disabled: true }, options: {} },
                            { display: "维保部门", name: "WSEC_DEPT", newline: false, upper: true, type: "select", options: { data: me.maintdept } },
                            { display: "维修类型", name: "MAINT_TYPE", newline: true, upper: true, type: "select", options: { data: me.repairtype } },
                            { display: "维修处理方式", name: "DEAL_TYPE", newline: false, upper: true, type: "select", options: { data: me.repairhandtype } },
                            { display: "安装地点", name: "INSTALL_SITE", newline: true, width: 880, upper: true, type: "text", options: {} },
                            { display: "故障现象描述", name: "FAULT_DESCRIBE", newline: true, width: 880, upper: true, type: "textarea", options: { rows: "2" } },
                            { display: "备注", name: "PLAN_MEMO", newline: true, width: 880, upper: true, type: "textarea", options: { rows: "2" } },
                            {
                                display: "计划开工时间", name: "PLAN_START_DATE", newline: true, upper: true, type: "date", validate: { required: true }, options: {
                                    format: 'yyyy-MM-dd HH:mm',
                                    onChangeValue: function (input, value, g) {
                                        me.updateWorkHours(value, $('#PLAN_END_DATE').val());
                                    },
                                }, group: "维修计划-指导确认信息"
                            },
                            {
                                display: "计划完工时间", name: "PLAN_END_DATE", newline: false, upper: true, type: "date", validate: { required: true }, options: {
                                    format: 'yyyy-MM-dd HH:mm',
                                    onChangeValue: function (input, value, g) {
                                        me.updateWorkHours($('#PLAN_START_DATE').val(), value);
                                    },
                                }
                            },
                            { display: "计划停机时长(H)", name: "PLAN_STOP_TIME", newline: false, upper: true, type: "text", options: {}, editor: { disabled: true } },
                            { display: "负责人", name: "CHARGE_USER", newline: true, upper: true, type: "text", options: {} },
                            { display: "采购方式", name: "COLLECT_METHOD", newline: false, upper: true, type: "text", options: {} },
                            { display: "预估维修金额", name: "PLAN_MONEY", newline: false, upper: true, type: "float", options: {} },
                            { display: "维修内容", name: "REPAIR_MEMO", newline: true, width: 880, upper: true, type: "textarea", options: { rows: "2" } }
                        ]
                    }
                };
            },
            mainform: null,
            buttons: null,
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'Repair/RepairPlan/ComboxData',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        me.maintdept = data.MaintDept;
                        me.repairtype = data.RepairType;
                        me.repairhandtype = data.RepairDealType;
                        me.plan_state = data.PlanState;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
                LG.ajax({
                    async: false,
                    url: 'Repair/RepairPlan/ShipList',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        me.shiplist = data;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                }); 
            },
            updateWorkHours: function (startDate, completeDate) {
                var start = new Date(startDate);
                var complete = new Date(completeDate);

                if (start >= complete) {
                    $('#PLAN_START_DATE').val("");
                    $('#PLAN_END_DATE').val("");
                    LG.showError("计划开始时间不能大于计划结束时间！");
                    return;
                }
                var timeDiff = complete - start;
                
                var minutesDiff = Math.round(timeDiff / 1000 / 60 / 60).toFixed(2);
                $('#PLAN_STOP_TIME').val(minutesDiff);
            },
            loadData: function () {
                var me = this;
                debugger
                if (!me.sid) {
                    me.mainform.setOrginData({ AUDITING: "0", PLAN_STATE:"10" });
                }
                else {
                    LG.ajax({
                        async: false,
                        url: 'Repair/RepairPlan/GetExeDetail',
                        loading: '正在获取中...',
                        data: { id: me.sid },
                        success: function (data, message) {
                            me.mainform.setOrginData(data[0]);
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                    if (me.isView) {
                        me.mainform.setReadonly(true);
                    }
                }
                me.mainform.focus();
            },
            save: function () { //保存
                var me = this;
                if ($.isEmptyObject(me.mainform.getChanges())) {
                    LG.showSuccess('无修改');
                    return;
                }
                if (!me.mainform.valid()) {
                    me.mainform.showInvalid();
                    return;
                }
                function handle(data) {
                    return data;
                }
                var data = handle(me.mainform.getData());
                var original = handle(me.mainform.getOrginData());
                var changeRow = new Object();
                if (!me.sid) {
                    changeRow["added"] = [data];
                }
                else {
                    changeRow["updated"] = [data];
                    changeRow["original"] = [original];
                }
                LG.ajax({
                    jsToken: true,
                    url: 'Repair/RepairPlan/SaveExe',
                    loading: '正在保存中...',
                    data: changeRow,
                    success: function () {
                        LG.showSuccess('保存成功', function () { if (me.dialog) { me.dialog.close(); } });
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            close: function (skipConfirm) {
                var me = this;
                function inner(callback) {
                    if (!skipConfirm && !$.isEmptyObject(me.mainform.getChanges())) {
                        $.ligerDialog.confirm($.ligerDefaults.GridString.isContinueByDataChanged, function (confirm) {
                            if (confirm) {
                                if (callback) callback(2);
                            }
                            else {
                                if (callback) callback(0);
                            }
                        });
                        if (callback) return callback(-1);
                        return false;
                    }
                    if (callback) return callback(1);
                    return true;
                }
                inner(function (status) {
                    if (status > 0) {
                        if (me.dialog) {
                            me.dialog.close();
                            return;
                        }
                        var win = parent || window;
                        if (win.closeCurrentTab) win.closeCurrentTab();
                        else win.close();
                    }
                });
            },
            setFormDefaultBtn: function () {
                var me = this;
                //表单底部按钮
                var buttons = [];
                if (!me.isView) {
                    buttons.push({
                        text: '重置', onclick: function () {
                            $.ligerDialog.confirm("确定重置数据吗?", function (confirm) {
                                if (confirm) {
                                    location.reload(true);
                                }
                            });
                        }
                    });
                }
                buttons.push({ text: '关闭', onclick: me.close.bind(me) });
                if (!me.isView) buttons.push({ text: '保存', onclick: me.save.bind(me) });
                LG.addFormButtons(buttons);
                me.formButtons = buttons;
            },
            setForm: function () {
                var me = this;
                me.config.form.fields.removeNull();
                var $mainform = $("#mainform")
                //搜索表单应用ligerui样式
                me.mainform = $mainform.ligerForm({
                    EnterMoveNextControl: true,
                    labelAlign: 'right',
                    space: 3,
                    validate: true,
                    fields: me.config.form.fields,
                    labelWidth: 120,
                    onAfterSetFields: function (g) {
                        me.mainform = g;
                        me.buttons = g.options.buttons;
                    }
                });
                me.setFormDefaultBtn();
            },
            init: function () {
                var me = this;
                if (frameElement && frameElement.dialog) {
                    me.dialog = frameElement.dialog;
                    me.dialogData = me.dialog.get('data') || {};
                    if (me.dialogData.callback) me.callback = me.dialogData.callback;
                    if (me.dialogData.sid) me.sid = me.dialogData.sid;
                    if (me.dialogData.isView) me.isView = me.dialogData.isView;
                }
                me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.loadData();
                return me;
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>

</html>
