<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title>维修计划实施</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <div id="mainsearch" style="width: 98%">
        <form action="" id="formsearch" class="l-form">
        </form>
    </div>
    <form action="" id="mainform">
        <div id="maingrid">
        </div>
    </form>
    <script type="text/javascript">
        'use strict';
        var business = {
            plan_state: [],
            menuNo: getQueryStringByName("MenuNo"),
            ver: getQueryStringByName("ver"),
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            { display: "故障申报单号", name: "_search_EXE_CODE", dbname: "EXE_CODE", newline: false, upper: true, type: "text", options: {} },
                            { display: "船舶名称", name: "_search_DEVICE_NAME", dbname: "DEVICE_NAME", newline: false, upper: true, type: "text", options: {} },
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "EXE_ID", name: "EXE_ID", minWidth: 100, type: "text", hide: true },
                            {
                                display: "记录状态", name: "AUDITING_C", width: 100, type: "select", editor: {
                                    type: "select",
                                    data: me.auditing
                                }
                            },
                            { display: "故障申报单号", name: "EXE_CODE", minWidth: 100, type: "text", },
                            {
                                display: "维修状态", name: "PLAN_STATE", minWidth: 100, type: "select", format: { data: me.plan_state }
                            },
                            { display: "船舶名称", name: "DEVICE_NAME", minWidth: 100, type: "text", },
                            { display: "维保部门", name: "WSEC_DEPT", minWidth: 100, type: "text", },
                            { display: "维修类型", name: "MAINT_TYPE", minWidth: 100, type: "text", },
                            { display: "维修处理方式", name: "DEAL_TYPE", minWidth: 100, type: "select", options: { data: me.repairhandtype } },
                            { display: "实际开工时间", name: "ACT_START_DATE", minWidth: 100, type: "text", },
                            { display: "实际完工时间", name: "ACT_END_DATE", minWidth: 100, type: "text", },
                            { display: "备注", name: "PLAN_MEMO", minWidth: 100, type: "text", }
                        ],
                    }
                };
            },
            grid: null,
            //明细页面大小
            detailWidth: window.innerWidth * 0.9,
            detailHeight: window.innerHeight * 0.9,
            repairhandtype:[],
            searchForm: null,
            buttons: null,
            UserInfo:null,
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'Repair/RepairPlan/ComboxData',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        me.maintdept = data.MaintDept;
                        me.repairtype = data.RepairType;
                        me.repairhandtype = data.RepairDealType;
                        me.plan_state = data.PlanState;
                        me.auditing = data.Auditing;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            setGrid: function () {
                var me = this;
                var columns = me.config.grid.columns;
                for (var i = columns.length - 1; i >= 0; i--) {
                    if (!columns[i]) columns.splice(i, 1);
                }
                me.grid = $("#maingrid").ligerGrid({
                    autoWidth: true,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    dataAction: 'server',
                    toolbar: { group: 'list' },
                    url: 'Repair/RepairPlan/ExeList',
                    parms: {
                        where: JSON.stringify({
                            op: 'or',
                            rules: [{ field: 'AUDITING_B', op: 'equal', value: "1" },
                                { field: 'AUDITING_B', op: 'equal', value: "3" }]
                        })
                    },
                    sortName: '',
                    sortOrder: '',
                    width: '100%',
                    height: '100%',
                    dateFormat: 'yyyy-MM-dd HH:mm',
                    checkbox: true,
                    usePager: true,
                    rownumbers: false,
                    enabledEdit: false,
                    clickToEdit: false,
                    onBeforeEdit: function (editParm) {
                        switch (editParm.column.name) {
                            case "":
                                if (editParm.record.__status == "add") return true;
                                else return false;
                                break;
                        }
                    },
                    onSuccess: function (data, g) {
                        if (data && data.Rows) {
                            var rows = data.Rows;
                            for (var i = 0, len = (rows || []).length; i < len; i++) {
                                rows[i].OLDSID = rows[i].SID;
                                rows[i].OLDMODIFYDATE = rows[i].MODIFYDATE;
                            }
                        }
                    },
                    onDblClickRow: function (rowdata) {
                        me.view(rowdata);
                    },
                    rowAttrRender: function (rowdata, rowid) {
                        return "";
                    }
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            isSelectRow: function () {
                var me = this;
                var rows = me.grid.getSelectedRows();
                if (rows.length == 0) {
                    LG.tip("请选择一行");
                    return false;
                }
                return true;
            },
            isSelectSingleRow: function () {
                var me = this;
                var rows = me.grid.getSelectedRows();
                if (rows.length > 1) {
                    LG.tip("不能选择多行");
                    return false;
                } else if (rows.length == 0) {
                    LG.tip("请选择一行");
                    return false;
                }
                return true;
            },
            isAllAudited: function ({ msg = "未提交数据，无需撤销！" } = {}) {
                var me = this;
                var selecteds = me.grid.getSelectedRows();
                for (let row of selecteds) {
                    if (!["1", "2", "3"].includes(row.AUDITING_C)) {
                        if (msg) {
                            LG.tip(msg);
                        }
                        return false;
                    }
                }
                return true;
            },
            isAllUnaudited: function ({ msg = "有数据已提交，无法变更！" } = {}) {
                var me = this;
                var selecteds = me.grid.getSelectedRows();
                for (let row of selecteds) {
                    if (["1", "2", "3"].includes(row.AUDITING_C)) {
                        if (msg) {
                            LG.tip(msg);
                        }
                        return false;
                    }
                }
                return true;
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "add":
                            me.add();
                            break;
                        case "modify":
                            if (me.isSelectSingleRow() && me.isAllUnaudited()) {
                                me.modify();
                            }
                            break;
                        case "submit":
                            if (me.isSelectSingleRow() && me.isAllUnaudited()) {
                                me.submit();
                            }
                            break;
                        case "delete":
                            if (me.isSelectRow() && me.isAllUnaudited()) {
                                me.delete();
                            }
                            break;
                        case "revoke":
                            if (me.isSelectSingleRow() && me.isAllAudited()) {
                                me.revoke();
                            }
                            break;
                        case "Excel":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=xls", window.gksybConfigs.urlBase), modal: true });
                            break;
                        case "Pdf":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=pdf", window.gksybConfigs.urlBase), modal: true });
                            break;
                    }
                }
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            revoke: function () { //撤销提交
                var me = this;
                var selected = me.grid.getSelectedRow();
                LG.ajax({
                    jsToken: true,
                    url: 'Repair/RepairPlan/RevokeExe',
                    loading: '正在提交中...',
                    data: { exeId: selected.EXE_ID },
                    success: function () {
                        LG.showSuccess('撤销提交成功');
                        me.grid.isDataChanged = false;
                        me.reload();
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            add: function () { //新增
                var me = this;
                $.ligerDialog.open({
                    width: me.detailWidth,
                    height: me.detailHeight,
                    allowClose: true,
                    title: '[新增]维修实施',
                    url: "repair-plan-exe-detail.html?MenuNo=" + me.menuNo + "&ver=" + me.ver,
                    isHidden: false,
                    showMax: true,
                    showToggle: false,
                    showMin: false,
                    isResize: true,
                    slide: false,
                    rownumbers: true,
                    onClosed: null,
                    data: { sid: "", isNew: true, isView: false }
                });
            },
            submit: function () { //提交
                var me = this;
                var selected = me.grid.getSelectedRow();
                if (selected.ACT_START_DATE == null) {
                    LG.showError("请选择实际开工时间！");
                    return;
                }
                if (selected.ACT_END_DATE == null) {
                    LG.showError("请选择实际完工时间！");
                    return;
                }
                LG.ajax({
                    jsToken: true,
                    url: 'Repair/RepairPlan/SubmitExe',
                    loading: '正在提交中...',
                    data: { exeId: selected.EXE_ID },
                    success: function () {
                        LG.showSuccess('提交成功');
                        me.grid.isDataChanged = false;
                        me.reload();
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            view: function (rowdata) { //查看
                var me = this;
                var selected = me.grid.getSelectedRow();
                if (rowdata) {
                    selected = rowdata;
                }
                if (selected) {
                    $.ligerDialog.open({
                        width: me.detailWidth,
                        height: me.detailHeight,
                        allowClose: true,
                        title: '[查看]维修实施',
                        url: "repair-plan-exe-detail.html?MenuNo=" + me.menuNo,
                        isHidden: false,
                        showMax: false,
                        showToggle: false,
                        showMin: false,
                        isResize: true,
                        slide: false,
                        onClosed: me.buttons[0].click,
                        data: { sid: selected.EXE_ID, isView: true }
                    });
                } else {
                    LG.tip('请选择行!');
                }
            },
            modify: function (rowdata) { //修改
                var me = this;
                var selected = me.grid.getSelectedRow();
                if (rowdata) {
                    selected = rowdata;
                }
                if (selected) {
                    $.ligerDialog.open({
                        width: me.detailWidth,
                        height: me.detailHeight,
                        allowClose: true,
                        title: '[修改]维修实施',
                        url: "repair-plan-exe-detail.html?MenuNo=" + me.menuNo + "&ver=" + me.ver,
                        isHidden: false,
                        showMax: false,
                        showToggle: false,
                        showMin: false,
                        isResize: true,
                        slide: false,
                        onClosed: me.reload.bind(me),
                        data: { sid: selected.EXE_ID, isView: false }
                    });
                }
            },
            reload: function () { //刷新
                var me = this;
                me.buttons[0].click();
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Pdf',
                        text: '导出Pdf',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-pdf-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            setForm: function () {
                var me = this;
                var columns = me.config.search.fields;
                for (var i = columns.length - 1; i >= 0; i--) {
                    if (!columns[i]) columns.splice(i, 1);
                }
                var $formsearch = $("#formsearch")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid);
                            //var data = me.searchForm.getData();
                            //me.setGrid(data._search_EVENTTIMEB.format("yyyy-MM"), data._search_DEPARTCODE, data._search_EMPLOYEENAME, data._search_DEPT);
                        }
                    },

                    ],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                    }
                });
                me.buttons[0].click(); //查询
            },
            init: function () {
                var me = this;
                me.loadComboxData();
                me.setConfig();
                me.setGrid();
                me.setForm();
                return me;
            }
        };
        business.init();
    </script>
</body>

</html>
