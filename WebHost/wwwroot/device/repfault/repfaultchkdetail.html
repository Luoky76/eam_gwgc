<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title>故障验收明细</title>
    <script src="../../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%; overflow:auto;">
    <form id="mainform" style="width:97%;">
    </form>
    <div style="margin-bottom: 5px; width: 98%;" id="paramform">
    </div>
    <div style="width: 94.5%;" class="l-form">
        <div class="l-form-container">
            <div class="l-group" style="width: 100%;"><span>物资明细</span></div>
            <ul style="display: block; width: 100%;" id="ulGrid">
                <li style=" width: 100%;">
                    <div style="margin-bottom: 50px; width: 100%;" id="spgird">
                    </div>
                </li>
            </ul>
            <div class="l-group" style="width: 100%;"><span>人员明细</span></div>
            <ul style="display: block; width: 100%;" id="ulGrid">
                <li style=" width: 100%;">
                    <div style="margin-bottom: 50px; width: 100%;" id="pepgird">
                    </div>
                </li>
            </ul>
        </div>
    </div>
    <script type="text/javascript">
        'use strict';
        var business = {
            formLabelWidth: 120,
            formInputWidth: 180,
            getTextareaWidth: function () {
                var me = this;
                var fieldWidth = me.formLabelWidth + me.formInputWidth + 3;
                return Math.floor(($("#mainform").width() - 10) / fieldWidth) * fieldWidth - (me.formLabelWidth + 3);
            },
            menuNo: getQueryStringByName("MenuNo"),
            dialogData: {},
            sid: getQueryStringByName("sid"),
            isNew: false,
            isView: false,
            orginData: {},
            auditing: [{ "ID": "1", "TEXT": "已提交" }, { "ID": "0", "TEXT": "未提交" }],
            checkResult: [{ "ID": "1", "TEXT": "合格" }, { "ID": "0", "TEXT": "不合格" }],
            DisposeType: [],
            DeviceStatus: [],
            FaultSrc: [],
            FaultStatus: [],
            RepType: [],
            ShipInfo: [],
            MaintDept: [],
            start: null,
            setConfig: function () {
                var me = this;
                me.config = {
                    form: {
                        labelwidth: me.formLabelWidth,
                        fields: [
                            //基础信息
                            { display: "记录状态", name: "AUDITING_B", newline: false, upper: true, type: "select", options: { type: "select", disabled: true, data: me.auditing },  group: "设备故障上报" },
                            { display: "故障单号", name: "FAULT_CODE", newline: false, upper: true, type: "text", options: { disabled: true },  },
                            { display: "故障状态", name: "FAULT_STATUS", newline: false, upper: true, type: "select",  options: { type: "select", disabled: true, data: me.FaultStatus } },
                            {
                                display: "船舶名称", name: "SHIP_ID", dbname: "SHIP_ID", width: me.formInputWidth, type: "select", align: "left", 
                                options: { type: "select", disabled: true, data: me.ShipInfo }
                            },
                            { display: "船舶编码", name: "SHIP_CODE", newline: false, upper: true, type: "hidden",  options: { disabled: true } },
                            { display: "船舶名称", name: "SHIP_NAME", newline: false, upper: true, type: "hidden",  options: { disabled: true } },
                            { display: "故障发生时间", name: "FAULT_DATE", newline: false, upper: true, type: "date",  options: { disabled: true } },
                            {
                                display: "设备状态", name: "DEVICE_STATUS", newline: false, upper: true, type: "select",  options: { type: "select", disabled: true, data: me.DeviceStatus }
                            },
                            {
                                display: "故障设备名称", name: "DEVICE_ID", dbname: "DEVICE_ID", width: me.formInputWidth, type: "select", align: "left", 
                                options: { type: "select", disabled: true, data: me.DeviceInfo }
                            },
                            { display: "设备编号", name: "DEVICE_CODE", newline: false, upper: true,  options: { disabled: true } },
                            { display: "设备型号", name: "DEVICE_TYPE", newline: false, upper: true,  options: { disabled: true } },
                            { display: "设备类别", name: "TYPE_NAME", newline: false, upper: true, type: "text",  options: { disabled: true } },
                            { display: "异常来源", name: "FAULT_SRC", newline: false, upper: true, type: "select",  options: { type: "select", disabled: true, data: me.FaultSrc } },
                            //{ display: "来源单号", name: "SRC_CODE", newline: false, upper: true, type: "text", editor: { disabled: true }, options: {} },
                            { display: "使用部门", name: "DEPT_NAME", newline: false, upper: true, type: "text",  options: { disabled: true } },
                            //{ display: "使用部门", name: "DEPT_ID", newline: false, upper: true, type: "text", editor: { disabled: true }, options: {} },

                            { display: "维保部门", name: "WDEPT_NAME", newline: false, upper: true, type: "hidden", options: {} },
                            { display: "设备名称", name: "DEVICE_NAME", newline: false, upper: true, type: "hidden", options: {} },
                            {
                                display: "维保部门", name: "WDEPT_ID", newline: false, upper: true, type: "select",  options: { type: "select", disabled: true, data: me.MaintDept }
                            },
                            { display: "上报人", name: "EDIT_USER", newline: false, upper: true, type: "text",  options: { disabled: true } },
                            //{ display: "上报人ID", name: "EDIT_USERID", newline: false, upper: true, type: "text", options: {} },
                            { display: "故障现象描述", name: "FAULT_DESCRIBE", newline: true, upper: true, width: me.getTextareaWidth(), type: "textarea",  options: { disabled: true } },

                            { display: "处理方式", name: "DISPOSE_TYPE", newline: false, upper: true, type: "select",  options: { type: "select", disabled: true, data: me.DisposeType }, group: "故障处理" },
                            { display: "故障分类", name: "REP_TYPE_ID", newline: false, upper: true, type: "select",  options: { type: "select", disabled: true, data: me.RepType } },
                            { display: "故障库编码", name: "FRDB_CODE", newline: false, upper: true, type: "text",  options: { disabled: true } },
                            {
                                display: "开工时间", name: "ORDER_DATE", newline: false, upper: true, type: "date", 
                                options: { disabled: true, format: 'yyyy-MM-dd HH:mm:ss' }
                            },
                            {
                                display: "完工时间", name: "COMPLETE_DATE", newline: false, upper: true, type: "date", 
                                options: { disabled: true, format: 'yyyy-MM-dd HH:mm:ss' }
                            },
                            { display: "维修工时(H)", name: "REPAIR_HOURS", newline: false, upper: true, type: "float",  options: { disabled: true } },
                            { display: "故障及解决方法描述", name: "FAULT_REASON", newline: true, upper: true,  width: me.getTextareaWidth(), type: "textarea", options: { disabled: true } },
                            { display: "解决方法", name: "MEASURES", newline: true, upper: true, width: me.getTextareaWidth(),  type: "textarea", options: { disabled: true } },
                            { display: "故障处理备注", name: "FAULT_MEMO", newline: true, upper: true, width: me.getTextareaWidth(),  type: "textarea", options: { disabled: true } },


                            { display: "验收人", name: "CHECK_USER", newline: false, upper: true, type: "text",  options: { disabled: true }, group: "设备验收" },
                            { display: "验收时间", name: "CHECK_DATE", newline: false, upper: true, type: "date",  options: { disabled: true } },
                            { display: "验收结果", name: "CHECK_RESULT", newline: false, upper: true, type: "select", validate: { required: true }, options: { type: "select", data: me.checkResult } },
                            { display: "验收说明", name: "CHECK_MEMO", newline: true, upper: true, width: me.getTextareaWidth(), type: "textarea", options: {} },



                            //隐藏
                            { display: "主键", name: "FAULT_ID", newline: false, upper: true, type: "hidden", options: {} },]
                    },
                    grid: {
                        columns: [
                            { display: "人员姓名", name: "LABOR_NAME", minWidth: 200, type: "text", },
                            { display: "人员ID", name: "LABOR_ID", minWidth: 100, hide: true },
                            { display: "工时(H)", name: "WORK_HOURS", minWidth: 200, type: "float", editor: { type: 'float' } },
                            { display: "备注", name: "MEMO", minWidth: 300, type: "text", },
                            { display: "主键", name: "FAULT_LABOR_ID", width: 100, hide: true },
                            { display: "外键", name: "FAULT_ID", width: 100, hide: true },

                        ]
                    },
                    grid2: {
                        columns: [
                            //{ display: "来源", name: "SP_SOURCE", minWidth: 100, type: "text", },
                            { display: "备件品种编码", name: "SP_CODE", minWidth: 100, type: "text", },
                            { display: "备件品种名称", name: "SP_NAME", minWidth: 100, type: "text", },
                            { display: "型号规格", name: "SP_SIZE", minWidth: 100, type: "text", },

                            { display: "仓库名称", name: "HOUSE_NAME", minWidth: 100, type: "text", },
                            { display: "库位名称", name: "STOCK_NAME", minWidth: 100, type: "text", },
                            { display: "库存数量", name: "CUR_NUM", minWidth: 100, type: "float", },
                            { display: "实际消耗数量", name: "REAL_OUT_NUM", minWidth: 100, type: "float", editor: { type: 'float' } },
                            { display: "计量单位", name: "UNIT", minWidth: 100, type: "text", },
                            //{ display: "制造厂", name: "FACTORY", minWidth: 100, type: "text" },
                            { display: "主键", name: "FAULT_SP_ID", minWidth: 100, hide: true },
                            { display: "外键", name: "FAULT_ID", minWidth: 100, hide: true },

                        ]
                    },
                };
            },
            mainform: null,
            buttons: null,
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'Device/RepFault/ComboxData',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        me.FaultStatus = data.FaultStatus;
                        me.MaintDept = data.MaintDept;
                        me.ShipInfo = data.ShipInfo;
                        me.DeviceInfo = data.DeviceInfo;
                        me.DisposeType = data.DisposeType;
                        me.DeviceStatus = data.DeviceStatus;
                        me.RepType = data.RepType;
                        me.FaultSrc = data.FaultSrc;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            loadData: function () {
                var me = this;
                function inner() {
                    var data = me.mainform.getData();
                    LG.getFormCombChanges(data, me.orginData, true);
                    delete me.orginData;
                    me.orginData = data;
                }
                if (me.isNew) {
                    me.mainform.setData({ AUDITING_B: "0", FAULT_STATUS: "30", FAULT_SRC: "10", DISPOSE_TYPE: "20" });
                    inner();
                }
                else {
                    LG.ajax({
                        async: false,
                        url: 'Device/RepFault/GetFaultExeListDetail',
                        loading: '正在获取中...',
                        data: { id: me.sid },
                        success: function (data, message) {
                            data.OLDMODIFYDATE = data.MODIFYDATE;
                            me.mainform.setData(data);
                            inner();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                    if (me.isView) {
                        me.mainform.setReadonly(true);
                    }
                }
                var input = me.mainform.getEditor(me.config.form.fields[0].name).inputText;
                input.focus();
                input.select();
            },
            //保存
            save: function () { //保存
                var me = this;
                if (!me.mainform.valid()) {
                    me.mainform.showInvalid();
                    return;
                }
                function handle(data) {
                    data.GRID = encrypt(data.GRID);
                    data.SEARCH = encrypt(data.SEARCH);
                    data.FORM = encrypt(data.FORM);
                    return data;
                }
                var data = handle(me.mainform.getData());
                var original = handle(me.orginData);

                var changeRow = new Object();
                if (me.isNew) {
                    changeRow["added"] = [data];
                }
                else {
                    changeRow["updated"] = [data];
                    changeRow["original"] = [original];
                }

                LG.ajax({
                    jsToken: true,
                    url: 'Device/RepFault/ManageFaultCheck',
                    loading: '正在保存中...',
                    data: { request: changeRow },
                    success: function (result) {
                        LG.showSuccess('保存成功', function () {
                            if (me.dialog) me.dialog.close();
                        });
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            close: function () {
                var me = this;
                function inner(callback) {
                    var data = me.mainform.getData();
                    var updateFields = LG.getFormCombChanges(data, me.orginData, true);
                    if (updateFields) {
                        $.ligerDialog.confirm($.ligerDefaults.GridString.isContinueByDataChanged, function (confirm) {
                            if (confirm) {
                                if (callback) callback(2);
                            }
                            else {
                                if (callback) callback(0);
                            }
                        });
                        if (callback) return callback(-1);
                        return false;
                    }
                    if (callback) return callback(1);
                    return true;
                }
                inner(function (status) {
                    if (status > 0) {
                        if (me.dialog) me.dialog.close();
                        if (me.callback) me.callback(false);
                    }
                });
            },
            setFormDefaultBtn: function (cancleCallback, savedCallback) {
                var me = this;
                //表单底部按钮
                var buttons = [];
                buttons.push({ text: '关闭', icon: 'fa fa-window-close', onclick: me.close.bind(me) });
                if (!me.isView) buttons.push({ text: '保存', icon: 'fa fa-save', onclick: me.save.bind(me) });

                LG.addFormButtons(buttons);
                me.formButtons = buttons;
            },
            setForm: function () {
                var me = this;
                me.config.form.fields.removeNull();
                var $formsearch = $("#mainform")
                //搜索表单应用ligerui样式
                me.mainform = $formsearch.ligerForm({
                    labelWidth: me.formLabelWidth,
                    inputWidth: me.formInputWidth,
                    EnterMoveNextControl: true,
                    labelAlign: 'right',
                    space: 3,
                    validate: true,
                    fields: me.config.form.fields,
                    labelWidth: me.formLabelWidth,
                    onAfterSetFields: function (g) {
                        me.mainform = g;
                        me.buttons = g.options.buttons;
                    }
                });
                me.setFormDefaultBtn();
            },
            //物料消耗明细
            grid2: null,
            setGrid2: function () {
                var me = this;
                me.config.grid2.columns.removeNull();
                me.grid2 = $("#spgird").ligerGrid({
                    dateFormat: "yyyy-MM-dd hh:mm",
                    autoWidth: true,
                    delayLoad: true,
                    usePager: true,
                    columns: me.config.grid2.columns,
                    dataAction: 'server',
                    toolbar: {},
                    url: 'Device/RepFault/GetFaultSpList',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: [{ field: 'FAULT_ID', op: 'equal', value: $('#FAULT_ID').val() }]
                        })
                    },
                    //sortName: 'MODIFY_DATE',
                    //sortOrder: 'desc',
                    width: '99%',
                    height: '100%',
                    checkbox: false,
                    enabledEdit: false,
                    clickToEdit: false,
                    onBeforeEdit: function (editParm) {
                        switch (editParm.column.name) {
                            case "":
                                if (editParm.record.__status == "add") return true;
                                else return false;
                                break;
                        }
                    },
                    onSuccess: function (data, g) {
                        //me.iframeloading.hide();
                    }
                });
                me.grid2.isValid = true;

            },
            //人员明细
            grid: null,
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#pepgird").ligerGrid({
                    dateFormat: "yyyy-MM-dd hh:mm",
                    autoWidth: true,
                    delayLoad: true,
                    usePager: true,
                    columns: me.config.grid.columns,
                    dataAction: 'server',
                    toolbar: {},
                    url: 'Device/RepFault/GetFaultPepList',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: [{ field: 'FAULT_ID', op: 'equal', value: $('#FAULT_ID').val() }]
                        })
                    },
                    //sortName: 'MODIFY_DATE',
                    //sortOrder: 'desc',
                    width: '99%',
                    height: '100%',
                    checkbox: false,
                    enabledEdit: false,
                    clickToEdit: false,
                    onBeforeEdit: function (editParm) {
                        switch (editParm.column.name) {
                            case "":
                                if (editParm.record.__status == "add") return true;
                                else return false;
                                break;
                        }
                    },
                    onSuccess: function (data, g) {
                        //me.iframeloading.hide();
                    }
                });
                me.grid.isValid = true;

            },
            //刷新
            reloadSp: function () {
                var me = this;
                me.grid2.loadData();
            },
            //刷新
            reloadPep: function () {
                var me = this;
                me.grid.loadData();
            },
            init: function () {
                var me = this;
                if (frameElement && frameElement.dialog) {
                    me.dialog = frameElement.dialog;
                    me.dialogData = me.dialog.get('data');
                    me.callback = me.dialogData.callback;
                    if (me.dialogData.sid) me.sid = me.dialogData.sid;
                    if (me.dialogData.isNew != undefined) me.isNew = me.dialogData.isNew;
                    if (me.dialogData.isView != undefined) me.isView = me.dialogData.isView;
                }

                //加在基础信息
                me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.loadData();


                //加载重大改造履历
                me.setGrid();
                me.setGrid2();
                me.reloadPep();
                me.reloadSp();
                if (me.dialogData.isView != undefined) {
                    const commonGridOptions = {
                        enabledEdit: false,
                    };
                    me.grid.setOptions(commonGridOptions);
                    me.grid2.setOptions(commonGridOptions);
                }
                return me;
            }
        };
        business.init();
    </script>
</body>

</html>
