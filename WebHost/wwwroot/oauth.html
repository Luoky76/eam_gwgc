<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>单点跳转</title>
    <script src="lib/jquery/jquery.js" type="text/javascript"></script>
    <script src="lib/js/common.js?v=1" type="text/javascript"></script>
</head>

<body>
    <h3 id="msg"></h3>
    <script type="text/javascript">
        'use strict';
        var business = {
            to: function () {
                //location.href = gksybConfigs.urlBase + (getQueryStringByName("to") || "sso.html");
                location.href = gksybConfigs.urlBase + (getQueryStringByName("to") || "index.html");
            },
            oauth: function (code) {
                var me = this;
                $.ajax({
                    type: 'post',
                    dataType: 'json',
                    url: 'oauth/check',
                    async:false,
                    headers: {
                        code: code
                    },
                    success: function (result) {
                        if (result.IsError) {
                            $("#msg").html("单点验证失败，原因" + result.Message);
                            return;
                        }
                        window.ticket = result.Data.Ticket;
                        delete result.Data.Ticket;
                        window.session = result.Data;
                        me.to();
                    }
                });
            },
            init: function () {
                var me = this;
                var code = getQueryStringByName("ticketCode");
                if (!code) {
                    $("#msg").html("缺少必要参数，单点验证失败。");
                    return;
                }
                me.oauth(code);
            }
        };
        business.init();
    </script>
</body>
</html>
