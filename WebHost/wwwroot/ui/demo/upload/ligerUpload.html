<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>UI</title>

    <script src="../../../../lib/LGboot.js" type="text/javascript"></script>
    <link href="../../../../lib/third-party/viewerjs/viewer.css" rel="stylesheet" />
    <script src="../../../../lib/third-party/viewerjs/viewer.js" type="text/javascript"></script>
    <style>
        body {
            margin: 10px;
        }
    </style>
</head>
<body>
    <div class="groupTitle"><span>1、上传</span></div>
    <input id="i1" />
    <div class="groupTitle"><span>1、上传 card</span></div>
    <input id="i2" />
    <div class="groupTitle"><span>1、上传 card</span></div>
    <input id="i3" />
    <script>
        //上传
        $("#i1").ligerUpload({
            type: "text",
            extensions: "doc,docx",
            mimeTypes: ".doc,.docx,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document",
            multiple: true,
            fileNumLimit: 3,
            fileSizeLimit: "5"
        });

        //上传
        $("#i2").ligerUpload({
            //url: "/common/upload",
            data: { folder: "Adv" },
            ajaxOptions: { jsToken: true, },
            multiple: true,
            fileNumLimit: 3,
            fileSizeLimit: "5"
        });

        //上传
        $("#i3").ligerUpload({
            extensions: "doc,docx",
            mimeTypes: ".doc,.docx,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document",
            multiple: true,
            fileNumLimit: 3,
            fileSizeLimit: "5"
        });
    </script>
</body>
</html>
