<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>UI</title>
    <script src="../../../../lib/LGboot.js" type="text/javascript"></script>
    <style>
        body {
            margin: 10px;
        }
    </style>
</head>
<body>
    <div class="groupTitle"><span>1、基本弹出层</span></div>
    <button id="b1">消息框msg</button>
    <button id="b2">提示框alert</button>
    <button id="b3">加载层waitting</button>
    <button id="b4">提示输入框prompt</button>
    <button id="b8">提示框tip</button>
    <button id="b9">tip</button>
    <button id="b10">通知</button>
    <div class="groupTitle"><span>1、弹出层扩展</span></div>
    <button id="b5">弹出层ligerDialog.open</button>
    <button id="b6">加载url</button>
    <button id="b7">调用父窗体的dialog控件实现弹出框不局限当前窗体的大小</button>
    <h1 id="h1" style="color:red;"></h1>
    <script>
        $("#b1").ligerButton({
            onClick: function () {
                var d = $.ligerDialog.msg({
                    content: "提示",
                    allowClose: false,
                    buttons: [
                        {
                            text: "改变我", type: "info", onClick: function () {
                                d.set({
                                    content: "3秒后自动关闭", cls: "msg-white", type: "fa fa-spinner fa-pulse",
                                    buttons: null, time: 300000, allowClose: true
                                });
                            }
                        },
                        {
                            text: "关闭", onClick: function () {
                                d.close();
                            }
                        }
                    ]
                });
            }
        });
        $("#b2").ligerButton({
            onClick: function () {
                var d = $.ligerDialog.alert("点击确定按钮进行更换<br/>点击确定按钮进行更换点击确定按钮进行更换<br/>点击确定按钮进行更换", "alert", "info", function () {
                    $.ligerDialog.success("点击确定按钮进行更换", "success", function () {
                        $.ligerDialog.error("点击确定按钮进行更换", "error", function () {
                            $.ligerDialog.warn("点击确定按钮进行更换", "warn", function () {
                                $.ligerDialog.question("点击确定按钮进行更换", "question", function (isOk) {
                                    if (isOk) {
                                        $.ligerDialog.confirm("点击确定按钮进行更换", "confirm", function (isOk) {
                                            if (isOk) {
                                                $.ligerDialog.warning("点击是进入waitting", "warning", function (btnType) {
                                                    $.ligerDialog.msg("您点击了" + btnType);
                                                }, {
                                                    fixedType: 'sw'
                                                });
                                            }
                                        }, {
                                            fixedType: 'ne',
                                            fixedPadding: 0
                                        });
                                    }
                                }, {
                                    fixedType: 'w',
                                    fixedPadding: 50
                                });
                            }, {
                                fixedType: 'e',
                                fixedPadding: 5
                            });
                        }, {
                            fixedType: 's',
                            fixedPadding: 50
                        });
                    }, {
                        fixedType: 'n',
                        fixedPadding: 5
                    });
                });
            }
        });
        $("#b3").ligerButton({
            onClick: function () {
                var d = $.ligerDialog.waitting(undefined, {
                    onClosed: function () {
                        $.ligerDialog.waitting(null, {
                            onClosed: function () {
                                $.ligerDialog.waitting(null, {
                                    type: "fa fa-cog fa-spin",
                                    onClosed: function () {
                                        $.ligerDialog.waitting(null, {
                                            type: "fa fa-refresh fa-spin",
                                            onClosed: function () {
                                                $.ligerDialog.waitting(null, {
                                                    type: "fa fa-circle-o-notch fa-spin",
                                                    onClosed: function () {
                                                        $.ligerDialog.waitting(null, {
                                                            type: "fa fa-spinner fa-spin",
                                                            onClosed: function () {

                                                            }
                                                        });
                                                    }
                                                });
                                            }
                                        });
                                    }
                                });
                            }
                        });
                    }
                });
            }
        });
        $("#b4").ligerButton({
            onClick: function () {
                var d = $.ligerDialog.prompt("请输入值", "我是下一个prompt的标题栏", function (isOk, val) {
                    if (isOk) {
                        $.ligerDialog.prompt(val, "多文本", true, function (isOk, val) {
                            if (isOk) {
                                $.ligerDialog.msg({ content: "您输入了" + val, time: 200000 });
                            }
                        });
                    }
                });
            }
        });
        var i = 0;
        $("#b8").ligerButton({
            onClick: function () {
                var d = $.ligerDialog.tip({ content: "我是提示内容" + (++i) + ",设置time:2000后关闭", fixedType: "n", time: 2000});
            }
        });
        $("#b10").ligerButton({
            onClick: function () {
                var d = $.ligerDialog.notification({ title:"通知标题", content: "我是通知内容，我是通知内容,我是通知内容，我是通知内容我是通知内容，我是通知内容我是通知内容，我是通知内容", fixedType: "ne", time: 0 });
            }
        });
        $("#b5").ligerButton({
            onClick: function () {
                var d1 = $.ligerDialog.open({
                    fixedType: "n",
                    title: "点击按钮进行操作",
                    type: "success",
                    content: "我是可伸缩可移动的哦",
                    slide: true,
                    showMin: true,
                    showMax: true,
                    showToggle: true,
                    minIsHide: false,
                    isResize: true,
                    buttons: [
                        {
                            text: "去除标题及按钮", type: "info", onClick: function () {
                                var g = this.parent, p = g.options;
                                g.set({
                                    content: "只剩下孤伶伶的我了",
                                    title: null, showMin: false, showMax: false, showToggle: false, buttons: null,
                                    isResize: false
                                });
                            }
                        },
                        {
                            text: "改变位置宽高", type: "info", onClick: function () {
                                var g = this.parent, p = g.options;
                                g.set({ top: 100, left: 100, width: 400, height: 300 });
                            }
                        },
                        {
                            text: "改变标题内容", type: "info", onClick: function () {
                                var g = this.parent, p = g.options;
                                g.set({ title: "我是改变后的标题", type: "fa fa-refresh fa-spin", content: "我是改变后的图标和内容" });
                            }
                        },
                        {
                            text: "两秒关闭关闭", onClick: function () {
                                var g = this.parent, p = g.options;
                                g.set({ time: 2000 });
                            }
                        }
                    ]
                });

            }
        });
        $("#b6").ligerButton({
            onClick: function () {
                var d1 = $.ligerDialog.open({
                    title: "我加载了百度",
                    type: null,
                    content: null,
                    slide: true,
                    showMin: false,
                    showMax: true,
                    showToggle: true,
                    minIsHide: false,
                    isResize: true,
                    width: 600,
                    height: 400,
                    modal: false,
                    url: "https://www.baidu.com/",
                    data: { title: "父窗体传值给子窗体后子窗体根据值改变标题", content: "什么" },
                    buttons: [
                        {
                            text: "修改url并传值", type: "info", onClick: function () {
                                var g = this.parent, p = g.options;
                                g.set({ url: "ligerDialog.html", modal: true, maskClose: true });
                            }
                        },
                        {
                            text: "两秒关闭关闭", onClick: function () {
                                var g = this.parent, p = g.options;
                                g.set({ time: 1000 });
                            }
                        }
                    ]
                });

            }
        });
        $("#b7").ligerButton({
            onClick: function () {
                var obj = parent ? parent.$ : $;
                var d1 = obj.ligerDialog.open({
                    title: "我加载了百度",
                    type: null,
                    content: null,
                    slide: true,
                    showMin: false,
                    showMax: true,
                    showToggle: true,
                    minIsHide: false,
                    isResize: true,
                    width: 800,
                    height: 500,
                    modal: false,
                    url: "https://www.baidu.com/",
                    data: { title: "父窗体传值给子窗体后子窗体根据值改变标题", content: "什么" },
                    buttons: [
                        {
                            text: "修改url并传值", type: "info", onClick: function () {
                                var g = this.parent, p = g.options;
                                g.set({ url: "ligerDialog.html" });
                            }
                        },
                        {
                            text: "两秒关闭关闭", onClick: function () {
                                var g = this.parent, p = g.options;
                                g.set({ time: 2000 });
                            }
                        }
                    ]
                });

            }
        });
        $("#b9").ligerButton({
            onClick: function () {
                $("#b9").ligerHideTip();
                $("#b9").ligerTip({
                    auto: false,
                    content: '气泡',
                    width: 40
                });
            }
        });
        $(function () {
            if (frameElement && frameElement.dialog) {
                var dialog = frameElement.dialog;
                var dialogData = dialog.get('data');//获取data参数
                $("#h1").html("父窗体传值:" + liger.toJSON(dialogData));
                dialog.set('title', dialogData.title); //设置标题
            }

        });
    </script>
</body>
</html>
