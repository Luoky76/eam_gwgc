            toolbarShowInLeft: true,

                items: [
                    {
                        id: "add", text: '增加', cls: "confirmBtn commonBtn", click: function () {
                            grid.collapseAll();
                            //grid.reRender({ rowdata: grid.rows[1] });
                            //grid._setHeight("80%");
                        }, icon: "fa fa-plus"
                    },
                    {
                        id: "delete", text: '删除', cls: "confirmBtn commonBtn", click: function () {
                            grid.expandAll();
                            //grid._setWidth("30%");
                        }, icon: "fa fa-times"
                    },
                    {
                        id: "updateCache", text: '更新缓存', cls: "confirmBtn commonBtn", click: function () {
                            var row = grid.getSelectedRow();
                            if (!row) { alert('请选择行'); return; }
                            grid.beginEdit(row);
                        }, icon: "fa fa-reply-all"
                    },
                    {
                        id: "updateWeiXinMenu", text: '更新微信菜单', cls: "confirmBtn commonBtn", click: function () {

                    }

            url: 'ui/data/big-data.json',
            parms: {
                where: JSON.stringify({
                    op: 'and',
                    rules: []
                })
            },
            sortName: 'OUTDATE desc,XKOP_NO',
            sortOrder: 'asc',
            width: '100%',
            height: '100%',
            dateFormat: 'yyyy-MM-dd HH:mm',
            enabledEdit: true,
            clickToEdit: true,
            onSuccess: function (data, g) {
                return;
                if (data && data.Rows) {
                    var rows = data.Rows || [];
                    var names = [];
                    var names2 = [];
                    var array = [];
                    for (var i = rows.length - 1; i >= 0; i--) {
                        var item = rows[i];
                        item.QUICKFLAG = item.QUICKFLAG || "0";
                        item.PID = item.LOCATION.substr(0, 4);
                        if ($.inArray(item.PID, names) === -1) {
                            names.push(item.PID);
                            var pid = item.PID.substr(0, 2);
                            rows.push($.extend(true, {}, item, { LOCATION: item.PID, PID: pid }));
                            if ($.inArray(pid, names2) === -1) {
                                names2.push(pid);
                                rows.push($.extend(true, {}, item, { LOCATION: pid, PID: "" }));
                            }
                        }
                    }
                    data.Total = rows.length;
                }
            }
        });
