
<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title> 明细</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <form id="mainform">
    </form>
    <script type="text/javascript">
        'use strict';
        var business = {
            dialogData: {},
            isView: true,
            sid: getQueryStringByName("sid"),
            dataCorp: [],
            setConfig: function () {
                var me = this;
                me.config = {
                    form: {
                        fields: [
                            { display: "记录状态", name: "AUDITING", newline: false, upper: true, type: "text", editor: { disabled: true }, options: {} },
                            { display: "变动单号", name: "VARY_CODE", newline: false, upper: true, type: "text", editor: { disabled: true }, options: {} },
                            { display: "登记人", name: "EIDT_USER", newline: false, upper: true, type: "text", editor: { disabled: true }, options: {} },
                            { display: "调出使用部门", name: "DEPT_NAME", newline: false, upper: true, type: "text", validate: { required: true }, options: {} },
                            { display: "调入使用部门", name: "WDEPT_NAME", newline: false, upper: true, type: "text", validate: { required: true }, options: {} },
                            { display: "申请日期", name: "APPLY_DATE", newline: false, upper: true, type: "date", validate: { required: true }, options: {} },
                            { display: "变动完成日期", name: "VARY_DATE", newline: false, upper: true, type: "date", editor: { disabled: true }, options: {} },
                            { display: "变动类型", name: "VARY_TYPE", newline: false, upper: true, type: "select", options: { data: me.varytype }, validate: { required: true } },
                            { display: "设备总原值", name: "SUM_ORG_VALUE", newline: true, upper: true, type: "text", editor: { disabled: true }, options: {} },
                            { display: "设备总净值", name: "SUM_NET_VALUE", newline: false, upper: true, type: "text", editor: { disabled: true }, options: {} },
                            { display: "总已提折旧", name: "SUM_DEP_VALUE", newline: false, upper: true, type: "text", editor: { disabled: true }, options: {} },
                            { display: "变动原因", name: "REASONS", newline: true, upper: true, width: 980, type: "textarea", options: { rows: "2" }, validate: { required: true } },
                            { display: "设备技术状态", name: "TECH_STATUS", newline: true, upper: true, width: 980, type: "textarea", options: { rows: "2" } },
                            { display: "备注", name: "MEMO", newline: true, upper: true, width: 980, type: "textarea", options: { rows: "2" } },
                            { display: "主键", name: "VARY_ID", newline: false, upper: true, type: "hidden", options: {} },
                        ]
                    }
                };
            },  
            mainform: null,
            buttons: null,
            varytype: [],
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'Device/DeviceVary/ComboxData',
                    loading: '正在获取中...',
                    success: function (data) {
                        me.varytype = data.VaryType;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            loadData: function () {
                var me = this;
                if (!me.sid) {
                    me.mainform.setOrginData({});
                }
                else {
                    LG.ajax({
                        async: false,
                        url: 'Device/DeviceVary/list',
                        loading: '正在获取中...',
                        data: { id: me.sid },
                        success: function (data, message) {
                            
                            me.mainform.setOrginData(data.Rows[0]);
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                    if (me.isView) {
                        me.mainform.setReadonly(true);
                    }
                }
                me.mainform.focus();
            },
            save: function () { //保存
                var me = this;
                if ($.isEmptyObject(me.mainform.getChanges())) {
                    LG.showSuccess('无修改');
                    return;
                }
                if (!me.mainform.valid()) {
                    me.mainform.showInvalid();
                    return;
                }
                function handle(data) {
                    return data;
                }
                var data = handle(me.mainform.getData());
                var original = handle(me.mainform.getOrginData());
                var changeRow = new Object();
                if (!me.sid) {
                    changeRow["added"] = [data];
                }
                else {
                    changeRow["updated"] = [data];
                    changeRow["original"] = [original];
                }
                LG.ajax({
                    jsToken: true,
                    url: 'Device/DeviceVary/Save',
                    loading: '正在保存中...',
                    data: changeRow,
                    success: function () {
                        LG.showSuccess('保存成功', function () {
                            location.reload(true);
                        });
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            close: function (skipConfirm) {
                var me = this;
                function inner(callback) {
                    if (!skipConfirm && !$.isEmptyObject(me.mainform.getChanges())) {
                        $.ligerDialog.confirm($.ligerDefaults.GridString.isContinueByDataChanged, function (confirm) {
                            if (confirm) {
                                if (callback) callback(2);
                            }
                            else {
                                if (callback) callback(0);
                            }
                        });
                        if (callback) return callback(-1);
                        return false;
                    }
                    if (callback) return callback(1);
                    return true;
                }
                inner(function (status) {
                    if (status > 0) {
                        if (me.dialog) {
                            me.dialog.close();
                            return;
                        }
                        var win = parent || window;
                        if (win.closeCurrentTab) win.closeCurrentTab();
                        else win.close();
                    }
                });
            },
            setFormDefaultBtn: function () {
                var me = this;
                //表单底部按钮
                var buttons = [];
                if (!me.isView) {
                    buttons.push({
                        text: '重置', onclick: function () {
                            $.ligerDialog.confirm("确定重置数据吗?", function (confirm) {
                                if (confirm) {
                                    location.reload(true);
                                }
                            });
                        }
                    });
                }
                buttons.push({ text: '关闭', onclick: me.close.bind(me) });
                if (!me.isView) buttons.push({ text: '保存', onclick: me.save.bind(me) });
                LG.addFormButtons(buttons);
                me.formButtons = buttons;
            },
            setForm: function () {
                var me = this;
                me.config.form.fields.removeNull();
                var $mainform = $("#mainform")
                //搜索表单应用ligerui样式
                me.mainform = $mainform.ligerForm({
                    EnterMoveNextControl: true,
                    labelAlign: 'right',
                    space: 3,
                    validate: true,
                    fields: me.config.form.fields,
                    labelWidth: 120,
                    onAfterSetFields: function (g) {
                        me.mainform = g;
                        me.buttons = g.options.buttons;
                    }
                });
                me.setFormDefaultBtn();
            },
            init: function () {
                var me = this;
                if (frameElement && frameElement.dialog) {
                    me.dialog = frameElement.dialog;
                    me.dialogData = me.dialog.get('data') || {};
                    if (me.dialogData.callback) me.callback = me.dialogData.callback;
                    if (me.dialogData.sid) me.sid = me.dialogData.sid;
                    if (me.dialogData.isView) me.isView = me.dialogData.isView === "1";
                }
                me.isView = false;
                me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.loadData();
                return me;
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>

</html>
