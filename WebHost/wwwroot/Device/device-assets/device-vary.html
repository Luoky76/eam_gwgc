<%@ Page Language="C#" Inherits="gksyyb.Common.ViewPageBase" %>
<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title></title>
    <script src="../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <div id="mainsearch" style="width: 98%">
        <form action="" id="formsearch" class="l-form">
        </form>
    </div>
    <form action="" id="mainform">
        <div id="maingrid">
        </div>
    </form>
    <script type="text/javascript">
        'use strict';
        var rootPath = "../";
        window["encryptUrl"] = ["/Apis/"];
        var business = {
            menuNo: getQueryStringByName("MenuNo"),
            ver: getQueryStringByName("ver"),
            detailWidth: 920,
            detailHeight: 450,
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            { display: "记录状态", name: "_search_AUDITING", dbname: "AUDITING", newline: false, upper: true, type: "text",options:{} },
                            { display: "变动单号", name: "_search_VARY_CODE", dbname: "VARY_CODE", newline: false, upper: true, type: "text",options:{} },
                            { display: "申请日期", name: "_search_APPLY_DATE", dbname: "APPLY_DATE", newline: false, upper: true, type: "date",options:{} },
                            { display: "变动完成日期", name: "_search_VARY_DATE", dbname: "VARY_DATE", newline: false, upper: true, type: "date",options:{} },
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "记录状态", name: "AUDITING", width: 100, type: "text",  editor: { type: 'text'} },
                            { display: "变动单号", name: "VARY_CODE", width: 100, type: "text",  editor: { type: 'text'} },
                            { display: "登记人", name: "EIDT_USER", width: 100, type: "text",  editor: { type: 'text'} },
                            { display: "登记人ID", name: "EIDT_USERID", width: 100, type: "text",  editor: { type: 'text'} },
                            { display: "调出使用部门", name: "DEPT_NAME", width: 100, type: "text",  editor: { type: 'text'} },
                            { display: "调出使用部门ID", name: "DEPT_ID", width: 100, type: "text",  editor: { type: 'text'} },
                            { display: "调出二级单位", name: "SEC_DEPT", width: 100, type: "text",  editor: { type: 'text'} },
                            { display: "调出二级单位ID", name: "SEC_DEPTID", width: 100, type: "text",  editor: { type: 'text'} },
                            { display: "调入使用部门", name: "WDEPT_NAME", width: 100, type: "text",  editor: { type: 'text'} },
                            { display: "调入使用部门ID", name: "WDEPT_ID", width: 100, type: "text",  editor: { type: 'text'} },
                            { display: "调入二级单位", name: "WSEC_DEPT", width: 100, type: "text",  editor: { type: 'text'} },
                            { display: "调入二级单位ID", name: "WSEC_DEPTID", width: 100, type: "text",  editor: { type: 'text'} },
                            { display: "申请日期", name: "APPLY_DATE", width: 100, type: "date",  editor: { type: 'date',showTime: true,format: "yyyy-MM-dd hh:mm"} },
                            { display: "变动完成日期", name: "VARY_DATE", width: 100, type: "date",  editor: { type: 'date',showTime: true,format: "yyyy-MM-dd hh:mm"} },
                            { display: "计划启用日期", name: "PLAN_START_DATE", width: 100, type: "date",  editor: { type: 'date',showTime: true,format: "yyyy-MM-dd hh:mm"} },
                            { display: "设备总原值(元)", name: "SUM_ORG_VALUE", width: 100, type: "decimal",  editor: { type: 'decimal'} },
                            { display: "设备总净值(元)", name: "SUM_NET_VALUE", width: 100, type: "decimal",  editor: { type: 'decimal'} },
                            { display: "总已提折旧(元)", name: "SUM_DEP_VALUE", width: 100, type: "decimal",  editor: { type: 'decimal'} },
                            { display: "变卖总金额(元)", name: "SUM_ALLOT_MONEY", width: 100, type: "decimal",  editor: { type: 'decimal'} },
                            { display: "变动原因", name: "REASONS", width: 100, type: "text",  editor: { type: 'text'} },
                            { display: "设备技术状态", name: "TECH_STATUS", width: 100, type: "text",  editor: { type: 'text'} },
                            { display: "鉴定人", name: "APPRAISER", width: 100, type: "text",  editor: { type: 'text'} },
                            { display: "鉴定人ID", name: "APPRAISER_ID", width: 100, type: "text",  editor: { type: 'text'} },
                            { display: "接收单位", name: "RECEIVING", width: 100, type: "text",  editor: { type: 'text'} },
                            { display: "备注", name: "MEMO", width: 100, type: "text",  editor: { type: 'text'} },
                            { display: "鉴定结果", name: "RESULT", width: 100, type: "text",  editor: { type: 'text'} },
                            { display: "主键", name: "VARY_ID", width: 100, type: "text", validate: { required: true }, editor: { type: 'text'} },
                            { display: "变动类型", name: "VARY_TYPE", width: 100, type: "text",  editor: { type: 'text'} },
                            { display: "添加人ID", name: "ADD_USERID", width: 100, type: "text",  editor: { type: 'text'} },
                            { display: "添加时间", name: "ADD_DATE", width: 100, type: "date",  editor: { type: 'date',showTime: true,format: "yyyy-MM-dd hh:mm"} },
                            { display: "修改人ID", name: "MODIFY_USERID", width: 100, type: "text",  editor: { type: 'text'} },
                            { display: "修改时间", name: "MODIFY_DATE", width: 100, type: "date",  editor: { type: 'date',showTime: true,format: "yyyy-MM-dd hh:mm"} }
                        ]
                    }
                };
            },
            grid: null,
            searchForm: null,
            buttons: null,
            loadComboxData: function () {
                var me = this;
                var param = {
                    "Common": {},
                };
                LG.ajax({
                    async: false,
                    url: rootPath + 'Apis/Common/JsonValueMul/Get',
                    data: { "parm": JSON2.stringify(param) },
                    loading: '正在获取中...',
                    success: function (data, message) {
                        me.dataCommon = data.Common;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            setGrid: function () {
                var me = this;
                var columns = me.config.grid.columns;
                for (var i = columns.length - 1; i >= 0; i--) {
                    if (!columns[i]) columns.splice(i, 1);
                }
                me.grid = $("#maingrid").ligerGrid({
                    autoWidth: true,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    dataAction: 'server',
                    toolbar: {},
                    url: rootPath + 'Apis/DeviceVary/Get',
                    //url: rootPath + 'handler/grid.ashx',
                    parms: {
                        //"view": "device_vary",
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: 'AUDITING',
                    sortOrder: 'desc',
                    width: '100%',
                    height: '100%',
                    dateFormat: 'yyyy-MM-dd HH:mm',
                    checkbox: true,
                    enabledEdit: true,
                    clickToEdit: true,
                    onBeforeEdit: function (editParm) {
                        switch (editParm.column.name) {
                            case "":
                                if (editParm.record.__status == "add") return true;
                                else return false;
                                break;
                        }
                    },
                    onSuccess: function (data, g) {
                        if (data && data.Rows) {
                            var rows = data.Rows;
                            for (var i = 0, len = (rows || []).length; i < len; i++) {
                                rows[i].OLDVARY_ID = rows[i].VARY_ID;
                                rows[i].OLDMODIFYDATE = rows[i].MODIFYDATE;
                            }
                        }
                    },
                    rowAttrRender: function (rowdata, rowid) {
                        return "";
                    }
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "add":
                            me.add();
                            break;
                        case "modify":
                            me.modify();
                            break;
                        case "delete":
                            me.delete();
                            break;
                        case "save":
                            me.save();
                            break;
                        case "Excel":
                            $.ligerDialog.open({
                                url: rootPath + "System/Export.aspx?exporttype=xls&MenuNo=" + me.menuNo,
                                modal: true
                            });
                            break;
                        case "Word":
                            $.ligerDialog.open({
                                url: rootPath + "System/Export.aspx?exporttype=doc&MenuNo=" + me.menuNo,
                                modal: true
                            });
                            break;
                    }
                }
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            add: function () { //新增
                var me = this;
                // $.ligerDialog.open({
                //     width: detailWidth,
                //     height: detailHeight,
                //     allowClose: true,
                //     title: '[新增]',
                //     url: "Detail.aspx?MenuNo=" + me.menuNo + "&ver=" + me.ver,
                //     isHidden: false,
                //     showMax: false,
                //     showToggle: false,
                //     showMin: false,
                //     isResize: true,
                //     slide: false,
                //     onClosed: me.reload.bind(me),
                //     data: { "sid": null }
                // });
                me.grid.addEditRow({ },true);
            },
            modify: function () { //修改
                var me = this;
                var selected = me.grid.getSelectedRow();
                if (selected) {
                    var sid = selected.AUDITING;
                    $.ligerDialog.open({
                        width: me.detailWidth,
                        height: me.detailHeight,
                        allowClose: true,
                        title: '[修改]',
                        url: "Detail.aspx?MenuNo=" + me.menuNo + "&ver=" + me.ver,
                        isHidden: false,
                        showMax: false,
                        showToggle: false,
                        showMin: false,
                        isResize: true,
                        slide: false,
                        onClosed: me.reload.bind(me),
                        data: { "sid": sid }
                    });
                }
                else {
                    LG.tip('请选择行!');
                }
            },
            save: function () { //保存
                var me = this;
                if (me.grid.endEdit() != false) {
                    if (!me.grid.isDataChanged) {
                        LG.showSuccess('无修改');
                        return;
                    }
                    if (!me.grid.validChangeRows()) return false;
                    var changeRow = me.grid.getChangedRows();
                    LG.ajax({
                        jsToken: true,
                        url:rootPath + 'Apis/DeviceVary/Manager',
                        loading: '正在保存中...',
                        data: changeRow,
                        success: function () {
                            LG.showSuccess('保存成功');
                            me.grid.isDataChanged = false;
                            me.reload();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }

            },
            reload: function () { //刷新
                var me = this;
                me.buttons[0].click();
            },
            delete: function () { //删除
                var me = this;
                if (me.grid.endEdit() != false) {
                    var selected = me.grid.getSelectedRows();
                    if (selected.length > 0) {
                        $.ligerDialog.confirm('确定删除吗?', function (confirm) {
                            if (confirm) {
                                for (var i = 0, len = (selected || []).length; i < len; i++) {
                                    me.grid.deleteRow(selected[i]);
                                }
                                me.save();
                            }
                        });
                    } else {
                        LG.tip('请选择行!');
                    }
                }
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Word',
                        text: '导出Word',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-word-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            setForm: function () {
                var me = this;
                var columns = me.config.search.fields;
                for (var i = columns.length - 1; i >= 0; i--) {
                    if (!columns[i]) columns.splice(i, 1);
                }
                var $formsearch = $("#formsearch")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                    }
                });
                me.buttons[0].click(); //查询
            },
            init: function () {
                var me = this;
                me.loadComboxData();
                me.setConfig();
                me.setGrid();
                me.setForm();
                return me;
            }
        };
        business.init();
    </script>
</body>

</html>
