<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title>挑选</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <div id="mainsearch" style="width: 98%">
        <form action="" id="formsearch" class="l-form">
        </form>
    </div>
    <form id="mainform">
        <div id="maingrid" style="float: left">
        </div>
    </form>
    <script type="text/javascript">
        'use strict';
        var rootPath = "../";
        var business = {
            dialog: (frameElement && frameElement.dialog) ? frameElement.dialog : null,
            detailType: null,
            select_id: "",
            dataValue: null,
            isFirst: true,
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            { display: "设备编号", name: "_search_DEVICE_NO", dbname: "DEVICE_NO", newline: false, upper: true, type: "text", options: {} },
                            { display: "设备名称", name: "_search_DEVICE_NAME", dbname: "DEVICE_NAME", newline: false, upper: true, type: "text", options: {} }
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "DEVICE_ID", name: "DEVICE_ID", width: 100, type: "text", hide: true },
                            { display: "设备编号", name: "DEVICE_NO", width: 100, type: "text", editor: { type: 'text' } },
                            { display: "设备名称", name: "DEVICE_NAME", width: 100, type: "text", editor: { type: 'text' } },
                            { display: "设备类别", name: "TYPE_NAME", width: 100, type: "select", editor: { type: 'select', data: me.devicetype, selectBoxHeight: 100 } },
                            { display: "设备型号", name: "DEVICE_TYPE", width: 100, type: "text", editor: { type: 'text' } },
                            { display: "设备规格", name: "DEVICE_SIZE", width: 100, type: "text", editor: { type: 'text' } },
                        ]
                    }
                };
            },
            grid: null,
            searchForm: null,
            buttons: null,
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    autoWidth: true,
                    delayLoad: true,
                    usePager: false,
                    title: "设备选择",
                    columns: me.config.grid.columns,
                    dataAction: 'server',
                    toolbar: {},
                    url: 'Repair/RepairPlan/GetDevice',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: '',
                    sortOrder: '',
                    width: '100%',
                    height: '100%',
                    whenRClickToSelect: true,
                    checkbox: true,
                    enabledEdit: false,
                    //isChecked: function (rowdata) {
                    //    var me = this;
                    //    if (me.select_id == rowdata.ID) return true;
                    //    return false;
                    //}
                });
                me.grid.isValid = true;
            },
            reload: function () { //刷新
                var me = this;
                me.buttons[0].click();
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch = $("#formsearch")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                    }
                });
                me.buttons[0].click(); //查询
            },
            setFormButtons: function () {
                var me = this;
                //表单底部按钮
                var buttons = [];
                buttons.push({ text: '关闭', onclick: function () { if (me.dialog) me.dialog.close(); } });
                buttons.push({
                    text: '确定', onclick: function () {
                        var selected = me.grid.getSelectedRows();
                        if (selected.length < 1) {
                            LG.showError("请选择需要导入的设备!");
                            return
                        }
                        //if (selected.length > 1) {
                        //    LG.showError("只能选择一项任务模板!");
                        //    return
                        //}
                        if (me.dialog) me.dialog.close();
                        if (me.callback) me.callback(selected[0].ID, selected)
                    }
                });
                LG.addFormButtons(buttons);
            },
            init: function () {
                var me = this;
                if (!me.dialog) return;
                var dialogData = me.dialog.get('data'); //获取data参数
                me.detailType = dialogData.detailType;
                me.dataValue = "," + (dialogData.dataValue || "") + ",";
                me.callback = dialogData.callback;
                me.select_id = dialogData.data;
                me.setConfig();
                me.setGrid();
                me.setForm();
                me.setFormButtons();
                return me;
            }
        };
        business.init();
    </script>
</body>

</html>
