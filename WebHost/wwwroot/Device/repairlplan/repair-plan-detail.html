<!DOCTYPE html>
<html>
<head>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="chrome=1,IE=edge" />
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
    <title></title>
</head>
<body style="padding: 5px; height: 100%;">
    <form id="mainform">
    </form>
    <script type="text/javascript">
        //获取调用页面的dialog对象
        function f_init() {
            var rootPath = "../";
            var dialog = null;
            var dialogData = null;
            var callback = null;
            if (frameElement && frameElement.dialog) dialog = frameElement.dialog; //调用页面的dialog对象(ligerui对象)
            if (!dialog) return;
            dialogData = dialog.get('data'); //获取data参数
            if (dialogData) callback = dialogData.callback;
            var config = {};
            var isValid = true;

            //是否查看状态
            var sid = dialogData.sid;
            if ((sid || "0") === "0") sid = "";
            var isAddNew = (sid === "");
            var isView = dialogData.view === "1";
            var orginData = {};

            //初始化下拉框数据
            var auditingStatus = [{ "ID": "0", "TEXT": "未提交" }, { "ID": "1", "TEXT": "已提交" }];
            var maintdept = [];
            var repairtype = [];
            var repairhandtype = [];
            var shiplist = [];

            function f_loadData() {//刷新下拉数据窗口
                LG.ajax({
                    async: false,
                    url: 'Repair/RepairPlan/ComboxData',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        maintdept = data.MaintDept;
                        debugger
                        repairtype = data.RepairType;
                        repairhandtype = data.RepairDealType;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                }); 
                LG.ajax({
                    async: false,
                    url: 'Repair/RepairPlan/ShipList',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        shiplist = data;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                }); 
            }
            f_loadData();

            config.Form = {
                fields: [
                    { display: "DEVICE_ID", name: "DEVICE_ID", type: "hidden" },
                    { display: "记录状态", name: "AUDITING", newline: false, upper: true, type: "select", options: { data: auditingStatus }, group: "维修计划-设备信息" },
                    { display: "计划单号", name: "PLAN_CODE", newline: false, upper: true, type: "text", options: {} },
                    { display: "维修状态", name: "PLAN_STATE", newline: false, upper: true, type: "select", options: {} },
                    {
                        display: "船舶名称", name: "DEVICE_NAME", newline: true, upper: true, type: "select", options: {
                            data: shiplist,
                            autocomplete: true,
                            valueField: "DEVICE_ID",
                            textField: "DEVICE_NAME",
                            columns: [
                                { header: "船舶名称", name: "DEVICE_NAME", width: 100 },
                                { header: "设备编号", name: "DEVICE_NO", width: 100 },
                                { header: "使用部门", name: "DEPT_NAME", width: 100 },
                                { header: "维保部门", name: "WSEC_DEPT", width: 100 }
                            ],
                            onChangeValue: function (input, value, g) {
                                if (g.selected != undefined) {
                                    $("#DEVICE_ID").val(g.selected.DEVICE_ID);
                                    $("#DEVICE_NAME").val(g.selected.DEVICE_NAME);
                                    $("#DEVICE_NO").val(g.selected.DEVICE_NO);
                                    $("#DEPT_NAME").val(g.selected.DEPT_NAME);
                                    $("#WSEC_DEPT").val(g.selected.WSEC_DEPT);
                                    $("#ASSET_CODE").val(g.selected.ASSET_CODE);
                                    $("#DEVICE_TYPE").val(g.selected.DEVICE_TYPE);
                                }
                            }
                        }
                    },
                    { display: "船舶编号", name: "DEVICE_NO", newline: false, upper: true, type: "text", options: {} },
                    { display: "船舶型号", name: "DEVICE_TYPE", newline: false, upper: true, type: "text", options: {} },
                    { display: "资产编号", name: "ASSET_CODE", newline: true, upper: true, type: "text", options: {} },
                    { display: "使用部门", name: "DEPT_NAME", newline: false, upper: true, type: "text", options: {} },
                    { display: "维保部门", name: "WSEC_DEPT", newline: false, upper: true, type: "select", options: { data: maintdept } },
                    { display: "维修类型", name: "MAINT_TYPE", newline: true, upper: true, type: "select", options: { data: repairtype } },
                    { display: "维修处理方式", name: "DEAL_TYPE", newline: false, upper: true, type: "select", options: { data: repairhandtype } },
                    { display: "安装地点", name: "INSTALL_SITE", newline: true, width: 1380, upper: true, type: "text", options: {} },
                    { display: "故障现象描述", name: "FAULT_DESCRIBE", newline: true, width: 1380, upper: true, type: "textarea", options: { rows: "2" } },
                    { display: "备注", name: "PLAN_MEMO", newline: true, width: 1380, upper: true, type: "textarea", options: { rows: "2" } },
                    { display: "计划开工时间", name: "PLAN_START_DATE", newline: true, upper: true, type: "date", options: {}, group: "维修计划-指导确认信息" },
                    { display: "实际完工时间", name: "PLAN_END_DATE", newline: false, upper: true, type: "date", options: {} },
                    { display: "计划停机时长(H)", name: "PLAN_STOP_TIME", newline: false, upper: true, type: "text", options: {} },
                    { display: "负责人", name: "CHARGE_USER", newline: true, upper: true, type: "text", options: {} },
                    { display: "采购方式", name: "COLLECT_METHOD", newline: false, upper: true, type: "text", options: {} },
                    { display: "预估维修金额", name: "PLAN_MONEY", newline: false, upper: true, type: "text", options: {} },
                    { display: "维修内容", name: "REPAIR_MEMO", newline: true, upper: true, type: "text", options: {} }
                ]
            };
            var mainform;
            $("#mainform").ligerForm({
                //EnterMoveNextControl: true,
                labelAlign: 'right',
                space: 3,
                validate: true,
                fields: config.Form.fields,
                labelWidth: 120,
                inputWidth: 380,
                onAfterSetFields: function (g) {
                    mainform = g;
                }
            });
            f_setDefault();//设置默认值

            setFormDefaultBtn(f_cancel, isView ? null : f_save);//设置按钮


            //表单底部按钮
            function setFormDefaultBtn(cancleCallback, savedCallback) {
                //表单底部按钮
                var buttons = [];
                if (!isView) {
                    buttons.push({
                        text: '重置', onclick: function () {
                            $.ligerDialog.confirm("确定重置数据吗?", function (confirm) {
                                if (confirm) {
                                    f_clear();
                                }
                            });
                        }
                    });
                }
                if (cancleCallback) {
                    buttons.push({ text: '关闭', onclick: cancleCallback });
                }
                if (savedCallback) {
                    buttons.push({ text: '保存', onclick: savedCallback });
                }
                LG.addFormButtons(buttons);
            };

            //重置
            function f_clear() {
                mainform.reset();
                f_setDefault();
            }

            //根据表单是否改变处理是否继续操作 {1:无改变继续,2:确认继续,0:确认不继续,-1:等待确认}
            function f_canContinue(cback) {
                var data = mainform.getData();
                var updateFields = LG.getFormCombChanges(data, orginData, true);
                if (updateFields) {
                    $.ligerDialog.confirm($.ligerDefaults.GridString.isContinueByDataChanged, function (confirm) {
                        if (confirm) {
                            if (cback) cback(2);
                        }
                        else {
                            if (cback) cback(0);
                        }
                    });
                    if (cback) return cback(-1);
                    return false;
                }
                if (cback) return cback(1);
                return true;
            }

            //取消
            function f_cancel() {
                f_canContinue(function (status) {
                    if (status > 0) {
                        if (dialog) dialog.close();
                        if (callback) callback(false);
                    }
                });
            }

            //设置默认值
            function f_setDefault() {
                //f_loadData();
                if (isAddNew) {
                    $("#AUDITING").val("0")
                    delete orginData;
                    orginData = {};
                    mainform.setData(orginData);
                    var data = mainform.getData();
                    LG.getFormCombChanges(data, orginData, true);
                    delete orginData;
                    orginData = data;

                    var dicNames = ["AUDITING", "PLAN_CODE", "PLAN_STATE", "DEVICE_NO", "DEVICE_TYPE", "ASSET_CODE", "DEPT_NAME", "INSTALL_SITE",
                        "PLAN_START_DATE", "PLAN_END_DATE", "PLAN_STOP_TIME", "CHARGE_USER", "COLLECT_METHOD", "PLAN_MONEY", "REPAIR_MEMO"];

                    let count = 0;
                    for (const key in mainform.editors) {
                        var obj = mainform.editors[count];
                        if (dicNames.indexOf(obj.control.id) > -1) {
                            mainform.setEnabled(obj.control.id, false);
                        }
                        count++;
                    }
                }
                else {
                    LG.ModelAjax({
                        data: {
                            view: 'rep_plan',
                            where: JSON2.stringify({ op: 'and', rules: [{ field: 'AUDITING', value: sid, op: 'equal' }] })
                        }, success: function (data) {
                            data.OLDPLAN_ID = data.PLAN_ID;
                            data.OLDMODIFYDATE = data.MODIFYDATE;
                            delete orginData;
                            orginData = $.extend({}, data);
                            mainform.setData(data);
                            var data = mainform.getData();
                            LG.getFormCombChanges(data, orginData, true);
                            delete orginData;
                            orginData = data;
                        }
                    });
                    if (isView) {
                        mainform.setReadonly(true);
                    }
                }
                mainform.focus();
            }

            //保存
            function f_save() {
                if (!mainform.valid()) {
                    mainform.showInvalid();
                    return;
                }
                var data = mainform.getData();
                var changeRow = new Object();
                var formdata = [];
                var o_formdata = [];
                formdata.push(data);
                o_formdata.push(orginData);
                var op = isAddNew ? "added" : "updated";
                if (!isAddNew) {
                    changeRow["original"] = o_formdata;
                }
                changeRow[op] = formdata;
                debugger
                LG.ajax({
                    async: false,
                    url: 'Repair/RepairPlan/Save',
                    loading: '正在保存中...',
                    data: changeRow,
                    success: function () {
                        LG.showSuccess('保存成功', dialog.close());
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            }
        }
        f_init();
    </script>
</body>
</html>
