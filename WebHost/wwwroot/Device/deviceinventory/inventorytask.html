<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title>设备盘点任务</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <div id="mainsearch" style="width: 98%">
        <form action="" id="formsearch" class="l-form">
        </form>
    </div>
    <form action="" id="mainform">
        <div id="maingrid">
        </div>
    </form>
    <script type="text/javascript">
        'use strict';
        var rootPath = "../";
        window["encryptUrl"] = ["/Apis/"];
        var business = {
            menuNo: getQueryStringByName("MenuNo"),
            ver: getQueryStringByName("ver"),
            dataCheck: [{ "ID": "0", "TEXT": "未提交" }, { "ID": "1", "TEXT": "已提交" }],
            peopleData: [],
            scanStatus: [],
            deviceType: [],
            secDept: [],
            deptData: [],
            userid: null,
            detailWidth: 920,
            detailHeight: 450,
            alreadySubmitted: false,
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            { display: "记录状态", name: "_search_AUDITING", dbname: "AUDITING", newline: false, upper: true, type: "select", options: { data: me.dataCheck } },
                            { display: "盘点单号", name: "_search_SCAN_CODE", dbname: "SCAN_CODE", newline: false, upper: true, type: "text", options: {} },
                            { display: "盘点状态", name: "_search_STATUS", dbname: "STATUS", newline: false, upper: true, type: "select", options: { data: me.scanStatus } },

                        ]
                    },
                    grid: {
                        columns: [
                            {
                                display: "记录状态", name: "AUDITING", labelWidth: 100, width: 300, newline: true, type: "select", format: { data: me.dataCheck }
                            },
                            { display: "盘点单号", name: "SCAN_CODE", minWidth: 120, type: "text" },
                            {
                                display: "盘点状态", name: "STATUS", minWidth: 100, type: "select", format: { data: me.scanStatus }
                            },
                            {
                                display: "盘点部门", name: "DEPT_ID", minWidth: 120, type: "select", validate: { required: true },
                                editor: {
                                    type: 'select',
                                    data: me.deptData,
                                    onChange: function (rowdata, rowIndex) {
                                        if (rowdata.value) {
                                            for (var i = 0; i < me.deptData.length; i++) {
                                                if (rowdata.value == me.deptData[i].ID) {
                                                    debugger
                                                    liger.get("maingrid").updateCell("DEPT_NAME", me.deptData[i].TEXT, rowdata.record);
                                                    liger.get("maingrid").updateCell("DEPT_CODE", me.deptData[i].VALUE, rowdata.record);
                                                    break;
                                                }
                                            }
                                        } else {
                                            liger.get("maingrid").updateCell("DEPT_NAME", "", rowdata.record);
                                            liger.get("maingrid").updateCell("DEPT_CODE", "", rowdata.record);
                                        }
                                    },
                                }
                            },
                            {
                                display: "设备类别", name: "TYPE_ID", minWidth: 100, type: "select",
                                editor: {
                                    type: 'select',
                                    data: me.deviceType,
                                    onChange: function (rowdata, rowIndex) {
                                        if (rowdata.value) {
                                            var selectedType = me.deviceType.find(type => type.ID == rowdata.value);
                                            liger.get("maingrid").updateCell("TYPE_NAME", selectedType.TEXT, rowdata.record);
                                        } else {
                                            liger.get("maingrid").updateCell("TYPE_NAME", "", rowdata.record);
                                        }
                                    },
                                },
                            },
                            {
                                display: "盘点人", name: "USER_ID", minWidth: 100, type: "select", validate: { required: true },
                                editor: {
                                    type: 'select',
                                    data: me.peopleData,
                                    valueField: "Id",
                                    textField: "Name",
                                    onChange: function (rowdata, rowIndex) {
                                        if (rowdata.value) {
                                            for (var i = 0; i < me.peopleData.length; i++) {
                                                if (rowdata.value == me.peopleData[i].Id) {
                                                    liger.get("maingrid").updateCell("USER_NAME", me.peopleData[i].Name, rowdata.record);
                                                    break;
                                                }
                                            }
                                        } else {
                                            liger.get("maingrid").updateCell("USER_NAME", "", rowdata.record);
                                        }
                                    },
                                },
                            },
                            { display: "盘点日期", name: "SCAN_DATE", minWidth: 100, type: "date", editor: { type: 'date', showTime: true, format: "yyyy-MM-dd hh:mm" } },
                            {
                                display: "二级单位", name: "SEC_DEPT", minWidth: 150, type: "text"
                            },
                            { display: "备注", name: "MEMO", minWidth: 300, type: "text", editor: { type: 'text' } },

                            { display: "盘点部门编码", name: "DEPT_CODE", minWidth: 100, type: "text", editor: { type: 'text' }, hide: true },
                            { display: "二级单位ID", name: "SEC_DEPTID", minWidth: 100, type: "text", editor: { type: 'text' }, hide: true },
                            { display: "标识", name: "IDENT", minWidth: 100, type: "text", editor: { type: 'text' }, hide: true },
                            { display: "主键", name: "SCAN_ID", minWidth: 100, type: "text", hide: true },
                            { display: "盘点人", name: "USER_NAME", width: 100, type: "text", hide: true },
                            { display: "盘点部门", name: "DEPT_NAME", width: 100, type: "text", hide: true },
                            { display: "盘点部门编码", name: "DEPT_CODE", width: 100, type: "text", hide: true },
                            { display: "设备类别", name: "TYPE_NAME", width: 100, type: "text", hide: true },

                        ]
                    }
                };
            },
            grid: null,
            searchForm: null,
            buttons: null,
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'Device/InventoryTask/ComboxData',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        me.scanStatus = data.scanStatus;
                        me.deviceType = data.deviceType;
                        me.deptData = data.deptData;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
                LG.ajax({
                    async: false,
                    url: 'Popup/Users',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        me.peopleData = data;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            setGrid: function () {
                var me = this;
                var columns = me.config.grid.columns;
                for (var i = columns.length - 1; i >= 0; i--) {
                    if (!columns[i]) columns.splice(i, 1);
                }
                me.grid = $("#maingrid").ligerGrid({
                    autoWidth: true,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    //dataAction: 'server',
                    toolbar: {},
                    url: 'Device/InventoryTask/GetDeviceScanList',
                    //url: rootPath + 'handler/grid.ashx',
                    parms: {
                        //"view": "ILLEGAL_NOTES",
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    width: '100%',
                    height: '100%',
                    dateFormat: 'yyyy-MM-dd HH:mm',
                    checkbox: true,
                    enabledEdit: true,
                    clickToEdit: true,
                    onBeforeEdit: function (editParm) {
                        if (editParm.record.__status == "nochanged") {
                            if (editParm.record.AUDITING == "1") return false;
                            else return true;
                        }
                        switch (editParm.column.name) {
                            case "":
                                if (editParm.record.__status == "add") return true;
                                else return false;
                                break;
                        }
                    },
                    onSuccess: function (data, g) {
                    },
                    rowAttrRender: function (rowdata, rowid) {
                        return "";
                    }
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "add":
                            me.add();
                            break;
                        case "delete":
                            me.delete();
                            break;
                        case "makescanlist":
                            me.makescanlist();
                            break;
                        case "save":
                            me.save();
                            break;
                        case "submit":
                            me.submit();
                            break;
                        case "checkscandet":
                            me.checkscandet();
                            break;
                        case "Excel":
                            $.ligerDialog.open({
                                url: "../../../System/Export.html?exporttype=xls&MenuNo=" + me.menuNo,
                                modal: true
                            });
                            break;
                        case "Word":
                            $.ligerDialog.open({
                                url: "../../../System/Export.html?exporttype=xls&MenuNo=" + me.menuNo,
                                modal: true
                            });
                            break;
                    }
                }
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            add: function () { //新增
                var me = this;
                // $.ligerDialog.open({
                //     width: detailWidth,
                //     height: detailHeight,
                //     allowClose: true,
                //     title: '[新增]',
                //     url: "Detail.aspx?MenuNo=" + me.menuNo + "&ver=" + me.ver,
                //     isHidden: false,
                //     showMax: false,
                //     showToggle: false,
                //     showMin: false,
                //     isResize: true,
                //     slide: false,
                //     onClosed: me.reload.bind(me),
                //     data: { "sid": null }
                // });
                me.grid.addEditRow({});
                me.grid._applyEditor.ligerDefer(me.grid, 200, [me.grid.getCellObj(0, 1)]);
            },
            save: function () { //保存
                var me = this;
                if (me.grid.endEdit() != false) {
                    if (!me.grid.isDataChanged) {
                        LG.showSuccess('无修改');
                        return;
                    }
                    if (!me.grid.validChangeRows()) return false;
                    var changeRow = me.grid.getChangedRows();
                    debugger
                    if (changeRow.updated.length > 0) {
                        $.ligerDialog.confirm('保存后将删除之前生成的盘点清单，需再次点击生成盘点清单！', function (confirm) {
                            if (confirm) {
                                LG.ajax({
                                    jsToken: true,
                                    url: 'Device/InventoryTask/ManageDeviceScan',
                                    loading: '正在保存中...',
                                    data: changeRow,
                                    success: function () {
                                        LG.showSuccess('保存成功');
                                        me.grid.isDataChanged = false;
                                        me.reload();
                                    },
                                    error: function (message) {
                                        LG.showError(message);
                                    }
                                });
                            }
                        });
                    }
                    else {
                        LG.ajax({
                            jsToken: true,
                            url: 'Device/InventoryTask/ManageDeviceScan',
                            loading: '正在保存中...',
                            data: changeRow,
                            success: function () {
                                LG.showSuccess('保存成功');
                                me.grid.isDataChanged = false;
                                me.reload();
                            },
                            error: function (message) {
                                LG.showError(message);
                            }
                        });
                    }
                }

            },

            makescanlist: function () {    //生成盘点清单
                var me = this;
                var rows = me.grid.getSelectedRows();
                if (rows.length > 1) {
                    LG.showError("不能选择多行")
                    return
                } else if (rows.length == 0) {
                    LG.showError("请选择一行")
                    return
                }
                var selected = me.grid.getSelectedRow();
                if (selected) {
                    if (selected.AUDITING == "1") {
                        LG.tip('只能生成未提交的数据!');
                    }
                    else {
                        LG.ajax({
                            jsToken: true,
                            url: 'Device/InventoryTask/MakeScanList',
                            loading: '正在生成盘点清单中...',
                            data: { "sid": selected.SCAN_ID, "deptid": selected.DEPT_ID, "typeid": selected.TYPE_ID },
                            success: function () {
                                LG.showSuccess('生成盘点清单成功');
                                me.grid.isDataChanged = false;
                                me.reload();
                            },
                            error: function (message) {
                                LG.showError(message);
                            }
                        });
                    }
                }
            },

            submit: function () {    //提交
                var me = this;
                var selected = me.grid.getSelectedRows();
                if (selected.length !== 1) {
                    LG.tip('请选择且仅选择一行！');
                }
                else {
                    if (selected[0].AUDITING == "1") {
                        LG.tip('已提交！');
                    }
                    else {
                        var sids = [];
                        selected.forEach((a) => {
                            sids.push(a.SCAN_ID)
                        })
                        LG.ajax({
                            jsToken: true,
                            url: 'Device/InventoryTask/Submit',
                            loading: '正在提交中...',
                            data: { "sids": sids },
                            success: function () {
                                LG.showSuccess('提交成功');
                                me.grid.isDataChanged = false;
                                me.reload();
                            },
                            error: function (message) {
                                LG.showError(message);
                            }
                        });
                    }
                }
            },
            checkscandet: function (rowdata) { //查看盘点任务明细
                var me = this;
                var rows = me.grid.getSelectedRows();
                if (rows.length > 1) {
                    LG.showError("不能选择多行")
                    return
                } else if (rows.length == 0) {
                    LG.showError("请选择一行")
                    return
                }
                var selected = me.grid.getSelectedRow();
                if (rowdata) {
                    selected = rowdata;
                }
                if (selected) {
                    $.ligerDialog.open({
                        width: 1100,
                        height: 620,
                        allowClose: true,
                        title: '查看盘点任务明细',
                        url: "inventscan-det.html?MenuNo=" + me.menuNo,
                        isHidden: false,
                        showMax: false,
                        showToggle: false,
                        showMin: false,
                        isResize: true,
                        slide: false,
                        onClosed: me.buttons[0].click,
                        data: { "sid": selected.SCAN_ID }
                    });


                } else {
                    LG.tip('请选择行!');
                }
            },
            reload: function () { //刷新
                var me = this;
                me.buttons[0].click();
            },
            delete: function () { //删除
                var me = this;
                if (me.grid.endEdit() != false) {
                    var selected = me.grid.getSelectedRows();
                    if (selected.length > 0) {
                        if (selected[0].AUDITING == "1") {
                            LG.tip('已提交，无法删除!');
                        }
                        else {
                            $.ligerDialog.confirm('确定删除吗?', function (confirm) {
                                if (confirm) {
                                    for (var i = 0, len = (selected || []).length; i < len; i++) {
                                        me.grid.deleteRow(selected[i]);
                                    }

                                    me.save();
                                }
                            });
                        }
                    } else {
                        LG.tip('请选择行!');
                    }
                }
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Word',
                        text: '导出Word',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-word-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            setForm: function () {
                var me = this;
                var columns = me.config.search.fields;
                for (var i = columns.length - 1; i >= 0; i--) {
                    if (!columns[i]) columns.splice(i, 1);
                }
                var $formsearch = $("#formsearch")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                    }
                });
                me.buttons[0].click(); //查询
            },
            init: function () {
                var me = this;
                me.loadComboxData();
                me.setConfig();
                me.setGrid();
                me.setForm();
                return me;
            }
        };
        business.init();
    </script>
</body>

</html>
