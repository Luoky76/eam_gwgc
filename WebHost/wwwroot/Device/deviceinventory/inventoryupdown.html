
<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title></title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <div id="mainsearch" style="width: 98%">
        <form action="" id="formsearch" class="l-form">
        </form>
    </div>
    <form action="" id="mainform">
        <div id="maingrid">
        </div>
    </form>
    <script type="text/javascript">
        'use strict';
        var business = {
            status: [],
            dataCheck: [{ "ID": "0", "TEXT": "未提交" }, { "ID": "1", "TEXT": "已提交" }],
            scanresult: [{ "ID": "盘盈", "TEXT": "盘盈" }, { "ID": "盘亏", "TEXT": "盘亏" }],
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            { display: "记录状态", name: "_search_AUDITING", dbname: "AUDITING", newline: false, upper: true, type: "select", options: { data: me.dataCheck } },
                            { display: "盘点单号", name: "_search_SCAN_CODE", dbname: "SCAN_CODE", newline: false, upper: true, type: "text", options: {} },
                            {
                                display: "盘点日期", name: "_search_SCAN_DATE", dbname: "SCAN_DATE", newline: false, type: "date", op: 'greaterorequal', vt: 'date',
                                options: {
                                    format: "yyyy-MM-dd"
                                }
                            },
                            {
                                display: "至", name: "_search_SCAN_DATE", dbname: "SCAN_DATE",  newline: false, type: "date", op: 'lessorequal', vt: 'date',
                                options: {
                                    format: "yyyy-MM-dd"
                                }
                            },
                            { display: "盘点结果类型", name: "_search_SCAN_TYPE", dbname: "SCAN_TYPE", newline: false, upper: true, type: "select", options: { data: me.scanresult } },
                            { display: "设备编号", name: "_search_DEVICE_NO", dbname: "DEVICE_NO", newline: false, upper: true, type: "text", options: {} },
                            { display: "设备名称", name: "_search_DEVICE_NAME", dbname: "DEVICE_NAME", newline: false, upper: true, type: "text", options: {} },
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "已提交", name: "AUDITING", width: 100, type: "chk" },
                            { display: "盘点单号", name: "SCAN_CODE", width: 100, type: "text", },
                            { display: "盘点日期", name: "SCAN_DATE", width: 100, type: "date", },
                            { display: "盘点结果类型", name: "SCAN_TYPE", width: 100, type: "text" },
                            { display: "设备编号", name: "DEVICE_NO", width: 100, type: "text" },
                            { display: "设备名称", name: "DEVICE_NAME", width: 100, type: "text" },
                            { display: "使用部门", name: "DEPT_NAME", width: 100, type: "text" },
                            { display: "二级单位", name: "SEC_DEPT", width: 100, type: "text" },
                            /*{ display: "设备型号", name: "DEVICE_TYPE", width: 100, type: "text" },
                            { display: "设备类别", name: "TYPE_NAME", width: 100, type: "text"},*/
                            { display: "当前管理状态", name: "STATUS", width: 100, type: "select", format: { data: me.status } },
                            {
                                display: "结果说明", name: "RESULT_MEMO", minWidth: 200, type: "text",validate: { required: true },
                                editor: {
                                    type: 'text',
                                }
                            },
                            { display: "备注", name: "MEMO", minWidth: 200, type: "text" },
                        ]
                    }
                };
            },
            grid: null,
            searchForm: null,
            buttons: null,
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'Device/InventoryTask/ComboxData',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        me.status = data.status;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    autoWidth: true,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    usePager: false,
                    dataAction: 'local',
                    toolbar: {},
                    url: 'Device/InventoryTask/GetUpDownList',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    //sortName: 'AUDITING',
                    //sortOrder: 'asc',
                    width: '98%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: true,
                    clickToEdit: true,
                    onBeforeEdit: function (editParm) {
                        if (editParm.record.__status == "nochanged") {
                            if (editParm.record.AUDITING == "1") return false;
                            else return true;
                        }
                        switch (editParm.column.name) {
                            case "":
                                if (editParm.record.__status == "add") return true;
                                else return false;
                                break;
                        }
                    },
                    onSuccess: function (data, g) {
                        if (data && data.Rows) {
                            var rows = data.Rows || [];
                            for (var i = 0, len = rows.length; i < len; i++) {
                                var row = rows[i];
                                row.OLDROLEID = row.ROLEID;
                            }
                        }
                    },
                    rowAttrRender: function (rowdata, rowid) {
                        return "";
                    }
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "submit":
                            me.submit();
                            break;
                        case "Excel":
                            $.ligerDialog.open({
                                url: "../../../System/Export.html?exporttype=xls",
                                modal: true
                            });
                            break;
                        case "Word":
                            $.ligerDialog.open({
                                url: "../../../System/Export.html?exporttype=doc",
                                modal: true
                            });
                            break;
                    }
                }
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            submit: function () {    //提交
                var me = this;
                var selected = me.grid.getSelectedRows();
                if (selected.length !== 1) {
                    LG.tip('请选择且仅选择一行！');
                }
                else {
                    if (selected[0].AUDITING != "0") {
                        LG.tip('无法提交！');
                    } else {
                        if (me.grid.endEdit() != false) {
                            if (!me.grid.isDataChanged) {
                                LG.showSuccess('请先填写结果说明！');
                                return;
                            }
                            if (!me.grid.validChangeRows()) return false;
                            var changeRow = me.grid.getChangedRows();
                            LG.ajax({
                                jsToken: true,
                                url: 'Device/InventoryTask/ManageUpDown',
                                loading: '正在保存中...',
                                data: changeRow,
                                success: function () {
                                    LG.showSuccess('保存成功');
                                    me.grid.isDataChanged = false;
                                    me.reload();
                                },
                                error: function (message) {
                                    LG.showError(message);
                                }
                            });
                        }
                    }
                }
            },

            reload: function () { //刷新
                var me = this;
                me.buttons[0].click();
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Word',
                        text: '导出Word',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-word-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch = $("#formsearch")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                    }
                });
            },
            init: function () {
                var me = this;
                me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.setGrid();
                me.reload();
                return me;
            }
        };
        business.init();
    </script>
</body>
</html>
