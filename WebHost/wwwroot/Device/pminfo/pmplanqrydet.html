<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title>维保查询明细</title>
    <script src="../../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%; overflow:auto;">
    <form id="mainform" style="width:97%;">
    </form>
    <div style="margin-bottom: 5px; width: 98%;" id="paramform">
    </div>
    <div style="width: 94.5%;" class="l-form">
        <div class="l-form-container">
            <div class="l-group" style="width: 100%;"><span>保养实施明细</span></div>
            <ul style="display: block; width: 100%;" id="ulGrid">
                <li style=" width: 100%;">
                    <div style="margin-bottom: 50px; width: 100%;" id="plandetgird">
                    </div>
                </li>
            </ul>
            <div class="l-group" style="width: 100%;"><span>物资明细</span></div>
            <ul style="display: block; width: 100%;" id="ulGrid">
                <li style=" width: 100%;">
                    <div style="margin-bottom: 50px; width: 100%;" id="spgird">
                    </div>
                </li>
            </ul>
            <div class="l-group" style="width: 100%;"><span>人员明细</span></div>
            <ul style="display: block; width: 100%;" id="ulGrid">
                <li style=" width: 100%;">
                    <div style="margin-bottom: 50px; width: 100%;" id="pepgird">
                    </div>
                </li>
            </ul>
        </div>
    </div>
    <script type="text/javascript">
        'use strict';
        var business = {
            menuNo: getQueryStringByName("MenuNo"),
            dialogData: {},
            sid: getQueryStringByName("sid"),
            isAddNew: false,
            isView: false,
            auditing: [{ "ID": "1", "TEXT": "已提交" }, { "ID": "0", "TEXT": "未提交" }],
            complete: [{ "ID": "1", "TEXT": "已完成" }, { "ID": "0", "TEXT": "未完成" }],
            bySource: [],
            pmType: [],
            deviceInfo: [],
            maintDept: [],
            workState: [],
            btime: null,
            etime: null,
            maintCycle: [],
            planMonth: [{ "ID": "1", "TEXT": "一月" }, { "ID": "2", "TEXT": "二月" }, { "ID": "3", "TEXT": "三月" }, { "ID": "4", "TEXT": "四月" }, { "ID": "5", "TEXT": "五月" }
                , { "ID": "6", "TEXT": "六月" }, { "ID": "7", "TEXT": "七月" }, { "ID": "8", "TEXT": "八月" }, { "ID": "9", "TEXT": "九月" }, { "ID": "10", "TEXT": "十月" }
                , { "ID": "11", "TEXT": "十一月" }, { "ID": "12", "TEXT": "十二月" }],
            stdLevel: [{ "ID": "临时保养", "TEXT": "临时保养" }, { "ID": "定期保养", "TEXT": "定期保养" }],
            isLose: [{ "ID": "1", "TEXT": "是" }, { "ID": "0", "TEXT": "否" }],
            setConfig: function () {
                var me = this;
                me.config = {
                    form: {
                        labelwidth: 220,
                        fields: [
                            //基础信息
                            { display: "记录状态", name: "AUDITING_EXE", newline: false, upper: true, type: "select", options: { data: me.auditing }, editor: { disabled: true }, group: "基础信息" },
                            { display: "保养实施单号", name: "EXE_CODE", newline: false, upper: true, editor: { disabled: true }, type: "text", options: {} },
                            { display: "保养计划单号", name: "PLAN_CODE", newline: false, upper: true, editor: { disabled: true }, type: "text", options: {} },
                            { display: "保养来源", name: "SOURCE", newline: false, upper: true, type: "select", editor: { disabled: true }, options: { data: me.bySource, } },
                            {
                                display: "设备名称", name: "DEVICE_ID", dbname: "DEVICE_ID", width: 180, type: "select", align: "left", editor: { disabled: true },
                                options: {
                                    data: me.deviceInfo,
                                }
                            },
                            { display: "设备名称", name: "DEVICE_NAME", newline: false, upper: true, type: "hidden", options: {} },
                            { display: "设备编号", name: "DEVICE_CODE", newline: false, upper: true, editor: { disabled: true }, options: {} },
                            { display: "设备型号", name: "DEVICE_TYPE", newline: false, upper: true, editor: { disabled: true }, options: {} },
                            { display: "资产编号", name: "ASSET_CODE", newline: false, upper: true, type: "text", editor: { disabled: true }, options: {} },
                            { display: "安装地点", name: "INSTALL_SITE", newline: false, upper: true, type: "text", editor: { disabled: true }, options: {} },
                            //{ display: "维护类别", name: "PM_TYPE", newline: false, upper: true, type: "select", editor: { disabled: true }, options: { data: me.pmType } },

                            //{ display: "计划编制日期", name: "EDIT_DATE", newline: false, upper: true, type: "date", editor: { disabled: true }, options: {} },
                            { display: "计划完成时间", name: "PLAN_FINISH_TIME", newline: false, upper: true, editor: { disabled: true }, type: "date", options: {} },
                            { display: "计划编制人", name: "EDIT_USER", newline: false, upper: true, type: "text", editor: { disabled: true }, options: {} },

                            { display: "使用部门", name: "DEPT_NAME", newline: false, upper: true, type: "text", editor: { disabled: true }, options: {} },
                            {
                                display: "维保部门", name: "WDEPT_ID", newline: false, upper: true, type: "select", editor: { disabled: true }, options: {
                                    data: me.maintDept,
                                }
                            },
                            { display: "维保部门", name: "SHIP_DEPT", newline: false, upper: true, type: "hidden", options: {} },
                            { display: "保养负责人", name: "EXE_USER", newline: false, upper: true, type: "text", editor: { disabled: true }, options: {} },
                            { display: "是否有遗留问题", name: "IS_LOSE", newline: false, upper: true, type: "select", options: { data: me.isLose }, validate: { required: true }, },
                            { display: "遗留问题描述", name: "LEG_DESC", newline: true, upper: true, width: 775, type: "textarea", options: {} },
                            { display: "备注", name: "MEMO", newline: true, upper: true, width: 775, type: "textarea", options: {} },



                            { display: "保养开始时间", name: "BEGIN_DATE", newline: false, upper: true, type: "date", options: {}, validate: { required: true }, group: "实施信息" },
                            { display: "保养结束时间", name: "END_DATE", newline: false, upper: true, type: "date", options: {}, validate: { required: true }, },


                            //隐藏
                            { display: "主键", name: "EXE_ID", newline: false, upper: true, type: "hidden", options: {} },]
                    },
                    grid: {
                        columns: [
                            { display: "完成情况", name: "COMPLETE", newline: false, upper: true, type: "select", minWidth: 100, validate: { required: true }, editor: { type: 'select', data: me.complete } },
                            {
                                display: "附件材料", name: "attach_id", dbname: "attach_id", width: 90, type: "text",
                                render: function (rowdata, index, value) {
                                    if (value != "0") {
                                        return '<a href="javascript:void(0)" onclick="business.f_rowAttachManage(\'' + rowdata.MAINKEY + '\')"><span class="badge">' + value + '</span></i></a>';
                                    } else {
                                        return '-';
                                    }
                                }
                            },
                            {
                                display: "附件材料", name: "attach_id", dbname: "attach_id", width: 90, type: "text",
                                render: function (rowdata, index, value) {
                                    if (value != "0") {
                                        return '<a href="javascript:void(0)" onclick="business.f_rowAttachManage(\'' + rowdata.MAINKEY + '\')"><span class="badge">' + value + '</span></i></a>';
                                    } else {
                                        return '-';
                                    }
                                }
                            },
                            { display: "标准编号", name: "STD_CODE", minWidth: 100, type: "text", },
                            { display: "保养项目", name: "OBJECT_NAME", minWidth: 150, type: "text", },
                            { display: "保养内容", name: "CONTENT", minWidth: 250, type: "text", },
                            { display: "保养类型", name: "STD_LEVEL", minWidth: 100, type: "select", },
                            { display: "作业时设备状态", name: "WORK_STATE", minWidth: 140, type: "select", },
                            { display: "保养周期", name: "MAINT_CYCLE", minWidth: 100, type: "select", },
                            { display: "计划保养月份", name: "PLAN_MONTH", minWidth: 100, type: "text", type: "select", },
                            { display: "上次完成时间", name: "LAST_COMP_DATE", minWidth: 100, type: "date", },
                            { display: "下次保养截止日期", name: "NEXT_ENDDATE", minWidth: 100, type: "date", },
                            { display: "执行岗位", name: "EXE_USER", minWidth: 100, type: "text", },
                            { display: "执行人", name: "EXECUTE_USER", minWidth: 100, type: "text", validate: { required: true }, editor: { type: 'text' } },
                            { display: "检查岗位", name: "CHK_USER", minWidth: 100, type: "text", },
                            { display: "检查人", name: "CHECK_USER", minWidth: 100, type: "text", validate: { required: true }, editor: { type: 'text' } },
                            { display: "备注", name: "MEMO", minWidth: 300, type: "text", },
                            { display: "主键", name: "DONEITEM_ID", minWidth: 100, hide: true },
                            { display: "计划ID", name: "EXE_ID", width: 100, hide: true },

                        ]
                    },
                    grid2: {
                        columns: [
                            { display: "来源", name: "SP_SOURCE", minWidth: 100, type: "text", },
                            { display: "备件品种编码", name: "SP_CODE", minWidth: 100, type: "text", },
                            { display: "备件品种名称", name: "SP_NAME", minWidth: 100, type: "text", },
                            { display: "备件型号", name: "SP_TYPE", minWidth: 100, type: "text", },

                            { display: "仓库名称", name: "HOUSE_NAME", minWidth: 100, type: "text", },
                            { display: "库位名称", name: "STOCK_NAME", minWidth: 100, type: "text", },
                            { display: "库存数量", name: "CUR_NUM", minWidth: 100, type: "float", },
                            { display: "实际消耗数量", name: "REAL_OUT_NUM", minWidth: 100, validate: { required: true }, type: "float", editor: { type: 'float' } },
                            { display: "计量单位", name: "UNIT", minWidth: 100, type: "text", },
                            { display: "制造厂", name: "FACTORY", minWidth: 100, type: "text" },
                            { display: "主键", name: "FAULT_SP_ID", minWidth: 100, hide: true },
                            { display: "外键", name: "EXE_ID", minWidth: 100, hide: true },

                        ]
                    },
                    grid3: {
                        columns: [
                            { display: "人员姓名", name: "USER_NAME", minWidth: 200, type: "text", editor: { type: 'text' } },
                            { display: "人员ID", name: "LABOR_ID", minWidth: 100, hide: true },
                            { display: "工时(H)", name: "PLAN_DATE", minWidth: 200, validate: { required: true }, type: "float", editor: { type: 'float' } },
                            { display: "备注", name: "MEMO", minWidth: 300, type: "text", editor: { type: 'text' } },
                            { display: "主键", name: "PLAN_LABOR_ID", width: 100, hide: true },
                            { display: "外键", name: "EXE_ID", width: 100, hide: true },
                            { display: "外键", name: "DONEITEM_ID", width: 100, hide: true },

                        ]
                    },
                };
            },
            mainform: null,
            buttons: null,/*
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'Device/PmInfo/ComboxData',
                    loading: '正在获取中...',
                    success: function (data, message) {
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },*/
            loadData: function () {
                var me = this;
                function inner() {
                    var data = me.mainform.getData();
                    LG.getFormCombChanges(data, me.orginData, true);
                    delete me.orginData;
                    me.orginData = data;
                }
                if (me.isAddNew) {
                    me.mainform.setData({ AUDITING_B: "0", FAULT_STATUS: "30", FAULT_SRC: "10", DISPOSE_TYPE: "20" });
                    inner();
                }
                else {
                    LG.ajax({
                        async: false,
                        url: 'Device/PmInfo/GetFaultExeListDetail',
                        loading: '正在获取中...',
                        data: { id: me.sid },
                        success: function (data, message) {
                            data.OLDMODIFYDATE = data.MODIFYDATE;
                            me.mainform.setData(data);
                            inner();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                    if (me.isView) {
                        me.mainform.setReadonly(true);
                    }
                }
                var input = me.mainform.getEditor(me.config.form.fields[0].name).inputText;
                input.focus();
                input.select();
            },
            close: function () {
                var me = this;
                function inner(callback) {
                    var data = me.mainform.getData();
                    var updateFields = LG.getFormCombChanges(data, me.orginData, true);
                    if (updateFields) {
                        $.ligerDialog.confirm($.ligerDefaults.GridString.isContinueByDataChanged, function (confirm) {
                            if (confirm) {
                                if (callback) callback(2);
                            }
                            else {
                                if (callback) callback(0);
                            }
                        });
                        if (callback) return callback(-1);
                        return false;
                    }
                    if (callback) return callback(1);
                    return true;
                }
                inner(function (status) {
                    if (status > 0) {
                        if (me.dialog) me.dialog.close();
                        if (me.callback) me.callback(false);
                    }
                });
            },
            setFormDefaultBtn: function (cancleCallback, savedCallback) {
                var me = this;
                //表单底部按钮
                var buttons = [];
                buttons.push({ text: '关闭', icon: 'fa fa-window-close', onclick: me.close.bind(me) });
                if (!me.isView) buttons.push({ text: '保存', icon: 'fa fa-save', onclick: me.save.bind(me) });

                LG.addFormButtons(buttons);
                me.formButtons = buttons;
            },
            setForm: function () {
                var me = this;
                me.config.form.fields.removeNull();
                var $formsearch = $("#mainform")
                //搜索表单应用ligerui样式
                me.mainform = $formsearch.ligerForm({
                    EnterMoveNextControl: true,
                    labelAlign: 'right',
                    space: 3,
                    validate: true,
                    fields: me.config.form.fields,
                    labelWidth: 120,
                    onAfterSetFields: function (g) {
                        me.mainform = g;
                        me.buttons = g.options.buttons;
                    }
                });
                me.setFormDefaultBtn();
            },
            //物料消耗明细
            grid2: null,
            setGrid2: function () {
                var me = this;
                me.config.grid2.columns.removeNull();
                me.grid2 = $("#spgird").ligerGrid({
                    dateFormat: "yyyy-MM-dd hh:mm",
                    autoWidth: true,
                    delayLoad: true,
                    usePager: false,
                    columns: me.config.grid2.columns,
                    dataAction: 'local',
                    toolbar: {},
                    url: 'Device/PmInfo/GetFaultSpList',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: [{ field: 'FAULT_ID', op: 'equal', value: $('#FAULT_ID').val() }]
                        })
                    },
                    //sortName: 'MODIFY_DATE',
                    //sortOrder: 'desc',
                    width: '99%',
                    height: '100%',
                    checkbox: false,
                    enabledEdit: false,
                    clickToEdit: false,
                    onBeforeEdit: function (editParm) {
                        switch (editParm.column.name) {
                            case "":
                                if (editParm.record.__status == "add") return true;
                                else return false;
                                break;
                        }
                    },
                    onSuccess: function (data, g) {
                        //me.iframeloading.hide();
                    }
                });
                me.grid2.isValid = true;

            },
            //人员明细
            grid: null,
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#pepgird").ligerGrid({
                    dateFormat: "yyyy-MM-dd hh:mm",
                    autoWidth: true,
                    delayLoad: true,
                    usePager: false,
                    columns: me.config.grid.columns,
                    dataAction: 'local',
                    toolbar: {},
                    url: 'Device/PmInfo/GetFaultPepList',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: [{ field: 'FAULT_ID', op: 'equal', value: $('#FAULT_ID').val() }]
                        })
                    },
                    sortName: 'MODIFY_DATE',
                    sortOrder: 'desc',
                    width: '99%',
                    height: '100%',
                    checkbox: false,
                    enabledEdit: false,
                    clickToEdit: false,
                    onBeforeEdit: function (editParm) {
                        switch (editParm.column.name) {
                            case "":
                                if (editParm.record.__status == "add") return true;
                                else return false;
                                break;
                        }
                    },
                    onSuccess: function (data, g) {
                        //me.iframeloading.hide();
                    }
                });
                me.grid.isValid = true;

            },
            //刷新
            reloadSp: function () {
                var me = this;
                me.grid2.loadData();
            },
            //刷新
            reloadPep: function () {
                var me = this;
                me.grid.loadData();
            },
            init: function () {
                var me = this;
                if (frameElement && frameElement.dialog) {
                    me.dialog = frameElement.dialog;
                    me.dialogData = me.dialog.get('data');
                    me.callback = me.dialogData.callback;
                    if (me.dialogData.sid) me.sid = me.dialogData.sid;
                    if (me.dialogData.isNew != undefined) me.isAddNew = me.dialogData.isNew;
                    if (me.dialogData.view != undefined) me.isView = me.dialogData.view;
                }

                //加在基础信息
                //me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.loadData();


                //加载重大改造履历
                me.setGrid();
                me.setGrid2();
                me.reloadPep();
                me.reloadSp();

                return me;
            }
        };
        business.init();
    </script>
</body>

</html>
