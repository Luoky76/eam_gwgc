<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <script src="../../lib/LGboot.js?ver=<%=SystemService.JsVersion %>" type="text/javascript"></script>
    <title>新增</title>
</head>
<body style="padding: 5px; height: 100%;">
    <form id="mainform">
    </form>
    <script type="text/javascript">
        //获取调用页面的dialog对象
        function f_init() {
            var rootPath = "../";
            var dialog = null;
            var dialogData = null;
            var callback = null;
            if (frameElement && frameElement.dialog) dialog = frameElement.dialog; //调用页面的dialog对象(ligerui对象)
            if (!dialog) return;
            dialogData = dialog.get('data'); //获取data参数
            if (dialogData) callback = dialogData.callback;
            var config = {};
            var isValid = true;

            //是否查看状态
            var sid = dialogData.sid;
            if ((sid || "0") === "0") sid = "";
            var isAddNew = (sid === "");
            var isView = dialogData.view === "1";

            var orginData = {};
            //初始化下拉框数据
            var auditing = [{ "ID": "1", "TEXT": "已提交" }, { "ID": "0", "TEXT": "未提交" }];
            var runStatus = [];
            var deviceInfo = [];


            function f_loadData() {//刷新下拉数据窗口
                LG.ajax({
                    async: false,
                    url: rootPath + 'Device/DeviceRun/ComboxData',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        runStatus = data.runStatus;
                        deviceInfo = data.deviceInfo;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            }
            f_loadData();



            config.Form = {
                fields: [
                    {
                        display: "记录状态", name: "AUDITING", dbname: "AUDITING", minWidth: 200, type: "select", align: "left", options: { data: auditing }, editor: { disabled: true },
                    },
                    {
                        display: "设备编号", name: "DEVICE_ID", dbname: "DEVICE_ID", width: 400, type: "select", align: "left", validate: { required: true },
                        options: {
                            data: deviceInfo,
                            autocomplete: true,
                            selectBoxWidth: 400,
                            valueField: "ID",
                            textField: "TEXT",
                            columns: [
                                { header: '设备编号', name: 'VALUE', width: 100 },
                                { header: '设备名称', name: 'TEXT' }
                            ],
                            onChangeValue: function (input, value, g) {
                                if (g.selected != undefined) {
                                    $('#DEVICE_NAME').val(g.selected.TEXT == null ? '' : g.selected.TEXT);
                                    $('#RUN_STATUS').val(g.selected.EXTEND == null ? '' : g.selected.EXTEND);
                                    $('#DEVICE_NO').val(g.selected.VALUE == null ? '' : g.selected.VALUE);
                                }
                            }
                        }
                    },
                    { display: "设备编号", name: "DEVICE_NO", dbname: "DEVICE_NO", labelWidth: 130, width: 200, type: "hidden", options: {} },
                    { display: "设备名称", name: "DEVICE_NAME", newline: true, upper: true, width: 310, type: "text", options: {}, editor: { disabled: true }, },
                    { display: "状态转换时间", name: "TRANS_DATE", dbname: "TRANS_DATE", width: 310, validate: { required: true }, minWidth: 150, type: "date", editor: { type: 'date', showTime: false, format: "yyyy-MM-dd" } },
                    { display: "原状态", name: "RUN_STATUS", newline: false, upper: true, width: 310, type: "text", options: { },editor: { disabled: true }, },
                    { display: "现状态", name: "NEW_RUN_STATUS", newline: false, upper: true, width: 310, type: "select", options: { data: runStatus } },
                    { display: "使用部门", name: "DEPT_NAME", newline: false, upper: true, width: 310, type: "hidden", options: {} },
                    { display: "二级单位", name: "SEC_DEPT", newline: false, upper: true, width: 310, type: "hidden", options: {} },
                    
                    { display: "转换原因", name: "TRANS_MEMO", newline: true, upper: true, width: 775, type: "textarea", options: {} },

                    { display: "主键", name: "TRANS_ID", newline: false, upper: true, type: "hidden", options: {} },
                ]
            };

            var mainform;
            $("#mainform").ligerForm({
                EnterMoveNextControl: true,
                labelAlign: 'right',
                space: 3,
                validate: true,
                fields: config.Form.fields,
                labelWidth: 120,
                inputWidth: 180,
                onAfterSetFields: function (g) {
                    mainform = g;
                }
            });

            f_setDefault();//设置默认值
            setFormDefaultBtn(f_cancel, f_save);//设置按钮

            //表单底部按钮
            function setFormDefaultBtn(cancleCallback, savedCallback) {
                //表单底部按钮
                var buttons = [];
                if (!isView) {

                }
                if (cancleCallback) {
                    buttons.push({ text: '关闭', onclick: cancleCallback });
                }
                if (savedCallback) {
                    buttons.push({ text: '保存', onclick: savedCallback });
                }
                LG.addFormButtons(buttons);
            };

            //重置
            function f_clear() {
                mainform.reset();
                f_setDefault();
            }

            //根据表单是否改变处理是否继续操作 {1:无改变继续,2:确认继续,0:确认不继续,-1:等待确认}
            function f_canContinue(cback) {
                var data = mainform.getData();
                var updateFields = LG.getFormCombChanges(data, orginData, true);
                if (updateFields) {
                    $.ligerDialog.confirm($.ligerDefaults.GridString.isContinueByDataChanged, function (confirm) {
                        if (confirm) {
                            if (cback) cback(2);
                        }
                        else {
                            if (cback) cback(0);
                        }
                    });
                    if (cback) return cback(-1);
                    return false;
                }
                if (cback) return cback(1);
                return true;
            }

            //取消
            function f_cancel() {
                f_canContinue(function (status) {
                    if (status > 0) {
                        if (dialog) dialog.close();
                        if (callback) callback(false);
                    }
                });
            }

            //设置默认值
            function f_setDefault() {
                if (isAddNew) {
                    delete orginData;
                    orginData = { AUDITING: "0" };
                    mainform.setData(orginData);
                    var data = mainform.getData();
                    LG.getFormCombChanges(data, orginData, true);
                    delete orginData;
                    orginData = data;
                }
                else {
                    var where = {
                        rules: [],
                        groups: [{
                            rules: [], op: "or"
                        }], op: "and"
                    };
                    where.groups[0].rules.push({ field: 'TRANS_ID', value: sid, op: 'equal' });
                    LG.ajax({
                        jsToken: true,
                        url: 'Device/DeviceRun/GetRun',
                        loading: '正在保存中...',
                        data: { sid: sid },
                        data: { "where": JSON2.stringify(where) },
                        success: function (data) {
                            if (data.Rows.length == 0) LG.showError("请求出错");
                            mainform.setData(data.Rows[0]);

                            orginData = JSON2.parse(JSON2.stringify($.extend({}, data.Rows[0])));
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                    if (isView) {
                        mainform.setReadonly(true);
                    }
                }
                var input = mainform.getEditor(config.Form.fields[0].name).inputText;
                if (input.parent()) input.parent().focus();
                input.focus();
                input.select();
            }

            //保存
            function f_save() {
                // 验证
                if (!mainform.valid()) {
                    mainform.showInvalid();
                    return;
                }
                var data = mainform.getData();
                var changeRow = new Object();
                var formdata = [];
                var o_formdata = [];
                formdata.push(data);
                o_formdata.push(orginData);
                var op = isAddNew ? "added" : "updated";
                if (!isAddNew) {
                    changeRow["original"] = o_formdata;
                }
                changeRow[op] = formdata;
                LG.ajax({
                    jsToken: true,
                    url: 'Device/DeviceRun/Manage',
                    loading: '正在保存中...',
                    data: changeRow,
                    success: function (data) {
                        if (data != null && data.IsError) { LG.showError(data.Message); return }
                        LG.showSuccess('保存成功', function () { if (dialog) { dialog.close(); } });
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            }
        }

        f_init();
    </script>
</body>
</html>
