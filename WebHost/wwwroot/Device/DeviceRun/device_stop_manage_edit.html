<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <script src="../../lib/LGboot.js?ver=<%=SystemService.JsVersion %>" type="text/javascript"></script>
    <title>新增</title>
</head>
<body style="padding: 5px; height: 100%;">
    <form id="mainform">
    </form>
    <script type="text/javascript">
        //获取调用页面的dialog对象
        function f_init() {
            var rootPath = "../";
            var menuNo = getQueryStringByName("MenuNo");
            var ver = getQueryStringByName("ver");
            var dialog = null;
            var dialogData = null;
            var callback = null;
            if (frameElement && frameElement.dialog) dialog = frameElement.dialog; //调用页面的dialog对象(ligerui对象)
            if (!dialog) return;
            dialogData = dialog.get('data'); //获取data参数
            if (dialogData) callback = dialogData.callback;
            var config = {};
            var isValid = true;

            var start = null;


            //是否查看状态
            var sid = dialogData.sid;
            if ((sid || "0") === "0") sid = "";
            var isAddNew = (sid === "");
            var isView = dialogData.view === "1";

            var orginData = {};
            //初始化下拉框数据
            var auditing = [{ "ID": "1", "TEXT": "已提交" }, { "ID": "0", "TEXT": "未提交" }];
            var stopSource = [];
            var malType = [];
            var deviceInfo = [];


            function f_loadData() {//刷新下拉数据窗口
                LG.ajax({
                    async: false,
                    url: rootPath + 'Device/DeviceStop/ComboxData',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        stopSource = data.stopSource;
                        malType = data.malType;
                        deviceInfo = data.deviceInfo;

                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            }
            f_loadData();



            config.Form = {
                fields: [

                    {
                        display: "记录状态", name: "AUDITING", dbname: "AUDITING", minWidth: 200, type: "select", align: "left", options: { data: auditing }, editor: { disabled: true }, group: "设备停机记录"
                    },

                    { display: "停机编码", name: "STOP_CODE", newline: false, upper: true, type: "text", options: {},editor: { disabled: true }, },
                    {
                        display: "设备编号", name: "DEVICE_ID", dbname: "DEVICE_ID", width: 400, type: "select", align: "left", validate: { required: true },
                        options: {
                            data: deviceInfo,
                            autocomplete: true,
                            selectBoxWidth: 400,
                            valueField: "ID",
                            textField: "TEXT",
                            columns: [
                                { header: '设备编号', name: 'TEXT', width: 100 },
                                { header: '设备名称', name: 'VALUE' }
                            ],
                            onChangeValue: function (input, value, g) {
                                if (g.selected != undefined) {
                                    $('#DEVICE_NO').val(g.selected.TEXT == null ? '' : g.selected.TEXT);
                                    $('#DEVICE_NAME').val(g.selected.VALUE == null ? '' : g.selected.VALUE);
                                    $('#DEVICE_TYPE').val(g.selected.EXTEND1 == null ? '' : g.selected.EXTEND1);
                                    $('#TYPE_NAME').val(g.selected.EXTEND2 == null ? '' : g.selected.EXTEND2);
                                }
                            }
                        }
                    },
                    { display: "设备名称", name: "DEVICE_NAME", newline: false, upper: true, type: "text", options: {}, editor: { disabled: true } },
                    { display: "设备型号", name: "DEVICE_TYPE", newline: false, upper: true, type: "text", options: {}, editor: { disabled: true } },
                    { display: "设备分类", name: "TYPE_NAME", newline: false, upper: true, type: "text", options: {}, editor: { disabled: true } },
                    { display: "停机分类名称", name: "STOP_SOURCE", newline: false, upper: true, type: "select",  validate: { required: true },options: { data: stopSource } },
                    {
                        display: "停机开始时间", name: "RUN_START", newline: false, upper: true, type: "date", validate: { required: true },
                        options: {
                            format: 'yyyy-MM-dd HH:mm:ss',
                            onChangeValue: function (input, value, g) {
                                start = value
                            },
                        },
                    },
                    {
                        display: "停机结束时间", name: "RUN_END", newline: false, upper: true, type: "date", validate: { required: true },
                        options: {
                            format: 'yyyy-MM-dd HH:mm:ss',
                            onChangeValue: function (input, value, g) {
                                if (start == null) {
                                    LG.showError("请先选择开始时间,后选结束时间！");
                                }
                                var date1 = new Date(start);
                                var date2 = new Date(value);
                                // 计算时间差值（单位为毫秒）
                                var timeDiff = date2.getTime() - date1.getTime();
                                // 将时间差值转换为小时数
                                var minutesDiff = Math.round(timeDiff / 1000 /60/60);
                                $('#STOP_HOURS').val(minutesDiff);
                            },
                        }
                    },
                    { display: "总停机台时", name: "STOP_HOURS", newline: false, upper: true, type: "float", options: {}, editor: { disabled: true } },
                    { display: "编制人", name: "EDIT_USER", newline: false, upper: true, type: "text", options: {}, editor: { disabled: true } },
                    { display: "编制部门", name: "DEPT_NAME", newline: false, upper: true, type: "text", options: {}, editor: { disabled: true } },
                    { display: "二级单位", name: "SEC_DEPT", newline: false, upper: true, type: "text", options: {}, editor: { disabled: true } },
                    { display: "编制日期", name: "EDIT_DATE", newline: false, upper: true, type: "date", options: {}, editor: { disabled: true } },
                    { display: "停机过程描述", name: "STOP_DESC", newline: true, upper: true, width: 775, type: "textarea", validate: { required: true }, options: {} },

                    { display: "分析人", name: "CHECK_USER", newline: false, upper: true, type: "text", validate: { required: true }, options: {}, group: "停机分析报告" },
                    { display: "分析人ID", name: "CHECK_USERID", newline: false, upper: true, type: "hidden", options: {} },
                    { display: "分析部门", name: "CHECK_DEPT", newline: false, upper: true, type: "text", options: {}, editor: { disabled: true } },
                    { display: "分析日期", name: "CHECK_DATE", newline: false, upper: true, type: "date", options: {} },
                    { display: "故障分类", name: "MAL_TYPE_NAME", newline: false, upper: true, type: "select", validate: { required: true }, options: { data: malType } },
                    { display: "故障部位", name: "MAL_PARTS", newline: false, upper: true, type: "text", validate: { required: true }, options: {} },
                    { display: "主要原因", name: "CHECK_DESC", newline: true, upper: true, width: 775, type: "textarea", validate: { required: true }, options: {}},
                    { display: "后续措施", name: "MEMO", newline: true, upper: true, width: 775, type: "textarea", validate: { required: true }, options: {} },
    
                    { display: "使用部门ID", name: "DEPT_ID", newline: false, upper: true, type: "hidden", options: {} },
                    { display: "二级单位ID", name: "SEC_DEPTID", newline: false, upper: true, type: "hidden", options: {} },
                    { display: "编制人ID", name: "EDIT_USERID", newline: false, upper: true, type: "hidden", options: {} },
                    { display: "使用部门", name: "APPLY_DEPT", newline: false, upper: true, type: "hidden", options: {} },
                    { display: "使用部门ID", name: "APPLY_DEPTID", newline: false, upper: true, type: "hidden", options: {} },
                    { display: "设备编号", name: "DEVICE_NO", newline: false, upper: true, type: "hidden", options: {} },
                    { display: "分类ID", name: "TYPE_ID", newline: false, upper: true, type: "hidden", options: {} },
                    { display: "故障报修ID", name: "REPORT_ID", newline: false, upper: true, type: "hidden", options: {} },
                    { display: "故障台账ID", name: "PROBLEM_ID", newline: false, upper: true, type: "hidden", options: {} },
                    { display: "故障分类ID", name: "MAL_TYPE_ID", newline: false, upper: true, type: "hidden", options: {} },
                    { display: "分析部门ID", name: "CHECK_DEPTID", newline: false, upper: true, type: "hidden", options: {} },
                    { display: "主键", name: "RUN_STOP_ID", newline: false, upper: true, type: "hidden",  options: {} },
                    { display: "添加人ID", name: "ADD_USERID", newline: false, upper: true, type: "hidden", options: {} },
                    { display: "添加时间", name: "ADD_DATE", newline: false, upper: true, type: "hidden", options: {} },
                    { display: "修改人ID", name: "MODIFY_USERID", newline: false, upper: true, type: "hidden", options: {} },
                    { display: "修改时间", name: "MODIFY_DATE", newline: false, upper: true, type: "hidden", options: {} }

                ]
            };

            var mainform;
            $("#mainform").ligerForm({
                EnterMoveNextControl: true,
                labelAlign: 'right',
                space: 3,
                validate: true,
                fields: config.Form.fields,
                labelWidth: 120,
                inputWidth: 180,
                onAfterSetFields: function (g) {
                    mainform = g;
                }
            });

            f_setDefault();//设置默认值
            setFormDefaultBtn(f_cancel, f_save);//设置按钮

            //表单底部按钮
            function setFormDefaultBtn(cancleCallback, savedCallback) {
                //表单底部按钮
                var buttons = [];
                if (!isView) {

                }
                if (cancleCallback) {
                    buttons.push({ text: '关闭', onclick: cancleCallback });
                }
                if (savedCallback) {
                    buttons.push({ text: '保存', onclick: savedCallback });
                }
                LG.addFormButtons(buttons);
            };



            $('#CHECK_USER').focus(function () {
                f_select_man()
            })
            //人员选择
            var userFrame
            function f_select_man() {

                var OriginstaffNoStr = mainform.getData().CHECK_USERID;
                var OriginstaffNameStr = mainform.getData().CHECK_USER;
                var OriginstaffDeptStr = mainform.getData().CHECK_DEPT;
                var OriginstaffDeptNoStr = mainform.getData().CHECK_DEPTID;

                userFrame = $.ligerDialog.open({
                    width: 860,
                    height: 500,
                    allowClose: true,
                    title: '选择人员',
                    url: "../../base/seluser.html?MenuNo=" + menuNo + "&ver=" + ver,
                    isHidden: false,
                    showMax: false,
                    showToggle: false,
                    showMin: false,
                    isResize: true,
                    slide: false,
                    onClosed: function () {
                        if (userFrame.frame.checkstaffnoArr && userFrame.frame.checkstaffnoArr.length != 0) {
                            var staffnoArr = userFrame.frame.checkstaffnoArr
                            var staffnameArr = userFrame.frame.checkstaffnameArr
                            var staffdeptArr = userFrame.frame.checkStaffdeptArr
                            var staffdeptnoArr = userFrame.frame.checkStaffdeptnoArr
                            if (staffnoArr.length > 0 && staffnoArr.length < 2) {
                                mainform.setData({ "CHECK_USER": staffnameArr[0] })
                                mainform.setData({ "CHECK_USERID": staffnoArr[0] })
                                mainform.setData({ "CHECK_DEPT": staffdeptArr[0] })
                                mainform.setData({ "CHECK_DEPTID": staffdeptnoArr[0] })
                            }
                            else {
                                LG.showError("只能指定一人!");
                                mainform.setData({ "CHECK_USER": OriginstaffNameStr })
                                mainform.setData({ "CHECK_USERID": OriginstaffNoStr })
                                mainform.setData({ "CHECK_DEPT": OriginstaffDeptStr })
                                mainform.setData({ "CHECK_DEPTID": OriginstaffDeptNoStr })
                            }
                        } else {
                            mainform.setData({ "CHECK_USER": OriginstaffNameStr })
                            mainform.setData({ "CHECK_USERID": OriginstaffNoStr })
                            mainform.setData({ "CHECK_DEPT": OriginstaffDeptStr })
                            mainform.setData({ "CHECK_DEPTID": OriginstaffDeptNoStr })
                        }
                    },
                    data: { "staffNoStr": OriginstaffNoStr }
                });
            }

            //重置
            function f_clear() {
                mainform.reset();
                f_setDefault();
            }

            //根据表单是否改变处理是否继续操作 {1:无改变继续,2:确认继续,0:确认不继续,-1:等待确认}
            function f_canContinue(cback) {
                var data = mainform.getData();
                var updateFields = LG.getFormCombChanges(data, orginData, true);
                if (updateFields) {
                    $.ligerDialog.confirm($.ligerDefaults.GridString.isContinueByDataChanged, function (confirm) {
                        if (confirm) {
                            if (cback) cback(2);
                        }
                        else {
                            if (cback) cback(0);
                        }
                    });
                    if (cback) return cback(-1);
                    return false;
                }
                if (cback) return cback(1);
                return true;
            }

            //取消
            function f_cancel() {
                f_canContinue(function (status) {
                    if (status > 0) {
                        if (dialog) dialog.close();
                        if (callback) callback(false);
                    }
                });
            }

            //设置默认值
            function f_setDefault() {
                if (isAddNew) {
                    delete orginData;
                    orginData = { AUDITING: "0" };
                    mainform.setData(orginData);
                    var data = mainform.getData();
                    LG.getFormCombChanges(data, orginData, true);
                    delete orginData;
                    orginData = data;
                }
                else {
                    var where = {
                        rules: [],
                        groups: [{
                            rules: [], op: "or"
                        }], op: "and"
                    };
                    where.groups[0].rules.push({ field: 'RUN_STOP_ID', value: sid, op: 'equal' });
                    LG.ajax({
                        jsToken: true,
                        url: 'Device/DeviceStop/GetStopList',
                        loading: '正在保存中...',
                        data: { sid: sid },
                        data: { "where": JSON2.stringify(where) },
                        success: function (data) {
                            if (data.Rows.length == 0) LG.showError("请求出错");
                            mainform.setData(data.Rows[0]);

                            orginData = JSON2.parse(JSON2.stringify($.extend({}, data.Rows[0])));
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                    if (isView) {
                        mainform.setReadonly(true);
                    }
                }
                var input = mainform.getEditor(config.Form.fields[0].name).inputText;
                if (input.parent()) input.parent().focus();
                input.focus();
                input.select();
            }

            //保存
            function f_save() {
                // 验证
                if (!mainform.valid()) {
                    mainform.showInvalid();
                    return;
                }
                var data = mainform.getData();
                var changeRow = new Object();
                var formdata = [];
                var o_formdata = [];
                formdata.push(data);
                o_formdata.push(orginData);
                var op = isAddNew ? "added" : "updated";
                if (!isAddNew) {
                    changeRow["original"] = o_formdata;
                }
                changeRow[op] = formdata;
                LG.ajax({
                    jsToken: true,
                    url: 'Device/DeviceStop/ManageStop',
                    loading: '正在保存中...',
                    data: changeRow,
                    success: function (data) {
                        if (data != null && data.IsError) { LG.showError(data.Message); return }
                        LG.showSuccess('保存成功', function () { if (dialog) { dialog.close(); } });
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            }
        }

        f_init();
    </script>
</body>
</html>
