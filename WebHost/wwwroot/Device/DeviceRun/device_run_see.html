<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title>运行状态一览表</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <div id="mainsearch" style="width: 98%">
        <form action="" id="formsearch" class="l-form">
        </form>
    </div>
    <form action="" id="mainform">
        <div id="maingrid">
        </div>
    </form>
    <script type="text/javascript">
        'use strict';
        var rootPath = "../";
        window["encryptUrl"] = ["/Apis/"];
        var business = {
            menuNo: getQueryStringByName("MenuNo"),
            ver: getQueryStringByName("ver"),
            detailWidth: 920,
            detailHeight: 450,
            dataCorp: [],
            dataFlag: [{ ID: "1", TEXT: "投入使用" }, { ID: "0", TEXT: "作废" }],
            EquFacFlag: [{ ID: "2", TEXT: "消防设施" }, { ID: "1", TEXT: "消防设备" }],
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            { display: "设备编码", name: "_search_EQUIP_CODE", dbname: "EQUIP_CODE", newline: false, type: "text", options: {} },
                            { display: "设备名称", name: "_search_EQUIP_NAME", dbname: "EQUIP_NAME", newline: false, type: "text", options: {} },
                        ]
                    },
                    grid: {
                        columns: [
                            {
                                display: "运行状态", name: "STATUS", minWidth: 100, type: "text", editor: { type: 'text' },
                                render: function (rowdata) {
                                    if (rowdata.STATUS == "正常") {
                                        return "<div style='background: #00FF00;color: white;'>" + rowdata.STATUS + "</div>";
                                    }
                                    else if (rowdata.STATUS == "维修") {
                                        return "<div style='background: black;color: white;'>" + rowdata.STATUS + "</div>";
                                    }
                                    else if (rowdata.STATUS == "停机") {
                                        return "<div style='background: red;color: white;'>" + rowdata.STATUS + "</div>";
                                    }
                                    else if (rowdata.STATUS == "事故") {
                                        return "<div style='background: black;color: white;'>" + rowdata.STATUS + "</div>";
                                    }
                                    else if (rowdata.STATUS == "保养") {
                                        return "<div style='background: #2BD5D5;color: white;'>" + rowdata.STATUS + "</div>";
                                    }
                                    else if (rowdata.STATUS == "检查") {
                                        return "<div style='background: green;color: white;'>" + rowdata.STATUS + "</div>";
                                    }
                                    else if (rowdata.STATUS == "备用") {
                                        return "<div style='background: green;color: white;'>" + rowdata.STATUS + "</div>";
                                    }
                                    else {
                                        return "<div style='background: green;color: white;'>" + rowdata.STATUS + "</div>";
                                    }
                                }
                            },
                            { display: "设备编码", name: "DEVICE_CODE", minWidth: 200, type: "text", editor: { type: 'text' } },
                            { display: "设备名称", name: "DEVICE_NAME", minWidth: 200, type: "text", editor: { type: 'text' } },
                            { display: "设备类别", name: "TYPE_NAME", minWidth: 100, type: "text", editor: { type: 'text' } },
                            { display: "转换原因", name: "TRANS_MEMO", minWidth: 300, type: "text", editor: { type: 'text' } },
                            { display: "使用部门", name: "SEC_DEPT", minWidth: 100, type: "text", editor: { type: 'text' } },
                            { display: "使用二级单位", name: "DEPT_NAME", minWidth: 100, type: "text", editor: { type: 'text' } },
                        ]
                    }
                };
            },
            grid: null,
            searchForm: null,
            buttons: null,
            /*loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'Welcome/CorpData',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        me.dataCorp = data.Rows;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },*/
            setGrid: function () {
                var me = this;
                var columns = me.config.grid.columns;
                for (var i = columns.length - 1; i >= 0; i--) {
                    if (!columns[i]) columns.splice(i, 1);
                }
                me.grid = $("#maingrid").ligerGrid({
                    autoWidth: true,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    dataAction: 'server',
                    toolbar: {},
                    url: 'Device/DeviceRun/GetAllRun',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    width: '100%',
                    height: '100%',
                    dateFormat: 'yyyy-MM-dd',
                    checkbox: true,
                    enabledEdit: false,
                    clickToEdit: false
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "Excel":
                            $.ligerDialog.open({
                                url: "../../../System/Export.html?exporttype=xls&MenuNo=" + me.menuNo,
                                modal: true
                            });
                            break;
                        case "Word":
                            $.ligerDialog.open({
                                url: "../../../System/Export.html?exporttype=doc&MenuNo=" + me.menuNo,
                                modal: true
                            });
                            break;
                    }
                }
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Word',
                        text: '导出Word',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-word-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            setForm: function () {
                var me = this;
                var columns = me.config.search.fields;
                for (var i = columns.length - 1; i >= 0; i--) {
                    if (!columns[i]) columns.splice(i, 1);
                }
                var $formsearch = $("#formsearch")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                    }
                });
                me.buttons[0].click(); //查询
            },
            init: function () {
                var me = this;
               // me.loadComboxData();
                me.setConfig();
                me.setGrid();
                me.setForm();
                return me;
            }
        };
        business.init();
    </script>
</body>

</html>
