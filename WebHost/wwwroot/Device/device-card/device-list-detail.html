<body style="padding: 5px; height: 100%;">

                            { display: "改造结束时间", name: "END_DATE", width: 100, type: "date", editor: { type: 'date', showTime: true, format: "yyyy-MM-dd hh:mm" } },

                    pmgrid: {

                            { display: "记录状态", name: "AUDITING_EXE", dbname: "AUDITING_EXE", width: 100, type: "select", format: { data: me.auditing } },
                            { display: "保养实施单号", name: "EXE_CODE", minWidth: 150, type: "text", editor: { type: 'text' } },

                            { display: "遗留问题描述", name: "LEG_DESC", minWidth: 300, type: "text", editor: { type: 'text' } },
                            { display: "EXE_ID", name: "EXE_ID", hide: true },
                            { display: "设备主键", name: "DEVICE_ID", width: 100, type: "text", editor: { type: 'text' }, hide: true },

                            { display: "申请单号", name: "APPLY_CODE", minWidth: 100, type: "text", },
                            { display: "出库日期", name: "OUT_DATE", minWidth: 100, type: "text", },
                            { display: "领用人", name: "USER_NAME", minWidth: 100, type: "text", },
                            { display: "领用部门", name: "DEPT_NAME", minWidth: 100, type: "text", },
                            { display: "仓管员", name: "M_USER", minWidth: 100, type: "text", },
                            { display: "物料编码", name: "SP_CODE", minWidth: 100, type: "text", },
                            { display: "物料名称", name: "SP_NAME", minWidth: 100, type: "text", },
                            { display: "规格型号", name: "SP_SIZE", minWidth: 100, type: "text", },
                            { display: "品牌、厂家", name: "PRODUCE", minWidth: 100, type: "text", },
                            { display: "计量单位", name: "UNIT", minWidth: 100, type: "text", },
                            { display: "申请数量", name: "APPLY_NUM", minWidth: 100, type: "float", },
                            { display: "出库数量", name: "COUNT", minWidth: 100, type: "float", },
                            { display: "参考单价(元)", name: "PRICE", minWidth: 100, type: "float", },
                            { display: "金额(元)", name: "MONEY", minWidth: 100, type: "float", },
                            { display: "设备ID", name: "DEVICE_ID", hide: true },
                            { display: "OUT_ID", name: "OUT_ID", hide: true },

                        ]
                    },
                };
            },
            mainform: null,
            buttons: null,
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'Device/DeviceCard/comboxdata',
                    loading: '正在获取中...',
                    success: function (data) {
                        me.auditing = data.Auditing;
                        me.user = data.User;
                        me.dataCorp = data.Corp;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            setdocGrid: function () {
                var me = this;
                me.config.docgrid.columns.removeNull();
                me.grid = $("#docgird").ligerGrid({
                    columns: me.config.docgrid.columns,
                    dataAction: 'local',
                    toolbar: {},
                    url: 'DEVICE/DeviceCard/DocList',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: [{ field: 'DEVICE_ID', op: 'equal', value: me.sid }]
                        })
                    },
                    //sortName: 'MODIFY_DATE',
                    //sortOrder: 'desc',
                    width: '99%',
                    height: '20%',
                    checkbox: true,
                    onBeforeEdit: function (editParm) {
                        switch (editParm.column.name) {
                            case "":
                                if (editParm.record.__status == "add") return true;
                                else return false;
                                break;
                        }
                    },
                    onSuccess: function (data, g) {
                        //me.iframeloading.hide();
                    }
                });
            },
            setparamGrid: function () {
                var me = this;
                me.config.paramgird.columns.removeNull();
                me.grid = $("#paramgird").ligerGrid({
                    dateFormat: "yyyy-MM-dd hh:mm",
                    autoWidth: true,
                    delayLoad: true,
                    usePager: true,
                    columns: me.config.paramgird.columns,
                    dataAction: 'local',
                    toolbar: {},
                    url: 'Device/DeviceCard/ParamList',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: [{ field: 'DEVICE_ID', op: 'equal', value: me.sid }]
                        })
                    },
                    //sortName: 'MODIFY_DATE',
                    //sortOrder: 'desc',
                    width: '99%',
                    height: '20%',
                    checkbox: true,
                    onBeforeEdit: function (editParm) {
                        switch (editParm.column.name) {
                            case "":
                                if (editParm.record.__status == "add") return true;
                                else return false;
                                break;
                        }
                    },
                    onSuccess: function (data, g) {
                        //me.iframeloading.hide();
                    }
                });
            },
            setremGrid: function () {
                var me = this;
                me.config.remouldgird.columns.removeNull();
                me.grid = $("#remouldgird").ligerGrid({
                    dateFormat: "yyyy-MM-dd hh:mm",
                    autoWidth: true,
                    delayLoad: true,
                    usePager: true,
                    columns: me.config.remouldgird.columns,
                    dataAction: 'local',
                    toolbar: {},
                    url: 'Device/DeviceCard/RemList',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: [{ field: 'DEVICE_ID', op: 'equal', value: me.sid }]
                        })
                    },
                    //sortName: 'MODIFY_DATE',
                    //sortOrder: 'desc',
                    width: '99%',
                    height: '20%',
                    checkbox: true,
                    onBeforeEdit: function (editParm) {
                        switch (editParm.column.name) {
                            case "":
                                if (editParm.record.__status == "add") return true;
                                else return false;
                                break;
                        }
                    },
                    onSuccess: function (data, g) {
                        //me.iframeloading.hide();
                    }
                });
            },
            setpmGrid: function () {
                var me = this;
                me.config.pmgrid.columns.removeNull();
                me.grid = $("#pmgrid").ligerGrid({
                    dateFormat: "yyyy-MM-dd hh:mm",
                    autoWidth: true,
                    delayLoad: true,
                    usePager: true,
                    columns: me.config.pmgrid.columns,
                    dataAction: 'local',
                    toolbar: {},
                    url: 'Device/DeviceCard/PmListAsync',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: [{ field: 'DEVICE_ID', op: 'equal', value: me.sid }]
                        })
                    },
                    //sortName: 'MODIFY_DATE',
                    //sortOrder: 'desc',
                    width: '99%',
                    height: '20%',
                    checkbox: true,
                    onBeforeEdit: function (editParm) {
                        switch (editParm.column.name) {
                            case "":
                                if (editParm.record.__status == "add") return true;
                                else return false;
                                break;
                        }
                    },
                    onSuccess: function (data, g) {
                        //me.iframeloading.hide();
                    }
                });
            },
            setoutGrid: function () {
                var me = this;
                me.config.outgrid.columns.removeNull();
                me.grid = $("#outgrid").ligerGrid({
                    dateFormat: "yyyy-MM-dd hh:mm",
                    autoWidth: true,
                    delayLoad: true,
                    usePager: true,
                    columns: me.config.outgrid.columns,
                    dataAction: 'local',
                    toolbar: {},
                    url: 'Material/SpOut/GetSpOutStoreDetailList',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: [{ field: 'DEVICE_ID', op: 'equal', value: me.sid }]
                        })
                    },
                    //sortName: 'MODIFY_DATE',
                    //sortOrder: 'desc',
                    width: '99%',
                    height: '20%',
                    checkbox: true,
                    onBeforeEdit: function (editParm) {
                        switch (editParm.column.name) {
                            case "":
                                if (editParm.record.__status == "add") return true;
                                else return false;
                                break;
                        }
                    },
                    onSuccess: function (data, g) {
                        //me.iframeloading.hide();
                    }
                });
            },
            close: function (skipConfirm) {
                var me = this;
                function inner(callback) {
                    if (!skipConfirm && !$.isEmptyObject(me.mainform.getChanges())) {
                        $.ligerDialog.confirm($.ligerDefaults.GridString.isContinueByDataChanged, function (confirm) {
                            if (confirm) {
                                if (callback) callback(2);
                            }
                            else {
                                if (callback) callback(0);
                            }
                        });
                        if (callback) return callback(-1);
                        return false;
                    }
                    if (callback) return callback(1);
                    return true;
                }
                inner(function (status) {
                    if (status > 0) {
                        if (me.dialog) {
                            me.dialog.close();
                            return;
                        }
                        var win = parent || window;
                        if (win.closeCurrentTab) win.closeCurrentTab();
                        else win.close();
                    }
                });
            },
            init: function () {
                var me = this;
                if (frameElement && frameElement.dialog) {
                    me.dialog = frameElement.dialog;
                    me.dialogData = me.dialog.get('data') || {};
                    if (me.dialogData.callback) me.callback = me.dialogData.callback;
                    if (me.dialogData.sid) me.sid = me.dialogData.sid;
                    if (me.dialogData.isView) me.isView = me.dialogData.isView;
                }
                me.loadComboxData();
                me.setConfig();
                me.setdocGrid();
                me.setparamGrid();
                me.setremGrid();
                me.setpmGrid();
                me.setoutGrid();
                return me;
            }
        };
        $(function () {
            business.init();
        });

</body>
