
<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title></title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <div id="mainsearch" style="width: 98%">
        <form action="" id="formsearch" class="l-form">
        </form>
    </div>
    <form action="" id="mainform">
        <div id="maingrid">
        </div>
    </form>
    <script type="text/javascript">
        'use strict';
        var business = {
            auditing: [{ "ID": "1", "TEXT": "已提交" }, { "ID": "0", "TEXT": "未提交" }],
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            { display: "码头编号", name: "_search_DOCK_CODE", dbname: "DOCK_CODE", newline: false, upper: true, type: "text",options:{} },
                            { display: "码头名称", name: "_search_DOCK_NAME", dbname: "DOCK_NAME", newline: false, upper: true, type: "text",options:{} },
                            { display: "记录状态", name: "_search_AUDITING", dbname: "AUDITING", newline: false, upper: true, type: "select", options: { data: me.auditing } },
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "记录状态", name: "AUDITING", minWidth: 100, type: "select", format: { data: me.auditing } },
                            { display: "码头名称", name: "DOCK_NAME", minWidth: 200, type: "text", editor: { type: 'text' } },
                            { display: "码头地址", name: "DOCK_ADDRESS", minWidth: 250, type: "text", editor: { type: 'text' } },
                            { display: "码头编号", name: "DOCK_CODE", minWidth: 150, type: "text"},
                            { display: "编辑人", name: "EDIT_USER", minWidth: 120, type: "text", },
                            { display: "编辑日期", name: "EDIT_DATE", minWidth: 120, type: "date"},
                            { display: "备注", name: "MEMO", minWidth: 400, type: "text",  editor: { type: 'text'} },
                            { display: "主键", name: "DOCK_ID", minWidth: 100, type: "text", hide: true },
                            
                        ]
                    }
                };
            },
            grid: null,
            searchForm: null,
            buttons: null,
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'Device/RepDockInfo/comboxdata',
                    loading: '正在获取中...',
                    success: function (data) {
                        me.dataCorp = data.corpData;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    autoWidth: true,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    usePager: false,
                    dataAction: 'local',
                    toolbar: {},
                    url: 'Device/RepDockInfo/GetBaseDockList',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: 'DOCK_CODE',
                    sortOrder: 'asc',
                    width: '98%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: true,
                    clickToEdit: true,
                    onBeforeEdit: function (editParm) {
                        if (editParm.record.__status == "nochanged") {
                            if (editParm.record.AUDITING == "1") return false;
                            else return true;
                        }
                        switch (editParm.column.name) {
                            case "":
                                if (editParm.record.__status == "add") return true;
                                else return false;
                                break;
                        }
                    },
                    onSuccess: function (data, g) {
                        if (data && data.Rows) {
                            var rows = data.Rows || [];
                            for (var i = 0, len = rows.length; i < len; i++) {
                                var row = rows[i];
                                row.OLDROLEID = row.ROLEID;
                            }
                        }
                    },
                    rowAttrRender: function (rowdata, rowid) {
                        return "";
                    }
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "add":
                            me.add();
                            break;
                        case "modify":
                            me.modify();
                            break;
                        case "delete":
                            me.delete();
                            break;
                        case "save":
                            me.save();
                            break;
                        case "submit":
                            me.submit();
                            break;
                        case "Excel":
                            $.ligerDialog.open({
                                url: "../../../System/Export.html?exporttype=xls",
                                modal: true
                            });
                            break;
                        case "Word":
                            $.ligerDialog.open({
                                url: "../../../System/Export.html?exporttype=doc",
                                modal: true
                            });
                            break;
                    }
                }
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            add: function () { //新增
                var me = this;
                //$.ligerDialog.open({
                //    width: me.detailWidth,
                //    height: me.detailHeight,
                //    allowClose: true,
                //    title: '[新增]',
                //    url: "view-detail.html",
                //    isHidden: false,
                //    showMax: false,
                //    showToggle: false,
                //    showMin: false,
                //    isResize: true,
                //    slide: false,
                //    onClosed: me.reload.bind(me),
                //    data: { "sid": null }
                //});
                me.grid.addEditRow({ "AUDITING": "0" }, true);
            },
            modify: function () { //修改
                var me = this;
                var selected = me.grid.getSelectedRow();
                if (!selected) {
                    LG.tip('请选择行!');
                    return;
                }
                var sid = selected.DOCK_ID;
                $.ligerDialog.open({
                    width: me.detailWidth,
                    height: me.detailHeight,
                    allowClose: true,
                    title: '[修改]',
                    url: "view-detail.html",
                    isHidden: false,
                    showMax: false,
                    showToggle: false,
                    showMin: false,
                    isResize: true,
                    slide: false,
                    onClosed: me.reload.bind(me),
                    data: { "sid": sid }
                });
            },
            save: function () { //保存
                var me = this;
                if (me.grid.endEdit() != false) {
                    if (!me.grid.isDataChanged) {
                        LG.showSuccess('无修改');
                        return;
                    }
                    if (!me.grid.validChangeRows()) return false;
                    var changeRow = me.grid.getChangedRows();
                    LG.ajax({
                        jsToken: true,
                        url: 'Device/RepDockInfo/ManageBaseDock',
                        loading: '正在保存中...',
                        data: changeRow,
                        success: function () {
                            LG.showSuccess('保存成功');
                            me.grid.isDataChanged = false;
                            me.reload();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }

            },
            reload: function () { //刷新
                var me = this;
                me.buttons[0].click();
            },
            delete: function () { //删除
                var me = this;
                var selected = me.grid.getSelectedRows();
                for (var i = 0; i < selected.length; i++) {
                    if (selected[i].AUDITING == "1") {
                        me.alreadydeleteed = true;
                        break;
                    }
                }
                if (selected.length > 0) {
                    if (me.alreadydeleteed) {
                        LG.tip('已提交的无法删除!');
                        me.alreadydeleteed = false;
                    }
                    else {
                        if (me.grid.endEdit() != false) {
                            if (selected.length > 0) {
                                $.ligerDialog.confirm('确定删除吗?', function (confirm) {
                                    if (confirm) {
                                        for (var i = 0, len = selected.length; i < len; i++) {
                                            me.grid.deleteRow(selected[i]);
                                        }
                                        me.save();
                                    }
                                });
                            } 
                        }
                    }
                }
                else {
                    LG.tip('请选择行!');
                }
            },

            submit: function () {    //提交
                var me = this;
                var selected = me.grid.getSelectedRows();
                for (var i = 0; i < selected.length; i++) {
                    if (selected[i].AUDITING == "1") {
                        me.alreadySubmitted = true;
                        break;
                    }
                }
                if (selected.length > 0) {
                    if (selected[0].DOCK_ID == null) {
                        LG.tip('请先保存!');
                    }
                    else if (me.alreadySubmitted) {
                        LG.tip('已提交，无法再次提交!');
                        me.alreadySubmitted = false;
                    }
                    else {
                        var sids = [];
                        selected.forEach((a) => {
                            sids.push(a.DOCK_ID)
                        })
                        LG.ajax({
                            jsToken: true,
                            url: 'Device/RepDockInfo/Submit',
                            loading: '正在保存中...',
                            data: { "sids": sids },
                            success: function () {
                                LG.showSuccess('保存成功');
                                me.grid.isDataChanged = false;
                                me.reload();
                            },
                            error: function (message) {
                                LG.showError(message);
                            }
                        });
                    }

                }
                else {
                    LG.tip('请选择行!');
                }
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Word',
                        text: '导出Word',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-word-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch = $("#formsearch")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                    }
                });
            },
            init: function () {
                var me = this;
                me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.setGrid();
                me.reload();
                return me;
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>
</html>
