<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title>故障验收</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>
<body style="padding: 5px; height: 100%;">
    <div id="mainsearch" style="width: 100%">
        <form action="" id="formsearch" class="l-form">
            <div id="formsearch1">
            </div>
        </form>
    </div>
    <form action="" id="mainform">
        <div id="gridform">
            <div id="maingrid" hidetitle=true>
            </div>
        </div>
    </form>
    <script type="text/javascript">
        'use strict';

        var business = {
            menuNo: getQueryStringByName("MenuNo"),
            ver: getQueryStringByName("ver"),
            voyagecodedata: null,
            auditing: [{ "ID": "1", "TEXT": "已提交" }, { "ID": "0", "TEXT": "未提交" }],
            checkResult: [{ "ID": "1", "TEXT": "合格" }, { "ID": "0", "TEXT": "不合格" }],
            disposeType: [],
            faultStatus: [],
            faultSrc: [],
            deviceStatus: [],
            alreadySubmitted: false,
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            {
                                display: "设备名称", name: "_search_DEVICE_NAME", dbname: "DEVICE_NAME", newline: false, width: 150, upper: true, type: "text", options: {}
                            },
                            {
                                display: "故障单号", name: "_search_FAULT_CODE", dbname: "FAULT_CODE", newline: false, width: 150, upper: true, type: "text", options: {}
                            },
                        ]
                    },
                    grid: {
                        columns: [

                            { display: "记录状态", name: "AUDITING_D", dbname: "AUDITING_D", width: 100, type: "select", format: { data: me.auditing } },
                            { display: "验收结果", name: "CHECK_RESULT", width: 100, type: "select", format: { data: me.checkResult } },
                            { display: "故障状态", name: "FAULT_STATUS", width: 100, type: "select", format: { data: me.faultStatus } },
                            { display: "故障单号", name: "FAULT_CODE", width: 100, type: "text", },
                            { display: "故障发生时间", name: "FAULT_DATE", width: 100, type: "date", editor: { type: 'date', showTime: true, format: "yyyy-MM-dd hh:mm" } },
                            { display: "设备名称", name: "DEVICE_NAME", width: 100, type: "text", },
                            { display: "设备型号", name: "DEVICE_TYPE", width: 100, type: "text", },
                            { display: "设备状态", name: "DEVICE_STATUS", width: 100, type: "select", format: { data: me.deviceStatus } },
                            { display: "设备类别", name: "TYPE_NAME", width: 100, type: "text", },
                            { display: "设备编号", name: "DEVICE_CODE", width: 100, type: "text", },
                            { display: "使用部门", name: "DEPT_NAME", width: 100, type: "text", },
                            { display: "维保部门", name: "WDEPT_NAME", width: 100, type: "text", },
                            { display: "维修人", name: "REPAIR_USER", width: 100, type: "text", },
                            { display: "异常来源", name: "FAULT_SRC", width: 100, type: "select", format: { data: me.faultSrc } },
                            { display: "安装地点", name: "INSTALL_SITE", width: 100, type: "text", },
                            { display: "开工时间", name: "ORDER_DATE", width: 100, type: "date", editor: { type: 'date', showTime: true, format: "yyyy-MM-dd hh:mm" } },
                            { display: "来源单号", name: "SRC_CODE", width: 100, type: "text", },
                            { display: "FAULT_ID", name: "FAULT_ID", hide: true },
                        ]
                    },
                };
            },
            grid: null,
            searchForm: null,
            buttons: null,
            searchForm2: null,
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'Device/RepFault/ComboxData',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        me.faultStatus = data.faultStatus;
                        me.disposeType = data.disposeType;
                        me.faultSrc = data.faultSrc;
                        me.deviceStatus = data.deviceStatus;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                //me.config.gridtop.columns.removeNull();
                //me.config.gridcenter.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    fixedCellHeight: true,
                    autoWidth: true,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    toolbar: {},
                    url: 'Device/RepFault/GetFaultCheckList',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    //sortName: 'RECEIVEDATE',
                    //sortOrder: 'desc',
                    width: '98%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: false,
                    clickToEdit: false,
                    page: 1,
                    pageSize: 50,
                    //isSingleCheck: true,
                    usePager: false,
                    onBeforeEdit: function (editParm) {

                    },
                    onSuccess: function (data, g) {

                    },
                    rowAttrRender: function (rowdata, rowid) {

                    },
                    rowAttrRender: function (rowdata, rowid) {

                    },
                    onDblClickRow: function (rowdata) {
                        me.view(rowdata);
                    }

                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "modify":
                            me.modify();
                            break;
                        case "submit":
                            me.submit();
                            break;
                        case "unsubmit":
                            me.unsubmit();
                            break;
                        case "Excel":
                            $.ligerDialog.open({
                                url: "../../../System/Export.html?exporttype=xls&MenuNo=" + me.menuNo,
                                modal: true
                            });
                            break;
                        case "Word":
                            $.ligerDialog.open({
                                url: "../../../System/Export.html?exporttype=doc&MenuNo=" + me.menuNo,
                                modal: true
                            });
                            break;
                    }
                }
                me.grid.toolbarManager.options.group = 'main';
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            reload: function () { //刷新
                var me = this;
                me.buttons[0].click();
            },

            modify: function () { //填写合格与否
                var me = this;
                var selected = me.grid.getSelectedRow();

                if (selected) {
                    if (selected.AUDITING_D != "0") {
                        LG.tip('已提交，无法填写!');
                    } else {
                        var sid = selected.FAULT_ID;
                        $.ligerDialog.open({
                            width: 1100,
                            height: 620,
                            allowClose: true,
                            title: '[验收单]',
                            url: "repfaultchkdetail.html?MenuNo=" + me.menuNo + "&ver=" + me.ver,
                            isHidden: false,
                            showMax: false,
                            showToggle: false,
                            showMin: false,
                            isResize: true,
                            slide: false,
                            onClosed: me.reload.bind(me),
                            data: { "sid": sid, }
                        });
                    }
                }
                else {
                    LG.tip('请选择行!');
                }
            },

            submit: function () {    //提交
                debugger
                var me = this;
                var selected = me.grid.getSelectedRows();
                for (var i = 0; i < selected.length; i++) {
                    if (selected[i].AUDITING_D == "1") {
                        me.alreadySubmitted = true;
                        break;
                    }
                }
                if (selected>0) {
                    if (me.alreadySubmitted) {
                        LG.tip('已提交，无法再次提交!');
                        me.alreadySubmitted = false;
                    }
                    else {
                        var sids = [];
                        selected.forEach((a) => {
                            sids.push(a.FAULT_ID)
                        })
                        LG.ajax({
                            jsToken: true,
                            url: 'Device/RepFault/SubmitFaultCheck',
                            loading: '正在保存中...',
                            data: { "sids": sids },
                            success: function () {
                                LG.showSuccess('保存成功');
                                me.grid.isDataChanged = false;
                                me.reload();
                            },
                            error: function (message) {
                                LG.showError(message);
                            }
                        });
                    }

                }
                else {
                    LG.tip('请选择行!');
                }
            },

            unsubmit: function () {    //提交
                var me = this;
                var selected = me.grid.getSelectedRows();
                if (selected.length > 0) {
                    if (selected[0].AUDITING_D != "0") {
                        LG.tip('已提交，无法驳回!');
                    }
                    else {
                        var sids = [];
                        selected.forEach((a) => {
                            sids.push(a.FAULT_ID)
                        })
                        LG.ajax({
                            jsToken: true,
                            url: 'Device/RepFault/SubmitFaultUnCheck',
                            loading: '正在保存中...',
                            data: { "sids": sids },
                            success: function () {
                                LG.showSuccess('保存成功');
                                me.grid.isDataChanged = false;
                                me.reload();
                            },
                            error: function (message) {
                                LG.showError(message);
                            }
                        });
                    }

                }
                else {
                    LG.tip('请选择行!');
                }
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Word',
                        text: '导出Word',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-word-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch1 = $("#formsearch1")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch1.ligerForm({
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch1, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                    }
                });
                LG.commonSearch($formsearch1, me.grid);
            },

            view: function (rowdata) { //查看
                var me = this;
                var selected = me.grid.getSelectedRow();

                if (rowdata) {
                    selected = rowdata;
                }
                if (selected) {
                    $.ligerDialog.open({
                        width: 1100,
                        height: 620,
                        allowClose: true,
                        title: '查看故障处理',
                        url: "repfaultchkdetail.html?MenuNo=" + me.menuNo,
                        isHidden: false,
                        showMax: false,
                        showToggle: false,
                        showMin: false,
                        isResize: true,
                        slide: false,
                        onClosed: me.buttons[0].click,
                        data: { "sid": selected.FAULT_ID, "view": true }
                    });
                } else {
                    LG.tip('请选择行!');
                }
            },
            initSearchData: function () {

            },

            init: function () {
                var me = this;
                me.loadComboxData();
                me.setConfig();
                me.setGrid();
                me.setForm();
                return me;
            }
        };
        business.init();
        $("#gridform").ligerLayout({
            leftWidth: '58%',
            allowRightCollapse: false,
            allowLeftCollapse: false,
        });</script>
</body>
</html>
