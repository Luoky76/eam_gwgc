<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title>维修计划管理</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <div id="mainsearch" style="width: 98%">
        <form action="" id="formsearch" class="l-form">
        </form>
    </div>
    <form action="" id="mainform">
        <div id="maingrid">
        </div>
    </form>
    <script type="text/javascript">
        'use strict';
        var business = {
            menuNo: getQueryStringByName("MenuNo"),
            ver: getQueryStringByName("ver"),
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            { display: "编制日期", name: "_search_EIDT_DATE", dbname: "EIDT_DATE", newline: false, upper: true, type: "date", vt: "date", options: { showTime: false, format: "yyyy-MM-dd" } },
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "记录状态", name: "AUDITING", width: 100, type: "text", },
                            { display: "船舶名称", name: "DEVICE_NAME", width: 100, type: "text", },
                            { display: "维保部门", name: "WSEC_DEPT", width: 100, type: "text", },
                            { display: "维修类型", name: "MAINT_TYPE", width: 100, type: "text", },
                            { display: "维修处理方式", name: "DEAL_TYPE", width: 100, type: "text", },
                            { display: "计划提交日期", name: "AUDIT_TIME", width: 100, type: "text", },
                            { display: "计划开工时间", name: "PLAN_START_DATE", width: 100, type: "text", },
                            { display: "计划完工时间", name: "PLAN_END_DATE", width: 100, type: "text", },
                            { display: "船舶编号", name: "DEVICE_NO", width: 100, type: "text", },
                            { display: "资产编号", name: "ASSET_CODE", width: 100, type: "text", },
                            { display: "计划单号", name: "PLAN_CODE", width: 100, type: "text", },
                            { display: "使用部门", name: "DEPT_NAME", width: 100, type: "text", },
                            { display: "负责人", name: "CHARGE_USER", width: 100, type: "text", },
                            { display: "备注", name: "PLAN_MEMO", width: 100, type: "text", }
                        ],
                    }
                };
            },
            grid: null,
            searchForm: null,
            buttons: null,
            UserInfo:null,
            loadComboxData: function () {
                var me = this;
            },
            setGrid: function () {
                var me = this;
                var columns = me.config.grid.columns;
                for (var i = columns.length - 1; i >= 0; i--) {
                    if (!columns[i]) columns.splice(i, 1);
                }
                me.grid = $("#maingrid").ligerGrid({
                    autoWidth: true,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    dataAction: 'server',
                    toolbar: {},
                    url: 'Repair/RepairPlan/List',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: 'AUDITINGSORT ASC,EIDT_DATE',
                    sortOrder: 'DESC',
                    width: '100%',
                    height: '100%',
                    dateFormat: 'yyyy-MM-dd HH:mm',
                    checkbox: false,
                    usePager: true,
                    rownumbers: false,
                    enabledEdit: false,
                    clickToEdit: false,
                    onBeforeEdit: function (editParm) {
                        switch (editParm.column.name) {
                            case "":
                                if (editParm.record.__status == "add") return true;
                                else return false;
                                break;
                        }
                    },
                    onSuccess: function (data, g) {
                        if (data && data.Rows) {
                            var rows = data.Rows;
                            for (var i = 0, len = (rows || []).length; i < len; i++) {
                                rows[i].OLDSID = rows[i].SID;
                                rows[i].OLDMODIFYDATE = rows[i].MODIFYDATE;
                            }
                        }
                    },
                    rowAttrRender: function (rowdata, rowid) {
                        return "";
                    }
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "add":
                            me.add();
                            break;
                        case "modify":
                            me.modify();
                            break;
                        case "delete":
                            me.delete();
                            break;
                        case "Excel":
                            $.ligerDialog.open({
                                url: rootPath + "System/Export.html?exporttype=xls&MenuNo=" + me.menuNo,
                                modal: true
                            });
                            break;
                        case "Word":
                            $.ligerDialog.open({
                                url: rootPath + "System/Export.html?exporttype=doc&MenuNo=" + me.menuNo,
                                modal: true
                            });
                            break;
                    }
                }
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            add: function () { //新增
                var me = this;
                $.ligerDialog.open({
                    width: innerWidth - 50,
                    height: innerHeight - 50,
                    allowClose: true,
                    title: '[维修计划新增]',
                    url: "repair-plan-edit.html?MenuNo=" + me.menuNo + "&ver=" + me.ver,
                    isHidden: false,
                    showMax: true,
                    showToggle: false,
                    showMin: false,
                    isResize: true,
                    slide: false,
                    rownumbers: true,
                    onClosed: null,
                    data: { "sid": "" }
                });
            },
            modify: function () { //修改
                var me = this;
            },
            loadRecord: function () { //保存
                var me = this;
                LG.ajax({
                        jsToken: true,
                    url: 'Attendance/AttendanceDaily/LoadRecord',
                        loading: '正在同步中...',
                        success: function () {
                            LG.showSuccess('同步成功');
                            me.reload();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
            },
            reload: function () { //刷新
                var me = this;
                me.buttons[0].click();
            },
            delete: function () { //删除
                var me = this;
                if (me.grid.endEdit() != false) {
                    var selected = me.grid.getSelectedRows();
                    if (selected.length > 0) {
                        $.ligerDialog.confirm('确定删除吗?', function (confirm) {
                            if (confirm) {
                                for (var i = 0, len = (selected || []).length; i < len; i++) {
                                    me.grid.deleteRow(selected[i]);
                                }
                                me.save();
                            }
                        });
                    } else {
                        LG.tip('请选择行!');
                    }
                }
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Word',
                        text: '导出Word',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-word-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            setForm: function () {
                var me = this;
                var columns = me.config.search.fields;
                for (var i = columns.length - 1; i >= 0; i--) {
                    if (!columns[i]) columns.splice(i, 1);
                }
                var $formsearch = $("#formsearch")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid);
                            //var data = me.searchForm.getData();
                            //me.setGrid(data._search_EVENTTIMEB.format("yyyy-MM"), data._search_DEPARTCODE, data._search_EMPLOYEENAME, data._search_DEPT);
                        }
                    },

                    ],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                    }
                });
                me.buttons[0].click(); //查询
            },
            init: function () {
                var me = this;
                me.loadComboxData();
                me.setConfig();
                me.setGrid();
                me.setForm();
                return me;
            }
        };
        business.init();
    </script>
</body>

</html>
