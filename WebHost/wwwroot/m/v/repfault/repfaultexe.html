            getData: function () {
                var me = this;
                app.ajax({
                    async: false,
                    type: 'post',
                    url: 'Device/RepFault/GetFaultExeList',
                    success: function (data) {
                        me.list = data.Rows;
                        data.Rows.forEach((a) => {
                            a.AUDITING_B = me.auditingData.find((v) => v.ID == a.AUDITING_B).TEXT;
                            a.FAULT_STATUS = faultStatus.find((v) => v.ID == a.FAULT_STATUS).TEXT;
                            if (a.FAULT_DATE != null) {
                                var parts = a.FAULT_DATE.split(' ');
                                a.FAULT_DATE = parts[0];
                            }
                        });

                        var str = app.CreateListContentHtml(data.Rows, me.ListDict, true);
                        $("#repfault_list").html(str);

                        data.Rows.forEach((a) => {
                            $("#list-" + a.FAULT_ID).click(function () {
                                popupOpen(a.FAULT_ID);
                            });
                        });
                    },
                    error: function (message, data) {
                        app.dialog.error(message, function () { });
                        return;
                    }
                });
            },
            getCombox: function () {
                var me = this;
                app.ajax({
                    async: false,
                    type: 'post',
                    url: 'Device/RepFault/ComboxData',
                    success: function (data) {
                        data.shipInfo.forEach((a) => {
                            var code = a.VALUE.length > 0 ? '(' + a.VALUE + ')' : "";
                            shipSelect.push({ "ID": a.ID, "TEXT": a.TEXT + code, "VALUE": a.EXTEND });
                        });
                        data.deviceInfo.forEach((a) => {
                            var code = a.VALUE.length > 0 ? '(' + a.VALUE + ')' : "";
                            deviceSelect.push({ "ID": a.ID, "TEXT": a.TEXT + code, "VALUE": a.EXTEND1 });
                        });
                        faultStatus = data.faultStatus;
                        maintDept = data.maintDept;
                        shipInfo = data.shipInfo;
                        deviceInfo = data.deviceInfo;
                        disposeType = data.disposeType;
                        deviceStatus = data.deviceStatus;
                        repType = data.repType;
                        faultSrc = data.faultSrc;
                    },
                    error: function (message, data) {
                        app.dialog.error(message, function () { });
                        return;
                    }
                });

                app.ajax({
                    async: false,
                    type: 'post',
                    url: 'popup/users',
                    success: function (data) {
                        data.forEach((a) => {
                            var station = a.Station.length > 0 ? '(' + a.Station + ')' : "";
                            userList.push({ "ID": a.Id, "TEXT": a.Name + station, "VALUE": a.Name });
                        });
                    },
                    error: function (message, data) {
                        app.dialog.error(message, function () { });
                        return;
                    }
                });

                app.ajax({
                    async: false,
                    type: 'post',
                    url: 'Device/RepFault/ImportList',
                    success: function (data) {
                        data.Rows.forEach((a) => {
                            var text = a.NUM ? '(库存数量:' + a.NUM + ')' : "";
                            var id = a.NUM ? '_' + a.NUM : "";
                            SpList.push({ "ID": a.SP_NAME + id, "TEXT": a.SP_NAME + text, "VALUE": a.SP_CODE });
                            a.TEXT_ID = a.SP_NAME + id;
                        });
                        SpOrList = data.Rows;
                    },
                    error: function (message, data) {
                        app.dialog.error(message, function () { });
                        return;

                $('#refresh').on('click', function (e) {
                    me.getData();
                    me.initSearchbar();

                        checkedIDList.push({ FAULT_ID: x.value, AUDITING_B: "0" });

                        app.dialog.error("请勾选后在点删除", function () { });
                        return false;

                    var flag = true;
                    checkedIDList.forEach((a) => {
                        var aut = me.list.find((v) => v.FAULT_ID == a.FAULT_ID).AUDITING_B;
                        if (aut == "已提交") {
                            app.dialog.error("已提交不能删除", function () { });
                            flag = false;
                            return false;
                        }

                    if (flag) {
                        app.dialog.confirm('确定要删除？', '删除', function () {

                            var deleteRow = {};
                            deleteRow["Deleted"] = checkedIDList;

                                type: 'post',

                                    app.dialog.alert("删除成功", function () {

                                    });
                                },
                                error: function (message, data) {
                                    app.dialog.error(message, function () { });
                                    return;
                                }
                            });
                        })

                });

            { display: "故障分类", name: "REP_TYPE_ID", Option: repType, validate: { required: true } },
            { display: "故障库编码", name: "FRDB_CODE" },
            { display: "开工时间", name: "ORDER_DATE", validate: { required: true } },
            { display: "完工时间", name: "COMPLETE_DATE", validate: { required: true } },
            { display: "维修工时(H)", name: "REPAIR_HOURS", readOnly: true },

        ];
        //处理信息
        var Info_popup = app.popup.create({
            content: `
                                                                                <div class="popup answersheet">
                                                                                    <div class="view">
                                                                                        <div class="page">

                                                                                                <div class="navbar-inner" style="background-color:rgb(0,125,255);">

                                                                                            <div class="toolbar tabbar toolbar-top">

                                                                                                    --f7-tabbar-link-active-border-color: #fff;

                                                                                                    <button class="col button button-large button-fill" id="sumbit" style="background-color: orange">提交</button>
                                                                                                    <button class="col button button-large button-fill" id="attach" style="background-color: red">上传附件</button>
                                                                                                </div>
                                                                                            </div>
                                                                                            <div class="toolbar toolbar-bottom " id="menu2" style="display: none;">
                                                                                                <div class="toolbar-inner">
                                                                                                    <button class="col button button-large button-fill" id="AddDetail" >新增</button>
                                                                                                    <button class="col button button-large button-fill" id="DeleteDetail" style="background-color: red">删除</button>
                                                                                                </div>
                                                                                            </div>
                                                                                            <div class="toolbar toolbar-bottom " id="menu3" style="display: none;">

            ,
            on: {
                open: function () {
                    var me = this;
                    var ID = me.params.FAULT_ID;
                    //保存事件
                    $("#save").off('click').click(function () {
                        let data = app.form.convertToData("#detail_bg");
                        data.FAULT_ID = ID;

                        if (data.WDEPT_ID == null || data.WDEPT_ID == '' || data.WDEPT_ID == '-99') {
                            app.dialog.error("请选择维保部门");
                            return
                        }

                        if (data.REPAIR_USERID == null || data.REPAIR_USERID == '' || data.REPAIR_USERID == '-99') {
                            app.dialog.error("请选择维修人");
                            return
                        }

                        var da = userList.find((va) => va.ID == data.REPAIR_USERID);
                        if (da != null) {
                            data.REPAIR_USER = da.TEXT;
                        }

                        if (data.SHIP_ID == null || data.SHIP_ID == '' || data.SHIP_ID == '-99') {
                            app.dialog.error("请选择船舶");
                            return
                        }
                        if (data.DEVICE_STATUS == null || data.DEVICE_STATUS == '' || data.DEVICE_STATUS == '-99') {
                            app.dialog.error("请选择设备状态");
                            return
                        }

                        if (data.DEVICE_ID == null || data.DEVICE_ID == '' || data.DEVICE_ID == '-99') {
                            app.dialog.error("请选择设备");
                            return
                        }

                        if (data.FAULT_DATE == null || data.FAULT_DATE == '' || data.FAULT_DATE == '-99') {
                            app.dialog.error("请选择故障发生时间");
                            return
                        }

                        if (data.FAULT_DESCRIBE == null || data.FAULT_DESCRIBE == '' || data.FAULT_DESCRIBE == '-99') {
                            app.dialog.error("请填写故障现象描述");
                            return
                        }
                        if (data.DISPOSE_TYPE == null || data.DISPOSE_TYPE == '' || data.DISPOSE_TYPE == '-99') {
                            app.dialog.error("请选择处理方式");
                            return
                        }
                        if (data.REP_TYPE_ID == null || data.REP_TYPE_ID == '' || data.REP_TYPE_ID == '-99') {
                            app.dialog.error("请选择故障分类");
                            return
                        }
                        if (data.ORDER_DATE == null || data.ORDER_DATE == '' || data.ORDER_DATE == '-99') {
                            app.dialog.error("请选择开工时间");
                            return
                        }
                        if (data.COMPLETE_DATE == null || data.COMPLETE_DATE == '' || data.COMPLETE_DATE == '-99') {
                            app.dialog.error("请选择完工时间");
                            return
                        }
                        if (data.FAULT_REASON == null || data.FAULT_REASON == '') {
                            app.dialog.error("故障及解决方法描述不能为空");
                            return
                        }
                        if (data.MEASURES == null || data.MEASURES == '') {
                            app.dialog.error("解决方法不能为空");
                            return
                        }

                        //判断时间
                        var startDate = data.ORDER_DATE;
                        var completeDate = data.COMPLETE_DATE;
                        var start = new Date(startDate);
                        var complete = new Date(completeDate);

                        if (!startDate || !completeDate) {
                            $('#REPAIR_HOURS').val("");
                            return;
                        }

                        if (start >= complete) {
                            $('#ORDER_DATE').val("");
                            $('#COMPLETE_DATE').val("");
                            $('#REPAIR_HOURS').val("");
                            app.dialog.error("开工时间不能大于完工时间或者当前时间！请重新选择！");
                            return;
                        }

                        var now = new Date();
                        if (complete > now) {
                            $('#COMPLETE_DATE').val("");
                            app.dialog.error("完工时间不能大于当前时间！");
                            return;
                        }

                        var timeDiff = complete - start;
                        var minutesDiff = Math.round(timeDiff / 1000 / 60);
                        data.REPAIR_HOURS = minutesDiff;


                        var AddRow = new Object();
                        if (ID) {
                            data.AUDITING_B = "0";
                            data.FAULT_STATUS = "30";
                            data.FAULT_SRC = "10";
                            data.DISPOSE_TYPE = "2";
                            AddRow["Updated"] = [data];
                        }
                        else {
                            AddRow["Added"] = [data]
                        }
                        AddRow["Original"] = [formdata];

                        app.ajax({

                                "request": AddRow
                            },
                            url: 'Device/RepFault/ManageFaultExe',
                            success: function (data) {
                                //处理附件
                                submitAttach(data);
                                if (ID) {
                                    $("#modify_list").click();
                                } else {
                                    Info_popup.close();
                                }
                                business.getData();
                            }
                        });
                    });
                    //提交事件
                    $("#sumbit").off('click').click(function () {
                        let data = app.form.convertToData("#detail_bg");

                        if (data.AUDITING_B == "1") {
                            app.dialog.error("该单据已经提交！");

                        }

                                url: 'Device/RepFault/SubmitFaultExe',
                                success: function () {
                                    Info_popup.close();
                                    business.getData();
                                }
                            });
                        });
                    });

                            }

                            var deleteRow = {};
                            deleteRow["Deleted"] = checkedIDList;

                            app.ajax({
                                async: false,
                                type: 'post',
                                url: 'Device/RepFault/ManageFaultSp',
                                data: {
                                    "request": deleteRow
                                },
                                success: function (data) {
                                    app.dialog.alert("删除成功", function () {
                                        CreateSpDetail(ID);

                                    pepDataDetail = data.Rows[0];
                                    app.form.fillFromData('#detail_bg_pep', pepDataDetail);
                                    showDetailBtn(aud == "0")
                                }
                            }
                        });
                    } else {
                        var str = app.CreatePopupContentHtml(pepDetail);
                        $("#detail_bg_pep").html(str);
                    }

                }
            }
        });
        //按钮显示隐藏
        function showDetailBtn(isEdit) {
            if (isEdit) {
                $("#saveDetail").show();
                $("#savePepDetail").show();
            } else {
                $("#saveDetail").hide();
                $("#savePepDetail").hide();
            }
        }
        //图片上传
        function uploadPhoto(even) {
            app.methods.initWX(function () {
                wx.chooseImage({
                    count: 9, // 默认9
                    sizeType: ['original', 'compressed'], // 可以指定是原图还是压缩图，默认二者都有
                    sourceType: ['album', 'camera'], // 可以指定来源是相册还是相机，默认二者都有
                    success: function (res) {
                        var localIds = res.localIds; // 返回选定照片的本地ID列表，localId可以作为img标签的src属性显示图片
                        var index = 0;
                        function f1(index) {
                            return new Promise(function (resolve, reject) {
                                wx.getLocalImgData({
                                    localId: localIds[index], // 图片的localID
                                    success: function (res) {
                                        var localData = res.localData; // localData是图片的base64数据，可以用img标签显示
                                        var showSrc = "";
                                        //设置图片
                                        if (localData.indexOf('data:image') != 0) {
                                            //判断是否有这样的头部
                                            src = 'data:image/jpeg;base64,' + localData;
                                            var arr = src.split(',');
                                            var bstr = atob(arr[arr.length - 1]),
                                                n = bstr.length,
                                                u8arr = new Uint8Array(n);
                                            while (n--) {
                                                u8arr[n] = bstr.charCodeAt(n);
                                            }
                                            var file = new File([u8arr], "upload.jpg", {
                                                type: "image/jpeg"
                                            });

                                            if (window.createObjcectURL != undefined) {
                                                showSrc = window.createOjcectURL(file);
                                            } else if (window.URL != undefined) {
                                                showSrc = window.URL.createObjectURL(file);
                                            } else if (window.webkitURL != undefined) {
                                                showSrc = window.webkitURL.createObjectURL(file);
                                            }
                                        } else {
                                            src = localData;
                                            showSrc = localData;
                                        }

                                        //begin 将附件信息放入到附件列表中
                                        //var attachObj = new Object;
                                        //attachObj.formFile = file
                                        //attachObj.fileName = new Date().format("yyyyMMddhhmmss");
                                        //attachObj.tableName = "HIDDEN_DANGER_APPLY"
                                        //attachObj.attachField = "apply"
                                        //attachList.push(attachObj);
                                        //end 附件放入附件列表处理结束

                                        var base64 = res.localData; // localData是图片的base64数据，可以用img标签显示
                                        var arr = base64.split(',');
                                        var mime = arr.length > 1 ? arr[0].match(/:(.*?);/)[1] : "image/jpeg";
                                        var bstr = atob(arr[arr.length - 1]),
                                            n = bstr.length,
                                            u8arr = new Uint8Array(n);
                                        while (n--) {
                                            u8arr[n] = bstr.charCodeAt(n);
                                        }
                                        var file = new File([u8arr], "upload.jpg", {
                                            type: mime
                                        });
                                        var attachObj = new Object;
                                        attachObj.formFile = file
                                        var paramObj = new Object;
                                        paramObj.fileName = new Date().format("yyyyMMddhhmmss");
                                        paramObj.tableName = "REP_FAULT"
                                        paramObj.attachField = "apply"
                                        attachObj.paramObj = paramObj;

                                        //var formData = new FormData();
                                        //formData.append("formFile", file);
                                        //formData.append("folder", "SealImg");
                                        //formData.append("data", "123123");
                                        //var formData = new FormData();
                                        //formData.append("formFile", file);
                                        //formData.append("folder", "SealImg");
                                        //formData.append("data", "123123");
                                        var index = attachList.length
                                        attachList.push(attachObj);

                                        //var html = ' <li onclick="DangerReportPage.editPhoto(this)" data-imgUrl="' + src + '"   class="weui-uploader__file" style="background-image:url(' + showSrc + ')"></li>';
                                        var html = ' <img src="' + src + '" width="100" style="padding-top:5px;padding-left:5px" id="imgUpload' + index + '" class = "imgAdd" />'
                                        //$(even).siblings(".weui-uploader__files").prepend(html);
                                        //$("#img").append(html);
                                        $("#imgSpan").append(html);
                                        resolve();
                                    }
                                });
                            });
                        }
                        function asyncControl() {
                            if (index < localIds.length) {
                                f1(index).then(function () {
                                    index++;
                                    asyncControl();
                                });
                            } else {
                                // console.log('数据全部处理完了');
                            }
                        }
                        asyncControl();
                    }
                })
            });
        }
    </script>
