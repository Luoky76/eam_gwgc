<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2196f3">
    <title>微平台</title>
    <link rel="stylesheet" href="../dist/Framework7/mobile.css?v=1" />
    <style type="text/css">
        .toggle-password {
            position: absolute;
            right: 30px;
            top: 50%;
            z-index: 999;
            transform: translateY(-50%);
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="view view-main">
            <div class="page-content login-screen-content">
                <div class="login-screen-title">忘记密码</div>
                <form id="my-form">
                    <div class="list no-hairlines-md">
                        <ul>
                            <li class="item-content item-input">
                                <div class="item-media">
                                    <i class="f7-icons">person</i>
                                </div>
                                <div class="item-inner">
                                    <div class="item-title item-floating-label">手机号或账号</div>
                                    <div class="item-input-wrap">
                                        <input type="text" id="username" name="username" placeholder="请输入手机号或账号" required validate trim />
                                        <span class="input-clear-button"></span>
                                    </div>
                                </div>
                            </li>
                            <li class="item-content item-input">
                                <div class="item-media">
                                    <i class="f7-icons">person</i>
                                </div>
                                <div class="item-inner">
                                    <div class="item-title item-floating-label">验证码</div>
                                    <div class="item-input-wrap row">
                                        <div class="col-55">
                                            <input type="password" id="oldpassword" name="oldpassword" placeholder="请输入验证码" required validate trim />
                                        </div>
                                        <div id="sms-code" class="col-45 button button-small">获取验证码</div>
                                    </div>
                                </div>
                            </li>
                            <li class="item-content item-input">
                                <div class="item-media">
                                    <i class="f7-icons">lock</i>
                                </div>
                                <div class="item-inner">
                                    <div class="item-title item-floating-label">新密码</div>
                                    <div class="item-input-wrap">
                                        <span class="toggle-password">👁️</span>
                                        <input type="password" id="newpassword" name="newpassword" placeholder="请输入新密码" required validate trim />
                                        <span class="input-clear-button"></span>
                                    </div>
                                </div>
                            </li>
                            <li class="item-content item-input">
                                <div class="item-media">
                                    <i class="f7-icons">lock</i>
                                </div>
                                <div class="item-inner">
                                    <div class="item-title item-floating-label">新密码</div>
                                    <div class="item-input-wrap">
                                        <span class="toggle-password">👁️</span>
                                        <input type="password" id="againpassword" name="againpassword" placeholder="请再次输入新密码" required validate trim />
                                    </div>
                                </div>
                            </li>
                        </ul>
                    </div>
                </form>
                <div class="block">
                    <p class="row">
                        <button id="btnLogin" name="btnLogin" type="button" class="col button button-raised button-fill">确定</button>
                    </p>
                </div>
                <div class="block">
                    <p class="row">
                        <div class="block-footer">技术支持:厦门自贸试验区电子口岸有限公司</div>
                    </p>
                </div>
            </div>
        </div>
    </div>
    <script type="text/javascript" src="../dist/Framework7/mobile.js?v=1"></script>
    <script type="text/javascript" src="../dist/Framework7/app.js?v=1"></script>
    <script type="text/javascript">
        'use strict';
        var business = {
            //提交
            submit: function () {
                var form = $$("#my-form");
                if (!app.methods.validateInputs(form)) {
                    return;
                }
                var formData = app.form.convertToData(form);
                if (formData.newpassword != formData.againpassword) {
                    app.dialog.error('两次密码输入不一致。');
                    return;
                }
                formData.username = encrypt(formData.username);
                formData.oldpassword = encrypt(formData.oldpassword);
                formData.newpassword = encrypt(formData.newpassword);
                app.ajax({
                    noGlobal: true,
                    url: 'auth/resetpassword',
                    jsToken: true,
                    tokenOptions: {
                        url: "auth/logintoken"
                    },
                    data: formData,
                    success: function (data) {
                        app.dialog.alert('密码操作成功', function () {
                            var fromUrl = getQueryStringByName("FromUrl");
                            if (((fromUrl || "").toLowerCase().indexOf("http") >= 0) && (fromUrl.indexOf(location.host) < 0)) fromUrl = "";
                            fromUrl = fromUrl || "index.html";
                            location.href = fromUrl;
                        });
                    }
                });
            },
            smsCode: function () {
                var me = this;
                var phone = ($("#username").val() || "").trim();
                if (!phone) {
                    app.dialog.error('请输入手机号或账号。');
                    return;
                }
                app.ajax({
                    noGlobal: true,
                    url: 'auth/smscode',
                    jsToken: true,
                    tokenOptions: {
                        url: "auth/smstoken"
                    },
                    data: { phone: encrypt(phone) },
                    success: function () {
                        var time = 120;
                        var handler = null;
                        var inner = function () {
                            time = time - 1;
                            if (time == 0) {
                                me.$sms.text("获取验证码");
                                me.$sms.removeClass("disabled");
                                clearInterval(handler);
                                return;
                            }
                            me.$sms.text("(" + time + ")秒后重新发送");
                        }
                        me.$sms.addClass("disabled");
                        me.$sms.text("(" + time + ")秒后重新发送");
                        handler = setInterval(inner, 1000);
                    }
                });
            },
            //事件绑定
            eventBind: function () {
                var me = this;
                $$("#btnLogin").off("click").click(function () {
                    me.submit();
                });
                $$("#username").keydown(function (e) {
                    if (e.keyCode == 13) {
                        e.preventDefault();
                        $$("#oldpassword").focus();
                    }
                });
                $$("#oldpassword").keydown(function (e) {
                    if (e.keyCode == 13) {
                        e.preventDefault();
                        $$("#newpassword").focus();
                    }
                });
                $$("#newpassword").keydown(function (e) {
                    if (e.keyCode == 13) {
                        e.preventDefault();
                        $$("#againpassword").focus();
                    }
                });
                $$(".toggle-password").click(function () {
                    var dom = $(this), pwd = dom.nextAll("input");
                    var isPassword = pwd.attr("type") === "password";
                    pwd.attr("type", isPassword ? "text" : "password");
                    dom.text(isPassword ? "🙈" : "👁️");
                });
                me.$sms = $("#sms-code");
                me.$sms.click(function (e) {
                    me.smsCode();
                });
            },
            //初始化
            init: function () {
                var me = this;
                me.eventBind();
            }
        };
        business.init();
    </script>
</body>
</html>
