<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2196f3">
    <title>微平台</title>
    <link rel="stylesheet" href="../dist/Framework7/mobile.css?v=1" />
</head>

<body>
    <div id="app">
        <div class="view view-main view-skip-init">
            <div data-name="main" class="page">
                <div class="toolbar tabbar toolbar-bottom">
                    <div id="root-menu" class="toolbar-inner">
                    </div>
                </div>
                <div id="root-tabs" class="tabs tabs-routable">
                </div>
            </div>
        </div>
    </div>
    <!--<script type="text/javascript" src="https://res.wx.qq.com/open/js/jweixin-1.6.0.js"></script>-->
    <script type="text/javascript" src="../dist/Framework7/mobile.js?v=1"></script>
    <script type="text/javascript" src="../dist/Framework7/app.js?cache=1&v=1"></script>
    <script type="text/javascript" src="../dist/Framework7/broadcast.js?cache=1&v=1"></script>
    <script type="text/javascript" defer src="../../lib/echarts/echarts.js?ver=1"></script>
    <script type="text/javascript" defer src="../../lib/echarts/echarts.expand.js?cache=1&ver=1"></script>
    <script type="text/javascript">
        'use strict';
        var business = {
            basePageName: location.pathname.substring(location.pathname.lastIndexOf("/") + 1),
            //初始路由
            initRoutes: function () {
                var me = this;
                app.routes.push({
                    name: "index",
                    path: "/",
                    url: gksybConfigs.urlBase + me.basePageName,
                    tabs: []
                }, {
                    name: "iframe",
                    path: "/iframe/:url/:title/:backType",
                    componentUrl: gksybConfigs.urlBase + "iframe.html",
                }, {
                    name: "common-query",
                    path: "/query/:view/",
                    url: gksybConfigs.urlBase + "query.html",
                }, {
                    name: "common-report",
                    path: "/report/:view/",
                    componentUrl: gksybConfigs.urlBase + "report.html",
                }, {
                    name: "flow-detail",
                    title: "单据详情",
                    path: "/flow-detail/:id/:isView",
                    componentUrl: gksybConfigs.urlBase + "workflow/flow-detail.html"
                }, {
                    name: "flow-create",
                    title: "发起流程",
                    path: "/flow-create/:flowCode",
                    componentUrl: gksybConfigs.urlBase + "workflow/flow-detail.html",
                }, {
                    name: "flow-restart",
                    title: "重新发起",
                    path: "/flow-restart/:copyTaskId",
                    componentUrl: gksybConfigs.urlBase + "workflow/flow-detail.html",
                });
            },
            //退出
            exit: function () {
                app.ajax({
                    url: 'auth/exit',
                    headers: {
                        ticket: window.ticket
                    },
                    success: function () {
                        var inWeixin = window.session.Openid;
                        ticket = null;
                        session = null;
                        if (inWeixin) {
                            weixinOauth();
                            return;
                        }
                        window._toLogin();
                    }
                });
            },
            //菜单数据标准化
            customMenuData: function (menus) {
                var firstRoute = app.routes.length > 0 ? app.routes[0] : null;
                var hasTabHome = false, homeMenu = null;
                for (var i = 0, l = menus.length; i < l; i++) {
                    var menu = menus[i];
                    menu.MENUURL = menu.MENUURL || "";
                    menu.MENUCSS = menu.MENUICON || "";
                    var array = menu.MENUCSS.split(" ");
                    menu.MENUICON = array.length > 1 ? array[array.length - 1] : menu.menuMENUCSS;
                    if (menu.MENUICON.includes('.')) {
                        menu.iconUrl = window.gksybConfigs.apiBase + menu.MENUICON;
                    }
                    menu.Extend = "";
                    menu.Path = "/" + menu.MENUNO + "/";
                    menu.isTabHome = menu.MENUCSS.indexOf("tab-home") >= 0;
                    if (!menu.MENUPARENTNO) {
                        if (menu.isTabHome && !hasTabHome) {
                            homeMenu = menu;
                            hasTabHome = true;
                        }
                        if (!homeMenu) homeMenu = menu;
                    }
                    if (menu.MENUURL.length < 2) continue;
                    if (menu.MENUURL.indexOf("javascript:") >= 0 || menu.MENUURL.indexOf("http") === 0) {
                        menu.Path = menu.MENUURL;
                        menu.Extend = "external";
                        continue;
                    }
                    menu.isComponent = menu.MENUCSS.indexOf("component") >= 0;
                    menu.MENUURL = menu.MENUURL.replace(/.aspx/i, ".html");
                    menu.MENUURL = gksybConfigs.urlBase + menu.MENUURL;
                    var bolContinue = true;
                    var route = {
                        id: menu.MENUNO,
                        name: menu.MENUNO,
                        path: menu.Path,
                        url: menu.isComponent ? undefined : menu.MENUURL,
                        componentUrl: menu.isComponent ? menu.MENUURL : undefined,
                        title: menu.MENUNAME,
                        on: {}
                    };
                    if (!menu.MENUPARENTNO && firstRoute.tabs) {
                        firstRoute.tabs.push(route);
                        continue;
                    }
                    for (var j = 0, l2 = app.routes.length; j < l2; j++) {
                        var o = app.routes[j];
                        if (o.path == menu.Path) {
                            app.routes[j] = app.utils.extend(true, route, o);
                            bolContinue = false;
                            break;
                        }
                    }
                    if (!bolContinue) continue;
                    app.routes.push(route); //加入路由
                }
                if (!homeMenu) return;
                homeMenu.isTabHome = true;
                homeMenu.Path = "/";
                if (!firstRoute.tabs) return;
                for (var i = 0, l = firstRoute.tabs.length; i < l; i++) {
                    var tab = firstRoute.tabs[i];
                    if (tab.id === homeMenu.MENUNO) {
                        tab.path = homeMenu.Path;
                        break;
                    }
                }
            },
            //加载菜单
            buildContent: function () {
                var menus = app.menus;
                var htmlMenu = [], htmlTabs = [];
                for (var i = 0, l = menus.length; i < l; i++) {
                    var menu = menus[i];
                    htmlMenu.push('<a href="' + menu.Path + '" class="tab-link" data-route-tab-id="' + menu.MENUNO + '"><i class="' + menu.MENUCSS +
                        '">' + menu.MENUICON + '</i><span class="tabbar-label">' + menu.MENUNAME +
                        '</span></a>');
                    htmlTabs.push('<div class="tab page-content bg-color" id="' + menu.MENUNO + '"></div>');
                }
                $$("#root-menu").html(htmlMenu.join(''));
                $$("#root-tabs").html(htmlTabs.join(''));
            },
            //加载菜单
            loadMenu: function () {
                var me = this;
                app.ajax({
                    _toLogin: true,
                    url: 'auth/mymenus',
                    async: false,
                    success: function (menus) {
                        me.customMenuData(menus);
                        app.menus = menus.toTree("MENUNO", "MENUPARENTNO");//转成树形结构
                        me.buildContent();
                    }
                });
            },
            //url处理
            handleUrl: function () {
                var url = getQueryStringByName("r");
                if (!url) return;
                url = app.params.view.browserHistorySeparator + "/" + url + "/";
                location.replace(location.origin + location.pathname + url);
            },
            //获取菜单
            getMenu: function (menuno) {
                for (var i = 0, l = app.menus.length; i < l; i++) {
                    var menu = app.menus[i];
                    if (menu.MENUNO === menuno) {
                        return menu;
                    }
                }
            },
            //内嵌其他网页
            iframe: function (url, title, backType) {
                url = "/iframe/" + encodeURIComponent(url) + "/" + encodeURIComponent(title || "") + "/" + (backType || "0");
                mainView.router.navigate(url);
            },
            showMessage: function (info) {
                var dialogMode = info.DialogMode || "提示";
                var content = info.Content;
                switch (dialogMode) {
                    case '通知':
                        app.notification.create({
                            title: info.Title,
                            text: content,
                            closeTimeout: 3000,
                        }).open();
                        break;
                    case '对话框':
                        app.dialog.alert(content, info.Title);
                        break;
                    default:
                        app.toast.create({
                            text: content,
                            position: 'center',
                            closeTimeout: 2000,
                        }).open();
                }
            },
            initMessageCenter: function () {//消息中心
                var me = this;
                me.channel = Broadcast.getInstance();//创建广播通道
                me.channel.onMessageCenter = function (info) {
                    me.showMessage(info);
                };
            },
            //初始化
            init: function () {
                var me = this;
                if (window.isInWeixin()) $$("#app").addClass("weixin-app");
                me.handleUrl();
                me.initRoutes();
                me.loadMenu();
                app.methods.initMainView({
                    url: "/",
                    browserHistoryRoot: gksybConfigs.urlBase + me.basePageName,
                    browserHistory: true
                });
                me.initMessageCenter();
                app.mainBusiness = me;//暴露给子组件调用
            }
        };
        business.init();
    </script>
</body>
</html>
