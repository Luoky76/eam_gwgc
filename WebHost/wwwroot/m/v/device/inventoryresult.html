<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, minimal-ui, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2196f3">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>设备盘点结果</title>
    <link rel="stylesheet" href="../../../dist/Framework7/mobile.css?v=1" />
</head>

<body class="color-theme-blue">
    <div id="app">
        <div class="statusbar">
        </div>
        <!-- Your main view, should have "view-main" class -->
        <div class="view view-main">
            <div class="page" data-name="home">
                <div class="navbar">
                    <div class="navbar-bg"></div>
                    <div class="navbar-inner sliding">
                        <div class="title">设备盘点结果</div>

                        <div class="subnavbar">
                            <form class="searchbar" id="searchbar-autocomplete">
                                <div class="searchbar-inner">
                                    <div class="searchbar-input-wrap">
                                        <input type="search" placeholder="请输入..." id="searchText" />
                                        <i class="searchbar-icon"></i>
                                        <span class="input-clear-button"></span>
                                    </div>
                                    <span class="searchbar-disable-button">Cancel</span>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="list page-content" style="padding-top: 80px; padding-bottom: 80px">
                    <div id="scan_list">
                    </div>
                </div>

                <div class="toolbar toolbar-bottom-md">
                    <div class="toolbar-inner">
                        <a href='javascript:app.methods.toUrl("back")' class="link external">
                            <i class="f7-icons">arrow_left</i>
                            <span class="ios-only">返回</span>
                        </a>
                        <button class="button" id="refresh">
                            刷新
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="text/javascript" src="../../../dist/Framework7/mobile.js?v=1"></script>
    <script type="text/javascript" src="../../../dist/Framework7/app.js?v=1"></script>
    <script type="text/javascript" id="scriptBlock">
        'use strict';
        var formdata;
        var formDataDetail;
        var states;
        var scanstatus;//盘点状态
        var busResult = {
            scanStatus: [],
            storeSou: [],
            ListDict: [
                { display: "主键", name: "SCAN_ID", PrimaryKey: "SCAN_ID", readOnly: false, isPrimaryKey: true, isShow: false },
                { display: "盘点状态", name: "STATUS", },
                { display: "盘点单号", name: "SCAN_CODE", },
                { display: "盘点部门", name: "DEPT_NAME", },
                { display: "设备类别", name: "TYPE_NAME", },
                { display: "盘点日期", name: "SCAN_DATE", }
            ],
            getData: function () {
                var me = this;
                app.ajax({
                    async: false,
                    type: 'post',
                    url: 'Device/InventoryTask/GetDeviceScanResult',
                    //data: { "where": where },
                    success: function (data) {
                        me.list = data.Rows;

                        data.Rows.forEach((a) => {
                            a.STATUS = busResult.scanStatus.find((v) => v.ID == a.STATUS).TEXT;
                            if (a.SCAN_DATE != null) {
                                var parts = a.SCAN_DATE.split(' ');
                                a.SCAN_DATE = parts[0];
                            }
                        });

                        var str = app.CreateListContentHtml(data.Rows, me.ListDict, false);
                        $("#scan_list").html(str);

                        data.Rows.forEach((a) => {
                            $("#list-" + a.SCAN_ID).click(function () {
                                popupOpen(a.SCAN_ID, a.STATUS);
                            });
                        });
                    },
                    error: function (message, data) {
                        app.dialog.error(message, function () { });
                        return;
                    }
                });
            },
            getCombox: function () {
                var me = this;
                app.ajax({
                    async: false,
                    type: 'post',
                    url: 'Device/InventoryTask/ComboxData',
                    success: function (data) {
                        me.scanStatus = data.scanStatus;
                        states = data.status;
                    },
                    error: function (message, data) {
                        app.dialog.error(message, function () { });
                        return;
                    }
                });
            },
            init: function () {
                var me = this;

                me.getCombox();
                me.getData();
                me.initSearchbar();
                me.initFreshButton();
            },

            initSearchbar: function () {
                app.searchbar.create({
                    el: '.searchbar',
                    searchContainer: '.list',
                    searchIn: ['.item-inner'],
                    on: {
                        search: function (sb, query, previousQuery) {
                            console.log(query, previousQuery);
                        }
                    }
                })
            },

            initFreshButton: function () {
                var me = this;
                //刷新按钮
                $('#refresh').on('click', function (e) {
                    me.getData();
                    me.initSearchbar();
                });
            }

        };
        busResult.init();
        function popupOpen(id,status) {
            scan_popup.params = { "SCAN_ID": id, "STATUS": status };
            scan_popup.open();
            $("#popup-close").click(function () {
                scan_popup.close();
            });
        }
        //查看详情
        var resultInfo = [
            { display: "主键", name: "SCAN_ID", PrimaryKey: "SCAN_ID", readOnly: true, isPrimaryKey: true, isShow: false },
            { display: "盘点单号", name: "SCAN_CODE", readOnly: true, },
            { display: "盘点状态", name: "STATUS", readOnly: true, },
            { display: "盘点部门", name: "DEPT_NAME", readOnly: true, },
            { display: "设备类别", name: "TYPE_NAME", readOnly: true, },
            { display: "盘点人", name: "USER_NAME", readOnly: true, },
            { display: "盘点日期", name: "SCAN_DATE", readOnly: true, },
            { display: "二级单位", name: "SEC_DEPT", readOnly: true, },
            { display: "备注", name: "MEMO", readOnly: true, },
            { display: "SCAN_ID", name: "SCAN_ID", isShow: false },
        ];
        var scan_popup = app.popup.create({
            content: `
                                                                                                                <div class="popup answersheet">
                                                                                                                    <div class="view">
                                                                                                                        <div class="page">
                                                                                                                            <div class="navbar">
                                                                                                                                <div class="navbar-inner" style="background-color:rgb(0,125,255);">
                                                                                                                                    <div class="left link popup-close">
                                                                                                                                        <i class="f7-icons">arrow_left</i>
                                                                                                                                    </div>
                                                                                                                                    <div class="title">设备盘点结果</div>
                                                                                                                                </div>
                                                                                                                            </div>
                                                                                                                            <div class="toolbar tabbar toolbar-top">
                                                                                                                                <div class="toolbar-inner" style="
                                                                                                                                    --f7-tabbar-link-active-border-color: #fff;
                                                                                                                                    --f7-tabbar-link-active-color: black;
                                                                                                                                    --f7-tabbar-link-active-bg-color: white;
                                                                                                                                    --f7-tabbar-link-inactive-color: black;
                                                                                                                                    background-color: rgb(236, 235, 235);
                                                                                                                             ">
                                                                                                                                    <a href="#tab-1" class="tab-link tab-link-active" id="dg_list">设备盘点结果详情</a>
                                                                                                                                    <a href="#tab-2" class="tab-link" id="modify_list">设备盘点结果明细</a>
                                                                                                                                </div>
                                                                                                                            </div>
                                                                                                                            <div class="tabs">
                                                                                                                              <div id="tab-1" class="page-content tab tab-active">
                                                                                                                                <div class="list inline-labels no-hairlines-md">
                                                                                                                                    <form class="list" id="detail_bg"></form>
                                                                                                                                </div>

                                                                                                                              </div>

                                                                                                                              <div id="tab-2" class="page-content tab">

                                                                                                                                    <div class="list" id="modify_bg">
                                                                                                                                    </div>
                                                                                                                              </div>
                                                                                                                            </div>
                                                                                                                            <div class="toolbar toolbar-bottom " id="menu2" style="display: none;">
                                                                                                                                <div class="toolbar-inner">
                                                                                                                                    <button class="col button button-large button-fill" id="sumbit" >一键提交盘点结果</button>
                                                                                                                                </div>
                                                                                                                            </div>
                                                                                                                        </div>
                                                                                                                    </div>
                                                                                                                </div>`,
            on: {
                open: function () {
                    var me = this;
                    var ID = me.params.SCAN_ID;
                    scanstatus = me.params.STATUS;

                    //提交事件
                    $("#sumbit").off('click').click(function () {
                        app.dialog.confirm('确定要提交？', '提交', function () {
                            app.ajax({
                                type: 'post',
                                data: {
                                    "sid": ID
                                },
                                url: 'Device/InventoryTask/SubmitScanDet',
                                success: function () {
                                    scan_popup.close();
                                    busResult.getData();
                                }
                            });
                        });
                    });
                    $("#popup-close").click(function () {
                        detail_popup.close();
                        busResult.getData();
                    });

                    // 清单明细
                    if (ID) {
                        var where = JSON.stringify({
                            op: 'and',
                            rules: [{ field: 'SCAN_ID', op: 'equal', value: ID }]
                        });
                        app.ajax({
                            type: 'post',
                            data: {
                                "where": where
                            },
                            url: 'Device/InventoryTask/GetDeviceScanResult',
                            success: function (data) {
                                var str = "";
                                data.Rows.forEach((a) => {
                                    a.STATUS = busResult.scanStatus.find((v) => v.ID == a.STATUS).TEXT;
                                    if (a.SCAN_DATE != null) {
                                        var parts = a.SCAN_DATE.split(' ');
                                        a.SCAN_DATE = parts[0];
                                    }
                                });

                                str = app.CreatePopupContentHtml(resultInfo);
                                $("#detail_bg").html(str);
                                me.detail = data.Rows[0];
                                app.form.fillFromData('#detail_bg', me.detail);
                                showBtn();
                            }
                        });

                        //明细数据
                        $("#sumbit").show();
                        $("#modify_list").show();
                        CreateResultDetail(ID);
                    }
                    else {
                        //新增清空数据
                        $("#detail_bg").html(app.CreatePopupContentHtml(outAppInfoEdit));
                        /* app.form.fillFromData('#detail_bg');*/
                        $("#modify_list").hide();
                        $("#modify_bg").html('');
                        $("#sumbit").hide();
                    }
                }
            }
        });

        //按钮
        function showBtn() {
            $("#menu").show();
            $("#dg_list").click(function () {
                $("#menu2").hide();
            })
            $("#modify_list").click(function () {
                $("#menu2").show();
            });
        }
        var handle = [{ "ID": "0", "TEXT": "否" }, { "ID": "1", "TEXT": "是" }];
        var scanresult = [{ "ID": "盘盈", "TEXT": "盘盈" }, { "ID": "盘亏", "TEXT": "盘亏" }, { "ID": "正常", "TEXT": "正常" }];
        var resultDetail = [
            { display: "主键", name: "SCAN_DET_ID", PrimaryKey: "SCAN_DET_ID", readOnly: false, isPrimaryKey: true, isShow: false },
            { display: "已处理", name: "HANDLE", Option: handle },
            { display: "盘点结果", name: "SCAN_RESULT" },
            { display: "设备编号", name: "DEVICE_NO" },
            { display: "资产编号", name: "ASSET_CODE" },
            { display: "设备名称", name: "DEVICE_NAME" },
            { display: "设备类别", name: "TYPE_NAME" },
            { display: "当前管理状态", name: "STATUS" },
        ];
        //明细列表
        function CreateResultDetail(ID) {

            var where = JSON.stringify({
                op: 'and',
                rules: [{ field: 'SCAN_ID', op: 'equal', value: ID }]
            });

            app.ajax({
                type: 'post',
                data: { "where": where },
                url: 'Device/InventoryTask/GetDeviceScanDetails',
                success: function (data) {
                    formDataDetail = data.Rows;
                    // 清单
                    data.Rows.forEach((a) => {
                        a.STATUS = states.find((v) => v.ID == a.STATUS).TEXT;
                    });
                    var str = app.CreateListContentHtml(data.Rows, resultDetail, false);
                    $("#modify_bg").html(str);
                    data.Rows.forEach((a) => {
                        a.HANDLE = handle.find((v) => v.ID == a.HANDLE).TEXT;
                        $("#list-" + a.SCAN_DET_ID).click(function () {
                            detail_popup.params = { "SCAN_DET_ID": a.SCAN_DET_ID, "SCAN_ID": a.SCAN_ID};
                            detail_popup.open();
                            $("#popup-close").click(function () {
                                detail_popup.close();
                            })
                        })
                    });
                }
            });

        };
        var resultDetailInfoEdit = [
            { display: "主键", name: "SCAN_DET_ID", PrimaryKey: "SCAN_DET_ID", readOnly: true, isPrimaryKey: true, isShow: false },
            { display: "已处理", name: "HANDLE", readOnly: true },
            { display: "盘点结果", name: "SCAN_RESULT", validate: { required: true }, Option: scanresult,Searched: true },
            { display: "设备编号", name: "DEVICE_NO", readOnly: true, },
            { display: "资产编号", name: "ASSET_CODE", readOnly: true, },
            { display: "设备名称", name: "DEVICE_NAME", readOnly: true, },
            { display: "设备类别", name: "TYPE_NAME", readOnly: true, },

            { display: "设备型号", name: "DEVICE_TYPE", readOnly: true, },
            { display: "使用部门", name: "DEPT_NAME", readOnly: true, },
            { display: "当前管理状态", name: "STATUS", readOnly: true, },
            { display: "二级单位", name: "SEC_DEPT", readOnly: true, },
            { display: "备注", name: "MEMO", },
            { display: "外键", name: "SCAN_ID", isShow: false },
        ];
        var detail_popup = app.popup.create({
            content: `
                                                                                                                <div class="popup answersheet"id ="detail_popup">
                                                                                                                    <div class="view" >
                                                                                                                        <div class="page">
                                                                                                                            <div class="navbar">
                                                                                                                                <div class="navbar-inner" style="background-color:rgb(0,125,255);">
                                                                                                                                    <div class="left link popup-close">
                                                                                                                                        <i class="f7-icons">arrow_left</i>
                                                                                                                                    </div>
                                                                                                                                    <div class="title">明细详情</div>
                                                                                                                                </div>
                                                                                                                            </div>
                                                                                                                            <div class="tabs">
                                                                                                                              <div id="tab-1" class="page-content tab tab-active">
                                                                                                                                <div class="list inline-labels no-hairlines-md">
                                                                                                                                    <form class="list" id="detail_bg_detail">
                                                                                                                                     </form>
                                                                                                                                </div>
                                                                                                                              </div>
                                                                                                                            </div>
                                                                                                                             <div class="toolbar toolbar-bottom" id="menuDetail">
                                                                                                                                <div class="toolbar-inner">
                                                                                                                                    <button class="col button button-large button-fill" id="saveDetail" style="background-color: #2faa44">保存</button>
                                                                                                                                </div>
                                                                                                                            </div>
                                                                                                                        </div>
                                                                                                                    </div>
                                                                                                                </div>`,
            on: {
                open: function () {
                    var me = this;

                    $("#saveDetail").off('click').click(function () {
                        var ID = me.params.SCAN_DET_ID;
                        let data = app.form.convertToData("#detail_bg_detail");
                        data.SCAN_ID = me.params.SCAN_ID;
                        data.SCAN_DET_ID = ID;

                        if (data.SCAN_ID == null || data.SCAN_ID == '') {
                            app.dialog.error("参数错误");
                            return
                        }

                        if (data.SCAN_RESULT == null || data.SCAN_RESULT == '' || data.SCAN_RESULT == '-99') {
                            app.dialog.error("请选择盘点结果");
                            return
                        }

                        var AddRow = new Object();

                        if (data.SCAN_DET_ID) {
                            AddRow["Updated"] = [data];
                            AddRow["Original"] = [formDataDetail];
                        }
                        else {
                            AddRow["Added"] = [data]
                        }

                        app.ajax({
                            type: 'post',
                            data: {
                                "request": AddRow
                            },
                            url: 'Device/InventoryTask/ManageScanDetail',
                            success: function () {
                                detail_popup.close();
                                CreateResultDetail(data.SCAN_ID);
                            }
                        });
                    });

                    // 清单明细
                    if (me.params.SCAN_DET_ID) {
                        var where = JSON.stringify({
                            op: 'and',
                            rules: [{ field: 'SCAN_DET_ID', op: 'equal', value: me.params.SCAN_DET_ID }]
                        });
                        app.ajax({
                            type: 'post',
                            data: {
                                "where": where
                            },
                            url: 'Device/InventoryTask/GetDeviceScanDetails',
                            success: function (data) {
                                data.Rows.forEach((a) => {
                                    a.HANDLE = handle.find((v) => v.ID == a.HANDLE).TEXT;
                                    a.STATUS = states.find((v) => v.ID == a.STATUS).TEXT;
                                });
                                var detailInfo = scanstatus == "生成清单" ? resultDetailInfoEdit : resultDetailInfoEdit.map(function (item) {
                                    return { ...item, readOnly: true };
                                });
                                var str = app.CreatePopupContentHtml(detailInfo);
                                $("#detail_bg_detail").html(str);
                                app.smartSelect.create({
                                    el: '.SCAN_RESULT',
                                    on: {
                                        beforeOpen: function (smartSelect, prevent) {
                                            if (scanstatus == "盘点完成") {
                                                prevent();
                                            }
                                        }
                                    }
                                });
                                if (data.Rows.length > 0) {
                                    formDataDetail = data.Rows[0];
                                    app.form.fillFromData('#detail_bg_detail', formDataDetail);
                                }
                            }
                        });
                    }

                }
            }
        });
    </script>
</body>

</html>
