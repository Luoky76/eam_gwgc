<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, minimal-ui, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2196f3">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>运行状态一览表</title>
    <link rel="stylesheet" href="../../dist/Framework7/mobile.css?v=1" />
</head>

<body class="color-theme-blue">
    <div id="app">
        <div class="statusbar">
        </div>
        <!-- Your main view, should have "view-main" class -->
        <div class="view view-main">
            <div class="page" data-name="home">
                <div class="navbar">
                    <div class="navbar-bg"></div>
                    <div class="navbar-inner sliding">
                        <div class="title">运行状态一览表</div>

                        <div class="subnavbar">
                            <form class="searchbar" id="searchbar-autocomplete">
                                <div class="searchbar-inner">
                                    <div class="searchbar-input-wrap">
                                        <input type="search" placeholder="请输入" id="searchText" />
                                        <i class="searchbar-icon"></i>
                                        <span class="input-clear-button"></span>
                                    </div>
                                    <span class="searchbar-disable-button">Cancel</span>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="list page-content" style="padding-top: 100px; padding-bottom: 80px">
                    <ul id="danger_reform_list">
                    </ul>
                </div>

                <div class="toolbar toolbar-bottom-md">
                    <div class="toolbar-inner">
                        <a href='javascript:app.methods.toUrl("back")' class="link external">
                            <i class="f7-icons">arrow_left</i>
                            <span class="ios-only">返回</span>
                        </a>
                        <button class="button" id="refresh">
                            刷新
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="text/javascript" src="../../dist/Framework7/mobile.js?v=1"></script>
    <script type="text/javascript" src="http://res.wx.qq.com/open/js/jweixin-1.4.0.js"></script>
    <script type="text/javascript" src="../../dist/Framework7/app.js?v=1"></script>
    <script src="https://cdn.staticfile.org/jquery/1.10.2/jquery.min.js"></script>
    <script type="text/javascript" id="scriptBlock">
        'use strict';
        var business = {

            plan: null,
            plan_card: null,
            getData: function () {
                var me = this;
                app.ajax({
                    async: false,
                    type: 'post',
                    url: 'Device/DeviceRun/GetAllRun',
                    success: function (data) {
                        me.list = data.Rows;
                        var str = '';
                        for (var i = 0; i < me.list.length; i++) {
                            var sid = me.list[i].DEVICE_ID;
                            str += `
                                            <li id="list-` + sid + `">
                                                    <div class="item-inner item-cell">
                                                        <div class="item-row">`;

                            str += `
                                            <div class="col-10"></div>
                                                                </div>
                                                                <div class="row no-gap">

                                                                    <div class="col-35" style="color: rgb(192,192,192)">运行状态</div>`;
                            if (me.list[i].NEW_RUN_STATUS == "正常" || me.list[i].NEW_RUN_STATUS == null) str += `<div class="col-65" style="color: #00FF00; white-space: nowrap;overflow: hidden;text-overflow:ellipsis;"> 正常 </div>`;
                            if (me.list[i].NEW_RUN_STATUS == "维修") str += `<div class="col-65" style="color: black; white-space: nowrap;overflow: hidden;text-overflow:ellipsis;"> 维修 </div>`;
                            if (me.list[i].NEW_RUN_STATUS == "停机") str += `<div class="col-65" style="color: red; white-space: nowrap;overflow: hidden;text-overflow:ellipsis;"> 停机 </div>`;
                            if (me.list[i].NEW_RUN_STATUS == "事故") str += `<div class="col-65" style="color: black; white-space: nowrap;overflow: hidden;text-overflow:ellipsis;"> 事故 </div>`;
                            if (me.list[i].NEW_RUN_STATUS == "保养") str += `<div class="col-65" style="color: #2BD5D5; white-space: nowrap;overflow: hidden;text-overflow:ellipsis;"> 保养 </div>`;
                            if (me.list[i].NEW_RUN_STATUS == "检查") str += `<div class="col-65" style="color: green; white-space: nowrap;overflow: hidden;text-overflow:ellipsis;"> 检查 </div>`;
                            if (me.list[i].NEW_RUN_STATUS == "备用") str += `<div class="col-65" style="color: green; white-space: nowrap;overflow: hidden;text-overflow:ellipsis;"> 备用 </div>`;

                            str += `<div class="col-10"></div>
                                                                </div>
                                                                <div class="row no-gap">
                                                                    <div class="col-35" style="color: rgb(192,192,192)">设备编号</div>
                                                                    <div class="col-65" style="white-space: nowrap;overflow: hidden;text-overflow:ellipsis;">` + (me.list[i].DEVICE_NO == null ? '' : me.list[i].DEVICE_NO) + `</div>
                                                                    <div class="col-10"></div>
                                                                </div>
                                                                <div class="row no-gap">
                                                                    <div class="col-35" style="color: rgb(192,192,192)">设备名称</div>
                                                                    <div class="col-65" style="white-space: nowrap;overflow: hidden;text-overflow:ellipsis;">` + (me.list[i].DEVICE_NAME == null ? '' : me.list[i].DEVICE_NAME)+ `</div>
                                                                    <div class="col-10"></div>
                                                                </div>
                                                                <div class="row no-gap">
                                                                    <div class="col-35" style="color: rgb(192,192,192)">设备类别</div>
                                                                    <div class="col-65" style="white-space: nowrap;overflow: hidden;text-overflow:ellipsis;">` + (me.list[i].TYPE_NAME == null ? '' : me.list[i].TYPE_NAME) + `</div>
                                                                    <div class="col-10"></div>
                                                                </div>
                                                                <div class="row no-gap">
                                                                    <div class="col-35" style="color: rgb(192,192,192)">转换原因</div>
                                                                    <div class="col-65" style="white-space: nowrap;overflow: hidden;text-overflow:ellipsis;">` + (me.list[i].TRANS_MEMO == null ? '' : me.list[i].TRANS_MEMO) + `</div>
                                                                    <div class="col-10"></div>
                                                                </div>
                                                                <div class="row no-gap">
                                                                    <div class="col-35" style="color: rgb(192,192,192)">使用部门</div>
                                                                    <div class="col-65" style="white-space: nowrap;overflow: hidden;text-overflow:ellipsis;">` + (me.list[i].SEC_DEPT == null ? '' : me.list[i].SEC_DEPT) + `</div>
                                                                    <div class="col-10"></div>
                                                                </div>
                                                                <div class="row no-gap">
                                                                    <div class="col-35" style="color: rgb(192,192,192)">使用二级单位</div>
                                                                    <div class="col-65" style="white-space: nowrap;overflow: hidden;text-overflow:ellipsis;">` + (me.list[i].DEPT_NAME == null ? '' : me.list[i].DEPT_NAME) + `</div>
                                                                    <div class="col-10"></div>
                                                                </div>


                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>

                                            </li>`;
                        }

                        $("#danger_reform_list").html(str);
                    },
                    error: function (message, data) {
                        app.dialog.error(message, function () { });
                        return;
                    }
                });
            },
            init: function () {
                var me = this;
                me.getData();
                me.initSearchbar();
                //me.initClick();
                me.initFreshButton();
            },

            initSearchbar: function () {
                app.searchbar.create({
                    el: '.searchbar',
                    searchContainer: '.list',
                    searchIn: ['.item-inner'],
                    on: {
                        search: function (sb, query, previousQuery) {
                            console.log(query, previousQuery);
                        }
                    }
                })
            },

            initFreshButton: function () {
                var me = this;
                //刷新按钮
                $('#refresh').on('click', function (e) {
                    me.getData();
                    me.initSearchbar();
                    //me.initClick();
                })
            },


        };

        business.init();

    </script>
</body>

</html>
