<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, minimal-ui, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2196f3">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>库存物资详情</title>
    <link rel="stylesheet" href="../../dist/Framework7/mobile.css?v=1" />

</head>
<body>
    <div id="app">
        <div class="statusbar">
        </div>
        <!-- Your main view, should have "view-main" class -->
        <div class="view view-main">
            <div class="page" data-name="home" style="background-color: RGB(236,235,235);">
                <div class="navbar">
                    <div class="navbar-bg"></div>
                    <div class="navbar-inner sliding">
                        <div class="col-80 title" id="title">物资信息</div>
                    </div>
                </div>

                <div class="page-content" style="padding-bottom:70px;padding-top:30px">
                    <form class="list" id="detail-form">
                        <div class="list inline-labels no-hairlines-md">
                            <ul>
                                <li class="editshow">
                                    <div class="item-link smart-select smart-select-init" data-open-in="popup" data-searchbar="true" data-searchbar-placeholder="选择物料">
                                        <select name="SP_ID" id="SP_ID">
                                        </select>
                                        <div class="item-content">
                                            <div class="item-inner">
                                                <div class="item-title">物料名称<span style="color:red">*</span></div>
                                                <input type="hidden" id="SP_NAME" name="SP_NAME" />
                                            </div>
                                        </div>
                                    </div>
                                </li>
                                <li class="onlyshow" style="display:none;">
                                    <div class="item-inner" style="padding: 0px;padding-left: 16px;padding-right:16px;">
                                        <div class="item-title" style="color: #666666">物料名称<span style="color:red">*</span></div>
                                        <div class="item-after" style="text-align:right">
                                            <input style="text-align: right;font-size: 14px;color: rgba(0, 0, 0, 0.54)" type="text" name="SHOW_SP_NAME" readonly />
                                        </div>
                                    </div>
                                </li>
                                <li>
                                    <div class="item-inner" style="padding: 0px;padding-left: 16px;padding-right:16px;">
                                        <div class="item-title" style="color: #666666">物料编码<span style="color:red">*</span></div>
                                        <div class="item-after" style="text-align:right">
                                            <input style="text-align: right;font-size: 14px;color: rgba(0, 0, 0, 0.54)" type="text" name="SP_CODE" readonly />
                                        </div>
                                    </div>
                                </li>
                                <li>
                                    <div class="item-inner" style="padding: 0px;padding-left: 16px;padding-right:16px;">
                                        <div class="item-title" style="color: #666666">型号规格</div>
                                        <div class="item-after" style="text-align:right">
                                            <input style="text-align: right;font-size: 14px;color: rgba(0, 0, 0, 0.54)" type="text" name="SP_SIZE" readonly />
                                        </div>
                                    </div>
                                </li>
                                <li>
                                    <div class="item-inner" style="padding: 0px;padding-left: 16px;padding-right:16px;">
                                        <div class="item-title" style="color: #666666">品牌、厂家</div>
                                        <div class="item-after" style="text-align:right">
                                            <input style="text-align: right;font-size: 14px;color: rgba(0, 0, 0, 0.54)" type="text" name="PRODUCE" readonly />
                                        </div>
                                    </div>
                                </li>
                                <li>
                                    <div class="item-inner" style="padding: 0px;padding-left: 16px;padding-right:16px;">
                                        <div class="item-title" style="color: #666666">计量单位</div>
                                        <div class="item-after" style="text-align:right">
                                            <input style="text-align: right;font-size: 14px;color: rgba(0, 0, 0, 0.54)" type="text" name="UNIT" readonly />
                                        </div>
                                    </div>
                                </li>
                                <li>
                                    <div class="item-inner" style="padding: 0px;padding-left: 16px;padding-right:16px;">
                                        <div class="item-title" style="color: #666666">物料分类</div>
                                        <div class="item-after" style="text-align:right">
                                            <input style="text-align: right;font-size: 14px;color: rgba(0, 0, 0, 0.54)" type="text" name="TYPE_NAME" readonly />
                                            <input type="hidden" id="TYPE_ID" name="TYPE_ID" />
                                            <input type="hidden" id="TYPE_CODE" name="TYPE_CODE" />
                                        </div>
                                    </div>
                                </li>
                            </ul>
                            <div class="block-title">库存信息</div>
                            <ul>
                                <li>
                                    <div class="item-inner" style="padding: 0px;padding-left: 16px;padding-right:16px;">
                                        <div class="item-title" style="color: #666666">批次号<span style="color:red">*</span></div>
                                        <div class="item-after" style="text-align:right">
                                            <input style="text-align: right;font-size: 14px;color: rgba(0, 0, 0, 0.54)" type="text" name="STORE_CODE" placeholder="请输入批次号" />
                                        </div>
                                    </div>
                                </li>
                                <li class="editshow">
                                    <div class="item-link smart-select smart-select-init" data-open-in="popup" data-searchbar="true" data-searchbar-placeholder="选择库位">
                                        <select name="STOCK_ID" id="STOCK_ID">
                                        </select>
                                        <div class="item-content">
                                            <div class="item-inner">
                                                <div class="item-title">库位名称<span style="color:red">*</span></div>
                                                <input type="hidden" id="STOCK_CODE" name="STOCK_CODE" />
                                                <input type="hidden" id="STOCK_NAME" name="STOCK_NAME" />
                                            </div>
                                        </div>
                                    </div>
                                </li>
                                <li class="onlyshow" style="display:none;">
                                    <div class="item-inner" style="padding: 0px;padding-left: 16px;padding-right:16px;">
                                        <div class="item-title" style="color: #666666">部门<span style="color:red">*</span></div>
                                        <div class="item-after" style="text-align:right">
                                            <input style="text-align: right;font-size: 14px;color: rgba(0, 0, 0, 0.54)" type="text" name="SHOW_DEPT_NAME" readonly />
                                        </div>
                                    </div>
                                </li>
                                <li class="editshow">
                                    <div class="item-link smart-select smart-select-init" data-open-in="popup" data-searchbar="true" data-searchbar-placeholder="选择部门">
                                        <select name="DEPT_ID" id="DEPT_ID">
                                        </select>
                                        <div class="item-content">
                                            <div class="item-inner">
                                                <div class="item-title">部门<span style="color:red">*</span></div>
                                                <input type="hidden" id="DEPT_NAME" name="DEPT_NAME" />
                                            </div>
                                        </div>
                                    </div>
                                </li>
                                <li class="onlyshow" style="display:none;">
                                    <div class="item-inner" style="padding: 0px;padding-left: 16px;padding-right:16px;">
                                        <div class="item-title" style="color: #666666">库位名称<span style="color:red">*</span></div>
                                        <div class="item-after" style="text-align:right">
                                            <input style="text-align: right;font-size: 14px;color: rgba(0, 0, 0, 0.54)" type="text" name="SHOW_STOCK_NAME" readonly />
                                        </div>
                                    </div>
                                </li>
                                <li>
                                    <div class="item-inner" style="padding: 0px;padding-left: 16px;padding-right:16px;">
                                        <div class="item-title" style="color: #666666">库存数量<span style="color:red">*</span></div>
                                        <div class="item-after" style="text-align:right">
                                            <input style="text-align: right;font-size: 14px;color: rgba(0, 0, 0, 0.54)" type="text" name="NUM" id="NUM" placeholder="请输入库存数量" />
                                        </div>
                                    </div>
                                </li>
                                <li>
                                    <div class="item-inner" style="padding: 0px;padding-left: 16px;padding-right:16px;">
                                        <div class="item-title" style="color: #666666">库存单价(元)<span style="color:red">*</span></div>
                                        <div class="item-after" style="text-align:right">
                                            <input style="text-align: right;font-size: 14px;color: rgba(0, 0, 0, 0.54)" type="text" name="PRICE" id="PRICE" placeholder="请输入库存单价" />
                                        </div>
                                    </div>
                                </li>
                                <li>
                                    <div class="item-inner" style="padding: 0px;padding-left: 16px;padding-right:16px;">
                                        <div class="item-title" style="color: #666666">库存金额(元)<span style="color:red">*</span></div>
                                        <div class="item-after" style="text-align:right">
                                            <input style="text-align: right;font-size: 14px;color: rgba(0, 0, 0, 0.54)" type="text" name="MONEY" id="MONEY" placeholder="请输入库存金额" />
                                        </div>
                                    </div>
                                </li>
                                <li>
                                    <div class="item-inner" style="padding: 0px;padding-left: 16px;padding-right:16px;">
                                        <div class="item-title" style="color: #666666">不含税单价(元)</div>
                                        <div class="item-after" style="text-align:right">
                                            <input style="text-align: right;font-size: 14px;color: rgba(0, 0, 0, 0.54)" type="text" name="NOTAX_PRICE" id="NOTAX_PRICE" placeholder="请输入不含税单价" />
                                        </div>
                                    </div>
                                </li>
                                <li>
                                    <div class="item-inner" style="padding: 0px;padding-left: 16px;padding-right:16px;">
                                        <div class="item-title" style="color: #666666">不含税金额(元)</div>
                                        <div class="item-after" style="text-align:right">
                                            <input style="text-align: right;font-size: 14px;color: rgba(0, 0, 0, 0.54)" type="text" name="NOTAX_MONEY" id="NOTAX_MONEY" placeholder="请输入不含税金额" />
                                        </div>
                                    </div>
                                </li>
                                <li>
                                    <div class="item-inner" style="padding: 0px;padding-left: 16px;padding-right:16px;">
                                        <div class="item-title" style="color: #666666">入库日期<span style="color:red">*</span></div>
                                        <div class="item-after" style="text-align:right">
                                            <input style="text-align: right;font-size: 14px;color: rgba(0, 0, 0, 0.54)" type="text" name="IN_DATE" placeholder="请输入入库日期" id="in_date" />
                                        </div>
                                    </div>
                                </li>
                                <li>
                                    <div class="item-inner" style="padding: 0px;padding-left: 16px;padding-right:16px;">
                                        <div class="item-title" style="color: #666666">税率</div>
                                        <div class="item-after" style="text-align:right">
                                            <input style="text-align: right;font-size: 14px;color: rgba(0, 0, 0, 0.54)" type="text" name="TAX_RATE" placeholder="请输入税率" />
                                        </div>
                                    </div>
                                </li>
                                <li class="editshow">
                                    <div class="item-link smart-select smart-select-init" data-open-in="sheet">
                                        <select name="PROVIDER_ID" id="PROVIDER_ID">
                                        </select>
                                        <div class="item-content">
                                            <div class="item-inner">
                                                <div class="item-title" style="color: #666666">供应商</div>
                                                <input type="hidden" id="PROVIDER_NAME" name="PROVIDER_NAME" />
                                            </div>
                                        </div>
                                    </div>
                                </li>
                                <li class="onlyshow" style="display:none;">
                                    <div class="item-inner" style="padding: 0px;padding-left: 16px;padding-right:16px;">
                                        <div class="item-title" style="color: #666666">供应商</div>
                                        <div class="item-after" style="text-align:right">
                                            <input style="text-align: right;font-size: 14px;color: rgba(0, 0, 0, 0.54)" type="text" name="SHOW_PROVIDER_NAME" readonly />
                                        </div>
                                    </div>
                                </li>
                                <li>
                                    <div class="item-inner" style="padding: 0px;padding-left: 16px;padding-right:16px;">
                                        <div class="item-title" style="color: #666666">申请单号</div>
                                        <div class="item-after" style="text-align:right">
                                            <input style="text-align: right;font-size: 14px;color: rgba(0, 0, 0, 0.54)" type="text" name="APPLY_NO" placeholder="请输入申请单号" />
                                        </div>
                                    </div>
                                </li>
                            </ul>
                        </div>
                    </form>
                    <!--<div class="block-title">&nbsp;&nbsp;信息</div>-->
                </div>

                <div class="toolbar toolbar-bottom-md">
                    <div class="toolbar-inner">
                        <a href='javascript:app.methods.toUrl("back")' class="link external">
                            <i class="f7-icons">arrow_left</i>
                            <span class="ios-only">返回</span>
                        </a>
                        <button class="button col-100" id="save" style="display:none;">
                            保存
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>
    <script type="text/javascript" src="../../../dist/Framework7/mobile.js?v=1"></script>
    <script type="text/javascript" src="http://res.wx.qq.com/open/js/jweixin-1.4.0.js"></script>
    <script type="text/javascript" src="../../../dist/Framework7/app.js?v=1"></script>
    <script src="https://cdn.staticfile.org/jquery/1.10.2/jquery.min.js"></script>
    <script type="text/javascript" id="scriptBlock">
        'use strict';
        var originalData = eval('(' + page.route.params.params + ')');
        var where = JSON.stringify({
            op: 'and',
            rules: originalData.STORE_ID ? [{ field: "STORE_ID", value: originalData.STORE_ID, op: "equal" }] : []
        });
        var time = app.calendar.create({
            inputEl: '#in_date',
        });
     

        var business = {
            detail: null,
            spList: [], //物资
            stockList: [], //库位
            providerList: [],//供应商
            corpList: [], //部门
            orginData: null,
            getCombox: function () {
                var me = this;
                app.ajax({
                    async: false,
                    type: 'post',
                    url: 'Material/SpStore/ComboxData',
                    success: function (data) {
                        me.providerList = data.ProviderName;
                        var str = ""
                        data.ProviderName.forEach((a) => {
                            str += "<option value=" + a.ID + ">" + a.TEXT + "</option>";
                        });
                        $("#PROVIDER_ID").html(str);

                        me.corpList = data.DeptData;
                        var corp = ""
                        data.DeptData.forEach((a) => {
                            corp += "<option value=" + a.ID + ">" + a.TEXT + "</option>";
                        });
                        $("#DEPT_ID").html(corp);
                    },
                    error: function (message, data) {
                        app.dialog.error(message, function () { });
                        return;
                    }
                });
                app.ajax({
                    async: false,
                    type: 'post',
                    url: 'Material/SpStore/Tree',
                    success: function (data) {
                        me.stockList = data;
                        var str = ""
                        me.stockList.forEach((a) => {
                            str += "<option value=" + a.HOUSE_ID + ">" + a.HOUSE_NAME + "</option>";
                        });
                        $("#STOCK_ID").html(str);
                    },
                    error: function (message, data) {
                        app.dialog.error(message, function () { });
                        return;
                    }
                });
                app.ajax({
                    async: false,
                    type: 'post',
                    url: 'Material/SpareApply/SpcatalogList',
                    success: function (data) {
                        me.spList = data.Rows;
                        var str = ""
                        me.spList.forEach((a) => {
                            str += "<option value=" + a.SP_ID + ">" + a.SP_NAME + "</option>";
                        });
                        $("#SP_ID").html(str);
                    },
                    error: function (message, data) {
                        app.dialog.error(message, function () { });
                        return;
                    }
                });
            },
            getData: function () {
                var me = this;
                app.ajax({
                    async: false,
                    type: 'post',
                    url: 'Material/SpStore/list',
                    data: { "where": where },
                    success: function (data) {
                        if (data != null && data.Rows.length > 0) {
                            me.detail = data.Rows[0];
                            me.orginData = data.Rows[0];
                            me.detail.SHOW_SP_NAME = me.detail.SP_NAME;
                            me.detail.SHOW_STOCK_NAME = me.detail.STOCK_NAME;
                            me.detail.SHOW_PROVIDER_NAME = me.detail.PROVIDER_NAME;
                            me.detail.SHOW_DEPT_NAME = me.detail.DEPT_NAME;
                            app.form.fillFromData('#detail-form', me.detail);
                        }
                    },
                    error: function (message, data) {
                        app.dialog.error(message, function () { });
                        return;
                    }
                });
            },
            initButton: function () {
                var me = this
                $('#save').on('click', function (e) {
                    //校验检查结果
                    var formData = app.form.convertToData('#detail-form');
                    if (formData.SP_NAME == null || formData.SP_NAME == '') {
                        app.dialog.error("请选择物料");
                        return
                    }

                    if (formData.STORE_CODE == null || formData.STORE_CODE == '') {
                        app.dialog.error("批次号不可为空");
                        return
                    }
                    if (formData.STOCK_ID == null || formData.STOCK_ID == '') {
                        app.dialog.error("库位不可为空");
                        return
                    }

                    if (formData.NUM == null || formData.NUM == '') {
                        app.dialog.error("库存数量不可为空");
                        return
                    }

                    if (formData.PRICE == null || formData.PRICE == '') {
                        app.dialog.error("库存单价不可为空");
                        return
                    }

                    if (formData.MONEY == null || formData.MONEY == '') {
                        app.dialog.error("库存金额不可为空");
                        return
                    }

                    if (formData.IN_DATE == null || formData.IN_DATE == '') {
                        app.dialog.error("入库日期不可为空");
                        return
                    }

                    var changeRow = new Object();
                    if (originalData.STORE_ID == "" || originalData.STORE_ID == null) {
                        formData.SRC_TYPE = "1";
                        formData.STOCK_NAME = formData.STOCK_NAME == "仓库货位" ? "" : formData.STOCK_NAME;
                        formData.STOCK_ID = formData.STOCK_ID == "ROOT" ? "" : formData.STOCK_ID;
                        formData.STOCK_CODE = formData.STOCK_CODE == "ROOT" ? "" : formData.STOCK_CODE;
                        changeRow["Added"] = [formData];
                    } 
                    app.ajax({
                        //async: false,
                        type: 'post',
                        url: 'Material/SpStore/Save',
                        data: changeRow,
                        success: function (data) {
                            app.dialog.alert("成功", function () {
                                $('#refresh', parent.document).click();
                                app.methods.toUrl("back");
                            });
                        },
                        error: function (message, data) {
                            app.dialog.error(message, function () { });
                            return;
                        }
                    });
                });

                $('#PROVIDER_ID').on('change', function (e) {
                    var index = e.target.options.selectedIndex;
                    if (index >= 0) {
                        var text = e.target.options[index].innerText;
                        $("#PROVIDER_NAME").val(text);
                    }
                });

                $('#STOCK_ID').on('change', function (e) {
                    var da = me.stockList.find((va) => va.HOUSE_ID == e.target.value);
                    if (da != null) {
                        $("#STOCK_CODE").val(da.HOUSE_CODE);
                        $("#STOCK_NAME").val(da.HOUSE_NAME);
                    }
                });

                $('#SP_ID').on('change', function (e) {
                    var da = me.spList.find((va) => va.SP_ID == e.target.value);
                    if (da != null) {
                        app.form.fillFromData('#detail-form', da);
                    }
                });

                $('#NUM').on('change', function (e) {
                    var num = e.target.value || 0;
                    var value = $("#PRICE").val();
                    if (value != null && value != '') {
                        $("#MONEY").val(parseFloat(num * value));
                    }

                    var novalue = $("#NOTAX_PRICE").val();
                    if (novalue != null && novalue != '') {
                        $("#NOTAX_MONEY").val(parseFloat(num * novalue));
                    }
                });

                $('#PRICE').on('change', function (e) {
                    var value = e.target.value || 0;
                    var num = $("#NUM").val();
                    if (value != null && value != '') {
                        $("#MONEY").val(parseFloat(num * value));
                    }
                });

                $('#NOTAX_PRICE').on('change', function (e) {
                    var value = e.target.value || 0;
                    var num = $("#NUM").val();
                    if (value != null && value != '') {
                        $("#NOTAX_MONEY").val(parseFloat(num * value));
                    }
                });

                $('#DEPT_ID').on('change', function (e) {
                    var da = me.corpList.find((va) => va.ID == e.target.value);
                    if (da != null) {
                        $("#DEPT_NAME").val(da.TEXT);
                    }
                });
            },
            init: function () {
                var me = this;
                if (originalData.STORE_ID.length > 0) {
                    $(".onlyshow").show();
                    $(".editshow").hide();
                    me.getData();
                } else {
                    $(".editshow").show();
                    $(".onlyshow").hide();
                    me.getCombox();
                    me.initButton();
                    $("#save").show();
                }
            }
        };
        business.init();

    </script>  
</body>
</html>
