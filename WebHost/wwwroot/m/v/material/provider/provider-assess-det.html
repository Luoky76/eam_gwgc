<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, minimal-ui, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2196f3">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>供应商评估明细</title>
    <link rel="stylesheet" href="../../../dist/Framework7/mobile.css?v=1" />
</head>
<body class="color-theme-blue">
    <div id="app">
        <!-- Your main view, should have "view-main" class -->
        <div class="view view-main">
            <div class="page" data-name="home" style="background-color: RGB(236,235,235);">
                <div class="navbar">
                    <div class="navbar-bg"></div>
                    <div class="navbar-inner sliding">
                        <div class="col-80 title" id="title">供应商评估明细</div>
                    </div>
                </div>

                <div class="toolbar tabbar toolbar-top">
                    <div class="toolbar-inner" style="
                            --f7-tabbar-link-active-border-color: #fff;
                            --f7-tabbar-link-active-color: black;
                            --f7-tabbar-link-active-bg-color: white;
                            --f7-tabbar-link-inactive-color: black;
                            background-color: rgb(236, 235, 235);">
                        <a href="#tab-1" class="tab-link tab-link-active" id="assess_list">评估总览</a>
                        <a href="#tab-2" class="tab-link" id="assess_det_list">评估明细</a>
                    </div>
                </div>
                <div class="tabs">
                    <div id="tab-1" class="page-content tab tab-active">
                        <div class="list inline-labels no-hairlines-md">
                            <form class="list" id="assess">
                            </form>
                        </div>
                    </div>

                    <div id="tab-2" class="page-content tab">
                        <div class="list" id="assess_det">
                            
                        </div>
                    </div>
                </div>

                
                <div class="toolbar toolbar-bottom-md">
                    <div class="toolbar-inner">
                        <a class="link external" id="backUrl">
                            <i class="f7-icons">arrow_left</i>
                            <span class="ios-only">返回</span>
                        </a>
                        <button class="col button button-large button-fill btns1" id="save" style="display: none; background-color: rgba(27, 167, 132, 0.5)">保存</button>
                        <button class="col button button-large button-fill btns1" id="submit" style="display: none; background-color: orange">提交</button>
                        <button class="col button button-large button-fill btns2" id="saveDet" style="display: none; background-color: rgba(27, 167, 132, 0.5)">保存</button>
                    </div>
                </div>
            </div>

        </div>
    </div>
    <script type="text/javascript" src="../../../dist/Framework7/mobile.js?v=1"></script>
    <script type="text/javascript" src="http://res.wx.qq.com/open/js/jweixin-1.4.0.js"></script>
    <script type="text/javascript" src="../../../dist/Framework7/app.js?v=1"></script>
    <script src="https://cdn.staticfile.org/jquery/1.10.2/jquery.min.js"></script>
    <script type="text/javascript" id="scriptBlock">
        'use strict';
        var img_baseurl = "../../../";
        var myPhotoBrowserPopup = null;
        var paramsData = eval('(' + page.route.params.params + ')');
        var photos = [];

        var business = {
            sid: paramsData.sid,
            //原始数据
            orginData: null,
            orginDetailData: null,
            //下拉数据
            auditing: [],
            assessBaseContent: [],
            user: [],
            appraise: [],
            columns: [],
            columnsDet: [],
            loadComboxData: function () {
                var me = this;
                app.ajax({
                    async: false,
                    type: 'post',
                    url: 'Material/ProviderAssess/ComboxData',
                    success: function (data) {
                        me.auditing = data.Auditing;
                        me.assessBaseContent = data.AssessBaseContent;
                        me.user = data.User;
                        me.appraise = data.Appraise;
                    },
                    error: function (message) {
                        app.dialog.error(message, function () { });
                    }
                });
            },
            loadData: function () {
                var me = this;
                app.ajax({
                    async: false,
                    type: 'post',
                    url: 'Material/ProviderAssess/GetCertainAssess',
                    data: { assessId: me.sid },
                    success: function (data, message) {
                        me.orginData = data;
                    },
                    error: function (message) {
                        app.dialog.error(message, function () { });
                    }
                });
            },
            setColumns: function () {
                var me = this;
                me.columns = [
                    {
                        display: "主键",
                        name: "ASSESS_ID",
                        PrimaryKey: "ASSESS_ID",
                        readOnly: true,
                        isPrimaryKey: true,
                        isShow: false
                    },
                    { display: "评估任务id", name: "ASSESS_TASK_ID", readOnly: true, isShow: false },
                    { display: "记录状态", name: "AUDITING", Option: me.auditing, Searched: true, readOnly: true },
                    { display: "任务制定人", name: "FORMULATER_ID", Option: me.user, Searched: true, readOnly: true },
                    { display: "评分人", name: "EXAMINER_ID", Option: me.user, Searched: true, readOnly: true },
                    { display: "评估年度", name: "ASSESS_YEAR", readOnly: true },
                    { display: "考核开始时间", name: "BEGIN_TIME", readOnly: true },
                    { display: "考核结束时间", name: "END_TIME", readOnly: true },
                    { display: "供应商名", name: "PROVIDER_NAME", readOnly: true },
                    { display: "供应商产品", name: "PROVIDER_PRODUCTION", readOnly: true },
                    { display: "考核说明", name: "REMARK" },
                    { display: "评估总分", name: "TOTAL_SCORE", readOnly: true },
                    { display: "评估结果", name: "RESULT" },
                ]
                me.columnsDet = [
                    { display: "评估主表id", name: "ASSESS_ID", readOnly: true, isShow: false },
                    { display: "评估内容", name: "ASSESS_BASE_ID", Option: me.assessBaseContent, Searched: true, readOnly: true },
                    { display: "分数", name: "SCORE" },
                    { display: "分数等级", name: "SCORE_DESC", Option: me.appraise },
                ]
            },
            setForm: function () {
                var me = this;
                //对于已提交数据，统一将列设为只读
                if (me.orginData.AUDITING == "1") {
                    for (let i = 0; i < me.columns.length; i++) {
                        me.columns[i].readOnly = true;
                    }
                }
                //创建input
                var str = app.CreatePopupContentHtml(me.columns);
                $("#assess").html(str);
                //填充表单数据
                app.form.fillFromData('#assess', me.orginData);
                //设置选择框
                app.smartSelect.create({
                    el: '.AUDITING',
                    searchbar: true,
                    on: {
                        beforeOpen: function (smartSelect, prevent) {
                            prevent();
                        }
                    }
                });
                app.smartSelect.create({
                    el: '.FORMULATER_ID',
                    searchbar: true,
                    on: {
                        beforeOpen: function (smartSelect, prevent) {
                            prevent();
                        }
                    }
                });
                app.smartSelect.create({
                    el: '.EXAMINER_ID',
                    searchbar: true,
                    on: {
                        beforeOpen: function (smartSelect, prevent) {
                            prevent();
                        }
                    }
                });
            },
            refresh: function () {
                app.form.fillFromData('#assess', me.orginData);
            },
            save: function () {
                var me = this;
                let data = app.form.convertToData("#assess");
                //防止主键篡改
                data.ASSESS_ID = me.orginData.ASSESS_ID;
                //TODO 无修改的判断
                var changeRow = new Object();
                changeRow["updated"] = [data];
                changeRow["original"] = [me.orginData];
                app.ajax({
                    async: false,
                    type: 'post',
                    url: 'Material/ProviderAssess/Save',
                    data: changeRow,
                    success: function (data, message) {
                        app.dialog.alert("保存成功");
                        me.orginData = data;
                        me.refresh();
                    },
                    error: function (message) {
                        app.dialog.error(message, function () { });
                    }
                });
            },
            submit: function () {
                var me = this;
                let data = app.form.convertToData("#assess");
                //防止主键篡改
                data.ASSESS_ID = me.orginData.ASSESS_ID;
                //提交
                data.AUDITING = "1";
                //TODO 无修改的判断
                var changeRow = new Object();
                changeRow["updated"] = [data];
                changeRow["original"] = [me.orginData];
                app.ajax({
                    async: false,
                    type: 'post',
                    url: 'Material/ProviderAssess/Save',
                    data: changeRow,
                    success: function (data, message) {
                        app.dialog.alert("提交成功");
                        me.orginData = data;
                        me.refresh();
                    },
                    error: function (message) {
                        app.dialog.error(message, function () { });
                    }
                });
            },
            loadDetailData: function () {
                var me = this;
                app.ajax({
                    async: false,
                    type: 'post',
                    url: 'Material/ProviderAssessDet/CertainAssessList',
                    data: {
                        assessId: me.sid
                    },
                    success: function (data, message) {
                        me.orginDetailData = data.Rows;
                    },
                    error: function (message) {
                        app.dialog.error(message, function () { });
                    }
                });
            },
            setFormDet: function () {
                var me = this;
                //对于已提交数据，统一将列设为只读
                if (me.orginData.AUDITING == "1") {
                    for (let i = 0; i < me.columnsDet.length; i++) {
                        me.columnsDet[i].readOnly = true;
                    }
                }
                //对每行数据分别创建表格
                for (let i = 0; i < me.orginDetailData.length; ++i) {
                    //新增表格
                    let form_id = "assess_det_" + i;
                    let str = `<form class="list" id="${form_id}"> </form >`;
                    $("#assess_det").append(str);
                    //创建input
                    str = app.CreatePopupContentHtml(me.columnsDet);
                    $("#" + form_id).html(str);
                    //填充表单数据
                    app.form.fillFromData('#' + form_id, me.orginDetailData[i]);
                    //设置选择框
                    app.smartSelect.create({
                        el: '.ASSESS_BASE_ID',
                        searchbar: true,
                        on: {
                            beforeOpen: function (smartSelect, prevent) {
                                prevent();
                            }
                        }
                    });
                    app.smartSelect.create({
                        el: '.SCORE_DESC',
                        searchbar: false
                    });
                }
            },
            initButton: function () {
                var me = this;
                $('#backUrl').on('click', function (e) {
                    $('#refresh', parent.document).click();
                    app.methods.toUrl("back")
                });
                $('#assess_list').on('click', function (e) {
                    if (me.orginData.AUDITING == "0") {
                        $('.btns1').show();
                        $('.btns2').hide();
                    }
                });
                $('#assess_det_list').on('click', function (e) {
                    if (me.orginData.AUDITING == "0") {
                        $('.btns1').hide();
                        $('.btns2').show();
                    }
                });
                $('#assess_list').click();
                $('#save').on('click', function (e) {
                    if (me.orginData.AUDITING == "1") {
                        app.dialog.error("数据已提交，无法变更！");
                        return;
                    }
                    me.save();
                });
                $('#submit').on('click', function (e) {
                    if (me.orginData.AUDITING == "1") {
                        app.dialog.error("数据已提交，无法变更！");
                        return;
                    }
                    app.dialog.confirm("提交后不可修改，是否继续？", function (confirm) {
                        if (confirm) {
                            me.submit();
                        }
                    });
                });
            },
            init: function () {
                debugger;
                var me = this;
                me.loadComboxData();

                me.loadData();
                me.loadDetailData();
                me.setColumns();
                me.setForm();
                me.setFormDet();

                me.initButton();
            }
        };
        business.init();
    </script>
</body>
</html>
