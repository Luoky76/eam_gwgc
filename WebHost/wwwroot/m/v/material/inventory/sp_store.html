<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, minimal-ui, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2196f3">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>库存明细</title>
    <link rel="stylesheet" href="../../../dist/Framework7/mobile.css?v=1" />
</head>

<body class="color-theme-blue">
    <div id="app">
        <div class="statusbar">
        </div>
        <!-- Your main view, should have "view-main" class -->
        <div class="view view-main">
            <div class="page" data-name="home">
                <div class="navbar">
                    <div class="navbar-bg"></div>
                    <div class="navbar-inner sliding">
                        <div class="title">库存明细</div>

                        <div class="subnavbar">
                            <form class="searchbar" id="searchbar-autocomplete">
                                <div class="searchbar-inner">
                                    <div class="searchbar-input-wrap">
                                        <input type="search" placeholder="请输入..." id="searchText" />
                                        <i class="searchbar-icon"></i>
                                        <span class="input-clear-button"></span>
                                    </div>
                                    <span class="searchbar-disable-button">Cancel</span>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="list page-content" style="padding-top: 80px; padding-bottom: 80px">
                    <ul id="store_list">
                    </ul>
                </div>

                <div class="toolbar toolbar-bottom-md">
                    <div class="toolbar-inner">
                        <a href='javascript:app.methods.toUrl("back")' class="link external">
                            <i class="f7-icons">arrow_left</i>
                            <span class="ios-only">返回</span>
                        </a>
                        <button class="button" id="refresh">
                            刷新
                        </button>
                        <button class="button" id="add">
                            库存初始化
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="text/javascript" src="../../../dist/Framework7/mobile.js?v=1"></script>
    <script type="text/javascript" src="../../../dist/Framework7/app.js?v=1"></script>
    <script type="text/javascript" id="scriptBlock">
        'use strict';
        var business = {
            storeSou: [],
            getData: function () {
                var me = this;
                app.ajax({
                    async: false,
                    type: 'post',
                    url: 'Material/SpStore/list',
                    success: function (data) {
                        me.list = data.Rows;
                        var str = '';
                        for (var i = 0; i < me.list.length; i++) {
                            var sid = me.list[i].STORE_ID;
                            var type = "";
                            if (me.list[i].SRC_TYPE != undefined && me.list[i].SRC_TYPE != null && me.list[i].SRC_TYPE.length > 0) {
                                type = me.storeSou.find((v) => v.ID == me.list[i].SRC_TYPE).TEXT;
                            }


                            str += `
                                <li id="list-` + sid + `">
                                    <a href="#" class="item-link item-content">
                                        <div class="item-inner item-cell">
                                            <div class="item-row">`;
                                                
                                        str += `<div class="item-cell">
                                                    <div class="row no-gap">
                                                        <div class="col-25" style="color: rgb(192,192,192)">来源类型</div>
                                                        <div class="col-65" style="white-space: nowrap;overflow: hidden;text-overflow:ellipsis;">` + type + `</div>
                                                        <div class="col-10"></div>
                                                    </div>
                                                    <div class="row no-gap">
                                                        <div class="col-25" style="color: rgb(192,192,192)">库位名称</div>
                                                        <div class="col-65" style="white-space: nowrap;overflow: hidden;text-overflow:ellipsis;">` + (me.list[i].STOCK_NAME == null ? '' : me.list[i].STOCK_NAME) + `</div>
                                                        <div class="col-10"></div>
                                                    </div>
                                                       <div class="row no-gap">
                                                        <div class="col-25" style="color: rgb(192,192,192)">批次号</div>
                                                        <div class="col-65" style="white-space: nowrap;overflow: hidden;text-overflow:ellipsis;">` + (me.list[i].STORE_CODE == null ? '' : me.list[i].STORE_CODE) + `</div>
                                                        <div class="col-10"></div>
                                                    </div>
                                                    <div class="row no-gap">
                                                        <div class="col-25" style="color: rgb(192,192,192)">物料编码</div>
                                                        <div class="col-65" style="white-space: nowrap;overflow: hidden;text-overflow:ellipsis;">` + (me.list[i].SP_CODE == null ? '' : me.list[i].SP_CODE) + `</div>
                                                        <div class="col-10"></div>
                                                    </div>
                                                    <div class="row no-gap">
                                                        <div class="col-25" style="color: rgb(192,192,192)">物料名称</div>
                                                        <div class="col-65" style="white-space: nowrap;overflow: hidden;text-overflow:ellipsis;">` + (me.list[i].SP_NAME == null ? '' : me.list[i].SP_NAME) + `</div>
                                                        <div class="col-10"></div>
                                                    </div>
                                                    <div class="row no-gap">
                                                        <div class="col-25" style="color: rgb(192,192,192)">库存数量</div>
                                                        <div class="col-65" style="color: blue;white-space: nowrap;overflow: hidden;text-overflow:ellipsis;">` + (me.list[i].NUM == null ? '' : me.list[i].NUM)  + `</div>
                                                        <div class="col-10"></div>
                                                    </div> 
                                                     <div class="row no-gap">
                                                        <div class="col-25" style="color: rgb(192,192,192)">库存金额</div>
                                                        <div class="col-65" style="color: blue;white-space: nowrap;overflow: hidden;text-overflow:ellipsis;">` + (me.list[i].MONEY == null ? '' : me.list[i].MONEY +'   元') + `</div>
                                                        <div class="col-10"></div>
                                                    </div> 
                                                </div>
                                            </div>
                                        </div>
                                    </a>
                                </li>`;
                        }

                        $("#store_list").html(str);

                        data.Rows.forEach((a) => {
                            $("#list-" + a.STORE_ID).click(function () {
                                var param = { "STORE_ID": a.STORE_ID };
                                app.methods.toUrl('/SpStoreDetail/' + JSON2.stringify(param));
                            })
                        })
                    },
                    error: function (message, data) {
                        app.dialog.error(message, function () { });
                        return;
                    }
                });
            },
            getCombox: function () {
                var me = this;
                app.ajax({
                    async: false,
                    type: 'post',
                    url: 'Material/SpStore/ComboxData',
                    success: function (data) {
                        me.storeSou = data.BCCode;
                    },
                    error: function (message, data) {
                        app.dialog.error(message, function () { });
                        return;
                    }
                });
            },
            init: function () {
                var me = this;
                me.initDetailRoute();
                me.getCombox();
                me.getData();
                me.initSearchbar();
                me.initFreshButton();
            },

            initSearchbar: function () {
                app.searchbar.create({
                    el: '.searchbar',
                    searchContainer: '.list',
                    searchIn: ['.item-inner'],
                    on: {
                        search: function (sb, query, previousQuery) {
                            console.log(query, previousQuery);
                        }
                    }
                })
            },

            initFreshButton: function () {
                var me = this;
                //刷新按钮
                $('#refresh').on('click', function (e) {
                    me.getData();
                    me.initSearchbar();
                });

                $('#add').on('click', function (e) {
                    app.methods.toUrl('/SpStoreDetail/{"STORE_ID":""}');
                });
            },

            initDetailRoute: function () {
                var detailRoute = {
                    title: "库存详情",
                    name: "SpStoreDetail",
                    path: "/SpStoreDetail/:params",
                    url: "./m/v/material/inventory/sp_store_detail.html"
                }
                app.routes.push(detailRoute);
            }

        };
        business.init();

    </script>
</body>

</html>
