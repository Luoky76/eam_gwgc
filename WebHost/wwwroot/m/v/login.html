<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2196f3">
    <title>微平台</title>
    <link rel="stylesheet" href="../dist/Framework7/mobile.css?v=1" />
    <style type="text/css">
        .login-page {
            background-color: #f5f8ff;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .login-page-title {
            text-align: center;
            margin-top: 50px;
            user-select: none;
        }

            .login-page-title .title {
                color: #3287ec;
                font-weight: bold;
                font-size: 30px;
            }

            .login-page-title .bottom-line {
                background-color: #74abed;
                width: 105%;
                height: 10px;
                transform: translate(-2%, -10px);
            }

            .login-page-title .welcome-title {
                font-size: 18px;
                color: #74abed;
            }

        .login-page-body {
            width: 100%;
            max-width: 450px;
            height: 85%
        }

            .login-page-body .input-content {
                width: 100%;
                background: #fff;
                border-radius: 25px;
                border: 1px solid #eee;
                margin-bottom: 20px;
            }

                .login-page-body .input-content input {
                    text-indent: 1em;
                }

                .login-page-body .input-content.item-input-with-error-message {
                    padding-bottom: 0;
                }

            .login-page-body .verifycode-input {
                display: flex;
                flex-direction: row;
                width: 65%;
                min-height: 48px;
                align-items: center;
                padding-left: 16px;
                transform: translateX(-16px);
            }

        .opacity-5 {
            opacity: 0.5;
        }

        .login-page-bottom {
            bottom: 30px;
            height: 30%;
            color: #bbb;
            height: 5%;
            white-space: nowrap;
            word-break: keep-all;
        }

        .login-page .verify-btn {
            width: 60%;
            margin-right: 10px;
        }

        .login-type {
            text-align: center;
            font-size: 16px;
            margin-top: 14px;
        }

        .text-dec {
            border-bottom: 1px solid #2196f3;
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            z-index: 999;
            transform: translateY(-50%);
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="view view-main view-skip-init">
            <div class="page-content login-page">
                <div class="login-page-title">
                    <div class="title">微平台</div>
                    <div class="bottom-line opacity-5"></div>
                    <div class="welcome-title">欢迎您</div>
                </div>
                <div class="login-page-body">
                    <form id="my-form">
                        <div class="list no-hairlines-md" style="margin-top: 24px;">
                            <ul style="background-color: transparent;">
                                <li class="item-content item-input input-content">
                                    <i class="material-icons text-color-gray opacity-5">person</i>
                                    <input type="text" id="username" name="username" placeholder="请输入账号" autocomplete="off" required validate trim />
                                </li>
                                <li class="item-content item-input input-content">
                                    <span class="toggle-password">👁️</span>
                                    <i class="material-icons text-color-gray opacity-5">lock</i>
                                    <input type="password" id="password" name="password" placeholder="请输入密码" autocomplete="new-password" required validate trim />
                                </li>
                                <li id="verifyCodePanel" class="item-content item-input row display-none">
                                    <div class="col-65 input-content verifycode-input">
                                        <i class="material-icons text-color-gray opacity-5">verified_user</i>
                                        <input type="text" placeholder="验证码" id="verifycode" name="verifycode" autocomplete="off" trim validate />
                                    </div>
                                    <div class="col-35" style="margin-bottom: 20px;">
                                        <img id="imgcode" src="" style="vertical-align: middle;" width="100%" height="100%" alt="" />
                                    </div>
                                </li>
                                <li class="item-content item-input">
                                    <label class="item-checkbox" style="display: flex;align-items: center;">
                                        <input id="remember" type="checkbox" name="remember" checked="checked" />
                                        <i class="icon icon-checkbox" style="margin-right: 5px;"></i>
                                        <div class="item-title text-color-blue">记住密码</div>
                                    </label>
                                </li>
                            </ul>
                        </div>
                    </form>

                    <div>
                        <button id="btnLogin" name="btnLogin" type="button" class="button button-round button-raised button-fill" style="height:40px">登录</button>
                    </div>
                </div>

                <div class="login-page-bottom">
                    <div class="text-align-center" id="version"></div>
                    <span>技术支持:厦门自贸试验区电子口岸有限公司</span>
                </div>
            </div>
        </div>
    </div>
    <script type="text/javascript" src="../dist/Framework7/mobile.js?v=1"></script>
    <script type="text/javascript" src="../dist/Framework7/app.js?cache=1&v=1"></script>
    <script type="text/javascript">
        'use strict';
        var business = {
            //内部ip否
            _noInner: true,
            success: function (data) {
                var toUrl = getQueryStringByName("FromUrl");
                if (((toUrl || "").toLowerCase().indexOf("http") >= 0) && (toUrl.indexOf(location.host) < 0)) toUrl = "";
                toUrl = toUrl || "index.html";
                window.ticket = data.Ticket;
                delete data.Ticket;
                window.session = data;
                location.href = toUrl;
            },
            phoneSelect: function (phones) {
                if (!phones || phones.length < 1) {
                    app.dialog.error("找不到可选取的手机号", function () {
                        location.reload();
                    });
                    return;
                }
                var me = this;
                var buttons = [{
                    text: '请选择验证手机',
                    label: true
                }];
                var btnClick = function () {
                    var phone = this.phone;
                    app.ajax({
                        noGlobal: true,
                        url: 'auth/phoneselect',
                        jsToken: { url: "auth/logintoken" },
                        data: {
                            key: window.GksybIMEI,
                            value: encrypt(phone)
                        },
                        success: function () {
                            me.smsAuth();
                        },
                        error: function (message) {
                            app.dialog.error(message, function () {
                                location.reload();
                            });
                        }
                    });
                };
                for (var i = 0, l = phones.length; i < l; i++) {
                    var item = phones[i];
                    buttons.push({
                        phone: item.Key, text: item.Value, label: false, onClick: btnClick
                    });
                }
                app.actions.create({
                    buttons: [buttons, [{ text: '取消', color: 'red' }]]
                }).open();
            },
            smsAuth: function () {
                var me = this;
                app.dialog.prompt("", "验证码", function (code) {
                    if (!code) {
                        app.dialog.error("请输入短信验证码", function () {
                            me.smsAuth();
                        });
                        return;
                    }
                    app.ajax({
                        noGlobal: true,
                        url: 'auth/smsauth',
                        jsToken: { url: "auth/logintoken" },
                        data: {
                            key: window.GksybIMEI,
                            value: encrypt(code)
                        },
                        success: function (data, message) {
                            if (message === "99") {
                                app.dialog.error(data, function () {
                                    me.smsAuth();
                                });
                                return;
                            }
                            me.success(data);
                        },
                        error: function (message) {
                            app.dialog.error(message, function () {
                                location.reload();
                            });
                        }
                    });
                });
            },
            //提交
            submit: function () {
                var form = $$("#my-form");
                if (!app.methods.validateInputs(form)) {
                    return;
                }
                var me = this;
                var formData = app.form.convertToData(form);
                formData.username = encrypt(formData.username);
                formData.password = encrypt(formData.password);
                formData.imei = window.GksybIMEI;
                formData.menuAppname = "ETOS_MOBILE";
                var isRemember = $$("#remember").prop("checked");
                app.ajax({
                    noGlobal: true,
                    url: 'Auth/Login',
                    jsToken: {
                        url: "auth/logintoken"
                    },
                    data: formData,
                    success: function (data, message) {
                        localStorage.removeItem("GksybPw");
                        localStorage.setItem("GksybUn", formData.username);
                        if (isRemember) localStorage.setItem("GksybPw", formData.password);
                        if (message === "99") {
                            me.smsAuth();
                            return;
                        }
                        if (message === "999") {
                            me.phoneSelect(data);
                            return;
                        }
                        me.success(data);
                    },
                    error: function (message, data) {
                        message = message || "账号密码错误";
                        if (data === "1") {
                            app.dialog.error(message, function () {
                                location.href = "change-pwd.html?FromUrl=" + encodeURIComponent(location.href);
                            });
                            return;
                        }
                        app.form.fillFromData("#my-form", {
                            "verifycode": ""
                        });
                        app.dialog.error(message, function () {
                            if (me._noInner) {
                                $$("#imgcode").click();
                                $$("#verifycode").focus();
                            } else {
                                $$("#username").focus();
                            }
                        });
                    }
                });
            },
            //内部IP处理
            innerHandler: function () {
                var me = this;
                app.ajax({
                    type: 'get',
                    url: 'Auth/IsInnerIP',
                    success: function (data) {
                        me._noInner = data !== "1";
                        if (me._noInner) {
                            $$("#imgcode").click();
                            $$("#verifycode").prop("required", true);
                            $$("#verifyCodePanel").removeClass("display-none");
                        }
                    }
                });
            },
            //事件绑定
            eventBind: function () {
                var me = this;
                me.remember = $$('#remember');
                me.remember.off("change").change(function () {
                    localStorage.setItem("GksybRm", $$(this).prop("checked") ? "1" : "0");
                });
                $$("#imgcode").off("click").click(function () {
                    $$("#imgcode").attr("src", gksybConfigs.getUrl("Auth/VerifyCode?time=" + Math.random()));
                });
                $$("#btnLogin").off("click").click(function () {
                    me.submit();
                });
                $$("#username").keydown(function (e) {
                    if (e.keyCode == 13) {
                        e.preventDefault();
                        $$("#password").focus();
                    }
                });
                $$("#password").keydown(function (e) {
                    if (e.keyCode == 13) {
                        e.preventDefault();
                        $$("#verifycode").focus();
                        if (!me._noInner) me.submit();
                    }
                });
                $$(".toggle-password").click(function () {
                    var dom = $(this), pwd = dom.nextAll("input");
                    var isPassword = pwd.attr("type") === "password";
                    pwd.attr("type", isPassword ? "text" : "password");
                    dom.text(isPassword ? "🙈" : "👁️");
                });
            },
            //初始化存储
            initStorage: function () {
                var me = this;
                var val = $$("#username").val();
                if (!val) {
                    var formData = {};
                    var username = localStorage.getItem("GksybUn");
                    var password = localStorage.getItem("GksybPw");
                    var remember = localStorage.getItem("GksybRm");
                    $$(me.remember).prop("checked", remember === "1")
                    if (username) formData.username = decryptFront(username);
                    if (username) formData.password = decryptFront(password);
                    app.form.fillFromData("#my-form", formData);
                    if (username) {
                        $("#password").focus();
                    }
                }
            },
            //初始化
            init: function () {
                var me = this;
                me.eventBind();
                me.innerHandler();
                me.initStorage();
                setTimeout(me.initStorage, 100);
            }
        };
        business.init();
    </script>
</body>
</html>
