<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2196f3">
    <title>微平台</title>
    <link rel="stylesheet" href="../dist/Framework7/mobile.css?v=1" />
</head>

<body>
    <div id="app">
        <div class="view view-main view-skip-init">
            <div class="page-content login-screen-content">
                <div class="login-screen-title">微平台</div>
                <form id="my-form">
                    <div class="list no-hairlines-md">
                        <ul>
                            <li class="item-content item-input">
                                <div class="item-media">
                                    <i class="f7-icons">person</i>
                                </div>
                                <div class="item-inner">
                                    <div class="item-title item-floating-label">账号</div>
                                    <div class="item-input-wrap">
                                        <input type="tel" id="username" name="username" placeholder="请输入账号" required validate trim />
                                        <span class="input-clear-button"></span>
                                    </div>
                                </div>
                            </li>
                            <li class="item-content item-input">
                                <div class="item-media">
                                    <i class="f7-icons">lock</i>
                                </div>
                                <div class="item-inner">
                                    <div class="item-title item-floating-label">密码</div>
                                    <div class="item-input-wrap">
                                        <input type="password" id="password" name="password" required validate trim />
                                        <span class="input-clear-button"></span>
                                    </div>
                                </div>
                            </li>
                            <li id="verifyCodePanel" class="item-content item-input display-none">
                                <div class="item-media">
                                    <i class="f7-icons">abc</i>
                                </div>
                                <div class="item-inner">
                                    <div class="item-title item-floating-label">验证码</div>
                                    <div class="item-input-wrap row">
                                        <div class="col-65">
                                            <input type="text" id="verifycode" name="verifycode" trim validate />
                                        </div>
                                        <div class="col-35">
                                            <img id="imgcode" src="" width="100%" height="100%" alt="" />
                                        </div>
                                    </div>
                                </div>
                            </li>
                        </ul>
                    </div>
                </form>
                <div class="block">
                    <div class="row">
                        <div class="col-30" style="text-align:center">
                            <label class="toggle color-blue">
                                <input id="remember" type="checkbox" checked>
                                <span class="toggle-icon"></span>
                            </label>
                            <br />
                            <span>记住密码</span>
                        </div>
                        <div class="col-70">
                            <button id="btnLogin" name="btnLogin" type="button" class="col button button-raised button-fill">登录</button>
                        </div>
                    </div>
                </div>
                <div class="block">
                    <p class="row">
                        <div class="block-footer">技术支持:厦门自贸试验区电子口岸有限公司</div>
                    </p>
                </div>
            </div>
        </div>
    </div>
    <script type="text/javascript" src="../dist/Framework7/mobile.js?v=1"></script>
    <script type="text/javascript" src="../dist/Framework7/app.js?v=1"></script>
    <script type="text/javascript">
        'use strict';
        var business = {
            //内部ip否
            _noInner: true,
            //提交
            submit: function () {
                var form = $$("#my-form");
                if (!app.methods.validateInputs(form)) {
                    return;
                }
                var me = this;
                var formData = app.form.convertToData(form);
                formData.username = encrypt(formData.username);
                formData.password = encrypt(formData.password);
                formData.menuAppname = "EAM_MOBILE";
                var isRemember = $$("#remember").prop("checked");
                app.ajax({
                    noGlobal: true,
                    url: 'Auth/Login',
                    data: formData,
                    success: function (data) {
                        localStorage.removeItem("GksybPw");
                        localStorage.setItem("GksybUn", formData.username);
                        if (isRemember) localStorage.setItem("GksybPw", formData.password);
                        window.ticket = data.Ticket;
                        delete data.Ticket;
                        window.session = data;
                        var fromUrl = getQueryStringByName("FromUrl");
                        if (((fromUrl || "").toLowerCase().indexOf("http") >= 0) && (fromUrl.indexOf(location.host) < 0)) fromUrl = "";
                        fromUrl = fromUrl || "index.html";
                        location.href = fromUrl;
                    },
                    error: function (message, data) {
                        message = message || "用户名密码错误";
                        if (data === "1") {
                            app.dialog.error(message, function () {
                                location.href = "change-pwd.html?FromUrl=" + encodeURIComponent(location.href);
                            });
                            return;
                        }
                        app.form.fillFromData("#my-form", {
                            "verifycode": ""
                        });
                        app.dialog.error(message, function () {
                            if (me._noInner) {
                                $$("#imgcode").click();
                                $$("#verifycode").focus();
                            } else {
                                $$("#username").focus();
                            }
                        });
                    },
                    beforeSend: function (jqXHR, options) {
                        app.request({
                            noGlobal: true,
                            async: false,
                            url: "Auth/LoginToken",
                            type: 'post',
                            dataType: "text",
                            success: function (result) {
                                eval(result);
                            }
                        });
                    }
                });
            },
            //内部IP处理
            innerHandler: function () {
                var me = this;
                app.ajax({
                    type: 'get',
                    url: 'Auth/IsInnerIP',
                    success: function (data) {
                        me._noInner = data !== "1";
                        if (me._noInner) {
                            $$("#imgcode").click();
                            $$("#verifycode").prop("required", true);
                            $$("#verifyCodePanel").removeClass("display-none");
                        }
                    }
                });
            },
            //事件绑定
            eventBind: function () {
                var me = this;

                me.toggle = app.toggle.create({
                    el: '.toggle',
                    on: {
                        change: function () {
                            localStorage.setItem("GksybRm", this.$inputEl.prop("checked") ? "1" : "0");
                        }
                    }
                });
                $$("#imgcode").off("click").click(function () {
                    $$("#imgcode").attr("src", gksybConfigs.getUrl("Auth/VerifyCode?time=" + Math.random()));
                });
                $$("#btnLogin").off("click").click(function () {
                    me.submit();
                });
                $$("#username").keydown(function (e) {
                    if (e.keyCode == 13) {
                        e.preventDefault();
                        $$("#password").focus();
                    }
                });
                $$("#password").keydown(function (e) {
                    if (e.keyCode == 13) {
                        e.preventDefault();
                        $$("#verifycode").focus();
                        if (!me._noInner) me.submit();
                    }
                });
            },
            //初始化存储
            initStorage: function () {
                var me = this;
                var val = $$("#username").val();
                if (!val) {
                    var formData = {};
                    var username = localStorage.getItem("GksybUn");
                    var password = localStorage.getItem("GksybPw");
                    var remember = localStorage.getItem("GksybRm");
                    if (remember === "0") me.toggle.toggle();
                    if (username) formData.username = decryptFront(username);
                    if (username) formData.password = decryptFront(password);
                    app.form.fillFromData("#my-form", formData);
                    if (username) {
                        $("#password").focus();
                    }
                }
            },
            //初始化
            init: function () {
                var me = this;
                me.innerHandler();
                me.eventBind();
                me.initStorage();
                setTimeout(me.initStorage, 100);
            }
        };
        business.init();
    </script>
</body>
</html>
