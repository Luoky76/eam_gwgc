<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, minimal-ui, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2196f3">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>码头维修实施</title>
    <link rel="stylesheet" href="../../../dist/Framework7/mobile.css?v=1" />
</head>

<body class="color-theme-blue">
    <div id="app">
        <div class="statusbar">
        </div>
        <!-- Your main view, should have "view-main" class -->
        <div class="view view-main">
            <div class="page" data-name="home">
                <div class="navbar">
                    <div class="navbar-bg"></div>
                    <div class="navbar-inner sliding">
                        <div class="title">码头维修实施</div>

                        <div class="subnavbar">
                            <form class="searchbar" id="searchbar-autocomplete">
                                <div class="searchbar-inner">
                                    <div class="searchbar-input-wrap">
                                        <input type="search" placeholder="请输入..." id="searchText" />
                                        <i class="searchbar-icon"></i>
                                        <span class="input-clear-button"></span>
                                    </div>
                                    <span class="searchbar-disable-button">Cancel</span>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="list page-content" style="padding-top: 80px; padding-bottom: 80px">
                    <div id="exe_list">
                    </div>
                </div>

                <div class="toolbar toolbar-bottom-md">
                    <div class="toolbar-inner">
                        <a href='javascript:app.methods.toUrl("back")' class="link external">
                            <i class="f7-icons">arrow_left</i>
                            <span class="ios-only">返回</span>
                        </a>
                        <button class="button" id="sumbit">
                            提交
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="text/javascript" src="../../../dist/Framework7/mobile.js?v=1"></script>
    <script type="text/javascript" src="../../../dist/Framework7/app.js?v=1"></script>
    <script type="text/javascript" id="scriptBlock">
        'use strict';
        var formdata;
        var formDataDetail;
        var userList = [];

        var busResult = {
            auditing_exe: [{ "ID": "1", "TEXT": "已提交" }, { "ID": "0", "TEXT": "未提交" }],
            scanResult: [{ "ID": "正常", "TEXT": "正常" }, { "ID": "盘盈", "TEXT": "盘盈" }, { "ID": "盘亏", "TEXT": "盘亏" }],
            dockInfo: [],
            ListDict: [
                { display: "主键", name: "PLAN_ID", PrimaryKey: "PLAN_ID", readOnly: false, isPrimaryKey: true, isShow: false },
                { display: "实施单状态", name: "AUDITING_EXE" },
                { display: "实施人", name: "EXE_USER" },
                { display: "实施单单号", name: "EXE_CODE" },
                { display: "码头名称", name: "DOCK_NAME" },
                { display: "计划单单号", name: "PLAN_CODE" },
            ],
            getData: function () {
                var me = this;
                app.ajax({
                    async: false,
                    type: 'post',
                    url: 'Device/RepDockInfo/GetRepDockExeList',
                    success: function (data) {
                        me.list = data.Rows;

                        data.Rows.forEach((a) => {
                            a.AUDITING_EXE = busResult.auditing_exe.find((v) => v.ID == a.AUDITING_EXE).TEXT;
                        });

                        var str = app.CreateListContentHtml(data.Rows, me.ListDict, true);
                        $("#exe_list").html(str);

                        data.Rows.forEach((a) => {
                            $("#list-" + a.PLAN_ID).click(function () {
                                dockdetail_popup.params = { "PLAN_ID": a.PLAN_ID };
                                dockdetail_popup.open();
                            });
                        });
                    },
                    error: function (message, data) {
                        app.dialog.error(message, function () { });
                        return;
                    }
                });
            },
            getCombox: function () {
                app.ajax({
                    async: false,
                    type: 'post',
                    url: 'Device/RepDockInfo/ComboxData',
                    success: function (data) {
                        busResult.dockInfo = data.dockInfo;
                    },
                    error: function (message, data) {
                        app.dialog.error(message, function () { });
                        return;
                    }
                });
                app.ajax({
                    async: false,
                    type: 'post',
                    url: 'popup/users',
                    success: function (data) {
                        data.forEach((a) => {
                            var station = a.Station.length > 0 ? '(' + a.Station + ')' : "";
                            userList.push({ "ID": a.Id, "TEXT": a.Name + station, "VALUE": a.Name });
                        });
                    },
                    error: function (message, data) {
                        app.dialog.error(message, function () { });
                        return;
                    }
                });
            },
            init: function () {
                var me = this;

                me.getCombox();
                me.getData();
                me.initSearchbar();
                me.initFreshButton();
            },

            initSearchbar: function () {
                app.searchbar.create({
                    el: '.searchbar',
                    searchContainer: '.list',
                    searchIn: ['.item-inner'],
                    on: {
                        search: function (sb, query, previousQuery) {
                            console.log(query, previousQuery);
                        }
                    }
                })
            },

            initFreshButton: function () {
                var me = this;
                //刷新按钮
                $('#refresh').on('click', function (e) {
                    me.getData();
                    me.initSearchbar();
                });
                //提交
                $("#sumbit").click(function () {
                    var checkDom = $("#exe_list input:checked");
                    var checkedIDList = [];
                    checkDom.forEach(x => {
                        checkedIDList.push({ PLAN_ID: x.value });
                    });
                    if (checkedIDList.length <= 0) {
                        app.dialog.error("请勾选后在点提交", function () { });
                        return false;
                    }
                    var flag = true;
                    checkedIDList.forEach((a) => {
                        var aut = me.list.find((v) => v.PLAN_ID == a.PLAN_ID).AUDITING_EXE;
                        if (aut == "已提交") {
                            app.dialog.error("已提交不能再提交", function () { });
                            flag = false;
                            return false;
                        }
                    });
                    var sids = [];
                    checkedIDList.forEach((a) => {
                        sids.push(a.PLAN_ID)
                    })
                    if (flag) {
                        app.dialog.confirm('确定要提交？', '提交', function () {
                            app.ajax({
                                async: false,
                                type: 'post',
                                url: 'Device/RepDockInfo/SubmitRepDockExe',
                                data: {
                                    "sids": sids
                                },
                                success: function (data) {
                                    app.dialog.alert("提交成功", function () {
                                        busResult.getData();
                                    });
                                },
                                error: function (message, data) {
                                    app.dialog.error(message, function () { });
                                    return;
                                }
                            });
                        })
                    }
                });
            }

        };
        busResult.init();
        var aud;
        var isleave = [{ "ID": "1", "TEXT": "是" }, { "ID": "0", "TEXT": "否" }];
        //明细信息
        var repdockExeDetailInfo = [
            { display: "主键", name: "PLAN_ID", PrimaryKey: "PLAN_ID", readOnly: true, isPrimaryKey: true, isShow: false },
            { display: "实施单状态", name: "AUDITING_EXE", readOnly: true, },
            { display: "实施人", name: "EXE_USER", readOnly: true, },
            { display: "实施单单号", name: "EXE_CODE", readOnly: true, },
            { display: "码头名称", name: "DOCK_NAME", readOnly: true, },
            { display: "码头编号", name: "DOCK_CODE", readOnly: true, },
            { display: "计划单单号", name: "PLAN_CODE", readOnly: true, },
            { display: "计划制定日期", name: "EDIT_DATE", readOnly: true, },
            { display: "计划制定人", name: "EDIT_USER", readOnly: true, },
            { display: "故障现象描述", name: "REP_DESC", readOnly: true, },
            { display: "备注", name: "MEMO", readOnly: true, },

            { display: "实际开工时间", name: "EXE_BDATE", validate: { required: true }, },
            { display: "实际完工时间", name: "EXE_EDATE", validate: { required: true }, },
            { display: "维修工时", name: "EXE_HOUR", readOnly: true, },
            { display: "实施人", name: "EXE_USER", },
            { display: "实施提交日期", name: "EXE_DATE", readOnly: true, },
            { display: "是否遗留问题", name: "IS_LEAVE", Option: isleave, validate: { required: true }, },
            { display: "实际维修费用", name: "EXE_COST", },
            { display: "遗留问题描述", name: "LEAVE_DESCRIBE", },
            { display: "实施情况描述", name: "EXE_DESCRIBE", },
        ];
        var dockdetail_popup = app.popup.create({
            content: `
                                                                                                                        <div class="popup answersheet">
                                                                                                                            <div class="view">
                                                                                                                                <div class="page">
                                                                                                                                    <div class="navbar">
                                                                                                                                        <div class="navbar-inner" style="background-color:rgb(0,125,255);">
                                                                                                                                            <div class="left link popup-close">
                                                                                                                                                <i class="f7-icons">arrow_left</i>
                                                                                                                                            </div>
                                                                                                                                            <div class="title">码头维修实施</div>
                                                                                                                                        </div>
                                                                                                                                    </div>
                                                                                                                                    <div class="toolbar tabbar toolbar-top">
                                                                                                                                        <div class="toolbar-inner" style="
                                                                                                                                            --f7-tabbar-link-active-border-color: #fff;
                                                                                                                                            --f7-tabbar-link-active-color: black;
                                                                                                                                            --f7-tabbar-link-active-bg-color: white;
                                                                                                                                            --f7-tabbar-link-inactive-color: black;
                                                                                                                                            background-color: rgb(236, 235, 235);
                                                                                                                                     ">
                                                                                                                                            <a href="#tab-1" class="tab-link tab-link-active" id="dg_list">码头维修实施详情</a>
                                                                                                                                            <a href="#tab-2" class="tab-link" id="modify_list">码头维修实施明细</a>
                                                                                                                                        </div>
                                                                                                                                    </div>
                                                                                                                                    <div class="tabs">
                                                                                                                                      <div id="tab-1" class="page-content tab tab-active">
                                                                                                                                        <div class="list inline-labels no-hairlines-md">
                                                                                                                                            <form class="list" id="detail_bg"></form>
                                                                                                                                        </div>

                                                                                                                                      </div>

                                                                                                                                      <div id="tab-2" class="page-content tab">

                                                                                                                                            <div class="list" id="modify_bg">
                                                                                                                                            </div>
                                                                                                                                      </div>
                                                                                                                                    </div>
                                                                                                                                    <div class="toolbar toolbar-bottom " id="menu" style="display: none;">
                                                                                                                                        <div class="toolbar-inner">
                                                                                                                                            <button class="col button button-large button-fill" id="save" >保存</button>
                                                                                                                                        </div>
                                                                                                                                    </div>
                                                                                                                                </div>
                                                                                                                            </div>
                                                                                                                        </div>`,
            on: {
                open: function () {
                    var me = this;
                    var ID = me.params.PLAN_ID;
                    $("#popup-close").click(function () {
                        dockdetail_popup.close();
                        busResult.getData();
                    });

                    $("#save").off('click').click(function () {

                        let data = app.form.convertToData("#detail_bg");
                        data.PLAN_ID = ID;
                        function checkAndShowError(value, errorMessage) {
                            if (value == null || value === '') {
                                app.dialog.error(errorMessage);
                                return false;
                            }
                            return true;
                        }

                        if (!checkAndShowError(data.EXE_BDATE, "实际开工时间不可为空") ||
                            !checkAndShowError(data.EXE_EDATE, "实际完工时间不可为空") ||
                            !checkAndShowError(data.IS_LEAVE, "是否遗留问题不可为空")) {
                            return;
                        }
                        var exeCost = Number(data.EXE_COST);
                        if (exeCost < 0 || isNaN(exeCost)) {
                            app.dialog.error('实际维修费用不是大于 0 的数字');
                            return;
                        }

                        //判断时间
                        var startDate = data.EXE_BDATE;
                        var completeDate = data.EXE_EDATE;
                        var start = new Date(startDate);
                        var complete = new Date(completeDate);

                        if (!startDate || !completeDate) {
                            $('#EXE_HOUR').val("");
                            return;
                        }

                        if (start >= complete) {
                            $('#EXE_BDATE').val("");
                            $('#EXE_EDATE').val("");
                            $('#EXE_HOUR').val("");
                            app.dialog.error("实际开工时间不能大于实际完工时间或者当前时间！请重新选择！");
                            return;
                        }

                        var now = new Date();
                        if (complete > now) {
                            $('#EXE_EDATE').val("");
                            app.dialog.error("实际完工时间不能大于当前时间！");
                            return;
                        }

                        var timeDiff = complete - start;
                        var minutesDiff = Math.round(timeDiff / 1000 / 60);
                        data.EXE_HOUR = minutesDiff;



                        var AddRow = new Object();
                        AddRow["Updated"] = [data];
                        AddRow["Original"] = [formDataDetail];
                        app.ajax({
                            jsToken: true,
                            type: 'post',
                            data: {
                                "request": AddRow
                            },
                            url: 'Device/RepDockInfo/ManageRepDockExe',
                            success: function () {
                                dockdetail_popup.close();
                            }
                        });
                    });
                    // 清单明细
                    if (ID) {
                        app.ajax({
                            type: 'post',
                            data: { id: ID },
                            url: 'Device/RepDockInfo/GetRepDockPlanListDetail',
                            success: function (data) {
                                aud = data.AUDITING_EXE;
                                data.AUDITING_EXE = busResult.auditing_exe.find((v) => v.ID == data.AUDITING_EXE).TEXT;
                                var detailInfo = data.AUDITING_EXE == "未提交" ? repdockExeDetailInfo : repdockExeDetailInfo.map(function (item) {
                                    return { ...item, readOnly: true };
                                });

                                var str = app.CreatePopupContentHtml(detailInfo);
                                $("#detail_bg").html(str);
                                if (data != null) {
                                    formDataDetail = data;
                                    app.form.fillFromData('#detail_bg', formDataDetail);
                                    showBtn(data.AUDITING_EXE == "未提交");
                                }
                                app.smartSelect.create({
                                    el: '.IS_LEAVE',
                                    searchbar: true
                                });
                                if (data.AUDITING_EXE == "未提交") {
                                    createCalendar('#EXE_BDATE');
                                    createCalendar('#EXE_EDATE');
                                }
                                CreateExeDetail(ID);
                            }
                        });
                    }
                }
            }
        });
        //时间
        function createCalendar(inputId) {
            app.calendar.create({
                inputEl: inputId,
                timePicker: true,
                dateFormat: 'yyyy-mm-dd HH::mm:ss',
            });
        }
        //按钮显示隐藏
        function showBtn(isEdit) {
            if (isEdit) {
                $("#menu").show();
                $("#dg_list").click(function () {
                    $("#menu").show();
                })
                $("#modify_list").click(function () {
                    $("#menu").hide();
                });
            } else {
                $("#menu").hide();
                $("#dg_list").click(function () {
                    $("#menu").hide();
                })
                $("#modify_list").click(function () {
                    $("#menu").hide();
                });
            }
        }
        var exeDetail = [
            { display: "主键", name: "PLAN_ITEM_ID", PrimaryKey: "PLAN_ITEM_ID", readOnly: false, isPrimaryKey: true, isShow: false },
            { display: "是否完成", name: "IS_COMPLETE" },
            { display: "维修项目", name: "REP_ITEM" },
            { display: "维修内容", name: "REP_CONTENT" },
            { display: "维修方案", name: "REP_METHOD" },
            { display: "预计人员数量", name: "LABOR_NUM" },
            { display: "预计花费时间（h）", name: "TAKE_TIME" },
            { display: "检修负责人", name: "REP_LEADER" },
            { display: "实施日期", name: "EXE_DATE" },
            { display: "实际人员数量", name: "EXE_LABOR_NUM" },
            { display: "实际花费时间", name: "EXE_TAKE_TIME" },
            { display: "备注", name: "MEMO" }
        ];
        //实施维修项目明细列表
        function CreateExeDetail(ID) {

            var where = JSON.stringify({
                op: 'and',
                rules: [{ field: 'PLAN_ID', op: 'equal', value: ID }]
            });

            app.ajax({
                type: 'post',
                data: { "where": where },
                url: 'Device/RepDockInfo/GetPlandetList',
                success: function (data) {
                    // 清单
                    data.Rows.forEach((a) => {
                        a.IS_COMPLETE = isleave.find((v) => v.ID == a.IS_COMPLETE).TEXT;
                    });
                    var str = app.CreateListContentHtml(data.Rows, exeDetail, false);
                    $("#modify_bg").html(str);
                    data.Rows.forEach((a) => {
                        $("#list-" + a.PLAN_ITEM_ID).click(function () {
                            debugger
                            detail_popup.params = { "PLAN_ITEM_ID": a.PLAN_ITEM_ID, "PLAN_ID": a.PLAN_ID, };
                            detail_popup.open();
                            $("#popup-close").click(function () {
                                detail_popup.close();
                            })
                        })
                    });
                    
                    
                }
            });

        };

        var exeDetailInfoEdit = [
            { display: "主键", name: "PLAN_ITEM_ID", PrimaryKey: "PLAN_ITEM_ID", readOnly: true, isPrimaryKey: true, isShow: false },
            { display: "是否完成", name: "IS_COMPLETE", validate: { required: true }, Option: isleave},
            { display: "维修项目", name: "REP_ITEM", readOnly: true, },
            { display: "维修内容", name: "REP_CONTENT", readOnly: true, },
            { display: "维修方案", name: "REP_METHOD", readOnly: true, },
            { display: "预计人员数量", name: "LABOR_NUM", readOnly: true, },
            { display: "预计花费时间（h）", name: "TAKE_TIME", readOnly: true, },
            { display: "检修负责人", name: "REP_LEADER", readOnly: true, },
            { display: "实施日期", name: "EXE_DATE" },
            { display: "实际人员数量", name: "EXE_LABOR_NUM"},
            { display: "实际花费时间", name: "EXE_TAKE_TIME"},
            { display: "备注", name: "MEMO" },
            { display: "外键", name: "PLAN_ID", isShow: false },
        ];
        var detail_popup = app.popup.create({
            content: `
                                                                                                                <div class="popup answersheet"id ="detail_popup">
                                                                                                                    <div class="view" >
                                                                                                                        <div class="page">
                                                                                                                            <div class="navbar">
                                                                                                                                <div class="navbar-inner" style="background-color:rgb(0,125,255);">
                                                                                                                                    <div class="left link popup-close">
                                                                                                                                        <i class="f7-icons">arrow_left</i>
                                                                                                                                    </div>
                                                                                                                                    <div class="title">明细详情</div>
                                                                                                                                </div>
                                                                                                                            </div>
                                                                                                                            <div class="tabs">
                                                                                                                              <div id="tab-1" class="page-content tab tab-active">
                                                                                                                                <div class="list inline-labels no-hairlines-md">
                                                                                                                                    <form class="list" id="detail_bg_detail">
                                                                                                                                     </form>
                                                                                                                                </div>
                                                                                                                              </div>
                                                                                                                            </div>
                                                                                                                             <div class="toolbar toolbar-bottom" id="menuDetail">
                                                                                                                                <div class="toolbar-inner">
                                                                                                                                    <button class="col button button-large button-fill" id="saveDetail" style="background-color: #2faa44">保存</button>
                                                                                                                                </div>
                                                                                                                            </div>
                                                                                                                        </div>
                                                                                                                    </div>
                                                                                                                </div>`,
            on: {
                open: function () {
                    var me = this;

                    $("#saveDetail").off('click').click(function () {
                        var ID = me.params.PLAN_ITEM_ID;
                        let data = app.form.convertToData("#detail_bg_detail");
                        data.PLAN_ID = me.params.PLAN_ID;
                        data.PLAN_ITEM_ID = ID;

                        if (data.PLAN_ID == null || data.PLAN_ID == '') {
                            app.dialog.error("参数错误");
                            return
                        }

                        if (data.IS_COMPLETE == null || data.IS_COMPLETE == '') {
                            app.dialog.error("是否完成不可为空");
                            return
                        }

                        var exeLaborValue = Number(data.EXE_LABOR_NUM);
                        if (exeLaborValue < 0 || isNaN(exeLaborValue)) {
                            app.dialog.error('实际人员数量不是大于 0 的数字');
                            return;
                        }

                        var exeTimeValue = Number(data.EXE_TAKE_TIME);
                        if (exeTimeValue < 0 || isNaN(exeTimeValue)) {
                            app.dialog.error('实际花费时间不是大于 0 的数字');
                            return;
                        }

                        var AddRow = new Object();

                        if (data.PLAN_ITEM_ID) {
                            AddRow["Updated"] = [data];
                            AddRow["Original"] = [formDataDetail];
                        }
                        else {
                            AddRow["Added"] = [data]
                        }

                        app.ajax({
                            type: 'post',
                            data: {
                                "request": AddRow
                            },
                            url: 'Device/RepDockInfo/ManagePlandet',
                            success: function () {
                                detail_popup.close();
                                CreateExeDetail(data.PLAN_ID);
                            }
                        });
                    });



                    // 清单明细
                    if (me.params.PLAN_ID) {
                        var where = JSON.stringify({
                            op: 'and',
                            rules: [{ field: 'PLAN_ID', op: 'equal', value: me.params.PLAN_ID }]
                        });
                        app.ajax({
                            type: 'post',
                            data: {
                                "where": where
                            },
                            url: 'Device/RepDockInfo/GetPlandetList',
                            success: function (data) {
                                var detailInfo = aud == "0" ? exeDetailInfoEdit : exeDetailInfoEdit.map(function (item) {
                                    return { ...item, readOnly: true };
                                });

                                var str = app.CreatePopupContentHtml(detailInfo);
                                $("#detail_bg_detail").html(str);
                                debugger
                                app.smartSelect.create({
                                    el: '.IS_COMPLETE',
                                    searchbar: true
                                });
                                if (data.Rows.length > 0) {
                                    formDataDetail = data.Rows[0];
                                    app.form.fillFromData('#detail_bg_detail', formDataDetail);
                                }
                                if (aud == "0") {
                                    createCalendar('#EXE_DATE');
                                }
                                if (aud != "0") {
                                    createCalendar('#EXE_DATE');
                                    $("#menuDetail").hide();
                                }
                            }
                        });
                    }

                }
            }
        });
        //时间
        function createCalendar(inputId) {
            app.calendar.create({
                inputEl: inputId,
                timePicker: true,
                dateFormat: 'yyyy-mm-dd HH::mm:ss',
            });
        }
    </script>
</body>

</html>
