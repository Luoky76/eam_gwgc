<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, minimal-ui, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2196f3">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>码头维修验收</title>
    <link rel="stylesheet" href="../../../dist/Framework7/mobile.css?v=1" />
</head>

<body class="color-theme-blue">
    <div id="app">
        <div class="statusbar">
        </div>
        <!-- Your main view, should have "view-main" class -->
        <div class="view view-main">
            <div class="page" data-name="home">
                <div class="navbar">
                    <div class="navbar-bg"></div>
                    <div class="navbar-inner sliding">
                        <div class="title">码头维修验收</div>

                        <div class="subnavbar">
                            <form class="searchbar" id="searchbar-autocomplete">
                                <div class="searchbar-inner">
                                    <div class="searchbar-input-wrap">
                                        <input type="search" placeholder="请输入..." id="searchText" />
                                        <i class="searchbar-icon"></i>
                                        <span class="input-clear-button"></span>
                                    </div>
                                    <span class="searchbar-disable-button">Cancel</span>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="list page-content" style="padding-top: 80px; padding-bottom: 80px">
                    <div id="check_list">
                    </div>
                </div>

                <div class="toolbar toolbar-bottom-md">
                    <div class="toolbar-inner">
                        <a href='javascript:app.methods.toUrl("back")' class="link external">
                            <i class="f7-icons">arrow_left</i>
                            <span class="ios-only">返回</span>
                        </a>
                        <button class="button" id="sumbit">
                            提交
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="text/javascript" src="../../../dist/Framework7/mobile.js?v=1"></script>
    <script type="text/javascript" src="../../../dist/Framework7/app.js?v=1"></script>
    <script type="text/javascript" id="scriptBlock">
        'use strict';
        var formdata;
        var formDataDetail;
        var isleave = [{ "ID": "1", "TEXT": "是" }, { "ID": "0", "TEXT": "否" }];
        var busResult = {
            auditing: [{ "ID": "1", "TEXT": "已提交" }, { "ID": "0", "TEXT": "未提交" }],
            ListDict: [
                { display: "主键", name: "CHECK_ID", PrimaryKey: "CHECK_ID", readOnly: false, isPrimaryKey: true, isShow: false },
                { display: "确认单状态", name: "AUDITING_CHECK" },
                { display: "维修项目", name: "REP_ITEM" },
                { display: "维修费用(元)", name: "REP_MONEY" },
                { display: "验收时间", name: "CHECK_DATE" },
                { display: "是否有遗留问题", name: "IS_LEAVE" },
            ],
            getData: function () {
                var me = this;
                app.ajax({
                    async: false,
                    type: 'post',
                    url: 'Device/RepDockInfo/GetRepDockCheckList',
                    success: function (data) {
                        me.list = data.Rows;

                        data.Rows.forEach((a) => {
                            a.AUDITING_CHECK = busResult.auditing.find((v) => v.ID == a.AUDITING_CHECK).TEXT;
                            a.IS_LEAVE = isleave.find((v) => v.ID == a.IS_LEAVE).TEXT;
                        });

                        var str = app.CreateListContentHtml(data.Rows, me.ListDict, true);
                        $("#check_list").html(str);

                        data.Rows.forEach((a) => {
                            $("#list-" + a.CHECK_ID).click(function () {
                                detail_popup.params = { "CHECK_ID": a.CHECK_ID };
                                detail_popup.open();
                            });
                        });
                    },
                    error: function (message, data) {
                        app.dialog.error(message, function () { });
                        return;
                    }
                });
            },
            getCombox: function () {
                var me = this;
                /*app.ajax({
                    async: false,
                    type: 'post',
                    url: 'Device/RepOut/ComboxData',
                    success: function (data) {
                        me.maintDept = data.maintDept;
                    },
                    error: function (message, data) {
                        app.dialog.error(message, function () { });
                        return;
                    }
                });*/
            },
            init: function () {
                var me = this;

                //me.getCombox();
                me.getData();
                me.initSearchbar();
                me.initFreshButton();
            },

            initSearchbar: function () {
                app.searchbar.create({
                    el: '.searchbar',
                    searchContainer: '.list',
                    searchIn: ['.item-inner'],
                    on: {
                        search: function (sb, query, previousQuery) {
                            console.log(query, previousQuery);
                        }
                    }
                })
            },

            initFreshButton: function () {
                var me = this;
                //刷新按钮
                $('#refresh').on('click', function (e) {
                    me.getData();
                    me.initSearchbar();
                });
                //提交
                $("#sumbit").click(function () {
                    var checkDom = $("#check_list input:checked");
                    var checkedIDList = [];
                    checkDom.forEach(x => {
                        checkedIDList.push({ CHECK_ID: x.value });
                    });
                    if (checkedIDList.length <= 0) {
                        app.dialog.error("请勾选后在点提交", function () { });
                        return false;
                    }
                    var flag = true;
                    checkedIDList.forEach((a) => {
                        var aut = me.list.find((v) => v.CHECK_ID == a.CHECK_ID).AUDITING_CHECK;
                        if (aut == "已提交") {
                            app.dialog.error("已提交不能再提交", function () { });
                            flag = false;
                            return false;
                        }
                    });
                    var sids = [];
                    checkedIDList.forEach((a) => {
                        sids.push(a.CHECK_ID)
                    })
                    if (flag) {
                        app.dialog.confirm('确定要提交？', '提交', function () {
                            app.ajax({
                                async: false,
                                type: 'post',
                                url: 'Device/RepDockInfo/SubmitRepDockCheck',
                                data: {
                                    "sids": sids
                                },
                                success: function (data) {
                                    app.dialog.alert("提交成功", function () {
                                        busResult.getData();
                                    });
                                },
                                error: function (message, data) {
                                    app.dialog.error(message, function () { });
                                    return;
                                }
                            });
                        })
                    }
                });
            }

        };
        busResult.init();
        //明细信息
        var repoutCheckDetailInfo = [
            { display: "主键", name: "CHECK_ID", PrimaryKey: "CHECK_ID", readOnly: true, isPrimaryKey: true, isShow: false },
            { display: "确认单状态", name: "AUDITING_CHECK", readOnly: true, },
            { display: "实施单单号", name: "EXE_CODE", readOnly: true, },
            { display: "维修项目", name: "REP_ITEM", readOnly: true, },
            { display: "故障现象描述", name: "FAULT_DESCRIBE", readOnly: true, },
            { display: "故障原因", name: "REASON",  readOnly: true, },
            { display: "解决方法", name: "SOLUTION", readOnly: true, },
            { display: "维修内容", name: "REP_CONTENT", readOnly: true, },
            { display: "是否有遗留问题", name: "IS_LEAVE", readOnly: true, },
            { display: "确认人", name: "CONFIRM_USER", readOnly: true, },
            { display: "遗留问题描述", name: "LEAVE_MEMO", readOnly: true, },
            { display: "备注", name: "MEMO", readOnly: true, },
            { name: "", readOnly: true, },
            { display: "合同编号", name: "PACT_CODE" },
            { display: "合同名称", name: "PACT_NAME" },
            { display: "签订日期", name: "PACT_DATE" },
            { display: "承修方", name: "PROVIDER_NAME" },
            { display: "合同金额(元)", name: "PACT_MONEY" },
            { display: "维修费用(元)", name: "REP_MONEY" },
            { name: "", readOnly: true, },
            { display: "验收时间", name: "CHECK_DATE" },
            { display: "验收人", name: "CHECK_USER" },
            { display: "实际开工时间", name: "EXE_BDATE", readOnly: true, },
            { display: "实际完工时间", name: "EXE_EDATE", readOnly: true, },
            { display: "验收情况", name: "CHECK_DESC", validate: { required: true } },
        ];
        var detail_popup = app.popup.create({
            content: `
                                                                                                    <div class="popup answersheet"id ="detail_popup">
                                                                                                        <div class="view" >
                                                                                                            <div class="page">
                                                                                                                <div class="navbar">
                                                                                                                    <div class="navbar-inner" style="background-color:rgb(0,125,255);">
                                                                                                                        <div class="left link popup-close">
                                                                                                                            <i class="f7-icons">arrow_left</i>
                                                                                                                        </div>
                                                                                                                        <div class="title">详情</div>
                                                                                                                    </div>
                                                                                                                </div>
                                                                                                                <div class="tabs">
                                                                                                                  <div id="tab-1" class="page-content tab tab-active">
                                                                                                                    <div class="list inline-labels no-hairlines-md">
                                                                                                                        <form class="list" id="detail_bg">
                                                                                                                         </form>
                                                                                                                    </div>
                                                                                                                  </div>
                                                                                                                </div>
                                                                                                                <div class="toolbar toolbar-bottom" id="menuDetail">
                                                                                                                    <div class="toolbar-inner">
                                                                                                                        <button class="col button button-large button-fill" id="saveDetail" >保存</button>
                                                                                                                   </div>
                                                                                                               </div>
                                                                                                            </div>
                                                                                                        </div>
                                                                                                    </div>`,
            on: {
                open: function () {
                    var me = this;
                    var ID = me.params.CHECK_ID;
                    $("#popup-close").click(function () {
                        detail_popup.close();
                        busResult.getData();
                    });

                    $("#saveDetail").off('click').click(function () {

                        let data = app.form.convertToData("#detail_bg");
                        data.CHECK_ID = ID;

                        if (data.CHECK_DESC == null || data.CHECK_DESC == '') {
                            app.dialog.error("验收情况不可为空");
                            return;
                        }
                        var pactValue = Number(data.PACT_MONEY);
                        var repValue = Number(data.REP_MONEY);
                        if (pactValue < 0 || isNaN(pactValue)) {
                            app.dialog.error('合同金额(元)不是正数');
                            return;
                        }
                        if (repValue < 0 || isNaN(repValue)) {
                            app.dialog.error('维修费用不是正数');
                            return;
                        }
                        var AddRow = new Object();
                        AddRow["Updated"] = [data];
                        AddRow["Original"] = [formDataDetail];
                        app.ajax({
                            jsToken: true,
                            type: 'post',
                            data: {
                                "request": AddRow
                            },
                            url: 'Device/RepDockInfo/ManageRepDockCheck',
                            success: function () {
                                detail_popup.close();
                            }
                        });
                    });
                    // 清单明细
                    if (ID) {
                        app.ajax({
                            type: 'post',
                            data: { id: ID },
                            url: 'Device/RepDockInfo/GetRepDockConfirmDetail',
                            success: function (data) {
                                data.AUDITING_CHECK = busResult.auditing.find((v) => v.ID == data.AUDITING_CHECK).TEXT;
                                data.IS_LEAVE = isleave.find((v) => v.ID == data.IS_LEAVE).TEXT;
                                var detailInfo = data.AUDITING_CHECK == "未提交" ? repoutCheckDetailInfo : repoutCheckDetailInfo.map(function (item) {
                                    return { ...item, readOnly: true };
                                });

                                var str = app.CreatePopupContentHtml(detailInfo);
                                $("#detail_bg").html(str);
                                if (data != null) {
                                    formDataDetail = data;
                                    app.form.fillFromData('#detail_bg', formDataDetail);
                                    showBtn(data.AUDITING_CHECK == "未提交");
                                    if (data.AUDITING_CHECK == "未提交") {
                                        createCalendar('#CHECK_DATE');
                                        createCalendar('#PACT_DATE');
                                    }
                                }
                            }
                        });
                    }
                }
            }
        });
        //时间
        function createCalendar(inputId) {
            app.calendar.create({
                inputEl: inputId,
                timePicker: true,
                dateFormat: 'yyyy-mm-dd HH::mm:ss',
            });
        }
        //按钮显示隐藏
        function showBtn(isEdit) {
            if (isEdit) {
                $("#saveDetail").show();
            } else {
                $("#saveDetail").hide();
            }
        }
    </script>
</body>

</html>
