<template>
    <div class="page" data-name="workflow-my-flow">
        <div class="navbar">
            <div class="navbar-bg"></div>
            <div class="navbar-inner">
                <div class="left">
                    <a href='javascript:app.methods.toUrl("back")' class="link external">
                        <i class="f7-icons">arrow_left</i>
                        <span class="ios-only">返回</span>
                    </a>
                </div>
                <div class="title">发起流程</div>
                <div class="right">
                    <a href='javascript:app.methods.toUrl("/")' class="link external">
                        <i class="f7-icons">home</i>
                        <span class="ios-only">主页</span>
                    </a>
                </div>
            </div>
        </div>
        <div class="page-content common-virtual-list">
            <div class="searchbar-wrap">
                <form data-search-container="#my-flow" class="searchbar searchbar-init">
                    <div class="searchbar-inner">
                        <div class="searchbar-input-wrap">
                            <input type="search" placeholder="标题" />
                            <i class="searchbar-icon"></i>
                            <span class="input-clear-button"></span>
                        </div>
                        <span class="searchbar-disable-button">取消</span>
                    </div>
                </form>
            </div>
            <div id="my-flow" class="content-wrapper list virtual-list"></div>
        </div>
    </div>
</template>
<style>
    .common-virtual-list .virtual-list {
        margin-top: 64px;
    }
</style>
<script>
    'use strict';
    var business = {
        page: null,
        data: [],
        setContent: function () {
            var me = this;
            var $el = me.page.$el.find("#my-flow");
            app.virtualList.destroy($el);
            app.virtualList.create({
                el: $el,
                items: me.data,
                height: 48,
                searchAll: function (query, items) {
                    var found = [];
                    query = (query || "").toLowerCase();
                    for (var i = 0, l = items.length; i < l; i++) {
                        var item = items[i];
                        if (item._info.indexOf(query) >= 0 || query.trim() === '') found.push(i);
                    }
                    return found;
                },
                renderItem: function (item) {
                    return `<li style="height:48px;">
                                <a href="/flow-create/${item.FLOW_CODE || item.ID}" class="item-link item-content">
                                    <div class="item-inner">
                                      <div>${item.FLOW_NAME}</div>
                                      <span class="badge color-blue">V${item.FLOW_VERSION}</span>
                                    </div>
                                </a>
                            </li>`;
                }
            });
        },
        loadData: function () {
            var me = this;
            app.ajax({
                url: 'workflow/query/flowlist',
                data: {
                    sortname: "FLOW_ORDER",
                    sortorder: "asc",
                    changePage: "1"
                },
                success: function (data) {
                    me.data = data.Rows || [];
                    for (var i = 0, l = me.data.length; i < l; i++) {
                        var item = me.data[i];
                        item._info = castString(item.FLOW_NAME).toLowerCase();
                    }
                    me.setContent();
                }
            });
        },
        init: function (page, ctx) {
            var me = this;
            me.page = page;
            me.ctx = ctx;
            me.loadData();
        }
    };
    return function (props, ctx) {
        ctx.$on('pageInit', function (_e, page) {
            business.init(page, ctx);
        });
        return $render;
    };
</script>
