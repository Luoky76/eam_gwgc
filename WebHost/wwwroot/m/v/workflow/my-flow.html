<template>
    <div class="page" data-name="workflow-my-flow">
        <div class="navbar">
            <div class="navbar-bg"></div>
            <div class="navbar-inner">
                <div class="left">
                    <a href='javascript:app.methods.toUrl("back")' class="link external">
                        <i class="f7-icons">arrow_left</i>
                        <span class="ios-only">返回</span>
                    </a>
                </div>
                <div class="title">我发起的</div>
                <div class="right">
                    <a href='javascript:app.methods.toUrl("/")' class="link external">
                        <i class="f7-icons">home</i>
                        <span class="ios-only">主页</span>
                    </a>
                </div>
            </div>
        </div>
        <div class="page-content custom-tab">
            <div class="searchbar-wrap">
                <form data-search-container="#my-flow" data-search-item="li" data-search-in=".item-title" class="searchbar searchbar-init">
                    <div class="searchbar-inner">
                        <div class="searchbar-input-wrap">
                            <input type="search" placeholder="标题或发起时间" />
                            <i class="searchbar-icon"></i>
                            <span class="input-clear-button"></span>
                        </div>
                        <span class="searchbar-disable-button">取消</span>
                    </div>
                </form>
            </div>
            <div id="my-flow" class="list no-hairlines virtual-list media-list chevron-center"></div>
        </div>
    </div>
</template>
<style>
    .custom-tab .virtual-list {
        margin-top: 76px;
        --f7-badge-font-size: 14px;
        --f7-badge-padding: 14px;
    }

    .custom-tab .searchbar-wrap {
        position: fixed !important;
        top: 50px;
        background-color: #EAEEFA;
        width: 100%;
        z-index: 100;
    }

    .custom-tab .searchbar {
        width: 95% !important;
        --f7-searchbar-input-bg-color: #DBE2F9;
        --f7-searchbar-search-icon-color: rgb(27, 27, 31);
    }

    .custom-tab .searchbar-disable-button:after {
        color: rgb(27, 27, 31);
    }

    .custom-tab .card-footer .button {
        min-width: 100px;
    }
    .visibility-hidden {
        visibility: hidden;
    }
</style>
<script>
    'use strict';
    var business = {
        page: null,
        data: [],
        setContent: function () {
            var me = this;
            var $el = me.page.$el.find("#my-flow");
            app.virtualList.destroy($el);
            app.virtualList.create({
                el: $el,
                items: me.data,
                height: 300,
                searchAll: function (query, items) {
                    var found = [];
                    query = (query || "").toLowerCase();
                    for (var i = 0, l = items.length; i < l; i++) {
                        var item = items[i];
                        var search = (item.Title || "") + "@#" + (item.CreateDate || "");
                        if (search.toLowerCase().indexOf(query) >= 0 || query.trim() === '') found.push(i);
                    }
                    return found;
                },
                renderItem: function (item) {
                    return `<li style="height:300px;">
                                <div class="card card-outline">
                                    <div class="card-header">${item.Title}<div class="text-color-red">${item.Elapsed}</div></div>
                                    <div class="card-content list simple-list">
                                        <ul class="no-padding">
                                            <li>
                                                ${item.NodeName}
                                                <div>
                                                   处理人：${item.Operator}
                                                </div>
                                            </li>
                                            <li>
                                                <div>
                                                   状态：${item.TaskStatusHtml}
                                                </div>
                                                <div>
                                                   结果：${item.StatusHtml}
                                                </div>
                                            </li>
                                            <li>
                                                发起时间
                                                <div>
                                                   ${item.CreateDate}
                                                </div>
                                            </li>
                                            <li>
                                                完成时间
                                                <div>
                                                   ${item.CreateDate}
                                                </div>
                                            </li>
                                        </ul>
                                    </div>
                                    <div class="card-footer">
                                        <div index="${item._index}" class="${item.isFinish ?"visibility-hidden":""} button button-outline l-button-icon flow-cancel"><i class="f7-icons">reply</i>取回流程</div>
                                        <a href="/flow-detail/${item.Id}/1" class="link"><div class="button button-fill l-button-icon"><i class="f7-icons">info_round</i>&nbsp;详情</div></a>
                                    </div>
                                </div>
                            </li>`;
                }
            });
        },
        loadData: function () {
            var me = this;
            app.ajax({
                url: 'workflow/query/myFlow',
                data: {
                    sortname: "TaskId",
                    sortorder: "desc",
                    changePage: "1"
                },
                success: function (data) {
                    me.data = data.Rows || [];
                    var time = new Date().getTime();
                    for (var i = 0, l = me.data.length; i < l; i++) {
                        var item = me.data[i];
                        item._index = i;
                        item.isFinish = item.TaskFinishFlag === "1";
                        var minute = (time - item.StartDate.toDate().getTime()) / (1000 * 60);
                        var hour = parseInt(minute / 60);
                        item.Elapsed = (hour > 0 ? hour + "时" : "") + parseInt(minute % 60) + "分";
                        item.StatusHtml = me.getStatusHtml(item.NodeStatus);
                        item.TaskStatusHtml = me.getTaskStatusHtml(item);
                    }
                    me.setContent();
                }
            });
        },
        getTaskStatusHtml: function (item) {
            var text = "进行中", cls = "color-blue";
            if (item.isFinish) {
                text = "已完成";
                cls = "color-green";
            }
            return '<span class="badge ' + cls + '">' + text + '</span>';
        },
        getStatusHtml: function (status) {
            var me = this;
            status = (status || "").toString();
            for (var i = 0, l = me.dataStatus.length; i < l; i++) {
                var item = me.dataStatus[i];
                if (item.ID === status) {
                    var cls = ""
                    switch (item.TEXT) {
                        case "同意":
                            cls = "color-green";
                            break;
                        case "拒绝":
                            cls = "color-red";
                            break;
                        default:
                            cls = "color-blue";
                            break;
                    }
                    return '<span class="badge ' + cls + '">' + item.TEXT + '</span>';
                }
            }
        },
        loadComboxData: function () {
            var me = this;
            app.ajax({
                async: false,
                url: 'workflow/query/statusData',
                success: function (data) {
                    me.dataStatus = data;
                }
            });
        },
        cancel: function (selected) {
            var me = this;
            app.ajax({
                jsToken: true,
                url: 'workflow/task/cancel',
                data: { Id: selected.Id, TaskId: selected.TaskId },
                success: function () {
                    app.dialog.alert("保存成功", function () {
                        me.loadData();
                    });
                }
            });
        },
        bindEvent: function () {
            var me = this, page = me.page.$el;
            page.off("click", ".flow-cancel").on("click", ".flow-cancel", function () {
                var i = this.getAttribute("index");
                if (me.data.length <= i) return;
                var item = me.data[i];
                me.cancel(item);
            });
        },
        destroy: function () {
            var me = this, page = me.page.$el;
            page.off("click", ".flow-cancel");
        },
        init: function (page, ctx) {
            var me = this;
            me.page = page;
            me.ctx = ctx;
            me.bindEvent();
            me.loadComboxData();
            me.loadData();
        }
    };
    return function (props, ctx) {
        ctx.$on('pageInit', function (_e, page) {
            business.init(page, ctx);
        });
        ctx.$on('pageAfterOut', function (_e, page) {
            business.destroy();
        });
        return $render;
    };
</script>
