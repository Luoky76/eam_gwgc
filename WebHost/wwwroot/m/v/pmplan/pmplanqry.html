                        me.workState = data.workState;
                        me.maintCycle = data.maintCycle;
                        me.storeSou = data.storeSou;

        //检测文件是否有效
        function fileExist(FileURL) {
            if (window.ActiveXObject) {
                xmlhttp = new ActiveXObject("Microsoft.XMLHTTP");
            } else if (window.XMLHttpRequest) {
                xmlhttp = new XMLHttpRequest();
            }
            xmlhttp.open("GET", FileURL, false);
            xmlhttp.send();
            if (xmlhttp.readyState == 4) {

                if (xmlhttp.status == 200) {
                    return "1";
                } else if (xmlhttp.status == 404) {
                    return "2";
                } else {
                    return "3";
                }
            }
        }
        //下载
        function f_fileDownload(url, fileName) {
            var isExist = fileExist(url);

            if (isExist != "1") {
                app.showError('系统未能找到该资源！无法下载！');
                return false;
            }

            var xhr = new XMLHttpRequest();
            xhr.open("get", url, true);
            xhr.responseType = "blob";
            xhr.onload = function () {
                if (this.status == 200) saveAs(this.response, fileName);
            };
            xhr.send();
        }
