<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, minimal-ui, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2196f3">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>IT设备维修申请</title>
    <link rel="stylesheet" href="../../../dist/Framework7/mobile.css?v=1" />
</head>

<body class="color-theme-blue">
    <div id="app">
        <div class="statusbar">
        </div>
        <!-- Your main view, should have "view-main" class -->
        <div class="view view-main">
            <div class="page" data-name="home">
                <div class="navbar">
                    <div class="navbar-bg"></div>
                    <div class="navbar-inner sliding">
                        <div class="title">IT设备维修申请</div>

                        <div class="subnavbar">
                            <form class="searchbar" id="searchbar-autocomplete">
                                <div class="searchbar-inner">
                                    <div class="searchbar-input-wrap">
                                        <input type="search" placeholder="请输入..." id="searchText" />
                                        <i class="searchbar-icon"></i>
                                        <span class="input-clear-button"></span>
                                    </div>
                                    <span class="searchbar-disable-button">Cancel</span>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="list page-content" style="padding-top: 80px; padding-bottom: 80px">
                    <div id="apply_list">
                    </div>
                </div>

                <div class="toolbar toolbar-bottom-md">
                    <div class="toolbar-inner">
                        <a href='javascript:app.methods.toUrl("back")' class="link external">
                            <i class="f7-icons">arrow_left</i>
                            <span class="ios-only">返回</span>
                        </a>
                        <!--<button class="button" id="refresh">
                            刷新
                        </button>-->
                        <button class="button" id="add">
                            新增
                        </button>
                        <button class="button button-large button-fill" id="Del" style="background-color: red">删除</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="text/javascript" src="../../../dist/Framework7/mobile.js?v=1"></script>
    <script type="text/javascript" src="../../../dist/Framework7/app.js?v=1"></script>
    <script type="text/javascript" id="scriptBlock">
        'use strict';
        var formdata;
        var formDataDetail;
        var business = {
            auditing: [],
            user: [],
            assetCard: [],
            corp: [],
            ListDict: [
                {
                    display: " 主键",
                    name: "REPORT_ID",
                    PrimaryKey: "REPORT_ID",
                    readOnly: false,
                    isPrimaryKey: true,
                    isShow: false
                },
                {
                    display: "记录状态 ", name: "AUDITING_APPLY",
                },
                {
                    display: "维修申请单号", name: "APPLY_CODE",
                },
                {
                    display: "设备编码", name: "ASSET_CODE",
                },
                {
                    display: "设备名称", name: "ASSET_NAME"
                },
                {
                    display: "设备类型", name: "TYPE_NAME"
                }
            ],
            getData: function () {
                var me = this;
                app.ajax({
                    async: false,
                    type: 'post',
                    url: 'Special/AssetReport/ApplyList',
                    success: function (data) {
                        me.list = data.Rows;
                        data.Rows.forEach((a) => {
                            a.AUDITING_APPLY = me.auditing.find((v) => v.ID == a.AUDITING_APPLY).TEXT;
                        });

                        var str = app.CreateListContentHtml(data.Rows, me.ListDict, true);
                        $("#apply_list").html(str);

                        data.Rows.forEach((a) => {
                            $("#list-" + a.REPORT_ID).click(function () {
                                popupOpen(a.REPORT_ID);
                            });
                        });
                    },
                    error: function (message, data) {
                        app.dialog.error(message, function () { });
                        return;
                    }
                });
            },
            getCombox: function () {
                var me = this;
                app.ajax({
                    async: false,
                    type: 'post',
                    url: 'Special/AssetReport/Comboxdata',
                    success: function (data) {
                        debugger
                        me.auditing = data.Auditing;
                        me.user = data.User;
                        me.assetCard = data.AssetCard;
                        me.corp = data.Corp;
                    },
                    error: function (message, data) {
                        app.dialog.error(message, function () { });
                        return;
                    }
                });
            },
            init: function () {
                var me = this;

                me.getCombox();
                me.getData();
                me.initSearchbar();
                me.initFreshButton();
            },

            initSearchbar: function () {
                app.searchbar.create({
                    el: '.searchbar',
                    searchContainer: '.list',
                    searchIn: ['.item-inner'],
                    on: {
                        search: function (sb, query, previousQuery) {
                            console.log(query, previousQuery);
                        }
                    }
                })
            },

            initFreshButton: function () {
                var me = this;
                //刷新按钮
                $('#refresh').on('click', function (e) {
                    me.getData();
                    me.initSearchbar();
                });

                //新增
                $('#add').on('click', function (e) {
                    popupOpen('');
                });

                $("#Del").click(function () {
                    var checkDom = $("#apply_list input:checked");
                    var checkedIDList = [];
                    checkDom.forEach(x => {
                        checkedIDList.push({ REPORT_ID: x.value, AUDITING_APPLY: "0" });
                    });

                    if (checkedIDList.length <= 0) {
                        app.dialog.error("请勾选后在点删除", function () { });
                        return false;
                    }

                    var flag = true;
                    checkedIDList.forEach((a) => {
                        var aut = me.list.find((v) => v.REPORT_ID == a.REPORT_ID).AUDITING_APPLY;
                        if (aut == "1") {
                            app.dialog.error("已提交不能删除", function () { });
                            flag = false;
                            return false;
                        }
                    });
                    if (flag) {
                        app.dialog.confirm('确定要删除？', '删除', function () {

                            var deleteRow = {};
                            deleteRow["Deleted"] = checkedIDList;

                            app.ajax({
                                async: false,
                                type: 'post',
                                url: 'Special/AssetReport/Save',
                                data: {
                                    "request": deleteRow
                                },
                                success: function (data) {
                                    app.dialog.alert("删除成功", function () {
                                        business.getData();
                                    });
                                },
                                error: function (message, data) {
                                    app.dialog.error(message, function () { });
                                    return;
                                }
                            });
                        })
                    }
                });
            }

        };
        business.init();


        var outAppInfo = [
            {
                display: " 主键",
                name: "REPORT_ID",
                PrimaryKey: "REPORT_ID",
                readOnly: true,
                isPrimaryKey: true,
                isShow: false
            },
            { display: "记录状态", name: "AUDITING_APPLY", Option: business.auditing, readOnly: true, isShow: false },
            { display: "记录状态", name: "AUDITING_CHECK", Option: business.auditing, readOnly: true, isShow: false },
            { display: "记录状态", name: "AUDITING_ACCEPT", Option: business.auditing, readOnly: true, isShow: false },
            { display: "记录状态", name: "AUDITING_OUTSOURCE", Option: business.auditing, readOnly: true, isShow: false },
            { display: "维修申请单号", name: "APPLY_CODE", readOnly: true, },
            { display: "申请提交时间", name: "APPLY_DATE", readOnly: true, },
            { display: "设备编码", name: "ASSET_ID", Option: business.assetCard, validate: { required: true } },
            { display: "设备编码", name: "ASSET_CODE", Option: business.assetCard, isShow: false },
            { display: "设备名称", name: "ASSET_NAME", readOnly: true },
            { display: "设备类型", name: "TYPE_NAME", readOnly: true, },
            { display: "使用部门", name: "DEPT_NAME", readOnly: true },
            { display: "使用人", name: "CARD_USER", readOnly: true },
            { display: "责任人", name: "PERSON", readOnly: true, },
            { display: "资产编号", name: "ASSETNO", readOnly: true, },
            { display: "型号规格", name: "ASSET_SIZE", readOnly: true, },
            { display: "品牌、厂家", name: "PRODUCE", readOnly: true, },
            { display: "故障发生时间", name: "FAILURE_TIME", validate: { required: true } },
            { display: "故障现象描述", name: "FAILURE_DESCRIBE", validate: { required: true } },
            { display: "申请部门", name: "APPLY_DEPTID", validate: { required: true }, Option: business.corp },
            { display: "申请人", name: "APPLY_USERID", validate: { required: true }, Option: business.user },
            { display: "申请部门", name: "APPLY_DEPT", isShow: false, Option: business.corp },
            { display: "申请人", name: "APPLY_USER", isShow: false, Option: business.user },
            { display: "申请人联系电话", name: "APPLY_TEL" },
            { display: "申请备注", name: "APPLY_MEMO" },
            { display: "REPORT_ID", name: "REPORT_ID", isShow: false },
            { display: "修复状态", name: "REPORT_STATE", isShow: false },
        ];

        //申请信息
        var Info_popup = app.popup.create({
            content: `
                                                                <div class="popup answersheet">
                                                                    <div class="view">
                                                                        <div class="page">
                                                                            <div class="navbar">
                                                                                <div class="navbar-inner" style="background-color:rgb(0,125,255);">
                                                                                    <div class="left link popup-close">
                                                                                        <i class="f7-icons">arrow_left</i>
                                                                                    </div>
                                                                                    <div class="title">维修申请</div>
                                                                                </div>
                                                                            </div>
                                                                            <div class="toolbar tabbar toolbar-top">
                                                                                <div class="toolbar-inner" style="
                                                                                    --f7-tabbar-link-active-border-color: #fff;
                                                                                    --f7-tabbar-link-active-color: black;
                                                                                    --f7-tabbar-link-active-bg-color: white;
                                                                                    --f7-tabbar-link-inactive-color: black;
                                                                                    background-color: rgb(236, 235, 235);
                                                                             ">
                                                                                    <a href="#tab-1" class="tab-link tab-link-active" id="dg_list">申请详情</a>
                                                                                </div>
                                                                            </div>
                                                                            <div class="tabs">
                                                                              <div id="tab-1" class="page-content tab tab-active">
                                                                                <div class="list inline-labels no-hairlines-md">
                                                                                    <form class="list" id="detail_bg"></form>
                                                                                </div>

                                                                              </div>
                                                                            </div>
                                                                            <div class="toolbar toolbar-bottom" id="menu" style="display: none;">
                                                                                <div class="toolbar-inner">
                                                                                    <button class="col button button-large button-fill" id="save" >保存</button>
                                                                                    <button class="col button button-large button-fill" id="sumbit" style="background-color: orange">提交</button>
                                                                                </div>
                                                                            </div>
                                                                        </div>
                                                                    </div>
                                                                </div>`
            ,
            on: {
                open: function () {
                    var me = this;
                    var ID = me.params.REPORT_ID;
                    //保存事件
                    $("#save").off('click').click(function () {
                        let data = app.form.convertToData("#detail_bg");
                        data.REPORT_ID = ID;
                        debugger
                        if (data.ASSET_CODE == null || data.ASSET_CODE == '') {
                            app.dialog.error("请选择设备");
                            return
                        }

                        if (data.FAILURE_TIME == null || data.FAILURE_TIME == '') {
                            app.dialog.error("请选择故障发生时间");
                            return
                        }
                        if (data.FAILURE_DESCRIBE == null || data.FAILURE_DESCRIBE == '') {
                            app.dialog.error("故障现象描述不能为空");
                            return
                        }
                        if (data.APPLY_DEPT == null || data.APPLY_DEPT == '') {
                            app.dialog.error("请选择申请部门");
                            return
                        }
                        if (data.APPLY_USER == null || data.APPLY_USER == '') {
                            app.dialog.error("请选择申请人");
                            return
                        }

                        var AddRow = new Object();
                        if (ID) {
                            data.AUDITING_APPLY = "0";
                            data.AUDITING_CHECK = "0";
                            data.AUDITING_ACCEPT = "0";
                            data.AUDITING_OUTSOURCE = "0";
                            AddRow["Updated"] = [data];
                        }
                        else {
                            AddRow["Added"] = [data]
                        }
                        AddRow["Original"] = [formdata];

                        app.ajax({
                            type: 'post',
                            data: {
                                "request": AddRow
                            },
                            url: 'Special/AssetReport/Save',
                            success: function (data) {
                                Info_popup.close();
                                business.getData();
                            }
                        });
                    });
                    //提交事件
                    $("#sumbit").off('click').click(function () {
                        let data = app.form.convertToData("#detail_bg");
                        data.REPORT_ID = ID;

                        if (data.AUDITING_APPLY == "1") {
                            app.dialog.error("该单据已经提交！");
                            return false
                        }

                        data.AUDITING_APPLY = "1";
                        data.AUDITING_CHECK = "0";
                        data.AUDITING_ACCEPT = "0";
                        data.AUDITING_OUTSOURCE = "0";

                        var AddRow = new Object();
                        if (ID) {
                            AddRow["Updated"] = [data];
                        }
                        else {
                            AddRow["Added"] = [data]
                        }
                        AddRow["Original"] = [formdata];

                        app.dialog.confirm('确定要提交？', '提交', function () {
                            app.ajax({
                                type: 'post',
                                data: {
                                    "request": AddRow
                                },
                                url: 'Special/AssetReport/Save',
                                success: function () {
                                    Info_popup.close();
                                    business.getData();
                                }
                            });
                        });
                    });

                    if (ID) {
                        app.ajax({
                            type: 'post',
                            data: {
                                "id": ID
                            },
                            url: 'Special/AssetReport/Get',
                            success: function (data) {
                                var str = "";
                                str = app.CreatePopupContentHtml(outAppInfo);
                                $("#detail_bg").html(str);

                                formdata = data;
                                me.detail = data;
                                
                                app.form.fillFromData('#detail_bg', me.detail);
                                showBtn(data.AUDITING_APPLY == "0");

                                if (data.AUDITING_APPLY == "1") {
                                    app.smartSelect.create({
                                        el: '.ASSET_ID',
                                        searchbar: true,
                                        on: {
                                            beforeOpen: function (smartSelect, prevent) {
                                                prevent();
                                            }
                                        }
                                    });
                                    app.smartSelect.create({
                                        el: '.APPLY_DEPTID',
                                        searchbar: true,
                                        on: {
                                            beforeOpen: function (smartSelect, prevent) {
                                                prevent();
                                            }
                                        }
                                    });
                                    app.smartSelect.create({
                                        el: '.APPLY_USERID',
                                        searchbar: true,
                                        on: {
                                            beforeOpen: function (smartSelect, prevent) {
                                                prevent();
                                            }
                                        }
                                    });
                                    $('#detail_bg').find('input').attr('readonly', true);
                                    
                                } else {
                                    app.calendar.create({
                                        inputEl: '#FAILURE_TIME',
                                        timePicker: true,
                                        dateFormat: { month: 'numeric', day: 'numeric', year: 'numeric', hour: 'numeric', minute: 'numeric' },
                                    })
                                    app.smartSelect.create({
                                        el: '.ASSET_ID',
                                        searchbar: true
                                    });
                                    app.smartSelect.create({
                                        el: '.APPLY_DEPTID',
                                        searchbar: true
                                    });
                                    app.smartSelect.create({
                                        el: '.APPLY_USERID',
                                        searchbar: true
                                    });
                                }
                            }
                        });

                        //明细数据
                        $("#sumbit").show();
                    }
                    else {
                        //新增清空数据
                        $("#detail_bg").html(app.CreatePopupContentHtml(outAppInfo));

                        $("#ASSET_ID").on("change", function (x, c, a) {
                            //开始赋值
                            let id = $("#ASSET_ID").val();
                            let data = business.assetCard.find(x => x.ID == $("#ASSET_ID").val());

                            $('#ASSET_CODE').val(data.TEXT ?? '');
                            $('#ASSET_NAME').val(data.VALUE ?? '');
                            $('#ASSETNO').val(data.EXTEND ?? '');
                            $('#TYPE_NAME').val(data.EXTEND1 ?? '');
                            $('#DEPT_NAME').val(data.EXTEND2 ?? '');
                            $('#CARD_USER').val(data.EXTEND3 ?? '');
                            $('#PERSON').val(data.EXTEND4 ?? '');
                            $('#ASSET_SIZE').val(data.EXTEND5 ?? '');
                            $('#PRODUCE').val(data.EXTEND6 ?? '');
                        })

                        $("#APPLY_DEPTID").on("change", function (x, c, a) {
                            //开始赋值
                            let id = $("#APPLY_DEPTID").val();
                            let data = business.corp.find(x => x.ID == $("#APPLY_DEPTID").val());

                            $('#APPLY_DEPT').val(data.TEXT ?? '');
                        })

                        $("#APPLY_USERID").on("change", function (x, c, a) {
                            //开始赋值
                            let id = $("#APPLY_USERID").val();
                            let data = business.user.find(x => x.ID == $("#APPLY_USERID").val());

                            $('#APPLY_USER').val(data.TEXT ?? '');
                        })
                        app.calendar.create({
                            inputEl: '#FAILURE_TIME',
                            timePicker: true,
                            dateFormat: { month: 'numeric', day: 'numeric', year: 'numeric', hour: 'numeric', minute: 'numeric' },
                        })
                        /* app.form.fillFromData('#detail_bg');*/
                        $("#sumbit").hide();
                        $("#menu").show();
                    }
                }
            }
        });

        function popupOpen(id) {
            Info_popup.params = { "REPORT_ID": id };
            Info_popup.open();
            $("#popup-close").click(function () {
                Info_popup.close();
            });
        }
        //按钮
        function showBtn(isEdit) {
            if (isEdit) {
                $("#menu").show();
                $("#dg_list").click(function () {
                    $("#menu").show();
                })
            } else {
                $("#menu").hide();
                $("#dg_list").click(function () {
                    $("#menu").hide();
                })
            }
        }

    </script>
</body>

</html>
