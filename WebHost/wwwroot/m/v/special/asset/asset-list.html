<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, minimal-ui, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2196f3">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>IT设备台账</title>
    <link rel="stylesheet" href="../../dist/Framework7/mobile.css?v=1" />
</head>

<body class="color-theme-blue">
    <div id="app">
        <div class="statusbar">
        </div>
        <!-- Your main view, should have "view-main" class -->
        <div class="view view-main">
            <div class="page" data-name="home">
                <div class="navbar">
                    <div class="navbar-bg"></div>
                    <div class="navbar-inner sliding">
                        <div class="title">IT设备台账</div>

                        <div class="subnavbar">
                            <form class="searchbar" id="searchbar-autocomplete">
                                <div class="searchbar-inner">
                                    <div class="searchbar-input-wrap">
                                        <input type="search" id="searchText" />
                                        <i class="searchbar-icon"></i>
                                        <span class="input-clear-button"></span>
                                    </div>
                                    <span class="searchbar-disable-button">Cancel</span>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="list page-content" style="padding-top: 80px; padding-bottom: 80px">
                    <ul id="main_list">
                    </ul>
                </div>

                <div class="toolbar toolbar-bottom-md">
                    <div class="toolbar-inner">
                        <a href='javascript:app.methods.toUrl("back")' class="link external">
                            <i class="f7-icons">arrow_left</i>
                            <span class="ios-only">返回</span>
                        </a>
                        <button class="button" id="refresh">
                            刷新
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="text/javascript" src="../../../dist/Framework7/mobile.js?v=1"></script>
    <script type="text/javascript" src="http://res.wx.qq.com/open/js/jweixin-1.4.0.js"></script>
    <script type="text/javascript" src="../../../dist/Framework7/app.js?v=1"></script>
    <script src="https://cdn.staticfile.org/jquery/1.10.2/jquery.min.js"></script>
    <script type="text/javascript" id="scriptBlock">
        'use strict';
        var business = {
            auditing: new Map(),
            user: new Map(),
            list: [],
            loadComboxData: function () {
                var me = this;
                app.ajax({
                    async: false,
                    type: 'post',
                    url: 'Special/AssetCard/Comboxdata',
                    success: function (data) {
                        debugger
                        for (let it of data.Auditing) {
                            me.auditing.set(it.ID, it.TEXT);
                        }
                        for (let it of data.User) {
                            me.user.set(it.ID, it.TEXT);
                        }
                    },
                    error: function (message) {
                        app.dialog.error(message, function () { });
                    }
                });
            },
            loadData: function () {
                var me = this;
                app.ajax({
                    async: false,
                    type: 'post',
                    url: 'Special/AssetCard/List',
                    success: function (data) {
                        me.list = data.Rows;
                        var str = '';
                        for (var i = 0; i < me.list.length; i++) {
                            var sid = me.list[i].ASSET_ID;

                            str += `
                                            <li id="list-` + sid + `">
                                                <a href="#" class="item-link item-content">
                                                    <div class="item-inner item-cell">
                                                        <div class="item-row">
                                                            <div class="item-cell">
                                                                <div class="row no-gap">
                                                                    <div class="col-25" style="color: rgb(192,192,192)">记录状态</div>`
                                                                    + ((me.list[i].AUDITING == 0) ?
                                                                    (`<div class="col-65" style="color: RGB(192,72,81); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">` + (me.auditing.get(me.list[i].AUDITING) ?? '') + `</div>`)
                                                                    : (`<div class="col-65" style="color: RGB(65,174,60); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">` + (me.auditing.get(me.list[i].AUDITING) ?? '') + `</div>`))
                                                                    +
                                                                    `<div class="col-10"></div>
                                                                </div>
                                                                <div class="row no-gap">
                                                                    <div class="col-25" style="color: rgb(192,192,192)">资产名称</div>
                                                                    <div class="col-65" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">` + (me.list[i].ASSET_NAME ?? '') + `</div>
                                                                    <div class="col-10"></div>
                                                                </div>
                                                                <div class="row no-gap">
                                                                    <div class="col-25" style="color: rgb(192,192,192)">资产编号</div>
                                                                    <div class="col-65" style="white-space: nowrap;overflow: hidden;text-overflow:ellipsis;">` + (me.list[i].ASSETNO ?? '') + `</div>
                                                                    <div class="col-10"></div>
                                                                </div>
                                                                <div class="row no-gap">
                                                                    <div class="col-25" style="color: rgb(192,192,192)">设备类型</div>
                                                                    <div class="col-65" style="white-space: nowrap;overflow: hidden;text-overflow:ellipsis;">` + (me.list[i].TYPE_NAME ?? '') + `</div>
                                                                    <div class="col-10"></div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </a>
                                            </li>`;
                        }

                        $("#main_list").html(str);
                        data.Rows.forEach((row) => {
                            $("#list-" + row.ASSET_ID).click(function () {
                                var param = { sid: row.ASSET_ID }
                                app.methods.toUrl('/AssetDet/' + JSON2.stringify(param))
                            })
                        })
                    },
                    error: function (message, data) {
                        app.dialog.error(message, function () { });
                        return;
                    }
                });
            },
            init: function () {
                debugger;
                var me = this;
                me.initDetailRoute();
                me.loadComboxData();
                me.loadData();
                me.initSearchbar();
                me.initFreshButton();
            },

            initFreshButton: function () {
                var me = this;
                //刷新按钮
                $('#refresh').on('click', function (e) {
                    me.loadData();
                    me.initSearchbar();
                })
            },
            initSearchbar: function () {
                app.searchbar.create({
                    el: '.searchbar',
                    searchContainer: '.list',
                    searchIn: ['.item-inner'],
                    on: {
                        search: function (sb, query, previousQuery) {
                            console.log(query, previousQuery);
                        }
                    }
                })
            },
            initDetailRoute: function () {
                var detailRoute = {
                    title: "台账明细",
                    name: "AssetDet",
                    path: "/AssetDet/:params",
                    url: "./m/v/special/asset/asset-list-detail.html"
                }
                app.routes.push(detailRoute);
            }
        };
        business.init();
    </script>
</body>

</html>
