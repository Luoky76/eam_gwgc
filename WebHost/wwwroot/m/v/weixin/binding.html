<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2196f3">
    <title>微信绑定</title>
    <link rel="stylesheet" href="../../dist/Framework7/mobile.css?v=1" />
</head>

<body>
    <div id="app">
        <div class="view view-main">
            <div class="page" data-name="weixin-binding">
                <div class="toolbar toolbar-bottom-md">
                    <div class="toolbar-inner">
                        <a href='javascript:app.methods.toUrl("back")' class="link external">
                            <i class="f7-icons">arrow_left</i>
                            <span class="ios-only">返回</span>
                        </a>
                        <a href='javascript:app.methods.toUrl("/")' class="link external">
                            <i class="f7-icons">home</i>
                            <span class="ios-only">主页</span>
                        </a>
                    </div>
                </div>
                <div class="page-content login-screen-content">
                    <div class="login-screen-title">用户绑定</div>
                    <form id="my-form">
                        <div class="list no-hairlines-md">
                            <ul>
                                <li class="item-content item-input">
                                    <div class="item-media">
                                        <i class="f7-icons">compose</i>
                                    </div>
                                    <div class="item-inner">
                                        <div class="item-title item-floating-label">账号</div>
                                        <div class="item-input-wrap">
                                            <input type="text" id="username" name="username" class="upper" required
                                                   validate trim>
                                            <span class="input-clear-button"></span>
                                        </div>
                                    </div>
                                </li>
                                <li class="item-content item-input">
                                    <div class="item-media">
                                        <i class="f7-icons">compose</i>
                                    </div>
                                    <div class="item-inner">
                                        <div class="item-title item-floating-label">密码</div>
                                        <div class="item-input-wrap">
                                            <input type="password" id="password" name="password" required validate trim>
                                            <span class="input-clear-button"></span>
                                        </div>
                                    </div>
                                </li>
                            </ul>
                        </div>
                    </form>
                    <div class="block">
                        <p class="row">
                            <button id="bind" name="bind" type="button"
                                    class="col button button-raised button-fill">
                                绑定
                            </button>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="text/javascript" src="../../dist/Framework7/mobile.js?v=1"></script>
    <script type="text/javascript" src="../../dist/Framework7/app.js?v=1"></script>
    <script id="scriptBlock" type="text/javascript">
        'use strict';
        var business = {
            openid: "",
            submit: function () {
                var me = this;
                var form = me.form;
                if (!app.methods.validateInputs(form)) {
                    return;
                }
                var formData = app.form.convertToData(form);
                formData.username = encrypt(formData.username);
                formData.password = encrypt(formData.password);
                formData.verifycode = me.openid;
                app.ajax({
                    noGlobal: true,
                    url: 'weixin/bind',
                    data: formData,
                    success: function () {
                        app.dialog.alert("绑定成功", function () {
                            me.exit();
                        });
                    }
                });
            },
            exit: function () {
                app.ajax({
                    url: 'auth/exit',
                    headers: {
                        ticket: window.ticket
                    },
                    success: function () {
                        ticket = null;
                        session = null;
                        app.methods.toUrl("/");
                    }
                });
            },
            unBinding: function () {
                var me = this;
                app.ajax({
                    noGlobal: true,
                    url: 'weixin/unbind',
                    data: { openid: me.openid },
                    success: function () {
                        app.dialog.alert("解绑成功", function () {
                            me.exit();
                        });
                    }
                });
            },
            bindingStaus: function () {
                var me = this;
                app.ajax({
                    noGlobal: true,
                    url: 'weixin/bindingStaus',
                    data: { openid: me.openid },
                    success: function (data, message) {
                        if (data === "1") {
                            app.dialog.confirm('您已经绑定账号' + message + ',是否解绑?', function () {
                                me.unBinding();
                            });
                        }
                    }
                });
            },
            eventBind: function () {
                var me = this;
                $$(".page-current #bind").off("click").click(function () {
                    me.submit();
                });
            },
            init: function () {
                var me = this;
                me.eventBind();
                me.form = $$(".page-current #my-form");
                app.methods.getOpenID(function (openid) {
                    me.openid = openid;
                });
                app.form.fillFromData(me.form, {});
                me.bindingStaus();
            }
        };
        business.init();
    </script>
</body>
</html>
