<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>单点跳转</title>
</head>

<body>
    <script type="text/javascript">
        'use strict';
        var business = {
            getQueryStringByName: function (name) {
                var result = location.search.match(new RegExp("[\?\&]" + name + "=([^\&]+)", "i"));
                if (result == null || result.length < 1) {
                    return "";
                }
                return decodeURIComponent(result[1]);
            },
            success: function (data) {
                var me = this;
                window.localStorage.setItem("GksybTicket", data.Ticket);
                delete data.Ticket;
                window.localStorage.setItem("GksybData", JSON.stringify(data));

                var fromUrl = me.getQueryStringByName("FromUrl");
                if (((fromUrl || "").toLowerCase().indexOf("http") >= 0) && (fromUrl.indexOf(location.host) < 0)) fromUrl = "";
                fromUrl = fromUrl || "../index.html";
                location.replace(fromUrl);
            },
            error: function (xhr, msg) {
                msg = (xhr.status || "") + " " + (xhr.statusText || "") + " " + msg;
                alert(msg);
            },
            init: function () {
                var me = this;
                var code = me.getQueryStringByName("code");
                if (code) {
                    var url = location.href.replace(location.pathname.substring(location.pathname.lastIndexOf("/") + 1), '../../../weixin/oauth');
                    var xhr = new XMLHttpRequest();
                    xhr.open("POST", url, false);
                    xhr.setRequestHeader('Content-Type', 'application/json');
                    xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
                    xhr.setRequestHeader('code', code);
                    xhr.onload = function onload() {
                        var errorMsg;
                        if (xhr.status === 200) {
                            var responseData;
                            try {
                                responseData = JSON.parse(xhr.responseText);
                            } catch (err) {
                                errorMsg = "parseerror";
                            }
                            if (!errorMsg) {
                                if (!responseData.IsError) {
                                    me.success(responseData.Data);
                                    return;
                                }
                                var data = { Openid: responseData.Data };
                                window.localStorage.setItem("GksybData", JSON.stringify(data));
                                errorMsg = responseData.Message;
                                if (errorMsg === "-1") {
                                    location.replace("binding.html");
                                    return;
                                }
                            }
                        }
                        me.error(xhr, errorMsg);
                    };
                    xhr.onerror = function onerror() {
                        me.error(xhr);
                    };
                    xhr.ontimeout = function () {
                        me.error(xhr, "timeout");
                    };
                    xhr.send();
                }
            }
        };
        business.init();
    </script>
</body>
</html>
