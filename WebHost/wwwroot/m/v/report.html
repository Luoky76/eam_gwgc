<template>
    <div class="page" data-name="common-report">
        <div class="navbar">
            <div class="navbar-bg"></div>
            <div class="navbar-inner">
                <div class="left">
                    <a href='javascript:app.methods.toUrl("back")' class="link external">
                        <i class="f7-icons">arrow_left</i>
                        <span class="ios-only">返回</span>
                    </a>
                </div>
                <div class="title">统计报表</div>
                <div class="right">
                    <a href='javascript:app.methods.toUrl("/")' class="link external">
                        <i class="f7-icons">home</i>
                        <span class="ios-only">主页</span>
                    </a>
                </div>
            </div>
        </div>
        <div class="page-content common-virtual-list">
            <div class="searchbar-wrap display-none">
                <form data-search-container="#report-list" class="searchbar searchbar-init">
                    <div class="searchbar-inner">
                        <div class="searchbar-input-wrap">
                            <input type="search" placeholder="请输入关键字查找" />
                            <i class="searchbar-icon"></i>
                            <span class="input-clear-button"></span>
                        </div>
                        <span class="searchbar-disable-button">取消</span>
                    </div>
                </form>
            </div>
            <div>
                <form id="search-form">
                </form>
                <div id="report-list" class="list no-hairlines virtual-list margin-top-half media-list chevron-center"></div>
            </div>
        </div>
    </div>
</template>
<script>
    'use strict';
    var business = {
        page: null,
        data: [],
        setData: function (data) {
            var me = this, page = me.page.$el, form = page.find("#search-form");
            page.find(".searchbar-wrap").removeClass("display-none");
            var $el = page.find("#report-list");
            $el.parent().addClass("content-wrapper");
            app.virtualList.destroy($el);
            app.virtualList.create({
                el: $el,
                items: data,
                height: me.searchForm.options.itemHeight || (me.fields.length * 48 + 2),
                searchAll: function (query, items) {
                    var found = [];
                    query = (query || "").toLowerCase();
                    for (var i = 0, l = items.length; i < l; i++) {
                        var item = items[i];
                        if (item._info.indexOf(query) >= 0 || query.trim() === '') found.push(i);
                    }
                    return found;
                },
                renderItem: function (item) {
                    if (me.renderItem) return me.renderItem(item);
                    var htmls = [];
                    htmls.push('<li><div class="card card-outline"><div class="card-content list simple-list"><ul class="no-padding">');
                    for (var i = 0, l = me.fields.length; i < l; i++) {
                        var field = me.fields[i];
                        htmls.push('<li><div class="title">' + field.Key + '</div><div class="content">' + item[field.Key] + '</div></li>');
                    }
                    htmls.push('</ul></div></li>');
                    return htmls.join('');
                }
            });
        },
        search: function () {
            var me = this;
            if (!me.searchForm.valid()) {
                me.searchForm.showInvalid();
                return;
            }
            var data = me.searchForm.getData();
            me.loadData(data);
        },
        loadData: function (formData) {
            var me = this;
            app.ajax({
                url: 'common/jsonvalue',
                data: {
                    ViewName: me.view,
                    Param: formData
                },
                success: function (data) {
                    data = data || [];
                    for (var i = 0, l = data.length; i < l; i++) {
                        var item = data[i];
                        item._index = i;
                        var infos = [];
                        for (var j = 0, l2 = me.fields.length; j < l2; j++) {
                            var field = me.fields[j];
                            infos.push(castString(item[field.Key]).toLowerCase());
                        }
                        item._info = infos.join("@#");
                    }
                    me.data = data;
                    me.setData(data);
                }
            });
        },
        loadConfig: function () {
            var me = this, page = me.page.$el, form = page.find("#search-form");
            app.ajax({
                async: false,
                url: 'common/queryconfig',
                data: { viewName: me.view },
                success: function (data) {
                    if (data.GRID) {
                        me.renderItem = new Function("item", "return `" + data.GRID + "`;");
                    }
                    me.itemTemplate = data.GRID || "";
                    var fields = data.Fields || [];
                    for (var i = fields.length - 1; i >= 0; i--) {
                        var item = fields[i];
                        if (item.Key.indexOf("隐藏") >= 0) fields.splice(i, 1);
                    }
                    me.fields = fields;
                    if (!data.FORM) {
                        me.loadData({});
                        return;
                    }
                    window._displayOptions = {};
                    try {
                        eval("window.__eval = function(){var formsearch = null;window._displayOptions = " + (data.FORM || "{}") + ";};window.__eval();delete window.__eval;");
                        window._displayOptions = Framework7.utils.extend({
                            el: form,
                            validate: true,
                            SearchClick: false,
                            buttons: [
                                {
                                    text: '查询', type: "primary", icon: "f7-icons search", click: function () {
                                        me.search();
                                    }
                                }
                            ],
                            onAfterSetFields: function (g) {
                                me.searchForm = g;
                            }
                        }, window._displayOptions);
                    }
                    catch (e) {
                        console.log(JSON.stringify(e));
                        return;
                    }
                    me.searchForm = app.mform.create(window._displayOptions);
                    delete window._displayOptions;
                }
            });
        },
        bindEvent: function () {
            var me = this, page = me.page.$el;
        },
        destroy: function () {
            var me = this, page = me.page.$el;
        },
        init: function (page, ctx) {
            var me = this;
            me.page = page;
            me.ctx = ctx;
            var pageParm = app.utils.parseUrlQuery(ctx.$f7route.route.componentUrl);
            me.view = getQueryStringByName("v") || pageParm.v || (page.router.currentRoute.params || {}).view || ctx.$f7route.name;
            if (!me.view) {
                app.dialog.error("请传递参数");
                return;
            }
            me.bindEvent();
            me.loadConfig();
        }
    };
    return function (props, ctx) {
        ctx.$on('pageInit', function (_e, page) {
            business.init(page, ctx);
        });
        ctx.$on('pageAfterOut', function (_e, page) {
            business.destroy();
        });
        return $render;
    };
</script>
