<style>
    .page-content iframe {
        width: 100%;
        height: 100%;
        border: none;
    }
</style>
<template>
    <div class="page" data-name="IframeContainer">
        ${hasNavbar && $h`
        <div class="navbar">
            <div class="navbar-bg"></div>
            <div class="navbar-inner sliding">
                <div class="left">
                    <a @click=${toBack} class="link external">
                        <i class="icon icon-back"></i>
                        <span class="ios-only">Back</span>
                    </a>
                </div>
                <div class="title">${title}</div>
            </div>
        </div>
        `}
        <div class="page-content">
            <iframe name="main-frame" frameborder=0 src="${url}"></iframe>
        </div>
    </div>
</template>
<script>
    'use strict';
    return function (props, ctx) {
        var url = props.url, title = props.title || document.title;
        var hasNavbar = props.backType !== "2";
        //返回键
        var toBack = function () {
            if (props.backType === "1") {
                app.methods.toUrl("/");
                return;
            }
            window.history.back();
        };
        return $render;
    };
</script>
