<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title></title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <div id="mainsearch" style="width: 98%">
        <form action="" id="formsearch" class="l-form">
        </form>
    </div>
    <form action="" id="mainform">
        <div id="maingrid">
        </div>
    </form>
    <script type="text/javascript">
        'use strict';
        var business = {

            formLabelWidth: 120,
            formInputWidth: 180,
            getTextareaWidth: function () {
                var me = this;
                var fieldWidth = me.formLabelWidth + me.formInputWidth + 3;
                return Math.floor(($("#mainform").width() - 10) / fieldWidth) * fieldWidth - (me.formLabelWidth + 3);
            },
rootPath:'Material/BasePurtype/',
            MenuNo: getQueryStringByName("MenuNo"),
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            { display: "采购分类编码", name: "_search_PURTYPE_CODE", dbname: "PURTYPE_CODE", newline: false, upper: true, type: "text", options: {} },
                            { display: "采购分类名称", name: "_search_PURTYPE_NAME", dbname: "PURTYPE_NAME", newline: false, upper: true, type: "text", options: {} },
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "采购分类编码", name: "PURTYPE_CODE", width: 150, type: "text", validate: { required: true }, editor: { type: 'text' } },
                            { display: "采购分类名称", name: "PURTYPE_NAME", width: 150, type: "text", validate: { required: true }, editor: { type: 'text' } },
                            { display: "备注", name: "MEMO", width: 120, type: "text", editor: { type: 'text' } },
                            { display: "主键", name: "PURTYPE_ID", dbname: "PURTYPE_ID", width: 100, type: "text", hide: true },
                        ]
                    }
                };
            },
            grid: null,
            searchForm: null,
            buttons: null,
            loadComboxData: function () {
                var me = this;
            },
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    autoWidth: true,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    usePager: false,
                    dataAction: 'server',
                    toolbar: {},
                    url: me.rootPath + 'List',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: 'CREATEDATE',
                    sortOrder: 'DESC',
                    width: '98%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: true,
                    clickToEdit: true,
                    onBeforeEdit: function (editParm) {
                        switch (editParm.column.name) {
                            case "":
                                if (editParm.record.__status == "add") return true;
                                else return false;
                                break;
                        }
                    },
                    onSuccess: function (data, g) {
                        if (data && data.Rows) {
                            var rows = data.Rows || [];
                            for (var i = 0, len = rows.length; i < len; i++) {
                                var row = rows[i];
                                row.OLDROLEID = row.ROLEID;
                            }
                        }
                    },
                    rowAttrRender: function (rowdata, rowid) {
                        return "";
                    }
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "add":
                            me.add();
                            break;
                        case "delete":
                            me.delete();
                            break;
                        case "save":
                            me.save();
                            break;
                        case "Excel":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=xls", window.gksybConfigs.urlBase), modal: true });
                            break;
                        case "Pdf":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=pdf", window.gksybConfigs.urlBase), modal: true });
                            break;
                    }
                }
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            add: function () { //新增
                var me = this;
                me.grid.addEditRow({}, true);
            },
            save: function () { //保存
                var me = this;
                if (me.grid.endEdit() != false) {
                    if (!me.grid.isDataChanged) {
                        LG.showSuccess('无修改');
                        return;
                    }
                    if (!me.grid.validChangeRows()) return false;
                    var changeRow = me.grid.getChangedRows();
                    LG.ajax({
                        jsToken: true,
                        url: me.rootPath + 'Save',
                        loading: '正在保存中...',
                        data: changeRow,
                        success: function () {
                            LG.showSuccess('保存成功');
                            me.grid.isDataChanged = false;
                            me.reload();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }

            },
            reload: function () { //刷新
                var me = this;
                me.buttons[0].click();
            },
            delete: function () { //删除
                var me = this;
                if (me.grid.endEdit() != false) {
                    var selected = me.grid.getSelectedRows();
                    if (selected.length > 0) {
                        $.ligerDialog.confirm('确定删除吗?', function (confirm) {
                            if (confirm) {
                                for (var i = 0, len = selected.length; i < len; i++) {
                                    me.grid.deleteRow(selected[i]);
                                }
                                me.save();
                            }
                        });
                    } else {
                        LG.tip('请选择行!');
                    }
                }
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Pdf',
                        text: '导出Pdf',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-pdf-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch = $("#formsearch")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    labelWidth: me.formLabelWidth,
                    inputWidth: me.formInputWidth,
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                    }
                });
            },
            init: function () {
                var me = this;
                me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.setGrid();
                me.reload();
                return me;
            }
        };
        business.init();
    </script>
</body>
</html>
