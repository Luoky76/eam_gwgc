<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title></title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <div id="mainsearch">
        <form action="" id="formsearch" class="l-form">
        </form>
    </div>
    <form action="" id="mainform">
        <div id="maingrid">
        </div>
    </form>
    <script type="text/javascript">
        'use strict';
        var business = {
            detailWidth: window.innerWidth * 0.9,
            detailHeight: window.innerHeight * 0.9,
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            {
                                display: "通用搜索", name: "_search_all", hideLabel: true,
                                filter: [
                                    { op: "like", field: "APPLY_CODE", type: "string" },
                                    { op: "like", field: "EDIT_USER", type: "string" },
                                    { op: "like", field: "DEPT_NAME", type: "string" },
                                    { op: "like", field: "SEC_DEPT", type: "string" }
                                ],
                                options: {
                                    onEnter: function () {
                                        var me = this;
                                        var $formsearch = $("#formsearch");
                                        LG.commonSearch($formsearch, me.grid);
                                    }.bind(me)
                                }
                            },
                            {
                                display: "记录状态", name: "_search_AUDITING", dbname: "AUDITING", newline: false, type: "select",
                                options: { type: "select", data: me.dataCheck }
                            }
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "已提交", name: "AUDITING", width: 100, type: "chk" },
                            { display: "申请单号", name: "APPLY_CODE", width: 180, type: "string" },
                            { display: "申请人", name: "EDIT_USER", width: 100, type: "string" },
                            { display: "申请日期", name: "APPLY_DATE", width: 150, type: "date", showTime: true, format: "yyyy-MM-dd hh:mm" },
                            { display: "申请部门", name: "DEPT_NAME", width: 150, type: "string" },
                            { display: "二级单位", name: "SEC_DEPT", width: 150, type: "string" },
                            { display: "备注", name: "MEMO", width: 120, type: "string" },
                            { display: "主键", name: "APPLY_ID", dbname: "APPLY_ID", width: 100, type: "string", hide: true },
                        ]
                    }
                };
            },
            menuNo: getQueryStringByName("MenuNo"),
            dataCheck: [{ "ID": "0", "TEXT": "未提交" }, { "ID": "1", "TEXT": "已提交" }],
            grid: null,
            searchForm: null,
            buttons: null,
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    autoWidth: true,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    usePager: false,
                    toolbar: {},
                    url: 'Material/SpareApply/List',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: 'APPLY_DATE',
                    sortOrder: 'DESC',
                    width: '98%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: true,
                    clickToEdit: true,
                    onDblClickRow: function (rowdata) {
                        me.openDetail({ sid: rowdata.APPLY_ID, isNew: false, isView: true });
                    },
                    onSuccess: function (data, g) {
                    },
                    rowAttrRender: function (rowdata, rowid) {
                        return "";
                    }
                });
                me.grid.isValid = true;
                me.grid.toolbarManager.options.group = 'main';
                me.loadToolbar();
                me.bindGridEvent();
            },
            isSelectRow: function () {
                var me = this;
                var rows = me.grid.getSelectedRows();
                if (rows.length == 0) {
                    LG.tip("请选择一行");
                    return false;
                }
                return true;
            },
            isSelectSingleRow: function () {
                var me = this;
                var rows = me.grid.getSelectedRows();
                if (rows.length > 1) {
                    LG.tip("不能选择多行");
                    return false;
                } else if (rows.length == 0) {
                    LG.tip("请选择一行");
                    return false;
                }
                return true;
            },
            isAllUnaudited: function ({ msg = "有数据已提交，无法变更！" } = {}) {
                var me = this;
                var selecteds = me.grid.getSelectedRows();
                for (let row of selecteds) {
                    if (row.AUDITING == "1") {
                        if (msg) LG.tip(msg);
                        return false;
                    }
                }
                return true;
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "add":
                            me.openDetail({ isNew: true, isView: false });
                            break;
                        case "delete":
                            if (me.isSelectRow() && me.isAllUnaudited()) {
                                me.delete();
                            }
                            break;
                        case "submit":
                            if (me.isSelectRow()) {
                                me.submit();
                            }
                            break;
                        case "modify":
                            if (me.isSelectSingleRow() && me.isAllUnaudited()) {
                                var row = me.grid.getSelectedRow();
                                me.openDetail({ sid: row.APPLY_ID, isNew: false, isView: false });
                            }
                            break;
                        case "Excel":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=xls", window.gksybConfigs.urlBase), modal: true });
                            break;
                        case "Pdf":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=pdf", window.gksybConfigs.urlBase), modal: true });
                            break;
                    }
                }
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            openDetail: function ({ sid, isNew = false, isView = true } = {}) {
                var me = this;
                if (!isNew && !sid) {
                    sid = me.grid.getSelectedRow().APPLY_ID;
                }
                $.ligerDialog.open({
                    width: me.detailWidth,
                    height: me.detailHeight,
                    allowClose: true,
                    title: (isNew ? '[新增]' : isView ? '[查看]' : '[修改]') + '物资编码申请',
                    url: "spare_apply_detail.html?MenuNo=" + me.menuNo,
                    isHidden: false,
                    showMax: false,
                    showToggle: false,
                    showMin: false,
                    isResize: true,
                    slide: false,
                    onClosed: me.reload.bind(me),
                    data: { sid: sid, isNew: isNew, isView: isView }
                });
            },
            delete: function () {
                var me = this;
                var rows = me.grid.getSelectedRows();
                if (!rows) return;
                $.ligerDialog.confirm('确定删除吗?', function (confirm) {
                    if (!confirm) return;
                    me.grid.deleteRange(rows);
                    me.save();
                });
            },
            save: function () {
                var me = this;
                if (me.grid.endEdit() === false) return;
                if (!me.grid.isDataChanged) {
                    LG.showSuccess('无修改');
                    return;
                }
                if (!me.grid.validChangeRows()) return false;
                var changeRow = me.grid.getChangedRows();
                LG.ajax({
                    jsToken: true,
                    url: 'Material/SpareApply/Save',
                    loading: '正在保存中...',
                    data: changeRow,
                    success: function () {
                        LG.showSuccess('保存成功');
                        me.grid.isDataChanged = false;
                        me.reload();
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            submit: function () {
                var me = this;
                var selected = me.grid.getSelectedRows();
                var flag = true;
                var sids = [];
                selected.forEach((a) => {
                    if (a.AUDITING == "1") {
                        LG.tip(a.APPLY_CODE + '已提交，无法再次提交!');
                        flag = false;
                        return;
                    }
                    if (a.DETAILCOUNT == 0) {
                        LG.tip(a.APPLY_CODE + '未填写物资明细，无法提交!');
                        flag = false;
                        return;
                    }
                    sids.push(a.APPLY_ID);
                });
                if (!flag) return;

                LG.ajax({
                    jsToken: true,
                    url: 'Material/SpareApply/Submit',
                    loading: '正在提交中...',
                    data: { "sids": sids },
                    success: function () {
                        LG.showSuccess('提交成功');
                        me.grid.isDataChanged = false;
                        me.reload();
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            reload: function () {
                var me = this;
                me.buttons[0].click();
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [
                        { id: 'Excel', text: '导出Excel', icon: "fa fa-file-excel-o", click: function (item) { me.toolbarBtnItemClick(item); } },
                        { line: true },
                        { id: 'Pdf', text: '导出Pdf', icon: "fa fa-file-pdf-o", click: function (item) { me.toolbarBtnItemClick(item); } }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({ top: e.pageY, left: e.pageX });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), { debug: true });
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch = $("#formsearch");
                me.searchForm = $formsearch.ligerForm({
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                    }
                });
            },
            init: function () {
                var me = this;
                me.setConfig();
                me.setForm();
                me.setGrid();
                me.reload();
                window.closeQuery = function (callback) {
                    if (!me.dialog) return callback();
                    return me.dialog.frame.business.closeQuery(callback);
                };
                return me;
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>

</html>
