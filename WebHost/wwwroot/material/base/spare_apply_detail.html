<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title></title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <div id="mainsearch" style="width: 98%">
        <form action="" id="formsearch" class="l-form">
        </form>
    </div>
    <form action="" id="mainform">
        <div id="maingrid">
        </div>
    </form>
    <script type="text/javascript">
        'use strict';
        var business = {

            formLabelWidth: 120,
            formInputWidth: 180,
            getTextareaWidth: function () {
                var me = this;
                var fieldWidth = me.formLabelWidth + me.formInputWidth + 3;
                return Math.floor(($("#mainform").width() - 10) / fieldWidth) * fieldWidth - (me.formLabelWidth + 3);
            },
rootPath:'Material/SpareApply/',
            MenuNo: getQueryStringByName("MenuNo"),
            dialog: null,
            dialogData: null,
            applyId: null,
            BaseSpType: [],
            SpUnit: [],
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            { display: "物料编码", name: "_search_SP_CODE", dbname: "SP_CODE", newline: false, upper: true, type: "text", options: {} },
                            { display: "物料名称", name: "_search_SP_NAME", dbname: "SP_NAME", newline: false, upper: true, type: "text", options: {} },
                            { display: "关联主键", name: "_search_APPLY_ID", dbname: "APPLY_ID", newline: false, type: "hidden" },
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "物料编码", name: "SP_CODE", width: 150, type: "text", editor: { type: "text", }, },
                            { display: "物料名称", name: "SP_NAME", width: 150, type: "text", validate: { required: true }, editor: { type: 'text' } },
                            { display: "型号规格", name: "SP_SIZE", width: 150, type: "text", editor: { type: 'text' } },
                            { display: "品牌、厂家", name: "PRODUCE", width: 150, type: "text", editor: { type: 'text' } },
                            { display: "计量单位", name: "UNIT", width: 150, type: "select", validate: { required: true }, editor: { type: 'select', data: me.SpUnit } },
                            {
                                display: "物料分类", name: "TYPE_ID", width: 150, type: "select", validate: { required: true }, editor: {
                                    type: 'select',
                                    data: me.BaseSpType,
                                    onChange: function (rowdata, rowIndex) {
                                        if (rowdata.selected) {
                                            liger.get("maingrid").updateCell("TYPE_NAME", rowdata.selected.TEXT, rowdata.record);
                                            liger.get("maingrid").updateCell("TYPE_CODE", rowdata.selected.VALUE, rowdata.record);
                                        } else {
                                            liger.get("maingrid").updateCell("TYPE_NAME", "", rowdata.record);
                                            liger.get("maingrid").updateCell("TYPE_CODE", "", rowdata.record);
                                        }
                                    },
                                }
                            },
                            { display: "材质", name: "STUFF", width: 150, type: "text", editor: { type: 'text' } },
                            { display: "是否回收", name: "IS_RECOVERY", dbname: "IS_RECOVERY", width: 90, type: "text", align: "center", formatType: "chk", validate: { required: true }, editor: { type: 'chkStr' } },
                            { display: "图号", name: "DRAWING_NO", width: 150, type: "text", editor: { type: 'text' } },
                            {
                                display: "是否专用件", name: "IS_SPECIAL", dbname: "IS_SPECIAL", width: 100, type: "text", align: "center", formatType: "chk", editor: { type: 'chkStr' }
                            },
                            {
                                display: "是否加工件", name: "IS_WORK", dbname: "IS_WORK", width: 100, type: "text", align: "center", formatType: "chk", editor: { type: 'chkStr' }
                            },
                            {
                                display: "是否标准件", name: "IS_STANDARD", dbname: "IS_STANDARD", width: 100, type: "text", align: "center", formatType: "chk", editor: { type: 'chkStr' }
                            },
                            { display: "备注", name: "MEMO", width: 120, type: "text", editor: { type: 'text' } },
                            { display: "物料分类", name: "TYPE_NAME", width: 100, type: "text", hide: true },
                            { display: "物料分类CODE", name: "TYPE_CODE", width: 100, type: "text", hide: true },
                            { display: "APPLY_ID", name: "APPLY_ID", dbname: "APPLY_ID", width: 100, type: "text", hide: true },
                            { display: "主键", name: "SP_ID", dbname: "SP_ID", width: 100, type: "text", hide: true },
                        ]
                    }
                };
            },
            grid: null,
            searchForm: null,
            buttons: null,
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: me.rootPath + 'ComboxData',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        if (!me.isView) {
                            data.BaseSpType = data.BaseSpType.filter(x => x.FLAG == "0");
                        }
                        me.BaseSpType = data.BaseSpType;
                        me.SpUnit = data.SpUnit;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    autoWidth: true,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    usePager: false,
                    toolbar: { group:"detail" },
                    url: 'Material/SpareApply/DetailList',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: 'ADD_DATE',
                    sortOrder: 'DESC',
                    width: '98%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: !me.isView,
                    clickToEdit: true
                });
                me.grid.isValid = true;
                me.loadToolbar();
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "add":
                            me.add();
                            break;
                        case "delete":
                            me.delete();
                            break;
                        case "save":
                            me.save();
                            break;
                        case "import":
                            me.import();
                            break;
                    }
                }
                if (!me.isView)
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            add: function () { //新增
                var me = this;
                me.grid.addEditRow({ "APPLY_ID": me.applyId, "IS_RECOVERY": "0", "IS_SPECIAL": "0", "IS_WORK": "0", "IS_STANDARD": "0" }, true);
            },
            save: function () { //保存
                var me = this;
                if (me.grid.endEdit() != false) {
                    if (!me.grid.isDataChanged) {
                        LG.showSuccess('无修改');
                        return;
                    }
                    if (!me.grid.validChangeRows()) return false;

                    var dataRow = me.grid.getData();

                    var code = dataRow.map((a) => {
                        return a.SP_CODE;
                    });

                    if (new Set(code).size !== code.length) {
                        LG.showSuccess('物料编码不能重复');
                        return;
                    }

                    var changeRow = me.grid.getChangedRows();
                    LG.ajax({
                        jsToken: true,
                        url: me.rootPath + 'DetailSave',
                        loading: '正在保存中...',
                        data: changeRow,
                        success: function () {
                            LG.showSuccess('保存成功');
                            me.grid.isDataChanged = false;
                            me.reload();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }

            },
            reload: function () { //刷新
                var me = this;
                me.buttons[0].click();
            },
            delete: function () { //删除
                var me = this;
                if (me.grid.endEdit() != false) {
                    var selected = me.grid.getSelectedRows();
                    if (selected.length > 0) {
                        $.ligerDialog.confirm('确定删除吗?', function (confirm) {
                            if (confirm) {
                                for (var i = 0, len = selected.length; i < len; i++) {
                                    me.grid.deleteRow(selected[i]);
                                }
                                me.save();
                            }
                        });
                    } else {
                        LG.tip('请选择行!');
                    }
                }
            },
            import: function () { //导入物资
                var me = this;
                LG.showUpload({
                    title: "导入",
                    server: me.rootPath + "ImportInDetail",
                    mouldFileName: me.rootPath + "ExportExcelHeader",
                    multiple: false,
                    extensions: 'xlsx,xls',
                    mimeTypes: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
                    compress: {
                        width: 1920
                    },
                    showSuccess: false,
                    data: { folder: '../../Adv', "sid": me.applyId },
                    callback: function (status, data) {
                        if (status) {
                            LG.showSuccess("导入成功");
                            me.reload();
                        }
                        else LG.showError(data.Message);
                    }
                });
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch = $("#formsearch")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    labelWidth: me.formLabelWidth,
                    inputWidth: me.formInputWidth,
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                        me.searchForm.setData({ "_search_APPLY_ID": me.applyId });
                    }
                });
            },
            init: function () {
                var me = this;

                me.dialog = frameElement.dialog;
                me.dialogData = me.dialog.get('data');
                me.applyId = me.dialogData.sid;
                me.isView = Boolean(me.dialogData.isView);

                me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.setGrid();
                me.reload();
                return me;
            }
        };
        business.init();
    </script>
</body>
</html>
