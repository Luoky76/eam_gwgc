<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title>物资分类</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 2px; height: 100%;">
    <div id="layout">
        <div position="left" title="物资分类树" id="mainmenu">
            <ul id="maintree" style="margin-top:5px;"></ul>
        </div>
        <div position="center" title="物资分类列表">
            <div id="mainsearch">
                <form action="" id="formsearch" class="l-form">
                </form>
            </div>
            <div id="iframeloading" class='l-loading'>
            </div>
            <form id="mainform">
                <div id="maingrid" style="margin: 2px;"></div>
            </form>
        </div>
    </div>
    <script type="text/javascript">
        'use strict';
        var business = {

            formLabelWidth: 120,
            formInputWidth: 180,
            getTextareaWidth: function () {
                var me = this;
                var fieldWidth = me.formLabelWidth + me.formInputWidth + 3;
                return Math.floor(($("#mainform").width() - 10) / fieldWidth) * fieldWidth - (me.formLabelWidth + 3);
            },
menuNo: getQueryStringByName("MenuNo"),
            ver: getQueryStringByName("ver"),
            iframeloading: $("#iframeloading"),
            tree: null,
            currentNode: null,
            setConfig: function () {
                var me = this;
                BasePurtype: [];
                me.config = {
                    search: {
                        fields: [
                            { display: "物料分类编码", name: "_search_TYPE_CODE", dbname: "TYPE_CODE", width: 200, upper: true, type: "text", options: {} },
                            { display: "物料分类名称", name: "_search_TYPE_NAME", dbname: "TYPE_NAME", width: 200, type: "text", options: {} },
                            { display: "采购分类", name: "_search_PURTYPE_ID", dbname: "PURTYPE_ID", width: 200, type: "select", options: { type: "select", data: me.BasePurtype } },
                            { display: "上一节点id", name: "_search_PRE_TYPEID", dbname: "PRE_TYPEID", op: "equal", type: "hidden", options: {} },
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "物料分类编码", name: "TYPE_CODE", validate: { required: true }, minWidth: 200, type: "text", editor: { type: 'text' } },
                            { display: "物料分类名称", name: "TYPE_NAME", validate: { required: true }, minWidth: 200, type: "text", editor: { type: 'text' } },
                            //{ display: "分类级别", name: "TYPE_LEVEL", minWidth: 200, type: "text", editor: { type: 'text' } },
                            {
                                display: "采购分类", name: "PURTYPE_ID", validate: { required: true }, minWidth: 200, type: "select",
                                editor: {
                                    type: 'select',
                                    data: me.BasePurtype,
                                    onChange: function (rowdata, rowIndex) {
                                        if (rowdata.selected) {
                                            liger.get("maingrid").updateCell("PURTYPE_NAME", rowdata.selected.TEXT, rowdata.record);
                                        } else {
                                            liger.get("maingrid").updateCell("PURTYPE_NAME", "", rowdata.record);
                                        }
                                    },
                                }
                            },
                            {
                                display: "上级节点", name: "PRE_TYPEID", dbname: "PRE_TYPEID", minWidth: 200, type: "select", editor: { type: 'select', data: me.SpTypeName },
                            },
                            {
                                display: "是否注销", name: "IS_CANCEL", dbname: "IS_CANCEL", minWidth: 50, type: "text", align: "center", formatType: "chk", editor: { type: 'chkStr' }
                            },
                            { display: "失效日期", name: "NOVALID_DATE", minWidth: 200, type: "date", editor: { type: 'date', showTime: true, format: "yyyy-MM-dd hh:mm" } },
                            { display: "备注", name: "MEMO", minWidth: 300, type: "text", editor: { type: 'text' } },
                            //隐藏
                            { display: "主键", name: "TYPE_ID", minWidth: 100, type: "text", hide: true },
                            { display: "添加人ID", name: "CREATE_USERID", minWidth: 100, type: "text", hide: true },
                            { display: "添加时间", name: "CREATEDATE", minWidth: 100, type: "date", hide: true },
                            { display: "修改人ID", name: "MODIFY_USERID", minWidth: 100, type: "text", hide: true },
                            { display: "修改时间", name: "MODIFYDATE", minWidth: 100, type: "date", hide: true },
                            { display: "采购分类", name: "PURTYPE_NAME", minWidth: 100, type: "text", hide: true },
                            { display: "编制人", name: "EDIT_USER", minWidth: 100, type: "text", hide: true },
                            { display: "编制日期", name: "EDIT_DATE", minWidth: 100, type: "date", hide: true },

                        ]
                    }
                };
            },
            grid: null,
            loadComboxData: function () {
                var me = this;
                var dataControl = [];
                LG.ajax({
                    async: false,
                    url: 'Material/BaseSptype/ComboxData',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        me.BasePurtype = data.BasePurtype
                        me.SpTypeName = data.SpTypeName

                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
                return dataControl;
            },
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    dateFormat: "yyyy-MM-dd hh:mm",
                    autoWidth: true,
                    delayLoad: true,
                    usePager: false,
                    columns: me.config.grid.columns,
                    //dataAction: 'server',
                    toolbar: {},
                    url: 'Material/BaseSptype/list',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: 'TYPE_CODE',
                    sortOrder: 'asc',
                    width: '99%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: true,
                    clickToEdit: true,
                    onBeforeEdit: function (editParm) {
                        switch (editParm.column.name) {
                            case "":
                                if (editParm.record.__status == "add") return true;
                                else return false;
                                break;
                        }
                    },
                    onSuccess: function (data, g) {
                        me.iframeloading.hide();
                    },
                    rowAttrRender: function (rowdata, rowid) {
                        if (rowdata && rowdata.VALIDFLAG && rowdata.VALIDFLAG !== "1") {
                            return "style='color:red;'";
                        }
                        return "";
                    },
                    onDblClickRow: function (data, rowid, rowdata) {
                        me.modify(rowid);
                    }
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "add":
                            me.add();
                            break;
                        case "modifyParent":
                            me.modifyParent();
                            break;
                        case "delete":
                            me.delete();
                            break;
                        case "save":
                            me.save();
                            break;
                        case "Excel":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=xls", window.gksybConfigs.urlBase), modal: true });
                            break;
                        case "Pdf":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=pdf", window.gksybConfigs.urlBase), modal: true });
                            break;
                    }
                }
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            add: function () { //新增
                var me = this;
                if (me.currentNode == null || me.currentNode == undefined) {
                    LG.tip('请选择左侧树节点!');
                }
                else {
                    var nodeId = me.currentNode.data.TYPE_ID;
                    me.grid.addEditRow({ "PRE_TYPEID": (nodeId == "ROOT" ? "" : nodeId), "IS_CANCEL": "0" });
                }
            },
            save: function () { //保存
                var me = this;
                if (me.grid.endEdit() != false) {
                    if (!me.grid.isDataChanged) {
                        LG.showSuccess('无修改');
                        return;
                    }
                    if (!me.grid.validChangeRows()) return false;
                    var changeRow = me.grid.getChangedRows();
                    LG.ajax({
                        jsToken: true,
                        url: 'Material/BaseSptype/Save',
                        loading: '正在保存中...',
                        data: changeRow,
                        success: function () {
                            LG.showSuccess('保存成功');
                            me.grid.isDataChanged = false;
                            //location.reload();
                            me.reloadTree();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }
            },
            reloadTree: function () {
                var me = this;
                me.selectNode = me.tree.getSelected();
                me.tree.reload();
            },
            reload: function () { //刷新
                var me = this;
                me.grid.loadData();
            },
            delete: function () { //删除
                var me = this;
                if (me.grid.endEdit() != false) {
                    var selected = me.grid.getSelectedRows();
                    if (selected.length > 0) {
                        $.ligerDialog.confirm('确定删除吗?', function (confirm) {
                            if (confirm) {
                                for (var i = 0, len = (selected || []).length; i < len; i++) {
                                    me.grid.deleteRow(selected[i]);
                                }
                                me.save();
                            }
                        });
                    } else {
                        LG.tip('请选择行!');
                    }
                }
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Pdf',
                        text: '导出Pdf',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-pdf-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            setTree: function () {
                var me = this;
                var rootValue = "ROOT";
                me.tree = $("#maintree").ligerTree({
                    url: "Material/BaseSptype/Tree",
                    parms: {},
                    nodeWidth: 160,
                    slide: false,
                    checkbox: false,
                    single: true,
                    needCancel: false,
                    idFieldName: 'TYPE_ID',
                    textFieldName: 'TYPE_NAME',
                    parentIDFieldName: 'PARENTID',
                    iconClsFieldName: "ICON",
                    isExpand: 2,
                    onSuccess: function (data) {
                        $(".l-tree .l-body span").each(function () {
                            var $this = $(this);
                            var text = $this.text();
                            $this.html('<acronym title="' + text + '"><span> ' + text + '</span></acronym>');
                        });
                        if (me.selectNode && me.selectNode.data) this.selectNode(me.selectNode.data.TYPE_ID);
                        else me.tree.selectNode(rootValue);
                    },
                    onSelect: function (node) {
                        me.iframeloading.show();
                        var nodeData = node.data;
                        me.currentNode = node;
                        var where = {};
                        if (nodeData) {
                            var parentNo = nodeData.TYPE_ID;
                            $("#_search_PRE_TYPEID").val((parentNo == "ROOT" ? "" : parentNo));
                            where = {
                                rules: [],
                                groups: [{
                                    rules: [], op: "or"
                                }], op: "and"
                            };
                            if (parentNo === rootValue) {
                                parentNo = "";
                                //where.groups[0].rules.push({ field: "PRE_TYPEID", op: "isnull" });
                                //where.groups[0].rules.push({ field: "PRE_TYPEID", op: "equal", value: "0" });
                            } else {
                                where.groups[0].rules.push({ field: 'PRE_TYPEID', value: parentNo, op: 'equal' });
                                where.groups[0].rules.push({ field: "TYPE_ID", op: "equal", value: parentNo });
                            }

                            me.grid.set('parms', { "where": JSON2.stringify(where) });
                            me.currentMenuParentNo = parentNo;
                            me.reload();
                        }
                    }
                });
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch = $("#formsearch")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    labelWidth: me.formLabelWidth,
                    inputWidth: me.formInputWidth,
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                    }
                });
            },
            init: function () {
                var me = this;
                $("#layout").ligerLayout({ leftWidth: 240 });
                me.iframeloading.show();
                me.loadComboxData();
                me.setConfig();
                me.setGrid();
                me.setTree();
                me.setForm();
                return me;
            }
        };
        business.init();
    </script>
</body>
</html>
