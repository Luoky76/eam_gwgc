<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title>仓库货位</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <div id="layout">
        <div position="left" title="仓库目录" id="mainmenu">
            <ul id="maintree" style="margin-top: 5px;"></ul>
        </div>
        <div position="center" title="仓库列表">
            <div id="iframeloading" class='l-loading'>
            </div>
            <div id="mainsearch">
                <form action="" id="formsearch" class="l-form">
                </form>
            </div>
            <form action="" id="mainform">
                <div id="maingrid">
                </div>
            </form>
        </div>
    </div>
    <script type="text/javascript">
        'use strict';
        var business = {
            detailWidth: window.innerWidth * 0.9,
            detailHeight: window.innerHeight * 0.9,
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            {
                                display: "通用搜索",
                                name: "_search_all",
                                hideLabel: true,
                                filter: [
                                    { op: "like", field: "HOUSE_NAME", type: "string" },
                                    { op: "like", field: "HOUSE_CODE", type: "string" },
                                    { op: "like", field: "HOUSE_TYPE", type: "string" },
                                    { op: "like", field: "DEPT_NAME", type: "string" },
                                    { op: "like", field: "MEMO", type: "string" }
                                ],
                                options: {
                                    onEnter: function () {
                                        var me = this;
                                        var $formsearch = $("#formsearch");
                                        LG.commonSearch($formsearch, me.grid);
                                    }.bind(me)
                                },
                            },
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "仓库名称", name: "HOUSE_NAME", type: "string", minWidth: 200, validate: { required: true }, editor: { type: "string" } },
                            { display: "仓库编码", name: "HOUSE_CODE", type: "string", minWidth: 200 },
                            { display: "仓库类型", name: "HOUSE_TYPE", type: "select", editor: { type: "select", data: me.HouseType } },
                            {
                                display: "上级仓库", name: "PRE_HOUSE_ID", type: "select", minWidth: 200,
                                editor: {
                                    type: "select", url: "Material/BaseSpHouse/HouseComboxData",
                                    onSuccess: function (data) { me.SpHouse = data; }
                                },
                                format: { data: function () { return me.SpHouse; } }
                            },
                            {
                                display: "部门", name: "DEPT_ID", type: "select", minWidth: 200, editor: {
                                    type: "select",
                                    data: me.Corp,
                                    onChange: function (rowdata) {
                                        rowdata.grid.updateCell("DEPT_NAME", rowdata.selected?.TEXT ?? "", rowdata.record);
                                    }
                                }
                            },
                            { display: "备注", name: "MEMO", type: "string", minWidth: 200, maxWidth: 300, editor: { type: "string" } },

                            //隐藏字段
                            { display: "部门名称", name: "DEPT_NAME", type: "string", hide: true },
                        ]
                    }
                };
            },
            grid: null,
            searchForm: null,
            buttons: null,
            isView: false,
            //是否为选择弹窗
            isSelectWindow: false,
            //记录已选中需隐藏的行，用于选择弹窗
            _storageSelect: {},
            //分类树
            tree: null,
            //当前选中的树节点
            selectedNode: null,
            iframeloading: $("#iframeloading"),
            //下拉数据
            SpHouse: [],
            HouseType: [],
            Corp: [],
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'Material/BaseSpHouse/ComboxData',
                    loading: '正在获取中...',
                    success: function (data) {
                        me.SpHouse = data.SpHouse;
                        me.HouseType = data.HouseType;
                        me.Corp = data.Corp;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    dateFormat: 'yyyy-MM-dd HH:mm',
                    autoWidth: true,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    usePager: false,
                    dataAction: 'server',
                    toolbar: {},
                    url: 'Material/BaseSpHouse/List',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: 'HOUSE_CODE',
                    sortOrder: 'asc',
                    width: '100%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: !me.isView,
                    clickToEdit: true,
                    onBeforeEdit: function (editParm) {
                        switch (editParm.column.name) {
                            case "":
                                if (editParm.record.__status == "add") return true;
                                else return false;
                                break;
                        }
                    },
                    onSuccess: function (data, g) {
                        if (data && data.Rows) {
                            var rows = data.Rows || [];
                            for (var i = 0, len = rows.length; i < len; i++) {
                                var row = rows[i];
                                row.OLDID = row.ID;
                            }
                        }
                        me.iframeloading.hide();
                    },
                    onLoadSuccess: function (data) {
                        if (me.isSelectWindow) {
                            for (var i = data.Rows.length - 1; i >= 0; i--) {
                                var row = data.Rows[i];
                                if (me._storageSelect[row.HOUSE_ID]) {
                                    data.Rows.splice(i, 1);
                                }
                            }
                        }
                    },
                    rowAttrRender: function (rowdata, rowid) {
                        return "";
                    },
                    onDblClickRow: function (data, rowid, rowdata) {
                        if (me.isSelectWindow) {
                            var rows = [data];
                            var values = [data.HOUSE_ID];
                            if (me.data.callback) {
                                me.data.callback(values, rows);
                            }
                            me._storageSelect[data.HOUSE_ID] = true;
                            me.dialog.close();
                        }
                    }
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "excel-import":
                            me.excelImport();
                            break;
                        case "add":
                            me.add();
                            break;
                        case "delete":
                            me.delete();
                            break;
                        case "save":
                            me.save();
                            break;
                        case "Excel":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=xls", window.gksybConfigs.urlBase), modal: true });
                            break;
                        case "Pdf":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=pdf", window.gksybConfigs.urlBase), modal: true });
                            break;
                    }
                };
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            //excel导入
            excelImport: function () {
                var me = this;
                LG.showUpload({
                    title: "仓库导入",
                    server: "Material/BaseSpHouse/Import",
                    mouldFileName: function () {
                        window.open(window.gksybConfigs.getUrl("excel-import/仓库导入.xlsx", window.gksybConfigs.urlBase));
                    },
                    multiple: false,
                    extensions: 'xls,xlsx',
                    mimeTypes: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel',
                    compress: {
                        width: me.detailWidth
                    },
                    showSuccess: false,
                    data: { folder: '../../Adv' },
                    callback: function (status, data) {
                        if (status) {
                            LG.showSuccess("导入成功");
                            me.reloadTree();
                        }
                    }
                });
            },
            add: function () { //新增
                var me = this;
                var selectedNode = me.tree.getSelected();
                me.grid.addEditRow({
                    PRE_HOUSE_ID: selectedNode?.data?.HOUSE_ID ?? "",
                    DEPT_ID: selectedNode?.data?.DEPT_ID ?? "",
                    DEPT_NAME: selectedNode?.data?.DEPT_NAME ?? ""
                }, true);
            },
            save: function () { //保存
                var me = this;
                if (me.grid.endEdit() === false) return;
                if (!me.grid.isDataChanged) {
                    LG.showSuccess('无修改');
                    return;
                }
                if (!me.grid.validChangeRows()) return false;
                var changeRow = me.grid.getChangedRows();
                LG.ajax({
                    jsToken: true,
                    url: 'Material/BaseSpHouse/Save',
                    loading: '正在保存中...',
                    data: changeRow,
                    success: function () {
                        LG.showSuccess('保存成功');
                        me.grid.isDataChanged = false;
                        me.reloadTree();
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            reload: function () { //刷新
                var me = this;
                me.loadComboxData();

                me.selectedNode = me.tree.getSelected();
                if (me.selectedNode) {
                    var where = {
                        rules: [],
                        groups: [{
                            rules: [], op: "or"
                        }], op: "and"
                    };
                    where.groups[0].rules.push({ field: 'HOUSE_CODE', value: me.selectedNode.data.HOUSE_CODE, op: 'startwith' });
                    me.grid.set('parms', { "where": JSON2.stringify(where) });
                }
                else me.grid.set('parms', { "where": "" });

                me.grid.loadData();
            },
            reloadTree: function () {
                var me = this;
                me.selectedNode = me.tree.getSelected();
                me.tree.reload();
            },
            getSelectedRows: function (remove) {
                var me = this;
                if (me.grid.endEdit() === false) return false;
                var rows = me.grid.getSelectedRows(remove);
                if (rows.length < 1) {
                    LG.tip('请选择行!');
                    return false;
                }
                return rows;
            },
            delete: function () { //删除
                var me = this;
                var rows = me.getSelectedRows();
                if (!rows) return;
                $.ligerDialog.confirm('确定删除吗?', function (confirm) {
                    if (!confirm) return;
                    me.grid.deleteRange(rows);
                    me.save();
                });
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Pdf',
                        text: '导出Pdf',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-word-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            //设置左侧树形
            setTree: function () {
                var me = this;
                me.tree = $("#maintree").ligerTree({
                    url: "Material/BaseSpHouse/Tree",
                    parms: {},
                    slide: false,
                    checkbox: false,
                    single: true,
                    needCancel: true,
                    idFieldName: 'HOUSE_ID',
                    textFieldName: 'HOUSE_NAME',
                    parentIDFieldName: 'PRE_HOUSE_ID',
                    parentIcon: "fa fa-bars",
                    parentIconOpen: "fa fa-bars",
                    childIcon: "fa fa-bars",
                    filter: true,
                    isExpand: 2,
                    onSuccess: function (data) {
                        if (me.selectedNode) this.selectNode(me.selectedNode?.data?.HOUSE_ID);
                        me.reload();
                    },
                    onClick: function (node) {
                        me.iframeloading.show();
                        me.reload();
                    },
                    render: function (nodeData, nodeText, c, tree) {
                        return `<span style="font-size: 16px;">
                                    ${nodeText}
                                </span>`;
                    }
                });
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch = $("#formsearch");
                me.searchForm = $formsearch.ligerForm({
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                    }
                });
            },
            initSelect: function () {
                var me = this;
                var values = $.isArray(me.data.values) ? me.data.values : (me.data.values || "").split(me.data.split);
                var select = {};
                for (var i = 0, l = values.length; i < l; i++) {
                    var item = values[i];
                    select[item] = true;
                }
                me._storageSelect = select;
            },
            setFormButtons: function () {
                var me = this;
                var close = function () {
                    if (me.dialog) {
                        me.dialog.close();
                    }
                };
                var confirm = function () {
                    var rows = me.grid.getSelectedRows() || [];
                    var values = [];
                    for (var i = 0, l = rows.length; i < l; i++) {
                        var row = rows[i];
                        values.push(row.HOUSE_ID);
                    }
                    if (me.data.callback) {
                        me.data.callback(values, rows);
                    }
                    close();
                };
                var buttons = [];
                buttons.push({ text: '关闭', onclick: close });
                buttons.push({ text: '确定', onclick: confirm });
                LG.addFormButtons(buttons);
                me.formButtons = buttons;
            },
            init: function () {
                var me = this;
                if (frameElement && frameElement.dialog) {
                    me.dialog = frameElement.dialog;
                    me.data = frameElement.dialog.get('data') || {};
                    if (me.data.isSelectWindow === true) {
                        me.isSelectWindow = true;
                        me.isView = true;
                        me.initSelect();
                        me.setFormButtons();
                    }
                }
                $("#layout").ligerLayout({ leftWidth: "20%" });
                me.iframeloading.show();
                me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.setTree();
                me.setGrid();
                me.reload();
                window.closeQuery = function (callback) {
                    if (!me.dialog) return callback();
                    return me.dialog.frame.business.closeQuery(callback);
                };
                return me;
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>

</html>
