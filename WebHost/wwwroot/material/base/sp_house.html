<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title>仓库货位</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 2px; height: 100%;">
    <div id="layout">
        <div position="left" title="仓库货位目录" id="mainmenu">
            <ul id="maintree" style="margin-top:5px;"></ul>
        </div>
        <div position="center" title="仓库货位列表">
            <div id="mainsearch">
                <form action="" id="formsearch" class="l-form">
                </form>
            </div>
            <form id="mainform">
                <div id="maingrid" style="margin: 2px;"></div>
            </form>
        </div>
    </div>
    <script type="text/javascript">
        'use strict';
        var business = {
            formLabelWidth: 120,
            formInputWidth: 180,
            getTextareaWidth: function () {
                var me = this;
                var fieldWidth = me.formLabelWidth + me.formInputWidth + 3;
                return Math.floor(($("#mainform").width() - 10) / fieldWidth) * fieldWidth - (me.formLabelWidth + 3);
            },
            MenuNo: getQueryStringByName("MenuNo"),
            ver: getQueryStringByName("ver"),
            tree: null,
            currentNode: null,
            DeptData: [],
            BCCode: [],
            HouseType: [],
            SpHouseName: [],
            parentNo: "",
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            {
                                display: "仓库货位编码", name: "_search_HOUSE_CODE", dbname: "HOUSE_CODE", newline: false, type: "text",
                            },
                            {
                                display: "仓库货位名称", name: "_search_HOUSE_NAME", dbname: "HOUSE_NAME", newline: false, width: 200, type: "text",
                            }
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "仓库货位编码", name: "HOUSE_CODE", dbname: "HOUSE_CODE", minWidth: 200, type: "text",  editor: { type: 'text' }, validate: { required: true } },
                            { display: "仓库货位名称", name: "HOUSE_NAME", dbname: "HOUSE_NAME", minWidth: 200, type: "text",  editor: { type: 'text' }, validate: { required: true } },
                            { display: "类型", name: "HOUSE_TYPE", dbname: "HOUSE_TYPE", minWidth: 100, type: "select", editor: { type: 'select', data: me.HouseType }, validate: { required: true } },
                            { display: "仓库属性", name: "HOUSE_PROPERTY", dbname: "HOUSE_PROPERTY", minWidth: 150, type: "select", editor: { type: 'select', data: me.BCCode }, validate: { required: true } },
                            {
                                display: "所属单位", name: "DEPT_ID", minWidth: 150, type: "select", validate: { required: true },
                                editor: {
                                    type: 'select',
                                    data: me.DeptData,
                                    onChange: function (rowdata, rowIndex) {
                                        if (rowdata.selected) {
                                            liger.get("maingrid").updateCell("DEPT_NAME", rowdata.selected.TEXT, rowdata.record);
                                        } else {
                                            liger.get("maingrid").updateCell("DEPT_NAME", "", rowdata.record);
                                        }
                                    },
                                }
                            },
                            { display: "部门", name: "DEPT_NAME", width: 100, type: "text", hide: true },
                            {
                                display: "上级节点", name: "PARENT_HOUSE_CODE", dbname: "PARENT_HOUSE_CODE", minWidth: 200, type: "select", editor: { type: 'select', data: me.SpHouseName },
                            },
                            {
                                display: "财务属性", name: "IS_ACCOUNT", dbname: "IS_ACCOUNT", minWidth: 50, type: "text", align: "center", formatType: "chk", editor: { type: 'chkStr' }
                            },
                            {
                                display: "是否失效", name: "IS_NOVALID", dbname: "IS_NOVALID", minWidth: 50, type: "text", align: "center", formatType: "chk", editor: { type: 'chkStr' }
                            },
                            { display: "失效日期", name: "NOVALID_DATE", dbname: "NOVALID_DATE", minWidth: 150, type: "date", editor: { type: 'date', showTime: true, format: "yyyy-MM-dd hh:mm" } },
                            { display: "备注", name: "MEMO", dbname: "MEMO", minWidth: 300, type: "text",  editor: { type: 'text' } },
                            { display: "主键", name: "HOUSE_ID", dbname: "HOUSE_ID", width: 100, type: "text",  hide: true },

                        ]
                    }
                };
            },
            grid: null,
            loadComboxData: function () {
                var me = this;
                var dataControl = [];
                LG.ajax({
                    async: false,
                    url: 'Material/BaseSpHouse/ComboxData',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        me.BCCode = data.BCCode
                        me.HouseType = data.HouseType;
                        me.DeptData = data.DeptData;
                        me.SpHouseName = data.SpHouseName;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
                return dataControl;
            },
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    dateFormat: "yyyy-MM-dd hh:mm",
                    autoWidth: true,
                    delayLoad: true,
                    usePager: false,
                    columns: me.config.grid.columns,
                    dataAction: 'server',
                    toolbar: {},
                    url: 'Material/BaseSpHouse/list',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: 'HOUSE_CODE',
                    sortOrder: 'asc',
                    width: '99%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: true,
                    clickToEdit: true,
                    onBeforeEdit: function (editParm) {
                        return true;
                    },
                    rowAttrRender: function (rowdata, rowid) {
                        if (rowdata && rowdata.IS_NOVALID && rowdata.IS_NOVALID == "1") {
                            return "style='color:red;'";
                        }
                        return "";
                    }
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "add":
                            me.add();
                            break;
                        case "delete":
                            me.delete();
                            break;
                        case "save":
                            me.save();
                            break;
                        case "Excel":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=xls", window.gksybConfigs.urlBase), modal: true });
                            break;
                        case "Pdf":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=pdf", window.gksybConfigs.urlBase), modal: true });
                            break;
                    }
                }
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            add: function () { //新增
                var me = this;
                var nodeId = me.currentNode == null || me.currentNode == undefined ? "ROOT" : me.currentNode.data.HOUSE_CODE;
                me.grid.addEditRow({ "PARENT_HOUSE_CODE": (nodeId == "ROOT" ? "" : nodeId) });
            },
            save: function () { //保存
                var me = this;
                if (me.grid.endEdit() != false) {
                    if (!me.grid.isDataChanged) {
                        LG.showSuccess('无修改');
                        return;
                    }
                    if (!me.grid.validChangeRows()) return false;
                    var changeRow = me.grid.getChangedRows();
                    LG.ajax({
                        jsToken: true,
                        url: 'Material/BaseSpHouse/Save',
                        loading: '正在保存中...',
                        data: changeRow,
                        success: function () {
                            LG.showSuccess('保存成功');
                            me.grid.isDataChanged = false;
                            location.reload();
                            me.reloadTree();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }
            },
            reloadTree: function () {
                var me = this;
                me.selectNode = me.tree.getSelected();
                me.tree.reload();
            },
            reload: function () { //刷新
                var me = this;
                me.grid.loadData();
            },
            delete: function () { //删除
                var me = this;
                if (me.grid.endEdit() != false) {
                    var selected = me.grid.getSelectedRows();
                    $.ligerDialog.confirm('确定删除吗?', function (confirm) {
                        if (confirm) {
                            for (var i = 0, len = (selected || []).length; i < len; i++) {
                                me.grid.deleteRow(selected[i]);
                            }
                            me.save();
                        }
                    });
                }
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Pdf',
                        text: '导出Pdf',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-pdf-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            setTree: function () {
                var me = this;
                var rootValue = "ROOT";
                me.tree = $("#maintree").ligerTree({
                    url: "Material/BaseSpHouse/Tree",
                    parms: {},
                    nodeWidth: 160,
                    slide: false,
                    checkbox: false,
                    single: true,
                    needCancel: false,
                    idFieldName: 'HOUSE_CODE',
                    textFieldName: 'HOUSE_NAME',
                    parentIDFieldName: 'PARENTID',
                    iconClsFieldName: "ICON",
                    isExpand: 2,
                    onSuccess: function (data) {
                        $(".l-tree .l-body span").each(function () {
                            var $this = $(this);
                            var text = $this.text();
                            $this.html('<acronym title="' + text + '"><span> ' + text + '</span></acronym>');
                        });
                        if (me.selectNode && me.selectNode.data) this.selectNode(me.selectNode.data.HOUSE_CODE);
                        else me.tree.selectNode(rootValue);
                    },
                    onSelect: function (node) {
                        var nodeData = node.data;
                        me.currentNode = node;
                        var where = {};
                        if (nodeData) {
                            me.parentNo = nodeData.HOUSE_CODE;

                            where = {
                                rules: [],
                                groups: [{
                                    rules: [], op: "or"
                                }], op: "and"
                            };

                            if (me.parentNo === rootValue) {
                                me.parentNo = "";
                            } else {
                                where.groups[0].rules.push({ field: 'PARENT_HOUSE_CODE', value: me.parentNo, op: 'startwith' });
                                where.groups[0].rules.push({ field: "HOUSE_CODE", op: "equal", value: me.parentNo });
                            }

                            me.grid.set('parms', { "where": JSON2.stringify(where) });
                            me.currentMenuParentNo = me.parentNo;
                            me.reload();
                        }
                    }
                });
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch = $("#formsearch")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    labelWidth: me.formLabelWidth,
                    inputWidth: me.formInputWidth,
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            if (me.parentNo != "" && me.parentNo != "ROOT") {
                                var where = {
                                    op: 'or',
                                    rules: []
                                };
                                where.rules.push({ field: 'PARENT_HOUSE_CODE', value: me.parentNo, op: 'startwith' });
                                where.rules.push({ field: 'HOUSE_CODE', value: me.parentNo, op: 'equal' });
                                me.grid.set('parms', { "where": JSON2.stringify(where) });
                                me.grid.options.NoFirstSearch = false;
                            }

                            LG.commonSearch($formsearch, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                    }
                });
            },
            init: function () {
                var me = this;
                $("#layout").ligerLayout({ leftWidth: 240 });
                me.loadComboxData();
                me.setConfig();
                me.setGrid();
                me.setTree();
                me.setForm();
                return me;
            }
        };
        business.init();
    </script>
</body>
</html>
