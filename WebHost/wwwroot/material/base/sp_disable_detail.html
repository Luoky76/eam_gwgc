<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title></title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <div id="mainsearch" style="width: 98%">
        <form action="" id="formsearch" class="l-form">
        </form>
    </div>
    <form action="" id="mainform">
        <div id="maingrid">
        </div>
    </form>
    <script type="text/javascript">
        'use strict';
        var business = {
            rootPath:'Material/SpareApply/',
            MenuNo: getQueryStringByName("MenuNo"),
            dialog: null,
            dialogData: null,
            Did: null,
            typeData: [],
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            { display: "关联外键", name: "_search_DISABLE_ID", dbname: "DISABLE_ID", newline: false, type: "hidden" },
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "物料编码", name: "SP_CODE", width: 150, type: "text", },
                            { display: "物料名称", name: "SP_NAME", width: 150, type: "text",  },
                            { display: "型号规格", name: "SP_SIZE", width: 150, type: "text",  },
                            { display: "品牌、厂家", name: "PRODUCE", width: 150, type: "text", },
                            { display: "计量单位", name: "UNIT", width: 150, type: "text", },
                            {
                                display: "物料分类", name: "TYPE_ID", width: 150, type: "select",
                                format: {
                                    data: me.typeData
                                }
                            },
                            { display: "说明", name: "MEMO", width: 120, type: "text", editor: { type: 'text' } },
                            { display: "物料ID", name: "SP_ID", dbname: "SP_ID", width: 100, type: "text", hide: true },
                            { display: "DISABLE_ID", name: "DISABLE_ID", dbname: "DISABLE_ID", width: 100, type: "text", hide: true },
                            { display: "主键", name: "DISABLE_DET_ID", dbname: "DISABLE_DET_ID", width: 100, type: "text", hide: true },
                        ]
                    }
                };
            },
            grid: null,
            searchForm: null,
            buttons: null,
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: me.rootPath + 'ComboxData',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        me.typeData = data.BaseSpType
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    autoWidth: false,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    usePager: false,
                    toolbar: { group:"detail" },
                    url: me.rootPath + 'SpDisableDetailList',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: 'CREATEDATE',
                    sortOrder: 'DESC',
                    width: '98%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: !me.isView,
                    clickToEdit: true
                });
                me.grid.isValid = true;
                me.loadToolbar();
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "add":
                            me.add();
                            break;
                        case "delete":
                            me.delete();
                            break;
                        case "save":
                            me.save();
                            break;
                    }
                }
                if (!me.isView)
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            add: function () { //新增
                var me = this;
                var callback = function (list) {
                    var gridlist = me.grid.getData();
                    var flag = false;
                    for (var i in list) {
                        var flag = gridlist.some(t => t.SP_ID == list[i].SP_ID);
                        if (flag) {
                            LG.showError(list[i].SP_NAME + "[" + list[i].SP_CODE + "]" + "已存在,不能重复添加");
                            return
                        }
                        me.grid.addEditRow({
                            "SP_ID": list[i].SP_ID,
                            "DISABLE_ID": me.Did
                        });
                    }
                    if (!flag) {
                        me.save();
                    }
                };


                $.ligerDialog.open({
                    width: 980,
                    height: 600,
                    allowClose: true,
                    title: "挑选物资编码",
                    url: "base_spcatalogPop.html?MenuNo=" + me.menuNo,
                    isHidden: false,
                    showMax: false,
                    showToggle: false,
                    showMin: false,
                    isResize: true,
                    slide: false,
                    data: {
                        isCancel:"0",
                        mainReloadBtn: me.buttons[0],
                        callback: callback
                    }
                });

            },
            save: function () { //保存
                var me = this;
                if (me.grid.endEdit() != false) {
                    if (!me.grid.isDataChanged) {
                        LG.showSuccess('无修改');
                        return;
                    }
                    if (!me.grid.validChangeRows()) return false;

                    var dataRow = me.grid.getData();

                    var code = dataRow.map((a) => {
                        return a.SP_ID;
                    });
                    
                    if (new Set(code).size !== code.length) {
                        LG.showSuccess('物资编码不能重复');
                        return;
                    }
                   
                    var changeRow = me.grid.getChangedRows();
                    LG.ajax({
                        jsToken: true,
                        url: me.rootPath + 'SpDisableDetailSave',
                        loading: '正在保存中...',
                        data: changeRow,
                        success: function () {
                            LG.showSuccess('保存成功');
                            me.grid.isDataChanged = false;
                            me.reload();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }

            },
            reload: function () { //刷新
                var me = this;
                me.buttons[0].click();
            },
            delete: function () { //删除
                var me = this;
                if (me.grid.endEdit() != false) {
                    var selected = me.grid.getSelectedRows();
                    if (selected.length > 0) {
                        $.ligerDialog.confirm('确定删除吗?', function (confirm) {
                            if (confirm) {
                                for (var i = 0, len = selected.length; i < len; i++) {
                                    me.grid.deleteRow(selected[i]);
                                }
                                me.save();
                            }
                        });
                    } else {
                        LG.tip('请选择行!');
                    }
                }
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch = $("#formsearch")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                        me.searchForm.setData({ "_search_DISABLE_ID": me.Did });
                    }
                });
            },
            init: function () {
                var me = this;

                me.dialog = frameElement.dialog;
                me.dialogData = me.dialog.get('data');
                me.Did = me.dialogData.sid;
                me.isView = Boolean(me.dialogData.isView);
                
                me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.setGrid();
                me.reload();
                return me;
            }
        };
        business.init();
    </script>
</body>
</html>
