<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title>库存明细</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 2px; height: 100%;">
    <div id="layout">
        <div position="left" title="仓库货位" id="mainmenu">
            <ul id="maintree" style="margin-top:5px;"></ul>
        </div>
        <div position="center" title="库存明细列表" id="center-pos">
            <div id="tabcontainer">
                <div id="storelist" title="物资库存" tabid="storelist">
                    <div class="searchbox">
                        <form action="" id="formsearch" class="l-form">
                        </form>
                    </div>
                    <form id="storeform">
                        <div id="storegrid" style="margin: 2px;"></div>
                    </form>
                </div>
                <div id="waterlist" title="库存流水" tabid="waterlist">
                    <form id="waterform">
                        <div id="watergrid"></div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <!-- 库存初始化弹框 -->
    <div id="view-panel" style="display:none;">
        <form action="" id="view-form" class="l-form"></form>
    </div>
    <script type="text/javascript">
        'use strict';
        var business = {
            formLabelWidth: 120,
            formInputWidth: 180,
            getTextareaWidth: function () {
                var me = this;
                var fieldWidth = me.formLabelWidth + me.formInputWidth + 3;
                return Math.floor(($("#storeform").width() - 10) / fieldWidth) * fieldWidth - (me.formLabelWidth + 3);
            },
            menuNo: getQueryStringByName("MenuNo"),
            ver: getQueryStringByName("ver"),
            tab: null,
            grid: null,
            waterGrid: null,
            tree: null,
            currentNode: null,
            ProviderName: [],
            BCCode: [],
            SrcType: [],
            stockData: [],
            DeptData:[],
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            {
                                display: "通用搜索",
                                name: "_search_all",
                                hideLabel: true,
                                filter: [
                                    { op: "like", field: "BATCH_CODE", type: "string" },
                                    { op: "like", field: "SP_CODE", type: "string" },
                                    { op: "like", field: "SP_NAME", type: "string" },
                                    { op: "like", field: "SP_SIZE", type: "string" },
                                    { op: "like", field: "TYPE_NAME", type: "string" },
                                    { op: "like", field: "PRODUCE", type: "string" },
                                    { op: "like", field: "HOUSE_NAME", type: "string" },
                                    { op: "like", field: "UNIT", type: "string" },
                                    { op: "like", field: "PROVIDER_NAME", type: "string" },
                                    { op: "like", field: "PROPERTY", type: "string" },
                                    { op: "like", field: "DEPT_NAME", type: "string" },
                                ],
                            },
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "批次号", name: "BATCH_CODE", width: 150, type: "string" },
                            { display: "物资编码", name: "SP_CODE", width: 120, type: "string" },
                            { display: "物资名称", name: "SP_NAME", width: 150, type: "string" },
                            { display: "型号规格", name: "SP_SIZE", width: 150, type: "string" },
                            { display: "物资分类", name: "TYPE_NAME", width: 150, type: "string" },
                            { display: "品牌、厂家", name: "PRODUCE", width: 150, type: "string" },
                            { display: "仓库名称", name: "HOUSE_NAME", width: 150, type: "string" },
                            { display: "计量单位", name: "UNIT", width: 100, type: "string" },
                            { display: "库存数量", name: "STORE_NUM", width: 100, type: "float" },
                            { display: "含税单价(元)", name: "TAX_PRICE", width: 120, type: "float" },
                            { display: "含税金额(元)", name: "TAX_MONEY", width: 120, type: "currency", totalSummary: { type: 'sum' } },
                            { display: "不含税单价(元)", name: "NOTAX_PRICE", width: 130, type: "float" },
                            { display: "不含税金额(元)", name: "NOTAX_MONEY", width: 130, type: "currency", totalSummary: { type: 'sum' } },
                            { display: "入库日期", name: "IN_DATE", width: 120, type: "date", format: "yyyy-MM-dd" },
                            { display: "供应商", name: "PROVIDER_NAME", width: 150, type: "string" },
                            { display: "属性", name: "PROPERTY", width: 100, type: "string" },
                            { display: "部门", name: "DEPT_NAME", width: 150, type: "string" },
                            { display: "主键", name: "STORE_ID", width: 100, type: "string", hide: true },
                        ]
                    },
                    waterGrid: {
                        columns: [
                            { display: "单据编码", name: "SRC_CODE", type: "string" },
                            { display: "单据日期", name: "SRC_DATE", type: "date", format: "yyyy-MM-dd hh:mm" },
                            { display: "来源类型", name: "SRC_TYPE", type: "select", editor: { data: me.SrcType } },
                            { display: "流水日期", name: "WATER_DATE", type: "date", format: "yyyy-MM-dd hh:mm" },
                            { display: "期初数量", name: "INIT_NUM", type: "float" },
                            { display: "期初含税金额", name: "INIT_TAX_MONEY", type: "currency" },
                            { display: "期初不含税金额", name: "INIT_NOTAX_MONEY", type: "currency" },
                            { display: "入库数量", name: "IN_NUM", type: "float" },
                            { display: "入库含税金额", name: "IN_TAX_MONEY", type: "currency" },
                            { display: "入库不含税金额", name: "IN_NOTAX_MONEY", type: "currency" },
                            { display: "出库数量", name: "OUT_NUM", type: "float" },
                            { display: "出库含税金额", name: "OUT_TAX_MONEY", type: "currency" },
                            { display: "出库不含税金额", name: "OUT_NOTAX_MONEY", type: "currency" },
                            { display: "期末数量", name: "CUR_NUM", type: "float" },
                            { display: "期末含税金额", name: "CUR_TAX_MONEY", type: "currency" },
                            { display: "期末不含税金额", name: "CUR_NOTAX_MONEY", type: "currency" },
                            //隐藏
                            { display: "库存id", name: "STORE_ID", type: "string", hide: true },
                            { display: "流水id", name: "WATER_ID", type: "string", hide: true },
                        ]
                    }
                };
            },
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'Material/SpStore/ComboxData',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        me.ProviderName = data.ProviderName;
                        me.BCCode = data.BCCode;
                        me.DeptData = data.DeptData;
                        me.SrcType = data.SrcType;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            setTab: function () {
                var me = this;
                me.tab = $("#tabcontainer").ligerTab({
                    type: "brief",
                    onAfterSelectTabItem: function (tabid) {
                        switch (tabid) {
                            case 'storelist':
                                me.grid._onResize();
                                break;
                            case "waterlist":
                                me.reloadWater();
                                me.waterGrid._onResize();
                                break;
                        }
                    }
                });
            },
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#storegrid").ligerGrid({
                    dateFormat: "yyyy-MM-dd hh:mm",
                    autoWidth: true,
                    delayLoad: true,
                    usePager: false,
                    columns: me.config.grid.columns,
                    toolbar: {},
                    url: 'Material/SpStore/List',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: 'SP_CODE',
                    sortOrder: '',
                    width: '99%',
                    height: '100%',
                    heightDiff: -150,
                    inWindow: $("#center-pos"),
                    checkbox: true,
                    enabledEdit: false,
                    clickToEdit: false,
                    onDblClickRow: function (data, rowid, rowdata) {
                        me.tab.selectTabItem('waterlist');
                    }
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            setWaterGrid: function () {
                var me = this;
                me.config.waterGrid.columns.removeNull();
                me.waterGrid = $("#watergrid").ligerGrid({
                    dateFormat: 'yyyy-MM-dd HH:mm',
                    autoWidth: true,
                    delayLoad: true,
                    usePager: true,
                    columns: me.config.waterGrid.columns,
                    dataAction: 'server',
                    toolbar: {},
                    url: 'Material/SpStore/DetList',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: 'WATER_DATE',
                    sortOrder: 'asc',
                    width: '100%',
                    height: '100%',
                    heightDiff: -54,
                    inWindow: $("#center-pos"),
                    checkbox: true,
                    enabledEdit: false,
                    clickToEdit: false
                });
                me.waterGrid.isValid = true;
                me.loadWaterToolbar();
                me.bindWaterGridEvent();
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "add"://库存初始化
                            me.add();
                            break;
                        case "delete"://删除库存初始化
                            me.delete();
                            break;
                        case "save"://保存库存初始化
                            me.save();
                            break;
                        case "Excel":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=xls", window.gksybConfigs.urlBase), modal: true, data: { gridid: "storegrid" } });
                            break;
                        case "Pdf":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=pdf", window.gksybConfigs.urlBase), modal: true, data: { gridid: "storegrid" } });
                            break;
                    }
                }
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            loadWaterToolbar: function () {
                var me = this;
                me.waterToolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reloadWater();
                            break;
                        case "Excel":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=xls", window.gksybConfigs.urlBase), modal: true, data: { gridid: "watergrid" } });
                            break;
                        case "Pdf":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=pdf", window.gksybConfigs.urlBase), modal: true, data: { gridid: "watergrid" } });
                            break;
                    }
                };
                LG.loadToolbar(me.waterGrid, me.waterToolbarBtnItemClick);
            },
            reloadWater: function () {
                var me = this;
                var selected = me.grid ? me.grid.getSelectedRow() : null;
                if (selected) {
                    var where = {
                        rules: [],
                        groups: [{
                            rules: [], op: "or"
                        }], op: "and"
                    };
                    where.groups[0].rules.push({ field: 'STORE_ID', value: selected.STORE_ID, op: 'equal' });
                    me.waterGrid.set('parms', { "where": JSON2.stringify(where) });
                } else {
                    me.waterGrid.set('parms', { "where": "" });
                }
                me.waterGrid.loadData();
            },
            add: function () { //库存初始化
                var me = this;
                var nodeCode = me.currentNode == null || me.currentNode == undefined ? "ROOT" : me.currentNode.data.HOUSE_CODE;
                var nodeName = me.currentNode == null || me.currentNode == undefined ? "仓库货位" : me.currentNode.data.HOUSE_NAME;
                var nodeId = me.currentNode == null || me.currentNode == undefined ? "ROOT" : me.currentNode.data.HOUSE_ID;

                me.viewForm = $("#view-form").ligerForm({
                    labelWidth: me.formLabelWidth,
                    inputWidth: me.formInputWidth,
                    fields: [
                        { display: "批次号", name: "BATCH_CODE", labelWidth: me.formLabelWidth, width: 180, newline: true, type: "string", options: {}, validate: { required: true } },
                        { display: "物料编码", name: "SP_CODE", labelWidth: me.formLabelWidth, width: 180, type: "string", validate: { required: true }, options: { disabled: true } },
                        { display: "物料名称", name: "SP_NAME", labelWidth: me.formLabelWidth, width: 180, newline: true, type: "string", validate: { required: true }, options: { disabled: true } },
                        { display: "型号规格", name: "SP_SIZE", labelWidth: me.formLabelWidth, width: 180, type: "string", options: { disabled: true } },
                        { display: "品牌、厂家", name: "PRODUCE", labelWidth: me.formLabelWidth, width: 180, newline: true, type: "string", options: { disabled: true } },
                        { display: "计量单位", name: "UNIT", labelWidth: me.formLabelWidth, width: 180, type: "string", options: { disabled: true } },
                        { display: "物资分类", name: "TYPE_NAME", labelWidth: me.formLabelWidth, width: 180, newline: true, type: "string", options: { disabled: true } },
                        {
                            display: "仓库名称", name: "HOUSE_ID", labelWidth: me.formLabelWidth, width: 180, type: "select",
                            options: {
                                type: "select",
                                data: me.stockData,
                                onChangeValue: function (input, value, g) {
                                    if (g.selected) {
                                        var mainform = this.options.host_form;
                                        mainform.setData({
                                            HOUSE_CODE: g.selected.VALUE,
                                            HOUSE_NAME: g.selected.TEXT
                                        });
                                    } else {
                                        var mainform = this.options.host_form;
                                        mainform.setData({ HOUSE_CODE: "", HOUSE_NAME: "" });
                                    }
                                }
                            }, validate: { required: true }
                        },
                        {
                            display: "库存数量", name: "STORE_NUM", labelWidth: me.formLabelWidth, width: 180, newline: true, type: "float",
                            options: {
                                type: 'float',
                                onChangeValue: function (input, value, g) {
                                    if (value < 0) {
                                        $('#STORE_NUM').val("");
                                        LG.showError("数量不可为负数！");
                                    }
                                    else {
                                        var editParm = $("#TAX_PRICE").val();
                                        $("#TAX_MONEY").val((value * (editParm || 0)).toFixed(2));
                                        var PRICE = $("#NOTAX_PRICE").val();
                                        $("#NOTAX_MONEY").val((value * (PRICE || 0)).toFixed(2));
                                    }
                                }
                            }, validate: { required: true }
                        },
                        {
                            display: "含税单价(元)", name: "TAX_PRICE", labelWidth: me.formLabelWidth, width: 180, newline: true, type: "float", options: {
                                type: 'float', onChangeValue: function (input, value, g) {
                                    if (value < 0) {
                                        $('#TAX_PRICE').val("");
                                        LG.showError("单价不可为负数！");
                                    }
                                    else {
                                        var editParm = $("#STORE_NUM").val();
                                        $("#TAX_MONEY").val((value * (editParm || 0)).toFixed(2));
                                    }
                                }
                            }, validate: { required: true }
                        },
                        {
                            display: "含税金额(元)", name: "TAX_MONEY", labelWidth: me.formLabelWidth, width: 180, type: "float", options: {
                                type: 'float',
                                onChangeValue: function (input, value, g) {
                                    if (value < 0) {
                                        $('#TAX_MONEY').val("");
                                        LG.showError("金额不可为负数！");
                                    } else {
                                        var editParm = $("#STORE_NUM").val();
                                        $("#TAX_PRICE").val((value / (editParm || 0)).toFixed(2));
                                    }
                                }
                            }, validate: { required: true }
                        },
                        {
                            display: "不含税单价(元)", name: "NOTAX_PRICE", labelWidth: me.formLabelWidth, width: 180, newline: true, type: "float", options: {
                                type: 'float',
                                onChangeValue: function (input, value, g) {
                                    if (value < 0) {
                                        $('#NOTAX_PRICE').val("");
                                        LG.showError("单价不可为负数！");
                                    }
                                    else {
                                        var editParm = $("#STORE_NUM").val();
                                        $("#NOTAX_MONEY").val((value * (editParm || 0)).toFixed(2));
                                    }
                                }
                            }
                        },
                        {
                            display: "不含税金额(元)", name: "NOTAX_MONEY", labelWidth: me.formLabelWidth, width: 180, type: "float", options: {
                                type: 'float',
                                onChangeValue: function (input, value, g) {
                                    if (value < 0) {
                                        $('#NOTAX_MONEY').val("");
                                        LG.showError("金额不可为负数！");
                                    } else {
                                        var editParm = $("#STORE_NUM").val();
                                        $("#NOTAX_PRICE").val((value / (editParm || 0)).toFixed(2));
                                    }
                                }
                            }
                        },
                        { display: "入库日期", name: "IN_DATE", labelWidth: me.formLabelWidth, width: 180, type: "date", newline: true, options: { format: "yyyy-MM-dd" }, validate: { required: true } },
                        {
                            display: "供应商", name: "PROVIDER_ID", dbname: "PROVIDER_ID", labelWidth: me.formLabelWidth, width: 180, newline: true, type: "select",
                            options: {
                                type: "select",
                                data: me.ProviderName,
                                onChangeValue: function (inputDom, selectedId, obj) {
                                    me.viewForm.setData({
                                        PROVIDER_NAME: obj.selected ? obj.selected.TEXT : ""
                                    });
                                }
                            }
                        },
                        {
                            display: "部门", name: "DEPT_ID", labelWidth: me.formLabelWidth, newline: true, type: "select",
                            options: {
                                type: 'select', data: me.DeptData,
                                onChangeValue: function (input, value, g) {
                                    if (g.selected) {
                                        var mainform = this.options.host_form;
                                        mainform.setData({ DEPT_NAME: g.selected.TEXT });
                                    } else {
                                        var mainform = this.options.host_form;
                                        mainform.setData({ DEPT_NAME: '' });
                                    }
                                }
                            }, validate: { required: true }
                        },
                        //隐藏
                        { display: "SP_ID", name: "SP_ID", width: 180, type: "hidden" },
                        { display: "TYPE_ID", name: "TYPE_ID", width: 180, type: "hidden" },
                        { display: "供应商名", name: "PROVIDER_NAME", width: 180, type: "hidden" },
                        { display: "仓库CODE", name: "HOUSE_CODE", width: 180, type: "hidden" },
                        { display: "仓库名", name: "HOUSE_NAME", width: 180, type: "hidden" },
                        { display: "部门名", name: "DEPT_NAME", width: 180, type: "hidden" }
                    ],
                    space: 3,
                    validate: true,
                    onAfterSetFields: function (g) {
                        me.viewForm = g;
                    }
                });
                me.viewForm.setOrginData({ HOUSE_NAME: (nodeName == "仓库货位" ? "" : nodeName), HOUSE_ID: (nodeId == "ROOT" ? "" : nodeId), HOUSE_CODE: (nodeCode == "ROOT" ? "" : nodeCode) });
                var dialog = $.ligerDialog.open({
                    title: "库存初始化",
                    target: me.viewForm.form,
                    width: 700,
                    height: 600,
                    showMax: false,
                    showToggle: false,
                    showMin: false,
                    isResize: true,
                    slide: false,
                    allowClose: true,
                    isHidden: false,
                    buttons: [{
                        text: "选择物料", type: "info", onClick: function () {

                            var callback = function (list) {
                                if (list.length > 0) {
                                    me.viewForm.setData({
                                        "SP_ID": list[0].SP_ID,
                                        "SP_CODE": list[0].SP_CODE,
                                        "SP_NAME": list[0].SP_NAME,
                                        "SP_SIZE": list[0].SP_SIZE,
                                        "PRODUCE": list[0].PRODUCE,
                                        "UNIT": list[0].UNIT,
                                        "TYPE_NAME": list[0].TYPE_NAME,
                                        "TYPE_ID": list[0].TYPE_ID
                                    });
                                }
                            };

                            $.ligerDialog.open({
                                width: 980,
                                height: 600,
                                allowClose: true,
                                title: "挑选物资编码",
                                url: "../Base/base_spcatalogPop.html?MenuNo=" + me.menuNo,
                                isHidden: false,
                                showMax: false,
                                showToggle: false,
                                showMin: false,
                                isResize: true,
                                slide: false,
                                data: {
                                    isCancel: "0",
                                    single: true,
                                    mainReloadBtn: me.buttons[0],
                                    callback: callback
                                }
                            });
                        }
                    },{
                        text: "确定", type: "info", onClick: function () {
                            if (!me.viewForm.valid()) {
                                me.viewForm.showInvalid();
                                return;
                            }

                            var data = me.viewForm.getData();

                            if (data.SP_NAME == null || data.SP_NAME == '') {
                                LG.showError('请挑选物资!');
                                return;
                            }

                            if (data.STORE_NUM < 0 || data.TAX_PRICE < 0 || data.TAX_MONEY < 0 || data.NOTAX_PRICE < 0 || data.NOTAX_MONEY < 0) {
                                LG.showError('单价、总价等字段的输入不能小于0!');
                                return;
                            }

                            var changeRow = new Object();
                            changeRow["added"] = [data];
                            LG.ajax({
                                jsToken: true,
                                url: 'Material/SpStore/Save',
                                loading: '正在保存中...',
                                data: changeRow,
                                success: function () {
                                    dialog.hide();
                                    LG.showSuccess('保存成功');
                                    me.reload();
                                },
                                error: function (message) {
                                    LG.showError(message);
                                }
                            });
                        }
                    }, {
                        text: "取消", type: "cancel", onClick: function () {
                            dialog.hide();
                        }
                    }]
                });
                return;
            },
            delete: function () { //删除
                var me = this;
                var rows = me.grid.getSelectedRows();
                if (!rows || rows.length == 0) {
                    LG.tip("请选择行");
                    return;
                }
                $.ligerDialog.confirm('确定删除吗?', function (confirm) {
                    if (!confirm) return;
                    var changeRow = { deleted: rows };
                    LG.ajax({
                        jsToken: true,
                        url: 'Material/SpStore/Save',
                        loading: '正在删除中...',
                        data: changeRow,
                        success: function () {
                            LG.showSuccess('删除成功');
                            me.reload();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                });
            },
            save: function () { //保存
                var me = this;
                if (me.grid.endEdit() === false) return;
                if (!me.grid.isDataChanged) {
                    LG.showSuccess('无修改');
                    return;
                }
                if (!me.grid.validChangeRows()) return false;
                var changeRow = me.grid.getChangedRows();
                LG.ajax({
                    jsToken: true,
                    url: 'Material/SpStore/Save',
                    loading: '正在保存中...',
                    data: changeRow,
                    success: function () {
                        LG.showSuccess('保存成功');
                        me.grid.isDataChanged = false;
                        me.reload();
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            reloadTree: function () {
                var me = this;
                me.selectNode = me.tree.getSelected();
                me.tree.reload();
            },
            reload: function () { //刷新
                var me = this;
                me.buttons[0].click();
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Pdf',
                        text: '导出Pdf',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-pdf-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                LG.validate($("#storeform"), {
                    debug: true
                });
            },
            bindWaterGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.waterToolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Pdf',
                        text: '导出Pdf',
                        click: function (item) {
                            me.waterToolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-pdf-o"
                    }
                    ]
                });
                me.waterGrid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                LG.validate($("#waterform"), {
                    debug: true
                });
            },
            setTree: function () {
                var me = this;
                var rootValue = "ROOT";
                me.tree = $("#maintree").ligerTree({
                    url: "Material/SpStore/Tree",
                    parms: {},
                    nodeWidth: 160,
                    slide: false,
                    checkbox: false,
                    single: true,
                    needCancel: false,
                    idFieldName: 'HOUSE_CODE',
                    textFieldName: 'HOUSE_NAME',
                    parentIDFieldName: 'PARENTID',
                    iconClsFieldName: "ICON",
                    isExpand: 2,
                    onSuccess: function (data) {

                        data.forEach((a) => {
                            me.stockData.push({ ID: a.HOUSE_ID, TEXT: a.HOUSE_NAME, VALUE: a.HOUSE_CODE });
                        });
                        $(".l-tree .l-body span").each(function () {
                            var $this = $(this);
                            var text = $this.text();
                            $this.html('<acronym title="' + text + '"><span> ' + text + '</span></acronym>');
                        });
                        if (me.selectNode && me.selectNode.data) this.selectNode(me.selectNode.data.HOUSE_CODE);
                        else me.tree.selectNode(rootValue);
                    },
                    onSelect: function (node) {
                        var nodeData = node.data;
                        me.currentNode = node;
                        var where = {};
                        if (nodeData) {
                            var parentNo = nodeData.HOUSE_CODE;
                            $("#_search_HOUSE_CODE").val((parentNo == "ROOT" ? "" : parentNo));
                            where = {
                                rules: [],
                                groups: [{
                                    rules: [], op: "or"
                                }], op: "and"
                            };
                            if (parentNo === rootValue) {
                                parentNo = "";
                            } else {
                                where.groups[0].rules.push({ field: 'HOUSE_CODE', value: parentNo, op: 'startwith' });
                            }

                            me.grid.set('parms', { "where": JSON2.stringify(where) });
                            me.currentMenuParentNo = parentNo;
                            me.reload();
                        }
                    }
                });
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch = $("#formsearch")
                me.searchForm = $formsearch.ligerForm({
                    labelWidth: me.formLabelWidth,
                    inputWidth: me.formInputWidth,
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                    }
                });
            },
            init: function () {
                var me = this;
                $("#layout").ligerLayout({ leftWidth: 240 });
                me.loadComboxData();
                me.setConfig();
                me.setTab();
                me.setForm();
                me.setTree();
                me.setGrid();
                me.reload();
                me.setWaterGrid();
                me.reloadWater();
                return me;
            }
        };
        business.init();
    </script>
</body>

</html>
