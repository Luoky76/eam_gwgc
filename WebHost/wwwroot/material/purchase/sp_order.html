<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title></title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <div id="mainsearch" style="width: 98%">
        <form action="" id="formsearch" class="l-form">
        </form>
    </div>

    <form action="" id="mainform">
        <div style="float: left; width: 100%; height: 60%; ">
            <div id="maingrid" position="center" title="采购订单">
            </div>
        </div>
    </form>

    <div style="float: left; width: 100%; height: 40%; ">
        <div id="reqGrid" position="bottom" title="采购明细">
        </div>
    </div>
    <script type="text/javascript">
        'use strict';
        var business = {

            formLabelWidth: 80,
            formInputWidth: 180,
            getTextareaWidth: function () {
                var me = this;
                var fieldWidth = me.formLabelWidth + me.formInputWidth + 3;
                return Math.floor(($("#mainform").width() - 10) / fieldWidth) * fieldWidth - (me.formLabelWidth + 3);
            },
rootPath: 'Material/SpOrder/',
            MenuNo: getQueryStringByName("MenuNo"),
            dataCheck: [{ "ID": "0", "TEXT": "未提交" }, { "ID": "1", "TEXT": "已提交" }],
            gyData: [],
            typeData: [],
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            { display: "下单年份", name: "_search_BDATE", newline: false, userSearch: false, showTime: false, labelWidth: me.formLabelWidth, width: 100, op: 'equal', type: "date", options: { format: "yyyy" }, },
                            { display: "记录状态", name: "_search_AUDITING", dbname: "AUDITING", newline: false, upper: true, type: "select", options: { data: me.dataCheck } },
                            { display: "订单号", name: "_search_ORDER_CODE", dbname: "ORDER_CODE", newline: false, upper: true, type: "text", options: {} },
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "已提交", name: "AUDITING", width: 100, type: "chk" },
                            { display: "订单号", name: "ORDER_CODE", width: 180, type: "text" },
                            { display: "订单类型", name: "ORDER_TYPE", width: 150, type: "select", editor: { type: 'select', data: me.typeData }, validate: { required: true }, },
                            { display: "下单日期", name: "ORDER_DATE", width: 150, type: "date", format: "yyyy-MM-dd", editor: { type: 'date', format: "yyyy-MM-dd", }, validate: { required: true }, },
                            { display: "申购公司", name: "DEPT_NAME", width: 180, type: "text", },
                            { display: "采购员", name: "BUY_USER", width: 120, type: "text", },
                            { display: "订单金额(元)", name: "ORDER_MONEY", width: 120, type: "number", editor: { type: 'number' }, },
                            {
                                display: "供应商", name: "PROVIDER_ID", dbname: "PROVIDER_ID", labelWidth: me.formLabelWidth, width: 180, newline: true, type: "select", editor: {
                                    type: 'select',
                                    options: {
                                        autocomplete: true,
                                        data: me.gyData
                                    },
                                    onChange: function (rowdata, rowIndex) {
                                        if (rowdata.value) {
                                            liger.get("maingrid").updateCell("PROVIDER_NAME", me.gyData.find((a) => a.ID == rowdata.value).TEXT, rowdata.record);
                                        } else {
                                            liger.get("maingrid").updateCell("PROVIDER_NAME", "", rowdata.record);
                                        }
                                    }
                                }
                            },
                            { display: "相关流程", name: "REQUEST_NAME", width: 150, type: "text", },
                            { display: "备注", name: "MEMO", width: 120, type: "text", editor: { type: 'text' }, },
                            { display: "主键", name: "ORDER_ID", width: 100, type: "text", hide: true },
                            { display: "供应商名", name: "PROVIDER_NAME", width: 100, type: "text", hide: true },
                        ],
                        columns2: [
                            { display: "物料编码", name: "SP_CODE", width: 150, type: "text", },
                            { display: "物料名称", name: "SP_NAME", width: 150, type: "text", },
                            { display: "型号规格", name: "SP_SIZE", width: 150, type: "text", },
                            {
                                display: "申请单号", name: "APPLY_NO", width: 150, type: "text",
                                totalSummary:
                                {
                                    render: function (suminf, column, cell) {
                                        return '<div>合计</div>';
                                    },
                                    align: 'center'
                                }
                            },
                            { display: "要求交货日期", name: "REQ_DATE", type: "date", format: "yyyy-MM-dd", width: 120, editor: { format: "yyyy-MM-dd", type: 'date' }, },
                            { display: "申请人", name: "APPLY_USER", width: 150, type: "text", },
                            { display: "申请部门", name: "DEPT_NAME", width: 150, type: "text", },
                         /*   { display: "二级单位", name: "SEC_DEPT", width: 150, type: "text", },*/

                            { display: "品牌、厂家", name: "PRODUCE", width: 150, type: "text", },
                            { display: "物料分类", name: "TYPE_NAME", width: 150, type: "text", },
                            {
                                display: "订单数量", name: "COUNT", width: 150, type: "decimal", totalSummary:
                                {
                                    type: 'sum',
                                    align: 'center'
                                }
                            },
                            { display: "终止数量", name: "STOP_NUM", width: 150, type: "decimal", },
                            {
                                display: "含税单价(元)", name: "PRICE", width: 150, type: "text", totalSummary:
                                {
                                    type: 'sum',
                                    align: 'center'
                                }
                            },
                            { display: "计量单位", name: "UNIT", width: 150, type: "text", },
                            {
                                display: "总金额(元)", name: "MONEY", width: 150, type: "text", totalSummary:
                                {
                                    type: 'sum',
                                    align: 'center'
                                }
                            },
                            { display: "备注", name: "MEMO", width: 120, type: "text", editor: { type: 'text' } },
                            { display: "ORDER_ID", name: "ORDER_ID", dbname: "ORDER_ID", width: 100, type: "text", hide: true },
                            { display: "主键", name: "ORDERDET_ID", dbname: "ORDERDET_ID", width: 100, type: "text", hide: true },
                        ]
                    }
                };
            },
            grid: null,
            searchForm: null,
            buttons: null,
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: me.rootPath + 'ComboxData',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        me.gyData = data.ProviderName;
                        me.typeData = data.BCCode;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    autoWidth: false,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    usePager: false,
                    toolbar: { group: "list" },
                    url: me.rootPath + 'List',
                    parms: {
                        YEAR:"",
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: 'CREATEDATE',
                    sortOrder: 'DESC',
                    width: '98%',
                    height: '60%',
                    checkbox: true,
                    enabledEdit: true,
                    clickToEdit: true,
                    onBeforeEdit: function (editParm) {
                        if (editParm.record.__status == "nochanged") {
                            if (editParm.record.AUDITING == "1") return false;
                            else return true;
                        }
                        switch (editParm.column.name) {
                            case "":
                                if (editParm.record.__status == "add") return true;
                                else return false;
                                break;
                        }
                    },
                    onSuccess: function (data, g) {
                        if (data && data.Rows) {
                            var rows = data.Rows || [];
                            for (var i = 0, len = rows.length; i < len; i++) {
                                var row = rows[i];
                                row.OLDROLEID = row.ROLEID;
                            }
                        }
                    },
                    onSelectRow: function (rowdata, rowid) {
                        if (me.gridSelectId != rowdata.ORDER_ID) {
                            me.gridSelectId = rowdata.ORDER_ID;
                            me.gridAuditing = rowdata.AUDITING;
                            me.gridReq.options.parms = { ORDER_ID: me.gridSelectId };
                            me.gridReq.loadData();
                        }
                    },
                });
                me.grid.isValid = true;
                me.loadToolbar();
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "save":
                            me.save();
                            break;
                        case "submit":
                            me.submit();
                            break;
                        case "cancelSubmit":
                            me.cancelSubmit();
                            break;
                        case "export":
                            me.export();
                            break;
                    }
                }
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            setGridReq: function () {
                var me = this;
                me.config.grid.columns2.removeNull();
                me.gridReq = $("#reqGrid").ligerGrid({
                    autoWidth: false,
                    delayLoad: true,
                    columns: me.config.grid.columns2,
                    usePager: false,
                    toolbar: { group: "detail" },
                    url: me.rootPath + 'DetList',
                    parms: {
                        ORDER_ID: "",
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: 'CREATEDATE',
                    sortOrder: 'DESC',
                    width: '98%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: true,
                    clickToEdit: true,
                    onBeforeEdit: function (editParm) {
                        if (editParm.record.__status == "nochanged") {
                            if (me.gridAuditing == "1") return false;
                            else return true;
                        }
                    },
                });
                me.gridReq.isValid = true;
                me.loadToolbarReq();
            },
            loadToolbarReq: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "saveDetail":
                            me.saveDetail();
                            break;
                    }
                }
                LG.loadToolbar(me.gridReq, me.toolbarBtnItemClick);
            },
            save: function () { //保存
                var me = this;
                if (me.grid.endEdit() != false) {
                    if (!me.grid.isDataChanged) {
                        LG.showSuccess('无修改');
                        return;
                    }
                    if (!me.grid.validChangeRows()) return false;

                    var changeRow = me.grid.getChangedRows();
                    LG.ajax({
                        jsToken: true,
                        url: me.rootPath + 'Save',
                        loading: '正在保存中...',
                        data: changeRow,
                        success: function () {
                            LG.showSuccess('保存成功');
                            me.grid.isDataChanged = false;
                            me.reload();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }

            },
            reload: function () { //刷新
                var me = this;
                me.buttons[0].click();
            },
            export: function () { //模板导出
                var me = this;
                var rules = LG.bulidFilterGroup(me.searchForm.id);
                var year = "";
                var date = liger.get('_search_BDATE').getValue();
                if (date) {
                    year = date.getFullYear();
                }
                LG.download({
                    url: me.rootPath + 'ExportExcelTemplate',
                    type: "post",
                    loading: '正在导出中...',
                    data: { where: JSON2.stringify(rules), YEAR: year },
                    callback: function (status, data) {
                        if (status) {
                            LG.showSuccess(data.Message);
                        }
                        else LG.showError(data.Message);
                    }
                });
            },
            submit: function () {    //提交
                var me = this;
                var selected = me.grid.getSelectedRows();
                if (selected.length > 0) {
                    if (selected[0].AUDITING == null) {
                        LG.tip('请先保存!');
                    }
                    else if (selected[0].AUDITING != "0") {
                        LG.tip('已提交，无法再次提交!');
                    }
                    else {
                        var flag = true;
                        var sids = [];
                        selected.forEach((a) => {
                            if (a.AUDITING != "0") {
                                LG.tip(a.ORDER_CODE + '已提交，无法再次提交!');
                                flag = false;
                                return;
                            }
                            if (a.ORDER_TYPE == null) {
                                LG.tip(a.ORDER_CODE + '订单类型不能空!');
                                flag = false;
                                return;
                            }
                            sids.push(a.ORDER_ID)
                        })
                        if (!flag) {
                            return;
                        }

                        LG.ajax({
                            jsToken: true,
                            url: me.rootPath + 'Submit',
                            loading: '正在保存中...',
                            data: { "sids": sids },
                            success: function () {
                                LG.showSuccess('提交成功');
                                me.grid.isDataChanged = false;
                                me.reload();
                            },
                            error: function (message) {
                                LG.showError(message);
                            }
                        });
                    }

                }
                else {
                    LG.tip('请选择行!');
                }
            },
            cancelSubmit: function () {    //撤销
                var me = this;
                var selected = me.grid.getSelectedRows();
                if (selected.length > 0) {
                    var flag = true;
                    var sids = [];
                    selected.forEach((a) => {
                        if (a.AUDITING != "1") {
                            LG.tip(a.ORDER_CODE + '未提交!');
                            flag = false;
                            return;
                        }
                        sids.push(a.ORDER_ID)
                    })
                    if (!flag) {
                        return;
                    }

                    LG.ajax({
                        jsToken: true,
                        url: me.rootPath + 'Revoke',
                        loading: '正在撤销中...',
                        data: { "sids": sids },
                        success: function () {
                            LG.showSuccess('撤销成功');
                            me.grid.isDataChanged = false;
                            me.reload();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }
                else {
                    LG.tip('请选择行!');
                }
            },
            saveDetail: function () { //保存
                var me = this;
                if (me.gridReq.endEdit() != false) {
                    if (!me.gridReq.isDataChanged) {
                        LG.showSuccess('无修改');
                        return;
                    }
                    if (!me.gridReq.validChangeRows()) return false;

                    var changeRow = me.gridReq.getChangedRows();
                    LG.ajax({
                        jsToken: true,
                        url: me.rootPath + 'DetSave',
                        loading: '正在保存中...',
                        data: changeRow,
                        success: function () {
                            LG.showSuccess('保存成功');
                            me.gridReq.isDataChanged = false;
                            me.reload();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }

            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch = $("#formsearch")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    labelWidth: me.formLabelWidth,
                    inputWidth: me.formInputWidth,
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            var date = liger.get('_search_BDATE').getValue();
                            if (date) {
                                me.grid.options.parms.YEAR = date.getFullYear();
                            }
                            LG.commonSearch($formsearch, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;

                        me.searchForm.setData({ "_search_BDATE": new Date() });
                    }
                });
            },
            init: function () {
                var me = this;

                me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.setGrid();
                me.setGridReq();
                me.reload();
                return me;
            }
        };
        business.init();
    </script>
</body>
</html>
