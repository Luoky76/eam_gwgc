<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title></title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <div id="mainsearch" style="width: 98%">
        <form action="" id="formsearch" class="l-form">
        </form>
    </div>
    <form action="" id="mainform">
        <div id="maingrid">
        </div>
    </form>
    <script type="text/javascript">
        'use strict';
        var business = {
            rootPath:'Material/SpApply/',
            MenuNo: getQueryStringByName("MenuNo"),
            //明细页面大小
            detailWidth: null,
            detailHeight: null,
            setDialogSize: function () {
                var me = this;
                me.detailWidth = window.innerWidth * 0.9;
                me.detailHeight = window.innerHeight * 0.9;
            },
            typeData: [],
            exigData: [],
            cgfsData: [],
            Auditing: [],
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            { display: "记录状态", name: "_search_AUDITING", dbname: "AUDITING", newline: false, upper: true, type: "select", options: { data: me.Auditing } },
                            { display: "申请单号", name: "_search_APPLY_NO", dbname: "APPLY_NO", newline: false, upper: true, type: "text", options: {} },
                        ]
                    },
                    grid: {
                        columns: [
                            {
                                display: "已提交", name: "AUDITING", width: 100, type: "select", editor: {
                                    type: "select",
                                    data: me.Auditing
                                }
                            },
                            { display: "申请单号", name: "APPLY_NO", width: 180, type: "text" },
                            {
                                display: "采购分类", name: "TYPE_ID", minWidth: 150, type: "select", validate: { required: true },
                                editor: {
                                    type: 'select',
                                    data: me.typeData,
                                    onChange: function (rowdata, rowIndex) {
                                        if (rowdata.value) {
                                            for (var i = 0; i < me.typeData.length; i++) {
                                                if (rowdata.value == me.typeData[i].ID) {
                                                    liger.get("maingrid").updateCell("TYPE_NAME", me.typeData[i].TEXT, rowdata.record);
                                                    liger.get("maingrid").updateCell("TYPE_CODE", me.typeData[i].VALUE, rowdata.record);
                                                    break;
                                                }
                                            }
                                        } else {
                                            liger.get("maingrid").updateCell("TYPE_NAME", "", rowdata.record);
                                            liger.get("maingrid").updateCell("TYPE_CODE", "", rowdata.record);
                                        }
                                    },
                                }
                            },
                            { display: "紧急程度", name: "EXIG_DEV", width: 120, type: "select", editor: { type: 'select', data: me.exigData }, validate: { required: true }, },
                            { display: "用途", name: "USE_MEMO", width: 150, type: "text", editor: { type: 'text' }, validate: { required: true }, },
                            { display: "申请人", name: "APPLY_USER", width: 100, type: "text", },
                            { display: "申请部门", name: "DEPT_NAME", width: 150, type: "text", },
                            { display: "申请日期", name: "APPLY_DATE", width: 150, type: "date", format: "yyyy-MM-dd", },
                            { display: "备注", name: "MEMO", width: 120, type: "text", editor: { type: 'text' }, },
                            { display: "采购分类名", name: "TYPE_NAME", width: 100, type: "text", hide: true },
                            { display: "采购分类编码", name: "TYPE_CODE", width: 100, type: "text", hide: true },
                            { display: "主键", name: "APPLY_ID", dbname: "APPLY_ID", width: 100, type: "text", hide: true },
                        ]
                    }
                };
            },
            grid: null,
            searchForm: null,
            buttons: null,
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: me.rootPath+ 'ComboxData',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        me.typeData = data.BasePurtype
                        me.exigData = data.BCCode;
                        me.cgfsData = data.CGFS;
                        me.Auditing = data.Auditing;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    autoWidth: true,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    usePager: false,
                    toolbar: { group: 'list'},
                    url: me.rootPath + 'List',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: '',
                    sortOrder: '',
                    width: '98%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: false,
                    clickToEdit: false,
                    onBeforeEdit: function (editParm) {
                        if (editParm.record.__status == "nochanged") {
                            if (editParm.record.AUDITING == "1") return false;
                            else return true;
                        }
                        switch (editParm.column.name) {
                            case "":
                                if (editParm.record.__status == "add") return true;
                                else return false;
                                break;
                        }
                    },
                    onSuccess: function (data, g) {
                        if (data && data.Rows) {
                            var rows = data.Rows || [];
                            for (var i = 0, len = rows.length; i < len; i++) {
                                var row = rows[i];
                                row.OLDROLEID = row.ROLEID;
                            }
                        }
                    },
                    rowAttrRender: function (rowdata, rowid) {
                        return "";
                    },
                    onDblClickRow: function (data, rowid, rowdata) {
                        me.view(rowid);
                    }
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            isSelectRow: function () {
                var me = this;
                var rows = me.grid.getSelectedRows();
                if (rows.length == 0) {
                    LG.tip("请选择一行");
                    return false;
                }
                return true;
            },
            isSelectSingleRow: function () {
                var me = this;
                var rows = me.grid.getSelectedRows();
                if (rows.length > 1) {
                    LG.tip("不能选择多行");
                    return false;
                } else if (rows.length == 0) {
                    LG.tip("请选择一行");
                    return false;
                }
                return true;
            },
            isAudited: function () {
                var me = this;
                var selecteds = me.grid.getSelectedRows();
                for (let row of selecteds) {
                    if (row.AUDITING == "1") {
                        LG.tip("有数据已提交，无法变更！");
                        return true;
                    }
                }
                return false;
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "add":
                            me.add();
                            break;
                        case "modify":
                            if (!me.isSelectSingleRow() || me.isAudited()) break;
                            me.modify();
                            break;
                        case "delete":
                            if (!me.isSelectRow() || me.isAudited()) break;
                            me.delete();
                            break;
                        case "submit":
                            if (!me.isSelectSingleRow() || me.isAudited()) break;
                            me.submit();
                            break;
                        case "cancelSubmit":
                            if (!me.isSelectSingleRow()) break;
                            me.cancelSubmit();
                            break;
                        case "detail":
                            if (!me.isSelectSingleRow()) break;
                            me.detail();
                            break;
                        case "Excel":
                            $.ligerDialog.open({
                                url: "../System/Export.html?exporttype=xls",
                                modal: true
                            });
                            break;
                        case "Word":
                            $.ligerDialog.open({
                                url: "../System/Export.html?exporttype=doc",
                                modal: true
                            });
                            break;
                    }
                }
            
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            view: function (rowid) { //查看
                var me = this;
                var selected = me.grid.records[rowid];
                $.ligerDialog.open({
                    width: me.detailWidth,
                    height: me.detailHeight,
                    allowClose: true,
                    title: '[查看]物资申请',
                    url: "sp_apply_detail.html?MenuNo=" + me.MenuNo,
                    isHidden: false,
                    showMax: false,
                    showToggle: false,
                    showMin: false,
                    isResize: true,
                    slide: false,
                    onClosed: me.reload.bind(me),
                    data: { "Sid": selected.APPLY_ID, "view": true }
                });
            },
            add: function () { //新增
                var me = this;
                $.ligerDialog.open({
                    width: me.detailWidth,
                    height: me.detailHeight,
                    allowClose: true,
                    title: '[新增]物资申请',
                    url: "sp_apply_detail.html?MenuNo=" + me.MenuNo,
                    isHidden: false,
                    showMax: false,
                    showToggle: false,
                    showMin: false,
                    isResize: true,
                    slide: false,
                    onClosed: me.reload.bind(me),
                    data: { "Sid": null, "view": false }
                });
            },
            modify: function (rowdata) { //修改
                var me = this;
                var rows = me.grid.getSelectedRows();
                if (rows.length > 1) {
                    LG.showError("不能选择多行")
                    return
                } else if (rows.length == 0) {
                    LG.showError("请选择一行")
                    return
                }

                var selected = rows[0];
                if (rowdata) {
                    selected = rowdata;
                }
                if (selected) {
                    $.ligerDialog.open({
                        width: me.detailWidth,
                        height: me.detailHeight,
                        allowClose: true,
                        title: '[修改]物资申请',
                        url: "sp_apply_detail.html?MenuNo=" + me.MenuNo,
                        isHidden: false,
                        showMax: false,
                        showToggle: false,
                        showMin: false,
                        isResize: true,
                        slide: false,
                        onClosed: me.reload.bind(me),
                        data: { "Sid": selected.APPLY_ID, "view": false }
                    });
                } else {
                    LG.tip('请选择行!');
                }
            },
            save: function () { //保存
                var me = this;
                if (me.grid.endEdit() != false) {
                    if (!me.grid.isDataChanged) {
                        LG.showSuccess('无修改');
                        return;
                    }
                    if (!me.grid.validChangeRows()) return false;
                    var changeRow = me.grid.getChangedRows();
                    LG.ajax({
                        jsToken: true,
                        url: me.rootPath + 'Save',
                        loading: '正在保存中...',
                        data: { request: changeRow, requestdet: null },
                        success: function (message, data) {
                            me.grid.isDataChanged = false;
                            me.reload();
                            LG.showSuccess('保存成功');
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }

            },
            reload: function () { //刷新
                var me = this;
                me.buttons[0].click();
            },
            delete: function () { //删除
                var me = this;
                if (me.grid.endEdit() != false) {
                    var selected = me.grid.getSelectedRows();
                    if (selected.length > 0) {
                        if (selected[0].AUDITING == "1") {
                            LG.tip('已提交，无法删除!');
                        }
                        else {
                            $.ligerDialog.confirm('确定删除吗?', function (confirm) {
                                if (confirm) {
                                    for (var i = 0, len = (selected || []).length; i < len; i++) {
                                        me.grid.deleteRow(selected[i]);
                                    }
                                    me.save();
                                }
                            });
                        }
                    } else {
                        LG.tip('请选择行!');
                    }
                }
            },
            submit: function () {    //提交
                var me = this;
                var selected = me.grid.getSelectedRows();
                if (selected.length > 0) {
                    if (selected[0].AUDITING == null) {
                        LG.tip('请先保存!');
                    }
                    else if (selected[0].AUDITING != "0") {
                        LG.tip('已提交，无法再次提交!');
                    }
                    else {
                        var flag = true;
                        var sids = [];
                        selected.forEach((a) => {
                            if (a.AUDITING != "0") {
                                LG.tip(a.APPLY_NO + '已提交，无法再次提交!');
                                flag = false;
                                return;
                            }

                            if (a.DETAILCOUNT == 0) {
                                LG.tip(a.APPLY_NO + '未填写明细，无法提交!');
                                flag = false;
                                return;
                            }
                            sids.push(a.APPLY_ID)
                        })
                        if (!flag) {
                            return;
                        }

                        LG.ajax({
                            jsToken: true,
                            url: me.rootPath + 'Submit',
                            loading: '正在保存中...',
                            data: { "sids": sids },
                            success: function () {
                                LG.showSuccess('提交成功');
                                me.grid.isDataChanged = false;
                                me.reload();
                            },
                            error: function (message) {
                                LG.showError(message);
                            }
                        });
                    }

                }
                else {
                    LG.tip('请选择行!');
                }
            },
            cancelSubmit: function () {    //撤销
                var me = this;
                var selected = me.grid.getSelectedRows();
                if (selected.length > 0) {
                    var flag = true;
                    var sids = [];
                    selected.forEach((a) => {
                        if (a.AUDITING == "0") {
                            LG.tip(a.APPLY_NO + '未提交!');
                            flag = false;
                            return;
                        }
                        sids.push(a.APPLY_ID)
                    })
                    if (!flag) {
                        return;
                    }

                    LG.ajax({
                        jsToken: true,
                        url: me.rootPath + 'CancelSubmit',
                        loading: '正在撤销中...',
                        data: { "sids": sids },
                        success: function () {
                            LG.showSuccess('撤销成功');
                            me.grid.isDataChanged = false;
                            me.reload();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }
                else {
                    LG.tip('请选择行!');
                }
            },
            detail: function () { //明细
                var me = this;
                if (me.grid.getSelectedRows().length != 1) {
                    LG.showError("请选择一条记录");
                    return
                }

                $.ligerDialog.open({
                    width: me.detailWidth,
                    height: me.detailHeight,
                    allowClose: true,
                    title: '[修改采购明细]',
                    url: "sp_apply_detail.html?MenuNo=" + me.MenuNo + "&ver=" + me.ver,
                    isHidden: false,
                    showMax: false,
                    showToggle: false,
                    showMin: false,
                    isResize: true,
                    slide: false,
                    onClosed: me.reload.bind(me),
                    data: { "Sid": apply.APPLY_ID, "view": apply.AUDITING != "0" }
                });
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Word',
                        text: '导出Word',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-word-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch = $("#formsearch")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                    }
                });
            },
            init: function () {
                var me = this;
                me.loadComboxData();
                me.setConfig();
                me.setDialogSize();
                me.setForm();
                me.setGrid();
                me.reload();
                return me;
            }
        };
        business.init();
    </script>
</body>
</html>
