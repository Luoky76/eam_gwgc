<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title>物资需求确认</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <div id="mainsearch" style="width: 98%">
        <form action="" id="formsearch" class="l-form">
        </form>
    </div>
    <form action="" id="mainform">
        <div id="maingrid">
        </div>
    </form>
    <script type="text/javascript">
        'use strict';
        var business = {

            formLabelWidth: 120,
            formInputWidth: 180,
            getTextareaWidth: function () {
                var me = this;
                var fieldWidth = me.formLabelWidth + me.formInputWidth + 3;
                return Math.floor(($("#mainform").width() - 10) / fieldWidth) * fieldWidth - (me.formLabelWidth + 3);
            },
rootPath: 'Material/SpApply/',
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            {
                                display: "通用搜索",
                                name: "_search_all",
                                hideLabel: true,
                                filter: [
                                    { op: "like", field: "SP_NAME", type: "string" },
                                    { op: "like", field: "SP_CODE", type: "string" },
                                    { op: "like", field: "SP_SIZE", type: "string" },
                                    { op: "like", field: "PRODUCE", type: "string" },
                                    { op: "like", field: "TYPE_NAME", type: "string" },
                                    { op: "like", field: "MEMO", type: "string" },
                                    { op: "like", field: "APPLY_NO", type: "string" },
                                    { op: "like", field: "APPLY_USER", type: "string" },
                                    { op: "like", field: "DEPT_NAME", type: "string" }
                                ],
                            },
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "确认状态", name: "AUDITING_CHECK", dbname: "AUDITING_CHECK", width: 80, type: "text", formatType: "chk" },
                            { display: "物料名称", name: "SP_NAME", width: 150, type: "text", editor: { type: "text", }, validate: { required: true } },
                            {
                                display: "数量", name: "COUNT", type: "number", width: 80, editor: {
                                    type: 'number', onChangeValue: function (input, value, g) {
                                        var editParm = g.options.editParm.record;
                                        editParm["YG_MONEY"] = ((editParm.YG_PRICE || 0) * value).toFixed(2);
                                    }
                                }, validate: { required: true },
                            },
                            { display: "计量单位", name: "UNIT", width: 150, type: "select", editor: { type: 'select', data: me.SpUnit } },
                            { display: "型号规格", name: "SP_SIZE", width: 150, type: "text", editor: { type: "text", } },
                            { display: "品牌、厂家", name: "PRODUCE", width: 150, type: "text", editor: { type: "text", } },
                            { display: "物料分类", name: "TYPE_NAME", width: 150, type: "text", },
                            { display: "说明", name: "MEMO", minWidth: 120, maxWidth: 500, type: "text", editor: { type: 'text' } },
                            { display: "库存数量", name: "STORE_NUM", width: 150, type: "decimal", hide: true },
                            { display: "质保期(月)", name: "WARRANTY", width: 150, type: "text", },
                            { display: "上次供应商", name: "LAST_PROVIDER", width: 150, type: "text", },
                            {
                                display: "预估单价(元)", name: "YG_PRICE", width: 120, type: "number", editor: {
                                    type: 'number', onChangeValue: function (input, value, g) {
                                        var editParm = g.options.editParm.record;
                                        editParm["YG_MONEY"] = (value * (editParm.COUNT || 0)).toFixed(2);
                                    }
                                }
                            },
                            { display: "预估金额(元)", name: "YG_MONEY", width: 120, type: "number" },
                            { display: "是否协议", name: "IS_XY", dbname: "IS_XY", width: 80, type: "text", formatType: "chk", editor: { type: 'chkStr' } },
                            { display: "物料ID", name: "SP_ID", dbname: "SP_ID", width: 100, type: "text", hide: true },
                            { display: "上次供应商ID", name: "LAST_PROVIDERID", dbname: "LAST_PROVIDERID", width: 100, type: "text", hide: true },
                            { display: "APPLY_ID", name: "APPLY_ID", dbname: "APPLY_ID", width: 100, type: "text", hide: true },
                            { display: "主键", name: "SPDET_ID", dbname: "SPDET_ID", width: 100, type: "text", hide: true },

                            { display: "物料编码", name: "SP_CODE", width: 150, type: "text" },
                            { display: "申请单号", name: "APPLY_NO", width: 150, type: "text" },
                            { display: "申请人", name: "APPLY_USER", width: 150, type: "text" },
                            { display: "申请部门", name: "DEPT_NAME", width: 150, type: "text" },
                            { display: "申请日期", name: "APPLY_DATE", width: 150, type: "date", format: "yyyy-MM-dd" },
                        ]
                    }
                };
            },
            grid: null,
            searchForm: null,
            buttons: null,
            BasePurtype: [],
            BCCode: [],
            SpUnit: [],
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: me.rootPath + 'ComboxData',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        me.BasePurtype = data.BasePurtype
                        me.BCCode = data.BCCode;
                        me.SpUnit = data.SpUnit;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    title: '<input id="showChecked" />',
                    rownumbers: true,
                    autoWidth: true,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    usePager: true,
                    dataAction: 'server',
                    toolbar: {},
                    url: me.rootPath + 'GetCheckList',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: 'AUDITING_CHECK asc, APPLY_DATE',
                    sortOrder: 'desc',
                    width: '98%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: true,
                    clickToEdit: true,
                    onBeforeEdit: function (editParm) {
                        if (editParm.record.AUDITING_CHECK == "1") return false;
                        return true;
                    },
                    onSuccess: function (data, g) {
                        if (data && data.Rows) {
                            var rows = data.Rows || [];
                            for (var i = 0, len = rows.length; i < len; i++) {
                                var row = rows[i];
                                row.OLDROLEID = row.ROLEID;
                            }
                        }
                    },
                    rowAttrRender: function (rowdata, rowid) {
                        return "";
                    }
                });
                //设置是否展示已确认记录按钮
                $("#showChecked").ligerCheckBox({
                    type: "switch",
                    label: "展示已确认记录",
                    value: false,
                    initTrigger: true,
                    onChangeValue: function (input, value, g) {
                        if (value) {
                            me.grid.set('parms', {
                                "where": JSON2.stringify({
                                    op: "and",
                                    rules: []
                                })
                            });
                        }
                        else {
                            me.grid.set('parms', {
                                "where": JSON2.stringify({
                                    op: "and",
                                    rules: [{ field: 'AUDITING_CHECK', value: 0, op: 'equal' }]
                                })
                            });
                        }
                        me.reload();
                    }
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            isSelectRow: function () {
                var me = this;
                var rows = me.grid.getSelectedRows();
                if (rows.length == 0) {
                    LG.tip("请选择一行");
                    return false;
                }
                return true;
            },
            isSelectSingleRow: function () {
                var me = this;
                var rows = me.grid.getSelectedRows();
                if (rows.length > 1) {
                    LG.tip("不能选择多行");
                    return false;
                } else if (rows.length == 0) {
                    LG.tip("请选择一行");
                    return false;
                }
                return true;
            },
            isAllAudited: function ({ msg = "未提交数据，无需撤销！" } = {}) {
                var me = this;
                var selecteds = me.grid.getSelectedRows();
                for (let row of selecteds) {
                    if (!["1", "2", "3"].includes(row.AUDITING_CHECK)) {
                        if (msg) {
                            LG.tip(msg);
                        }
                        return false;
                    }
                }
                return true;
            },
            isAllUnaudited: function ({ msg = "有数据已提交，无法变更！" } = {}) {
                var me = this;
                var selecteds = me.grid.getSelectedRows();
                for (let row of selecteds) {
                    if (["1", "2", "3"].includes(row.AUDITING_CHECK)) {
                        if (msg) {
                            LG.tip(msg);
                        }
                        return false;
                    }
                }
                return true;
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "add":
                            me.add();
                            break;
                        case "submit":
                            //if (me.isSelectSingleRow() && me.isAllUnaudited()) {
                            if (me.isAllUnaudited()) {
                                me.submit();
                            }
                            break;
                        case "revoke":
                            if (me.isSelectSingleRow() && me.isAllAudited()) {
                                me.revoke();
                            }
                            break;
                        case "delete":
                            if (me.isSelectSingleRow()) {
                                me.delete();
                            }
                            break;
                        case "save":
                            me.save();
                            break;
                        case "Excel":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=xls", window.gksybConfigs.urlBase), modal: true });
                            break;
                        case "Pdf":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=pdf", window.gksybConfigs.urlBase), modal: true });
                            break;
                    }
                }
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            add: function () { //新增
                var me = this;
                me.grid.addEditRow({}, true);
            },
            save: function () { //保存
                var me = this;
                if (me.grid.endEdit() != false) {
                    if (!me.grid.isDataChanged) {
                        LG.showSuccess('无修改');
                        return;
                    }
                    if (!me.grid.validChangeRows()) return false;
                    var changeRow = me.grid.getChangedRows();
                    LG.ajax({
                        jsToken: true,
                        url: me.rootPath + 'SaveCheckList',
                        loading: '正在保存中...',
                        data: changeRow,
                        success: function () {
                            LG.showSuccess('保存成功');
                            me.grid.isDataChanged = false;
                            me.reload();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }

            },
            reload: function () { //刷新
                var me = this;
                me.buttons[0].click();
            },
            delete: function () { //删除
                var me = this;
                if (me.grid.endEdit() != false) {
                    $.ligerDialog.confirm('确定删除吗?', function (confirm) {
                        if (confirm) {
                            me.grid.deleteSelectedRow();
                            me.save();
                        }
                    });
                }
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Pdf',
                        text: '导出Pdf',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-pdf-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            submit: function () {
                var me = this;
                var selecteds = me.grid.getSelectedRows();
                var ids = [];
                for (let row of selecteds) {
                    ids.push(row.SPDET_ID);
                }
                if (ids != '') {
                    LG.ajax({
                        jsToken: true,
                        url: me.rootPath + 'SubmitCheckList',
                        loading: '正在保存中...',
                        data: { "sids": ids },
                        success: function () {
                            LG.showSuccess('确认成功');
                            me.grid.isDataChanged = false;
                            me.reload();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }
            },
            revoke: function () {
                var me = this;
                var selecteds = me.grid.getSelectedRows();
                var ids = [];
                for (let row of selecteds) {
                    ids.push(row.SPDET_ID);
                }
                if (ids != '') {
                    LG.ajax({
                        jsToken: true,
                        url: me.rootPath + 'RevokeCheckList',
                        loading: '正在撤销中...',
                        data: { "sids": ids },
                        success: function () {
                            LG.showSuccess('撤销成功');
                            me.grid.isDataChanged = false;
                            me.reload();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch = $("#formsearch")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    labelWidth: me.formLabelWidth,
                    inputWidth: me.formInputWidth,
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                    }
                });
            },
            init: function () {
                var me = this;
                me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.setGrid();
                me.reload();
                return me;
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>
</html>
