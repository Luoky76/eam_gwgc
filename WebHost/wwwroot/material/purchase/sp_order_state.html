<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title></title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <div id="mainsearch" style="width: 98%">
        <form action="" id="formsearch" class="l-form">
        </form>
    </div>

    <form action="" id="mainform">
        <div style="float: left; width: 100%; height: 60%; ">
            <div id="maingrid" position="center" title="采购订单">
            </div>
        </div>
    </form>

    <div style="float: left; width: 100%; height: 40%; ">
        <div id="reqGrid" position="bottom" title="采购明细">
        </div>
    </div>
    <script type="text/javascript">
        'use strict';
        var business = {

            formLabelWidth: 100,
            formInputWidth: 180,
            getTextareaWidth: function () {
                var me = this;
                var fieldWidth = me.formLabelWidth + me.formInputWidth + 3;
                return Math.floor(($("#mainform").width() - 10) / fieldWidth) * fieldWidth - (me.formLabelWidth + 3);
            },
rootPath: 'Material/SpOrder/',
            MenuNo: getQueryStringByName("MenuNo"),
            BCCode: [],
            OrderStatus: [],
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            { display: "订单状态", name: "_search_STATUS", dbname: "STATUS", newline: false, upper: true, type: "select", options: { type: "select", data: me.OrderStatus } },
                            { display: "订单号", name: "_search_ORDER_CODE", dbname: "ORDER_CODE", newline: false, upper: true, type: "text", options: {} },
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "订单状态", name: "STATUS", labelWidth: me.formLabelWidth, width: 100, newline: true, type: "select", format: { data: me.OrderStatus } },
                            { display: "订单号", name: "ORDER_CODE", width: 180, type: "text" },
                            { display: "下单日期", name: "ORDER_DATE", width: 150, type: "date", format: "yyyy-MM-dd", },

                            { display: "订单类型", name: "ORDER_TYPE", width: 180, type: "select", format: { data: me.BCCode } },
                            { display: "是否超期", name: "OVERDUE", width: 180, type: "text", formatType: "chk", },

                            { display: "订单金额(元)", name: "ORDER_MONEY", width: 120, type: "text", },
                            { display: "订单金额(元)", name: "ORDER_MONEY", width: 120, type: "text", },
                            { display: "采购员", name: "BUY_USER", width: 120, type: "text", },
                            { display: "申购公司", name: "DEPT_NAME", width: 100, type: "text", },
                            { display: "供应商", name: "PROVIDER_NAME", width: 100, type: "text", },
                            { display: "备注", name: "MEMO", width: 120, type: "text", },
                            { display: "主键", name: "ORDER_ID", width: 100, type: "text", hide: true },
                        ],
                        columns2: [
                            { display: "物料编码", name: "SP_CODE", width: 150, type: "text", },
                            { display: "物料名称", name: "SP_NAME", width: 150, type: "text", },
                            { display: "型号规格", name: "SP_SIZE", width: 150, type: "text", },
                            { display: "品牌、厂家", name: "PRODUCE", width: 150, type: "text", },
                            { display: "物料分类", name: "TYPE_NAME", width: 150, type: "text", },
                            { display: "计量单位", name: "UNIT", width: 150, type: "text", },
                            {
                                display: "订单数量", name: "COUNT", width: 150, type: "decimal", totalSummary:
                                {
                                    type: 'sum',
                                    align: 'center'
                                }
                            },
                            { display: "中止数量", name: "STOP_NUM", width: 150, type: "decimal", },
                            { display: "到货数量", name: "RECEIVE_COUNT", width: 150, type: "decimal", },
                            { display: "入库数量", name: "INSTORE_COUNT", width: 150, type: "decimal", },
                            { display: "开票数量", name: "INVOICE_NUM", width: 150, type: "decimal", },
                            {
                                display: "含税单价(元)", name: "PRICE", width: 150, type: "text", totalSummary:
                                {
                                    type: 'sum',
                                    align: 'center'
                                }
                            },
                            {
                                display: "总金额(元)", name: "MONEY", width: 150, type: "text", totalSummary:
                                {
                                    type: 'sum',
                                    align: 'center'
                                }
                            },
                            { display: "要求交货日期", name: "REQ_DATE", type: "date", format: "yyyy-MM-dd", width: 120, },
                            { display: "备注", name: "MEMO", width: 120, type: "text", editor: { type: 'text' } },
                            { display: "ORDER_ID", name: "ORDER_ID", dbname: "ORDER_ID", width: 100, type: "text", hide: true },
                            { display: "主键", name: "ORDERDET_ID", dbname: "ORDERDET_ID", width: 100, type: "text", hide: true },
                        ]
                    }
                };
            },
            grid: null,
            searchForm: null,
            buttons: null,
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: me.rootPath + 'ComboxData',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        me.BCCode = data.BCCode;
                        me.OrderStatus = data.OrderStatus;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    autoWidth: false,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    usePager: false,
                    toolbar: {},
                    url: me.rootPath + 'OrderList',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: 'CREATEDATE',
                    sortOrder: 'DESC',
                    width: '98%',
                    height: '50%',
                    checkbox: true,
                    enabledEdit: false,
                    clickToEdit: false,
                    onSelectRow: function (rowdata, rowid) {
                        me.gridSelectId = rowdata.ORDER_ID;
                        me.gridReq.options.parms = { ORDER_ID: me.gridSelectId };
                        me.gridReq.loadData();

                    },
                });
                me.grid.isValid = true;
            },
            setGridReq: function () {
                var me = this;
                me.config.grid.columns2.removeNull();
                me.gridReq = $("#reqGrid").ligerGrid({
                    autoWidth: false,
                    delayLoad: true,
                    title:"订单明细完成情况",
                    columns: me.config.grid.columns2,
                    usePager: false,
                    toolbar: {},
                    url: me.rootPath + 'DetList',
                    parms: {
                        ORDER_ID: "",
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: 'CREATEDATE',
                    sortOrder: 'DESC',
                    width: '98%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: false,
                    clickToEdit: false
                });
                me.gridReq.isValid = true;
            },
            reload: function () { //刷新
                var me = this;
                me.buttons[0].click();
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch = $("#formsearch")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    labelWidth: me.formLabelWidth,
                    inputWidth: me.formInputWidth,
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                    }
                });
            },
            init: function () {
                var me = this;

                me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.setGrid();
                me.setGridReq();
                me.reload();
                return me;
            }
        };
        business.init();
    </script>
</body>
</html>
