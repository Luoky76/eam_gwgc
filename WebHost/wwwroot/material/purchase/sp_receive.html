<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title>收货登记</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <div id="mainsearch">
        <form action="" id="formsearch" class="l-form">
        </form>
    </div>
    <form action="" id="mainform">
        <div id="maingrid">
        </div>
    </form>
    <script type="text/javascript">'use strict';
        var business = {
            detailWidth: window.innerWidth * 0.9,
            detailHeight: window.innerHeight * 0.9,
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            {
                                display: "通用搜索",
                                name: "_search_all",
                                hideLabel: true,
                                filter: [
                                    { op: "like", field: "IN_CODE", type: "string" },
                                    { op: "like", field: "DEPT_NAME", type: "string" },
                                    { op: "like", field: "PROVIDER_NAME", type: "string" },
                                    { op: "like", field: "CONSIGNEE", type: "string" }
                                ],
                                options: {
                                    onEnter: function () {
                                        var me = this;
                                        var $formsearch = $("#formsearch");
                                        LG.commonSearch($formsearch, me.grid);
                                    }.bind(me)
                                },
                            },
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "收货状态", name: "AUDITING_RECEIVE", type: "select", editor: { data: me.Auditing } },
                            { display: "入库单号", name: "IN_CODE", type: "string" },
                            { display: "入库日期", name: "IN_DATE", type: "date", format: "yyyy-MM-dd hh:mm" },
                            { display: "供应商", name: "PROVIDER_NAME", type: "string" },
                            { display: "收货部门", name: "DEPT_NAME", type: "string" },
                            { display: "收货人", name: "CONSIGNEE", type: "string" },
                            { display: "备注", name: "MEMO", type: "string" },
                            { display: "主键", name: "IN_ID", type: "string", hide: true },
                        ]
                    }
                };
            },
            menuNo: getQueryStringByName("MenuNo"),
            grid: null,
            searchForm: null,
            buttons: null,
            //下拉数据
            Auditing: [],
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'Material/SpInstore/ComboxData',
                    loading: '正在获取中...',
                    success: function (data) {
                        me.Auditing = data.Auditing;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    dateFormat: 'yyyy-MM-dd HH:mm',
                    autoWidth: true,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    usePager: true,
                    dataAction: 'server',
                    toolbar: {},
                    url: 'Material/SpInstore/ReceiveList',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: 'AUDITING_RECEIVE, IN_CODE',
                    sortOrder: 'desc',
                    width: '100%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: true,
                    clickToEdit: true,
                    onBeforeEdit: function (editParm) {
                        return false;
                    },
                    onSuccess: function (data, g) { },
                    rowAttrRender: function (rowdata, rowid) {
                        return "";
                    },
                    onDblClickRow: function (rowdata, rowid, row) {
                        me.openDetail({ sid: rowdata.IN_ID, isNew: false, isView: true });
                    }
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            isSelectRow: function () {
                var me = this;
                var rows = me.grid.getSelectedRows();
                if (rows.length == 0) {
                    LG.tip("请选择一行");
                    return false;
                }
                return true;
            },
            isSelectSingleRow: function () {
                var me = this;
                var rows = me.grid.getSelectedRows();
                if (rows.length > 1) {
                    LG.tip("不能选择多行");
                    return false;
                } else if (rows.length == 0) {
                    LG.tip("请选择一行");
                    return false;
                }
                return true;
            },
            isAllAudited: function ({ msg = "未提交数据，无需撤销！" } = {}) {
                var me = this;
                var selecteds = me.grid.getSelectedRows();
                for (let row of selecteds) {
                    if (row.AUDITING_RECEIVE != "1") {
                        if (msg) {
                            LG.tip(msg);
                        }
                        return false;
                    }
                }
                return true;
            },
            isAllUnaudited: function ({ msg = "有数据已提交，无法变更！" } = {}) {
                var me = this;
                var selecteds = me.grid.getSelectedRows();
                for (let row of selecteds) {
                    if (row.AUDITING_RECEIVE == "1") {
                        if (msg) {
                            LG.tip(msg);
                        }
                        return false;
                    }
                }
                return true;
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "add":
                            me.openDetail({ isNew: true, isView: false });
                            break;
                        case "modify":
                            if (me.isSelectSingleRow() && me.isAllUnaudited()) {
                                me.openDetail({ isNew: false, isView: false });
                            }
                            break;
                        case "delete":
                            if (me.isSelectRow() && me.isAllUnaudited()) {
                                me.delete();
                            }
                            break;
                        case "submit":
                            if (me.isSelectSingleRow() && me.isAllUnaudited()) {
                                me.submit();
                            }
                            break;
                        case "revoke":
                            if (me.isSelectSingleRow() && me.isAllAudited()) {
                                me.revoke();
                            }
                            break;
                        case "Excel":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=xls", window.gksybConfigs.urlBase), modal: true });
                            break;
                        case "Pdf":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=pdf", window.gksybConfigs.urlBase), modal: true });
                            break;
                    }
                }
                me.grid.toolbarManager.options.group = 'main';
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            openDetail: function ({ sid, isNew = false, isView = true } = {}) {
                var me = this;
                if (!isNew && !sid) {
                    sid = me.grid.getSelectedRow().IN_ID;
                }
                $.ligerDialog.open({
                    width: me.detailWidth,
                    height: me.detailHeight,
                    allowClose: true,
                    title: (isNew ? '[新增]' : isView ? '[查看]' : '[修改]') + document.title,
                    url: "sp_receive_detail.html?MenuNo=" + me.menuNo,
                    isHidden: false,
                    showMax: false,
                    showToggle: false,
                    showMin: false,
                    isResize: true,
                    slide: false,
                    onClosed: me.reload.bind(me),
                    data: { sid: sid, isNew: isNew, isView: isView }
                });
            },
            reload: function () {
                var me = this;
                me.buttons[0].click();
            },
            delete: function () {
                var me = this;
                var rows = me.grid.getSelectedRows();
                if (!rows) return;
                $.ligerDialog.confirm('确定删除吗?', function (confirm) {
                    if (!confirm) return;
                    var changeRow = { deleted: rows };
                    LG.ajax({
                        jsToken: true,
                        url: 'Material/SpInstore/SaveAll',
                        loading: '正在删除中...',
                        data: { request: changeRow, requestDet: {} },
                        success: function () {
                            LG.showSuccess('删除成功');
                            me.reload();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                });
            },
            submit: function () {
                var me = this;
                var row = me.grid.getSelectedRow();
                LG.ajax({
                    jsToken: true,
                    url: 'Material/SpInstore/ReceiveSubmit',
                    loading: '正在提交中...',
                    data: { inId: row.IN_ID },
                    success: function () {
                        LG.showSuccess('提交成功');
                        me.reload();
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            revoke: function () {
                var me = this;
                var row = me.grid.getSelectedRow();
                LG.ajax({
                    jsToken: true,
                    url: 'Material/SpInstore/ReceiveRevoke',
                    loading: '正在撤销中...',
                    data: { inId: row.IN_ID },
                    success: function () {
                        LG.showSuccess('撤销成功');
                        me.reload();
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Pdf',
                        text: '导出Pdf',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-pdf-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch = $("#formsearch");
                me.searchForm = $formsearch.ligerForm({
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                    }
                });
            },
            init: function () {
                var me = this;
                me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.setGrid();
                me.reload();
                window.closeQuery = function (callback) {
                    if (!me.dialog) return callback();
                    return me.dialog.frame.business.closeQuery(callback);
                };
                return me;
            }
        };
        $(function () {
            business.init();
        });</script>
</body>

</html>
