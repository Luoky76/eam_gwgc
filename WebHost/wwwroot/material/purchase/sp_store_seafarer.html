<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title>库存明细</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 2px; height: 100%;">
    <div id="layout">
        <div position="left" title="仓库货位" id="mainmenu">
            <ul id="maintree" style="margin-top:5px;"></ul>
        </div>
        <div position="center" title="库存明细列表" id="center-pos">
            <div id="tabcontainer">
                <div id="storelist" title="物资库存" tabid="storelist">
                    <div class="searchbox">
                        <form action="" id="formsearch" class="l-form">
                        </form>
                    </div>
                    <form id="storeform">
                        <div id="storegrid" style="margin: 2px;"></div>
                    </form>
                </div>
                <div id="waterlist" title="库存流水" tabid="waterlist">
                    <form id="waterform">
                        <div id="watergrid"></div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script type="text/javascript">
        'use strict';
        var business = {

            formLabelWidth: 120,
            formInputWidth: 180,
            getTextareaWidth: function () {
                var me = this;
                var fieldWidth = me.formLabelWidth + me.formInputWidth + 3;
                return Math.floor(($("#storeform").width() - 10) / fieldWidth) * fieldWidth - (me.formLabelWidth + 3);
            },
menuNo: getQueryStringByName("MenuNo"),
            ver: getQueryStringByName("ver"),
            tab: null,
            grid: null,
            waterGrid: null,
            tree: null,
            currentNode: null,
            ProviderName: [],
            BCCode: [],
            SrcType: [],
            stockData: [],
            DeptData:[],
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            {
                                display: "通用搜索",
                                name: "_search_all",
                                hideLabel: true,
                                filter: [
                                    { op: "like", field: "BATCH_CODE", type: "string" },
                                    { op: "like", field: "SP_CODE", type: "string" },
                                    { op: "like", field: "SP_NAME", type: "string" },
                                    { op: "like", field: "SP_SIZE", type: "string" },
                                    { op: "like", field: "TYPE_NAME", type: "string" },
                                    { op: "like", field: "PRODUCE", type: "string" },
                                    { op: "like", field: "HOUSE_NAME", type: "string" },
                                    { op: "like", field: "UNIT", type: "string" },
                                    { op: "like", field: "PROVIDER_NAME", type: "string" },
                                    { op: "like", field: "PROPERTY", type: "string" },
                                    { op: "like", field: "DEPT_NAME", type: "string" },
                                ],
                            },
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "批次号", name: "BATCH_CODE", type: "string" },
                            { display: "物资编码", name: "SP_CODE", type: "string" },
                            { display: "物资名称", name: "SP_NAME", type: "string" },
                            { display: "型号规格", name: "SP_SIZE", type: "string" },
                            { display: "物资分类", name: "TYPE_NAME", type: "string" },
                            { display: "品牌、厂家", name: "PRODUCE", type: "string" },
                            { display: "仓库名称", name: "HOUSE_NAME", type: "string" },
                            { display: "计量单位", name: "UNIT", type: "string" },
                            { display: "库存数量", name: "STORE_NUM", type: "float" },
                            { display: "入库日期", name: "IN_DATE", type: "date", format: "yyyy-MM-dd" },
                            { display: "供应商", name: "PROVIDER_NAME", type: "string" },
                            { display: "属性", name: "PROPERTY", type: "string" },
                            { display: "部门", name: "DEPT_NAME", type: "string" },
                            { display: "主键", name: "STORE_ID", type: "string", hide: true },
                        ]
                    },
                    waterGrid: {
                        columns: [
                            { display: "单据编码", name: "SRC_CODE", type: "string" },
                            { display: "单据日期", name: "SRC_DATE", type: "date", format: "yyyy-MM-dd hh:mm" },
                            { display: "来源类型", name: "SRC_TYPE", type: "select", editor: { data: me.SrcType } },
                            { display: "流水日期", name: "WATER_DATE", type: "date", format: "yyyy-MM-dd hh:mm" },
                            { display: "期初数量", name: "INIT_NUM", type: "float" },
                            { display: "入库数量", name: "IN_NUM", type: "float" },
                            { display: "出库数量", name: "OUT_NUM", type: "float" },
                            { display: "期末数量", name: "CUR_NUM", type: "float" },
                            //隐藏
                            { display: "库存id", name: "STORE_ID", type: "string", hide: true },
                            { display: "流水id", name: "WATER_ID", type: "string", hide: true },
                        ]
                    }
                };
            },
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'Material/SpStore/ComboxData',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        me.ProviderName = data.ProviderName;
                        me.BCCode = data.BCCode;
                        me.DeptData = data.DeptData;
                        me.SrcType = data.SrcType;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            setTab: function () {
                var me = this;
                me.tab = $("#tabcontainer").ligerTab({
                    type: "brief",
                    onAfterSelectTabItem: function (tabid) {
                        switch (tabid) {
                            case 'storelist':
                                me.grid._onResize();
                                break;
                            case "waterlist":
                                me.reloadWater();
                                me.waterGrid._onResize();
                                break;
                        }
                    }
                });
            },
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#storegrid").ligerGrid({
                    dateFormat: "yyyy-MM-dd hh:mm",
                    autoWidth: true,
                    delayLoad: true,
                    usePager: false,
                    columns: me.config.grid.columns,
                    title: '<input id="showStoreOnly" />',
                    toolbar: {},
                    url: 'Material/SpStore/List',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: 'SP_CODE',
                    sortOrder: '',
                    width: '99%',
                    height: '100%',
                    heightDiff: -150,
                    inWindow: $("#center-pos"),
                    checkbox: true,
                    enabledEdit: false,
                    clickToEdit: false,
                    onDblClickRow: function (data, rowid, rowdata) {
                        me.tab.selectTabItem('waterlist');
                    }
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
                $("#showStoreOnly").ligerCheckBox({
                    type: "switch",
                    label: "只看有库存",
                    value: true,
                    onChangeValue: function (input, value, g) {
                        me.applyFilter();
                    }
                });
            },
            setWaterGrid: function () {
                var me = this;
                me.config.waterGrid.columns.removeNull();
                me.waterGrid = $("#watergrid").ligerGrid({
                    dateFormat: 'yyyy-MM-dd HH:mm',
                    autoWidth: true,
                    delayLoad: true,
                    usePager: true,
                    columns: me.config.waterGrid.columns,
                    dataAction: 'server',
                    toolbar: {},
                    url: 'Material/SpStore/DetList',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: 'WATER_DATE',
                    sortOrder: 'asc',
                    width: '100%',
                    height: '100%',
                    heightDiff: -54,
                    inWindow: $("#center-pos"),
                    checkbox: true,
                    enabledEdit: false,
                    clickToEdit: false
                });
                me.waterGrid.isValid = true;
                me.loadWaterToolbar();
                me.bindWaterGridEvent();
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "Excel":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=xls", window.gksybConfigs.urlBase), modal: true, data: { gridid: "storegrid" } });
                            break;
                        case "Pdf":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=pdf", window.gksybConfigs.urlBase), modal: true, data: { gridid: "storegrid" } });
                            break;
                    }
                }
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            loadWaterToolbar: function () {
                var me = this;
                me.waterToolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reloadWater();
                            break;
                        case "Excel":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=xls", window.gksybConfigs.urlBase), modal: true, data: { gridid: "watergrid" } });
                            break;
                        case "Pdf":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=pdf", window.gksybConfigs.urlBase), modal: true, data: { gridid: "watergrid" } });
                            break;
                    }
                };
                LG.loadToolbar(me.waterGrid, me.waterToolbarBtnItemClick);
            },
            reloadWater: function () {
                var me = this;
                var selected = me.grid ? me.grid.getSelectedRow() : null;
                if (selected) {
                    var where = {
                        rules: [],
                        groups: [{
                            rules: [], op: "or"
                        }], op: "and"
                    };
                    where.groups[0].rules.push({ field: 'STORE_ID', value: selected.STORE_ID, op: 'equal' });
                    me.waterGrid.set('parms', { "where": JSON2.stringify(where) });
                } else {
                    me.waterGrid.set('parms', { "where": "" });
                }
                me.waterGrid.loadData();
            },
            reloadTree: function () {
                var me = this;
                me.selectNode = me.tree.getSelected();
                me.tree.reload();
            },
            applyFilter: function () { //应用过滤条件
                var me = this;
                var nodeData = me.currentNode ? me.currentNode.data : null;
                var houseCode = nodeData ? nodeData.HOUSE_CODE : "";
                var showStoreOnly = liger.get("showStoreOnly") ? liger.get("showStoreOnly").getValue() : true;
                var where = {
                    rules: [],
                    groups: [{
                        rules: [], op: "or"
                    }], op: "and"
                };
                if (houseCode) {
                    where.groups[0].rules.push({ field: 'HOUSE_CODE', value: houseCode, op: 'startwith' });
                }
                if (showStoreOnly) {
                    where.rules.push({ field: 'STORE_NUM', value: 0, op: 'greater', type: 'float' });
                }
                var parms = me.grid.options.parms;
                var whereStr = JSON2.stringify(where);
                parms.where = whereStr;
                parms.orginwhere = whereStr;
                me.grid.options.NoFirstSearch = false;
                me.grid.loadData();
            },
            reload: function () { //刷新
                var me = this;
                me.buttons[0].click();
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Pdf',
                        text: '导出Pdf',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-pdf-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                LG.validate($("#storeform"), {
                    debug: true
                });
            },
            bindWaterGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.waterToolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Pdf',
                        text: '导出Pdf',
                        click: function (item) {
                            me.waterToolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-pdf-o"
                    }
                    ]
                });
                me.waterGrid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                LG.validate($("#waterform"), {
                    debug: true
                });
            },
            setTree: function () {
                var me = this;
                me.tree = $("#maintree").ligerTree({
                    url: "Material/SpStore/Tree",
                    parms: {},
                    nodeWidth: 160,
                    slide: false,
                    checkbox: false,
                    single: true,
                    needCancel: true,
                    idFieldName: 'HOUSE_ID',
                    textFieldName: 'HOUSE_NAME',
                    parentIDFieldName: 'PRE_HOUSE_ID',
                    parentIcon: "fa fa-bars",
                    parentIconOpen: "fa fa-bars",
                    childIcon: "fa fa-bars",
                    filter: true,
                    isExpand: 2,
                    onSuccess: function (data) {

                        data.forEach((a) => {
                            me.stockData.push({ ID: a.HOUSE_ID, TEXT: a.HOUSE_NAME, VALUE: a.HOUSE_CODE });
                        });
                        if (me.selectNode && me.selectNode.data) this.selectNode(me.selectNode.data.HOUSE_ID);
                    },
                    onSelect: function (node) {
                        var nodeData = node.data;
                        me.currentNode = node;
                        if (nodeData) {
                            me.applyFilter();
                        }
                    }
                });
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch = $("#formsearch")
                me.searchForm = $formsearch.ligerForm({
                    labelWidth: me.formLabelWidth,
                    inputWidth: me.formInputWidth,
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                    }
                });
            },
            init: function () {
                var me = this;
                $("#layout").ligerLayout({ leftWidth: 240 });
                me.loadComboxData();
                me.setConfig();
                me.setTab();
                me.setForm();
                me.setTree();
                me.setGrid();
                me.applyFilter();
                me.setWaterGrid();
                me.reloadWater();
                return me;
            }
        };
        business.init();
    </script>
</body>

</html>
