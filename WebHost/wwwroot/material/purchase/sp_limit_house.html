<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title>仓库上下限设置</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <div id="mainsearch" style="width: 98%">
        <form action="" id="formsearch" class="l-form">
        </form>
    </div>
    <form action="" id="mainform">
        <div id="maingrid">
        </div>
    </form>
    <!-- 设置上下限对话框 -->
    <div id="view-panel" style="display:none;">
        <form action="" id="view-form" class="l-form"></form>
    </div>
    <script type="text/javascript">
        'use strict';
        var business = {
            rootPath: 'Material/SpStore/',
            MenuNo: getQueryStringByName("MenuNo"),
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            { display: "物料编码", name: "_search_SP_CODE", dbname: "SP_CODE", newline: false, type: "text", },
                            { display: "物料名称", name: "_search_SP_NAME", dbname: "SP_NAME", newline: false, type: "text", },
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "物料编码", name: "SP_CODE", dbname: "SP_CODE", width: 140, type: "text", },
                            { display: "物料名称", name: "SP_NAME", dbname: "SP_NAME", width: 150, type: "text", },
                            { display: "规格型号", name: "SP_SIZE", dbname: "SP_SIZE", width: 150, type: "text", },
                            { display: "计量单位", name: "UNIT", dbname: "UNIT", width: 150, type: "text", },
                            { display: "品牌、厂家", name: "PRODUCE", dbname: "PRODUCE", width: 150, type: "text", },
                            { display: "库位名称", name: "STOCK_NAME", dbname: "STOCK_NAME", width: 150, type: "text", },
                            { display: "库存数量", name: "NUM", dbname: "NUM", width: 120, type: "text", },
                            { display: "库存金额(元)", name: "MONEY", dbname: "MONEY", width: 120, type: "text", },

                            { display: "库存上限", name: "STORE_TOP", dbname: "STORE_TOP", width: 150, type: "text", },
                            { display: "库存下限", name: "STORE_LOWER", dbname: "STORE_LOWER", width: 150, type: "text", },
                            { display: "SP_ID", name: "SP_ID", dbname: "SP_ID", width: 100, type: "text", hide: true },
                            { display: "STOCK_ID", name: "STOCK_ID", dbname: "STOCK_ID", width: 100, type: "text", hide: true },
                            { display: "主键", name: "LIMIT_ID", dbname: "LIMIT_ID", width: 100, type: "text", hide: true },
                        ]
                    }
                };
            },
            grid: null,
            searchForm: null,
            buttons: null,
            limitId: '',
            loadComboxData: function () {
                var me = this;
            },
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    autoWidth: false,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    toolbar: {},
                    url: me.rootPath + 'LimitList',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: 'STORE_TOP',
                    sortOrder: 'DESC',
                    width: '98%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: false,
                    clickToEdit: false
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "add":
                            me.add();
                            break;
                        case "delete":
                            me.delete();
                            break;
                        case "setNum":
                            me.openNumDialog();
                            break;
                        case "Excel":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=xls", window.gksybConfigs.urlBase), modal: true });
                            break;
                        case "Pdf":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=pdf", window.gksybConfigs.urlBase), modal: true });
                            break;
                    }
                }
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            add: function () { //新增
                var me = this;
                var callback = function (list) {
                    if (list.length > 0) {
                        var gridlist = me.grid.getData();
                        var flag = false;
                        me.grid.isDataChanged = true;
                        for (var i in list) {
                            var flag = gridlist.some(t => t.SP_ID == list[i].SP_ID && t.STOCK_ID == list[i].STOCK_ID);
                            if (flag) {
                                LG.showError((list[i].STOCK_NAME == undefined ? "" : list[i].STOCK_NAME) + "[" + list[i].SP_NAME + "]" + "已存在,不能重复添加");
                                return
                            }
                            me.grid.addEditRow({
                                "SP_ID": list[i].SP_ID,
                                "SP_CODE": list[i].SP_CODE,
                                "SP_NAME": list[i].SP_NAME,
                                "STOCK_ID": list[i].STOCK_ID,
                                "STOCK_NAME": list[i].STOCK_NAME
                            });
                        }

                        var changeRow = me.grid.getChangedRows();
                        LG.ajax({
                            jsToken: true,
                            url: me.rootPath + 'LimitSave',
                            loading: '正在保存中...',
                            data: changeRow,
                            success: function () {
                                LG.showSuccess('保存成功');
                                me.grid.isDataChanged = false;
                                me.reload();
                            },
                            error: function (message) {
                                LG.showError(message);
                            }
                        });
                    }
                };
                var data = [];
                me.grid.getData().forEach((a) => {
                    data.push({ SP_ID: a.SP_ID, STOCK_ID: a.STOCK_ID });
                });
                
                $.ligerDialog.open({
                    width: 1080,
                    height: 600,
                    allowClose: true,
                    title: "挑选库存",
                    url: "storeDetailPop.html?MenuNo=" + me.menuNo,
                    isHidden: false,
                    showMax: false,
                    showToggle: false,
                    showMin: false,
                    isResize: true,
                    slide: false,
                    data: {
                        isCancel: "0",
                        mainReloadBtn: me.buttons[0],
                        callback: callback,
                        filterData: data
                    }
                });
            },
            delete: function () { //删除
                var me = this;
                if (me.grid.endEdit() != false) {
                    var selected = me.grid.getSelectedRows();
                    if (selected.length > 0) {
                        $.ligerDialog.confirm('确定删除吗?', function (confirm) {
                            if (confirm) {
                                for (var i = 0, len = (selected || []).length; i < len; i++) {
                                    me.grid.deleteRow(selected[i]);
                                }
                                me.save();
                            }
                        });
                    } else {
                        LG.tip('请选择行!');
                    }
                }
            },
            save: function () { //保存
                var me = this;
                if (me.grid.endEdit() != false) {
                    if (!me.grid.isDataChanged) {
                        LG.showSuccess('无修改');
                        return;
                    }
                    if (!me.grid.validChangeRows()) return false;
                    var changeRow = me.grid.getChangedRows();
                    LG.ajax({
                        jsToken: true,
                        url: me.rootPath + 'LimitSave',
                        loading: '正在保存中...',
                        data: changeRow,
                        success: function (message, data) {
                            me.grid.isDataChanged = false;
                            me.reload();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }

            },
            openNumDialog: function () {
                var me = this;
                var sel = me.grid.getSelectedRows();
                if (sel.length != 1) {
                    LG.showError("请选择一条记录");
                    return
                }

                me.limitId = sel[0].LIMIT_ID;

                if (!me.viewForm) {
                    me.viewForm = $("#view-form").ligerForm({
                        fields: [
                            { display: "上限", name: "STORE_TOP", newline: true, width: 150, type: "float", },
                            { display: "下限", name: "STORE_LOWER", newline: true, width: 150, type: "float", }
                        ],
                        space: 3,
                        validate: true,
                        onAfterSetFields: function (g) {
                            me.viewForm = g;
                        }
                    });
                }
                me.viewForm.setOrginData({ STORE_TOP: JSON.stringify(sel[0].STORE_TOP), STORE_LOWER: JSON.stringify(sel[0].STORE_LOWER) });
                var dialog = $.ligerDialog.open({
                    title: "设置上下限",
                    target: me.viewForm.form,
                    width: 300,
                    height: 200,
                    showMax: false,
                    showToggle: false,
                    showMin: false,
                    isResize: true,
                    slide: false,
                    allowClose: true,
                    isHidden: false,
                    buttons: [{
                        text: "确定", type: "info", onClick: function () {
                            var jsonData = me.viewForm.getData();

                            if (jsonData.STORE_TOP < 0 || jsonData.STORE_LOWER < 0) {
                                LG.showError("上下限不能小于0");
                                return
                            }

                            if (jsonData.STORE_TOP < jsonData.STORE_LOWER) {
                                LG.showError("上限不能小于下限");
                                return
                            }

                            $.ajax({
                                url: me.rootPath + 'SetTopLower',
                                dataType: 'json',
                                type: 'post',
                                data: {
                                    LIMITID: me.limitId,
                                    TOP: jsonData.STORE_TOP,
                                    LOWER: jsonData.STORE_LOWER
                                },
                                success: function (res) {
                                    dialog.hide();
                                    LG.showSuccess('处理成功');
                                    me.reload();
                                },
                                error: function (message) {
                                    LG.showError(message);
                                }
                            });
                        }
                    }, {
                        text: "取消", type: "cancel", onClick: function () {
                            dialog.hide();
                        }
                    }]
                });
                return;
            },
            reload: function () { //刷新
                var me = this;
                me.buttons[0].click();
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Pdf',
                        text: '导出Pdf',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-pdf-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch = $("#formsearch")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                    }
                });
            },
            init: function () {
                var me = this;
                me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.setGrid();
                me.reload();
                return me;
            }
        };
        business.init();
    </script>
</body>
</html>
