<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title></title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <div id="mainsearch" style="width: 98%">
        <form action="" id="formsearch" class="l-form">
        </form>
    </div>
    <form action="" id="mainform">
        <div id="maingrid">
        </div>
    </form>
    <script type="text/javascript">
        'use strict';
        var business = {
            rootPath:'Material/SpApply/',
            MenuNo: getQueryStringByName("MenuNo"),
            //明细页面大小
            detailWidth: window.innerWidth * 0.9,
            detailHeight: window.innerHeight * 0.9,
            dialog: null,
            dialogData: null,
            Sid: null,
            typeData: [],
            exigData: [],
            unitData:[],
            setConfig: function () {
                var me = this;
                me.config = {
                    form: {
                        labelwidth: 200,
                        fields: [
                            //基础信息
                            { display: "申请单号", name: "APPLY_NO", newline: false, upper: true, type: "text", options: { disabled: true } },
                            { display: "申请日期", name: "APPLY_DATE", validate: { required: true }, newline: false, upper: true, type: "date", format: "yyyy-MM-dd", options: { type: 'date', disabled: true, format: "yyyy-MM-dd" } },
                            { display: "申请人", name: "APPLY_USER", validate: { required: true }, newline: false, upper: true, type: "text", options: { type: 'text', disabled: true } },
                            {
                                display: "采购分类", name: "TYPE_ID", type: "select", validate: { required: true },
                                editor: {
                                    type: 'select',
                                    data: me.typeData,
                                    onChange: function (rowdata, rowIndex, g) {
                                        debugger
                                        if (g.selected != undefined) {
                                            $('#TYPE_NAME').val(g.selected.TEXT == null ? '' : g.selected.TEXT);
                                            $('#TYPE_CODE').val(g.selected.VALUE == null ? '' : g.selected.VALUE);
                                        }
                                    },
                                }
                            },
                            { display: "紧急程度", name: "EXIG_DEV", type: "select", editor: { type: 'select', data: me.exigData }, validate: { required: true }, },

                           
                            { display: "申请部门", name: "DEPT_NAME", validate: { required: true }, newline: false, upper: true, type: "text", options: { type: 'text', disabled: true } },
                            { display: "二级单位", name: "SEC_DEPT", newline: false, upper: true, type: "text", options: { disabled: true } },
                            { display: "用途", name: "USE_MEMO", newline: true, type: "textarea", editor: { type: 'textarea' }, validate: { required: true }, width: 786, },
                            { display: "备注", name: "MEMO", newline: true, validate: { required: true }, upper: true, width: 786, type: "textarea", options: {} },

                            //隐藏
                            { display: "主键", name: "APPLY_ID", newline: false, upper: true, type: "hidden", options: {} },
                            { display: "AUDITING", name: "AUDITING", newline: false, upper: true, type: "hidden", options: {} },
                            { display: "采购分类名", name: "TYPE_NAME", width: 100, type: "text", type: "hidden", },
                            { display: "采购分类编码", name: "TYPE_CODE", width: 100, type: "text", type: "hidden", },
                        ]

                    },
                    grid: {
                        columns: [
                            {
                                display: "物料编码", name: "SP_CODE", width: 150, type: "text",
                                totalSummary:
                                {
                                    render: function (suminf, column, cell) {
                                        return '<div>合计</div>';
                                    },
                                    align: 'center'
                                }
                            },
                            {
                                display: "数量", name: "COUNT", type: "number", width: 80, editor: {
                                    type: 'number', onChangeValue: function (input, value, g) {
                                        var editParm = g.options.editParm.record;
                                        editParm["YG_MONEY"] = ((editParm.YG_PRICE || 0) * value).toFixed(2);
                                    }
                                }, validate: { required: true }, totalSummary:
                                {
                                    type: 'sum',
                                    align: 'center'
                                }
                            },
                            { display: "计量单位", name: "UNIT", width: 150, type: "select", editor: { type: 'select', data: me.unitData } },
                            { display: "物料名称", name: "SP_NAME", width: 150, type: "text", editor: { type: "text", }, validate: { required: true } },
                            { display: "型号规格", name: "SP_SIZE", width: 150, type: "text", editor: { type: "text", } },
                            { display: "品牌、厂家", name: "PRODUCE", width: 150, type: "text", editor: { type: "text", } },
                           
                            { display: "物料分类", name: "TYPE_NAME", width: 150, type: "text", },
                            { display: "库存数量", name: "STORE_NUM", width: 150, type: "decimal", },
                            { display: "质保期(月)", name: "WARRANTY", width: 150, type: "text", },
                            { display: "上次供应商", name: "LAST_PROVIDER", width: 150, type: "text", },
                            {
                                display: "预估单价(元)", name: "YG_PRICE", width: 120, type: "number", editor: {
                                    type: 'number', onChangeValue: function (input, value, g) {
                                        var editParm = g.options.editParm.record;
                                        editParm["YG_MONEY"] = (value * (editParm.COUNT || 0)).toFixed(2);
                                    }
                                }
                            },
                            {
                                display: "预估金额(元)", name: "YG_MONEY", width: 120, type: "number", totalSummary:
                                {
                                    type: 'sum',
                                    align: 'center'
                                }
                            },
                            { display: "预估库龄(月)", name: "STORE_MONTH", width: 120, type: "number", editor: { type: 'number' } },
                            {
                                display: "是否协议", name: "IS_XY", dbname: "IS_XY", width: 80, type: "text", align: "center", formatType: "chk", editor: { type: 'chkStr' }
                            },
                            {
                                display: "品牌无要求", name: "NO_PRODUCE", dbname: "NO_PRODUCE", width: 80, type: "text", align: "center", formatType: "chk", editor: { type: 'chkStr' }
                            },
                            { display: "说明", name: "MEMO", width: 120, type: "text", editor: { type: 'text' } },
                            { display: "物料ID", name: "SP_ID", dbname: "SP_ID", width: 100, type: "text", hide: true },
                            { display: "上次供应商ID", name: "LAST_PROVIDERID", dbname: "LAST_PROVIDERID", width: 100, type: "text", hide: true },
                            { display: "APPLY_ID", name: "APPLY_ID", dbname: "APPLY_ID", width: 100, type: "text", hide: true },
                            { display: "主键", name: "SPDET_ID", dbname: "SPDET_ID", width: 100, type: "text", hide: true },
                        ]
                    }
                };
            },
            //物资本身信息的字段
            spColumns: ["SP_ID", "SP_CODE", "UNIT", "SP_NAME", "SP_SIZE", "PRODUCE", "TYPE_NAME", "WARRANTY", "LAST_PROVIDER", "LAST_PROVIDERID", "IS_XY", "NO_PRODUCE" ],
            grid: null,
            mainform: null,
            buttons: null,
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: me.rootPath + 'ComboxData',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        me.typeData = data.BasePurtype
                        me.exigData = data.BCCode;
                        me.unitData = data.SpUnit;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            orginData: {},
            loadData: function () {
                var me = this;
                function inner() {
                    var data = me.mainform.getData();
                    LG.getFormCombChanges(data, me.orginData, true);
                    delete me.orginData;
                    me.orginData = data;
                }
                if (!me.Sid) {
                    me.mainform.setData({ AUDITING: "0", APPLY_USER: window.session.RealName });
                    inner();
                }
                else {
                    LG.ajax({
                        async: false,
                        url: me.rootPath + 'GetApplyDetail',
                        loading: '正在获取中...',
                        data: { id: me.Sid },
                        success: function (data, message) {
                            me.mainform.setData(data);
                            inner();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                    if (me.isView) {
                        me.mainform.setReadonly(true);
                    }
                }
                var input = me.mainform.getEditor(me.config.form.fields[0].name).inputText;
                input.focus();
                input.select();
            },
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    autoWidth: false,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    usePager: false,
                    toolbar: { group:"detail" },
                    url: me.rootPath + 'DetailList',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: [{ field: 'APPLY_ID', op: 'equal', value: $('#APPLY_ID').val() }]
                        })
                    },
                    sortName: '',
                    sortOrder: '',
                    width: '98%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: !me.isView,
                    clickToEdit: true,
                    onBeforeEdit: function (editParm) {
                        /*
                        if (editParm.record.__status == "nochanged") {
                            if (editParm.record.SP_ID != "" && me.spColumns.includes(editParm.column.name))
                                return false;
                            else return true;
                        }
                        switch (editParm.column.name) {
                            case "":
                                if (editParm.record.__status == "add") return true;
                                else return false;
                                break;
                        }
                        */
                    },
                    onBeforeSubmitEdit: function (e) {
                        if (e.column.name == "COUNT" || e.column.name == "YG_PRICE" || e.column.name == "STORE_MONTH") {
                            if (e.value < 0) {
                                LG.showError("不可为负数！");
                                return false;
                            } 
                        }
                        return true;
                    }
                });
                me.grid.isValid = true;
                me.loadToolbar();
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "add":
                            me.add();
                            break;
                        case "delete":
                            me.delete();
                            break;
                        case "save":
                            me.save();
                            break;
                        case "import":
                            me.import();
                            break;
                        case "create":
                            me.create();
                            break;
                    }
                }
                if (!me.isView)
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            add: function () { //新增
                var me = this;
                var callback = function (list) {
                    var gridlist = me.grid.getData();
                    var flag = false;
                    for (var i in list) {
                        var flag = gridlist.some(t => t.SP_ID == list[i].SP_ID);
                        if (!flag) {
                            me.grid.addEditRow({
                                "SP_ID": list[i].SP_ID,
                                "LAST_PROVIDERID": list[i].LAST_PROVIDERID,
                                "LAST_PROVIDER": list[i].LAST_PROVIDER,
                                "WARRANTY": list[i].WARRANTY,
                                "STORE_NUM": list[i].STORE_NUM,
                                "TYPE_ID": list[i].TYPE_ID,
                                "TYPE_NAME": list[i].TYPE_NAME,
                                "TYPE_CODE": list[i].TYPE_CODE,
                                "UNIT": list[i].UNIT,
                                "PRODUCE": list[i].PRODUCE,
                                "SP_SIZE": list[i].SP_SIZE,
                                "SP_NAME": list[i].SP_NAME,
                                "SP_CODE": list[i].SP_CODE,
                                "YG_PRICE": list[i].STORE_PRICE,
                                "PURTYPE_ID": list[i].PURTYPE_ID,
                                "PURTYPE_NAME": list[i].PURTYPE_NAME,
                                "APPLY_ID": me.Sid,
                                "IS_XY": "0",
                                "NO_PRODUCE": "0"
                            });
                        }
                    }
                };

                var selData = me.grid.getData();
                var dataValue = "";
                selData.forEach((a) => {
                    dataValue += a.SP_ID + ",";
                });
                $.ligerDialog.open({
                    width: me.detailWidth,
                    height: me.detailHeight,
                    allowClose: true,
                    title: "挑选物资编码",
                    url: "../Base/base_spcatalogPop.html?MenuNo=" + me.MenuNo,
                    isHidden: false,
                    showMax: false,
                    showToggle: false,
                    showMin: false,
                    isResize: true,
                    slide: false,
                    data: {
                        isCancel:"0",
                        mainReloadBtn: me.reload,
                        callback: callback,
                        dataValue: dataValue
                    }
                });

            },
            save: function () { //保存
                var me = this;

                var formEdit = false, gridEdit = false;
                if ($.isEmptyObject(me.mainform.getChanges())) {
                    formEdit = false;
                }
                else formEdit = true;
                if (!me.mainform.valid()) {
                    me.mainform.showInvalid();
                    return;
                }
                if (me.grid.endEdit() != false) {
                    if (!me.grid.isDataChanged) {
                        gridEdit = false;
                    }
                    else gridEdit = true;
                }
                if (!me.grid.validChangeRows()) return false;
                function handle(data) {
                    return data;
                }

                /*
                var dataRow = me.grid.getData();
                var code = dataRow.map((a) => {
                    return a.SP_CODE;
                });

                if (new Set(code).size !== code.length) {
                    LG.showSuccess('物资编码不能重复');
                    return;
                }
                */

                if (formEdit || gridEdit) {
                    var data = handle(me.mainform.getData());
                    var original = handle(me.mainform.getOrginData());
                    var changeRow = new Object();
                    if (!me.Sid) {
                        changeRow["added"] = [data];
                    }
                    else {
                        changeRow["updated"] = [data];
                        changeRow["original"] = [original];
                    }
                    var changeRowDet = me.grid.getChangedRows();
                   
                    var isSave = true
                    for (var i = 0; i < changeRowDet.updated.length; i++) {
                        if (changeRowDet.updated[i].COUNT < 0) {
                            LG.showSuccess('申请数量不可小于0！')
                            isSave = false;
                        }
                    }
                    if (isSave) {
                        LG.ajax({
                            jsToken: true,
                            url: me.rootPath + 'Save',
                            loading: '正在保存中...',
                            data: { request: changeRow, requestdet: changeRowDet },
                            success: function () {
                                LG.showSuccess('保存成功');
                                if (!me.Sid) me.dialog.close();
                                else me.reload();
                            },
                            error: function (message) {
                                LG.showError(message);
                            }
                        });
                    }
                }
                else { LG.showSuccess('无修改'); }
            },
            reload: function () { //刷新
                var me = this;
                me.loadData();
                me.grid.options.parms = {
                    where: JSON.stringify({
                        op: 'and',
                        rules: [{ field: 'APPLY_ID', op: 'equal', value: $('#APPLY_ID').val() }]
                    })
                };
                me.grid.loadData();
            },
            import: function () { //导入物资
                var me = this;
                LG.showUpload({
                    title: "导入",
                    server: me.rootPath + "ImportInDetail",
                    mouldFileName: me.rootPath + "ExportExcelHeader",
                    multiple: false,
                    extensions: 'xlsx,xls',
                    mimeTypes: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
                    compress: {
                        width: 1920
                    },
                    showSuccess: false,
                    data: { folder: '../../Adv', "sid": me.Sid || "" },
                    callback: function (status, data) {
                        if (status) {
                            LG.showSuccess("导入成功");
                            if (!me.Sid) {
                                me.Sid = data.Data.APPLY_ID;
                                me.mainform.setData(data.Data);
                                me.orginData = data.Data;
                            }
                            me.reload();
                        }
                        else LG.showError(data.Message);
                    }
                });
            },
            create: function () {
                var me = this;
                me.grid.addEditRow({ "APPLY_ID": me.Sid });
            },
            delete: function () { //删除
                var me = this;
                if (me.grid.endEdit() != false) {
                    var selected = me.grid.getSelectedRows();
                    if (selected.length > 0) {
                        $.ligerDialog.confirm('确定删除吗?', function (confirm) {
                            if (confirm) {
                                for (var i = 0, len = selected.length; i < len; i++) {
                                    me.grid.deleteRow(selected[i]);
                                }
                                me.save();
                            }
                        });
                    } else {
                        LG.tip('请选择行!');
                    }
                }
            },
            close: function () {
                var me = this;
                function inner(callback) {
                    var data = me.mainform.getData();
                    var updateFields = LG.getFormCombChanges(data, me.orginData, true);
                    var isChangedGrid = me.grid.getChangedRows();
                    if (updateFields || isChangedGrid.updated.length > 0 || isChangedGrid.added.length > 0) {
                        $.ligerDialog.confirm($.ligerDefaults.GridString.isContinueByDataChanged, function (confirm) {
                            if (confirm) {
                                if (callback) callback(2);
                            }
                            else {
                                if (callback) callback(0);
                            }
                        });
                        if (callback) return callback(-1);
                        return false;
                    }
                    if (callback) return callback(1);
                    return true;
                }
                inner(function (status) {
                    if (status > 0) {
                        if (me.dialog) me.dialog.close();
                        if (me.callback) me.callback(false);
                    }
                });
            },
            setFormDefaultBtn: function (cancleCallback, savedCallback) {
                var me = this;
                //表单底部按钮
                var buttons = [];
                buttons.push({ text: '关闭', icon: 'fa fa-window-close', onclick: me.close.bind(me) });
                if (!me.isView) buttons.push({ text: '保存', icon: 'fa fa-save', onclick: me.save.bind(me) });

                LG.addFormButtons(buttons);
                me.formButtons = buttons;
            },
            setForm: function () {
                var me = this;
                me.config.form.fields.removeNull();
                var $formsearch = $("#formsearch")
                //搜索表单应用ligerui样式
                me.mainform = $formsearch.ligerForm({
                    fields: me.config.form ? me.config.form.fields : [],
                    validate: true,
                    EnterMoveNextControl: true,
                    labelAlign: 'right',
                    space: 3,
                    validate: true,
                    labelWidth: 120,
                    onAfterSetFields: function (g) {
                        me.mainform = g;
                    }
                });
                me.setFormDefaultBtn();
            },
            init: function () {
                var me = this;

                me.dialog = frameElement.dialog;
                me.dialogData = me.dialog.get('data');
                me.Sid = me.dialogData.Sid;
                me.isView = Boolean(me.dialogData.view);
                
                me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.loadData();
                me.setGrid();
                me.reload();
                return me;
            }
        };
        business.init();
    </script>
</body>
</html>
