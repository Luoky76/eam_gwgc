<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title>仓库库存预警</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <div id="mainsearch" style="width: 98%">
        <form action="" id="formsearch" class="l-form">
        </form>
    </div>
    <form action="" id="mainform">
        <div id="maingrid">
        </div>
    </form>
    <script type="text/javascript">
        'use strict';
        var business = {
            rootPath:'Material/SpStore/',
            MenuNo: getQueryStringByName("MenuNo"),
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            { display: "物料编码", name: "_search_SP_CODE", dbname: "SP_CODE", newline: false, type: "text", },
                            { display: "物料名称", name: "_search_SP_NAME", dbname: "SP_NAME", newline: false, type: "text", },
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "物料编码", name: "SP_CODE", dbname: "SP_CODE", width: 130, type: "text", },
                            { display: "物料名称", name: "SP_NAME", dbname: "SP_NAME", width: 150, type: "text", },
                            { display: "规格型号", name: "SP_SIZE", dbname: "SP_SIZE", width: 150, type: "text", },
                            { display: "品牌、厂家", name: "PRODUCE", dbname: "PRODUCE", width: 150, type: "text", },
                            { display: "库位名称", name: "STOCK_NAME", dbname: "STOCK_NAME", width: 150, type: "text", },
                            { display: "库存数量", name: "NUM", dbname: "NUM", width: 120, type: "text", },
                            { display: "计量单位", name: "UNIT", dbname: "UNIT", width: 150, type: "text", },
                            { display: "库存金额(元)", name: "MONEY", dbname: "MONEY", width: 120, type: "text", },

                            { display: "库存上限", name: "STORE_TOP", dbname: "STORE_TOP", width: 150, type: "text", },
                            { display: "库存下限", name: "STORE_LOWER", dbname: "STORE_LOWER", width: 150, type: "text", },
                        ]
                    }
                };
            },
            grid: null,
            searchForm: null,
            buttons: null,
            loadComboxData: function () {
                var me = this;
            },
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    autoWidth: false,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    toolbar: {},
                    url: me.rootPath + 'StoreLimitList',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: 'UNIT',
                    sortOrder: 'asc',
                    width: '98%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: false,
                    clickToEdit: false
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "Excel":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=xls", window.gksybConfigs.urlBase), modal: true });
                            break;
                        case "Pdf":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=pdf", window.gksybConfigs.urlBase), modal: true });
                            break;
                    }
                }
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            reload: function () { //刷新
                var me = this;
                me.buttons[0].click();
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Pdf',
                        text: '导出Pdf',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-pdf-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch = $("#formsearch")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                    }
                });
            },
            init: function () {
                var me = this;
                me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.setGrid();
                me.reload();
                return me;
            }
        };
        business.init();
    </script>
</body>
</html>
