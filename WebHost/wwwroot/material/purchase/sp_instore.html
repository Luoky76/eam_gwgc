<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title></title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <div id="mainsearch" style="width: 98%">
        <form action="" id="formsearch" class="l-form">
        </form>
    </div>
    <form action="" id="mainform">
        <div id="maingrid">
        </div>
    </form>
    <script type="text/javascript">
        'use strict';
        var business = {
            formLabelWidth: 120,
            formInputWidth: 180,
            getTextareaWidth: function () {
                var me = this;
                var fieldWidth = me.formLabelWidth + me.formInputWidth + 3;
                return Math.floor(($("#mainform").width() - 10) / fieldWidth) * fieldWidth - (me.formLabelWidth + 3);
            },
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            { display: "入库单号", name: "_search_IN_CODE", dbname: "IN_CODE", newline: false, upper: true, type: "text", options: {} },
                            { display: "入库日期", name: "_search_IN_DATE", dbname: "IN_DATE", newline: false, upper: true, type: "date", options: {} },
                            { display: "供应商", name: "_search_PROVIDER_NAME", dbname: "PROVIDER_NAME", newline: false, upper: true, type: "text", options: {} },
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "记录状态", name: "AUDITING", width: 100, type: "select", editor: { data: me.Auditing } },
                            { display: "入库单号", name: "IN_CODE", width: 100, type: "string" },
                            { display: "入库日期", name: "IN_DATE", width: 100, type: "date", editor: { type: 'date', showTime: true, format: "yyyy-MM-dd hh:mm" } },
                            { display: "供应商", name: "PROVIDER_NAME", width: 100, type: "string" },
                            { display: "仓管员", name: "IN_USER", width: 100, type: "string" },
                            { display: "验收人", name: "CHK_USER", width: 100, type: "string" },
                            { display: "收货部门", name: "DEPT_NAME", width: 100, type: "string" },
                            { display: "备注", name: "MEMO", width: 100, type: "string" },
                            { display: "主键", name: "IN_ID", width: 100, type: "string", hide: true },
                        ]
                    }
                };
            },
            grid: null,
            searchForm: null,
            buttons: null,
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'SpInstore/comboxdata',
                    loading: '正在获取中...',
                    success: function (data) {
                        me.Corp = data.Corp;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    autoWidth: true,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    usePager: false,
                    dataAction: 'server',
                    toolbar: {},
                    url: 'SpInstore/list',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: 'AUDITING',
                    sortOrder: 'asc',
                    width: '98%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: true,
                    clickToEdit: true,
                    onSuccess: function (data, g) {
                    },
                    rowAttrRender: function (rowdata, rowid) {
                        return "";
                    }
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "save":
                            me.save();
                            break;
                        case "Excel":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=xls", window.gksybConfigs.urlBase), modal: true });
                            break;
                        case "Pdf":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=pdf", window.gksybConfigs.urlBase), modal: true });
                            break;
                    }
                }
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            save: function () {
                var me = this;
                if (me.grid.endEdit() != false) {
                    if (!me.grid.isDataChanged) {
                        LG.showSuccess('无修改');
                        return;
                    }
                    if (!me.grid.validChangeRows()) return false;
                    var changeRow = me.grid.getChangedRows();
                    LG.ajax({
                        jsToken: true,
                        url: 'SpInstore/save',
                        loading: '正在保存中...',
                        data: changeRow,
                        success: function () {
                            LG.showSuccess('保存成功');
                            me.grid.isDataChanged = false;
                            me.reload();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }
            },
            reload: function () {
                var me = this;
                me.buttons[0].click();
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Pdf',
                        text: '导出Pdf',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-pdf-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch = $("#formsearch")
                me.searchForm = $formsearch.ligerForm({
                    labelWidth: me.formLabelWidth,
                    inputWidth: me.formInputWidth,
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                    }
                });
            },
            init: function () {
                var me = this;
                me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.setGrid();
                me.reload();
                return me;
            }
        };
        business.init();
    </script>
</body>

</html>
