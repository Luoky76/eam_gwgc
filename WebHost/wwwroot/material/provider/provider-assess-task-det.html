<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title>任务明细</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%; overflow:auto;">
    <form id="mainform" style="width:97%;">
    </form>
    <div style="width: 94.5%;" class="l-form">
        <div class="l-form-container">
            <ul style="display: block; width: 100%;" id="ulGrid">
                <li style="width: 50%; float: left">
                    <div class="l-group" style="display: inline-block; width: 100%; float: left"><span>评估内容明细</span></div>
                    <div style="margin-bottom: 50px; width: 100%;" id="task-base-grid">
                    </div>
                </li>
                <li style="width: 50%; float: left">
                    <div class="l-group" style="display: inline-block; width: 100%; float: left "><span>评分人明细</span></div>
                    <div style="margin-bottom: 50px; width: 100%;" id="examiner-grid">
                    </div>
                </li>
            </ul>
        </div>
    </div>
    <script type="text/javascript">
        'use strict';
        var business = {
            formLabelWidth: 120,
            formInputWidth: 180,
            getTextareaWidth: function () {
                var me = this;
                var fieldWidth = me.formLabelWidth + me.formInputWidth + 3;
                return Math.floor(($("#mainform").width() - 10) / fieldWidth) * fieldWidth - (me.formLabelWidth + 3);
            },
            menuNo: getQueryStringByName("MenuNo"),
            dialogData: {},
            //主表主键
            sid: null,
            isNew: false,
            isView: true,
            Auditing: [],
            AssessBaseContent: [],
            User: [],
            ProviderName: [],
            orginData: {},
            gridOriginData: [],
            examinerGridOriginData: [],
            setConfig: function () {
                var me = this;
                me.config = {
                    form: {
                        labelwidth: me.formLabelWidth,
                        inputWidth: me.formInputWidth,
                        fields: [
                            { display: "记录状态", name: "AUDITING", dbname: "AUDITING", width: me.formInputWidth, type: "select", editor: { type: 'select', data: me.Auditing, disabled: true } },
                            { display: "编码字段", name: "ASSESS_TASK_CODE", dbname: "ASSESS_TASK_CODE", width: me.formInputWidth, type: "text", options: { disabled: true } },
                            //实际为供应商id
                            {
                                display: "供应商名", name: "PROVIDER_ID", dbname: "PROVIDER_ID", width: me.formInputWidth, type: "select", editor: {
                                    type: 'select',
                                    options: {
                                        autocomplete: true,
                                        data: me.ProviderName
                                    },
                                    render: function (rowdata, rowindex, value, column) {
                                        var showText = '';
                                        for (var i = 0; i < me.ProviderName.length; ++i) {
                                            if (rowdata == me.ProviderName[i].ID) {
                                                showText = me.ProviderName[i].TEXT;
                                                //同时填充其它字段
                                                me.mainform.setData({
                                                    PROVIDER_NAME: me.ProviderName[i].VALUE
                                                });
                                                break;
                                            }
                                        }
                                        return showText;
                                    }
                                },
                                validate: { required: true }
                            },
                            { display: "供应商产品", name: "PROVIDER_PRODUCTION", dbname: "PROVIDER_PRODUCTION", width: me.formInputWidth, type: "text" },
                            //实际为任务制定人id
                            {
                                display: "任务制定人", name: "CREATE_USERID", width: me.formInputWidth, type: "select", editor: {
                                    type: "select",
                                    options: {
                                        autocomplete: true,
                                        data: me.User
                                    },
                                    disabled: true
                                }
                            },
                            { display: "评估年度", name: "ASSESS_YEAR", dbname: "ASSESS_YEAR", width: me.formInputWidth, type: "int" },
                            { display: "考核开始时间", name: "BEGIN_TIME", dbname: "BEGIN_TIME", width: me.formInputWidth, type: "date", format: "yyyy-MM-dd hh:mm ", options: { format: "yyyy-MM-dd hh:mm ", showTime: true } },
                            { display: "考核结束时间", name: "END_TIME", dbname: "END_TIME", width: me.formInputWidth, type: "date", format: "yyyy-MM-dd hh:mm ", options: { format: "yyyy-MM-dd hh:mm ", showTime: true } },
                            { display: "备注", name: "REMARK", dbname: "REMARK", width: me.getTextareaWidth(), type: "textarea" },
                            //隐藏
                            { display: "主键", name: "ASSESS_TASK_ID", dbname: "ASSESS_TASK_ID", width: me.formInputWidth, type: "hidden" },
                            { display: "供应商名", name: "PROVIDER_NAME", dbname: "PROVIDER_NAME", width: me.formInputWidth, type: "hidden" }
                        ]
                    },
                    grid: {
                        columns: [
                            {
                                //实际为评估基础主键
                                display: "评估内容", name: "ASSESS_BASE_ID", dbname: "ASSESS_BASE_ID", minWidth: 400, op: "equal", type: "select", editor: {
                                    type: "select",
                                    data: me.AssessBaseContent
                                }
                            },
                            //隐藏
                            { display: "主键", name: "ASSESS_TASK_DET_ID", width: 100, type: "text", hide: true },
                            { display: "评估内容", name: "CONTENT", width: 100, type: "text", hide: true },
                            { display: "评估任务ID", name: "ASSESS_TASK_ID", width: 100, type: "text", hide: true }
                        ]
                    },
                    examinerGrid: {
                        columns: [
                            {
                                //实际为评分人id
                                display: "评分人", name: "EXAMINER_ID", dbname: "EXAMINER_ID", minWidth: 400, op: "equal", type: "select", editor: {
                                    type: "select",
                                    data: me.User
                                }
                            },
                            //隐藏
                            { display: "评估任务ID", name: "ASSESS_TASK_ID", width: 100, type: "text", hide: true },
                            { display: "评估ID 主键", name: "ASSESS_ID", width: 100, type: "text", hide: true }
                        ]
                    }
                };
            },
            mainform: null,
            buttons: null,
            loadData: function () {
                var me = this;
                function inner() {
                    var data = me.mainform.getData();
                    LG.getFormCombChanges(data, me.orginData, true);
                    delete me.orginData;
                    me.orginData = data;
                }
                if (me.isNew) {
                    //设置记录状态的初值为未提交，设置主键，设置任务制定人为当前登录用户
                    me.mainform.setData({
                        AUDITING: "0",
                        ASSESS_TASK_ID: me.sid,
                        CREATE_USERID: window.session.UserID
                    });
                    inner();
                }
                else {
                    LG.ajax({
                        async: false,
                        url: 'Material/ProviderAssessTask/Get',
                        loading: '正在获取中...',
                        data: { id: me.sid },
                        success: function (data, message) {
                            me.mainform.setData(data);
                            inner();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                    if (me.isView) {
                        me.mainform.setReadonly(true);
                    }
                }
            },
            //保存前验证
            vertifyBeforeSave: function () {
                var me = this;
                var data = me.mainform.getData();
                //验证结束时间在开始时间之后
                if (data.BEGIN_TIME && data.END_TIME && data.END_TIME <= data.BEGIN_TIME) {
                    LG.showError("结束时间应在开始时间之后");
                    return false;
                }
                //验证评估年度是否合理
                if (data.ASSESS_YEAR && (data.ASSESS_YEAR >= 2099 || data.ASSESS_YEAR <= 1900)) {
                    LG.showError("请检查评估年度是否有误");
                    return false;
                }
                return true;
            },
            //保存
            save: function () { //保存
                var me = this;
                //未通过验证时停止保存
                if (!me.vertifyBeforeSave()) return;
                if (!me.mainform.valid()) {
                    me.mainform.showInvalid();
                    return;
                }
                function handle(data) {
                    data.GRID = encrypt(data.GRID);
                    data.SEARCH = encrypt(data.SEARCH);
                    data.FORM = encrypt(data.FORM);
                    return data;
                }
                var data = handle(me.mainform.getData());
                var original = handle(me.orginData);

                var changeRow = new Object();
                if (me.isNew) {
                    changeRow["added"] = [data];
                }
                else {
                    changeRow["updated"] = [data];
                    changeRow["original"] = [original];
                }
                LG.ajax({
                    jsToken: true,
                    url: 'Material/ProviderAssessTask/Save',
                    loading: '正在保存中...',
                    data: { request: changeRow },
                    success: function (result) {
                        LG.showSuccess('保存成功');
                        //保存过一次后自动变为修改模式
                        me.isNew = false;
                        //保存后原始数据变为当前数据
                        me.orginData = data;
                        me.loadData();
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            close: function () {
                var me = this;
                function inner(callback) {
                    var data = me.mainform.getData();
                    var updateFields = LG.getFormCombChanges(data, me.orginData, true);
                    if (updateFields || me.grid.isDataChanged || me.examinerGrid.isDataChanged) {
                        $.ligerDialog.confirm($.ligerDefaults.GridString.isContinueByDataChanged, function (confirm) {
                            if (confirm) {
                                if (callback) callback(2);
                            }
                            else {
                                if (callback) callback(0);
                            }
                        });
                        if (callback) return callback(-1);
                        return false;
                    }
                    if (callback) return callback(1);
                    return true;
                }
                inner(function (status) {
                    if (status > 0) {
                        if (me.dialog) me.dialog.close();
                        if (me.callback) me.callback(false);
                    }
                });
            },
            setFormDefaultBtn: function (cancelCallback, savedCallback) {
                var me = this;
                //表单底部按钮
                var buttons = [];
                if (!me.isView) {
                    buttons.push({
                        text: '重置', icon: 'fa fa-undo', onclick: function () {
                            $.ligerDialog.confirm("确定重置数据吗?", function (confirm) {
                                if (confirm) {
                                    me.loadData();
                                }
                            });
                        }
                    });
                }
                buttons.push({ text: '关闭', icon: 'fa fa-window-close', onclick: me.close.bind(me) });
                if (!me.isView) buttons.push({ text: '保存', icon: 'fa fa-save', onclick: me.save.bind(me) });

                LG.addFormButtons(buttons);
                me.formButtons = buttons;
            },
            setForm: function () {
                var me = this;
                me.config.form.fields.removeNull();
                var $formsearch = $("#mainform")
                //搜索表单应用ligerui样式
                me.mainform = $formsearch.ligerForm({
                    labelWidth: me.formLabelWidth,
                    inputWidth: me.formInputWidth,
                    EnterMoveNextControl: true,
                    labelAlign: 'right',
                    space: 3,
                    validate: true,
                    fields: me.config.form.fields,
                    //readonly: me.isView,
                    onAfterSetFields: function (g) {
                        me.mainform = g;
                        me.buttons = g.options.buttons;
                    }
                });
                me.setFormDefaultBtn();
            },
            //获取下拉框数据
            loadComboxData: function () {
                var me = this;
                var dataControl = [];
                LG.ajax({
                    async: false,
                    url: 'Material/ProviderAssessTaskDet/ComboxData',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        me.ProviderName = data.ProviderName;
                        me.AssessBaseContent = data.AssessBaseContent;
                        me.Auditing = data.Auditing;
                        me.User = data.User;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
                return dataControl;
            },
            grid: null,
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#task-base-grid").ligerGrid({
                    dateFormat: "yyyy-MM-dd hh:mm",
                    autoWidth: true,
                    delayLoad: true,
                    usePager: false,
                    columns: me.config.grid.columns,
                    dataAction: 'server',
                    toolbar: {},
                    url: 'Material/ProviderAssessTaskDet/GetAssessTask',
                    parms: {
                        assessTaskId: me.sid
                    },
                    sortName: 'ASSESS_BASE_ID',
                    sortOrder: 'asc',
                    width: '99%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: !me.isView,
                    clickToEdit: true,
                    onSuccess: function (data, g) {
                        //me.iframeloading.hide();
                        me.gridOriginData = data.Rows;
                    }
                });
                me.grid.isValid = true;
                if (!me.isView) {
                    me.loadToolbar();
                }
                me.bindGridEvent();
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Pdf',
                        text: '导出Pdf',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-pdf-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reloadTaskBase();
                            break;
                        case "add":
                            me.addTaskBase();
                            break;
                        case "delete":
                            me.deleteTaskBase();
                            break;
                        case "import":
                            me.importTaskBase();
                            break;
                        case "save":
                            me.saveTaskBase();
                            break;
                        case "Excel":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=xls", window.gksybConfigs.urlBase), modal: true, data: { gridid: "task-base-grid" } });
                            break;
                        case "Pdf":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=pdf", window.gksybConfigs.urlBase), modal: true, data: { gridid: "task-base-grid" } });
                            break;
                        default:
                            break;
                    }
                }
                //加载detail按钮
                me.grid.toolbarManager.options.group = 'detail';
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            //刷新
            reloadTaskBase: function () {
                var me = this;
                me.grid.loadData();
            },
            //新增
            addTaskBase: function () {
                var me = this;
                //设置新增行的ASSESS_TASK_ID为主表主键
                me.grid.addEditRow({"ASSESS_TASK_ID": me.sid}, true);
            },
            //导入
            importTaskBase: function () {
                var me = this;
                var gridData = me.grid.getData();
                var currentBaseIds = [];
                for (var item of gridData) {
                    currentBaseIds.push(item.ASSESS_BASE_ID);
                }
                var dataOptions = {
                    url: 'Material/ProviderAssessBase/ValidList',
                    values: currentBaseIds,
                    options: {
                        sortName: 'ASSESS_BASE_ID',
                        rowKey: "ASSESS_BASE_ID",
                        columns: [
                            { display: "评价内容", name: "CONTENT", minWidth: 500, type: "text" }
                        ]
                    },
                    fields: [
                        { display: "评价内容", name: "CONTENT", width: 200, type: "text" }
                    ],
                    callback: function (values, rows) {
                        var currentSet = new Set(currentBaseIds);
                        var newSet = new Set(values);
                        for (var i = 0; i < currentBaseIds.length; ++i) {
                            if (!newSet.has(currentBaseIds[i])) {
                                me.grid.deleteRow(i);
                            }
                        }
                        for (let item of values) {
                            if (!currentSet.has(item)) {
                                me.grid.addEditRow({ ASSESS_BASE_ID: item, ASSESS_TASK_ID: me.sid }, true);
                            }
                        }
                        me.saveTaskBase();
                    }
                }
                $.ligerDialog.open({
                    width: 1300,
                    height: 400,
                    title: '挑选评估项目',
                    url: window.gksybConfigs.urlBase + "popup-select/transfer-grid.html",
                    isResize: true,
                    slide: false,
                    data: dataOptions
                });
            },
            //保存
            saveTaskBase: function () {
                var me = this;
                if (me.grid.endEdit() != false) {
                    if (!me.grid.isDataChanged) {
                        LG.showSuccess('无修改');
                        return;
                    }
                    if (!me.grid.validChangeRows()) return false;

                    //准备数据
                    var changeRow = me.grid.getChangedRows();
                    var assessDetChangeRow = {};
                    var assessDetAdded = [];
                    var assessDetDeleted = [];

                    if (changeRow.added) {
                        for (let item1 of changeRow.added) {
                            for (let item2 of me.examinerGridOriginData) {
                                let row = {};
                                row.ASSESS_ID = item2.ASSESS_ID;
                                row.ASSESS_BASE_ID = item1.ASSESS_BASE_ID;
                                assessDetAdded.push(row);
                            }
                        }
                    }
                    if (changeRow.updated) {
                        for (let item1 of changeRow.updated) {
                            for (let item2 of me.examinerGridOriginData) {
                                let row = {};
                                row.ASSESS_ID = item2.ASSESS_ID;
                                row.ASSESS_BASE_ID = item1.ASSESS_BASE_ID;
                                assessDetAdded.push(row);
                            }
                        }
                    }
                    if (changeRow.original) {
                        for (let item1 of changeRow.original) {
                            for (let item2 of me.examinerGridOriginData) {
                                let row = {};
                                row.ASSESS_ID = item2.ASSESS_ID;
                                row.ASSESS_BASE_ID = item1.ASSESS_BASE_ID;
                                assessDetDeleted.push(row);
                            }
                        }
                    }
                    if (changeRow.deleted) {
                        for (let item1 of changeRow.deleted) {
                            for (let item2 of me.examinerGridOriginData) {
                                let row = {};
                                row.ASSESS_ID = item2.ASSESS_ID;
                                row.ASSESS_BASE_ID = item1.ASSESS_BASE_ID;
                                assessDetDeleted.push(row);
                            }
                        }
                    }
                    assessDetChangeRow.added = assessDetAdded;
                    assessDetChangeRow.updated = [];
                    assessDetChangeRow.original = [];
                    assessDetChangeRow.deleted = assessDetDeleted;

                    LG.ajax({
                        jsToken: true,
                        url: 'Material/ProviderAssessDet/Save',
                        loading: '正在保存中...',
                        data: assessDetChangeRow,
                        success: function () {

                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });

                    LG.ajax({
                        jsToken: true,
                        url: 'Material/ProviderAssessTaskDet/Save',
                        loading: '正在保存中...',
                        data: changeRow,
                        success: function () {
                            me.grid.isDataChanged = false;
                            me.reloadTaskBase();
                            me.gridOriginData = me.grid.getData();
                            //保存子表后同时保存主表（否则可能导致有子表而无主表的错误）
                            me.save();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }
            },
            //删除
            deleteTaskBase: function () {
                var me = this;
                if (me.grid.endEdit() != false) {
                    var selected = me.grid.getSelectedRows();
                    if (selected.length > 0) {
                        $.ligerDialog.confirm('确定删除吗?', function (confirm) {
                            if (confirm) {
                                me.grid.deleteSelectedRow();
                                me.saveTaskBase();
                            }
                        });
                    } else {
                        LG.tip('请选择行!');
                    }
                }
            },
            examinerGrid: null,
            setExaminerGrid: function () {
                var me = this;
                me.config.examinerGrid.columns.removeNull();
                me.examinerGrid = $("#examiner-grid").ligerGrid({
                    dateFormat: "yyyy-MM-dd hh:mm",
                    autoWidth: true,
                    delayLoad: true,
                    usePager: false,
                    columns: me.config.examinerGrid.columns,
                    dataAction: 'server',
                    toolbar: {},
                    url: 'Material/ProviderAssess/GetCertainAssessTask',
                    parms: {
                        assessTaskId: me.sid
                    },
                    sortName: 'ASSESS_ID',
                    sortOrder: 'asc',
                    width: '99%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: !me.isView,
                    clickToEdit: true,
                    onSuccess: function (data, g) {
                        //me.iframeloading.hide();
                        me.examinerGridOriginData = data.Rows;
                    }
                });
                me.examinerGrid.isValid = true;
                if (!me.isView) {
                    me.loadExaminerToolbar();
                }
                me.bindExaminerGridEvent();
            },
            bindExaminerGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.examinerToolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Pdf',
                        text: '导出Pdf',
                        click: function (item) {
                            me.examinerToolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-pdf-o"
                    }
                    ]
                });
                me.examinerGrid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
            },
            loadExaminerToolbar: function () {
                var me = this;
                me.examinerToolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reloadExaminer();
                            break;
                        case "add":
                            me.addExaminer();
                            break;
                        case "delete":
                            me.deleteExaminer();
                            break;
                        case "import":
                            me.importExaminer();
                            break;
                        case "save":
                            me.saveExaminer();
                            break;
                        case "Excel":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=xls", window.gksybConfigs.urlBase), modal: true, data: { gridid: "examiner-grid" } });
                            break;
                        case "Pdf":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=pdf", window.gksybConfigs.urlBase), modal: true, data: { gridid: "examiner-grid" } });
                            break;
                        default:
                            break;
                    }
                }
                //加载examiner按钮
                me.examinerGrid.toolbarManager.options.group = 'examiner';
                LG.loadToolbar(me.examinerGrid, me.examinerToolbarBtnItemClick);
            },
            //刷新
            reloadExaminer: function () {
                var me = this;
                me.examinerGrid.loadData();
            },
            //新增
            addExaminer: function (examinerId = null) {
                var me = this;
                //获取新增行的主键ASSESS_ID，对应表PROVIDER_ASSESS
                var assess_id = null;
                LG.ajax({
                    async: false,
                    url: 'Common/General/CreatePrimaryKey',
                    loading: '正在获取中...',
                    data: {},
                    success: function (data, message) {
                        assess_id = data;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
                //设置新增行的ASSESS_TASK_ID为主表主键，ASSESS_ID为新评估任务的主键
                me.examinerGrid.addEditRow({ "ASSESS_ID": assess_id, "ASSESS_TASK_ID": me.sid, "EXAMINER_ID": examinerId }, true);
            },
            //删除
            deleteExaminer: function () {
                var me = this;
                if (me.examinerGrid.endEdit() != false) {
                    var selected = me.examinerGrid.getSelectedRows();
                    if (selected.length > 0) {
                        $.ligerDialog.confirm('确定删除吗?', function (confirm) {
                            if (confirm) {
                                me.examinerGrid.deleteSelectedRow();
                                me.saveExaminer();
                            }
                        });
                    } else {
                        LG.tip('请选择行!');
                    }
                }
            },
            //导入
            importExaminer: function () {
                var me = this;
                var gridData = me.examinerGrid.getData();
                var currentExaminers = [];
                for (var item of gridData) {
                    currentExaminers.push(item.EXAMINER_ID);
                }
                var dataOptions = {
                    url: 'popup/users',
                    values: currentExaminers,
                    options: {
                        sortName: 'Name',
                        rowKey: "Id",
                        columns: [
                            { display: "姓名", name: "Name", type: "text" },
                            { display: "公司岗位", name: "Station", type: "text" }
                        ]
                    },
                    fields: [
                        { display: "姓名", name: "Name", width: 100, type: "text" },
                        { display: "公司岗位", name: "Station", width: 100, type: "text" }
                    ],
                    callback: function (values, rows) {
                        var currentSet = new Set(currentExaminers);
                        var newSet = new Set(values);
                        for (var i = 0; i < currentExaminers.length; ++i) {
                            if (!newSet.has(currentExaminers[i])) {
                                me.examinerGrid.deleteRow(i);
                            }
                        }
                        for (let item of values) {
                            if (!currentSet.has(item)) {
                                me.addExaminer(item);
                            }
                        }
                        me.saveExaminer();
                    }
                }
                $.ligerDialog.open({
                    width: 1300,
                    height: 400,
                    title: '挑选评分人',
                    url: window.gksybConfigs.urlBase + "popup-select/transfer-grid.html",
                    isResize: true,
                    slide: false,
                    data: dataOptions
                });
            },
            //保存
            saveExaminer: function () {
                var me = this;
                if (me.examinerGrid.endEdit() != false) {
                    if (!me.examinerGrid.isDataChanged) {
                        LG.showSuccess('无修改');
                        return;
                    }
                    if (!me.examinerGrid.validChangeRows()) return false;

                    //准备数据
                    var changeRow = me.examinerGrid.getChangedRows();
                    var assessDetChangeRow = {};
                    var assessDetAdded = [];
                    var assessDetDeleted = [];

                    if (changeRow.added) {
                        for (let item1 of changeRow.added) {
                            for (let item2 of me.gridOriginData) {
                                let row = {};
                                row.ASSESS_ID = item1.ASSESS_ID;
                                row.ASSESS_BASE_ID = item2.ASSESS_BASE_ID;
                                assessDetAdded.push(row);
                            }
                        }
                    }
                    if (changeRow.deleted) {
                        for (let item1 of changeRow.deleted) {
                            for (let item2 of me.gridOriginData) {
                                let row = {};
                                row.ASSESS_ID = item1.ASSESS_ID;
                                row.ASSESS_BASE_ID = item2.ASSESS_BASE_ID;
                                assessDetDeleted.push(row);
                            }
                        }
                    }
                    assessDetChangeRow.added = assessDetAdded;
                    assessDetChangeRow.updated = [];
                    assessDetChangeRow.original = [];
                    assessDetChangeRow.deleted = assessDetDeleted;

                    LG.ajax({
                        jsToken: true,
                        url: 'Material/ProviderAssessDet/Save',
                        loading: '正在保存中...',
                        data: assessDetChangeRow,
                        success: function () {

                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });

                    LG.ajax({
                        jsToken: true,
                        url: 'Material/ProviderAssess/Save',
                        loading: '正在保存中...',
                        data: changeRow,
                        success: function () {
                            me.examinerGrid.isDataChanged = false;
                            me.reloadExaminer();
                            me.examinerGridOriginData = me.examinerGrid.getData();
                            //保存子表后同时保存主表（否则可能导致有子表而无主表的错误）
                            me.save();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }
            },
            //初始化
            init: function () {
                var me = this;
                if (frameElement && frameElement.dialog) {
                    me.dialog = frameElement.dialog;
                    me.dialogData = me.dialog.get('data');
                    me.callback = me.dialogData.callback;
                    if (me.dialogData.sid != undefined) me.sid = me.dialogData.sid;
                    if (me.dialogData.isNew != undefined) me.isNew = me.dialogData.isNew;
                    if (me.dialogData.isView != undefined) me.isView = me.dialogData.isView;

                    //对于新增对话框，先生成并获取主键
                    if (me.isNew) {
                        LG.ajax({
                            async: false,
                            url: 'Common/General/CreatePrimaryKey',
                            loading: '正在获取中...',
                            data: { },
                            success: function (data, message) {
                                me.sid = data;
                            },
                            error: function (message) {
                                LG.showError(message);
                            }
                        });
                    }
                }

                //获取下拉框数据
                me.loadComboxData();
                //加载基础信息
                me.setConfig();
                me.setForm();
                me.loadData();

                //加载任务基础
                me.setGrid();
                me.reloadTaskBase();

                //加载评分人
                me.setExaminerGrid();
                me.reloadExaminer();

                return me;
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>

</html>
