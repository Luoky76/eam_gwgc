<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title>供应商评估</title>
    <script src="../../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 2px; height: 100%;">
    <div id="layout">
        <div position="center" title="">
            <div id="mainsearch">
                <form action="" id="formsearch" class="l-form">
                </form>
            </div>
            <div id="iframeloading" class='l-loading' style="display:none;">
            </div>
            <form id="mainform">
                <div id="maingrid" style="margin: 2px;"></div>
            </form>
        </div>
    </div>
    <script type="text/javascript">
        'use strict';
        var business = {
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            {
                                display: "评分人", name: "_search_EXAMINER_NAME", dbname: "EXAMINER_ID", width: 200, op: "equal", vt: "int", type: "select", options: {
                                    type: "select",
                                    data: me.user
                                }
                            },
                            {
                                display: "评估年度", name: "_search_ASSESS_YEAR", dbname: "ASSESS_YEAR", width: 200, type: "select", op: 'equal', options: {
                                    type: "select",
                                    data: me.assessYear
                                }
                            },
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "已提交", name: "AUDITING", width: 100, type: "chk" },
                            //实际为评分人id
                            {
                                display: "评分人", name: "EXAMINER_ID", minWidth: 100, type: "select", editor: {
                                    type: "select",
                                    data: me.user
                                }
                            },
                            { display: "考核说明", name: "REMARK", width: 100, type: "text" },
                            { display: "评价总分", name: "TOTAL_SCORE", width: 100, type: "double" },
                            { display: "评价结果", name: "RESULT", width: 100, type: "text" },
                            { display: "供应商名", name: "PROVIDER_NAME", width: 100, type: "text" },
                            //实际为任务制定人id
                            {
                                display: "任务制定人", name: "CREATE_USERID", minWidth: 100, type: "select", editor: {
                                    type: "select",
                                    data: me.user
                                }
                            },
                            { display: "评估年度", name: "ASSESS_YEAR", width: 100, type: "text" },
                            { display: "考核开始时间", name: "BEGIN_TIME", width: 100, type: "date" },
                            { display: "考核结束时间", name: "END_TIME", width: 100, type: "date" },
                            { display: "供应商产品", name: "PROVIDER_PRODUCTION", width: 100, type: "text" },
                            //隐藏
                            { display: "主键", name: "ASSESS_ID", width: 100, type: "text", hide: true },
                            { display: "评分人", name: "EXAMINER_NAME", width: 100, type: "text", hide: true },
                            { display: "供应商id", name: "PROVIDER_ID", width: 100, type: "text", hide: true },
                            { display: "任务制定人id", name: "FORMULATER_ID", width: 100, type: "int", hide: true },
                        ]
                    }
                };
            },
            //明细页面大小
            detailWidth: null,
            detailHeight: null,
            setDialogSize: function () {
                var me = this;
                me.detailWidth = window.innerWidth * 0.9;
                me.detailHeight = window.innerHeight * 0.9;
            },
            thisYear: null,
            lastYear: null,
            assessYear: null,
            menuNo: getQueryStringByName("MenuNo"),
            grid: null,
            searchForm: null,
            buttons: null,
            user: [],
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'Material/ProviderAssess/Comboxdata',
                    loading: '正在获取中...',
                    success: function (data) {
                        me.user = data.User;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            //加载评估年度下拉数据
            loadYear: function () {
                var me = this;
                var date = new Date();
                me.thisYear = date.getFullYear();
                me.lastYear = me.thisYear - 1;
                me.assessYear = [{ ID: me.thisYear, TEXT: "今年" }, { ID: me.lastYear, TEXT: "去年" }];
            },
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    autoWidth: true,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    usePager: false,
                    dataAction: 'local',
                    toolbar: {},
                    url: 'Material/ProviderAssess/ExtendList',
                    sortName: 'ASSESS_ID',
                    sortOrder: 'asc',
                    width: '98%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: false,
                    clickToEdit: true,
                    onBeforeEdit: function (editParm) {
                        switch (editParm.column.name) {
                            case "":
                                if (editParm.record.__status == "add") return true;
                                else return false;
                                break;
                        }
                    },
                    onSuccess: function (data, g) {
                        if (data && data.Rows) {
                            var rows = data.Rows || [];
                            for (var i = 0, len = rows.length; i < len; i++) {
                                var row = rows[i];
                                row.OLDROLEID = row.ROLEID;
                            }
                        }
                    },
                    rowAttrRender: function (rowdata, rowid) {
                        return "";
                    },
                    onDblClickRow: function (data, rowid, rowdata) {
                        me.view(rowid);
                    }
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            isSelectRow: function () {
                var me = this;
                var rows = me.grid.getSelectedRows();
                if (rows.length == 0) {
                    LG.tip("请选择一行");
                    return false;
                }
                return true;
            },
            isSelectSingleRow: function () {
                var me = this;
                var rows = me.grid.getSelectedRows();
                if (rows.length > 1) {
                    LG.tip("不能选择多行");
                    return false;
                } else if (rows.length == 0) {
                    LG.tip("请选择一行");
                    return false;
                }
                return true;
            },
            isAudited: function () {
                var me = this;
                var selecteds = me.grid.getSelectedRows();
                for (let row of selecteds) {
                    if (row.AUDITING == "1") {
                        LG.tip("有数据已提交，无法变更！");
                        return true;
                    }
                }
                return false;
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "modify":
                            if (!me.isSelectSingleRow() || me.isAudited()) break;
                            me.modify();
                            break;
                        case "submit":
                            if (!me.isSelectRow() || me.isAudited()) break;
                            $.ligerDialog.confirm("提交后不可修改，是否继续？", function (confirm) {
                                if (confirm) {
                                    me.submit();
                                }
                            });
                            break;
                        case "Excel":
                            $.ligerDialog.open({
                                url: "../System/Export.html?exporttype=xls",
                                modal: true
                            });
                            break;
                        case "Word":
                            $.ligerDialog.open({
                                url: "../System/Export.html?exporttype=doc",
                                modal: true
                            });
                            break;
                    }
                }
                me.grid.toolbarManager.options.group = 'main';
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            view: function (rowid) { //查看
                var me = this;
                var selected = me.grid.records[rowid];
                var sid = selected.ASSESS_ID;
                $.ligerDialog.open({
                    width: me.detailWidth,
                    height: me.detailHeight,
                    allowClose: true,
                    title: '[查看]评估明细',
                    url: "provider-assess-det.html?MenuNo=" + me.menuNo,
                    isHidden: false,
                    showMax: false,
                    showToggle: false,
                    showMin: false,
                    isResize: true,
                    slide: false,
                    onClosed: me.reload.bind(me),
                    data: { "sid": sid, "isView": true }
                });
            },
            modify: function () { //修改（评分）
                var me = this;
                var selected = me.grid.getSelectedRow();
                if (selected.EXAMINER_ID != window.session.UserID) {
                    LG.tip("您不是该任务的评分人！");
                    return;
                }
                var sid = selected.ASSESS_ID;
                $.ligerDialog.open({
                    width: me.detailWidth,
                    height: me.detailHeight,
                    allowClose: true,
                    title: '评分录入',
                    url: "provider-assess-det.html?MenuNo=" + me.menuNo,
                    isHidden: false,
                    showMax: false,
                    showToggle: false,
                    showMin: false,
                    isResize: true,
                    slide: false,
                    onClosed: me.reload.bind(me),
                    data: { "sid": sid, "isView": false }
                });
            },
            submit: function () { //提交
                var me = this;
                var selecteds = me.grid.getSelectedRows();
                if (selecteds) {
                    var updatedarr = [];
                    var orginarr = [];
                    for (var i = 0; i < selecteds.length; i++) {
                        if (selecteds[i].EXAMINER_ID != window.session.UserID) {
                            LG.tip("您不是该任务的评分人！");
                            return;
                        }
                        var ori = JSON.parse(JSON.stringify(selecteds[i]));
                        var upd = JSON.parse(JSON.stringify(selecteds[i]));
                        upd.AUDITING = "1";
                        orginarr.push(ori);
                        updatedarr.push(upd)
                    }
                    var changeRow = new Object();
                    changeRow["updated"] = updatedarr;
                    changeRow["original"] = orginarr;
                    LG.ajax({
                        jsToken: true,
                        url: 'Material/ProviderAssess/Save',
                        loading: '正在提交中...',
                        data: changeRow,
                        success: function () {
                            LG.showSuccess('提交成功');
                            me.grid.isDataChanged = false;
                            me.reload();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                } else {
                    LG.tip('请选择行!');
                }
            },
            reload: function () { //刷新
                var me = this;
                me.grid.loadData();
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Word',
                        text: '导出Word',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-word-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch = $("#formsearch")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                    }
                });
            },
            init: function () {
                var me = this;
                me.loadComboxData();
                me.loadYear();
                me.setConfig();
                me.setDialogSize();
                me.setForm();
                me.setGrid();
                me.reload();
                return me;
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>
</html>
