<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title>供应商信息登记</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 2px; height: 100%;">
    <div id="layout">
        <div position="center" title="">
            <div id="mainsearch">
                <form action="" id="formsearch" class="l-form">
                </form>
            </div>
            <div id="iframeloading" class='l-loading' style="display:none;">
            </div>
            <form id="mainform">
                <div id="maingrid" style="margin: 2px;"></div>
            </form>
        </div>
    </div>
    <script type="text/javascript">
        'use strict';
        var business = {
            menuNo: getQueryStringByName("MenuNo"),
            ver: getQueryStringByName("ver"),
            iframeloading: $("#iframeloading"),
            //明细页面大小
            detailWidth: window.innerWidth * 0.9,
            detailHeight: window.innerHeight * 0.9,
            dataYN: [{ ID: "0", TEXT: "否" }, { ID: "1", TEXT: "是" }],
            currentNode: null,
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            {
                                //实际取的是PROVIDER_ID，op: "equal"表示需要严格相等
                                display: "供应商名称", name: "_search_PROVIDER_NAME", dbname: "PROVIDER_ID", newline: false, minWidth: 300, upper: false, op: "equal", type: "select", options: {
                                    type: "select",
                                    data: me.ProviderName
                                }
                            },
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "已提交", name: "AUDITING", dbname: "AUDITING", width: 100, type: "chk" },
                            { display: "供应商名称", name: "PROVIDER_NAME", dbname: "PROVIDER_NAME", minWidth: 150, type: "text", validate: { required: true } },
                            { display: "供应商编码", name: "PROVIDER_CODE", dbname: "PROVIDER_CODE", minWidth: 150, type: "text"},
                            { display: "供应商简称", name: "ABBREVIATION", dbname: "ABBREVIATION", minWidth: 150, type: "text"},
                            { display: "地址", name: "REG_ADDRESS", dbname: "REG_ADDRESS", minWidth: 150, type: "text"},
                            { display: "企业法人", name: "LEGAL_REPRESENT", dbname: "LEGAL_REPRESENT", minWidth: 150, type: "text"},
                            { display: "营业执照号", name: "LICENSE_CODE", dbname: "LICENSE_CODE", minWidth: 150, type: "text"},
                            //隐藏
                            { display: "主键", name: "c", dbname: "PROVIDER_ID", width: 150, type: "text", hide: true },
                        ]
                    }
                };
            },
            grid: null,
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    dateFormat: "yyyy-MM-dd hh:mm",
                    autoWidth: true,
                    delayLoad: true,
                    usePager: true,
                    columns: me.config.grid.columns,
                    dataAction: 'server',
                    toolbar: {},
                    url: 'Material/ProviderInfo/List',
                    sortName: 'PROVIDER_NAME',
                    sortOrder: 'asc',
                    width: '99%',
                    height: '100%',
                    rownumbers: true,
                    checkbox: true,
                    enabledEdit: false,
                    clickToEdit: false,
                    onBeforeEdit: function (editParm) {
                        switch (editParm.column.name) {
                            case "":
                                if (editParm.record.__status == "add") return true;
                                else return false;
                                break;
                        }
                    },
                    onSuccess: function (data, g) {
                        me.iframeloading.hide();
                    },
                    rowAttrRender: function (rowdata, rowid) {
                        if (rowdata && rowdata.VALIDFLAG && rowdata.VALIDFLAG !== "1") {
                            return "style='color:red;'";
                        }
                        return "";
                    },
                    onDblClickRow: function (data, rowid, rowdata) {
                        me.view(rowid);
                    }
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            isSelectRow: function () {
                var me = this;
                var rows = me.grid.getSelectedRows();
                if (rows.length == 0) {
                    LG.tip("请选择一行");
                    return false;
                }
                return true;
            },
            isSelectSingleRow: function () {
                var me = this;
                var rows = me.grid.getSelectedRows();
                if (rows.length > 1) {
                    LG.tip("不能选择多行");
                    return false;
                } else if (rows.length == 0) {
                    LG.tip("请选择一行");
                    return false;
                }
                return true;
            },
            isAllAudited: function ({ msg = "未提交数据，无需撤销！" } = {}) {
                var me = this;
                var selecteds = me.grid.getSelectedRows();
                for (let row of selecteds) {
                    if (row.AUDITING != "1") {
                        if (msg) { LG.tip(msg); }
                        return false;
                    }
                }
                return true;
            },
            isAllUnaudited: function ({ msg = "有数据已提交，无法变更！" } = {}) {
                var me = this;
                var selecteds = me.grid.getSelectedRows();
                for (let row of selecteds) {
                    if (row.AUDITING == "1") {
                        if (msg) { LG.tip(msg); }
                        return false;
                    }
                }
                return true;
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "add":
                            me.add();
                            break;
                        case "modify":
                            if (me.isSelectSingleRow() && me.isAllUnaudited()) {
                                me.modify();
                            }
                            break;
                        case "delete":
                            if (me.isSelectRow() && me.isAllUnaudited()) {
                                me.delete();
                            }
                            break;
                        case "save":
                            me.save();
                            break;
                        case "submit":
                            if (me.isSelectRow() && me.isAllUnaudited()) {
                                $.ligerDialog.confirm("提交后不可修改，是否继续？", function (confirm) {
                                    if (confirm) {
                                        me.submit();
                                    }
                                });
                            }
                            break;
                        case "revoke":
                            if (me.isSelectRow() && me.isAllAudited()) {
                                me.revoke();
                            }
                            break;
                        case "Excel":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=xls", window.gksybConfigs.urlBase), modal: true });
                            break;
                        case "Pdf":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=pdf", window.gksybConfigs.urlBase), modal: true });
                            break;
                        default:
                            break;
                    }
                }
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            openDetail: function ({ sid = null, isNew = false, isView = false } = {}) {
                var me = this;
                $.ligerDialog.open({
                    width: me.detailWidth,
                    height: me.detailHeight,
                    allowClose: true,
                    title: isNew ? "[新增]供应商信息登记" : (isView ? "[查看]供应商信息登记" : "[修改]供应商信息登记"),
                    url: "provider-info-detail.html?MenuNo=" + me.menuNo + "&ver=" + me.ver,
                    isHidden: false,
                    showMax: false,
                    showToggle: false,
                    showMin: false,
                    isResize: true,
                    slide: false,
                    onClosed: me.reload.bind(me),
                    data: { sid: sid, isNew: isNew, isView: isView }
                });
            },
            add: function () {
                this.openDetail({ sid: null, isNew: true, isView: false });
            },
            view: function (rowid) {
                var me = this;
                var selected = rowid != undefined ? me.grid.records[rowid] : me.grid.getSelectedRow();
                if (!selected) {
                    LG.tip('请选择行!');
                    return;
                }
                me.openDetail({ sid: selected.PROVIDER_ID, isNew: false, isView: true });
            },
            modify: function () {
                var me = this;
                var selected = me.grid.getSelectedRow();
                if (!selected) {
                    LG.tip('请选择行!');
                    return;
                }
                me.openDetail({ sid: selected.PROVIDER_ID, isNew: false, isView: false });
            },
            submit: function () {
                var me = this;
                var selecteds = me.grid.getSelectedRows();
                if (selecteds.length == 0) {
                    LG.tip('请选择行!');
                    return;
                }
                var sids = [];
                for (var i = 0; i < selecteds.length; i++) {
                    sids.push(selecteds[i].PROVIDER_ID);
                }
                LG.ajax({
                    jsToken: true,
                    url: 'Material/ProviderInfo/Submit',
                    loading: '正在提交中...',
                    data: { sids: sids },
                    success: function () {
                        LG.showSuccess('提交成功');
                        me.grid.isDataChanged = false;
                        me.reload();
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            revoke: function () {
                var me = this;
                var selecteds = me.grid.getSelectedRows();
                if (selecteds.length == 0) {
                    LG.tip('请选择行!');
                    return;
                }
                var sids = [];
                for (var i = 0; i < selecteds.length; i++) {
                    sids.push(selecteds[i].PROVIDER_ID);
                }
                LG.ajax({
                    jsToken: true,
                    url: 'Material/ProviderInfo/Revoke',
                    loading: '正在撤销中...',
                    data: { sids: sids },
                    success: function () {
                        LG.showSuccess('撤销成功');
                        me.grid.isDataChanged = false;
                        me.reload();
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            save: function () { //保存
                var me = this;
                if (me.grid.endEdit() != false) {
                    if (!me.grid.isDataChanged) {
                        LG.showSuccess('无修改');
                        return;
                    }
                    if (!me.grid.validChangeRows()) return false;
                    var changeRow = me.grid.getChangedRows();
                    LG.ajax({
                        jsToken: true,
                        url: 'Material/ProviderInfo/Save',
                        loading: '正在保存中...',
                        data: changeRow,
                        success: function () {
                            LG.showSuccess('保存成功');
                            me.grid.isDataChanged = false;
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }
            },
            reload: function () { //刷新
                var me = this;
                me.grid.loadData();
            },
            delete: function () { //删除
                var me = this;
                if (me.grid.endEdit() != false) {
                    var selected = me.grid.getSelectedRows();
                    if (selected.length > 0) {
                        $.ligerDialog.confirm('确定删除吗?', function (confirm) {
                            if (confirm) {
                                for (var i = 0, len = (selected || []).length; i < len; i++) {
                                    me.grid.deleteRow(selected[i]);
                                }
                                me.save();
                            }
                        });
                    }
                }
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Pdf',
                        text: '导出Pdf',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-pdf-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch = $("#formsearch")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                    }
                });
            },
            //获取下拉框数据
            loadComboxData: function () {
                var me = this;
                var dataControl = [];
                LG.ajax({
                    async: false,
                    url: 'Material/ProviderInfo/ComboxData',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        me.ProviderName = data.ProviderName;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
                return dataControl;
            },
            init: function () {
                var me = this;
                $("#layout").ligerLayout({ leftWidth: 240 });
                me.iframeloading.show();
                me.loadComboxData();
                me.setConfig();
                me.setGrid();
                me.setForm();
                me.reload();
                return me;
            }
        };
        business.init();
    </script>
</body>
</html>
