<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title>供应商详细信息</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%; overflow:auto;">
    <form id="mainform" style="width:97%; margin-bottom:50px;">
    </form>
    <script type="text/javascript">
        'use strict';
        var business = {
            formLabelWidth: 120,
            formInputWidth: 180,
            menuNo: getQueryStringByName("MenuNo"),
            dialogData: {},
            sid: getQueryStringByName("sid"),
            isNew: false,
            isView: true,
            auditing: [],
            dataDevice: [],
            orginData: {},
            setConfig: function () {
                var me = this;
                me.config = {
                    form: {
                        labelwidth: me.formLabelWidth,
                        fields: [
                            //基础信息
                            {
                                display: "记录状态", name: "AUDITING", dbname: "AUDITING", width: 300, type: "select", options: {
                                    type: 'select',
                                    data: me.auditing,
                                    value: "0",
                                    disabled: true
                                }, group: "基础信息"
                            },
                            { display: "服务单位", name: "ORG_NAME", dbname: "ORG_NAME", width: 300, type: "text" },
                            { display: "管理部门", name: "DEPT_NAME", dbname: "DEPT_NAME", width: 300, type: "text" },
                            { display: "供应商编码", name: "PROVIDER_CODE", dbname: "PROVIDER_CODE", width: 300, type: "text", options: { disabled: true } },
                            { display: "供应商名称", name: "PROVIDER_NAME", dbname: "PROVIDER_NAME", width: 300, type: "text", validate: { required: true } },
                            { display: "供应商简称", name: "ABBREVIATION", dbname: "ABBREVIATION", width: 300, type: "text" },
                            { display: "地址", name: "REG_ADDRESS", dbname: "REG_ADDRESS", width: 300, type: "text" },
                            { display: "企业法人", name: "LEGAL_REPRESENT", dbname: "LEGAL_REPRESENT", width: 300, type: "text" },
                            {
                                display: "注册资金", name: "ENTITY_REG_FUND", dbname: "ENTITY_REG_FUND", width: 300, type: "text", options: {
                                    currency: true,
                                    onChangeValue: function (a, value) {
                                        if (value < 0) {
                                            $('#ENTITY_REG_FUND').val(0);
                                        }
                                    }
                                }
                            },
                            {
                                display: "企业性质", name: "ENTER_NATURE", dbname: "ENTER_NATURE", width: 300, type: "select", options: {
                                    type: "select",
                                    data: me.enterNature
                                }
                            },
                            { display: "营业执照号", name: "LICENSE_CODE", dbname: "LICENSE_CODE", width: 300, type: "text" },
                            { display: "企业年资", name: "ENTER_QUALITY", dbname: "ENTER_QUALITY", width: 300, type: "text" },
                            { display: "经营许可证", name: "BUSINESS_LIC", dbname: "BUSINESS_LIC", width: 300, type: "text" },
                            {
                                display: "一般纳税人", name: "AVERAGE_TAX", dbname: "AVERAGE_TAX", width: 300, type: "select", options: {
                                    type: "select",
                                    data: me.yesNo
                                }
                            },
                            { display: "主供范围", name: "BIZ_SCOPE", dbname: "BIZ_SCOPE", width: 300, type: "text" },
                            {
                                display: "供应商来源", name: "PROVIDER_SRC", dbname: "PROVIDER_SRC", width: 300, type: "select", options: {
                                    type: "select",
                                    data: me.providerSrc
                                }
                            },
                            {
                                display: "供应商分类", name: "PROVIDER_TYPE", dbname: "PROVIDER_TYPE", width: 300, type: "select", options: {
                                    type: "select",
                                    data: me.providerType
                                }
                            },
                            //{ display: "供应商状态", name: "PROVIDER_STATUS", dbname: "PROVIDER_STATUS", width: 300, type: "text" },
                            { display: "合作情况", name: "COOPERATION", dbname: "COOPERATION", width: 300, type: "text" },
                            //{ display: "评审结论", name: "CONCLUSION", dbname: "CONCLUSION", width: 300, type: "text" },
                            //{ display: "综合评定", name: "QUA_CONCLUSION", dbname: "QUA_CONCLUSION", width: 300, type: "text" },
                            { display: "开户银行", name: "BANK_NAME", dbname: "BANK_NAME", width: 300, type: "text" },
                            { display: "联行号", name: "BANK_CODE", dbname: "BANK_CODE", width: 300, type: "text" },
                            { display: "税务登记号", name: "TAX_REG_NO", dbname: "TAX_REG_NO", width: 300, type: "text" },
                            { display: "物资品质", name: "QUALITY", dbname: "QUALITY", width: 300, type: "text" },
                            { display: "交货期", name: "DELIVERY", dbname: "DELIVERY", width: 300, type: "text" },
                            { display: "紧急订单处理", name: "ORDER_SIT", dbname: "ORDER_SIT", width: 300, type: "text" },
                            { display: "资信情况", name: "CREDIT", dbname: "CREDIT", width: 300, type: "text" },
                            { display: "综合实力", name: "STRENGTH", dbname: "STRENGTH", width: 300, type: "text" },
                            { display: "售后服务速度", name: "RESPONE_SPEED", dbname: "RESPONE_SPEED", width: 300, type: "text" },
                            { display: "售后服务品质", name: "SERVICE_QUAL", dbname: "SERVICE_QUAL", width: 300, type: "text" },

                            //地址
                            //{ display: "国家", name: "COUNTY", dbname: "COUNTY", width: 300, type: "text", group: "地址" },
                            //{ display: "省份", name: "PROVINCE", dbname: "PROVINCE", width: 300, type: "text" },
                            //{ display: "城市", name: "CITY", dbname: "CITY", width: 300, type: "text" },

                            //联系信息
                            { display: "联系人", name: "PROVIDER_CONTACT", dbname: "PROVIDER_CONTACT", width: 300, type: "text", group: "联系信息" },
                            { display: "联系电话", name: "PROVIDER_PHONE", dbname: "PROVIDER_PHONE", width: 300, type: "text" },
                            { display: "传真", name: "FAX", dbname: "FAX", width: 300, type: "text" },
                            { display: "邮件", name: "EMAIL", dbname: "EMAIL", width: 300, type: "text" },
                            { display: "网站", name: "WEBSITE", dbname: "WEBSITE", width: 300, type: "text" },

                            //隐藏
                            //记录信息
                            { display: "主键", name: "PROVIDER_ID", dbname: "PROVIDER_ID", width: 300, type: "hidden" },
                            { display: "服务单位ID", name: "ORG_ID", dbname: "ORG_ID", width: 300, type: "hidden" },
                            { display: "管理部门ID", name: "DEPT_ID", dbname: "DEPT_ID", width: 300, type: "hidden" },
                        ]
                    }
                };
            },
            mainform: null,
            buttons: null,
            yesNo: [{ ID: 0, TEXT: "否" }, { ID: 1, TEXT: "是" }],
            auditing: [],
            enterNature: [],
            providerSrc: [],
            providerType: [],
            loadData: function () {
                var me = this;
                function inner() {
                    var data = me.mainform.getData();
                    LG.getFormCombChanges(data, me.orginData, true);
                    delete me.orginData;
                    me.orginData = data;
                }
                if (me.isNew) {
                    inner();
                }
                else {
                    LG.ajax({
                        async: false,
                        url: 'Material/ProviderInfo/Get',
                        loading: '正在获取中...',
                        data: { id: me.sid },
                        success: function (data, message) {
                            me.mainform.setData(data);
                            inner();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                    if (me.isView) {
                        me.mainform.setReadonly(true);
                    }
                }
            },
            //保存
            save: function () {
                var me = this;
                if (!me.mainform.valid()) {
                    me.mainform.showInvalid();
                    return;
                }
                function handle(data) {
                    data.GRID = encrypt(data.GRID);
                    data.SEARCH = encrypt(data.SEARCH);
                    data.FORM = encrypt(data.FORM);
                    return data;
                }
                var data = handle(me.mainform.getData());
                var original = handle(me.orginData);

                var changeRow = new Object();
                if (me.isNew) {
                    changeRow["added"] = [data];
                }
                else {
                    changeRow["updated"] = [data];
                    changeRow["original"] = [original];
                }
                LG.ajax({
                    jsToken: true,
                    url: 'Material/ProviderInfo/save',
                    loading: '正在保存中...',
                    data: { request: changeRow },
                    success: function (result) {
                        LG.showSuccess('保存成功', function () {
                            if (me.dialog) me.dialog.close();
                        });
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            //关闭
            close: function () {
                var me = this;
                function inner(callback) {
                    var data = me.mainform.getData();
                    var updateFields = LG.getFormCombChanges(data, me.orginData, true);
                    if (updateFields) {
                        $.ligerDialog.confirm($.ligerDefaults.GridString.isContinueByDataChanged, function (confirm) {
                            if (confirm) {
                                if (callback) callback(2);
                            }
                            else {
                                if (callback) callback(0);
                            }
                        });
                        if (callback) return callback(-1);
                        return false;
                    }
                    if (callback) return callback(1);
                    return true;
                }
                inner(function (status) {
                    if (status > 0) {
                        if (me.dialog) me.dialog.close();
                        if (me.callback) me.callback(false);
                    }
                });
            },
            setFormDefaultBtn: function (cancleCallback, savedCallback) {
                var me = this;
                //表单底部按钮
                var buttons = [];
                if (!me.isView) {
                    buttons.push({
                        text: '重置', icon: 'fa fa-undo', onclick: function () {
                            $.ligerDialog.confirm("确定重置数据吗?", function (confirm) {
                                if (confirm) {
                                    me.loadData();
                                }
                            });
                        }
                    });
                }
                buttons.push({ text: '关闭', icon: 'fa fa-window-close', onclick: me.close.bind(me) });
                if (!me.isView) buttons.push({ text: '保存', icon: 'fa fa-save', onclick: me.save.bind(me) });

                LG.addFormButtons(buttons);
                me.formButtons = buttons;
            },
            setForm: function () {
                var me = this;
                me.config.form.fields.removeNull();
                var $formsearch = $("#mainform")
                //搜索表单应用ligerui样式
                me.mainform = $formsearch.ligerForm({
                    EnterMoveNextControl: true,
                    labelAlign: 'right',
                    space: 3,
                    validate: true,
                    fields: me.config.form.fields,
                    labelWidth: me.formLabelWidth,
                    onAfterSetFields: function (g) {
                        me.mainform = g;
                        me.buttons = g.options.buttons;
                    }
                });
                me.setFormDefaultBtn();
            },
            //获取下拉框数据
            loadComboxData: function () {
                var me = this;
                var dataControl = [];
                LG.ajax({
                    async: false,
                    url: 'Material/ProviderInfo/ComboxData',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        me.auditing = data.Auditing;
                        me.enterNature = data.EnterNature;
                        me.providerSrc = data.ProviderSrc;
                        me.providerType = data.ProviderType;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
                return dataControl;
            },
            init: function () {
                var me = this;
                if (frameElement && frameElement.dialog) {
                    me.dialog = frameElement.dialog;
                    me.dialogData = me.dialog.get('data');
                    me.callback = me.dialogData.callback;
                    if (me.dialogData.sid) me.sid = me.dialogData.sid;
                    if (me.dialogData.isNew != undefined) me.isNew = me.dialogData.isNew;
                    if (me.dialogData.isView != undefined) me.isView = me.dialogData.isView;
                    if (me.dialogData.typeid) me.typeid = me.dialogData.typeid;
                    if (me.dialogData.typename) me.typename = me.dialogData.typename;
                }

                //加载基础信息
                me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.loadData();

                return me;
            }
        };
        business.init();
    </script>
</body>

</html>
