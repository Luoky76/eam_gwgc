<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title>供应商评估任务</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 2px; height: 100%;">
    <div id="layout">
        <div position="center" title="">
            <div id="mainsearch">
                <form action="" id="formsearch" class="l-form">
                </form>
            </div>
            <div id="iframeloading" class='l-loading' style="display:none;">
            </div>
            <form id="mainform">
                <div id="maingrid" style="margin: 2px;"></div>
            </form>
        </div>
    </div>
    <script type="text/javascript">
        'use strict';
        var business = {

            formLabelWidth: 98,
            formInputWidth: 180,
            getTextareaWidth: function () {
                var me = this;
                var fieldWidth = me.formLabelWidth + me.formInputWidth + 3;
                return Math.floor(($("#mainform").width() - 10) / fieldWidth) * fieldWidth - (me.formLabelWidth + 3);
            },
menuNo: getQueryStringByName("MenuNo"),
            ver: getQueryStringByName("ver"),
            iframeloading: $("#iframeloading"),
            //明细页面大小
            detailWidth: null,
            detailHeight: null,
            setDialogSize: function () {
                var me = this;
                me.detailWidth = window.innerWidth * 0.9;
                me.detailHeight = window.innerHeight * 0.9;
            },
            thisYear: null,
            lastYear: null,
            assessYear: null,
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            { display: "供应商产品", name: "_search_PROVIDER_PRODUCTION", dbname: "PROVIDER_PRODUCTION", labelWidth: me.formLabelWidth, width: 200, type: "text", options: {} },
                            { display: "供应商", name: "_search_PROVIDER_NAME", dbname: "PROVIDER_NAME", width: 200, type: "text", options: {} },
                            {
                                display: "评估年度", name: "_search_ASSESS_YEAR", dbname: "ASSESS_YEAR", width: 200, type: "select", op: 'equal', options: {
                                    type: "select",
                                    data: me.assessYear
                                }
                            },
                            {
                                display: "考核开始时间", name: "_search_BEGIN_TIME_FROM", dbname: "BEGIN_TIME", width: 200, newline: true, type: "date", op: 'greaterorequal', vt: 'date',
                                options: {
                                    format: "yyyy-MM-dd"
                                }
                            },
                            {
                                display: "至", name: "_search_BEGIN_TIME_TO", dbname: "BEGIN_TIME", labelWidth: me.formLabelWidth, width: 200, newline: false, type: "date", op: 'lessorequal', vt: 'date',
                                options: {
                                    format: "yyyy-MM-dd"
                                }
                            },
                            {
                                display: "考核结束时间", name: "_search_END_TIME_FROM", dbname: "END_TIME", width: 200, newline: true, type: "date", op: 'greaterorequal', vt: 'date',
                                options: {
                                    format: "yyyy-MM-dd"
                                }
                            },
                            {
                                display: "至", name: "_search_END_TIME_TO", dbname: "END_TIME", labelWidth: me.formLabelWidth, width: 200, newline: false, type: "date", op: 'lessorequal', vt: 'date',
                                options: {
                                    format: "yyyy-MM-dd"
                                }
                            },
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "已提交", name: "AUDITING", width: 100, type: "chk" },
                            { display: "任务编码", name: "ASSESS_TASK_CODE", width: 100, type: "text" },
                            { display: "供应商名", name: "PROVIDER_NAME", width: 100, type: "text" },
                            { display: "供应商产品", name: "PROVIDER_PRODUCTION", width: 100, type: "text" },
                            //实际为任务制定人id
                            {
                                display: "任务制定人", name: "CREATE_USERID", minWidth: 100, type: "select", editor: {
                                    type: "select",
                                    data: me.user,
                                    readonly: true
                                }
                            },
                            { display: "评估年度", name: "ASSESS_YEAR", width: 100, type: "text" },
                            { display: "考核开始时间", name: "BEGIN_TIME", minWidth: 200, type: "date" },
                            { display: "考核结束时间", name: "END_TIME", minWidth: 200, type: "date" },
                            { display: "备注", name: "REMARK", width: 300, type: "text" },
                            //隐藏
                            { display: "主键", name: "ASSESS_TASK_ID", width: 100, type: "text", hide: true },
                            { display: "供应商id", name: "PROVIDER_ID", width: 100, type: "text", hide: true },
                            { display: "任务制定人id", name: "FORMULATER_ID", width: 100, type: "int", hide: true }
                        ]
                    }
                };
            },
            grid: null,
            searchForm: null,
            buttons: null,
            user: [],
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'Material/ProviderAssessTask/Comboxdata',
                    loading: '正在获取中...',
                    success: function (data) {
                        me.user = data.User;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            //加载评估年度下拉数据
            loadYear: function () {
                var me = this;
                var date = new Date();
                me.thisYear = date.getFullYear();
                me.lastYear = me.thisYear - 1;
                me.assessYear = [{ ID: me.thisYear, TEXT: "今年" }, { ID: me.lastYear, TEXT: "去年" }];
            },
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    autoWidth: true,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    usePager: false,
                    dataAction: 'server',
                    toolbar: {},
                    url: 'Material/ProviderAssessTask/List',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: 'ASSESS_TASK_ID',
                    sortOrder: 'asc',
                    width: '98%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: false,
                    clickToEdit: false,
                    onBeforeEdit: function (editParm) {
                        switch (editParm.column.name) {
                            case "":
                                if (editParm.record.__status == "add") return true;
                                else return false;
                                break;
                        }
                    },
                    onSuccess: function (data, g) {
                        if (data && data.Rows) {
                            var rows = data.Rows || [];
                            for (var i = 0, len = rows.length; i < len; i++) {
                                var row = rows[i];
                                row.OLDROLEID = row.ROLEID;
                            }
                        }
                    },
                    rowAttrRender: function (rowdata, rowid) {
                        return "";
                    },
                    onDblClickRow: function (data, rowid, rowdata) {
                        me.view(rowid);
                    }
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            isSelectRow: function () {
                var me = this;
                var rows = me.grid.getSelectedRows();
                if (rows.length == 0) {
                    LG.tip("请选择一行");
                    return false;
                }
                return true;
            },
            isSelectSingleRow: function () {
                var me = this;
                var rows = me.grid.getSelectedRows();
                if (rows.length > 1) {
                    LG.tip("不能选择多行");
                    return false;
                } else if (rows.length == 0) {
                    LG.tip("请选择一行");
                    return false;
                }
                return true;
            },
            isAllAudited: function ({ msg = "未提交数据，无需撤销！" } = {}) {
                var me = this;
                var selecteds = me.grid.getSelectedRows();
                for (let row of selecteds) {
                    if (row.AUDITING != "1") {
                        if (msg) { LG.tip(msg); }
                        return false;
                    }
                }
                return true;
            },
            isAllUnaudited: function ({ msg = "有数据已提交，无法变更！" } = {}) {
                var me = this;
                var selecteds = me.grid.getSelectedRows();
                for (let row of selecteds) {
                    if (row.AUDITING == "1") {
                        if (msg) { LG.tip(msg); }
                        return false;
                    }
                }
                return true;
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "add":
                            me.add();
                            break;
                        case "modify":
                            if (me.isSelectSingleRow() && me.isAllUnaudited()) {
                                me.modify();
                            }
                            break;
                        case "delete":
                            if (me.isSelectRow() && me.isAllUnaudited()) {
                                me.delete();
                            }
                            break;
                        case "save":
                            me.save();
                            break;
                        case "submit":
                            if (me.isSelectRow() && me.isAllUnaudited()) {
                                $.ligerDialog.confirm("提交后不可修改，是否继续？", function (confirm) {
                                    if (confirm) {
                                        me.submit();
                                    }
                                });
                            }
                            break;
                        case "revoke":
                            if (me.isSelectSingleRow() && me.isAllAudited()) {
                                me.revoke();
                            }
                            break;
                        case "Excel":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=xls", window.gksybConfigs.urlBase), modal: true });
                            break;
                        case "Pdf":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=pdf", window.gksybConfigs.urlBase), modal: true });
                            break;
                    }
                }
                me.grid.toolbarManager.options.group = 'main';
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            openDetail: function ({ sid = null, isNew = false, isView = false } = {}) {
                var me = this;
                $.ligerDialog.open({
                    width: me.detailWidth,
                    height: me.detailHeight,
                    allowClose: true,
                    title: isNew ? "[新增]任务明细" : (isView ? "[查看]任务明细" : "[修改]任务明细"),
                    url: "provider-assess-task-det.html?MenuNo=" + me.menuNo,
                    isHidden: false,
                    showMax: false,
                    showToggle: false,
                    showMin: false,
                    isResize: true,
                    slide: false,
                    onClosed: me.reload.bind(me),
                    data: { sid: sid, isNew: isNew, isView: isView }
                });
            },
            add: function () {
                this.openDetail({ sid: null, isNew: true, isView: false });
            },
            view: function (rowid) {
                var me = this;
                var selected = rowid != undefined ? me.grid.records[rowid] : me.grid.getSelectedRow();
                if (!selected) {
                    LG.tip('请选择行!');
                    return;
                }
                me.openDetail({ sid: selected.ASSESS_TASK_ID, isNew: false, isView: true });
            },
            modify: function () {
                var me = this;
                var selected = me.grid.getSelectedRow();
                if (selected) {
                    if (selected.CREATE_USERID != window.session.UserID) {
                        LG.tip("您不是该任务的制定人！");
                        return;
                    }
                    me.openDetail({ sid: selected.ASSESS_TASK_ID, isNew: false, isView: false });
                }
            },
            save: function () { //保存
                var me = this;
                if (me.grid.endEdit() != false) {
                    if (!me.grid.isDataChanged) {
                        LG.showSuccess('无修改');
                        return;
                    }
                    if (!me.grid.validChangeRows()) return false;
                    var changeRow = me.grid.getChangedRows();
                    LG.ajax({
                        jsToken: true,
                        url: 'Material/ProviderAssessTask/Save',
                        loading: '正在保存中...',
                        data: changeRow,
                        success: function () {
                            LG.showSuccess('保存成功');
                            me.grid.isDataChanged = false;
                            me.reload();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }

            },
            submit: function () {
                var me = this;
                var selecteds = me.grid.getSelectedRows();
                if (selecteds.length == 0) {
                    LG.tip('请选择行!');
                    return;
                }
                var sids = [];
                for (var i = 0; i < selecteds.length; i++) {
                    if (selecteds[i].CREATE_USERID != window.session.UserID) {
                        LG.tip("您不是该任务的制定人！");
                        return;
                    }
                    sids.push(selecteds[i].ASSESS_TASK_ID);
                }
                LG.ajax({
                    jsToken: true,
                    url: 'Material/ProviderAssessTask/Submit',
                    loading: '正在提交中...',
                    data: { sids: sids },
                    success: function () {
                        LG.showSuccess('提交成功');
                        me.grid.isDataChanged = false;
                        me.reload();
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            revoke: function () {
                var me = this;
                var selected = me.grid.getSelectedRow();
                if (selected.CREATE_USERID != window.session.UserID) {
                    LG.tip("您不是该任务的制定人！");
                    return;
                }
                LG.ajax({
                    jsToken: true,
                    url: 'Material/ProviderAssessTask/Revoke',
                    loading: '正在撤销中...',
                    data: { assessTaskId: selected.ASSESS_TASK_ID },
                    success: function () {
                        LG.showSuccess('撤销成功');
                        me.grid.isDataChanged = false;
                        me.reload();
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            reload: function () { //刷新
                var me = this;
                me.grid.loadData();
            },
            delete: function () { //删除
                var me = this;
                if (me.grid.endEdit() != false) {
                    var selected = me.grid.getSelectedRows();
                    if (selected.length > 0) {
                        $.ligerDialog.confirm('确定删除吗?', function (confirm) {
                            if (confirm) {
                                for (var i = 0, len = (selected || []).length; i < len; i++) {
                                    me.grid.deleteRow(selected[i]);
                                }
                                me.save();
                            }
                        });
                    }
                }
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Pdf',
                        text: '导出Pdf',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-pdf-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch = $("#formsearch")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    labelWidth: me.formLabelWidth,
                    inputWidth: me.formInputWidth,
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                    }
                });
            },
            init: function () {
                var me = this;
                me.setDialogSize();
                me.loadComboxData();
                me.loadYear();
                me.setConfig();
                me.setForm();
                me.setGrid();
                me.reload();
                return me;
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>
</html>
