<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title>供应商评估结果</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 2px; height: 100%;">
    <div id="layout">
        <div position="center" title="">
            <div id="mainsearch">
                <form action="" id="formsearch" class="l-form">
                </form>
            </div>
            <div id="iframeloading" class='l-loading' style="display:none;">
            </div>
            <form id="mainform">
                <div id="maingrid" style="margin: 2px;"></div>
            </form>
        </div>
    </div>
    <script type="text/javascript">
        'use strict';
        var business = {
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            {
                                display: "供应商", name: "_search_PROVIDER_ID", dbname: "PROVIDER_ID", width: 200, type: "select", op: "equal", options: {
                                    type: "select",
                                    data: me.providerName
                                }
                            },
                            { display: "供应商产品", name: "_search_PROVIDER_PRODUCTION", dbname: "PROVIDER_PRODUCTION", width: 200, type: "text" },
                            {
                                display: "评估年度", name: "_search_ASSESS_YEAR", dbname: "ASSESS_YEAR", width: 200, type: "select", op: 'equal', options: {
                                    type: "select",
                                    data: me.assessYear
                                }
                            }
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "供应商", name: "PROVIDER_NAME", minWidth: 300, type: "text" },
                            { display: "供应商产品", name: "PROVIDER_PRODUCTION", width: 300, type: "text" },
                            { display: "评估年度", name: "ASSESS_YEAR", width: 300, type: "text" },
                            { display: "总分", name: "TOTAL_SCORE_SUM", width: 300, type: "text" },
                            { display: "平均分", name: "AVERAGE_SCORE", width: 300, type: "text" },
                            { display: "最高分", name: "MAX_SCORE", width: 300, type: "text" },
                            { display: "最低分", name: "MIN_SCORE", width: 300, type: "text" },
                            { display: "实际评分人数", name: "EXAMINER_CNT_ACTUAL", width: 300, type: "text" },
                            { display: "计划评分人数", name: "EXMAINER_CNT", width: 300, type: "text" },
                            //隐藏
                            { display: "主键", name: "ASSESS_TASK_ID", width: 300, type: "text", hide: true },
                            { display: "供应商ID", name: "PROVIDER_ID", width: 300, type: "text", hide: true },
                        ]
                    }
                };
            },
            providerName: [],
            user: [],
            thisYear: null,
            lastYear: null,
            assessYear: null,
            grid: null,
            searchForm: null,
            buttons: null,
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'Material/ProviderAssessTask/Comboxdata',
                    loading: '正在获取中...',
                    success: function (data) {
                        me.providerName = data.ProviderName;
                        me.user = data.User;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            //加载评估年度下拉数据
            loadYear: function () {
                var me = this;
                var date = new Date();
                me.thisYear = date.getFullYear();
                me.lastYear = me.thisYear - 1;
                me.assessYear = [{ ID: me.thisYear, TEXT: "今年" }, { ID: me.lastYear, TEXT: "去年" }];
            },
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    autoWidth: true,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    usePager: false,
                    dataAction: 'server',
                    toolbar: {},
                    url: 'Material/ProviderAssessTask/ResultList',
                    sortName: 'ASSESS_TASK_ID',
                    sortOrder: 'asc',
                    width: '98%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: false,
                    clickToEdit: false,
                    onBeforeEdit: function (editParm) {

                    },
                    onSuccess: function (data, g) {

                    },
                    rowAttrRender: function (rowdata, rowid) {

                    }
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "Excel":
                            $.ligerDialog.open({
                                url: "../System/Export.html?exporttype=xls",
                                modal: true
                            });
                            break;
                        case "Word":
                            $.ligerDialog.open({
                                url: "../System/Export.html?exporttype=doc",
                                modal: true
                            });
                            break;
                        default:
                            break;
                    }
                }
                me.grid.toolbarManager.options.group = 'main';
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            reload: function () { //刷新
                var me = this;
                me.grid.loadData();
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Word',
                        text: '导出Word',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-word-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch = $("#formsearch")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                    }
                });
            },
            init: function () {
                var me = this;
                me.loadComboxData();
                me.loadYear();
                me.setConfig();
                me.setForm();
                me.setGrid();
                me.reload();
                return me;
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>
</html>
