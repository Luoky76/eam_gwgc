<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title>物资不同分类盘点</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>
<body style="padding: 5px; height: 100%;">
    <div id="mainsearch" style="width: 100%">
        <form action="" id="formsearch" class="l-form">
            <div id="formsearch1">
            </div>
        </form>
    </div>
    <form action="" id="mainform">
        <div id="gridform">
            <div id="maingrid" hidetitle=true>
            </div>
        </div>
    </form>
    <script type="text/javascript">
        'use strict';
        var business = {

            formLabelWidth: 120,
            formInputWidth: 180,
            getTextareaWidth: function () {
                var me = this;
                var fieldWidth = me.formLabelWidth + me.formInputWidth + 3;
                return Math.floor(($("#mainform").width() - 10) / fieldWidth) * fieldWidth - (me.formLabelWidth + 3);
            },
menuNo: getQueryStringByName("MenuNo"),
            ver: getQueryStringByName("ver"),
            type: getQueryStringByName("type"),
            Auditing: [],
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            { display: "物资分类", name: "_search_SCAN_TYPE", dbname: "SCAN_TYPE", newline: false, upper: true, type: "text", options: {} },
                            { display: "记录状态", name: "_search_AUDITING", dbname: "AUDITING", newline: false, upper: true, type: "select", options: { type: "select", data: me.Auditing } },
                            { display: "盘点单号", name: "_search_SCAN_CODE", dbname: "SCAN_CODE", newline: false, upper: true, type: "text", options: {} },
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "记录状态", name: "AUDITING", minWidth: 100, type: "select", editor: { type: 'select', data: me.Auditing, selectBoxHeight: 100 } },
                            {
                                display: "盘点单号", name: "SCAN_CODE", minWidth: 100, type: "text",
                                editor: { type: 'text' },
                                render: function (rowdata, rowindex, value, column) {
                                    return "<a href='javascript:;'>" + rowdata.SCAN_CODE + "</a>";
                                },
                            },
                            { display: "盘点日期", name: "SCAN_DATE", minWidth: 100, type: "date", editor: { type: 'date', showTime: true, format: "yyyy-MM-dd hh:mm" } },
                            { display: "盘点人", name: "SCAN_USER", minWidth: 100, type: "text", editor: { type: 'text' } },
                            { display: "盘点部门", name: "DEPT_NAME", minWidth: 100, type: "text", editor: { type: 'text' } },
                            { display: "备注", name: "MEMO", minWidth: 300, type: "text", editor: { type: 'text' } },
                            { display: "SCAN_ID", name: "SCAN_ID", hide: true },
                        ]
                    },
                };
            },
            grid: null,
            searchForm: null,
            buttons: null,
            searchForm2: null,
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'Material/SpCatalogScan/ComboxData',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        me.Auditing = data.Auditing;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    fixedCellHeight: true,
                    autoWidth: true,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    toolbar: {},
                    url: 'Material/SpCatalogScan/List',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: 'SCAN_DATE',
                    sortOrder: 'desc',
                    width: '98%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: false,
                    clickToEdit: false,
                    onDblClickRow: function (rowdata) {
                        me.view(rowdata);
                    }

                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "add":
                            me.add();
                            break;
                        case "modify":
                            me.modify();
                            break;
                        case "delete":
                            me.delete();
                            break;
                        case "submit":
                            if (!me.isSelectRow() || !me.isAllUnaudited()) return;
                            $.ligerDialog.confirm("提交后不可修改和撤销，是否继续？", function (confirm) {
                                if (confirm) {
                                    me.submit();
                                }
                            });
                            break;
                        case "Excel":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=xls", window.gksybConfigs.urlBase), modal: true });
                            break;
                        case "Pdf":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=pdf", window.gksybConfigs.urlBase), modal: true });
                            break;
                    }
                }
                me.grid.toolbarManager.options.group = 'list';
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            isSelectRow: function () {
                var me = this;
                var rows = me.grid.getSelectedRows();
                if (!rows || rows.length === 0) {
                    LG.tip('请选择行!');
                    return false;
                }
                return true;
            },
            isSelectSingleRow: function () {
                var me = this;
                var rows = me.grid.getSelectedRows();
                if (!rows || rows.length === 0) {
                    LG.showError("请选择一行");
                    return false;
                }
                if (rows.length > 1) {
                    LG.showError("不能选择多行");
                    return false;
                }
                return true;
            },
            isAllAudited: function () {
                var me = this;
                var rows = me.grid.getSelectedRows();
                for (var i = 0; i < rows.length; i++) {
                    if (rows[i].AUDITING !== "1") {
                        LG.showError("该数据未提交，无法撤销！");
                        return false;
                    }
                }
                return true;
            },
            isAllUnaudited: function () {
                var me = this;
                var rows = me.grid.getSelectedRows();
                for (var i = 0; i < rows.length; i++) {
                    if (rows[i].AUDITING === "1") {
                        LG.showError("该数据已提交，无法重复提交！");
                        return false;
                    }
                }
                return true;
            },
            openDetail: function (options) {
                var me = this;
                options = options || {};
                $.ligerDialog.open({
                    width: 1100,
                    height: 620,
                    allowClose: true,
                    title: options.title,
                    url: "scancatedet.html?MenuNo=" + me.menuNo + "&type=" + me.type,
                    isHidden: false,
                    showMax: false,
                    showToggle: false,
                    showMin: false,
                    isResize: true,
                    slide: false,
                    onClosed: me.reload.bind(me),
                    data: { sid: options.sid || null, isNew: !!options.isNew, isView: !!options.isView }
                });
            },
            reload: function () { //刷新
                var me = this;
                me.buttons[0].click();
            },
            submit: function () { //提交
                var me = this;
                if (!me.isSelectRow() || !me.isAllUnaudited()) return;
                var selecteds = me.grid.getSelectedRows();
                var sids = [];
                for (var i = 0; i < selecteds.length; i++) {
                    sids.push(selecteds[i].SCAN_ID);
                }
                LG.ajax({
                    jsToken: true,
                    url: 'Material/SpCatalogScan/Submit',
                    loading: '正在提交中...',
                    data: { sids: sids },
                    success: function () {
                        LG.showSuccess('提交成功');
                        me.grid.isDataChanged = false;
                        me.reload();
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Pdf',
                        text: '导出Pdf',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-pdf-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch1 = $("#formsearch1")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch1.ligerForm({
                    labelWidth: me.formLabelWidth,
                    inputWidth: me.formInputWidth,
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch1, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                        liger.get('_search_SCAN_TYPE').setValue(me.type);
                    }
                });
                LG.commonSearch($formsearch1, me.grid);

                me.searchForm.setVisible(["_search_SCAN_TYPE"], false);
            },
            add: function () {
                var me = this;
                me.openDetail({ title: '新增盘点申请', sid: null, isNew: true, isView: false });
            },
            view: function (rowdata) { //查看
                var me = this;
                var selected = rowdata || me.grid.getSelectedRow();
                if (!selected) {
                    LG.tip('请选择行!');
                    return;
                }
                me.openDetail({ title: '查看盘点申请', sid: selected.SCAN_ID, isNew: false, isView: true });
            },
            modify: function (rowdata) { //修改
                var me = this;
                if (!rowdata && !me.isSelectSingleRow()) return;
                var selected = rowdata || me.grid.getSelectedRows()[0];
                if (selected.AUDITING == "1") {
                    LG.tip('已提交，无法修改!');
                    return;
                }
                me.openDetail({ title: '修改盘点申请', sid: selected.SCAN_ID, isNew: false, isView: false });
            },

            save: function () { //保存
                var me = this;
                if (me.grid.endEdit() != false) {
                    if (!me.grid.isDataChanged) {
                        LG.showSuccess('无修改');
                        return;
                    }
                    if (!me.grid.validChangeRows()) return false;
                    var changeRow = me.grid.getChangedRows();
                    LG.ajax({
                        jsToken: true,
                        url: 'Material/SpCatalogScan/Save',
                        loading: '正在保存中...',
                        data: { request: changeRow, requestdet: null },
                        success: function () {
                            LG.showSuccess('保存成功');
                            me.grid.isDataChanged = false;
                            me.reload();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }
            },
            delete: function () { //删除
                var me = this;
                if (me.grid.endEdit() != false) {
                    var selected = me.grid.getSelectedRows();
                    if (selected.length > 0) {
                        for (var i = 0; i < selected.length; i++) {
                            if (selected[i].AUDITING == "1") {
                                LG.tip('已提交，无法删除!');
                                break;
                            }
                            else {
                                $.ligerDialog.confirm('确定删除吗?', function (confirm) {
                                    if (confirm) {
                                        for (var i = 0, len = (selected || []).length; i < len; i++) {
                                            me.grid.deleteRow(selected[i]);
                                        }
                                        me.save();
                                    }
                                }); break;
                            }
                        }
                    } else {
                        LG.tip('请选择行!');
                    }
                }

            },

            init: function () {
                var me = this;
                me.loadComboxData();
                me.setConfig();
                me.setGrid();
                me.setForm();
                return me;
            }
        };
        business.init();
    </script>
</body>
</html>
