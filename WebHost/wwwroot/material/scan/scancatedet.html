<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title>盘点申请明细</title>
    <script src="../../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%; overflow:auto;">
    <form id="mainform" style="width:97%;">
    </form>
    <div style="margin-bottom: 5px; width: 98%;" id="paramform">
    </div>
    <div style="width: 94.5%;" class="l-form">
        <div class="l-form-container">
            <div class="l-group" style="width: 100%;"><span>盘点申请明细</span></div>
            <ul style="display: block; width: 100%;" id="ulGrid">
                <li style=" width: 100%;">
                    <div style="margin-bottom: 50px; width: 100%;" id="detgird">
                    </div>
                </li>
            </ul>
        </div>
    </div>
    <script type="text/javascript">
        'use strict';
        var business = {
            menuNo: getQueryStringByName("MenuNo"),
            dialogData: {},
            sid: getQueryStringByName("sid"),
            type: getQueryStringByName("type"),
            isAddNew: false,
            isView: false,
            orginData: {},
            auditing: [],
            setConfig: function () {
                var me = this;
                me.config = {
                    form: {
                        labelwidth: 220,
                        fields: [
                            //基础信息
                            { display: "记录状态", name: "AUDITING", newline: false, upper: true, type: "select", options: { data: me.auditing, disabled: true }, group: "盘点申请" },
                            { display: "盘点单号", name: "SCAN_CODE", newline: false, upper: true, type: "text", options: { disabled: true } },
                            { display: "盘点日期", name: "SCAN_DATE", validate: { required: true }, newline: false, upper: true, type: "date", editor: { type: 'date', disabled: true, showTime: true, format: "yyyy-MM-dd hh:mm" } },
                           
                            { display: "盘点部门", name: "DEPT_NAME", validate: { required: true }, newline: false, upper: true, type: "text", options: { type: 'text', disabled: true } },
                            { display: "盘点人", name: "SCAN_USER", validate: { required: true }, newline: false, upper: true, type: "text", options: { type: 'text' } },
                            { display: "盘点人ID", name: "SCAN_USERID", newline: false, upper: true, type: "hidden", options: {} },
                            { display: "二级单位", name: "SEC_DEPT", newline: false, upper: true, type: "text", options: { disabled: true } },
                            { display: "备注", name: "MEMO", newline: true, validate: { required: true }, upper: true, width: 775, type: "textarea", options: {} },

                            //隐藏
                            { display: "物资分类", name: "SCAN_TYPE", newline: false, upper: true, type: "hidden", options: {} },
                            { display: "主键", name: "SCAN_ID", newline: false, upper: true, type: "hidden", options: {} },
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "物料编码", name: "SP_CODE", minWidth: 100, type: "text", },
                            { display: "物料名称", name: "SP_NAME", minWidth: 100, type: "text", },
                            { display: "规格型号", name: "SP_SIZE", minWidth: 100, type: "text", },
                            { display: "品牌、厂家", name: "PRODUCE", minWidth: 100, type: "text" },
                            { display: "分类", name: "TYPE_NAME", minWidth: 100, type: "text" },
                            { display: "计量单位", name: "UNIT", minWidth: 100, type: "text", },
                            {
                                display: "盘点数量", name: "SCAN_NUM", validate: { required: true }, minWidth: 100, type: "float",
                                totalSummary: {
                                    render: function (suminf, column) {
                                        return "<span style='color:blue'>" + (suminf.sum) + "</span>";
                                    }
                                },
                                editor: {
                                    type: 'float',
                                }
                            },
                            { display: "主键", name: "SCAN_DET_ID", minWidth: 200, hide: true },
                            { display: "外键", name: "SCAN_ID", minWidth: 100, hide: true },
                            { display: "外键", name: "SP_ID", minWidth: 100, hide: true },
                            { display: "分类ID", name: "TYPE_ID", minWidth: 200, hide: true },
                            { display: "分类CODE", name: "TYPE_CODE", minWidth: 200, hide: true },
                        ]
                    },
                };
            },
            mainform: null,
            buttons: null,
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'Material/SpCatalogScan/ComboxData',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        me.auditing = data.auditing;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            loadData: function () {
                var me = this;
                function inner() {
                    var data = me.mainform.getData();
                    LG.getFormCombChanges(data, me.orginData, true);
                    delete me.orginData;
                    me.orginData = data;
                }
                if (me.isAddNew) {
                    me.mainform.setData({ AUDITING: "0", SCAN_TYPE: me.type });
                    inner();
                }
                else {

                    var where = {
                        rules: [{ field: 'SCAN_ID', value: me.sid, op: 'equal' }],
                        op: "and"
                    };
                    LG.ajax({
                        async: false,
                        url: 'Material/SpCatalogScan/List',
                        loading: '正在获取中...',
                        data: { where: JSON2.stringify(where) },
                        success: function (data, message) {
                            me.mainform.setData(data.Rows[0]);
                            inner();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                    if (me.isView) {
                        me.mainform.setReadonly(true);
                    }
                }
                var input = me.mainform.getEditor(me.config.form.fields[0].name).inputText;
                input.focus();
                input.select();
            },

            save: function () { //保存
                var me = this;
                var formEdit = false, gridEdit = false;
                if ($.isEmptyObject(me.mainform.getChanges())) {
                    formEdit = false;
                }
                else formEdit = true;
                if (!me.mainform.valid()) {
                    me.mainform.showInvalid();
                    return;
                }
                if (me.grid.endEdit() != false) {
                    if (!me.grid.isDataChanged) {
                        gridEdit = false;
                    }
                    else gridEdit = true;
                }
                if (!me.grid.validChangeRows()) return false;
                function handle(data) {
                    return data;
                }

                if (formEdit || gridEdit) {
                    var data = handle(me.mainform.getData());
                    var original = handle(me.mainform.getOrginData());
                    var changeRow = new Object();
                    if (!me.sid) {
                        changeRow["added"] = [data];
                    }
                    else {
                        changeRow["updated"] = [data];
                        changeRow["original"] = [original];
                    }
                    var changeRowDet = me.grid.getChangedRows();
                    var isSave = true
                    for (var i = 0; i < changeRowDet.updated.length; i++) {
                        if (changeRowDet.updated[i].SCAN_NUM < 0) {
                            LG.showSuccess('申请数量不可小于0！')
                            isSave = false;
                        }
                    }
                    if (isSave) {
                        LG.ajax({
                            jsToken: true,
                            url: 'Material/SpCatalogScan/Save',
                            loading: '正在保存中...',
                            data: { request: changeRow, requestdet: changeRowDet },
                            success: function () {
                                LG.showSuccess('保存成功', function () {
                                    if (me.dialog) me.dialog.close();
                                });
                            },
                            error: function (message) {
                                LG.showError(message);
                            }
                        });
                    }
                }
                else { LG.showSuccess('无修改'); }
            },
            close: function () {
                var me = this;
                function inner(callback) {
                    var data = me.mainform.getData();
                    var updateFields = LG.getFormCombChanges(data, me.orginData, true);
                    var isChangedGrid = me.grid.getChangedRows();
                    if (updateFields || isChangedGrid.updated.length > 0 || isChangedGrid.added.length > 0) {
                        $.ligerDialog.confirm($.ligerDefaults.GridString.isContinueByDataChanged, function (confirm) {
                            if (confirm) {
                                if (callback) callback(2);
                            }
                            else {
                                if (callback) callback(0);
                            }
                        });
                        if (callback) return callback(-1);
                        return false;
                    }
                    if (callback) return callback(1);
                    return true;
                }
                inner(function (status) {
                    if (status > 0) {
                        if (me.dialog) me.dialog.close();
                        if (me.callback) me.callback(false);
                    }
                });
            },
            setFormDefaultBtn: function (cancleCallback, savedCallback) {
                var me = this;
                //表单底部按钮
                var buttons = [];
                buttons.push({ text: '关闭', icon: 'fa fa-window-close', onclick: me.close.bind(me) });
                if (!me.isView) buttons.push({ text: '保存', icon: 'fa fa-save', onclick: me.save.bind(me) });

                LG.addFormButtons(buttons);
                me.formButtons = buttons;
            },
            setForm: function () {
                var me = this;
                me.config.form.fields.removeNull();
                var $formsearch = $("#mainform")
                //搜索表单应用ligerui样式
                me.mainform = $formsearch.ligerForm({
                    EnterMoveNextControl: true,
                    labelAlign: 'right',
                    space: 3,
                    validate: true,
                    fields: me.config.form.fields,
                    labelWidth: 120,
                    onAfterSetFields: function (g) {
                        me.mainform = g;
                        me.buttons = g.options.buttons;
                    }
                });
                me.setFormDefaultBtn();
            },
            //领用申请明细
            grid: null,
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#detgird").ligerGrid({
                    dateFormat: "yyyy-MM-dd hh:mm",
                    autoWidth: true,
                    delayLoad: true,
                    usePager: true,
                    columns: me.config.grid.columns,
                    dataAction: 'local',
                    toolbar: {},
                    url: 'Material/SpCatalogScan/DetailList',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: [{ field: 'SCAN_ID', op: 'equal', value: $('#SCAN_ID').val() }]
                        })
                    },
                    //sortName: 'MODIFY_DATE',
                    //sortOrder: 'desc',
                    width: '99%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: true,
                    clickToEdit: true,
                    onBeforeEdit: function (editParm) {
                        switch (editParm.column.name) {
                            case "":
                                if (editParm.record.__status == "add") return true;
                                else return false;
                                break;
                        }
                    },
                    onSuccess: function (data, g) {
                        //me.iframeloading.hide();
                    }
                });
                me.grid.isValid = true;
                if (!me.isView) {
                    me.loadToolbar();
                }
                me.bindGridEvent();
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Word',
                        text: '导出Word',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-word-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reloadDet();
                            break;
                        case "delete":
                            me.deleteDet();
                            break;
                        case "import":
                            me.import();
                            break;
                        case "Excel":
                            $.ligerDialog.open({
                                url: "../../../System/Export.html?exporttype=xls&MenuNo=" + me.menuNo,
                                modal: true
                            });
                            break;
                        case "Word":
                            $.ligerDialog.open({
                                url: "../../../System/Export.html?exporttype=doc&MenuNo=" + me.menuNo,
                                modal: true
                            });
                            break;
                    }
                }
                me.grid.toolbarManager.options.group = 'detail';
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            //新增
            addGrid: function (row = {}) {
                var me = this;
                $.extend(row, {
                    EXE_ID: me.EXE_ID,
                    DONEITEM_ID: me.DONEITEM_ID,
                });
                me.grid.addEditRow(row, true);
            },
            //导入
            import: function () {
                var me = this;
                var gridData = me.grid.getData();
                var gridKeys = [];
                for (var item of gridData) {
                    gridKeys.push(item.SP_CODE);
                }
                var dataOptions = {
                    values: gridKeys,
                    options: {
                        url: 'Material/SpCatalogScan/ImportSpList',
                        parms: {
                            where: JSON.stringify({
                                op: 'and',
                                rules: [{ field: 'TYPE_CODE', op: 'equal', value: $('#SCAN_TYPE').val() }]
                            })
                        },
                        rowKey: "SP_CODE",
                        columns: [
                            { display: "物料编码", name: "SP_CODE", minWidth: 100, type: "text" },
                            { display: "物料名称", name: "SP_NAME", minWidth: 100, type: "text" },
                            { display: "规格型号", name: "SP_SIZE", minWidth: 100, type: "text" },
                            { display: "计量单位", name: "UNIT", minWidth: 100, type: "text" },
                            { display: "物料分类", name: "TYPE_NAME", minWidth: 100, type: "text" },
                            { display: "主键", name: "SP_ID", minWidth: 100, hide: true },
                        ]
                    },
                    fields: [
                        { display: "物料编码", name: "SP_CODE", width: 100, type: "text" },
                        { display: "物料名称", name: "SP_NAME", width: 100, type: "text" },
                    ],
                    callback: function (values, rows) {
                        var currentSet = new Set(gridKeys);
                        for (let item of rows) {
                            if (!currentSet.has(item.SP_CODE)) {
                                me.addGrid({
                                    SP_CODE: item.SP_CODE,
                                    SP_NAME: item.SP_NAME,
                                    SP_SIZE: item.SP_SIZE,
                                    SCAN_NUM: "1",
                                    PRODUCE: item.PRODUCE,
                                    TYPE_NAME: item.TYPE_NAME,
                                    TYPE_CODE: item.TYPE_CODE,
                                    TYPE_ID: item.TYPE_ID,
                                    UNIT: item.UNIT,
                                    SP_ID: item.SP_ID
                                });
                            }
                        }
                    }
                }
                $.ligerDialog.open({
                    width: 1000,
                    height: 400,
                    title: '选择物料',
                    url: window.gksybConfigs.urlBase + "popup-select/common.html",
                    isResize: true,
                    slide: false,
                    data: dataOptions
                });
            },
            //刷新
            reloadDet: function () {
                var me = this;
                me.grid.loadData();
            },
            //删除
            deleteDet: function () { //删除
                var me = this;
                if (me.grid.endEdit() != false) {
                    var selected = me.grid.getSelectedRows();
                    if (selected.length > 0) {
                        $.ligerDialog.confirm('确定删除吗?', function (confirm) {
                            if (confirm) {
                                for (var i = 0, len = (selected || []).length; i < len; i++) {
                                    me.grid.deleteRow(selected[i]);
                                }
                                //me.save();
                            }
                        });
                    } else {
                        LG.tip('请选择行!');
                    }
                }
            },

            f_select_man: function () {
                var me = this;
                var userId = me.mainform.getData().REPAIR_USERID || "";
                $.ligerDialog.open({
                    width: 680,
                    height: 500,
                    title: '人员挑选',
                    url: window.gksybConfigs.urlBase + "popup-select/common.html",
                    isResize: true,
                    slide: false,
                    data: {
                        values: [userId],
                        options: {
                            url: 'popup/users', sortName: 'Name', rowKey: "Id", isSingleCheck: true,
                            columns: [
                                { display: "姓名", name: "Name", type: "text" },
                                { display: "公司岗位", name: "Station", type: "text" }
                            ]
                        },
                        fields: [
                            { display: "姓名", name: "Name", width: 100, type: "text" },
                            { display: "公司岗位", name: "Station", width: 100, type: "text" }
                        ],
                        callback: function (values, rows) {
                            if (rows.length < 1) {
                                me.mainform.setData({
                                    "SCAN_USER": null,
                                    "SCAN_USERID": null,
                                });
                                return;
                            }
                            var row = rows[0];
                            me.mainform.setData({
                                "SCAN_USER": row.Name,
                                "SCAN_USERID": row.Id,
                            });
                        },
                    }
                });

            },
            init: function () {
                var me = this;
                if (frameElement && frameElement.dialog) {
                    me.dialog = frameElement.dialog;
                    me.dialogData = me.dialog.get('data');
                    me.callback = me.dialogData.callback;
                    if (me.dialogData.sid) me.sid = me.dialogData.sid;
                    if (me.dialogData.type) me.type = me.dialogData.type;
                    if (me.dialogData.isNew != undefined) me.isAddNew = me.dialogData.isNew;
                    if (me.dialogData.view != undefined) me.isView = me.dialogData.view;
                }

                //加在基础信息
                me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.loadData();

                //加载重大改造履历
                me.setGrid();
                if (!me.isView) {
                    $('#SCAN_USER').bind('click', function () {
                        me.f_select_man();
                    });
                }
                me.reloadDet();

                if (me.dialogData.view != undefined) {
                    const commonGridOptions = {
                        enabledEdit: false,
                    };
                    me.grid.setOptions(commonGridOptions);
                }
                return me;
            }
        };
        business.init();
    </script>
</body>

</html>
