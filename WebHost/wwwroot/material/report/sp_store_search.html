<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title>物资定期查询</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <div id="mainsearch" style="width: 98%">
        <form action="" id="formsearch" class="l-form">
        </form>
    </div>
    <form action="" id="mainform">
        <div id="maingrid">
        </div>
    </form>
    <script type="text/javascript">
        'use strict';
        var business = {
            rootPath: 'Material/SpStore/',
            MenuNo: getQueryStringByName("MenuNo"),
            stockData: [],
            typeData: [],
            purtypeData: [],
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            { display: "统计日期", name: "_search_BDATE", dbname: "CREATEDATE", newline: false, showTime: false, labelWidth: 90, width: 130, op: 'lessorequal', type: "date" },
                            { display: "仓库", name: "_search_STOCK_CODE", dbname: "STOCK_CODE", newline: false, upper: true, type: "select", options: { data: me.stockData } },
                            { display: "物料分类", name: "_search_TYPE_ID", dbname: "TYPE_ID", newline: false, upper: true, type: "select", options: { data: me.typeData } },
                            { display: "采购分类", name: "_search_PURTYPE_ID", dbname: "PURTYPE_ID", newline: false, upper: true, type: "select", options: { data: me.purtypeData } },
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "创建日期", name: "CREATEDATE", dbname: "CREATEDATE", width: 120, type: "date", format: "yyyy-MM-dd" },
                            { display: "申请单号", name: "APPLY_NO", width: 150, type: "text", },
                            { display: "送货单号", name: "DELIVERY_CODE", dbname: "DELIVERY_CODE", width: 150, type: "text", },

                            { display: "物料编码", name: "SP_CODE", dbname: "SP_CODE", width: 130, type: "text", },
                            { display: "物料名称", name: "SP_NAME", dbname: "SP_NAME", width: 150, type: "text", },
                            { display: "规格型号", name: "SP_SIZE", dbname: "SP_SIZE", width: 150, type: "text", },
                            { display: "计量单位", name: "UNIT", dbname: "UNIT", width: 150, type: "text", },
                            { display: "物料分类", name: "TYPE_NAME", dbname: "TYPE_NAME", width: 150, type: "text", },
                            { display: "品牌、厂家", name: "PRODUCE", dbname: "PRODUCE", width: 150, type: "text", },
                            { display: "采购分类", name: "PURTYPE_NAME", dbname: "PURTYPE_NAME", width: 150, type: "text", },

                            { display: "库位名称", name: "STOCK_NAME", dbname: "STOCK_NAME", width: 150, type: "text", },

                            { display: "库存数量", name: "NUM", dbname: "NUM", width: 150, type: "text", },
                            { display: "库存单价(元)", name: "PRICE", dbname: "PRICE", width: 150, type: "text", },
                            {
                                display: "库存金额(元)", name: "MONEY", dbname: "MONEY", width: 150, type: "text", render: function (rowdata, index, value) {
                                    if (value < 0) {
                                        return Math.abs(value);
                                    } else {
                                        return value;
                                    }
                                }
                            },

                            { display: "不含税单价(元)", name: "NOTAX_PRICE", dbname: "NOTAX_PRICE", width: 150, type: "text", },
                            {
                                display: "不含税金额(元)", name: "NOTAX_MONEY", dbname: "NOTAX_MONEY", width: 150, type: "text", render: function (rowdata, index, value) {
                                    if (value < 0) {
                                        return Math.abs(value);
                                    } else {
                                        return value;
                                    }
                                }
                            },

                            { display: "入库日期", name: "IN_DATE", dbname: "IN_DATE", width: 120, type: "date", format: "yyyy-MM-dd" },
                            { display: "库龄(月)", name: "STORE_MONTH", dbname: "STORE_MONTH", width: 150, type: "text", },
                            { display: "主键", name: "STORE_ID", dbname: "STORE_ID", width: 100, type: "text", hide: true },
                        ]
                    }
                };
            },
            grid: null,
            searchForm: null,
            buttons: null,
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: me.rootPath + 'ReportComboxData',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        me.stockData = data.SpHouseName;
                        me.typeData = data.BaseSpType;
                        me.purtypeData = data.BasePurtype;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    autoWidth: false,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    usePager: false,
                    toolbar: {},
                    url: me.rootPath + 'StoreSearchList',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: 'CREATEDATE',
                    sortOrder: 'DESC',
                    width: '98%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: false,
                    clickToEdit: false,
                });


                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "Excel":
                            $.ligerDialog.open({
                                url: "../System/Export.html?exporttype=xls",
                                modal: true
                            });
                            break;
                        case "Word":
                            $.ligerDialog.open({
                                url: "../System/Export.html?exporttype=doc",
                                modal: true
                            });
                            break;
                    }
                }

                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            reload: function () { //刷新
                var me = this;
                me.buttons[0].click();
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Word',
                        text: '导出Word',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-word-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch = $("#formsearch")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;

                        var nowDate = new Date();
                        me.searchForm.setData({ "_search_BDATE": nowDate });
                    }
                });
            },
            init: function () {
                var me = this;
                me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.setGrid();
                me.reload();
                return me;
            }
        };
        business.init();
    </script>
</body>
</html>
