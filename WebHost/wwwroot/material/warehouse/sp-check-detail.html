<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title>明细</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%; overflow:auto;">
    <form id="mainform" style="width:97%;">
    </form>
    <div style="margin-bottom: 5px; width: 98%;" id="paramform">
    </div>
    <div style="width: 94.5%;" class="l-form">
        <div class="l-form-container">
            <div class="l-group" style="width: 100%;"><span>验收物料明细</span></div>
            <ul style="display: block; width: 100%;" id="ulGrid">
                <li style=" width: 100%;">
                    <div style="margin-bottom: 50px; width: 100%;" id="maingrid">
                    </div>
                </li>
            </ul>
        </div>
    </div>
    <script type="text/javascript">
        'use strict';
        var business = {
            formLabelWidth: 120,
            formInputWidth: 180,
            getTextareaWidth: function () {
                var me = this;
                var fieldWidth = me.formLabelWidth + me.formInputWidth + 3;
                return Math.floor(($("#mainform").width() - 10) / fieldWidth) * fieldWidth - (me.formLabelWidth + 3);
            },
            menuNo: getQueryStringByName("MenuNo"),
            dialogData: {},
            sid: getQueryStringByName("sid"),
            isNew: false,
            isView: false,
            orginData: {},
            auditing: [{ "ID": "1", "TEXT": "已提交" }, { "ID": "0", "TEXT": "未提交" }, { "ID": "6", "TEXT": "退回编辑" }],
            bySource: [],
            pmType: [],
            deviceInfo: [],
            maintDept: [],
            workState: [],
            maintCycle: [],
            start: null,
            setConfig: function () {
                var me = this;
                me.config = {
                    form: {
                        fields: [
                            {
                                display: "记录状态", name: "AUDITING_CHK", newline: false, upper: true, type: "select", options: {
                                    type: "select",
                                    data: me.auditing,
                                    disabled: true
                                }, editor: { disabled: true }, group: "到货验收" },
                            { display: "登记单号", name: "RECEIVE_CODE", newline: false, upper: true, type: "text", options: {}, editor: { disabled: true } },
                            { display: "收货日期", name: "RECEIVE_DATE", newline: false, upper: true, type: "date", options: {}, editor: { disabled: true } },
                            { display: "收货人", name: "USER_NAME", newline: false, upper: true, type: "text", options: {}, editor: { disabled: true } },
                            { display: "供应商", name: "PROVIDER_NAME", newline: false, upper: true, type: "text", options: {}, editor: { disabled: true } },
                            {
                                display: "订单号", name: "ORDER_CODE", newline: false, upper: true, type: "text", options: {}, editor: { disabled: true }
                            },
                            { display: "验收部门", name: "DEPT_NAME", newline: false, upper: true, type: "text", options: {}, editor: { disabled: true } },
                            { display: "采购人", name: "PUR_USER", newline: false, upper: true, type: "text", options: {}, editor: { disabled: true } },
                            { display: "申请人", name: "CHK_USER", newline: false, upper: true, type: "text", options: {}, editor: { disabled: true } },
                            { display: "验收人", name: "EDIT_USER", newline: false, upper: true, type: "text", options: {}, editor: { disabled: true } },
                            { display: "验收日期", name: "CHK_DATE", newline: false, upper: true, type: "text", options: {}, editor: { disabled: true } },
                            { display: "收货备注", name: "REG_MEMO", newline: true, width: me.getTextareaWidth(), upper: true, type: "textarea", options: {}, editor: { disabled: true } },
                            { display: "验收意见", name: "MEMO", newline: true, width: me.getTextareaWidth(), upper: true, type: "textarea", options: {}, validate: { required: true } },
                            { display: "主键", name: "RECEIVE_ID", newline: false, upper: true, type: "hidden", options: {} },
                            {
                                display: "记录状态", name: "AUDITING", newline: false, upper: true, type: "hidden", options: { }, 
                            },
                        ]
                    },
                    grid: {
                        columns: [
                            {
                                display: "物料编码", name: "SP_CODE", width: 150, type: "text",
                                totalSummary: { render: function (column, data) { return "<span style='color:red'>&emsp;合计：</span>" } }
                            },
                            { display: "物料名称", name: "SP_NAME", width: 150, type: "text", },
                            { display: "型号规格", name: "SP_SIZE", width: 150, type: "text", },
                            { display: "品牌、厂家", name: "PRODUCE", width: 150, type: "text", },
                            { display: "计量单位", name: "UNIT", width: 150, type: "text", },
                            {
                                display: "订单数量", name: "DDCOUNT", minWidth: 80, type: "int", totalSummary:
                                {
                                    type: 'sum',
                                    align: 'center'
                                },
                            },
                            {
                                display: "中止数量", name: "STOP_NUM", minWidth: 80, type: "int", totalSummary:
                                {
                                    type: 'sum',
                                    align: 'center'
                                },
                            },/*
                            {
                                display: "待收数量", name: "DSCOUNT", minWidth: 80, type: "int", totalSummary:
                                {
                                    type: 'sum',
                                    align: 'center'
                                },
                            },*/
                            {
                                display: "登记数量", name: "COUNT", width: 150, type: "text", totalSummary:
                                {
                                    type: 'sum',
                                    align: 'center'
                                }
                            },
                            { display: "送货单号", name: "DELIVERY_CODE", width: 100, type: "text", editor: { type: 'text' } },
                            {
                                display: "收货库位", name: "STOCK_NAME", width: 120, type: "text"
                            },
                            {
                                display: "验收数量", name: "CHK_COUNT", width: 150, type: "int", editor: { type: 'int' }, validate: { required: true }, totalSummary:
                                {
                                    type: 'sum',
                                    align: 'center'
                                },
                                render: function (rowdata, index, value) {
                                    if (value) {
                                        rowdata.CHK_MONEY = rowdata.PRICE * value;
                                        return value;
                                    } else {
                                        return value;
                                    }
                                }
                            },
                            { display: "成交单价", name: "PRICE", width: 150, type: "text", },
                            {
                                display: "成交金额", name: "CHK_MONEY", type: "text", width: 80, totalSummary:
                                {
                                    type: 'sum',
                                    align: 'center'
                                } },
                            { display: "税率", name: "TAX_RATE", width: 120, type: "text" },
                            { display: "不含税单价", name: "NOTAX_PRICE", width: 100, type: "text" },
                            { display: "不含税金额", name: "UNTAX_MONEY", width: 100, type: "text" },
                            { display: "退回说明", name: "RETURN_MEMO", width: 250, type: "text", editor: { type: 'text' } },
                            { display: "申请人", name: "APPLY_USER", width: 120, type: "text" },
                            { display: "申请部门", name: "DEPT_NAME", width: 120, type: "text" },
                            { display: "申请单号", name: "APPLY_NO", width: 120, type: "text" },
                            { display: "用途", name: "USE_MEMO", width: 120, type: "text" },
                            { display: "RECDET_ID", name: "RECDET_ID", width: 120, type: "text", hide: true },
                        ]
                    }
                };
            },
            mainform: null,
            buttons: null,
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'Material/SpReceive/OrderList',
                    loading: '正在获取中...',
                    success: function (data) {
                        me.order = data;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            loadData: function () {
                var me = this;
                function inner() {
                    var data = me.mainform.getData();
                    LG.getFormCombChanges(data, me.orginData, true);
                    delete me.orginData;
                    me.orginData = data;
                }
                if (!me.sid) {
                    me.mainform.setData({ AUDITING: "0" });
                    inner();
                }
                else {
                    LG.ajax({
                        async: false,
                        url: 'Material/SpReceive/Get',
                        loading: '正在获取中...',
                        data: { id: me.sid },
                        success: function (data, message) {
                            me.mainform.setData(data[0]);
                            inner();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                    if (me.isView) {
                        me.mainform.setReadonly(true);
                    }
                }
                var input = me.mainform.getEditor(me.config.form.fields[0].name).inputText;
                input.focus();
                input.select();
            },
            //保存
            save: function () { //保存
                var me = this;
                if (!me.mainform.valid()) {
                    me.mainform.showInvalid();
                    return;
                }
                function handle(data) {
                    return data;
                }
                var data = handle(me.mainform.getData());
                var original = handle(me.orginData);

                var changeRow = new Object();
                if (!me.sid) {
                    changeRow["added"] = [data];
                }
                else {
                    changeRow["updated"] = [data];
                    changeRow["original"] = [original];
                }
                var changeRowDet = me.grid.getChangedRows();
                LG.ajax({
                    jsToken: true,
                    url: 'Material/SpReceive/Save',
                    loading: '正在保存中...',
                    data: { request: changeRow, requestdet: changeRowDet },
                    success: function (result) {
                        LG.showSuccess('保存成功', function () {
                            me.isNew = false;
                            if (me.dialog) me.dialog.close();
                        });
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            close: function () {
                var me = this;
                function inner(callback) {
                    var data = me.mainform.getData();
                    var updateFields = LG.getFormCombChanges(data, me.orginData, true);
                    if (updateFields) {
                        $.ligerDialog.confirm($.ligerDefaults.GridString.isContinueByDataChanged, function (confirm) {
                            if (confirm) {
                                if (callback) callback(2);
                            }
                            else {
                                if (callback) callback(0);
                            }
                        });
                        if (callback) return callback(-1);
                        return false;
                    }
                    if (callback) return callback(1);
                    return true;
                }
                inner(function (status) {
                    if (status > 0) {
                        if (me.dialog) me.dialog.close();
                        if (me.callback) me.callback(false);
                    }
                });
            },
            setFormDefaultBtn: function (cancleCallback, savedCallback) {
                var me = this;
                //表单底部按钮
                var buttons = [];
                buttons.push({ text: '关闭', icon: 'fa fa-window-close', onclick: me.close.bind(me) });
                if (!me.isView) buttons.push({ text: '保存', icon: 'fa fa-save', onclick: me.save.bind(me) });

                LG.addFormButtons(buttons);
                me.formButtons = buttons;
            },
            setForm: function () {
                var me = this;
                me.config.form.fields.removeNull();
                var $formsearch = $("#mainform")
                //搜索表单应用ligerui样式
                me.mainform = $formsearch.ligerForm({
                    EnterMoveNextControl: true,
                    labelAlign: 'right',
                    space: 3,
                    validate: true,
                    fields: me.config.form.fields,
                    labelWidth: me.formLabelWidth,
                    inputWidth: me.formInputWidth,
                    onAfterSetFields: function (g) {
                        me.mainform = g;
                        me.buttons = g.options.buttons;
                    }
                });
                me.setFormDefaultBtn();
            },
            grid: null,
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    dateFormat: "yyyy-MM-dd hh:mm",
                    autoWidth: true,
                    delayLoad: true,
                    usePager: true,
                    columns: me.config.grid.columns,
                    dataAction: 'server',
                    toolbar: { group: "det" },
                    url: 'Material/SpReceive/DetList',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: [{ field: 'RECEIVE_ID', op: 'equal', value: $('#RECEIVE_ID').val() }]
                        })
                    },
                    //sortName: 'MODIFY_DATE',
                    //sortOrder: 'desc',
                    width: '99%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: true,
                    clickToEdit: true,
                    onBeforeEdit: function (editParm) {
                        switch (editParm.column.name) {
                            case "":
                                if (editParm.record.__status == "add") return true;
                                else return false;
                                break;
                        }
                    },
                    onSuccess: function (data, g) {
                        //me.iframeloading.hide();
                    }
                });
                me.grid.isValid = true;
                if (!me.isView) {
                    me.loadToolbar();
                }
                me.bindGridEvent();
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Pdf',
                        text: '导出Pdf',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-pdf-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "add":
                            me.add();
                            break;
                        case "delete":
                            me.delete();
                            break;
                        case "save":
                            me.save();
                            break;
                        case "Excel":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=xls", window.gksybConfigs.urlBase), modal: true });
                            break;
                        case "Pdf":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=pdf", window.gksybConfigs.urlBase), modal: true });
                            break;
                    }
                }
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            //刷新
            reloadDet: function () {
                var me = this;
                me.grid.loadData();
            },
            //导入
            add: function () {
                var me = this;
                $.ligerDialog.open({
                    width: 860,
                    height: 450,
                    allowClose: true,
                    title: '导入',
                    url: "sp-receive-det-select.html?MenuNo=" + me.menuNo + "&ver=" + me.ver,
                    isHidden: false,
                    showMax: false,
                    showToggle: false,
                    showMin: false,
                    isResize: true,
                    slide: false,
                    data: { "sid": $("#ORDER_ID").val(), "callback": me.f_callback }
                });
            },
            f_callback: function (id, data) {
                var me = this;
                data.forEach((a) => {
                    business.grid.addEditRow({
                        "SP_CODE": a.SP_CODE,
                        "SP_NAME": a.SP_NAME,
                        "SP_SIZE": a.SP_SIZE,
                        "PRODUCE": a.PRODUCE,
                        "UNIT": a.UNIT,
                        "COUNT": "",
                        "DELIVERY_CODE": "",
                        "MEMO": "",
                        "PRICE": a.PRICE,
                        "MONEY": 0,
                        "APPLY_USER": a.APPLY_USER,
                        "APPLY_NO": a.APPLY_NO
                    });
                });
            },
            //删除
            delete: function () { //删除
                var me = this;
                if (me.grid.endEdit() != false) {
                    var selected = me.grid.getSelectedRows();
                    if (selected.length > 0) {
                        $.ligerDialog.confirm('确定删除吗?', function (confirm) {
                            if (confirm) {
                                for (var i = 0, len = (selected || []).length; i < len; i++) {
                                    me.grid.deleteRow(selected[i]);
                                }
                                me.save();
                            }
                        });
                    } else {
                        LG.tip('请选择行!');
                    }
                }
            },
            init: function () {
                var me = this;
                if (frameElement && frameElement.dialog) {
                    me.dialog = frameElement.dialog;
                    me.dialogData = me.dialog.get('data');
                    me.callback = me.dialogData.callback;
                    if (me.dialogData.sid) me.sid = me.dialogData.sid;
                    if (me.dialogData.isNew != undefined) me.isNew = me.dialogData.isNew;
                    if (me.dialogData.isView != undefined) me.isView = me.dialogData.isView;
                }

                me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.loadData();
                me.setGrid();
                me.reloadDet();

                return me;
            }
        };
        business.init();
    </script>
</body>

</html>
