<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title>组织</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 2px; height: 100%;">
    <div id="layout">
        <div position="center" title="物料列表">
            <div id="mainsearch">
                <form action="" id="formsearch" class="l-form">
                </form>
            </div>
            <form id="mainform">
                <div id="maingrid"></div>
            </form>
        </div>
    </div>
    <script type="text/javascript">
        'use strict';
        var business = {

            formLabelWidth: 120,
            formInputWidth: 180,
            getTextareaWidth: function () {
                var me = this;
                var fieldWidth = me.formLabelWidth + me.formInputWidth + 3;
                return Math.floor(($("#mainform").width() - 10) / fieldWidth) * fieldWidth - (me.formLabelWidth + 3);
            },
rootValue: "ROOT",
            tree: null,
            detailWidth: 920,
            detailHeight: 450,
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            { display: "物料编号", name: "_search_SP_CODE", dbname: "SP_CODE", newline: false, upper: true, type: "text", options: {} },
                            { display: "物料名称", name: "_search_SP_NAME", dbname: "SP_NAME", newline: false, upper: true, type: "text", options: {} }
                        ]
                    },
                    grid: {
                        columns: [
                            {
                                display: "申请单号", name: "APPLY_NO", width: 150, type: "text",
                                totalSummary:
                                {
                                    render: function (suminf, column, cell) {
                                        return '<div>合计</div>';
                                    },
                                    align: 'center'
                                }
                            },
                            { display: "申请人", name: "APPLY_USER", width: 150, type: "text", },
                            { display: "申请部门", name: "DEPT_NAME", width: 150, type: "text", },
                            //{ display: "二级单位", name: "SEC_DEPT", width: 150, type: "text", },
                            { display: "物料编码", name: "SP_CODE", width: 150, type: "text", },
                            { display: "物料名称", name: "SP_NAME", width: 150, type: "text", },
                            { display: "型号规格", name: "SP_SIZE", width: 150, type: "text", },
                            { display: "品牌、厂家", name: "PRODUCE", width: 150, type: "text", },
                            { display: "计量单位", name: "UNIT", width: 150, type: "text", },
                            { display: "物料分类", name: "TYPE_NAME", width: 150, type: "text", },
                            {
                                display: "订单数量", name: "COUNT", width: 150, type: "decimal", totalSummary:
                                {
                                    type: 'sum',
                                    align: 'center'
                                }
                            },
                            { display: "终止数量", name: "STOP_NUM", width: 150, type: "decimal", },
                            { display: "待收数量", name: "DSCOUNT", width: 150, type: "decimal", },
                            {
                                display: "含税单价(元)", name: "PRICE", width: 150, type: "text", totalSummary:
                                {
                                    type: 'sum',
                                    align: 'center'
                                }
                            },
                            {
                                display: "总金额(元)", name: "MONEY", width: 150, type: "text", totalSummary:
                                {
                                    type: 'sum',
                                    align: 'center'
                                }
                            },
                            { display: "要求交货日期", name: "REQ_DATE", type: "date", format: "yyyy-MM-dd", width: 120, editor: { format: "yyyy-MM-dd", type: 'date' }, },
                            { display: "备注", name: "MEMO", minWidth: 120, type: "text", editor: { type: 'text' } },
                            { display: "ORDER_ID", name: "ORDER_ID", dbname: "ORDER_ID", width: 100, type: "text", hide: true },
                            { display: "主键", name: "ORDERDET_ID", dbname: "ORDERDET_ID", width: 100, type: "text", hide: true },
                        ]
                    }
                };
            },
            grid: null,
            searchForm: null,
            setGrid: function () {
                var me = this;
                me.grid = $("#maingrid").ligerGrid({
                    autoWidth: true,
                    usePager: false,
                    columns: me.config.grid.columns,
                    toolbar: {},
                    //data: { "sid": me.sid },
                    url: 'Material/SpReceive/SpList',
                    parms: {
                        //"view": "device_doc",
                        where: JSON.stringify({
                            op: 'and',
                            rules: [{ field: 'ORDER_ID', value: me.sid, op: 'equal' },]
                        })
                    },
                    //sortName: 'CORPPARENTID,CORP_SNAME',
                    //sortOrder: 'asc',
                    width: '100%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: false,
                    clickToEdit: false,
                    isChecked: function (item) {
                        if (me._storageSelect) {
                            var key = item[me.data.options.rowKey];
                            var isSelect = me._storageSelect[key] === true;
                            delete me._storageSelect[key];
                            if (isSelect) return true;
                        }
                        return false;
                    },
                    onBeforeEdit: function (editParm) {
                        switch (editParm.column.name) {
                            case "":
                                if (editParm.record.__status == "add") return true;
                                else return false;
                                break;
                        }
                    },
                    onSuccess: function (data, g) {
                    },
                    rowAttrRender: function (rowdata, rowid) {
                        if (rowdata && rowdata.VALIDFLAG && rowdata.VALIDFLAG !== "1") {
                            return "style='color:red;'";
                        }
                        return "";
                    },
                    onDblClickRow: function (data, rowid, rowdata) {
                        me.modify(rowid);
                    }
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            initSelect: function () {
                var me = this;
                var values = $.isArray(me.data.values) ? me.data.values : (me.data.values || "").split(me.data.split);
                var select = {};
                for (var i = 0, l = values.length; i < l; i++) {
                    var item = values[i];
                    select[item] = true;
                }
                me._storageSelect = select;
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "Excel":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=xls", window.gksybConfigs.urlBase), modal: true });
                            break;
                        case "Pdf":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=pdf", window.gksybConfigs.urlBase), modal: true });
                            break;
                    }
                }
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Pdf',
                        text: '导出Pdf',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-pdf-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch = $("#formsearch");
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    labelWidth: me.formLabelWidth,
                    inputWidth: me.formInputWidth,
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                    }
                });
            },
            close: function () {
                var me = this;
                function inner(callback) {
                    if (callback) return callback(1);
                    return true;
                }
                inner(function (status) {
                    if (status > 0) {
                        if (me.dialog) {
                            me.dialog.close();
                            return;
                        }
                        var win = parent || window;
                        if (win.closeCurrentTab) win.closeCurrentTab();
                        else win.close();
                    }
                });
            },
            save: function () {
                var me = this;
                var rows = me.grid.getSelectedRows() || [];
                var values = [];
                for (var i = 0, l = rows.length; i < l; i++) {
                    var row = rows[i];
                    values.push(row[me.data.options.rowKey]);
                }
                if (me.data.callback) {
                    me.data.callback(values, rows);
                }
                me.close();
            },
            setFormButtons: function () {
                var me = this;
                //表单底部按钮
                var buttons = [];
                buttons.push({ text: '关闭', onclick: me.close.bind(me) });
                buttons.push({ text: '确定', onclick: me.save.bind(me) });
                LG.addFormButtons(buttons);
                me.formButtons = buttons;
            },
            init: function () {
                var me = this;
                if (frameElement && frameElement.dialog) {
                    me.dialog = frameElement.dialog;
                    me.data = frameElement.dialog.get('data') || {};
                    //me.data = {
                    //    values: "123,456,789,",//[123,456,789]
                    //    //split:",",
                    //    options: {
                    //        url: 'popup/users', sortName: 'Name', rowKey: "",
                    //        columns: [
                    //            { display: "表格列", name: "column", type: "text" }
                    //        ]
                    //    },
                    //    fields: [
                    //        { display: "查询条件", name: "name", type: "text" }
                    //    ],
                    //    callback: function (values, rows) {
                    //    }
                    //};
                }
                if (!me.data || !me.data.options) {
                    LG.showError("参数不完整");
                    return;
                }
                me.sid = me.data.sid;
                me.data.split = me.data.split || ",";
                me.initSelect();
                me.setConfig();
                me.setGrid();
                me.setForm();
                me.setFormButtons();
                window.closeQuery = function (callback) {
                    if (!me.dialog) return callback();
                    return me.dialog.frame.business.closeQuery(callback);
                };
                return me;
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>
</html>
