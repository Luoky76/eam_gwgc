
<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title></title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <div id="mainsearch" style="width: 98%">
        <form action="" id="formsearch" class="l-form">
        </form>
    </div>
    <form action="" id="mainform">
        <div id="maingrid">
        </div>
    </form>
    <script type="text/javascript">
        'use strict';
        var business = {

            formLabelWidth: 120,
            formInputWidth: 180,
            getTextareaWidth: function () {
                var me = this;
                var fieldWidth = me.formLabelWidth + me.formInputWidth + 3;
                return Math.floor(($("#mainform").width() - 10) / fieldWidth) * fieldWidth - (me.formLabelWidth + 3);
            },
menuNo: getQueryStringByName("MenuNo"),
            ver: getQueryStringByName("ver"),
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            { display: "记录状态", name: "_search_AUDITING_CHK", dbname: "AUDITING_CHK", newline: false, upper: true, type: "select", options: { type: 'select', data: me.auditingStatus } },
                            { display: "登记单号", name: "_search_RECEIVE_CODE", dbname: "RECEIVE_CODE", newline: false, upper: true, type: "text", options: {} },
                            { display: "供应商", name: "_search_PROVIDER_NAME", dbname: "PROVIDER_NAME", newline: false, upper: true, type: "text", options: {} },
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "记录状态", name: "AUDITING_CHK", minWidth: 100, type: "select", editor: { type: 'select', data: me.auditingStatus, selectBoxHeight: 100 } },
                            { display: "登记单号", name: "RECEIVE_CODE", minWidth: 100, type: "text",  editor: { type: 'text'} },
                            { display: "收货日期", name: "RECEIVE_DATE", minWidth: 100, type: "date",  editor: { type: 'date',showTime: true,format: "yyyy-MM-dd hh:mm"} },
                            { display: "收货人", name: "USER_NAME", minWidth: 100, type: "text",  editor: { type: 'text'} },
                            { display: "供应商", name: "PROVIDER_NAME", minWidth: 100, type: "text",  editor: { type: 'text'} },
                            { display: "订单号", name: "ORDER_CODE", minWidth: 100, type: "text",  editor: { type: 'text'} },
                            { display: "验收部门", name: "DEPT_NAME", minWidth: 100, type: "text",  editor: { type: 'text'} },
                            { display: "采购人", name: "PUR_USER", minWidth: 100, type: "text",  editor: { type: 'text'} },
                            { display: "申请人", name: "CHK_USER", minWidth: 100, type: "text",  editor: { type: 'text'} },
                            { display: "备注", name: "REG_MEMO", minWidth: 100, type: "text",  editor: { type: 'text'} },
                            { display: "主键", name: "RECEIVE_ID", minWidth: 100, type: "text", hide: true },
                        ]
                    }
                };
            },
            auditingStatus: [
                { ID: "0", TEXT: "未提交", VALUE: "0" },
                { ID: "1", TEXT: "已提交", VALUE: "1" },
                { ID: "6", TEXT: "退回编辑", VALUE: "6" },
            ],
            grid: null,
            searchForm: null,
            buttons: null,
            loadComboxData: function () {
                var me = this;
            },
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    autoWidth: true,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    usePager: false,
                    dataAction: 'server',
                    toolbar: { },
                    url: 'Material/SpReceive/List',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: [{ field: 'AUDITING', value: "1", op: 'equal' }]
                        })
                    },
                    sortName: '',
                    sortOrder: '',
                    width: '98%',
                    height: '100%',
                    checkbox: true,
                    onBeforeEdit: function (editParm) {
                        switch (editParm.column.name) {
                            case "":
                                if (editParm.record.__status == "add") return true;
                                else return false;
                                break;
                        }
                    },
                    onSuccess: function (data, g) {
                        if (data && data.Rows) {
                            var rows = data.Rows || [];
                            for (var i = 0, len = rows.length; i < len; i++) {
                                var row = rows[i];
                                row.OLDROLEID = row.ROLEID;
                            }
                        }
                    },
                    rowAttrRender: function (rowdata, rowid) {
                        return "";
                    },
                    onDblClickRow: function (data, rowid, rowdata) {
                        me.view(rowid);
                    }
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "modify":
                            me.modify();
                            break;
                        case "submit":
                            if (!me.isSelectRow() || !me.isAllUnaudited()) return;
                            $.ligerDialog.confirm("提交后不可修改，是否继续？", function (confirm) {
                                if (confirm) {
                                    me.submit();
                                }
                            });
                            break;
                        case "cancelsubmit":
                            if (!me.isSelectRow() || !me.isAllAudited()) return;
                            me.revoke();
                            break;
                        case "Excel":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=xls", window.gksybConfigs.urlBase), modal: true });
                            break;
                        case "Pdf":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=pdf", window.gksybConfigs.urlBase), modal: true });
                            break;
                    }
                }
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            isSelectRow: function () {
                var me = this;
                var rows = me.grid.getSelectedRows();
                if (!rows || rows.length === 0) {
                    LG.tip('请选择行!');
                    return false;
                }
                return true;
            },
            isSelectSingleRow: function () {
                var me = this;
                var rows = me.grid.getSelectedRows();
                if (!rows || rows.length === 0) {
                    LG.showError("请选择一行");
                    return false;
                }
                if (rows.length > 1) {
                    LG.showError("不能选择多行");
                    return false;
                }
                return true;
            },
            isAllAudited: function () {
                var me = this;
                var rows = me.grid.getSelectedRows();
                for (var i = 0; i < rows.length; i++) {
                    if (rows[i].AUDITING_CHK == "0") {
                        LG.showError("该数据未提交，无法撤销！");
                        return false;
                    }
                }
                return true;
            },
            isAllUnaudited: function () {
                var me = this;
                var rows = me.grid.getSelectedRows();
                for (var i = 0; i < rows.length; i++) {
                    if (rows[i].AUDITING_CHK == "1") {
                        LG.showError("该数据已提交，无法重复提交！");
                        return false;
                    }
                }
                return true;
            },
            openDetail: function (options) {
                var me = this;
                options = options || {};
                $.ligerDialog.open({
                    width: 1100,
                    height: 520,
                    allowClose: true,
                    title: options.title,
                    url: "sp-check-detail.html?MenuNo=" + me.menuNo,
                    isHidden: false,
                    showMax: false,
                    showToggle: false,
                    showMin: false,
                    isResize: true,
                    slide: false,
                    onClosed: me.reload.bind(me),
                    data: { sid: options.sid || null, isNew: !!options.isNew, isView: !!options.isView }
                });
            },
            view: function (rowid) { //查看
                var me = this;
                if (!rowid) return;
                me.openDetail({ title: '[查看]', sid: me.grid.getRow(rowid).RECEIVE_ID, isNew: false, isView: true });
            },
            modify: function () { //修改
                var me = this;
                if (!me.isSelectSingleRow()) return;
                var selected = me.grid.getSelectedRows()[0];
                if (selected.AUDITING_CHK == "1") {
                    LG.tip('已提交，无法修改!');
                    return;
                }
                me.openDetail({ title: '[修改]', sid: selected.RECEIVE_ID, isNew: false, isView: false });
            },
            submit: function () { //提交
                var me = this;
                if (!me.isSelectRow() || !me.isAllUnaudited()) return;
                var selecteds = me.grid.getSelectedRows();
                var sids = [];
                for (var i = 0; i < selecteds.length; i++) {
                    sids.push(selecteds[i].RECEIVE_ID);
                }
                LG.ajax({
                    jsToken: true,
                    url: 'Material/SpReceive/SubmitCheck',
                    loading: '正在提交中...',
                    data: { sids: sids },
                    success: function () {
                        LG.showSuccess('提交成功');
                        me.grid.isDataChanged = false;
                        me.reload();
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            revoke: function () { //撤销提交
                var me = this;
                if (!me.isSelectRow() || !me.isAllAudited()) return;
                var selecteds = me.grid.getSelectedRows();
                var sids = [];
                for (var i = 0; i < selecteds.length; i++) {
                    sids.push(selecteds[i].RECEIVE_ID);
                }
                LG.ajax({
                    jsToken: true,
                    url: 'Material/SpReceive/RevokeCheck',
                    loading: '正在撤销中...',
                    data: { sids: sids },
                    success: function () {
                        LG.showSuccess('撤销成功');
                        me.grid.isDataChanged = false;
                        me.reload();
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            reload: function () { //刷新
                var me = this;
                me.buttons[0].click();
            },
            delete: function () { //删除
                var me = this;
                if (me.grid.endEdit() != false) {
                    var selected = me.grid.getSelectedRows();
                    if (selected.length > 0) {
                        $.ligerDialog.confirm('确定删除吗?', function (confirm) {
                            if (confirm) {
                                for (var i = 0, len = selected.length; i < len; i++) {
                                    me.grid.deleteRow(selected[i]);
                                }
                                me.save();
                            }
                        });
                    } else {
                        LG.tip('请选择行!');
                    }
                }
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Pdf',
                        text: '导出Pdf',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-pdf-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch = $("#formsearch")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    labelWidth: me.formLabelWidth,
                    inputWidth: me.formInputWidth,
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                    }
                });
            },
            init: function () {
                var me = this;
                me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.setGrid();
                me.reload();
                return me;
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>
</html>
