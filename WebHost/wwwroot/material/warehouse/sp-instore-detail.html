<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title>明细</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%; overflow:auto;">
    <form id="mainform" style="width:97%;">
    </form>
    <div style="margin-bottom: 5px; width: 98%;" id="paramform">
    </div>
    <div style="width: 94.5%;" class="l-form">
        <div class="l-form-container">
            <div class="l-group" style="width: 100%;"><span>采购入库明细</span></div>
            <ul style="display: block; width: 100%;" id="ulGrid">
                <li style=" width: 100%;">
                    <div style="margin-bottom: 50px; width: 100%;" id="maingrid">
                    </div>
                </li>
            </ul>
        </div>
    </div>
    <script type="text/javascript">
        'use strict';
        var business = {
            formLabelWidth: 120,
            formInputWidth: 180,
            getTextareaWidth: function () {
                var me = this;
                var fieldWidth = me.formLabelWidth + me.formInputWidth + 3;
                return Math.floor(($("#mainform").width() - 10) / fieldWidth) * fieldWidth - (me.formLabelWidth + 3);
            },
            menuNo: getQueryStringByName("MenuNo"),
            dialogData: {},
            sid: getQueryStringByName("sid"),
            isNew: false,
            isView: false,
            auditing: [{ "ID": "1", "TEXT": "已提交" }, { "ID": "0", "TEXT": "未提交" }, { "ID": "7", "TEXT": "已注销" }],
            SpHouseName: [],
            start: null,
            setConfig: function () {
                var me = this;
                me.config = {
                    form: {
                        fields: [
                            {
                                display: "记录状态", name: "AUDITING", type: "select", options: { type: "select", data: me.auditing, disabled: true }
                            },
                            { display: "入库单号", name: "IN_CODE", type: "string", options: { disabled: true } },
                            { display: "入库日期", name: "IN_DATE", type: "date", options: { initValue: new Date() }, validate: { required: true } },
                            { display: "供应商", name: "PROVIDER_NAME", type: "string", options: { disabled: true } },
                            { display: "仓管员", name: "IN_USER", type: "string", options: { disabled: true } },
                            { display: "验收人", name: "CHK_USER", type: "string", options: { disabled: true } },
                            { display: "收货部门", name: "DEPT_NAME", type: "string", options: { disabled: true } },
                            { display: "收货人", name: "CONSIGNEE", type: "string", options: { disabled: true } },
                            { display: "备注", name: "MEMO", type: "string", options: {} },
                            { display: "主键", name: "IN_ID", type: "hidden", options: {} },
                        ]
                    },
                    grid: {
                        columns: [
                            {
                                display: "物料编码", name: "SP_CODE", width: 150, type: "string",
                                totalSummary: { render: function (column, data) { return "<span style='color:red'>&emsp;合计：</span>" } }
                            },
                            { display: "物料名称", name: "SP_NAME", width: 150, type: "string" },
                            { display: "型号规格", name: "SP_SIZE", width: 150, type: "string" },
                            { display: "品牌、厂家", name: "PRODUCE", width: 150, type: "string" },
                            { display: "计量单位", name: "UNIT", width: 150, type: "string" },
                            {
                                display: "入库数量", name: "IN_NUM", width: 150, type: "float", totalSummary:
                                {
                                    type: 'sum',
                                    align: 'center'
                                }
                            },
                            {
                                display: "收货仓库", name: "HOUSE_ID", type: "select", minWidth: 150, editor: {
                                    type: 'select',
                                    data: me.SpHouseName,
                                    onChange: function (rowdata) {
                                        rowdata.grid.updateCell("HOUSE_NAME", rowdata.selected?.TEXT ?? "", rowdata.record);
                                    }
                                }, validate: { required: true }
                            },
                            { display: "收货仓库", name: "HOUSE_NAME", width: 100, type: "string", hide: true },
                            { display: "含税单价", name: "TAX_PRICE", width: 150, type: "float" },
                            {
                                display: "含税金额", name: "TAX_MONEY", type: "float", width: 80, totalSummary:
                                {
                                    type: 'sum',
                                    align: 'center'
                                }
                            },
                            { display: "税率", name: "TAX_RATE", width: 120, type: "float" },
                            { display: "不含税单价", name: "NOTAX_PRICE", width: 100, type: "float" },
                            { display: "不含税金额", name: "NOTAX_MONEY", width: 100, type: "float" },
                            { display: "IN_DET_ID", name: "IN_DET_ID", width: 120, type: "string", hide: true },
                        ]
                    }
                };
            },
            mainform: null,
            buttons: null,
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'Material/SpReceive/OrderList',
                    loading: '正在获取中...',
                    success: function (data) {
                        me.order = data;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
                LG.ajax({
                    async: false,
                    url: 'Material/SpReceive/ComboxData',
                    loading: '正在获取中...',
                    success: function (data) {
                        me.SpHouseName = data.SpHouseName;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            loadData: function () {
                var me = this;
                if (!me.sid) {
                    me.mainform.setData({ AUDITING: "0" });
                    me.mainform.setOrginData(me.mainform.getData());
                }
                else {
                    LG.ajax({
                        async: false,
                        url: 'Material/SpInstore/Get',
                        loading: '正在获取中...',
                        data: { inId: me.sid },
                        success: function (data, message) {
                            me.mainform.setOrginData(data);
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                    if (me.isView) {
                        me.mainform.setReadonly(true);
                    }
                }
                me.mainform.focus();
            },
            closeQuery: function (callback) {
                var me = this;
                if (me._skipConfirm === true || ($.isEmptyObject(me.mainform.getChanges()) && !me.grid.isDataChanged)) {
                    callback();
                    delete me._skipConfirm;
                    return;
                }
                $.ligerDialog.confirm($.ligerDefaults.GridString.isContinueByDataChanged, function (confirm) {
                    if (!confirm) return;
                    callback();
                });
            },
            close: function (skipConfirm) {
                var me = this;
                me._skipConfirm = skipConfirm === true ? true : false;
                me.closeQuery(function () {
                    if (me.dialog) {
                        me.dialog.close();
                        return;
                    }
                    var win = parent || window;
                    if (win.closeCurrentTab) win.closeCurrentTab();
                    else win.close();
                });
            },
            setFormDefaultBtn: function () {
                var me = this;
                var buttons = [];
                if (me.dialog) buttons.push({
                    text: '关闭',
                    onclick: function () {
                        me.close(false);
                    }
                });
                if (!me.isView) buttons.push({
                    text: '保存',
                    icon: 'fa fa-save',
                    onclick: function () {
                        me.saveAll();
                    }
                });

                LG.addFormButtons(buttons);
                me.formButtons = buttons;
            },
            setForm: function () {
                var me = this;
                me.config.form.fields.removeNull();
                var $mainform = $("#mainform");
                me.mainform = $mainform.ligerForm({
                    EnterMoveNextControl: true,
                    labelAlign: 'right',
                    space: 3,
                    validate: true,
                    fields: me.config.form.fields,
                    labelWidth: me.formLabelWidth,
                    inputWidth: me.formInputWidth,
                    readonly: me.isView,
                    onAfterSetFields: function (g) {
                        me.mainform = g;
                        me.buttons = g.options.buttons;
                    }
                });
                me.setFormDefaultBtn();
            },
            grid: null,
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    dateFormat: "yyyy-MM-dd hh:mm",
                    autoWidth: true,
                    delayLoad: true,
                    usePager: true,
                    columns: me.config.grid.columns,
                    dataAction: 'server',
                    toolbar: { group: 'det' },
                    url: 'Material/SpInstore/DetList',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: [{ field: 'IN_ID', op: 'equal', value: me.sid }]
                        })
                    },
                    width: '99%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: !me.isView,
                    clickToEdit: true,
                    onSuccess: function (data, g) {
                    }
                });
                me.grid.isValid = true;
                if (!me.isView) {
                    me.loadToolbar();
                }
                me.bindGridEvent();
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Pdf',
                        text: '导出Pdf',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-pdf-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "save":
                            me.saveAll();
                            break;
                        case "Excel":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=xls", window.gksybConfigs.urlBase), modal: true });
                            break;
                        case "Pdf":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=pdf", window.gksybConfigs.urlBase), modal: true });
                            break;
                    }
                }
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            //同时保存主子表
            saveAll: function () {
                var me = this;
                if (!me.mainform.valid()) {
                    me.mainform.showInvalid();
                    return;
                }
                if (me.grid.endEdit() === false) return;
                if ($.isEmptyObject(me.mainform.getChanges()) && !me.grid.isDataChanged) {
                    LG.showSuccess('无修改');
                    return;
                }
                if (!me.grid.validChangeRows()) return;

                var data = me.mainform.getData();
                var original = me.mainform.getOrginData();

                var changeRow = new Object();
                if (!me.sid) {
                    changeRow["added"] = [data];
                }
                else {
                    changeRow["updated"] = [data];
                    changeRow["original"] = [original];
                }
                var changeRowDet = me.grid.getChangedRows();
                LG.ajax({
                    jsToken: true,
                    url: 'Material/SpInstore/SaveAll',
                    loading: '正在保存中...',
                    data: { request: changeRow, requestdet: changeRowDet },
                    success: function (result) {
                        LG.showSuccess('保存成功', function () {
                            me.isNew = false;
                            if (me.dialog) me.dialog.close();
                        });
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            init: function () {
                var me = this;
                if (frameElement && frameElement.dialog) {
                    me.dialog = frameElement.dialog;
                    me.dialogData = me.dialog.get('data');
                    me.callback = me.dialogData.callback;
                    if (me.dialogData.sid) me.sid = me.dialogData.sid;
                    if (me.dialogData.isNew != undefined) me.isNew = me.dialogData.isNew;
                    if (me.dialogData.isView != undefined) me.isView = me.dialogData.isView;
                }

                me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.loadData();
                me.setGrid();

                return me;
            }
        };
        business.init();
    </script>
</body>

</html>
