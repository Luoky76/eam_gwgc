<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title></title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <div id="mainsearch" style="width: 98%">
        <form action="" id="formsearch" class="l-form">
        </form>
    </div>
    <form action="" id="mainform">
        <div id="maingrid">
        </div>
    </form>
    <script type="text/javascript">
        'use strict';
        var business = {
            formLabelWidth: 120,
            formInputWidth: 180,
            getTextareaWidth: function () {
                var me = this;
                var fieldWidth = me.formLabelWidth + me.formInputWidth + 3;
                return Math.floor(($("#mainform").width() - 10) / fieldWidth) * fieldWidth - (me.formLabelWidth + 3);
            },
            menuNo: getQueryStringByName("MenuNo"),
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            { display: "入库单号", name: "_search_IN_CODE", dbname: "IN_CODE", upper: true, type: "text",options:{} },
                            { display: "订单号", name: "_search_ORDER_CODE", dbname: "ORDER_CODE", upper: true, type: "text",options:{} },
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "记录状态", name: "AUDITING", type: "select", editor: { data: me.Auditing } },
                            { display: "入库单号", name: "IN_CODE", type: "text",  editor: { type: 'text'} },
                            { display: "入库日期", name: "IN_DATE", type: "date",  editor: { type: 'date',showTime: true,format: "yyyy-MM-dd hh:mm"} },
                            { display: "订单号", name: "ORDER_CODE", type: "text",  editor: { type: 'text'} },
                            { display: "供应商", name: "PROVIDER_NAME", type: "text",  editor: { type: 'text'} },
                            { display: "入库金额", name: "INSTORE_MONEY", type: "text",  editor: { type: 'decimal'} },
                            { display: "采购人", name: "PUR_USER", type: "text",  editor: { type: 'text'} },
                            { display: "仓管员", name: "USER_NAME", type: "text",  editor: { type: 'text'} },
                            { display: "验收人", name: "CHK_USER", type: "text", editor: { type: 'text' } },
                            { display: "验收日期", name: "CHK_DATE", type: "date", editor: { type: 'date', showTime: true, format: "yyyy-MM-dd hh:mm" } },
                            { display: "公司名称", name: "DEPT_NAME", type: "text",  editor: { type: 'text'} },
                            { display: "备注", name: "MEMO", type: "text",  editor: { type: 'text'} },
                            { display: "主键", name: "IN_ID", type: "text", hide: true },
                        ]
                    }
                };
            },
            grid: null,
            searchForm: null,
            buttons: null,
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'Material/SpInstore/Comboxdata',
                    loading: '正在获取中...',
                    success: function (data) {
                        me.Auditing = data.Auditing;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    autoWidth: true,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    usePager: false,
                    dataAction: 'server',
                    toolbar: { group:'list'},
                    url: 'Material/SpInstore/List',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: '',
                    sortOrder: '',
                    width: '98%',
                    height: '100%',
                    checkbox: true,
                    onBeforeEdit: function (editParm) {
                        switch (editParm.column.name) {
                            case "":
                                if (editParm.record.__status == "add") return true;
                                else return false;
                                break;
                        }
                    },
                    onSuccess: function (data, g) {
                        if (data && data.Rows) {
                            var rows = data.Rows || [];
                            for (var i = 0, len = rows.length; i < len; i++) {
                                var row = rows[i];
                                row.OLDROLEID = row.ROLEID;
                            }
                        }
                    },
                    rowAttrRender: function (rowdata, rowid) {
                        return "";
                    },
                    onDblClickRow: function (data, rowid, rowdata) {
                        me.view(rowid);
                    }
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "modify":
                            me.modify();
                            break;
                        case "back":
                            if (!me.isSelectRow() || !me.isAllUnaudited()) return;
                            me.back();
                            break;
                        case "sumbit":
                            if (!me.isSelectRow() || !me.isAllUnaudited()) return;
                            $.ligerDialog.confirm("提交后不可修改，是否继续？", function (confirm) {
                                if (confirm) {
                                    me.submit();
                                }
                            });
                            break;
                        case "Excel":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=xls", window.gksybConfigs.urlBase), modal: true });
                            break;
                        case "Pdf":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=pdf", window.gksybConfigs.urlBase), modal: true });
                            break;
                    }
                }
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            isSelectRow: function () {
                var me = this;
                var rows = me.grid.getSelectedRows();
                if (!rows || rows.length === 0) {
                    LG.tip('请选择行!');
                    return false;
                }
                return true;
            },
            isSelectSingleRow: function () {
                var me = this;
                var rows = me.grid.getSelectedRows();
                if (!rows || rows.length === 0) {
                    LG.showError("请选择一行");
                    return false;
                }
                if (rows.length > 1) {
                    LG.showError("不能选择多行");
                    return false;
                }
                return true;
            },
            isAllAudited: function () {
                var me = this;
                var rows = me.grid.getSelectedRows();
                for (var i = 0; i < rows.length; i++) {
                    if (rows[i].AUDITING !== "1") {
                        LG.showError("该数据未提交，无法撤销！");
                        return false;
                    }
                }
                return true;
            },
            isAllUnaudited: function () {
                var me = this;
                var rows = me.grid.getSelectedRows();
                for (var i = 0; i < rows.length; i++) {
                    if (rows[i].AUDITING === "1" || rows[i].AUDITING === "7") {
                        LG.showError("该数据已提交，无法重复提交！");
                        return false;
                    }
                }
                return true;
            },
            openDetail: function (options) {
                var me = this;
                options = options || {};
                $.ligerDialog.open({
                    width: 1100,
                    height: 520,
                    allowClose: true,
                    title: options.title,
                    url: "sp-instore-detail.html?MenuNo=" + me.menuNo,
                    isHidden: false,
                    showMax: false,
                    showToggle: false,
                    showMin: false,
                    isResize: true,
                    slide: false,
                    onClosed: me.reload.bind(me),
                    data: { sid: options.sid || null, isNew: !!options.isNew, isView: !!options.isView }
                });
            },
            view: function (rowid) { //查看
                var me = this;
                if (!rowid) return;
                me.openDetail({ title: '[查看]', sid: me.grid.getRow(rowid).IN_ID, isNew: false, isView: true });
            },
            modify: function () { //修改
                var me = this;
                if (!me.isSelectSingleRow()) return;
                var selected = me.grid.getSelectedRows()[0];
                if (selected.AUDITING == "1") {
                    LG.tip('已提交，无法修改!');
                    return;
                }
                if (selected.AUDITING == "7") {
                    LG.tip('已注销，无法修改!');
                    return;
                }
                me.openDetail({ title: '[修改]', sid: selected.IN_ID, isNew: false, isView: false });
            },
            submit: function () { //提交
                var me = this;
                if (!me.isSelectRow()) return;
                var selecteds = me.grid.getSelectedRows();
                var sids = [];
                for (var i = 0; i < selecteds.length; i++) {
                    if (selecteds[i].AUDITING == "1") {
                        LG.showError("该数据已提交，无法重复提交！");
                        return;
                    }
                    if (!selecteds[i].IN_DATE) {
                        LG.showError("入库日期未填写！");
                        return;
                    }
                    if (selecteds[i].AUDITING == "7") {
                        LG.showError("该数据已注销，无法提交！");
                        return;
                    }
                    sids.push(selecteds[i].IN_ID);
                }
                LG.ajax({
                    jsToken: true,
                    url: 'Material/SpInstore/Submit',
                    loading: '正在提交中...',
                    data: { sids: sids },
                    success: function () {
                        LG.showSuccess('提交成功');
                        me.grid.isDataChanged = false;
                        me.reload();
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            back: function () { //退回验收
                var me = this;
                if (!me.isSelectRow()) return;
                var selecteds = me.grid.getSelectedRows();
                var sids = [];
                for (var i = 0; i < selecteds.length; i++) {
                    if (selecteds[i].AUDITING == "1") {
                        LG.showError("该数据已提交，无法退回验收！");
                        return;
                    }
                    if (selecteds[i].AUDITING == "7") {
                        LG.showError("该数据已注销，无法退回验收！");
                        return;
                    }
                    sids.push(selecteds[i].IN_ID);
                }
                LG.ajax({
                    jsToken: true,
                    url: 'Material/SpInstore/Back',
                    loading: '正在提交中...',
                    data: { sids: sids },
                    success: function () {
                        LG.showSuccess('提交成功');
                        me.grid.isDataChanged = false;
                        me.reload();
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            reload: function () { //刷新
                var me = this;
                me.buttons[0].click();
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Pdf',
                        text: '导出Pdf',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-pdf-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch = $("#formsearch")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    labelWidth: me.formLabelWidth,
                    inputWidth: me.formInputWidth,
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                    }
                });
            },
            init: function () {
                var me = this;
                //me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.setGrid();
                me.reload();
                return me;
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>
</html>
