<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title>冲红明细</title>
    <script src="../../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%; overflow:auto;">
    <form id="mainform" style="width:97%;">
    </form>
    <div style="margin-bottom: 5px; width: 98%;" id="paramform">
    </div>
    <div style="width: 94.5%;" class="l-form">
        <div class="l-form-container">
            <div class="l-group" style="width: 100%;"><span>冲红明细</span></div>
            <ul style="display: block; width: 100%;" id="ulGrid">
                <li style="width: 100%;">
                    <div style="margin-bottom: 50px; width: 100%;" id="detgird">
                    </div>
                </li>
            </ul>
        </div>
    </div>
    <script type="text/javascript">
        'use strict';
        var business = {
            formLabelWidth: 120,
            formInputWidth: 180,
            getTextareaWidth: function () {
                var me = this;
                var fieldWidth = me.formLabelWidth + me.formInputWidth + 3;
                return Math.floor(($("#mainform").width() - 10) / fieldWidth) * fieldWidth - (me.formLabelWidth + 3);
            },
            menuNo: getQueryStringByName("MenuNo"),
            dialogData: {},
            sid: getQueryStringByName("sid"),
            isNew: false,
            isView: false,
            Auditing: [],
            setConfig: function () {
                var me = this;
                me.config = {
                    form: {
                        labelwidth: me.formLabelWidth,
                        inputWidth: me.formInputWidth,
                        fields: [
                            { display: "记录状态", name: "AUDITING", newline: false, type: "select", options: { type: "select", data: me.Auditing, disabled: true }, group: "出库冲红" },
                            { display: "冲红日期", name: "BACK_DATE", newline: false, type: "date", options: {} },
                            { display: "冲红单号", name: "BACK_CODE", newline: false, type: "string", options: { disabled: true } },
                            { display: "出库单号", name: "OUT_CODE", newline: false, type: "string", options: { disabled: true } },
                            { display: "出库日期", name: "OUT_DATE", newline: false, type: "date", options: { disabled: true } },
                            { display: "申请部门", name: "DEPT_NAME", newline: false, type: "string", options: { disabled: true } },
                            { display: "领用人", name: "USER_NAME", newline: false, type: "string", options: { disabled: true } },
                            { display: "冲红金额", name: "SUM_MONEY", newline: false, type: "float", options: { disabled: true } },
                            { display: "备注", name: "MEMO", newline: true, width: me.getTextareaWidth(), type: "textarea", options: {} },
                            { display: "外键", name: "OUT_ID", newline: false, type: "hidden", options: { disabled: true } },
                            { display: "主键", name: "OUT_BACK_ID", newline: false, type: "hidden", options: { disabled: true } },
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "物料编码", name: "SP_CODE", minWidth: 100, type: "string" },
                            { display: "物料名称", name: "SP_NAME", minWidth: 100, type: "string" },
                            { display: "规格型号", name: "SP_SIZE", minWidth: 100, type: "string" },
                            { display: "品牌、厂家", name: "PRODUCE", minWidth: 100, type: "string" },
                            { display: "计量单位", name: "UNIT", minWidth: 100, type: "string" },
                            {
                                display: "出库数量", name: "COUNT", minWidth: 100, type: "float",
                                totalSummary: {
                                    render: function (suminf, column) {
                                        return "<span style='color:blue'>" + (suminf.sum) + "</span>";
                                    }
                                },
                            },
                            { display: "参考单价(元)", name: "PRICE", minWidth: 100, type: "float" },
                            {
                                display: "金额(元)", name: "APPLY_MONEY", minWidth: 100, type: "float",
                                totalSummary: {
                                    render: function (suminf, column) {
                                        return "<span style='color:blue'>" + (suminf.sum) + "</span>";
                                    }
                                }
                            },
                            { display: "库位名称", name: "HOUSE_NAME", minWidth: 100, type: "string" },
                            { display: "批次号", name: "STORE_CODE", minWidth: 100, type: "string" },
                            { display: "分类名称", name: "TYPE_NAME", minWidth: 100, type: "string" },
                            { display: "入库日期", name: "IN_DATE", minWidth: 100, type: "date" },
                            { display: "备注", name: "MEMO", minWidth: 200, type: "string" },
                            { display: "主键", name: "OUTDET_ID", minWidth: 100, hide: true },
                            { display: "外键", name: "OUT_ID", minWidth: 100, hide: true },
                        ]
                    },
                };
            },
            mainform: null,
            buttons: null,
            auditing: "0",
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'Material/SpOut/ComboxData',
                    loading: '正在获取中...',
                    success: function (data) {
                        me.Auditing = data.Auditing;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            loadData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'Material/SpOut/OutBackDetail',
                    loading: '正在获取中...',
                    data: { id: me.sid },
                    success: function (data) {
                        me.mainform.setOrginData(data);
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
                me.mainform.focus();
            },
            save: function () {
                var me = this;
                if ($.isEmptyObject(me.mainform.getChanges())) {
                    LG.showSuccess('无修改');
                    return;
                }
                if (!me.mainform.valid()) {
                    me.mainform.showInvalid();
                    return;
                }
                var data = me.mainform.getData();
                var original = me.mainform.getOrginData();
                var changeRow = new Object();
                changeRow["updated"] = [data];
                changeRow["original"] = [original];
                LG.ajax({
                    jsToken: true,
                    url: 'Material/SpOut/SaveOutBack',
                    loading: '正在保存中...',
                    data: changeRow,
                    success: function () {
                        LG.showSuccess('保存成功');
                        me.grid.isDataChanged = false;
                        me.loadData();
                        me.reloadDet();
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            close: function () {
                var me = this;
                function inner(callback) {
                    var data = me.mainform.getData();
                    var updateFields = LG.getFormCombChanges(data, me.mainform.getOrginData(), true);
                    if (updateFields) {
                        $.ligerDialog.confirm($.ligerDefaults.GridString.isContinueByDataChanged, function (confirm) {
                            if (confirm) callback(1);
                            else callback(0);
                        });
                        return;
                    }
                    callback(1);
                }
                inner(function (status) {
                    if (status > 0) {
                        if (me.dialog) me.dialog.close();
                    }
                });
            },
            setFormDefaultBtn: function () {
                var me = this;
                var buttons = [];
                buttons.push({ text: '关闭', icon: 'fa fa-window-close', onclick: me.close.bind(me) });
                if (me.auditing == "0") {
                    buttons.push({ text: '保存', onclick: me.save.bind(me) });
                }
                else {
                    me.mainform.setReadonly(true);
                }
                LG.addFormButtons(buttons);
                me.formButtons = buttons;
            },
            setForm: function () {
                var me = this;
                me.config.form.fields.removeNull();
                var $formsearch = $("#mainform");
                me.mainform = $formsearch.ligerForm({
                    labelWidth: me.formLabelWidth,
                    inputWidth: me.formInputWidth,
                    EnterMoveNextControl: true,
                    labelAlign: 'right',
                    space: 3,
                    validate: true,
                    fields: me.config.form.fields,
                    onAfterSetFields: function (g) {
                        me.mainform = g;
                        me.buttons = g.options.buttons;
                    }
                });
                me.setFormDefaultBtn();
            },
            grid: null,
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#detgird").ligerGrid({
                    dateFormat: "yyyy-MM-dd hh:mm",
                    autoWidth: true,
                    delayLoad: true,
                    usePager: true,
                    columns: me.config.grid.columns,
                    dataAction: 'server',
                    toolbar: {},
                    url: 'Material/SpOut/GetOutBackDetList',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: [{ field: 'OUT_ID', op: 'equal', value: me.sid }]
                        })
                    },
                    width: '99%',
                    height: '100%',
                    checkbox: false,
                    enabledEdit: false,
                    clickToEdit: false,
                    onSuccess: function (data, g) { }
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) { me.toolbarBtnItemClick(item); },
                        icon: "fa fa-file-excel-o"
                    }, { line: true }, {
                        id: 'Pdf',
                        text: '导出Pdf',
                        click: function (item) { me.toolbarBtnItemClick(item); },
                        icon: "fa fa-file-pdf-o"
                    }]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({ top: e.pageY, left: e.pageX });
                    return false;
                });
                LG.validate($("#mainform"), { debug: true });
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reloadDet();
                            break;
                        case "Excel":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=xls", window.gksybConfigs.urlBase), modal: true, data: { gridid: "detgird" } });
                            break;
                        case "Pdf":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=pdf", window.gksybConfigs.urlBase), modal: true, data: { gridid: "detgird" } });
                            break;
                    }
                }
                me.grid.toolbarManager.options.group = 'detail';
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            reloadDet: function () {
                var me = this;
                me.grid.loadData();
            },
            init: function () {
                var me = this;
                if (frameElement && frameElement.dialog) {
                    me.dialog = frameElement.dialog;
                    me.dialogData = me.dialog.get('data');
                    me.callback = me.dialogData.callback;
                    if (me.dialogData.sid) me.sid = me.dialogData.sid;
                    if (me.dialogData.auditing) me.auditing = me.dialogData.auditing;
                }

                me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.loadData();
                me.setGrid();
                me.reloadDet();
                return me;
            }
        };
        business.init();
    </script>
</body>

</html>
