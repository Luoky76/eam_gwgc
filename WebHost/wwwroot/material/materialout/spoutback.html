
<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title>物料出库冲红</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <div id="mainsearch" style="width: 98%">
        <form action="" id="formsearch" class="l-form">
        </form>
    </div>
    <form action="" id="mainform">
        <div id="maingrid">
        </div>
    </form>
    <script type="text/javascript">
        'use strict';
        var business = {
            auditing: [{ "ID": "0", "TEXT": "未提交" }, { "ID": "1", "TEXT": "已提交" }],
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            { display: "冲红单号", name: "_search_BACK_CODE", dbname: "BACK_CODE", newline: false, upper: true, type: "text", options: {} },
                            {
                                display: "出库日期", name: "_search_OUT_DATE", dbname: "OUT_DATE", newline: false, type: "date", op: 'greaterorequal', vt: 'date',
                                options: {
                                    format: "yyyy-MM-dd"
                                }
                            },
                            {
                                display: "至", name: "_search_OUT_DATE", dbname: "OUT_DATE", newline: false, type: "date", op: 'lessorequal', vt: 'date',
                                options: {
                                    format: "yyyy-MM-dd"
                                }
                            },

                        ]
                    },
                    grid: {
                        columns: [
                            { display: "记录状态", name: "AUDITING", minWidth: 100, type: "select", editor: { type: 'select', data: me.auditing, selectBoxHeight: 100 } },
                            { display: "冲红日期", name: "BACK_DATE", minWidth: 100, type: "date", },
                            { display: "冲红单号", name: "BACK_CODE", minWidth: 100, type: "text", },
                            { display: "出库单号", name: "OUT_CODE", minWidth: 100, type: "text", },
                            { display: "出库日期", name: "OUT_DATE", minWidth: 100, type: "date", },
                            //{ display: "编制人", name: "EDIT_USER", minWidth: 100, type: "text", },
                            { display: "申请部门", name: "DEPT_NAME", minWidth: 100, type: "text", },
                            { display: "领用人", name: "USER_NAME", minWidth: 100, type: "text", },
                            { display: "冲红金额", name: "SUM_MONEY", minWidth: 100, type: "float", },
                            { display: "备注", name: "MEMO", minWidth: 450, type: "text", },
                            { display: "主键", name: "OUT_BACK_ID", hide: true },
                        ]
                    }
                };
            },
            grid: null,
            searchForm: null,
            buttons: null,
            /*loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'Material/SpOut/comboxdata',
                    loading: '正在获取中...',
                    success: function (data) {
                        me.dataCorp = data.corpData;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },*/
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    autoWidth: true,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    usePager: false,
                    dataAction: 'server',
                    toolbar: {},
                    url: 'Material/SpOut/GetSpOutBackList',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    //sortName: 'AUDITING',
                    //sortOrder: 'asc',
                    width: '98%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: true,
                    clickToEdit: true,
                    onBeforeEdit: function (editParm) {
                        switch (editParm.column.name) {
                            case "":
                                if (editParm.record.__status == "add") return true;
                                else return false;
                                break;
                        }
                    },
                    onSuccess: function (data, g) {
                        if (data && data.Rows) {
                            var rows = data.Rows || [];
                            for (var i = 0, len = rows.length; i < len; i++) {
                                var row = rows[i];
                                row.OLDROLEID = row.ROLEID;
                            }
                        }
                    },
                    rowAttrRender: function (rowdata, rowid) {
                        return "";
                    }
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "add":
                            me.add();
                            break;
                        case "modify":
                            me.modify();
                            break;
                        case "delete":
                            me.delete();
                            break;
                        case "submit":
                            me.submit();
                            break;
                        case "Excel":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=xls", window.gksybConfigs.urlBase), modal: true });
                            break;
                        case "Pdf":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=pdf", window.gksybConfigs.urlBase), modal: true });
                            break;
                    }
                }
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            revoke: function () {    //反提交
                var me = this;
                var selected = me.grid.getSelectedRows();
                if (selected.length !== 1) {
                    LG.tip('请选择且仅选择一行！');
                }
                else {
                    if (selected[0].AUDITING == "0") {
                        LG.tip('未提交！');
                    }
                    else {
                        var sid = [];
                        selected.forEach((a) => {
                            sid.push(a.OUT_BACK_ID)
                        })
                        LG.ajax({
                            jsToken: true,
                            url: 'Device/InventoryTask/UnSubmitSpOutBack',
                            loading: '正在提交中...',
                            data: { "sid": sid[0] },
                            success: function () {
                                LG.showSuccess('撤回提交成功');
                                me.grid.isDataChanged = false;
                                me.reload();
                            },
                            error: function (message) {
                                LG.showError(message);
                            }
                        });
                    }
                }
            },
            submit: function () {    //提交
                var me = this;
                var selected = me.grid.getSelectedRows();
                if (selected.length !== 1) {
                    LG.tip('请选择且仅选择一行！');
                }
                else {
                    if (selected[0].AUDITING != "0") {
                        LG.tip('无法提交！');
                    } else {
                        var sid = selected[0].OUT_BACK_ID;
                        LG.ajax({
                            jsToken: true,
                            url: 'Material/SpOut/SubmitSpOutBack',
                            loading: '正在保存中...',
                            data: { "sid": sid },
                            success: function () {
                                LG.showSuccess('保存成功');
                                me.grid.isDataChanged = false;
                                me.reload();
                            },
                            error: function (message) {
                                LG.showError(message);
                            }
                        });
                    }
                }
            },

            save: function () { //保存
                var me = this;
                if (me.grid.endEdit() != false) {
                    if (!me.grid.isDataChanged) {
                        LG.showSuccess('无修改');
                        return;
                    }
                    if (!me.grid.validChangeRows()) return false;
                    var changeRow = me.grid.getChangedRows();
                    LG.ajax({
                        jsToken: true,
                        url: 'Material/SpOut/SaveSpBack',
                        loading: '正在保存中...',
                        data: changeRow,
                        success: function () {
                            LG.showSuccess('保存成功');
                            me.grid.isDataChanged = false;
                            me.reload();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }
            },
            delete: function () { //删除
                var me = this;
                if (me.grid.endEdit() != false) {
                    var selected = me.grid.getSelectedRows();
                    if (selected.length > 0) {
                        for (var i = 0; i < selected.length; i++) {
                            if (selected[i].AUDITING == "1") {
                                LG.tip('已提交，无法删除!');
                                break;
                            }
                            else {
                                $.ligerDialog.confirm('确定删除吗?', function (confirm) {
                                    if (confirm) {
                                        for (var i = 0, len = (selected || []).length; i < len; i++) {
                                            me.grid.deleteRow(selected[i]);
                                        }
                                        me.save();
                                    }
                                }); break;
                            }
                        }
                    } else {
                        LG.tip('请选择行!');
                    }
                }

            },
            //导入
            add: function () {
                var me = this;
                var gridData = me.grid.getData();
                var gridKeys = [];
                for (var item of gridData) {
                    gridKeys.push(item.OUT_CODE);
                }
                var dataOptions = {
                    values: gridKeys,
                    options: {
                        url: 'Material/SpOut/ImportList',
                        rowKey: "OUT_CODE",
                        columns: [
                            { display: "记录状态", name: "AUDITING_A", dbname: "AUDITING_A", width: 100, type: "select", format: { data: me.auditing } },
                            {
                                display: "出库单号", name: "OUT_CODE", minWidth: 100, type: "text",
                                render: function (rowdata, rowindex, value, column) {
                                    return "<a href='javascript:;'>" + rowdata.OUT_CODE + "</a>";
                                },
                            },
                            {
                                display: "申请单号", name: "APPLY_CODE", minWidth: 100, type: "text",
                            },
                            { display: "出库日期", name: "OUT_DATE", minWidth: 100, type: "date", },
                            { display: "申请部门", name: "DEPT_NAME", minWidth: 100, type: "text", },
                            { display: "二级单位", name: "SEC_DEPT", minWidth: 100, type: "text", },
                            { display: "申请人", name: "USER_NAME", minWidth: 100, type: "text", },
                            { display: "仓管员", name: "M_USER", minWidth: 100, type: "text", },
                            { display: "项目编号", name: "PROJECT_CODE", minWidth: 100, type: "text", },
                            { display: "项目名称", name: "PROJECT_NAME", minWidth: 100, type: "text", },
                            { display: "备注", name: "MEMO", minWidth: 300, type: "text", },
                            { display: "OUT_ID", name: "OUT_ID", hide: true },
                        ]
                    },
                    fields: [
                        { display: "申请单号", name: "APPLY_CODE", width: 100, type: "text" },
                        { display: "出库单号", name: "OUT_CODE", width: 100, type: "text" },
                    ],
                    callback: function (values, rows) {
                        var currentSet = new Set(gridKeys);
                        var newrows = [];
                        for (let item of rows) {
                            if (!currentSet.has(item.OUT_CODE)) {
                                newrows.push(item);
                            }
                        }
                        var changeRow = [];
                        changeRow = newrows;
                        LG.ajax({
                            jsToken: true,
                            url: 'Material/SpOut/ManageSpOutBack',
                            loading: '正在保存中...',
                            data: { request: changeRow },
                            success: function () {
                                LG.showSuccess('保存成功', function () {
                                    me.reload();
                                    me.dialog.close();
                                });
                            },
                            error: function (message) {
                                LG.showError(message);
                            }
                        });
                    }
                }
                $.ligerDialog.open({
                    width: 1000,
                    height: 400,
                    title: '选择出库单',
                    url: window.gksybConfigs.urlBase + "popup-select/common.html",
                    isResize: true,
                    slide: false,
                    data: dataOptions
                });
            },
            modify: function () { //修改
                var me = this;
                var selected = me.grid.getSelectedRow();
                if (!selected) {
                    LG.tip('请选择行!');
                    return;
                }
                var sid = selected.OUT_BACK_ID;
                var auditing = selected.AUDITING;
                $.ligerDialog.open({
                    width: 1100,
                    height: 620,
                    allowClose: true,
                    title: '[修改]',
                    url: "spoutbackdet.html",
                    isHidden: false,
                    showMax: false,
                    showToggle: false,
                    showMin: false,
                    isResize: true,
                    slide: false,
                    onClosed: me.reload.bind(me),
                    data: { "sid": sid, "auditing": auditing }
                });
            },
            reload: function () { //刷新
                var me = this;
                me.buttons[0].click();
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Pdf',
                        text: '导出Pdf',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-pdf-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch = $("#formsearch")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                    }
                });
            },
            init: function () {
                var me = this;
                //me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.setGrid();
                me.reload();
                return me;
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>
</html>
