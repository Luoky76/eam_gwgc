<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title></title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <div id="mainsearch" style="width: 98%">
        <form action="" id="formsearch" class="l-form">
        </form>
    </div>
    <form action="" id="mainform">
        <div id="maingrid">
        </div>
    </form>
    <script type="text/javascript">
        'use strict';
        var business = {
            rootPath: 'Material/SpScan/',
            MenuNo: getQueryStringByName("MenuNo"),
            scanType: [],
            StoreSrc: [],
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            {
                                display: "通用搜索",
                                name: "_search_all",
                                hideLabel: true,
                                filter: [
                                    { op: "like", field: "SCAN_CODE", type: "string" },
                                    { op: "like", field: "SCAN_TYPE", type: "string" },
                                    { op: "like", field: "SCAN_RESULT", type: "string" },
                                    { op: "like", field: "SP_CODE", type: "string" },
                                    { op: "like", field: "SP_NAME", type: "string" },
                                    { op: "like", field: "SP_SIZE", type: "string" },
                                    { op: "like", field: "UNIT", type: "string" },
                                    { op: "like", field: "TYPE_NAME", type: "string" },
                                    { op: "like", field: "PRODUCE", type: "string" },
                                    { op: "like", field: "STOCK_NAME", type: "string" },
                                    { op: "like", field: "STORE_CODE", type: "string" },
                                    { op: "like", field: "SCAN_USER", type: "string" },
                                    { op: "like", field: "DEPT_NAME", type: "string" }
                                ],
                                options: {
                                    //回车自动搜索
                                    onEnter: function () {
                                        var me = this;
                                        var $formsearch = $("#formsearch");
                                        LG.commonSearch($formsearch, me.grid);
                                    }.bind(me)
                                },
                            },
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "盘点单号", name: "SCAN_CODE", type: "text" },
                            { display: "盘点类型", name: "SCAN_TYPE", type: "select", format: { data: me.scanType } },
                            { display: "来源类型", name: "SRC_TYPE", type: "select", format: { data: me.StoreSrc } },
                            { display: "库存数量", name: "STORE_NUM", type: "text" },
                            { display: "盘点数量", name: "SCAN_NUM", type: "text", validate: { required: true }, editor: { type: 'text' } },
                            { display: "盘点结果", name: "SCAN_RESULT", type: "text" },
                            { display: "物料编码", name: "SP_CODE", type: "text" },
                            { display: "物料名称", name: "SP_NAME", type: "text" },
                            { display: "规格型号", name: "SP_SIZE", type: "text" },
                            { display: "计量单位", name: "UNIT", type: "text" },
                            { display: "分类", name: "TYPE_NAME", type: "text" },
                            { display: "品牌、厂家", name: "PRODUCE", type: "text" },
                          
                            { display: "库位名称", name: "STOCK_NAME", type: "text" },
                            { display: "批次号", name: "STORE_CODE", type: "text" },
                           
                            { display: "盘点人", name: "SCAN_USER", type: "text" },
                            { display: "盘点部门", name: "DEPT_NAME", type: "text" },
                            { display: "盘点日期", name: "SCAN_DATE", type: "date", format: "yyyy-MM-dd", },
                            //隐藏字段
                            { display: "主键", name: "SCAN_DET_ID", type: "text", hide: true },
                            { display: "盘点任务id", name: "SCAN_ID", type: "text", hide: true },
                            { display: "二级单位", name: "SEC_DEPT", type: "text", hide: true }
                        ]
                    }
                };
            },
            grid: null,
            searchForm: null,
            buttons: null,
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: me.rootPath + 'ComboxData',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        me.scanType = data.ScanType;
                        me.StoreSrc = data.StoreSrc;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    autoWidth: false,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    usePager: false,
                    toolbar: {},
                    url: me.rootPath + 'DetailAnsList',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: 'SCAN_DATE',
                    sortOrder: 'DESC',
                    width: '98%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: true,
                    clickToEdit: true,
                });


                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "save":
                            me.save();
                            break;
                        case "submit":
                            me.submit();
                            break;
                        case "Excel":
                            $.ligerDialog.open({
                                url: "../System/Export.html?exporttype=xls",
                                modal: true
                            });
                            break;
                        case "Word":
                            $.ligerDialog.open({
                                url: "../System/Export.html?exporttype=doc",
                                modal: true
                            });
                            break;
                    }
                }

                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            reload: function () { //刷新
                var me = this;
                me.buttons[0].click();
            },
            save: function () { //保存
                var me = this;
                if (me.grid.endEdit() != false) {
                    if (!me.grid.isDataChanged) {
                        LG.showSuccess('无修改');
                        return;
                    }
                    if (!me.grid.validChangeRows()) return false;
                    var changeRow = me.grid.getChangedRows();
                    LG.ajax({
                        jsToken: true,
                        url: me.rootPath + 'DetailSave',
                        loading: '正在保存中...',
                        data: changeRow,
                        success: function (message, data) {
                            me.grid.isDataChanged = false;
                            me.reload();
                            LG.showSuccess('保存成功');
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }

            },
            submit: function () {    //提交
                var me = this;
                
                var selected = me.grid.getSelectedRows();
                if (selected.length > 0) {
                    //先保存
                    if (me.grid.endEdit() != false) {
                        if (me.grid.isDataChanged) {
                            if (!me.grid.validChangeRows()) return false;
                            var changeRow = me.grid.getChangedRows();
                            LG.ajax({
                                jsToken: true,
                                async: false,
                                url: me.rootPath + 'DetSave',
                                loading: '正在保存中...',
                                data: changeRow,
                                success: function (message, data) {
                                    me.grid.isDataChanged = false;
                                    me.reload();
                                    LG.showSuccess('保存成功');
                                },
                                error: function (message) {
                                    LG.showError(message);
                                }
                            });
                        }
                    }
                    //再提交
                    var flag = true;
                    var sids = [];
                    selected.forEach((a) => {
                        if (a.AUDITING != "0") {
                            LG.tip(a.SP_NAME + '已提交，无法再次提交!');
                            flag = false;
                            return;
                        }
                        sids.push(a.SCAN_DET_ID)
                    })
                    if (!flag) {
                        return;
                    }

                    LG.ajax({
                        jsToken: true,
                        url: me.rootPath + 'DetSubmit',
                        loading: '正在保存中...',
                        data: { "sids": sids },
                        success: function () {
                            LG.showSuccess('提交成功');
                            me.grid.isDataChanged = false;
                            me.reload();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });

                }
                else {
                    LG.tip('请选择行!');
                }
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Word',
                        text: '导出Word',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-word-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch = $("#formsearch")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                        me.searchForm.setData({ "_search_AUDITING": "0" });
                    }
                });
            },
            init: function () {
                var me = this;
                me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.setGrid();
                me.reload();
                return me;
            }
        };
        business.init();
    </script>
</body>
</html>
