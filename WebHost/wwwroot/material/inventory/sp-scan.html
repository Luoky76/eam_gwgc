<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="renderer" content="webkit" />
    <title>物资盘点</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <div id="mainsearch">
        <form action="" id="formsearch" class="l-form">
        </form>
    </div>
    <form action="" id="mainform">
        <div id="maingrid">
        </div>
    </form>
    <script type="text/javascript">
        'use strict';
        var business = {

            formLabelWidth: 120,
            formInputWidth: 180,
            getTextareaWidth: function () {
                var me = this;
                var fieldWidth = me.formLabelWidth + me.formInputWidth + 3;
                return Math.floor(($("#mainform").width() - 10) / fieldWidth) * fieldWidth - (me.formLabelWidth + 3);
            },
detailWidth: window.innerWidth * 0.9,
            detailHeight: window.innerHeight * 0.9,
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            {
                                display: "通用搜索",
                                name: "_search_all",
                                hideLabel: true,
                                filter: [
                                    { op: "like", field: "SCAN_CODE", type: "string" },
                                    { op: "like", field: "STOCK_NAME", type: "string" },
                                    { op: "like", field: "TYPE_NAME", type: "string" },
                                    { op: "like", field: "SCAN_USER", type: "string" },
                                    { op: "like", field: "DEPT_NAME", type: "string" },
                                    { op: "like", field: "MEMO", type: "string" }
                                ],
                                options: {
                                    //回车自动搜索
                                    onEnter: function () {
                                        var me = this;
                                        var $formsearch = $("#formsearch");
                                        LG.commonSearch($formsearch, me.grid);
                                    }.bind(me)
                                },
                            },
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "记录状态", name: "AUDITING", type: "select", editor: { data: me.Auditing } },
                            { display: "盘点单号", name: "SCAN_CODE", type: "string" },
                            { display: "盘点状态", name: "SCAN_STATUS", type: "select", editor: { data: me.ScanStatus } },
                            { display: "盘点类型", name: "SCAN_TYPE", type: "select", editor: { data: me.ScanType } },
                            { display: "盘点库位", name: "STOCK_NAME", type: "string" },
                            { display: "物资分类", name: "TYPE_NAME", type: "string" },
                            { display: "盘点日期", name: "SCAN_DATE", type: "date" },
                            { display: "盘点人", name: "SCAN_USER", type: "string" },
                            { display: "盘点部门", name: "DEPT_NAME", type: "string" },
                            { display: "备注", name: "MEMO", type: "string" },
                            //隐藏
                            { display: "主键", name: "SCAN_ID", type: "string", hide: true }
                        ]
                    }
                };
            },
            menuNo: getQueryStringByName("MenuNo"),
            grid: null,
            searchForm: null,
            buttons: null,
            //下拉数据
            Auditing: [],
            ScanStatus: [],
            ScanType: [],
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'Material/SpScan/ComboxData',
                    loading: '正在获取中...',
                    success: function (data) {
                        me.Auditing = data.Auditing;
                        me.ScanStatus = data.ScanStatus;
                        me.ScanType = data.ScanType;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    dateFormat: 'yyyy-MM-dd HH:mm',
                    autoWidth: true,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    usePager: true,
                    dataAction: 'server',
                    toolbar: {},
                    url: 'Material/SpScan/List',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: 'AUDITING, SCAN_CODE',
                    sortOrder: 'desc',
                    width: '100%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: true,
                    clickToEdit: true,
                    onBeforeEdit: function (editParm) {
                        switch (editParm.column.name) {
                            case "":
                                if (editParm.record.__status == "add") return true;
                                else return false;
                                break;
                        }
                    },
                    onSuccess: function (data, g) {
                    },
                    rowAttrRender: function (rowdata, rowid) {
                        return "";
                    },
                    onDblClickRow: function (rowdata, rowid, row) {
                        me.openDetail({ sid: rowdata.SCAN_ID, isNew: false, isView: true });
                    }
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            isSelectRow: function () {
                var me = this;
                var rows = me.grid.getSelectedRows();
                if (rows.length == 0) {
                    LG.tip("请选择一行");
                    return false;
                }
                return true;
            },
            isSelectSingleRow: function () {
                var me = this;
                var rows = me.grid.getSelectedRows();
                if (rows.length > 1) {
                    LG.tip("不能选择多行");
                    return false;
                } else if (rows.length == 0) {
                    LG.tip("请选择一行");
                    return false;
                }
                return true;
            },
            isAllAudited: function ({ msg = "未提交数据，无需撤销！" } = {}) {
                var me = this;
                var selecteds = me.grid.getSelectedRows();
                for (let row of selecteds) {
                    if (!["1", "2", "3"].includes(row.AUDITING)) {
                        if (msg) {
                            LG.tip(msg);
                        }
                        return false;
                    }
                }
                return true;
            },
            isAllUnaudited: function ({ msg = "有数据已提交，无法变更！" } = {}) {
                var me = this;
                var selecteds = me.grid.getSelectedRows();
                for (let row of selecteds) {
                    if (["1", "2", "3"].includes(row.AUDITING)) {
                        if (msg) {
                            LG.tip(msg);
                        }
                        return false;
                    }
                }
                return true;
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "add":
                            me.openDetail({ isNew: true, isView: false });
                            break;
                        case "modify":
                            if (me.isSelectSingleRow() && me.isAllUnaudited()) {
                                me.openDetail({ isNew: false, isView: false });
                            }
                            break;
                        case "delete":
                            if (me.isSelectRow() && me.isAllUnaudited()) {
                                me.delete();
                            }
                            break;
                        case "save":
                            me.save();
                            break;
                        case "submit":
                            if (me.isSelectSingleRow() && me.isAllUnaudited()) {
                                me.submit();
                            }
                            break;
                        case "revoke":
                            if (me.isSelectSingleRow() && me.isAllAudited()) {
                                me.revoke();
                            }
                            break;
                        case "Excel":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=xls", window.gksybConfigs.urlBase), modal: true });
                            break;
                        case "Pdf":
                            $.ligerDialog.open({ url: window.gksybConfigs.getUrl("System/Export.html?exporttype=pdf", window.gksybConfigs.urlBase), modal: true });
                            break;
                    }
                };
                me.grid.toolbarManager.options.group = 'main';
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            openDetail: function ({ sid, isNew = false, isView = true } = {}) { //打开明细
                var me = this;
                if (!isNew && !sid) {
                    sid = me.grid.getSelectedRow().SCAN_ID;
                }
                $.ligerDialog.open({
                    width: me.detailWidth,
                    height: me.detailHeight,
                    allowClose: true,
                    title: (isNew ? '[新增]' : isView ? '[查看]' : '[修改]') + document.title,
                    url: "sp-scan-detail.html?MenuNo=" + me.menuNo,
                    isHidden: false,
                    showMax: false,
                    showToggle: false,
                    showMin: false,
                    isResize: true,
                    slide: false,
                    onClosed: me.reload.bind(me),
                    data: { sid: sid, isNew: isNew, isView: isView }
                });
            },
            save: function () { //保存
                var me = this;
                if (me.grid.endEdit() === false) return;
                if (!me.grid.isDataChanged) {
                    LG.showSuccess('无修改');
                    return;
                }
                if (!me.grid.validChangeRows()) return false;
                var changeRow = me.grid.getChangedRows();
                LG.ajax({
                    jsToken: true,
                    url: 'Material/SpScan/Save',
                    loading: '正在保存中...',
                    data: changeRow,
                    success: function () {
                        LG.showSuccess('保存成功');
                        me.grid.isDataChanged = false;
                        me.reload();
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            reload: function () { //刷新
                var me = this;
                me.buttons[0].click();
            },
            delete: function () { //删除
                var me = this;
                var rows = me.grid.getSelectedRows();
                if (!rows) return;
                $.ligerDialog.confirm('确定删除吗?', function (confirm) {
                    if (!confirm) return;
                    me.grid.deleteRange(rows);
                    me.save();
                });
            },
            submit: function () { //提交
                var me = this;
                if (me.grid.endEdit() === false) return;
                if (!me.grid.validChangeRows()) return false;
                var row = me.grid.getSelectedRow();
                LG.ajax({
                    jsToken: true,
                    url: 'Material/SpScan/Submit',
                    loading: '正在提交中...',
                    data: { scanId: row.SCAN_ID },
                    success: function () {
                        LG.showSuccess('提交成功');
                        me.reload();
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            revoke: function () { //撤销提交
                var me = this;
                if (me.grid.endEdit() === false) return;
                if (!me.grid.validChangeRows()) return false;
                var row = me.grid.getSelectedRow();
                LG.ajax({
                    jsToken: true,
                    url: 'Material/SpScan/Revoke',
                    loading: '正在提交中...',
                    data: { scanId: row.SCAN_ID },
                    success: function () {
                        LG.showSuccess('撤销成功');
                        me.reload();
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Pdf',
                        text: '导出Pdf',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-pdf-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch = $("#formsearch");
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    labelWidth: me.formLabelWidth,
                    inputWidth: me.formInputWidth,
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                    }
                });
            },
            init: function () {
                var me = this;
                me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.setGrid();
                me.reload();
                window.closeQuery = function (callback) {
                    if (!me.dialog) return callback();
                    return me.dialog.frame.business.closeQuery(callback);
                };
                return me;
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>

</html>
