<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title>仓库货位</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 2px; height: 100%;">
    <div id="layout">
        <div position="left" title="仓库货位目录" id="mainmenu">
            <ul id="maintree" style="margin-top:5px;"></ul>
        </div>
        <div position="center" title="仓库货位列表">
            <div id="mainsearch">
                <form action="" id="formsearch" class="l-form">
                </form>
            </div>
            <div id="iframeloading" class='l-loading'>
            </div>
            <form id="mainform">
                <div id="maingrid" style="margin: 2px;"></div>
            </form>
        </div>
    </div>
    <script type="text/javascript">
        'use strict';
        var business = {
            menuNo: getQueryStringByName("MenuNo"),
            MenuNo: 'BaseSptype',
            ver: getQueryStringByName("ver"),
            iframeloading: $("#iframeloading"),
            tree: null,
            currentNode: null,
            deptData: [],
            HouseProperty: [],
            HouseType: [],
            SpHouseName: [],
            dataCheck: [{ "ID": "0", "TEXT": "未提交" }, { "ID": "1", "TEXT": "已提交" }],
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            {
                                display: "仓库货位编码", name: "_search_HOUSE_CODE", dbname: "HOUSE_CODE", newline: false, type: "text",
                            },
                            {
                                display: "仓库货位名称", name: "_search_HOUSE_NAME", dbname: "HOUSE_NAME", newline: false, width: 200, type: "text", 
                            },
                            { display: "记录状态", name: "_search_AUDITING", dbname: "AUDITING", newline: false, upper: true, type: "select", options: { data: me.dataCheck } },
                            { display: "上一节点id", name: "_search_PARENT_HOUSE_CODE", dbname: "PARENT_HOUSE_CODE", op: "equal", type: "hidden", options: {} }
                        ]
                    },
                    grid: {
                        columns: [
                            {
                                display: "记录状态", name: "AUDITING", labelWidth: 100, width: 100, newline: true, type: "select", format: { data: me.dataCheck }
                            },
                            { display: "仓库货位编码", name: "HOUSE_CODE", dbname: "HOUSE_CODE", minWidth: 200, type: "text",  editor: { type: 'text' }, validate: { required: true } },
                            { display: "仓库货位名称", name: "HOUSE_NAME", dbname: "HOUSE_NAME", minWidth: 200, type: "text",  editor: { type: 'text' }, validate: { required: true } },
                            { display: "类型", name: "HOUSE_TYPE", dbname: "HOUSE_TYPE", minWidth: 100, type: "select", editor: { type: 'select', data: me.HouseType }, validate: { required: true } },
                            { display: "仓库属性", name: "HOUSE_PROPERTY", dbname: "HOUSE_PROPERTY", minWidth: 150, type: "select", editor: { type: 'select', data: me.HouseProperty }, validate: { required: true } },
                            {
                                display: "所属单位", name: "DEPT_ID", minWidth: 150, type: "select", validate: { required: true },
                                editor: {
                                    type: 'select',
                                    data: me.deptData,
                                    onChange: function (rowdata, rowIndex) {
                                        if (rowdata.value) {
                                            for (var i = 0; i < me.deptData.length; i++) {
                                                if (rowdata.value == me.deptData[i].ID) {
                                                    liger.get("maingrid").updateCell("DEPT_NAME", me.deptData[i].TEXT, rowdata.record);
                                                    break;
                                                }
                                            }
                                        } else {
                                            liger.get("maingrid").updateCell("DEPT_NAME", "", rowdata.record);
                                        }
                                    },
                                }
                            },
                            { display: "部门", name: "DEPT_NAME", width: 100, type: "text", hide: true },
                            {
                                display: "上级节点", name: "PARENT_HOUSE_CODE", dbname: "PARENT_HOUSE_CODE", minWidth: 200, type: "select", editor: { type: 'select', data: me.SpHouseName },
                            },
                            {
                                display: "财务属性", name: "IS_ACCOUNT", dbname: "IS_ACCOUNT", minWidth: 50, type: "text", align: "center", formatType: "chk", editor: { type: 'chkStr' }
                            },
                            {
                                display: "是否失效", name: "IS_NOVALID", dbname: "IS_NOVALID", minWidth: 50, type: "text", align: "center", formatType: "chk", editor: { type: 'chkStr' }
                            },
                            { display: "失效日期", name: "NOVALID_DATE", dbname: "NOVALID_DATE", minWidth: 150, type: "date", editor: { type: 'date', showTime: true, format: "yyyy-MM-dd hh:mm" } },
                            { display: "备注", name: "MEMO", dbname: "MEMO", minWidth: 300, type: "text",  editor: { type: 'text' } },
                            { display: "主键", name: "HOUSE_ID", dbname: "HOUSE_ID", width: 100, type: "text",  hide: true },

                        ]
                    }
                };
            },
            grid: null,
            loadComboxData: function () {
                var me = this;
                var dataControl = [];
                LG.ajax({
                    async: false,
                    url: 'Material/BaseSpHouse/ComboxData',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        me.HouseProperty = data.BCCode
                        me.HouseType = data.HouseType;
                        me.deptData = data.DeptData;
                        me.SpHouseName = data.SpHouseName;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
                return dataControl;
            },
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    dateFormat: "yyyy-MM-dd hh:mm",
                    autoWidth: true,
                    delayLoad: true,
                    usePager: false,
                    columns: me.config.grid.columns,
                    //dataAction: 'server',
                    toolbar: {},
                    url: 'Material/BaseSpHouse/list',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: 'HOUSE_CODE',
                    sortOrder: 'asc',
                    width: '99%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: true,
                    clickToEdit: true,
                    onBeforeEdit: function (editParm) {
                        if (editParm.record.__status == "nochanged") {
                            if (editParm.record.AUDITING == "1") return false;
                            else return true;
                        }
                        switch (editParm.column.name) {
                            case "":
                                if (editParm.record.__status == "add") return true;
                                else return false;
                                break;
                        }
                    },
                    onSuccess: function (data, g) {
                        me.iframeloading.hide();
                    },
                    rowAttrRender: function (rowdata, rowid) {
                        if (rowdata && rowdata.IS_NOVALID && rowdata.IS_NOVALID == "1") {
                            return "style='color:red;'";
                        }
                        return "";
                    }
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "add":
                            me.add();
                            break;
                        case "delete":
                            me.delete();
                            break;
                        case "save":
                            me.save();
                            break;
                        case "submit":
                            me.submit();
                            break;
                        case "Excel":
                            $.ligerDialog.open({
                                url: "../../../System/Export.html?exporttype=xls&MenuNo=" + me.menuNo,
                                modal: true
                            });
                            break;
                        case "Word":
                            $.ligerDialog.open({
                                url: "../../../System/Export.html?exporttype=doc&MenuNo=" + me.menuNo,
                                modal: true
                            });
                            break;
                    }
                }
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            add: function () { //新增
                var me = this;
                var nodeId = me.currentNode == null || me.currentNode == undefined ? "ROOT" : me.currentNode.data.HOUSE_CODE;
                me.grid.addEditRow({ "PARENT_HOUSE_CODE": (nodeId == "ROOT" ? "" : nodeId), "AUDITING": "0" });
            },
            save: function () { //保存
                var me = this;
                if (me.grid.endEdit() != false) {
                    if (!me.grid.isDataChanged) {
                        LG.showSuccess('无修改');
                        return;
                    }
                    if (!me.grid.validChangeRows()) return false;
                    var changeRow = me.grid.getChangedRows();
                    LG.ajax({
                        jsToken: true,
                        url: 'Material/BaseSpHouse/Save',
                        loading: '正在保存中...',
                        data: changeRow,
                        success: function () {
                            LG.showSuccess('保存成功');
                            me.grid.isDataChanged = false;
                            location.reload();
                            me.reloadTree();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }
            },
            submit: function () {    //提交
                var me = this;
                var selected = me.grid.getSelectedRows();
                if (selected.length > 0) {
                    if (selected[0].AUDITING == null) {
                        LG.tip('请先保存!');
                    }
                    else if (selected[0].AUDITING != "0") {
                        LG.tip('已提交，无法再次提交!');
                    }
                    else {
                        var sids = [];
                        selected.forEach((a) => {
                            sids.push(a.HOUSE_ID)
                        })
                        LG.ajax({
                            jsToken: true,
                            url: 'Material/BaseSpHouse/Submit',
                            loading: '正在保存中...',
                            data: { "sids": sids },
                            success: function () {
                                LG.showSuccess('保存成功');
                                me.grid.isDataChanged = false;
                                me.reload();
                            },
                            error: function (message) {
                                LG.showError(message);
                            }
                        });
                    }

                }
                else {
                    LG.tip('请选择行!');
                }
            },
            reloadTree: function () {
                var me = this;
                me.selectNode = me.tree.getSelected();
                me.tree.reload();
            },
            reload: function () { //刷新
                var me = this;
                me.grid.loadData();
            },
            delete: function () { //删除
                var me = this;
                if (me.grid.endEdit() != false) {
                    var selected = me.grid.getSelectedRows();
                    if (selected.length > 0) {
                        if (selected[0].AUDITING == "1") {
                            LG.tip('已提交，无法删除!');
                        }
                        else {
                            $.ligerDialog.confirm('确定删除吗?', function (confirm) {
                                if (confirm) {
                                    for (var i = 0, len = (selected || []).length; i < len; i++) {
                                        me.grid.deleteRow(selected[i]);
                                    }
                                    me.save();
                                }
                            });
                        }
                    } else {
                        LG.tip('请选择行!');
                    }
                }
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Word',
                        text: '导出Word',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-word-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            setTree: function () {
                var me = this;
                var rootValue = "ROOT";
                me.tree = $("#maintree").ligerTree({
                    url: "Material/BaseSpHouse/Tree",
                    parms: {},
                    nodeWidth: 160,
                    slide: false,
                    checkbox: false,
                    single: true,
                    needCancel: false,
                    idFieldName: 'HOUSE_CODE',
                    textFieldName: 'HOUSE_NAME',
                    parentIDFieldName: 'PARENTID',
                    iconClsFieldName: "ICON",
                    isExpand: 2,
                    onSuccess: function (data) {
                        $(".l-tree .l-body span").each(function () {
                            var $this = $(this);
                            var text = $this.text();
                            $this.html('<acronym title="' + text + '"><span> ' + text + '</span></acronym>');
                        });
                        if (me.selectNode && me.selectNode.data) this.selectNode(me.selectNode.data.TYPE_ID);
                        else me.tree.selectNode(rootValue);
                    },
                    onSelect: function (node) {
                        me.iframeloading.show();
                        var nodeData = node.data;
                        me.currentNode = node;
                        var where = {};
                        if (nodeData) {
                            var parentNo = nodeData.HOUSE_CODE;
                            $("#_search_PARENT_HOUSE_CODE").val((parentNo == "ROOT" ? "" : parentNo));
                            where = {
                                rules: [],
                                groups: [{
                                    rules: [], op: "or"
                                }], op: "and"
                            };
                            if (parentNo === rootValue) {
                                parentNo = "";
                            } else {
                                where.groups[0].rules.push({ field: 'PARENT_HOUSE_CODE', value: parentNo, op: 'startwith' });
                            }

                            me.grid.set('parms', { "where": JSON2.stringify(where) });
                            me.currentMenuParentNo = parentNo;
                            me.reload();
                        }
                    }
                });
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch = $("#formsearch")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                    }
                });
            },
            init: function () {
                var me = this;
                $("#layout").ligerLayout({ leftWidth: 240 });
                me.iframeloading.show();
                me.loadComboxData();
                me.setConfig();
                me.setGrid();
                me.setTree();
                me.setForm();
                return me;
            }
        };
        business.init();
    </script>
</body>
</html>
