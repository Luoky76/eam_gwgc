<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title></title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <div id="mainsearch" style="width: 98%">
        <form action="" id="formsearch" class="l-form">
        </form>
    </div>
    <form action="" id="mainform">
        <div id="maingrid">
        </div>
    </form>
    <script type="text/javascript">
        'use strict';
        var business = {
            rootPath:'Material/SpareApply/',
            MenuNo: getQueryStringByName("MenuNo"),
            dataCheck: [{ "ID": "0", "TEXT": "未提交" }, { "ID": "1", "TEXT": "已提交" }],
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            { display: "记录状态", name: "_search_AUDITING", dbname: "AUDITING", newline: false, upper: true, type: "select", options: { data: me.dataCheck } },
                            { display: "禁用单号", name: "_search_DISABLE_CODE", dbname: "DISABLE_CODE", newline: false, upper: true, type: "text", options: {} },
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "记录状态", name: "AUDITING", labelWidth: 100, width: 100, newline: true, type: "select", format: { data: me.dataCheck } },
                            { display: "禁用单号", name: "DISABLE_CODE", width: 180, type: "text" },
                            { display: "申请人", name: "EDIT_USER", width: 100, type: "text", },
                            { display: "申请部门", name: "DEPT_NAME", width: 150, type: "text", },
                            { display: "二级单位", name: "SEC_DEPT", width: 150, type: "text", },
                            { display: "禁用日期", name: "DISABLE_DATE", width: 150, type: "date", format: "yyyy-MM-dd hh:mm", editor: { type: 'date', showTime: true, format: "yyyy-MM-dd hh:mm" }, validate: { required: true }, },
                            { display: "禁用原因", name: "MEMO", width: 120, type: "text", editor: { type: 'text' }, validate: { required: true }, },
                            { display: "主键", name: "DISABLE_ID", dbname: "DISABLE_ID", width: 100, type: "text", hide: true },
                        ]
                    }
                };
            },
            grid: null,
            searchForm: null,
            buttons: null,
            loadComboxData: function () {
                var me = this;
            },
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    autoWidth: false,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    usePager: false,
                    toolbar: { group: 'list'},
                    url: me.rootPath + 'SpDisableList',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: 'DISABLE_DATE',
                    sortOrder: 'DESC',
                    width: '98%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: true,
                    clickToEdit: true,
                    onBeforeEdit: function (editParm) {
                        if (editParm.record.__status == "nochanged") {
                            if (editParm.record.AUDITING == "1") return false;
                            else return true;
                        }
                        switch (editParm.column.name) {
                            case "":
                                if (editParm.record.__status == "add") return true;
                                else return false;
                                break;
                        }
                    },
                    onSuccess: function (data, g) {
                        if (data && data.Rows) {
                            var rows = data.Rows || [];
                            for (var i = 0, len = rows.length; i < len; i++) {
                                var row = rows[i];
                                row.OLDROLEID = row.ROLEID;
                            }
                        }
                    },
                    rowAttrRender: function (rowdata, rowid) {
                        return "";
                    }
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "add":
                            me.add();
                            break;
                        case "save":
                            me.save();
                            break;
                        case "delete":
                            me.delete();
                            break;
                        case "submit":
                            me.submit();
                            break;
                        case "detail":
                            me.detail();
                            break;
                        case "Excel":
                            $.ligerDialog.open({
                                url: "../System/Export.html?exporttype=xls",
                                modal: true
                            });
                            break;
                        case "Word":
                            $.ligerDialog.open({
                                url: "../System/Export.html?exporttype=doc",
                                modal: true
                            });
                            break;
                    }
                }
            
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            add: function () { //新增
                var me = this;
                me.grid.addEditRow({ "AUDITING": "0" });
            },
            save: function () { //保存
                var me = this;
                if (me.grid.endEdit() != false) {
                    if (!me.grid.isDataChanged) {
                        LG.showSuccess('无修改');
                        return;
                    }
                    if (!me.grid.validChangeRows()) return false;
                    var changeRow = me.grid.getChangedRows();
                    LG.ajax({
                        jsToken: true,
                        url: me.rootPath + 'SpDisableSave',
                        loading: '正在保存中...',
                        data: changeRow,
                        success: function (message, data) {
                            me.grid.isDataChanged = false;
                            me.reload();
                            if (data && data.length > 0) {
                                LG.showSuccess('保存成功,请添加禁用物资编码明细', function (confim) {
                                    $.ligerDialog.open({
                                        width: 1100,
                                        height: 750,
                                        allowClose: true,
                                        title: '[新增物资编码]',
                                        url: "sp_disable_detail.html?MenuNo=" + me.MenuNo + "&ver=" + me.ver,
                                        isHidden: false,
                                        showMax: false,
                                        showToggle: false,
                                        showMin: false,
                                        isResize: true,
                                        slide: false,
                                        onClosed: me.reload.bind(me),
                                        data: { "Did": data, "view": "0" }
                                    });
                                });
                            } else {
                                LG.showSuccess('保存成功');
                            }
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }

            },
            reload: function () { //刷新
                var me = this;
                me.buttons[0].click();
            },
            delete: function () { //删除
                var me = this;
                if (me.grid.endEdit() != false) {
                    var selected = me.grid.getSelectedRows();
                    if (selected.length > 0) {
                        if (selected[0].AUDITING == "1") {
                            LG.tip('已提交，无法删除!');
                        }
                        else {
                            $.ligerDialog.confirm('确定删除吗?', function (confirm) {
                                if (confirm) {
                                    for (var i = 0, len = (selected || []).length; i < len; i++) {
                                        me.grid.deleteRow(selected[i]);
                                    }
                                    me.save();
                                }
                            });
                        }
                    } else {
                        LG.tip('请选择行!');
                    }
                }
            },
            submit: function () {    //提交
                var me = this;
                var selected = me.grid.getSelectedRows();
                if (selected.length > 0) {
                    if (selected[0].AUDITING == null) {
                        LG.tip('请先保存!');
                    }
                    else if (selected[0].AUDITING != "0") {
                        LG.tip('已提交，无法再次提交!');
                    }
                    else {
                        var flag = true;
                        var sids = [];
                        selected.forEach((a) => {
                            if (a.AUDITING != "0") {
                                LG.tip(a.DISABLE_CODE + '已提交，无法再次提交!');
                                flag = false;
                                return;
                            }

                            if (a.DETAILCOUNT == 0) {
                                LG.tip(a.DISABLE_CODE + '未填写物资明细，无法提交!');
                                flag = false;
                                return;
                            }
                            sids.push(a.DISABLE_ID)
                        })
                        if (!flag) {
                            return;
                        }

                        LG.ajax({
                            jsToken: true,
                            url: me.rootPath + 'SpDisableSubmit',
                            loading: '正在保存中...',
                            data: { "sids": sids },
                            success: function () {
                                LG.showSuccess('提交成功');
                                me.grid.isDataChanged = false;
                                me.reload();
                            },
                            error: function (message) {
                                LG.showError(message);
                            }
                        });
                    }

                }
                else {
                    LG.tip('请选择行!');
                }
            },
            detail: function () { //明细
                var me = this;
                if (me.grid.getSelectedRows().length != 1) {
                    LG.showError("请选择一条记录");
                    return
                }

                $.ligerDialog.open({
                    width: 1100,
                    height: 750,
                    allowClose: true,
                    title: '[修改物资编码]',
                    url: "sp_disable_detail.html?MenuNo=" + me.MenuNo + "&ver=" + me.ver,
                    isHidden: false,
                    showMax: false,
                    showToggle: false,
                    showMin: false,
                    isResize: true,
                    slide: false,
                    onClosed: me.reload.bind(me),
                    data: { "Did": me.grid.getSelectedRows()[0].DISABLE_ID, "view": me.grid.getSelectedRows()[0].AUDITING }
                });
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Word',
                        text: '导出Word',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-word-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch = $("#formsearch")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                    }
                });
            },
            init: function () {
                var me = this;
                me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.setGrid();
                me.reload();
                return me;
            }
        };
        business.init();
    </script>
</body>
</html>
