<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title>供应商评估</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%; overflow:auto;">
    <form id="mainform" style="width:97%;">
    </form>
    <div style="width: 94.5%;" class="l-form">
        <div class="l-form-container">
            <div class="l-group" style="width: 100%;"><span>供应商评估明细</span></div>
            <ul style="display: block; width: 100%;" id="ulGrid">
                <li style="width: 100%;">
                    <div style="margin-bottom: 50px; width: 100%;" id="assess-det-grid">
                    </div>
                </li>
            </ul>
        </div>
    </div>
    <script type="text/javascript">
        'use strict';
        var business = {
            dialogData: {},
            isView: true,
            //主键
            sid: getQueryStringByName("sid"),
            auditing: [],
            assessBaseContent: [],
            user: [],
            appraise: [],
            setConfig: function () {
                var me = this;
                me.config = {
                    form: {
                        fields: [
                            {
                                display: "记录状态", name: "AUDITING", dbname: "AUDITING", type: "select", group: "评估任务信息总览", options: {
                                    type: "select",
                                    data: me.auditing,
                                    disabled: true
                                }
                            },
                            //实际为任务制定人id
                            {
                                display: "任务制定人", name: "FORMULATER_ID", dbname: "FORMULATER_ID", type: "select", options: {
                                    type: "select",
                                    data: me.user,
                                    disabled: true
                                }
                            },
                            //实际为评分人id
                            {
                                display: "评分人", name: "EXAMINER_ID", dbname: "EXAMINER_ID", type: "select", options: {
                                    type: "select",
                                    data: me.user,
                                    disabled: true
                                }
                            },
                            { display: "评估年度", name: "ASSESS_YEAR", newline: false, type: "text", options: { disabled: true } },
                            { display: "考核开始时间", name: "BEGIN_TIME", newline: false, type: "date", options: { disabled: true } },
                            { display: "考核结束时间", name: "END_TIME", newline: false, type: "date", options: { disabled: true } },
                            { display: "供应商名", name: "PROVIDER_NAME", newline: false, type: "text", options: { disabled: true } },
                            { display: "供应商产品", name: "PROVIDER_PRODUCTION", newline: false, type: "text", options: { disabled: true } },
                            { display: "考核说明", name: "REMARK", newline: false, type: "text", group: "总体考核结果" },
                            { display: "评估总分", name: "TOTAL_SCORE", newline: false, type: "float", options: { disabled: true } },
                            { display: "评估结果", name: "RESULT", newline: false, type: "text" },
                            //隐藏
                            { display: "主键", name: "ASSESS_ID", newline: false, type: "hidden" },
                            { display: "评估任务id", name: "ASSESS_TASK_ID", newline: false, type: "hidden" },
                            { display: "供应商id", name: "PROVIDER_ID", newline: false, type: "hidden" }
                        ]
                    },
                    grid: {
                        columns: [
                            {
                                //实际为评估基础主键
                                display: "评估内容", name: "ASSESS_BASE_ID", minWidth: 400, type: "select", editor: {
                                    type: "select",
                                    data: me.assessBaseContent,
                                    disabled: true
                                }
                            },
                            { display: "分数", name: "SCORE", width: 100, type: "float", editor: { type: 'float' } },
                            {
                                display: "分数等级", name: "SCORE_DESC", width: 100, type: "select", editor: {
                                    type: 'select',
                                    data: me.appraise
                                }
                            },
                            //隐藏
                            { display: "评估主表id", name: "ASSESS_ID", width: 100, type: "text", hide: true }
                        ]
                    }
                };
            },
            mainform: null,
            buttons: null,
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'Material/ProviderAssess/ComboxData',
                    loading: '正在获取中...',
                    success: function (data) {
                        me.auditing = data.Auditing;
                        me.assessBaseContent = data.AssessBaseContent;
                        me.user = data.User;
                        me.appraise = data.Appraise;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            loadData: function () {
                var me = this;
                if (!me.sid) {
                    me.mainform.setOrginData({});
                }
                else {
                    LG.ajax({
                        async: false,
                        url: 'Material/ProviderAssess/GetCertainAssess',
                        loading: '正在获取中...',
                        data: { assessId: me.sid },
                        success: function (data, message) {
                            me.mainform.setOrginData(data);
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                    if (me.isView) {
                        me.mainform.setReadonly(true);
                    }
                }
                me.mainform.focus();
            },
            save: function () { //保存
                var me = this;
                if ($.isEmptyObject(me.mainform.getChanges())) {
                    LG.showSuccess('无修改');
                    return;
                }
                if (!me.mainform.valid()) {
                    me.mainform.showInvalid();
                    return;
                }
                function handle(data) {
                    return data;
                }
                var data = handle(me.mainform.getData());
                var original = handle(me.mainform.getOrginData());
                var changeRow = new Object();
                if (!me.sid) {
                    changeRow["added"] = [data];
                }
                else {
                    changeRow["updated"] = [data];
                    changeRow["original"] = [original];
                }
                LG.ajax({
                    jsToken: true,
                    url: 'Material/ProviderAssess/Save',
                    loading: '正在保存中...',
                    data: changeRow,
                    success: function () {
                        LG.showSuccess('保存成功', function () {
                            location.reload(true);
                        });
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            close: function (skipConfirm) {
                var me = this;
                function inner(callback) {
                    if (!skipConfirm && !$.isEmptyObject(me.mainform.getChanges())) {
                        $.ligerDialog.confirm($.ligerDefaults.GridString.isContinueByDataChanged, function (confirm) {
                            if (confirm) {
                                if (callback) callback(2);
                            }
                            else {
                                if (callback) callback(0);
                            }
                        });
                        if (callback) return callback(-1);
                        return false;
                    }
                    if (callback) return callback(1);
                    return true;
                }
                inner(function (status) {
                    if (status > 0) {
                        if (me.dialog) {
                            me.dialog.close();
                            return;
                        }
                        var win = parent || window;
                        if (win.closeCurrentTab) win.closeCurrentTab();
                        else win.close();
                    }
                });
            },
            setFormDefaultBtn: function () {
                var me = this;
                //表单底部按钮
                var buttons = [];
                buttons.push({
                    text: '关闭',
                    onclick: function () {
                        var me = this;
                        me.close(false);
                    }.bind(me)
                });
                if (!me.isView) buttons.push({
                    text: '保存',
                    icon: 'fa fa-save',
                    onclick: function () {
                        //子表有修改而未保存时，询问是否保存子表
                        if (me.grid.isDataChanged) {
                            $.ligerDialog.confirm("评分未保存，是否保存评分？", function (confirm) {
                                if (confirm) {
                                    me.saveAssessDet();
                                }
                                else {
                                    me.save();
                                }
                            });
                        }
                        else {
                            me.save();
                        }
                    }.bind(me)
                });

                LG.addFormButtons(buttons);
                me.formButtons = buttons;
            },
            setForm: function () {
                var me = this;
                me.config.form.fields.removeNull();
                var $mainform = $("#mainform")
                //搜索表单应用ligerui样式
                me.mainform = $mainform.ligerForm({
                    EnterMoveNextControl: true,
                    labelAlign: 'right',
                    space: 3,
                    validate: true,
                    fields: me.config.form.fields,
                    labelWidth: 120,
                    readonly: me.isView,
                    onAfterSetFields: function (g) {
                        me.mainform = g;
                        me.buttons = g.options.buttons;
                    }
                });
                me.setFormDefaultBtn();
            },
            grid: null,
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#assess-det-grid").ligerGrid({
                    dateFormat: "yyyy-MM-dd hh:mm",
                    autoWidth: true,
                    delayLoad: true,
                    usePager: false,
                    columns: me.config.grid.columns,
                    dataAction: 'server',
                    toolbar: {},
                    url: 'Material/ProviderAssessDet/CertainAssessList',
                    parms: {
                        assessId: me.sid
                    },
                    sortName: 'ASSESS_BASE_ID',
                    sortOrder: 'asc',
                    width: '99%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: !me.isView,
                    clickToEdit: true,
                    onSuccess: function (data, g) {
                        //me.iframeloading.hide();
                    }
                });
                me.grid.isValid = true;
                if (!me.isView) {
                    me.loadToolbar();
                }
                me.bindGridEvent();
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Word',
                        text: '导出Word',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-word-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reloadAssessDet();
                            break;
                        case "save":
                            me.saveAssessDet();
                            break;
                        case "Excel":
                            $.ligerDialog.open({
                                url: "../../../System/Export.html?exporttype=xls&MenuNo=" + me.menuNo,
                                modal: true
                            });
                            break;
                        case "Word":
                            $.ligerDialog.open({
                                url: "../../../System/Export.html?exporttype=doc&MenuNo=" + me.menuNo,
                                modal: true
                            });
                            break;
                        default:
                            break;
                    }
                }
                //加载detail按钮
                me.grid.toolbarManager.options.group = 'detail';
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            //刷新
            reloadAssessDet: function () {
                var me = this;
                me.grid.loadData();
            },
            //保存
            saveAssessDet: function () {
                var me = this;
                if (me.grid.endEdit() != false) {
                    if (!me.grid.isDataChanged) {
                        LG.showSuccess('无修改');
                        return;
                    }
                    if (!me.grid.validChangeRows()) return false;
                    var changeRow = me.grid.getChangedRows();
                    LG.ajax({
                        jsToken: true,
                        url: 'Material/ProviderAssessDet/Save',
                        loading: '正在保存中...',
                        data: changeRow,
                        success: function () {
                            var me = this;
                            //LG.showSuccess('保存成功');
                            me.grid.isDataChanged = false;
                            me.reloadAssessDet();

                            //计算评估明细的总分，设置主表的 TOTAL_SCORE
                            var me = this;
                            let sum = 0;
                            let data = me.grid.getData();
                            for (let item of data) {
                                sum += item.SCORE;
                            }
                            me.mainform.setData({TOTAL_SCORE: sum});

                            //子表保存后同时保存主表
                            me.save();
                        }.bind(me),
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }
            },
            init: function () {
                var me = this;
                if (frameElement && frameElement.dialog) {
                    me.dialog = frameElement.dialog;
                    me.dialogData = me.dialog.get('data') || {};
                    if (me.dialogData.callback) me.callback = me.dialogData.callback;
                    if (me.dialogData.sid) me.sid = me.dialogData.sid;
                    if (me.dialogData.hasOwnProperty('isView')) me.isView = me.dialogData.isView;
                }
                me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.loadData();

                //加载任务基础
                me.setGrid();
                me.reloadAssessDet();

                return me;
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>

</html>
