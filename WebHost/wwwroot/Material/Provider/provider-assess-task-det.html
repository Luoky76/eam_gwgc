<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title>任务明细</title>
    <script src="../../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%; overflow:auto;">
    <div id="mainform" style="width:97%;">
    </div>
    <div style="width: 94.5%;" class="l-form">
        <div class="l-form-container">
            <div class="l-group" style="width: 100%;"><span>评估任务明细</span></div>
            <ul style="display: block; width: 100%;" id="ulGrid">
                <li style=" width: 50%; float: left">
                    <div style="margin-bottom: 50px; width: 100%;" id="task-base-grid">
                    </div>
                </li>
                <li style=" width: 50%; float: left">
                    <div style="margin-bottom: 50px; width: 100%;" id="examiner-grid">
                    </div>
                </li>
            </ul>
        </div>
    </div>
    <script type="text/javascript">
        'use strict';
        var business = {
            menuNo: getQueryStringByName("MenuNo"),
            dialogData: {},
            //主表主键
            sid: getQueryStringByName("sid"),
            isAddNew: false,
            isView: true,
            auditing: [],
            assessBaseContent: [],
            orginData: {},
            setConfig: function () {
                var me = this;
                me.config = {
                    form: {
                        labelwidth: 220,
                        fields: [
                            { display: "记录状态", name: "AUDITING", dbname: "AUDITING", width: 310, type: "select", align: "left", editor: { type: 'select', data: me.auditing, disabled: true } },
                            { display: "编码字段", name: "ASSESS_TASK_CODE", dbname: "ASSESS_TASK_CODE", width: 300, type: "text" },
                            { display: "供应商名", name: "PROVIDER_NAME", dbname: "PROVIDER_NAME", width: 300, type: "text" },
                            { display: "任务制定人", name: "FORMULATER_NAME", dbname: "FORMULATER_NAME", width: 300, type: "text" },
                            { display: "考核开始时间", name: "BEGIN_TIME", dbname: "BEGIN_TIME", width: 300, type: "date", format: "yyyy-MM-dd hh:mm ", options: { format: "yyyy-MM-dd hh:mm ", showTime: true } },
                            { display: "考核结束时间", name: "END_TIME", dbname: "END_TIME", width: 300, type: "date", format: "yyyy-MM-dd hh:mm ", options: { format: "yyyy-MM-dd hh:mm ", showTime: true } },
                            { display: "供应商产品", name: "PROVIDER_PRODUCTION", dbname: "PROVIDER_PRODUCTION", width: 300, type: "text" },
                            { display: "备注", name: "REMARK", dbname: "REMARK", width: 1000, type: "textarea" },
                            //隐藏
                            { display: "主键", name: "ASSESS_TASK_ID", dbname: "ASSESS_TASK_ID", width: 300, type: "hidden" },
                            { display: "供应商id", name: "PROVIDER_ID", dbname: "PROVIDER_ID", width: 300, type: "hidden" },
                            { display: "任务制定人id", name: "FORMULATER_ID", dbname: "FORMULATER_ID", width: 300, type: "hidden" },
                            { display: "添加人ID", name: "CREATE_USERID", dbname: "CREATE_USERID", width: 300, type: "hidden" },
                            { display: "添加时间", name: "CREATEDATE", dbname: "CREATEDATE", width: 300, type: "hidden" },
                            { display: "修改人ID", name: "MODIFY_USERID", dbname: "MODIFY_USERID", width: 300, type: "hidden" },
                            { display: "修改时间", name: "MODIFYDATE", dbname: "MODIFYDATE", width: 300, type: "hidden" },
                        ]
                    },
                    grid: {
                        columns: [
                            {
                                //实际为评估基础主键
                                display: "评估内容", name: "ASSESS_BASE_ID", dbname: "ASSESS_BASE_ID", minWidth: 400, op: "equal", type: "select", editor: {
                                    type: "select",
                                    data: me.assessBaseContent
                                }
                            },
                            //隐藏
                            { display: "评估内容", name: "CONTENT", width: 100, type: "text", hide: true },
                            { display: "评估任务ID", name: "ASSESS_TASK_ID", width: 100, type: "text", hide: true },
                            { display: "添加人ID", name: "CREATE_USERID", width: 100, type: "text", hide: true },
                            { display: "添加时间", name: "CREATEDATE", width: 100, type: "date", hide: true },
                            { display: "修改人ID", name: "MODIFY_USERID", width: 100, type: "text", hide: true },
                            { display: "修改时间", name: "MODIFYDATE", width: 100, type: "date", hide: true }
                        ]
                    }
                };
            },
            mainform: null,
            buttons: null,
            loadData: function () {
                var me = this;
                function inner() {
                    var data = me.mainform.getData();
                    LG.getFormCombChanges(data, me.orginData, true);
                    delete me.orginData;
                    me.orginData = data;
                }
                if (me.isAddNew) {
                    //设置记录状态的初值为未提交
                    me.mainform.setData({ AUDITING: "0" });
                    inner();
                }
                else {
                    LG.ajax({
                        async: false,
                        url: 'Material/ProviderAssessTask/Get',
                        loading: '正在获取中...',
                        data: { id: me.sid },
                        success: function (data, message) {
                            me.mainform.setData(data);
                            inner();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                    if (me.isView) {
                        me.mainform.setReadonly(true);
                    }
                }
            },
            //保存
            save: function () { //保存
                var me = this;
                if (!me.mainform.valid()) {
                    me.mainform.showInvalid();
                    return;
                }
                function handle(data) {
                    data.GRID = encrypt(data.GRID);
                    data.SEARCH = encrypt(data.SEARCH);
                    data.FORM = encrypt(data.FORM);
                    return data;
                }
                var data = handle(me.mainform.getData());
                var original = handle(me.orginData);

                var changeRow = new Object();
                if (me.isAddNew) {
                    changeRow["added"] = [data];
                }
                else {
                    changeRow["updated"] = [data];
                    changeRow["original"] = [original];
                }
                LG.ajax({
                    jsToken: true,
                    url: 'Material/ProviderAssessTask/Save',
                    loading: '正在保存中...',
                    data: { request: changeRow },
                    success: function (result) {
                        LG.showSuccess('保存成功');
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            close: function () {
                var me = this;
                function inner(callback) {
                    var data = me.mainform.getData();
                    var updateFields = LG.getFormCombChanges(data, me.orginData, true);
                    if (updateFields) {
                        $.ligerDialog.confirm($.ligerDefaults.GridString.isContinueByDataChanged, function (confirm) {
                            if (confirm) {
                                if (callback) callback(2);
                            }
                            else {
                                if (callback) callback(0);
                            }
                        });
                        if (callback) return callback(-1);
                        return false;
                    }
                    if (callback) return callback(1);
                    return true;
                }
                inner(function (status) {
                    if (status > 0) {
                        if (me.dialog) me.dialog.close();
                        if (me.callback) me.callback(false);
                    }
                });
            },
            setFormDefaultBtn: function (cancleCallback, savedCallback) {
                var me = this;
                //表单底部按钮
                var buttons = [];
                if (!me.isView) {
                    buttons.push({
                        text: '重置', icon: 'fa fa-undo', onclick: function () {
                            $.ligerDialog.confirm("确定重置数据吗?", function (confirm) {
                                if (confirm) {
                                    me.loadData();
                                }
                            });
                        }
                    });
                }
                buttons.push({ text: '关闭', icon: 'fa fa-window-close', onclick: me.close.bind(me) });
                if (!me.isView) buttons.push({ text: '保存', icon: 'fa fa-save', onclick: me.save.bind(me) });

                LG.addFormButtons(buttons);
                me.formButtons = buttons;
            },
            setForm: function () {
                var me = this;
                me.config.form.fields.removeNull();
                var $formsearch = $("#mainform")
                //搜索表单应用ligerui样式
                me.mainform = $formsearch.ligerForm({
                    EnterMoveNextControl: true,
                    labelAlign: 'right',
                    space: 3,
                    validate: true,
                    fields: me.config.form.fields,
                    labelWidth: 120,
                    onAfterSetFields: function (g) {
                        me.mainform = g;
                        me.buttons = g.options.buttons;
                    }
                });
                me.setFormDefaultBtn();
            },
            //获取下拉框数据
            loadComboxData: function () {
                var me = this;
                var dataControl = [];
                LG.ajax({
                    async: false,
                    url: 'Material/ProviderAssessTaskDet/ComboxData',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        me.assessBaseContent = data.AssessBaseContent;
                        me.auditing = data.Auditing;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
                return dataControl;
            },
            grid: null,
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#task-base-grid").ligerGrid({
                    dateFormat: "yyyy-MM-dd hh:mm",
                    autoWidth: true,
                    delayLoad: true,
                    usePager: false,
                    columns: me.config.grid.columns,
                    dataAction: 'server',
                    toolbar: {},
                    url: 'Material/ProviderAssessTaskDet/GetAssessTask',
                    parms: {
                        assessTaskId: me.sid
                    },
                    sortName: 'ASSESS_BASE_ID',
                    sortOrder: 'asc',
                    width: '99%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: true,
                    clickToEdit: true,
                    onSuccess: function (data, g) {
                        //me.iframeloading.hide();
                    }
                });
                me.grid.isValid = true;
                if (!me.isView) {
                    me.loadToolbar();
                }
                me.bindGridEvent();
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Word',
                        text: '导出Word',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-word-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reloadTaskBase();
                            break;
                        case "add":
                            me.addTaskBase();
                            break;
                        case "delete":
                            me.deleteTaskBase();
                            break;
                        case "import":
                            me.importTaskBase();
                            break;
                        case "save":
                            me.saveTaskBase();
                            break;
                        case "Excel":
                            $.ligerDialog.open({
                                url: "../../../System/Export.html?exporttype=xls&MenuNo=" + me.menuNo,
                                modal: true
                            });
                            break;
                        case "Word":
                            $.ligerDialog.open({
                                url: "../../../System/Export.html?exporttype=doc&MenuNo=" + me.menuNo,
                                modal: true
                            });
                            break;
                        default:
                            break;
                    }
                }
                //加载detail按钮
                me.grid.toolbarManager.options.group = 'detail';
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            //刷新
            reloadTaskBase: function () {
                var me = this;
                me.grid.loadData();
            },
            //新增
            addTaskBase: function () {
                var me = this;
                //设置新增行的ASSESS_TASK_ID为主表主键
                me.grid.addEditRow({"ASSESS_TASK_ID": me.sid}, true);
            },
            //导入
            importTaskBase: function () {
                var me = this;
                var gridData = me.grid.getData();
                var currentBaseIds = [];
                for (var item of gridData) {
                    currentBaseIds.push(item.ASSESS_BASE_ID);
                }
                var options = {
                    width: 800,
                    height: 400,
                    allowClose: true,
                    title: '[导入]评估任务基础',
                    url: "provider-assess-base-select.html?MenuNo=" + me.menuNo,
                    isHidden: false,
                    showMax: false,
                    showToggle: false,
                    showMin: false,
                    isResize: true,
                    slide: false,
                    //传入当前已在评估任务中的任务基础，导入时将其排除
                    currentBaseIds: currentBaseIds,
                    //传入主键
                    assessTaskId: me.sid,
                    onClose: function () {
                        me.reloadTaskBase();
                    }
                }
                $.ligerDialog.open(options);
            },
            //保存
            saveTaskBase: function () {
                var me = this;
                if (me.grid.endEdit() != false) {
                    if (!me.grid.isDataChanged) {
                        LG.showSuccess('无修改');
                        return;
                    }
                    if (!me.grid.validChangeRows()) return false;
                    var changeRow = me.grid.getChangedRows();
                    LG.ajax({
                        jsToken: true,
                        url: 'Material/ProviderAssessTaskDet/Save',
                        loading: '正在保存中...',
                        data: changeRow,
                        success: function () {
                            LG.showSuccess('保存成功');
                            me.grid.isDataChanged = false;
                            me.reloadTaskBase();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }
            },
            //删除
            deleteTaskBase: function () {
                var me = this;
                if (me.grid.endEdit() != false) {
                    var selected = me.grid.getSelectedRows();
                    if (selected.length > 0) {
                        $.ligerDialog.confirm('确定删除吗?', function (confirm) {
                            if (confirm) {
                                for (var i = 0, len = (selected || []).length; i < len; i++) {
                                    me.grid.deleteRow(selected[i]);
                                }
                                me.saveTaskBase();
                            }
                        });
                    } else {
                        LG.tip('请选择行!');
                    }
                }
            },
            setExaminerGrid: function () {
                var me = this;
                /*me.config.grid.columns.removeNull();
                me.grid = $("#examiner-grid").ligerGrid({
                    dateFormat: "yyyy-MM-dd hh:mm",
                    autoWidth: true,
                    delayLoad: true,
                    usePager: false,
                    columns: me.config.grid.columns,
                    dataAction: 'server',
                    toolbar: {},
                    url: 'Material/ProviderAssessTaskDet/GetAssessTask',
                    parms: {
                        assessTaskId: me.sid
                    },
                    sortName: 'ASSESS_BASE_ID',
                    sortOrder: 'asc',
                    width: '99%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: true,
                    clickToEdit: true,
                    onSuccess: function (data, g) {
                        //me.iframeloading.hide();
                    }
                });
                me.grid.isValid = true;
                if (!me.isView) {
                    me.loadToolbar();
                }
                me.bindGridEvent();*/
            },
            //初始化
            init: function () {
                var me = this;
                debugger
                if (frameElement && frameElement.dialog) {
                    me.dialog = frameElement.dialog;
                    me.dialogData = me.dialog.get('data');
                    me.callback = me.dialogData.callback;
                    if (me.dialogData.sid != undefined) me.sid = me.dialogData.sid;
                    if (me.dialogData.isNew != undefined) me.isAddNew = me.dialogData.isNew;
                    if (me.dialogData.isView != undefined) me.isView = me.dialogData.isView;

                    //对于新增对话框，先生成并获取主键
                    if (me.isAddNew) {
                        LG.ajax({
                            async: false,
                            url: 'Material/ProviderAssessTask/CreatePrimaryKey',
                            loading: '正在获取中...',
                            data: { },
                            success: function (data, message) {
                                me.sid = data;
                            },
                            error: function (message) {
                                LG.showError(message);
                            }
                        });
                    }
                }

                //获取下拉框数据
                me.loadComboxData();
                //加载基础信息
                me.setConfig();
                me.setForm();
                me.loadData();

                //加载任务基础
                me.setGrid();
                me.reloadTaskBase();

                //加载评分人
                me.setExaminerGrid();

                return me;
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>

</html>
