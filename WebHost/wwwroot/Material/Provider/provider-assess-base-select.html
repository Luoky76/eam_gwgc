<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title>挑选供应商评估基础</title>
    <script src="../../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 2px; height: 100%;">
    <div id="layout">
        <div position="center" title="">
            <div id="iframeloading" class='l-loading' style="display:none;">
            </div>
            <form id="mainform">
                <div id="maingrid" style="margin: 2px;"></div>
            </form>
        </div>
    </div>
    <script type="text/javascript">
        'use strict';
        var business = {
            setConfig: function () {
                var me = this;
                me.config = {
                    grid: {
                        columns: [
                            { display: "评价内容", name: "CONTENT", minWidth: 400, type: "text", editor: { type: "text" } },
                            { display: "是否有效", name: "IS_VALID", width: 200, type: "chk", editor: { type: "chkStr" } },
                            //隐藏
                            { display: "主键", name: "ASSESS_BASE_ID", width: 100, type: "text", editor: { type: "text" }, hide: true },
                            { display: "添加人ID", name: "CREATE_USERID", width: 100, type: "text", editor: { type: "text" }, hide: true },
                            { display: "添加时间", name: "CREATEDATE", width: 100, type: "date", editor: { type: "date", showTime: true, format: "yyyy-MM-dd hh:mm" }, hide: true },
                            { display: "修改人ID", name: "MODIFY_USERID", width: 100, type: "text", editor: { type: "text" }, hide: true },
                            { display: "修改时间", name: "MODIFYDATE", width: 100, type: "date", editor: { type: "date", showTime: true, format: "yyyy-MM-dd hh:mm" }, hide: true }
                        ]
                    }
                };
            },
            //已在评估任务中的评估基础
            currentBaseIds: [],
            grid: null,
            //底部按钮
            buttons: [],
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    autoWidth: true,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    usePager: false,
                    dataAction: 'local',
                    toolbar: {},
                    url: 'Material/ProviderAssessBase/list',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: 'ASSESS_BASE_ID',
                    sortOrder: 'asc',
                    width: '98%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: false,
                    clickToEdit: false,
                });
                me.grid.isValid = true;
                me.loadToolbar();
            },
            //添加底部按钮
            loadToolbar: function () {
                var me = this;
                me.buttons.push({
                    text: '关闭',
                    icon: 'fa fa-window-close',
                    onclick: function () {
                        me.dialog.close();
                    }
                });
                me.buttons.push({
                    text: '确定',
                    icon: 'fa fa-check',
                    onclick: function () {
                        me.dialog.close(me.grid.getSelectedRows());
                    }
                });
                LG.addFormButtons(me.buttons);
            },
            //载入数据
            reload: function () {
                var me = this;
                me.grid.loadData();
            },
            init: function () {
                var me = this;
                debugger
                //获取打开对话框时的传入参数
                if (frameElement && frameElement.dialog) {
                    me.dialog = frameElement.dialog;
                    me.dialogData = me.dialog.get('data');
                    me.currentBaseIds = me.dialogData;
                }
                me.setConfig();
                me.setGrid();
                me.reload();
                return me;
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>
</html>
