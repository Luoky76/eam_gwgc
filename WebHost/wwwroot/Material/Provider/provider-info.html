<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title>供应商信息登记</title>
    <script src="../../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 2px; height: 100%;">
    <div id="layout">
        <div position="center" title="">
            <div id="mainsearch">
                <form action="" id="formsearch" class="l-form">
                </form>
            </div>
            <div id="iframeloading" class='l-loading' style="display:none;">
            </div>
            <form id="mainform">
                <div id="maingrid" style="margin: 2px;"></div>
            </form>
        </div>
    </div>
    <script type="text/javascript">
        'use strict';
        var business = {
            menuNo: getQueryStringByName("MenuNo"),
            ver: getQueryStringByName("ver"),
            iframeloading: $("#iframeloading"),
            detailWidth: 1500,
            detailHeight: 700,
            dataYN: [{ ID: "0", TEXT: "否" }, { ID: "1", TEXT: "是" }],
            currentNode: null,
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            {
                                //实际取的是PROVIDER_ID，op: "equal"表示需要严格相等
                                display: "供应商名称", name: "_search_PROVIDER_NAME", dbname: "PROVIDER_ID", newline: false, minWidth: 300, upper: true, op: "equal", type: "select", options: {
                                    type: "select",
                                    data: me.ProviderName
                                }
                            },
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "已提交", name: "AUDITING", dbname: "AUDITING", width: 100, type: "chk" },
                            { display: "供应商名称", name: "PROVIDER_NAME", dbname: "PROVIDER_NAME", minWidth: 150, type: "text", align: "left", validate: { required: true } },
                            { display: "供应商编码", name: "PROVIDER_CODE", dbname: "PROVIDER_CODE", minWidth: 150, type: "text", align: "left"},
                            { display: "供应商简称", name: "ABBREVIATION", dbname: "ABBREVIATION", minWidth: 150, type: "text", align: "left"},
                            { display: "地址", name: "REG_ADDRESS", dbname: "REG_ADDRESS", minWidth: 150, type: "text", align: "left"},
                            { display: "企业法人", name: "LEGAL_REPRESENT", dbname: "LEGAL_REPRESENT", minWidth: 150, type: "text"},
                            { display: "营业执照号", name: "LICENSE_CODE", dbname: "LICENSE_CODE", minWidth: 150, type: "text"},
                            { display: "合格供应商综合评定", name: "QUA_CONCLUSION", dbname: "QUA_CONCLUSION", minWidth: 150, type: "text" },
                            { display: "供应商状态", name: "PROVIDER_STATUS", dbname: "PROVIDER_STATUS", minWidth: 150, type: "text" },
                            //隐藏
                            { display: "主键", name: "c", dbname: "PROVIDER_ID", width: 150, type: "text", align: "left", hide: true },
                            /*{ display: "服务单位", name: "ORG_NAME", dbname: "ORG_NAME", width: 150, type: "text", align: "left", hide: true },
                            { display: "管理部门", name: "DEPT_NAME", dbname: "DEPT_NAME", width: 150, type: "text", align: "left", hide: true },
                            { display: "注册资金", name: "ENTITY_REG_FUND", dbname: "ENTITY_REG_FUND", width: 150, type: "text", align: "left", hide: true },
                            { display: "企业性质", name: "ENTER_NATURE", dbname: "ENTER_NATURE", width: 150, type: "text", align: "left", hide: true },
                            { display: "企业年资", name: "ENTER_QUALITY", dbname: "ENTER_QUALITY", width: 150, type: "text", align: "left", hide: true },
                            { display: "经营许可证", name: "BUSINESS_LIC", dbname: "BUSINESS_LIC", width: 150, type: "text", align: "left", hide: true },
                            { display: "联系人", name: "PROVIDER_CONTACT", dbname: "PROVIDER_CONTACT", width: 150, type: "text", align: "left", hide: true },
                            { display: "联系电话", name: "PROVIDER_PHONE", dbname: "PROVIDER_PHONE", width: 150, type: "text", align: "left", hide: true },
                            { display: "传真", name: "FAX", dbname: "FAX", width: 150, type: "text", align: "left", hide: true },
                            { display: "邮件", name: "EMAIL", dbname: "EMAIL", width: 150, type: "text", align: "left", hide: true },
                            { display: "网站", name: "WEBSITE", dbname: "WEBSITE", width: 150, type: "text", align: "left", hide: true },
                            { display: "一般纳税人", name: "AVERAGE_TAX", dbname: "AVERAGE_TAX", width: 150, type: "text", align: "left", hide: true },
                            { display: "主供范围", name: "BIZ_SCOPE", dbname: "BIZ_SCOPE", width: 150, type: "text", align: "left", hide: true },
                            { display: "供应商来源", name: "PROVIDER_SRC", dbname: "PROVIDER_SRC", width: 150, type: "text", align: "left", hide: true },
                            { display: "供应商分类", name: "PROVIDER_TYPE", dbname: "PROVIDER_TYPE", width: 150, type: "text", align: "left", hide: true },
                            { display: "合作情况", name: "COOPERATION", dbname: "COOPERATION", width: 150, type: "text", align: "left", hide: true },
                            { display: "评审结论", name: "CONCLUSION", dbname: "CONCLUSION", width: 150, type: "text", align: "left", hide: true },
                            { display: "国家", name: "COUNTY", dbname: "COUNTY", width: 150, type: "text", align: "left", hide: true },
                            { display: "省份", name: "PROVINCE", dbname: "PROVINCE", width: 150, type: "text", align: "left", hide: true },
                            { display: "城市", name: "CITY", dbname: "CITY", width: 150, type: "text", align: "left", hide: true },
                            { display: "开户银行", name: "BANK_NAME", dbname: "BANK_NAME", width: 150, type: "text", align: "left", hide: true },
                            { display: "联行号", name: "BANK_CODE", dbname: "BANK_CODE", width: 150, type: "text", align: "left", hide: true },
                            { display: "税务登记号", name: "TAX_REG_NO", dbname: "TAX_REG_NO", width: 150, type: "text", align: "left", hide: true },
                            { display: "登记日期", name: "EDIT_DATE", dbname: "EDIT_DATE", width: 150, type: "date", format: "yyyy-MM-dd hh:mm", align: "left", hide: true },
                            { display: "登记人", name: "EDIT_USER", dbname: "EDIT_USER", width: 150, type: "text", align: "left", hide: true },
                            { display: "物资品质", name: "QUALITY", dbname: "QUALITY", width: 150, type: "text", align: "left", hide: true },
                            { display: "交货期", name: "DELIVERY", dbname: "DELIVERY", width: 150, type: "text", align: "left", hide: true },
                            { display: "紧急订单处理情况", name: "ORDER_SIT", dbname: "ORDER_SIT", width: 150, type: "text", align: "left", hide: true },
                            { display: "资信情况", name: "CREDIT", dbname: "CREDIT", width: 150, type: "text", align: "left", hide: true },
                            { display: "综合实力", name: "STRENGTH", dbname: "STRENGTH", width: 150, type: "text", align: "left", hide: true },
                            { display: "售后服务响应速度", name: "RESPONE_SPEED", dbname: "RESPONE_SPEED", width: 150, type: "text", align: "left", hide: true },
                            { display: "售后服务品质", name: "SERVICE_QUAL", dbname: "SERVICE_QUAL", width: 150, type: "text", align: "left", hide: true },
                            { display: "服务单位ID", name: "ORG_ID", dbname: "ORG_ID", width: 150, type: "text", align: "left", hide: true },
                            { display: "管理部门ID", name: "DEPT_ID", dbname: "DEPT_ID", width: 150, type: "text", align: "left", hide: true },*/
                            { display: "登记人ID", name: "EDIT_USERID", dbname: "EDIT_USERID", width: 150, type: "text", align: "left", hide: true },
                            { display: "添加人ID", name: "CREATE_USERID", dbname: "CREATE_USERID", width: 150, type: "text", align: "left", hide: true },
                            { display: "添加时间", name: "CREATEDATE", dbname: "CREATEDATE", width: 150, type: "date", format: "yyyy-MM-dd hh:mm", align: "left", hide: true },
                            { display: "修改人ID", name: "MODIFY_USERID", dbname: "MODIFY_USERID", width: 150, type: "text", align: "left", hide: true },
                            { display: "修改时间", name: "MODIFYDATE", dbname: "MODIFYDATE", width: 150, type: "date", format: "yyyy-MM-dd hh:mm", align: "left", hide: true }
                        ]
                    }
                };
            },
            grid: null,
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    dateFormat: "yyyy-MM-dd hh:mm",
                    autoWidth: true,
                    delayLoad: true,
                    usePager: true,
                    columns: me.config.grid.columns,
                    dataAction: 'server',
                    toolbar: {},
                    url: 'Material/ProviderInfo/List',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: 'PROVIDER_NAME',
                    sortOrder: 'asc',
                    width: '99%',
                    height: '100%',
                    rownumbers: true,
                    checkbox: true,
                    enabledEdit: false,
                    clickToEdit: false,
                    onBeforeEdit: function (editParm) {
                        switch (editParm.column.name) {
                            case "":
                                if (editParm.record.__status == "add") return true;
                                else return false;
                                break;
                        }
                    },
                    onSuccess: function (data, g) {
                        me.iframeloading.hide();
                    },
                    rowAttrRender: function (rowdata, rowid) {
                        if (rowdata && rowdata.VALIDFLAG && rowdata.VALIDFLAG !== "1") {
                            return "style='color:red;'";
                        }
                        return "";
                    },
                    onDblClickRow: function (data, rowid, rowdata) {
                        me.view(rowid);
                    }
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "add":
                            me.add();
                            break;
                        case "modify":
                            me.modify();
                            break;
                        case "delete":
                            me.delete();
                            break;
                        case "save":
                            me.save();
                            break;
                        case "submit":
                            me.submit();
                            break;
                        case "Excel":
                            $.ligerDialog.open({
                                url: "../../../System/Export.html?exporttype=xls&MenuNo=" + me.menuNo,
                                modal: true
                            });
                            break;
                        case "Word":
                            $.ligerDialog.open({
                                url: "../../../System/Export.html?exporttype=doc&MenuNo=" + me.menuNo,
                                modal: true
                            });
                            break;
                        default:
                            break;
                    }
                }
                //me.grid.toolbarManager.options.group = 'main';    //按钮分组
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            add: function () { //新增
                var me = this;

                $.ligerDialog.open({
                    width: me.detailWidth,
                    height: me.detailHeight,
                    allowClose: true,
                    title: '[新增]供应商信息登记',
                    url: "provider-info-detail.html?MenuNo=" + me.menuNo + "&ver=" + me.ver,
                    isHidden: false,
                    showMax: false,
                    showToggle: false,
                    showMin: false,
                    isResize: true,
                    slide: false,
                    onClosed: me.reload.bind(me),
                    data: { "sid": null, "isNew": true, "isView": false }
                });
            },
            view: function () { //查看
                var me = this;
                var selected = me.grid.getSelectedRow();
                if (selected) {
                    $.ligerDialog.open({
                        width: me.detailWidth,
                        height: me.detailHeight,
                        allowClose: true,
                        title: '[查看]供应商信息登记',
                        url: "provider-info-detail.html?MenuNo=" + me.menuNo + "&ver=" + me.ver,
                        isHidden: false,
                        showMax: false,
                        showToggle: false,
                        showMin: false,
                        isResize: true,
                        slide: false,
                        onClosed: me.reload.bind(me),
                        data: { "sid": selected.PROVIDER_ID, "isNew": false, "isView": true }
                    });
                } else {
                    LG.tip('请选择行!');
                }
            },
            modify: function () { //修改
                var me = this;
                var rows = me.grid.getSelectedRows();
                if (rows.length > 1) {
                    LG.showError("不能选择多行")
                    return
                } else if (rows.length == 0) {
                    LG.showError("请选择一行")
                    return
                }
                var selected = me.grid.getSelectedRow();
                if (selected) {
                    if (selected.AUDITING == "1") {
                        LG.showError("该数据已提交,无法修改!");
                        return
                    }
                    $.ligerDialog.open({
                        width: me.detailWidth,
                        height: me.detailHeight,
                        allowClose: true,
                        title: '[修改]供应商信息登记',
                        url: "provider-info-detail.html?MenuNo=" + me.menuNo + "&ver=" + me.ver,
                        isHidden: false,
                        showMax: false,
                        showToggle: false,
                        showMin: false,
                        isResize: true,
                        slide: false,
                        onClosed: me.reload.bind(me),
                        data: { "sid": selected.PROVIDER_ID, isNew: false, isView: false }
                    });
                } else {
                    LG.tip('请选择行!');
                }
            },
            submit: function () { //提交
                var me = this;
                var selecteds = me.grid.getSelectedRows();
                if (selecteds) {
                    var updatedarr = [];
                    var orginarr = [];
                    for (var i = 0; i < selecteds.length; i++) {
                        var ori = JSON.parse(JSON.stringify(selecteds[i]));
                        var upd = JSON.parse(JSON.stringify(selecteds[i]));
                        upd.AUDITING = "1";
                        orginarr.push(ori);
                        updatedarr.push(upd)
                    }
                    var changeRow = new Object();
                    changeRow["updated"] = updatedarr;
                    changeRow["original"] = orginarr;
                    LG.ajax({
                        jsToken: true,
                        url: 'Material/ProviderInfo/Save',
                        loading: '正在提交中...',
                        data: changeRow,
                        success: function () {
                            LG.showSuccess('提交成功');
                            me.grid.isDataChanged = false;
                            me.reload();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                } else {
                    LG.tip('请选择行!');
                }
            },
            save: function () { //保存
                var me = this;
                if (me.grid.endEdit() != false) {
                    if (!me.grid.isDataChanged) {
                        LG.showSuccess('无修改');
                        return;
                    }
                    if (!me.grid.validChangeRows()) return false;
                    var changeRow = me.grid.getChangedRows();
                    LG.ajax({
                        jsToken: true,
                        url: 'Material/ProviderInfo/Save',
                        loading: '正在保存中...',
                        data: changeRow,
                        success: function () {
                            LG.showSuccess('保存成功');
                            me.grid.isDataChanged = false;
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }
            },
            reload: function () { //刷新
                var me = this;
                me.grid.loadData();
            },
            delete: function () { //删除
                var me = this;
                if (me.grid.endEdit() != false) {
                    var selected = me.grid.getSelectedRows();
                    for (var i = 0; i < selected.length; i++) {
                        if (selected[i].AUDITING == "1") {
                            LG.showError("选中数据有部分已提交,无法删除");
                            return;
                        }
                    }
                    if (selected.length > 0) {
                        $.ligerDialog.confirm('确定删除吗?', function (confirm) {
                            if (confirm) {
                                for (var i = 0, len = (selected || []).length; i < len; i++) {
                                    me.grid.deleteRow(selected[i]);
                                }
                                me.save();
                            }
                        });
                    } else {
                        LG.tip('请选择行!');
                    }
                }
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Word',
                        text: '导出Word',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-word-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch = $("#formsearch")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                    }
                });
            },
            //获取下拉框数据
            loadComboxData: function () {
                var me = this;
                var dataControl = [];
                LG.ajax({
                    async: false,
                    url: 'Material/ProviderInfo/ComboxData',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        me.ProviderName = data.ProviderName;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
                return dataControl;
            },
            init: function () {
                var me = this;
                $("#layout").ligerLayout({ leftWidth: 240 });
                me.iframeloading.show();
                me.loadComboxData();
                me.setConfig();
                me.setGrid();
                me.setForm();
                me.reload();
                return me;
            }
};
business.init();
    </script>
</body>
</html>
