<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title></title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <div id="mainsearch" style="width: 98%">
        <form action="" id="formsearch" class="l-form">
        </form>
    </div>
    <form action="" id="mainform">
        <div id="maingrid">
        </div>
    </form>
    <script type="text/javascript">
        'use strict';
        var business = {
            rootPath:'Material/SpApply/',
            MenuNo: getQueryStringByName("MenuNo"),
            dialog: null,
            dialogData: null,
            Sid: null,
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            { display: "关联外键", name: "_search_APPLY_ID", dbname: "APPLY_ID", newline: false, type: "hidden" },
                        ]
                    },
                    grid: {
                        columns: [
                            {
                                display: "物料编码", name: "SP_CODE", width: 150, type: "text",
                                totalSummary:
                                {
                                    render: function (suminf, column, cell) {
                                        return '<div>合计</div>';
                                    },
                                    align: 'center'
                                }
                            },
                            { display: "物料名称", name: "SP_NAME", width: 150, type: "text",  },
                            { display: "型号规格", name: "SP_SIZE", width: 150, type: "text",  },
                            { display: "品牌、厂家", name: "PRODUCE", width: 150, type: "text", },
                            { display: "计量单位", name: "UNIT", width: 150, type: "text", },
                            { display: "物料分类", name: "TYPE_NAME", width: 150, type: "text",},
                            { display: "库存数量", name: "STORE_NUM", width: 150, type: "decimal", },
                            { display: "质保期(月)", name: "WARRANTY", width: 150, type: "text", },
                            { display: "上次供应商", name: "LAST_PROVIDER", width: 150, type: "text", },
                            {
                                display: "数量", name: "COUNT", type: "number", width: 80, editor: {
                                    type: 'number', onChangeValue: function (input, value, g) {
                                        var editParm = g.options.editParm.record;
                                        editParm["YG_MONEY"] = ((editParm.YG_PRICE || 0) * value).toFixed(2);
                                    }
                                }, validate: { required: true }, totalSummary:
                                {
                                    type: 'sum',
                                    align: 'center'
                                }
                            },
                            {
                                display: "预估单价(元)", name: "YG_PRICE", width: 120, type: "number", editor: {
                                    type: 'number', onChangeValue: function (input, value, g) {
                                        var editParm = g.options.editParm.record;
                                        editParm["YG_MONEY"] = (value * (editParm.COUNT || 0)).toFixed(2);
                                    }
                                }
                            },
                            {
                                display: "预估金额(元)", name: "YG_MONEY", width: 120, type: "number", totalSummary:
                                {
                                    type: 'sum',
                                    align: 'center'
                                }
                            },
                            { display: "预估库龄(月)", name: "STORE_MONTH", width: 120, type: "number", editor: { type: 'number' } },
                            {
                                display: "是否协议", name: "IS_XY", dbname: "IS_XY", width: 80, type: "text", align: "center", formatType: "chk", editor: { type: 'chkStr' }
                            },
                            {
                                display: "品牌无要求", name: "NO_PRODUCE", dbname: "NO_PRODUCE", width: 80, type: "text", align: "center", formatType: "chk", editor: { type: 'chkStr' }
                            },
                            { display: "说明", name: "MEMO", width: 120, type: "text", editor: { type: 'text' } },
                            { display: "物料ID", name: "SP_ID", dbname: "SP_ID", width: 100, type: "text", hide: true },
                            { display: "上次供应商ID", name: "LAST_PROVIDERID", dbname: "LAST_PROVIDERID", width: 100, type: "text", hide: true },
                            { display: "APPLY_ID", name: "APPLY_ID", dbname: "APPLY_ID", width: 100, type: "text", hide: true },
                            { display: "主键", name: "SPDET_ID", dbname: "SPDET_ID", width: 100, type: "text", hide: true },
                        ]
                    }
                };
            },
            grid: null,
            searchForm: null,
            buttons: null,
            loadComboxData: function () {
                var me = this;
            },
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    autoWidth: false,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    usePager: false,
                    toolbar: { group:"detail" },
                    url: me.rootPath + 'DetailList',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: 'CREATEDATE',
                    sortOrder: 'DESC',
                    width: '98%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: !me.isView,
                    clickToEdit: true,
                    onBeforeSubmitEdit: function (e) {
                        if (e.column.name == "COUNT" || e.column.name == "YG_PRICE" || e.column.name == "STORE_MONTH") {
                            if (e.value < 0) {
                                LG.showError("不可为负数！");
                                return false;
                            } 
                        }
                        return true;
                    }
                });
                me.grid.isValid = true;
                me.loadToolbar();
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "add":
                            me.add();
                            break;
                        case "delete":
                            me.delete();
                            break;
                        case "save":
                            me.save();
                            break;
                    }
                }
                if (!me.isView)
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            add: function () { //新增
                var me = this;
                var callback = function (list) {
                    var gridlist = me.grid.getData();
                    var flag = false;
                    for (var i in list) {
                        var flag = gridlist.some(t => t.SP_ID == list[i].SP_ID);
                        if (flag) {
                            LG.showError(list[i].SP_NAME + "[" + list[i].SP_CODE + "]" + "已存在,不能重复添加");
                            return
                        }
                        
                        me.grid.addEditRow({
                            "SP_ID": list[i].SP_ID,
                            "LAST_PROVIDERID": list[i].LAST_PROVIDERID,
                            "LAST_PROVIDER": list[i].LAST_PROVIDER,
                            "WARRANTY": list[i].WARRANTY,
                            "STORE_NUM": list[i].STORE_NUM,
                            "TYPE_ID": list[i].TYPE_ID,
                            "TYPE_NAME": list[i].TYPE_NAME,
                            "TYPE_CODE": list[i].TYPE_CODE,
                            "UNIT": list[i].UNIT,
                            "PRODUCE": list[i].PRODUCE,
                            "SP_SIZE": list[i].SP_SIZE,
                            "SP_NAME": list[i].SP_NAME,
                            "SP_CODE": list[i].SP_CODE,
                            "YG_PRICE": list[i].STORE_PRICE,
                            "PURTYPE_ID": list[i].PURTYPE_ID,
                            "PURTYPE_NAME": list[i].PURTYPE_NAME,
                            "APPLY_ID": me.Sid,
                            "IS_XY": "0",
                            "NO_PRODUCE": "0"
                        });
                    }
                };

                var selData = me.grid.getData();
                var dataValue = "";
                selData.forEach((a) => {
                    dataValue += a.SP_ID + ",";
                });
                $.ligerDialog.open({
                    width: 980,
                    height: 600,
                    allowClose: true,
                    title: "挑选物资编码",
                    url: "../Base/base_spcatalogPop.html?MenuNo=" + me.menuNo,
                    isHidden: false,
                    showMax: false,
                    showToggle: false,
                    showMin: false,
                    isResize: true,
                    slide: false,
                    data: {
                        isCancel:"0",
                        mainReloadBtn: me.buttons[0],
                        callback: callback,
                        dataValue: dataValue
                    }
                });

            },
            save: function () { //保存
                var me = this;
                if (me.grid.endEdit() != false) {
                    if (!me.grid.isDataChanged) {
                        LG.showSuccess('无修改');
                        return;
                    }
                    if (!me.grid.validChangeRows()) return false;

                    var dataRow = me.grid.getData();

                    var code = dataRow.map((a) => {
                        return a.SP_ID;
                    });
                    
                    if (new Set(code).size !== code.length) {
                        LG.showSuccess('物资编码不能重复');
                        return;
                    }
                   
                    var changeRow = me.grid.getChangedRows();
                    LG.ajax({
                        jsToken: true,
                        url: me.rootPath + 'DetailSave',
                        loading: '正在保存中...',
                        data: changeRow,
                        success: function () {
                            LG.showSuccess('保存成功');
                            me.grid.isDataChanged = false;
                            me.reload();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }

            },
            reload: function () { //刷新
                var me = this;
                me.buttons[0].click();
            },
            delete: function () { //删除
                var me = this;
                if (me.grid.endEdit() != false) {
                    var selected = me.grid.getSelectedRows();
                    if (selected.length > 0) {
                        $.ligerDialog.confirm('确定删除吗?', function (confirm) {
                            if (confirm) {
                                for (var i = 0, len = selected.length; i < len; i++) {
                                    me.grid.deleteRow(selected[i]);
                                }
                                me.save();
                            }
                        });
                    } else {
                        LG.tip('请选择行!');
                    }
                }
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch = $("#formsearch")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                        me.searchForm.setData({ "_search_APPLY_ID": me.Sid });
                    }
                });
            },
            init: function () {
                var me = this;

                me.dialog = frameElement.dialog;
                me.dialogData = me.dialog.get('data');
                me.Sid = me.dialogData.Sid;
                me.isView = me.dialogData.view === "1";
                
                me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.setGrid();
                me.reload();
                return me;
            }
        };
        business.init();
    </script>
</body>
</html>
