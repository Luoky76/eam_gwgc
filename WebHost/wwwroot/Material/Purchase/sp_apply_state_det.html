<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title>采购进度</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding-left: 25px; height: 100%;">
    
    <form action="" id="mainform" class="liger-form" style="padding-bottom:40px">
        <div id="maingrid">
        </div>
    </form>
    <script type="text/javascript">
        'use strict';


        var business = {
            type: getQueryStringByName("type"),
            spId: getQueryStringByName("spId"),

            dialog : null,
            dialogData : null,

            form: null,
            formDate: null,
            buttons: null,
            statusData: [],
            setConfig: function () {
                var me = this;
                me.config = {
                    form: {
                        fields: [
                            { display: "主键", name: "SPDET_ID", readonly: "readonly" },

                            { display: "采购状态", name: "SP_STATUS", labelWidth: 100, width: 180, newline: true, type: "select", options: { data: me.statusData }, readonly: "readonly" },
                            { display: "物料编码", name: "SP_CODE", labelWidth: 100, width: 180, type: "text", readonly: "readonly", },

                            { display: "物料名称", name: "SP_NAME", labelWidth: 100, width: 340, newline: true, type: "text", readonly: "readonly" },
                            { display: "型号规格", name: "SP_SIZE", labelWidth: 100, width: 180, newline: true, type: "text", readonly: "readonly" },
                            { display: "品牌、厂家", name: "PRODUCE", labelWidth: 100, width: 180, type: "text", readonly: "readonly", },
                            { display: "计量单位", name: "UNIT", labelWidth: 100, width: 180, newline: true, type: "text", readonly: "readonly" },
                            { display: "物料分类", name: "TYPE_NAME", labelWidth: 100, width: 180, type: "text", readonly: "readonly", },

                            { display: "申请单号", name: "APPLY_NO", labelWidth: 100, width: 180, newline: true, type: "text", readonly: "readonly" },
                            { display: "请购单号", name: "COLLECT_CODE", labelWidth: 100, width: 180, type: "text", readonly: "readonly", },
                            { display: "询价单号", name: "PLAN_NO", labelWidth: 100, width: 180, newline: true, type: "text", readonly: "readonly" },
                            { display: "订单编号", name: "ORDER_CODE", labelWidth: 100, width: 180, type: "text", readonly: "readonly", },

                            { display: "申请人", name: "APPLY_USER", labelWidth: 100, width: 180, newline: true, type: "text", readonly: "readonly" },
                            { display: "申请数量", name: "APPLY_COUNT", labelWidth: 100, width: 180, type: "text", readonly: "readonly", },

                            { display: "供应商", name: "PROVIDER_NAME", labelWidth: 100, width: 340, newline: true, type: "text", readonly: "readonly" },
                            { display: "申购公司", name: "DEPT_NAME", labelWidth: 100, width: 340, newline: true, type: "text", readonly: "readonly", },

                            { display: "询价下达人", name: "XJDOWN_USER", labelWidth: 100, width: 180, newline: true, type: "text", readonly: "readonly" },
                            { display: "采购员", name: "BUY_USER", labelWidth: 100, width: 180, type: "text", readonly: "readonly", },

                            { display: "供应周期(天)", name: "PERIOD", labelWidth: 100, width: 180, newline: true, type: "text", readonly: "readonly" },
                            { display: "审核数量", name: "COUNT", labelWidth: 100, width: 180, type: "text", readonly: "readonly", },

                            { display: "入库数量", name: "INSTORE_COUNT", labelWidth: 100, width: 180, newline: true, type: "text", readonly: "readonly" },
                            { display: "中止数量", name: "STOP_NUM", labelWidth: 100, width: 180, type: "text", readonly: "readonly", },

                            { display: "预估单价(元)", name: "YG_PRICE", labelWidth: 100, width: 180, newline: true, type: "text", readonly: "readonly" },
                            { display: "成交单价(元)", name: "PRICE", labelWidth: 100, width: 180, type: "text", readonly: "readonly", },
                          
                            { display: "申请时间", name: "APPLY_DATE", labelWidth: 100, width: 180, newline: true, type: "text", readonly: "readonly" },
                            { display: "请购时间", name: "COLLECT_DATE", labelWidth: 100, width: 180, type: "text", readonly: "readonly", },
                            { display: "询价时间", name: "PLAN_DATE", labelWidth: 100, width: 180, newline: true, type: "text", readonly: "readonly" },
                            { display: "下单时间", name: "ORDER_DATE", labelWidth: 100, width: 180, type: "text", readonly: "readonly", },

                            { display: "终止时间", name: "STOP_DATE", labelWidth: 100, width: 180, newline: true, type: "text", readonly: "readonly" },
                            { display: "终止原因", name: "T_MEMO", labelWidth: 100, width: 490, newline: true, type: "text", readonly: "readonly" },
                        ]
                    },
                };

            },

            //设置表单
            setForm: function () {
                var me = this;
                var columns = me.config.form.fields;
                for (var i = columns.length - 1; i >= 0; i--) {
                    if (!columns[i]) columns.splice(i, 1);
                }
                var form = $("#mainform")
                //表单应用ligerui样式
                me.form = form.ligerForm({
                    labelWidth: 110, space: 30,
                    labelAlign: 'left' ,
                    fields: me.config.form ? me.config.form.fields : [],
                    validate: true,
                });
                me.setFormButtons();
                me.form.setVisible(["SPDET_ID"], false);
            },

            setFormButtons: function () {
                var me = this;
                //表单底部按钮
                var buttons = [];
                buttons.push({ text: '关闭', onclick: function () { me.dialog.close(); } });
                LG.addFormButtons(buttons);
                me.formButtons = buttons;
            },
            setData: function () {
                var me = this;
                LG.ajax({
                    jsToken: true,
                    url: 'Material/SpApply/ApplyDetFlow',
                    loading: '加载数据中...',
                    data: { "SPDET_ID": me.spId },
                    success: function (res) {
                        me.formDate = res;
                        me.form.setData(res);
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url:'Material/SpApply/ApplyComboxData',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        me.statusData = data.StatusData;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            init: function () {
                var me = this;

                me.loadComboxData();

                me.dialog = frameElement.dialog;
                me.dialogData = me.dialog.get('data');

                me.setConfig();
                me.setForm();
                me.setData();
                return me;
            }
        };
        business.init();
    </script>
</body>
</html>
