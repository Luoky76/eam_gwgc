<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title></title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <div id="mainsearch" style="width: 98%">
        <form action="" id="formsearch" class="l-form">
        </form>
    </div>
    <form action="" id="mainform">
        <div id="maingrid">
        </div>
    </form>
    <script type="text/javascript">
        'use strict';
        var business = {
            rootPath:'Material/SpApply/',
            MenuNo: getQueryStringByName("MenuNo"),
            typeData: [],
            exigData: [],
            cgfsData: [],
            dataCheck: [{ "ID": "0", "TEXT": "未提交" }, { "ID": "1", "TEXT": "已提交" }],
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            { display: "记录状态", name: "_search_AUDITING", dbname: "AUDITING", newline: false, upper: true, type: "text", hide: true },
                            { display: "记录状态", name: "_search_AUDITING_CHECK", dbname: "AUDITING_CHECK", newline: false, upper: true, type: "select", options: { data: me.dataCheck } },
                            { display: "申请单号", name: "_search_APPLY_NO", dbname: "APPLY_NO", newline: false, upper: true, type: "text", options: {} },
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "已提交", name: "AUDITING_CHECK", width: 100, type: "chk" },
                            { display: "申请单号", name: "APPLY_NO", width: 180, type: "text" },
                            {
                                display: "采购分类", name: "TYPE_ID", minWidth: 150, type: "select", validate: { required: true },
                                editor: {
                                    type: 'select',
                                    data: me.typeData,
                                    onChange: function (rowdata, rowIndex) {
                                        if (rowdata.value) {
                                            for (var i = 0; i < me.typeData.length; i++) {
                                                if (rowdata.value == me.typeData[i].ID) {
                                                    liger.get("maingrid").updateCell("TYPE_NAME", me.typeData[i].TEXT, rowdata.record);
                                                    liger.get("maingrid").updateCell("TYPE_CODE", me.typeData[i].VALUE, rowdata.record);
                                                    break;
                                                }
                                            }
                                        } else {
                                            liger.get("maingrid").updateCell("TYPE_NAME", "", rowdata.record);
                                            liger.get("maingrid").updateCell("TYPE_CODE", "", rowdata.record);
                                        }
                                    },
                                }
                            },
                            {
                                display: "采购方式", name: "TYPE_ID2", minWidth: 150, type: "select", validate: { required: true },
                                editor: {
                                    type: 'select',
                                    data: me.cgfsData,
                                    onChange: function (rowdata, rowIndex) {
                                        if (rowdata.value) {
                                            for (var i = 0; i < me.cgfsData.length; i++) {
                                                if (rowdata.value == me.cgfsData[i].ID) {
                                                    liger.get("maingrid").updateCell("CGFS", me.cgfsData[i].TEXT, rowdata.record);
                                                    break;
                                                }
                                            }
                                        } else {
                                            liger.get("maingrid").updateCell("CGFS", "", rowdata.record);
                                        }
                                    },
                                }
                            },
                            { display: "紧急程度", name: "EXIG_DEV", width: 120, type: "select", editor: { type: 'select', data: me.exigData }, validate: { required: true }, },
                            { display: "用途", name: "USE_MEMO", width: 150, type: "text", editor: { type: 'text' }, validate: { required: true }, },

                            { display: "申请人", name: "APPLY_USER", width: 100, type: "text", },
                            { display: "申请部门", name: "DEPT_NAME", width: 150, type: "text", },
                            { display: "二级单位", name: "SEC_DEPT", width: 150, type: "text", },
                            { display: "申请日期", name: "APPLY_DATE", width: 150, type: "date", format: "yyyy-MM-dd", },
                            { display: "备注", name: "MEMO", width: 120, type: "text", editor: { type: 'text' }, },
                            { display: "采购方式名", name: "CGFS", width: 100, type: "text", hide: true },
                            { display: "采购分类名", name: "TYPE_NAME", width: 100, type: "text", hide: true },
                            { display: "采购分类编码", name: "TYPE_CODE", width: 100, type: "text", hide: true },
                            { display: "主键", name: "APPLY_ID", dbname: "APPLY_ID", width: 100, type: "text", hide: true },
                        ]
                    }
                };
            },
            grid: null,
            searchForm: null,
            buttons: null,
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: me.rootPath+ 'ComboxData',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        me.typeData = data.BasePurtype
                        me.exigData = data.BCCode;
                        me.cgfsData = data.CGFS;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    autoWidth: false,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    usePager: false,
                    toolbar: { group: 'list'},
                    url: me.rootPath + 'List',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: '',
                    sortOrder: '',
                    width: '98%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: true,
                    clickToEdit: true,
                    onBeforeEdit: function (editParm) {
                        if (editParm.record.__status == "nochanged") {
                            if (editParm.record.AUDITING_CHECK == "1") return false;
                            else return true;
                        }
                        switch (editParm.column.name) {
                            case "":
                                if (editParm.record.__status == "add") return true;
                                else return false;
                                break;
                        }
                    },
                    onSuccess: function (data, g) {
                        if (data && data.Rows) {
                            var rows = data.Rows || [];
                            for (var i = 0, len = rows.length; i < len; i++) {
                                var row = rows[i];
                                row.OLDROLEID = row.ROLEID;
                            }
                        }
                    },
                    rowAttrRender: function (rowdata, rowid) {
                        return "";
                    }
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "save":
                            me.save();
                            break;
                        case "submit":
                            me.submit();
                            break;
                        case "cancelSubmit":
                            me.cancelSubmit();
                            break;
                        case "detail":
                            me.detail();
                            break;
                        case "Excel":
                            $.ligerDialog.open({
                                url: "../System/Export.html?exporttype=xls",
                                modal: true
                            });
                            break;
                        case "Word":
                            $.ligerDialog.open({
                                url: "../System/Export.html?exporttype=doc",
                                modal: true
                            });
                            break;
                    }
                }
            
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            save: function () { //保存
                var me = this;
                if (me.grid.endEdit() != false) {
                    if (!me.grid.isDataChanged) {
                        LG.showSuccess('无修改');
                        return;
                    }
                    if (!me.grid.validChangeRows()) return false;
                    var changeRow = me.grid.getChangedRows();
                    LG.ajax({
                        jsToken: true,
                        url: me.rootPath + 'Save',
                        loading: '正在保存中...',
                        data: { request: changeRow, requestdet: null },
                        success: function (message, data) {
                            me.grid.isDataChanged = false;
                            me.reload();
                            LG.showSuccess('保存成功');
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }

            },
            reload: function () { //刷新
                var me = this;
                me.buttons[0].click();
            },
            detail: function () { //明细
                var me = this;
                if (me.grid.getSelectedRows().length != 1) {
                    LG.showError("请选择一条记录");
                    return
                }

                var apply = me.grid.getSelectedRows()[0];
                if (apply.APPLY_ID == null) {
                    LG.showError("请先保存再打开明细");
                    return
                }

                $.ligerDialog.open({
                    width: 1200,
                    height: 750,
                    allowClose: true,
                    title: '[修改采购明细]',
                    url: "sp_apply_detail.html?MenuNo=" + me.MenuNo + "&ver=" + me.ver,
                    isHidden: false,
                    showMax: false,
                    showToggle: false,
                    showMin: false,
                    isResize: true,
                    slide: false,
                    onClosed: me.reload.bind(me),
                    data: { "Sid": apply.APPLY_ID, "view": apply.AUDITING_CHECK }
                });
            },
            submit: function () {    //提交
                var me = this;
                var selected = me.grid.getSelectedRows();
                if (selected.length > 0) {
                    
                    if (selected[0].AUDITING_CHECK != null && selected[0].AUDITING_CHECK != "0" ) {
                        LG.tip('已提交，无法再次提交!');
                    }
                    else {
                        var flag = true;
                        var sids = [];
                        selected.forEach((a) => {
                            if (a.AUDITING_CHECK != null && a.AUDITING_CHECK != "0") {
                                LG.tip(a.APPLY_NO + '已提交，无法再次提交!');
                                flag = false;
                                return;
                            }

                            if (a.DETAILCOUNT == 0) {
                                LG.tip(a.APPLY_NO + '未填写明细，无法提交!');
                                flag = false;
                                return;
                            }
                            sids.push(a.APPLY_ID)
                        })
                        if (!flag) {
                            return;
                        }

                        LG.ajax({
                            jsToken: true,
                            url: me.rootPath + 'CheckSubmit',
                            loading: '正在保存中...',
                            data: { "sids": sids },
                            success: function () {
                                LG.showSuccess('提交成功');
                                me.grid.isDataChanged = false;
                                me.reload();
                            },
                            error: function (message) {
                                LG.showError(message);
                            }
                        });
                    }

                }
                else {
                    LG.tip('请选择行!');
                }
            },
            cancelSubmit: function () {    //撤销
                var me = this;
                var selected = me.grid.getSelectedRows();
                if (selected.length > 0) {
                    var flag = true;
                    var sids = [];
                    selected.forEach((a) => {
                        if (a.AUDITING_CHECK != "1") {
                            LG.tip(a.APPLY_NO + '未提交!');
                            flag = false;
                            return;
                        }
                        sids.push(a.APPLY_ID)
                    })
                    if (!flag) {
                        return;
                    }

                    LG.ajax({
                        jsToken: true,
                        url: me.rootPath + 'CheckCancelSubmit',
                        loading: '正在撤销中...',
                        data: { "sids": sids },
                        success: function () {
                            LG.showSuccess('撤销成功');
                            me.grid.isDataChanged = false;
                            me.reload();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }
                else {
                    LG.tip('请选择行!');
                }
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Word',
                        text: '导出Word',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-word-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch = $("#formsearch")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                        liger.get('_search_AUDITING').setValue("1");
                    }
                });
                me.searchForm.setVisible(["_search_AUDITING"], false);
            },
            init: function () {
                var me = this;
                me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.setGrid();
                me.reload();
                return me;
            }
        };
        business.init();
    </script>
</body>
</html>
