<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title></title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <div id="mainsearch" style="width: 98%">
        <form action="" id="formsearch" class="l-form">
        </form>
    </div>

    <form action="" id="mainform">
        <div style="float: left; width: 100%; height: 98%; ">
            <div id="maingrid" position="center" title="物资请购-物资清单">
            </div>
        </div>
    </form>

    <script type="text/javascript">
        'use strict';
        var business = {
            rootPath: 'Material/SpCollect/',
            MenuNo: getQueryStringByName("MenuNo"),
            dialog: null,
            dialogData: null,
            Cid: null,
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            { display: "关联外键", name: "_search_COLLECT_ID", dbname: "COLLECT_ID", newline: false, type: "hidden" },
                        ]
                    },
                    grid: {
                        columns: [
                            {
                                display: "需求计划单号", name: "REQUEST_CODE", width: 150, type: "text",
                                totalSummary:
                                {
                                    render: function (suminf, column, cell) {
                                        return '<div>合计</div>';
                                    },
                                    align: 'center'
                                }
                            },
                            {
                                display: "预计采购数量", name: "CHECK_NUM", type: "number", width: 120, editor: { type: 'number' },
                                validate: { required: true }, totalSummary:
                                {
                                    type: 'sum',
                                    align: 'center'
                                }
                            },
                            { display: "申请数量", name: "REQUEST_NUM", width: 150, type: "decimal", },
                            { display: "计量单位", name: "UNIT", width: 150, type: "text", },
                            { display: "申请人", name: "REQUEST_USER", width: 150, type: "text", },
                            { display: "申请部门", name: "DEPT_NAME", width: 150, type: "text", },
                            { display: "二级单位", name: "SEC_DEPT", width: 150, type: "text", },
                            { display: "物料编码", name: "SP_CODE", width: 150, type: "text", },
                            { display: "物料名称", name: "SP_NAME", width: 150, type: "text", },
                            { display: "型号规格", name: "SP_SIZE", width: 150, type: "text", },
                            { display: "品牌、厂家", name: "PRODUCE", width: 150, type: "text", },
                            { display: "物料分类", name: "TYPE_NAME", width: 150, type: "text", },
                          
                            {
                                display: "预估金额(元)", name: "COLLECT_MONEY", width: 120, type: "number", editor: { type: 'number' }, totalSummary:
                                {
                                    type: 'sum',
                                    align: 'center'
                                }
                            },
                            { display: "说明", name: "MEMO", width: 120, type: "text", editor: { type: 'text' } },
                            { display: "物料ID", name: "SP_ID", dbname: "SP_ID", width: 100, type: "text", hide: true },
                            { display: "COLLECT_ID", name: "COLLECT_ID", dbname: "COLLECT_ID", width: 100, type: "text", hide: true },
                            { display: "COLLECT_DET_ID", name: "COLLECT_DET_ID", dbname: "COLLECT_DET_ID", width: 100, type: "text", hide: true },
                            { display: "主键", name: "COLLECT_REQUEST_ID", dbname: "COLLECT_REQUEST_ID", width: 100, type: "text", hide: true },
                        ]
                    }
                };
            },
            grid: null,
            searchForm: null,
            buttons: null,
            loadComboxData: function () {
                var me = this;
            },
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    autoWidth: false,
                    delayLoad: true,
                    title: "物资请购-物资清单",
                    columns: me.config.grid.columns,
                    usePager: false,
                    toolbar: { group: "detail" },
                    url: me.rootPath + 'RequestList',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: 'CREATEDATE',
                    sortOrder: 'DESC',
                    width: '98%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: !me.isView,
                    clickToEdit: true,
                    onBeforeSubmitEdit: function (e) {
                        if (e.column.name == "CHECK_NUM" || e.column.name == "COLLECT_MONEY") {
                            if (e.value < 0) {
                                LG.showError("不可为负数！");
                                return false;
                            }
                        }
                        return true;
                    }
                });
                me.grid.isValid = true;
                me.loadToolbar();
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "add":
                            me.add();
                            break;
                        case "delete":
                            me.delete();
                            break;
                        case "save":
                            me.save();
                            break;
                    }
                }
                if (!me.isView)
                    LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            add: function () { //新增
                var me = this;
                var callback = function (list) {
                    var gridlist = me.grid.getData();
                    var flag = false;
                    var SpdetID = [];
                    for (var i in list) {
                        var flag = gridlist.some(t => t.SPDET_ID == list[i].SPDET_ID);
                        if (flag) {
                            LG.showError(list[i].SP_NAME + "[" + list[i].APPLY_NO + "]" + "已存在,不能重复添加");
                            SpdetID = [];
                            return
                        }
                        SpdetID.push(list[i].SPDET_ID);
                    }

                    if (SpdetID.length > 0) {
                        LG.ajax({
                            jsToken: true,
                            url: me.rootPath + 'SelectApply',
                            loading: '正在保存中...',
                            data: { SpdetID: SpdetID, Cid: me.Cid },
                            success: function () {
                                LG.showSuccess('保存成功');
                                me.grid.isDataChanged = false;
                                me.reload();
                            },
                            error: function (message) {
                                LG.showError(message);
                            }
                        });
                    }
                };

                $.ligerDialog.open({
                    width: 980,
                    height: 600,
                    allowClose: true,
                    title: "挑选物资",
                    url: "applyDetailPop.html?MenuNo=" + me.menuNo,
                    isHidden: false,
                    showMax: false,
                    showToggle: false,
                    showMin: false,
                    isResize: true,
                    slide: false,
                    data: {
                        mainReloadBtn: me.buttons[0],
                        callback: callback
                    }
                });

            },
            save: function () { //保存
                var me = this;
                if (me.grid.endEdit() != false) {
                    if (!me.grid.isDataChanged) {
                        LG.showSuccess('无修改');
                        return;
                    }
                    if (!me.grid.validChangeRows()) return false;

                    var changeRow = me.grid.getChangedRows();
                    LG.ajax({
                        jsToken: true,
                        url: me.rootPath + 'RequestSave',
                        loading: '正在保存中...',
                        data: changeRow,
                        success: function () {
                            LG.showSuccess('保存成功');
                            me.grid.isDataChanged = false;
                            me.grid.loadData();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }

            },
            reload: function () { //刷新
                var me = this;
                me.buttons[0].click();
            },
            delete: function () { //删除
                var me = this;
                if (me.grid.endEdit() != false) {
                    var selected = me.grid.getSelectedRows();
                    if (selected.length > 0) {
                        $.ligerDialog.confirm('确定删除吗?', function (confirm) {
                            if (confirm) {
                                for (var i = 0, len = selected.length; i < len; i++) {
                                    me.grid.deleteRow(selected[i]);
                                }
                                me.save();
                            }
                        });
                    } else {
                        LG.tip('请选择行!');
                    }
                }
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch = $("#formsearch")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                        me.searchForm.setData({ "_search_COLLECT_ID": me.Cid });
                    }
                });
            },
            init: function () {
                var me = this;

                me.dialog = frameElement.dialog;
                me.dialogData = me.dialog.get('data');
                me.Cid = me.dialogData.Cid;
                me.isView = me.dialogData.view === "1";

                me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.setGrid();
                me.reload();
                return me;
            }
        };
        business.init();
    </script>
</body>
</html>
