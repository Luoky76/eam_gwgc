<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title></title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <div id="mainsearch" style="width: 98%">
        <form action="" id="formsearch" class="l-form">
        </form>
    </div>
    <div style="margin-bottom: 5px; width: 98%;" id="paramform">
    </div>
    <form action="" id="mainform">
        <div style="float: left; width: 100%; height: 98%; ">
            <div id="maingrid" position="center" title="物资请购-物资清单">
            </div>
        </div>
    </form>

    <script type="text/javascript">
        'use strict';
        var business = {
            rootPath: 'Material/SpCollect/',
            MenuNo: getQueryStringByName("MenuNo"),
            dialog: null,
            dialogData: null,
            sid: getQueryStringByName("sid"),
            orginData: {},
            //明细页面大小
            detailWidth: window.innerWidth * 0.9,
            detailHeight: window.innerHeight * 0.9,
            setConfig: function () {
                var me = this;
                me.config = {
                    form: {
                        labelwidth: 200,
                        fields: [
                            //基础信息
                            { display: "申请单号", name: "COLLECT_CODE", newline: false, upper: true, type: "text", options: { disabled: true } },
                            { display: "申请日期", name: "COLLECT_DATE", validate: { required: true }, newline: false, upper: true, type: "date", format: "yyyy-MM-dd", options: { type: 'date', disabled: true, format: "yyyy-MM-dd" } },

                            { display: "采购部门", name: "DEPT_NAME", validate: { required: true }, newline: false, upper: true, type: "text", options: { type: 'text', disabled: true } },
                            { display: "采购人", name: "COLLECT_USER", validate: { required: true }, newline: false, upper: true, type: "text", options: { type: 'text', disabled: true } },
                            { display: "二级单位", name: "SEC_DEPT", newline: false, upper: true, type: "text", options: { disabled: true } },
                            { display: "备注", name: "MEMO", newline: true, validate: { required: true }, upper: true, width: 786, type: "textarea", options: {} },

                            //隐藏
                            { display: "主键", name: "COLLECT_ID", newline: false, upper: true, type: "hidden", options: {} },
                            { display: "AUDITING", name: "AUDITING", newline: false, upper: true, type: "hidden", options: {} },
                        ]

                    },
                    grid: {
                        columns: [
                            { display: "物料编码", name: "SP_CODE", width: 150, type: "text", },
                            { display: "物料名称", name: "SP_NAME", width: 150, type: "text", },
                            { display: "型号规格", name: "SP_SIZE", width: 150, type: "text", },
                            { display: "品牌、厂家", name: "PRODUCE", width: 150, type: "text", },
                            { display: "申请数量", name: "REQUEST_NUM", width: 150, type: "decimal", },
                            { display: "计量单位", name: "UNIT", width: 150, type: "text", },
                            { display: "物料分类", name: "TYPE_NAME", width: 150, type: "text", },
                            { display: "申请人", name: "REQUEST_USER", width: 150, type: "text", },
                            { display: "申请部门", name: "DEPT_NAME", width: 150, type: "text", },
                            {
                                display: "申请单号", name: "REQUEST_CODE", width: 150, type: "text",
                                totalSummary:
                                {
                                    render: function (suminf, column, cell) {
                                        return '<div>合计</div>';
                                    },
                                    align: 'center'
                                }
                            },
                            { display: "申请日期", name: "REQUEST_DATE", width: 150, type: "date", },
                            { display: "物料ID", name: "SP_ID", dbname: "SP_ID", width: 100, type: "text", hide: true },
                            { display: "COLLECT_ID", name: "COLLECT_ID", dbname: "COLLECT_ID", width: 100, type: "text", hide: true },
                            { display: "REQUEST_DET_ID", name: "REQUEST_DET_ID", dbname: "REQUEST_DET_ID", width: 100, type: "text", hide: true },
                            { display: "主键", name: "COLLECT_REQUEST_ID", dbname: "COLLECT_REQUEST_ID", width: 100, type: "text", hide: true },
                        ]
                    }
                };
            },
            grid: null,
            mainform: null,
            formButtons: null,
            loadData: function () {
                var me = this;
                function inner() {
                    var data = me.mainform.getData();
                    LG.getFormCombChanges(data, me.orginData, true);
                    delete me.orginData;
                    me.orginData = data;
                }
                if (!me.sid) {
                    me.mainform.setData({ AUDITING: "0", COLLECT_USER: window.session.RealName });
                    inner();
                }
                else {
                    LG.ajax({
                        async: false,
                        url: 'Material/SpCollect/GetCollectDetail',
                        loading: '正在获取中...',
                        data: { id: me.sid },
                        success: function (data, message) {
                            me.mainform.setOrginData(data);
                            inner();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                    if (me.isView) {
                        me.mainform.setReadonly(true);
                    }
                }
                var input = me.mainform.getEditor(me.config.form.fields[0].name).inputText;
                input.focus();
                input.select();
            },
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    autoWidth: false,
                    delayLoad: true,
                    title: "物资请购-物资清单",
                    columns: me.config.grid.columns,
                    usePager: false,
                    toolbar: { group: "detail" },
                    url: me.rootPath + 'RequestList',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: [{ field: 'COLLECT_ID', op: 'equal', value: $('#COLLECT_ID').val() }]
                        })
                    },
                    sortName: 'CREATEDATE',
                    sortOrder: 'DESC',
                    width: '98%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: !me.isView,
                    clickToEdit: true,
                    onBeforeSubmitEdit: function (e) {
                        if (e.column.name == "CHECK_NUM" || e.column.name == "COLLECT_MONEY") {
                            if (e.value < 0) {
                                LG.showError("不可为负数！");
                                return false;
                            }
                        }
                        return true;
                    }
                });
                me.grid.isValid = true;
                me.loadToolbar();
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "reload":
                            me.reloadDet();
                            break;
                        case "add":
                            me.add();
                            break;
                        case "delete":
                            me.delete();
                            break;
                        case "save":
                            me.save();
                            break;
                    }
                }
                if (!me.isView)
                    LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            //刷新
            reloadDet: function () {
                var me = this;
                me.grid.loadData();
            },
            //新增
            addGrid: function (row = {}) {
                var me = this;
                $.extend(row, {
                    COLLECT_ID: me.sid
                });
                me.grid.addEditRow(row, true);
            },
            add: function () { //新增
                var me = this;
                var callback = function (key_ids, list) {
                    debugger
                    var gridlist = me.grid.getData();
                    var flag = false;
                    for (let item of list) {
                        var flag = gridlist.some(t => t.SPDET_ID == item.SPDET_ID);
                        if (flag) {
                            LG.showError(item.SP_NAME + "[" + item.APPLY_NO + "]" + "已存在,不能重复添加");
                            return
                        }
                        me.addGrid({
                            REQUEST_DET_ID: item.SPDET_ID,
                            REQUEST_CODE: item.APPLY_NO,
                            REQUEST_DATE: item.APPLY_DATE,
                            REQUEST_NUM: item.COUNT,
                            REQUEST_USER: item.APPLY_USER,
                            DEPT_NAME: item.DEPT_NAME,
                            SP_CODE: item.SP_CODE,
                            SP_NAME: item.SP_NAME,
                            SP_SIZE: item.SP_SIZE,
                            PRODUCE: item.PRODUCE,
                            TYPE_ID: item.TYPE_ID,
                            TYPE_NAME: item.TYPE_NAME,
                            TYPE_CODE: item.TYPE_CODE,
                            CHECK_NUM: "1",
                            UNIT: item.UNIT,
                            SP_ID: item.SP_ID,
                        });
                    }
                    me.save();
                };
                var dataOptions = {
                    values: [],
                    options: {
                        url: 'Material/SpCollect/SpApplyList',
                        parms: { requestId: me.sid },
                        rowKey: "SP_ID",
                        columns: [
                            { display: '采购申请单号', name: "APPLY_NO", width: 80, type: "text", align: "left" },
                            { display: "申请日期", name: "APPLY_DATE", width: 150, type: "date", format: "yyyy-MM-dd", },
                            { display: '物料编码', name: "SP_CODE", width: 80, type: "text", align: "left" },
                            { display: '物料名称', name: "SP_NAME", width: 80, type: "text", align: "left" },
                            { display: '型号规格', name: "SP_SIZE", width: 80, type: "text", align: "left" },
                            { display: '品牌、厂家', name: "PRODUCE", width: 80, type: "text", align: "left" },
                            { display: '数量', name: "COUNT", width: 80, type: "float", align: "left" },
                            { display: '计量单位', name: "UNIT", width: 80, type: "text", align: "left" },
                            { display: '物料分类', name: "TYPE_NAME", width: 80, type: "text", align: "left" },
                        ]
                    },
                    fields: [
                        {
                            display: "通用搜索",
                            name: "_search_all",
                            hideLabel: true,
                            filter: [
                                { op: "like", field: "APPLY_NO", type: "string" },
                                { op: "like", field: "SP_CODE", type: "string" },
                                { op: "like", field: "SP_NAME", type: "string" },
                                { op: "like", field: "SP_SIZE", type: "string" },
                                { op: "like", field: "PRODUCE", type: "string" },
                                { op: "like", field: "UNIT", type: "string" },
                                { op: "like", field: "TYPE_NAME", type: "string" }
                            ],
                        }
                    ],
                    callback: callback
                }
                $.ligerDialog.open({
                    width: me.detailWidth,
                    height: me.detailHeight,
                    title: '挑选物资',
                    url: window.gksybConfigs.urlBase + "popup-select/common.html",
                    isResize: true,
                    slide: false,
                    data: dataOptions
                });
            },
            save: function () { //保存
                var me = this;

                debugger

                var formEdit = false, gridEdit = false;
                if ($.isEmptyObject(me.mainform.getChanges())) {
                    formEdit = false;
                }
                else formEdit = true;
                if (!me.mainform.valid()) {
                    me.mainform.showInvalid();
                    return;
                }
                if (me.grid.endEdit() != false) {
                    if (!me.grid.isDataChanged) {
                        gridEdit = false;
                    }
                    else gridEdit = true;
                }
                if (!me.grid.validChangeRows()) return false;
                function handle(data) {
                    return data;
                }

                if (formEdit || gridEdit) {
                    var data = handle(me.mainform.getData());
                    var original = handle(me.mainform.getOrginData());
                    var changeRow = new Object();
                    if (!me.sid) {
                        changeRow["added"] = [data];
                    }
                    else {
                        changeRow["updated"] = [data];
                        changeRow["original"] = [original];
                    }
                    var changeRowDet = me.grid.getChangedRows();
                    var isSave = true
                    for (var i = 0; i < changeRowDet.updated.length; i++) {
                        if (changeRowDet.updated[i].APPLY_NUM < 0) {
                            LG.showSuccess('采购数量不可小于0！')
                            isSave = false;
                        }
                    }
                    if (isSave) {
                        LG.ajax({
                            jsToken: true,
                            url: me.rootPath + 'Save',
                            loading: '正在保存中...',
                            data: { request: changeRow, requestdet: changeRowDet },
                            success: function () {
                                LG.showSuccess('保存成功', function () {
                                    if (me.dialog && !me.sid) me.dialog.close();
                                    else {
                                        me.loadData();
                                        me.reloadDet();
                                    }
                                });
                            },
                            error: function (message) {
                                LG.showError(message);
                            }
                        });
                    }
                }
                else { LG.showSuccess('无修改'); }
            },
            delete: function () { //删除
                var me = this;
                if (me.grid.endEdit() != false) {
                    var selected = me.grid.getSelectedRows();
                    if (selected.length > 0) {
                        $.ligerDialog.confirm('确定删除吗?', function (confirm) {
                            if (confirm) {
                                for (var i = 0, len = selected.length; i < len; i++) {
                                    me.grid.deleteRow(selected[i]);
                                }
                                me.save();
                            }
                        });
                    } else {
                        LG.tip('请选择行!');
                    }
                }
            },
            close: function () {
                var me = this;
                function inner(callback) {
                    var data = me.mainform.getData();
                    var updateFields = LG.getFormCombChanges(data, me.orginData, true);
                    var isChangedGrid = me.grid.getChangedRows();
                    if (updateFields || isChangedGrid.updated.length > 0 || isChangedGrid.added.length > 0) {
                        $.ligerDialog.confirm($.ligerDefaults.GridString.isContinueByDataChanged, function (confirm) {
                            if (confirm) {
                                if (callback) callback(2);
                            }
                            else {
                                if (callback) callback(0);
                            }
                        });
                        if (callback) return callback(-1);
                        return false;
                    }
                    if (callback) return callback(1);
                    return true;
                }
                inner(function (status) {
                    if (status > 0) {
                        if (me.dialog) me.dialog.close();
                        if (me.callback) me.callback(false);
                    }
                });
            },
            setFormDefaultBtn: function (cancleCallback, savedCallback) {
                var me = this;
                //表单底部按钮
                var buttons = [];
                buttons.push({ text: '关闭', icon: 'fa fa-window-close', onclick: me.close.bind(me) });
                if (!me.isView) buttons.push({ text: '保存', icon: 'fa fa-save', onclick: me.save.bind(me) });

                LG.addFormButtons(buttons);
                me.formButtons = buttons;
            },
            setForm: function () {
                var me = this;
                me.config.form.fields.removeNull();
                var $formsearch = $("#formsearch")
                //搜索表单应用ligerui样式
                me.mainform = $formsearch.ligerForm({
                    fields: me.config.form ? me.config.form.fields : [],
                    validate: true,
                    EnterMoveNextControl: true,
                    labelAlign: 'right',
                    space: 3,
                    validate: true,
                    labelWidth: 120,
                    onAfterSetFields: function (g) {
                        me.mainform = g;
                    }
                });
                me.setFormDefaultBtn();
            },
            init: function () {
                var me = this;

                me.dialog = frameElement.dialog;
                me.dialogData = me.dialog.get('data');
                if (me.dialogData.sid) me.sid = me.dialogData.sid;
                me.isView = Boolean(me.dialogData.view);

                me.setConfig();
                me.setForm();
             
                me.loadData();
                me.setGrid();
                me.reloadDet();
                return me;
            }
        };
        business.init();
    </script>
</body>
</html>
