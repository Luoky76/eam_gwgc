<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title>库存明细</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 2px; height: 100%;">
    <div id="layout">
        <div position="left" title="仓库货位" id="mainmenu">
            <ul id="maintree" style="margin-top:5px;"></ul>
        </div>
        <div position="center" title="库存明细列表">
            <div id="mainsearch">
                <form action="" id="formsearch" class="l-form">
                </form>
            </div>
            <form id="mainform">
                <div id="maingrid" style="margin: 2px;"></div>
            </form>
        </div>
    </div>
    <!-- 库存初始化弹框 -->
    <div id="view-panel" style="display:none;">
        <form action="" id="view-form" class="l-form"></form>
    </div>
    <script type="text/javascript">
        'use strict';
        var business = {
            menuNo: getQueryStringByName("MenuNo"),
            ver: getQueryStringByName("ver"),
            tree: null,
            currentNode: null,
            providerName: [],
            storeSou:[],
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            { display: "物料编码", name: "_search_SP_CODE", dbname: "SP_CODE", newline: false, type: "text", },
                            { display: "物料名称", name: "_search_SP_NAME", dbname: "SP_NAME", newline: false, type: "text", },
                            { display: "仓库ID", name: "_search_STOCK_CODE", dbname: "STOCK_CODE", op: "equal", type: "hidden", options: {} }
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "来源类型", name: "SRC_TYPE", dbname: "HOUSE_CODE", width: 100, type: "select", format: { data: me.storeSou } },
                            { display: "物料编码", name: "SP_CODE", dbname: "SP_CODE", width: 120, type: "text", },
                            { display: "物料名称", name: "SP_NAME", dbname: "SP_NAME", width: 150, type: "text", },
                            { display: "规格型号", name: "SP_SIZE", dbname: "SP_SIZE", width: 150, type: "text", },
                            { display: "计量单位", name: "UNIT", dbname: "UNIT", width: 150, type: "text", },
                            { display: "分类", name: "TYPE_NAME", dbname: "TYPE_NAME", width: 150, type: "text", },
                            { display: "品牌、厂家", name: "PRODUCE", dbname: "PRODUCE", width: 150, type: "text", },

                            { display: "库位名称", name: "STOCK_NAME", dbname: "STOCK_NAME", width: 150, type: "text", },
                            { display: "批次号", name: "STORE_CODE", dbname: "STORE_CODE", width: 150, type: "text", },

                            { display: "库存数量", name: "NUM", dbname: "NUM", width: 150, type: "text", },
                            { display: "库存单价(元)", name: "PRICE", dbname: "PRICE", width: 150, type: "text", },
                            { display: "库存金额(元)", name: "MONEY", dbname: "MONEY", width: 150, type: "text", },

                            { display: "税率", name: "TAX_RATE", dbname: "TAX_RATE", width: 150, type: "text", },
                            { display: "不含税单价(元)", name: "NOTAX_PRICE", dbname: "NOTAX_PRICE", width: 150, type: "text", },
                            { display: "不含税金额(元)", name: "NOTAX_MONEY", dbname: "NOTAX_MONEY", width: 150, type: "text", },

                            { display: "入库日期", name: "IN_DATE", dbname: "IN_DATE", width: 120, type: "date", format: "yyyy-MM-dd" },
                            { display: "供应商", name: "PROVIDER_NAME", dbname: "PROVIDER_NAME", width: 150, type: "text", },
                            { display: "库龄(月)", name: "STORE_MONTH", dbname: "STORE_MONTH", width: 150, type: "text", },

                            { display: "申请单号", name: "APPLY_NO", dbname: "APPLY_NO", width: 150, type: "text", },
                            { display: "送货单号", name: "DELIVERY_CODE", dbname: "DELIVERY_CODE", width: 150, type: "text", },

                            { display: "单位名称", name: "DEPT_NAME", dbname: "DEPT_NAME", width: 150, type: "text", },
                            { display: "主键", name: "STORE_ID", dbname: "STORE_ID", width: 100, type: "text", hide: true },

                        ]
                    }
                };
            },
            grid: null,
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'Material/SpStore/ComboxData',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        me.providerName = data.ProviderName;
                        me.storeSou = data.BCCode;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
                var me = this;
            },
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    dateFormat: "yyyy-MM-dd hh:mm",
                    autoWidth: true,
                    delayLoad: true,
                    usePager: false,
                    columns: me.config.grid.columns,
                    //dataAction: 'server',
                    toolbar: {},
                    url: 'Material/SpStore/list',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: 'CREATEDATE',
                    sortOrder: 'DESC',
                    width: '99%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: false,
                    clickToEdit: false
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "add"://库存初始化
                            me.add();
                            break;
                        case "Excel":
                            $.ligerDialog.open({
                                url: "../../../System/Export.html?exporttype=xls&MenuNo=" + me.menuNo,
                                modal: true
                            });
                            break;
                        case "Word":
                            $.ligerDialog.open({
                                url: "../../../System/Export.html?exporttype=doc&MenuNo=" + me.menuNo,
                                modal: true
                            });
                            break;
                    }
                }
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            add: function () { //库存初始化
                var me = this;
                var nodeCode = me.currentNode == null || me.currentNode == undefined ? "ROOT" : me.currentNode.data.HOUSE_CODE;
                var nodeName = me.currentNode == null || me.currentNode == undefined ? "仓库货位" : me.currentNode.data.HOUSE_NAME;
                var nodeId = me.currentNode == null || me.currentNode == undefined ? "ROOT" : me.currentNode.data.HOUSE_ID;

                me.viewForm = $("#view-form").ligerForm({
                    fields: [
                        { display: "批次号", name: "STORE_CODE", labelWidth: 120, width: 180, newline: true, type: "text", editor: { type: 'text' }, validate: { required: true } },
                        { display: "物料编码", name: "SP_CODE", labelWidth: 120, width: 180, type: "text", readonly: "readonly", validate: { required: true } },
                        { display: "物料名称", name: "SP_NAME", labelWidth: 120, width: 180, newline: true, type: "text", readonly: "readonly", validate: { required: true } },
                        { display: "型号规格", name: "SP_SIZE", labelWidth: 120, width: 180, type: "text", readonly: "readonly" },
                        { display: "品牌、厂家", name: "PRODUCE", labelWidth: 120, width: 180, newline: true, type: "text", readonly: "readonly", },
                        { display: "计量单位", name: "UNIT", labelWidth: 120, width: 180, type: "text", readonly: "readonly" },
                        { display: "物料分类", name: "TYPE_NAME", labelWidth: 120, width: 180, newline: true, type: "text", readonly: "readonly", },
                        { display: "库位名称", name: "STOCK_NAME", labelWidth: 120, width: 180, type: "text", readonly: "readonly", },

                        { display: "来源类型", name: "SRC_TYPE", labelWidth: 120, width: 180, newline: true, type: "select", editor: { type: 'select', options: { data: me.storeSou } }, validate: { required: true } },
                        {
                            display: "库存数量", name: "NUM", labelWidth: 120, width: 180, type: "text", editor: {
                                type: 'text',
                                onChangeValue: function (input, value, g) {
                                    var editParm = g.options.editParm.record;
                                    editParm["MONEY"] = (value * (editParm.PRICE || 0)).toFixed(2);

                                }
                            }, validate: { required: true }
                        },
                        {
                            display: "库存单价(元)", name: "PRICE", labelWidth: 120, width: 180, newline: true, type: "text", editor: {
                                type: 'text', onChangeValue: function (input, value, g) {
                                    var editParm = g.options.editParm.record;
                                    editParm["MONEY"] = (value * (editParm.NUM || 0)).toFixed(2);

                                }
                            }, validate: { required: true }
                        },
                        { display: "库存金额(元)", name: "MONEY", labelWidth: 120, width: 180, type: "text", editor: { type: 'text' }, validate: { required: true } },

                        { display: "不含税单价(元)", name: "NOTAX_PRICE", labelWidth: 120, width: 180, newline: true, type: "text", editor: { type: 'text' } },
                        { display: "不含税金额(元)", name: "NOTAX_MONEY", labelWidth: 120, width: 180, type: "text", editor: { type: 'text' } },

                        { display: "入库日期", name: "IN_DATE", labelWidth: 120, width: 180, type: "date", newline: true, format: "yyyy-MM-dd", editor: { type: 'date', format: "yyyy-MM-dd" }, validate: { required: true } },
                        { display: "税率", name: "TAX_RATE", labelWidth: 120, width: 180, type: "text", editor: { type: 'text' } },
                        {
                            display: "供应商", name: "PROVIDER_ID", dbname: "PROVIDER_ID", labelWidth: 120, width: 180, newline: true, type: "select", editor: {
                                type: 'select',
                                options: {
                                    autocomplete: true,
                                    data: me.providerName
                                },
                                render: function (rowdata, rowindex, value, column) {
                                    var showText = rowindex;
                                    me.viewForm.setData({
                                        PROVIDER_NAME: rowindex
                                    });
                                    return showText;
                                }
                            }
                        },
                        { display: "申请单号", name: "申请单号", labelWidth: 120, width: 180, type: "text", editor: { type: 'text' } },
                        //隐藏
                        { display: "SP_ID", name: "SP_ID", dbname: "SP_ID", width: 180, type: "hidden" },
                        { display: "TYPE_ID", name: "TYPE_ID", dbname: "TYPE_ID", width: 180, type: "hidden" },
                        { display: "TYPE_CODE", name: "TYPE_CODE", dbname: "TYPE_CODE", width: 180, type: "hidden" },
                        { display: "供应商名", name: "PROVIDER_NAME", dbname: "PROVIDER_NAME", width: 180, type: "hidden" },
                        { display: "仓库ID", name: "STOCK_ID", dbname: "STOCK_ID", width: 180, type: "hidden" },
                        { display: "仓库CODE", name: "STOCK_CODE", dbname: "STOCK_CODE", width: 180, type: "hidden" }
                    ],
                    space: 3,
                    validate: true,
                    onAfterSetFields: function (g) {
                        me.viewForm = g;
                    }
                });
                me.viewForm.setOrginData({ STOCK_NAME: (nodeName == "仓库货位" ? "" : nodeName), STOCK_ID: (nodeId == "ROOT" ? "" : nodeId), STOCK_CODE: (nodeCode == "ROOT" ? "" : nodeCode), SRC_TYPE:"1" });
                var dialog = $.ligerDialog.open({
                    title: "库存初始化",
                    target: me.viewForm.form,
                    width: 700,
                    height: 600,
                    showMax: false,
                    showToggle: false,
                    showMin: false,
                    isResize: true,
                    slide: false,
                    allowClose: true,
                    isHidden: false,
                    buttons: [{
                        text: "选择物料", type: "info", onClick: function () {

                            var callback = function (list) {
                                if (list.length > 0) {
                                    me.viewForm.setData({
                                        "SP_ID": list[0].SP_ID,
                                        "SP_CODE": list[0].SP_CODE,
                                        "SP_NAME": list[0].SP_NAME,
                                        "SP_SIZE": list[0].SP_SIZE,
                                        "PRODUCE": list[0].PRODUCE,
                                        "UNIT": list[0]. UNIT,
                                        "TYPE_NAME": list[0].TYPE_NAME,
                                        "TYPE_ID": list[0].TYPE_ID,
                                        "TYPE_CODE": list[0].TYPE_CODE
                                    });
                                }
                            };

                            $.ligerDialog.open({
                                width: 980,
                                height: 600,
                                allowClose: true,
                                title: "挑选物资编码",
                                url: "../Base/base_spcatalogPop.html?MenuNo=" + me.menuNo,
                                isHidden: false,
                                showMax: false,
                                showToggle: false,
                                showMin: false,
                                isResize: true,
                                slide: false,
                                data: {
                                    isCancel: "0",
                                    single: true,
                                    mainReloadBtn: me.buttons[0],
                                    callback: callback
                                }
                            });
                        }
                    },{
                        text: "确定", type: "info", onClick: function () {
                            if (!me.viewForm.valid()) {
                                me.viewForm.showInvalid();
                                return;
                            }

                            var data = me.viewForm.getData();
                            var changeRow = new Object();
                            changeRow["added"] = [data];
                            LG.ajax({
                                jsToken: true,
                                url: 'Material/SpStore/Save',
                                loading: '正在保存中...',
                                data: changeRow,
                                success: function () {
                                    dialog.hide();
                                    LG.showSuccess('保存成功');
                                    me.reload();
                                },
                                error: function (message) {
                                    LG.showError(message);
                                }
                            });
                        }
                    }, {
                        text: "取消", type: "cancel", onClick: function () {
                            dialog.hide();
                        }
                    }]
                });
                return;
            },
            reloadTree: function () {
                var me = this;
                me.selectNode = me.tree.getSelected();
                me.tree.reload();
            },
            reload: function () { //刷新
                var me = this;
                me.grid.loadData();
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Word',
                        text: '导出Word',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-word-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            setTree: function () {
                var me = this;
                var rootValue = "ROOT";
                me.tree = $("#maintree").ligerTree({
                    url: "Material/SpStore/Tree",
                    parms: {},
                    nodeWidth: 160,
                    slide: false,
                    checkbox: false,
                    single: true,
                    needCancel: false,
                    idFieldName: 'HOUSE_CODE',
                    textFieldName: 'HOUSE_NAME',
                    parentIDFieldName: 'PARENTID',
                    iconClsFieldName: "ICON",
                    isExpand: 2,
                    onSuccess: function (data) {
                        $(".l-tree .l-body span").each(function () {
                            var $this = $(this);
                            var text = $this.text();
                            $this.html('<acronym title="' + text + '"><span> ' + text + '</span></acronym>');
                        });
                        if (me.selectNode && me.selectNode.data) this.selectNode(me.selectNode.data.HOUSE_CODE);
                        else me.tree.selectNode(rootValue);
                    },
                    onSelect: function (node) {
                        var nodeData = node.data;
                        me.currentNode = node;
                        var where = {};
                        if (nodeData) {
                            var parentNo = nodeData.HOUSE_CODE;
                            $("#_search_STOCK_CODE").val((parentNo == "ROOT" ? "" : parentNo));
                            where = {
                                rules: [],
                                groups: [{
                                    rules: [], op: "or"
                                }], op: "and"
                            };
                            if (parentNo === rootValue) {
                                parentNo = "";
                            } else {
                                where.groups[0].rules.push({ field: 'STOCK_CODE', value: parentNo, op: 'startwith' });
                            }

                            me.grid.set('parms', { "where": JSON2.stringify(where) });
                            me.currentMenuParentNo = parentNo;
                            me.reload();
                        }
                    }
                });
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch = $("#formsearch")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                    }
                });
            },
            init: function () {
                var me = this;
                $("#layout").ligerLayout({ leftWidth: 240 });
                me.loadComboxData();
                me.setConfig();
                me.setGrid();
                me.setTree();
                me.setForm();
                return me;
            }
        };
        business.init();
    </script>
</body>
</html>
