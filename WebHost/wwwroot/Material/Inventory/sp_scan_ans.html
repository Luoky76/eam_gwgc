<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title></title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <div id="mainsearch" style="width: 98%">
        <form action="" id="formsearch" class="l-form">
        </form>
    </div>
    <form action="" id="mainform">
        <div id="maingrid">
        </div>
    </form>
    <script type="text/javascript">
        'use strict';
        var business = {
            rootPath: 'Material/SpScan/',
            MenuNo: getQueryStringByName("MenuNo"),
            scanResult: [{ "ID": "正常", "TEXT": "正常" }, { "ID": "盘盈", "TEXT": "盘盈" }, { "ID": "盘亏", "TEXT": "盘亏" }],
            scanType: [],
            storeSou: [],
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            { display: "盘点单号", name: "_search_SCAN_CODE", dbname: "SCAN_CODE", newline: false, upper: true, type: "text", },
                            { display: "物料名称", name: "_search_SP_NAME", dbname: "SP_NAME", newline: false, upper: true, type: "text", },
                            { display: "盘点结果", name: "_search_SCAN_RESULT", dbname: "SCAN_RESULT", newline: false, upper: true, type: "select", options: { data: me.scanResult } },
                            { display: "记录状态", name: "_search_AUDITING", dbname: "AUDITING", newline: false, type: "hidden" },
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "盘点单号", name: "SCAN_CODE", width: 150, type: "text", },
                            { display: "盘点类型", name: "SCAN_TYPE", width: 120, type: "select", format: { data: me.scanType } },
                            { display: "来源类型", name: "SRC_TYPE", dbname: "HOUSE_CODE", width: 100, type: "select", format: { data: me.storeSou } },
                            { display: "库存数量", name: "STORE_NUM", dbname: "NUM", width: 150, type: "text", },
                            { display: "盘点数量", name: "SCAN_NUM", dbname: "SCAN_NUM", width: 150, type: "text", editor: { type: 'text' }, validate: { required: true }, },
                            {
                                display: "盘点结果", name: "SCAN_RESULT", dbname: "SCAN_RESULT", width: 150, type: "text", validate: { required: true }, editor: {
                                    type: 'select',
                                    data: me.scanResult
                                }
                            },
                            { display: "物料编码", name: "SP_CODE", dbname: "SP_CODE", width: 130, type: "text", },
                            { display: "物料名称", name: "SP_NAME", dbname: "SP_NAME", width: 150, type: "text", },
                            { display: "规格型号", name: "SP_SIZE", dbname: "SP_SIZE", width: 150, type: "text", },
                            { display: "计量单位", name: "UNIT", dbname: "UNIT", width: 150, type: "text", },
                            { display: "分类", name: "TYPE_NAME", dbname: "TYPE_NAME", width: 150, type: "text", },
                            { display: "品牌、厂家", name: "PRODUCE", dbname: "PRODUCE", width: 150, type: "text", },
                          
                            { display: "库位名称", name: "STOCK_NAME", dbname: "STOCK_NAME", width: 150, type: "text", },
                            { display: "批次号", name: "STORE_CODE", dbname: "STORE_CODE", width: 150, type: "text", },
                           
                            { display: "盘点人", name: "SCAN_USER", width: 100, type: "text", },
                            { display: "盘点部门", name: "DEPT_NAME", width: 100, type: "text", },
                            { display: "二级单位", name: "SEC_DEPT", width: 100, type: "text", },
                            { display: "盘点日期", name: "SCAN_DATE", width: 120, type: "date", format: "yyyy-MM-dd", },
                            { display: "主键", name: "SCAN_DET_ID", dbname: "SCAN_DET_ID", width: 180, hide: true },
                            { display: "SCAN_ID", name: "SCAN_ID", dbname: "SCAN_ID", width: 180, hide: true }
                        ]
                    }
                };
            },
            grid: null,
            searchForm: null,
            buttons: null,
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: me.rootPath + 'ComboxData',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        me.scanType = data.ScanType;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });

                LG.ajax({
                    async: false,
                    url: 'Material/SpStore/ComboxData',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        me.storeSou = data.BCCode;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    autoWidth: false,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    usePager: false,
                    toolbar: {},
                    url: me.rootPath + 'DetailAnsList',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: 'SCAN_DATE',
                    sortOrder: 'DESC',
                    width: '98%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: true,
                    clickToEdit: true,
                });


                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "save":
                            me.save();
                            break;
                        case "submit":
                            me.submit();
                            break;
                        case "Excel":
                            $.ligerDialog.open({
                                url: "../System/Export.html?exporttype=xls",
                                modal: true
                            });
                            break;
                        case "Word":
                            $.ligerDialog.open({
                                url: "../System/Export.html?exporttype=doc",
                                modal: true
                            });
                            break;
                    }
                }

                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            reload: function () { //刷新
                var me = this;
                me.buttons[0].click();
            },
            save: function () { //保存
                var me = this;
                if (me.grid.endEdit() != false) {
                    if (!me.grid.isDataChanged) {
                        LG.showSuccess('无修改');
                        return;
                    }
                    if (!me.grid.validChangeRows()) return false;
                    var changeRow = me.grid.getChangedRows();
                    LG.ajax({
                        jsToken: true,
                        url: me.rootPath + 'DetailSave',
                        loading: '正在保存中...',
                        data: changeRow,
                        success: function (message, data) {
                            me.grid.isDataChanged = false;
                            me.reload();
                            LG.showSuccess('保存成功');
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }

            },
            submit: function () {    //提交
                var me = this;
                
                var selected = me.grid.getSelectedRows();
                if (selected.length > 0) {
                    //先保存
                    if (me.grid.endEdit() != false) {
                        if (me.grid.isDataChanged) {
                            if (!me.grid.validChangeRows()) return false;
                            var changeRow = me.grid.getChangedRows();
                            LG.ajax({
                                jsToken: true,
                                url: me.rootPath + 'DetailSave',
                                loading: '正在保存中...',
                                data: changeRow,
                                success: function (message, data) {
                                    me.grid.isDataChanged = false;
                                    me.reload();
                                    LG.showSuccess('保存成功');
                                },
                                error: function (message) {
                                    LG.showError(message);
                                }
                            });
                        }
                    }
                    //再提交
                    var flag = true;
                    var sids = [];
                    selected.forEach((a) => {
                        if (a.AUDITING != "0") {
                            LG.tip(a.SP_NAME + '已提交，无法再次提交!');
                            flag = false;
                            return;
                        }
                        if (a.SCAN_NUM == undefined || a.SCAN_NUM == null) {
                            LG.tip(a.SP_NAME + '盘点数量未填写，无法再次提交!');
                            flag = false;
                            return;
                        }
                        if (a.SCAN_RESULT == undefined || a.SCAN_RESULT == null) {
                            LG.tip(a.SP_NAME + '盘点结果未填写，无法再次提交!');
                            flag = false;
                            return;
                        }
                        sids.push(a.SCAN_DET_ID)
                    })
                    if (!flag) {
                        return;
                    }

                    LG.ajax({
                        jsToken: true,
                        url: me.rootPath + 'DetSubmit',
                        loading: '正在保存中...',
                        data: { "sids": sids },
                        success: function () {
                            LG.showSuccess('提交成功');
                            me.grid.isDataChanged = false;
                            me.reload();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });

                }
                else {
                    LG.tip('请选择行!');
                }
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Word',
                        text: '导出Word',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-word-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch = $("#formsearch")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                        me.searchForm.setData({ "_search_AUDITING": "0" });
                    }
                });
            },
            init: function () {
                var me = this;
                me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.setGrid();
                me.reload();
                return me;
            }
        };
        business.init();
    </script>
</body>
</html>
