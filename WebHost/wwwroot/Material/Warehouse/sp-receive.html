
<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title></title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <div id="mainsearch" style="width: 98%">
        <form action="" id="formsearch" class="l-form">
        </form>
    </div>
    <form action="" id="mainform">
        <div id="maingrid">
        </div>
    </form>
    <script type="text/javascript">
        'use strict';
        var business = {
            menuNo: getQueryStringByName("MenuNo"),
            ver: getQueryStringByName("ver"),
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            { display: "记录状态", name: "_search_AUDITING", dbname: "AUDITING", newline: false, upper: true, type: "select", options: { type: 'select', data: me.auditingStatus } },
                            { display: "登记单号", name: "_search_RECEIVE_CODE", dbname: "RECEIVE_CODE", newline: false, upper: true, type: "text", options: {} },
                            { display: "供应商", name: "_search_PROVIDER_NAME", dbname: "PROVIDER_NAME", newline: false, upper: true, type: "text", options: {} },
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "记录状态", name: "AUDITING", minWidth: 100, type: "select", editor: { type: 'select', data: me.auditingStatus, selectBoxHeight: 100 } },
                            { display: "登记单号", name: "RECEIVE_CODE", minWidth: 100, type: "text",  editor: { type: 'text'} },
                            { display: "收货日期", name: "RECEIVE_DATE", minWidth: 100, type: "date",  editor: { type: 'date',showTime: true,format: "yyyy-MM-dd hh:mm"} },
                            { display: "收货人", name: "USER_NAME", minWidth: 100, type: "text",  editor: { type: 'text'} },
                            { display: "供应商", name: "PROVIDER_NAME", minWidth: 100, type: "text",  editor: { type: 'text'} },
                            { display: "订单号", name: "ORDER_CODE", minWidth: 100, type: "text",  editor: { type: 'text'} },
                            { display: "验收部门", name: "DEPT_NAME", minWidth: 100, type: "text",  editor: { type: 'text'} },
                            { display: "采购人", name: "PUR_USER", minWidth: 100, type: "text",  editor: { type: 'text'} },
                            { display: "验收人", name: "CHK_USER", minWidth: 100, type: "text",  editor: { type: 'text'} },
                            { display: "备注", name: "REG_MEMO", minWidth: 100, type: "text",  editor: { type: 'text'} },
                            { display: "主键", name: "RECEIVE_ID", minWidth: 100, type: "text", hide: true },
                        ]
                    }
                };
            },
            auditingStatus: [
                { ID: "0", TEXT: "未提交", VALUE: "0" },
                { ID: "1", TEXT: "已提交", VALUE: "1" }
            ],
            grid: null,
            searchForm: null,
            buttons: null,
            loadComboxData: function () {
                var me = this;
                console.log(me.menuNo);
            },
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    autoWidth: true,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    usePager: false,
                    dataAction: 'local',
                    toolbar: { group: 'list' },
                    url: 'Material/SpReceive/List',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: '',
                    sortOrder: '',
                    width: '98%',
                    height: '100%',
                    checkbox: true,
                    onBeforeEdit: function (editParm) {
                        switch (editParm.column.name) {
                            case "":
                                if (editParm.record.__status == "add") return true;
                                else return false;
                                break;
                        }
                    },
                    onSuccess: function (data, g) {
                        if (data && data.Rows) {
                            var rows = data.Rows || [];
                            for (var i = 0, len = rows.length; i < len; i++) {
                                var row = rows[i];
                                row.OLDROLEID = row.ROLEID;
                            }
                        }
                    },
                    rowAttrRender: function (rowdata, rowid) {
                        return "";
                    },
                    onDblClickRow: function (data, rowid, rowdata) {
                        me.view(rowid);
                    }
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "add":
                            me.add();
                            break;
                        case "modify":
                            me.modify();
                            break;
                        case "delete":
                            me.delete();
                            break;
                        case "save":
                            me.save();
                            break;
                        case "sumbit":
                            $.ligerDialog.confirm("提交后不可修改，是否继续？", function (confirm) {
                                if (confirm) {
                                    me.sumbit();
                                }
                            });
                            break;
                        case "cancelSumbit":
                            me.cancelSumbit();
                            break;
                        case "Excel":
                            $.ligerDialog.open({
                                url: "../System/Export.html?exporttype=xls",
                                modal: true
                            });
                            break;
                        case "Word":
                            $.ligerDialog.open({
                                url: "../System/Export.html?exporttype=doc",
                                modal: true
                            });
                            break;
                    }
                }
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            view: function (rowid) { //查看
                var me = this;
                if (!rowid) return;
                $.ligerDialog.open({
                    width: 1100,
                    height: 520,
                    allowClose: true,
                    title: '[查看]',
                    url: "sp-receive-detail.html?MenuNo=" + me.menuNo,
                    isHidden: false,
                    showMax: false,
                    showToggle: false,
                    showMin: false,
                    isResize: true,
                    slide: false,
                    onClosed: me.reload.bind(me),
                    data: { "sid": me.grid.getRow(rowid).RECEIVE_ID, "isNew": false, "isView": true }
                });
            },
            add: function () { //新增
                var me = this;
                $.ligerDialog.open({
                    width: 1100,
                    height: 520,
                    allowClose: true,
                    title: '[新增]采购明细',
                    url: "sp-receive-detail.html?MenuNo=" + me.menuNo,
                    isHidden: false,
                    showMax: false,
                    showToggle: false,
                    showMin: false,
                    isResize: true,
                    slide: false,
                    onClosed: me.reload.bind(me),
                    data: { "sid": null, "isNew": true, "isView": false }
                });
            },
            modify: function () { //修改
                var me = this;
                var selected = me.grid.getSelectedRow();
                if (selected.length > 1) {
                    LG.showError("不能选择多行")
                    return
                } else if (selected.length == 0) {
                    LG.showError("请选择一行")
                    return
                }

                if (selected.AUDITING == "1") {
                    LG.tip('已提交，无法修改!');
                } else {
                    //if (rowdata) {
                    //    selected = rowdata;
                    //}
                    if (selected) {
                        var sid = selected.RECEIVE_ID;
                        $.ligerDialog.open({
                            width: 1100,
                            height: 520,
                            allowClose: true,
                            title: '[修改]',
                            url: "sp-receive-detail.html?MenuNo=" + me.menuNo,
                            isHidden: false,
                            showMax: false,
                            showToggle: false,
                            showMin: false,
                            isResize: true,
                            slide: false,
                            onClosed: me.reload.bind(me),
                            data: { "sid": sid }
                        });
                    }
                }
                
            },
            save: function () { //保存
                var me = this;
                if (me.grid.endEdit() != false) {
                    if (!me.grid.isDataChanged) {
                        LG.showSuccess('无修改');
                        return;
                    }
                    if (!me.grid.validChangeRows()) return false;
                    var changeRow = me.grid.getChangedRows();
                    LG.ajax({
                        jsToken: true,
                        url: 'Material/SpReceive/Save',
                        loading: '正在保存中...',
                        data: { request: changeRow, requestdet: null },
                        success: function () {
                            LG.showSuccess('保存成功');
                            me.grid.isDataChanged = false;
                            me.reload();
                        },
                        error: function (message) {
                            LG.showError(message);
                            me.reload();
                        }
                    });
                }

            },
            sumbit: function () { //提交
                var me = this;
                var selecteds = me.grid.getSelectedRows();
                if (selecteds) {
                    var updatedarr = [];
                    var orginarr = [];
                    for (var i = 0; i < selecteds.length; i++) {
                        var ori = JSON.parse(JSON.stringify(selecteds[i]));
                        var upd = JSON.parse(JSON.stringify(selecteds[i]));
                        if (ori.AUDITING == "1") {
                            LG.showError("该数据已提交，无法重复提交！");
                            return;
                        }
                        upd.AUDITING = "1";
                        orginarr.push(ori);
                        updatedarr.push(upd)
                    }
                    var changeRow = new Object();
                    changeRow["updated"] = updatedarr;
                    changeRow["original"] = orginarr;
                    LG.ajax({
                        jsToken: true,
                        url: 'Material/SpReceive/Save',
                        loading: '正在提交中...',
                        data: { request: changeRow, requestdet: null },
                        success: function () {
                            LG.showSuccess('提交成功');
                            me.grid.isDataChanged = false;
                            me.reload();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                } else {
                    LG.tip('请选择行!');
                }
            },
            cancelSumbit: function () { //撤销提交
                var me = this;
                var selecteds = me.grid.getSelectedRows();
                if (selecteds) {
                    var updatedarr = [];
                    var orginarr = [];
                    for (var i = 0; i < selecteds.length; i++) {
                        var ori = JSON.parse(JSON.stringify(selecteds[i]));
                        var upd = JSON.parse(JSON.stringify(selecteds[i]));
                        if (ori.AUDITING == "0") {
                            LG.showError("该数据未提交，无法撤销！");
                            return;
                        }
                        if (ori.AUDITING_CHK == "1") {
                            LG.showError("该数据已验收，无法撤销！");
                            return;
                        }
                        upd.AUDITING = "-1";
                        orginarr.push(ori);
                        updatedarr.push(upd)
                    }
                    var changeRow = new Object();
                    changeRow["updated"] = updatedarr;
                    changeRow["original"] = orginarr;
                    LG.ajax({
                        jsToken: true,
                        url: 'Material/SpReceive/Save',
                        loading: '正在撤销中...',
                        data: { request: changeRow, requestdet: null },
                        success: function () {
                            LG.showSuccess('撤销成功');
                            me.grid.isDataChanged = false;
                            me.reload();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                } else {
                    LG.tip('请选择行!');
                }
            },
            reload: function () { //刷新
                var me = this;
                me.buttons[0].click();
            },
            delete: function () { //删除
                var me = this;
                if (me.grid.endEdit() != false) {
                    var selected = me.grid.getSelectedRows();
                    for (var i = 0; i < selected.length; i++) {
                        if (selected[i].AUDITING == "1") {
                            LG.showError("选中数据有部分已提交,无法删除");
                            return;
                        }
                    }
                    if (selected.length > 0) {
                        $.ligerDialog.confirm('确定删除吗?', function (confirm) {
                            if (confirm) {
                                for (var i = 0, len = selected.length; i < len; i++) {
                                    me.grid.deleteRow(selected[i]);
                                }
                                me.save();
                            }
                        });
                    } else {
                        LG.tip('请选择行!');
                    }
                }
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Word',
                        text: '导出Word',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-word-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch = $("#formsearch")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                    }
                });
            },
            init: function () {
                var me = this;
                me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.setGrid();
                me.reload();
                return me;
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>
</html>
