<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title>挑选</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <div id="mainsearch" style="width: 98%">
        <form action="" id="formsearch" class="l-form">
        </form>
    </div>
    <form id="mainform">
        <div id="maingrid" style="float: left">
        </div>
    </form>
    <script type="text/javascript">
        'use strict';
        var rootPath = "../";
        var business = {
            dialog: (frameElement && frameElement.dialog) ? frameElement.dialog : null,
            detailType: null,
            sid: "",
            dataValue: null,
            isFirst: true,
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            { display: "设备编号", name: "_search_DEVICE_NO", dbname: "DEVICE_NO", newline: false, upper: true, type: "text", options: {} },
                            { display: "设备名称", name: "_search_DEVICE_NAME", dbname: "DEVICE_NAME", newline: false, upper: true, type: "text", options: {} }
                        ]
                    },
                    grid: {
                        columns: [
                            {
                                display: "申请单号", name: "APPLY_NO", width: 150, type: "text",
                                totalSummary:
                                {
                                    render: function (suminf, column, cell) {
                                        return '<div>合计</div>';
                                    },
                                    align: 'center'
                                }
                            },
                            { display: "申请人", name: "APPLY_USER", width: 150, type: "text", },
                            { display: "申请部门", name: "DEPT_NAME", width: 150, type: "text", },
                            { display: "二级单位", name: "SEC_DEPT", width: 150, type: "text", },
                            { display: "物料编码", name: "SP_CODE", width: 150, type: "text", },
                            { display: "物料名称", name: "SP_NAME", width: 150, type: "text", },
                            { display: "型号规格", name: "SP_SIZE", width: 150, type: "text", },
                            { display: "品牌、厂家", name: "PRODUCE", width: 150, type: "text", },
                            { display: "计量单位", name: "UNIT", width: 150, type: "text", },
                            { display: "物料分类", name: "TYPE_NAME", width: 150, type: "text", },
                            {
                                display: "订单数量", name: "COUNT", width: 150, type: "decimal", totalSummary:
                                {
                                    type: 'sum',
                                    align: 'center'
                                }
                            },
                            { display: "终止数量", name: "STOP_NUM", width: 150, type: "decimal", },
                            {
                                display: "含税单价(元)", name: "PRICE", width: 150, type: "text", totalSummary:
                                {
                                    type: 'sum',
                                    align: 'center'
                                }
                            },
                            {
                                display: "总金额(元)", name: "MONEY", width: 150, type: "text", totalSummary:
                                {
                                    type: 'sum',
                                    align: 'center'
                                }
                            },
                            { display: "要求交货日期", name: "REQ_DATE", type: "date", format: "yyyy-MM-dd", width: 120, editor: { format: "yyyy-MM-dd", type: 'date' }, },
                            { display: "备注", name: "MEMO", width: 120, type: "text", editor: { type: 'text' } },
                            { display: "ORDER_ID", name: "ORDER_ID", dbname: "ORDER_ID", width: 100, type: "text", hide: true },
                            { display: "主键", name: "ORDERDET_ID", dbname: "ORDERDET_ID", width: 100, type: "text", hide: true },
                        ]
                    }
                };
            },
            grid: null,
            searchForm: null,
            buttons: null,
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    autoWidth: true,
                    delayLoad: true,
                    usePager: false,
                    title: "物料选择",
                    columns: me.config.grid.columns,
                    dataAction: 'server',
                    toolbar: {},
                    url: 'Material/SpOrder/DetailList',
                    parms: {
                        ORDER_ID: me.sid,
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: '',
                    sortOrder: '',
                    width: '100%',
                    height: '100%',
                    whenRClickToSelect: true,
                    checkbox: true,
                    enabledEdit: false
                });
                me.grid.isValid = true;
            },
            reload: function () { //刷新
                var me = this;
                me.buttons[0].click();
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch = $("#formsearch")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                    }
                });
                me.buttons[0].click(); //查询
            },
            setFormButtons: function () {
                var me = this;
                //表单底部按钮
                var buttons = [];
                buttons.push({ text: '关闭', onclick: function () { if (me.dialog) me.dialog.close(); } });
                buttons.push({
                    text: '确定', onclick: function () {
                        var selected = me.grid.getSelectedRows();
                        if (selected.length < 1) {
                            LG.showError("请选择需要导入的设备!");
                            return
                        }
                        if (me.dialog) me.dialog.close();
                        if (me.callback) me.callback(selected[0].ID, selected)
                    }
                });
                LG.addFormButtons(buttons);
            },
            init: function () {
                var me = this;
                if (!me.dialog) return;
                var dialogData = me.dialog.get('data'); //获取data参数
                me.detailType = dialogData.detailType;
                me.dataValue = "," + (dialogData.dataValue || "") + ",";
                me.callback = dialogData.callback;
                me.sid = dialogData.sid;
                me.setConfig();
                me.setGrid();
                me.setForm();
                me.setFormButtons();
                return me;
            }
        };
        business.init();
    </script>
</body>

</html>
