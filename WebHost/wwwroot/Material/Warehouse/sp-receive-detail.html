<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title>明细</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%; overflow:auto;">
    <form id="mainform" style="width:97%;">
    </form>
    <div style="margin-bottom: 5px; width: 98%;" id="paramform">
    </div>
    <div style="width: 94.5%;" class="l-form">
        <div class="l-form-container">
            <div class="l-group" style="width: 100%;"><span>收货物料明细</span></div>
            <ul style="display: block; width: 100%;" id="ulGrid">
                <li style=" width: 100%;">
                    <div style="margin-bottom: 50px; width: 100%;" id="maingrid">
                    </div>
                </li>
            </ul>
        </div>
    </div>
    <script type="text/javascript">
        'use strict';
        var business = {
            menuNo: getQueryStringByName("MenuNo"),
            dialogData: {},
            sid: getQueryStringByName("sid"),
            isAddNew: false,
            isView: false,
            orginData: {},
            auditing: [{ "ID": "1", "TEXT": "已提交" }, { "ID": "0", "TEXT": "未提交" }],
            bySource: [],
            pmType: [],
            deviceInfo: [],
            maintDept: [],
            workState: [],
            maintCycle: [],
            spHouse: [],
            start: null,
            orderid: null,
            neworderid: null,
            setConfig: function () {
                var me = this;
                me.config = {
                    form: {
                        fields: [
                            {
                                display: "记录状态", name: "AUDITING", newline: false, upper: true, type: "select", options: {
                                    type: "select",
                                    data: me.auditing,
                                    disabled: true
                                }, group: "收货登记"
                            },
                            { display: "登记单号", name: "RECEIVE_CODE", newline: false, upper: true, type: "text", options: { disabled: true } },
                            { display: "供应商", name: "PROVIDER_NAME", newline: false, upper: true, type: "text", options: { disabled: true } },
                            { display: "采购人", name: "PUR_USER", newline: false, upper: true, type: "text", options: { disabled: true } },
                            {
                                display: "订单号", name: "ORDER_CODE", newline: false, validate: { required: true }, upper: true, type: "text", options: {
                                    disabled: true,
                                    onChangeValue: function (input, value, g) {
                                        if (me.neworderid != me.orderid) {
                                            if (me.grid != null) {
                                                var selected = me.grid.getData();
                                                if (selected.length > 0) {
                                                    for (var i = 0, len = (selected || []).length; i < len; i++) {
                                                        me.grid.deleteRow(selected[i]);
                                                    }
                                                    me.savedet();
                                                }
                                            }
                                        }
                                    }
                                }
                            },
                            { display: "订单号", name: "ORDER_ID", newline: false, upper: true, type: "hidden", options: {} },
                            //{ display: "验收人", name: "CHK_USER", newline: false, upper: true, type: "text", options: { disabled: true } },
                            //{ display: "收货人", name: "USER_NAME", newline: false, upper: true, type: "text", options: { disabled: true } },
                            { display: "收货日期", name: "RECEIVE_DATE", validate: { required: true }, newline: false, upper: true, type: "date", options: {} },
                            { display: "申请部门", name: "DEPT_NAME", newline: false, upper: true, type: "text", options: { disabled: true } },
                            { display: "备注", name: "REG_MEMO", newline: true, width: 880, type: "textarea", options: {} },
                            { display: "主键", name: "RECEIVE_ID", newline: false, upper: true, type: "hidden", options: {} },
                        ]
                    },
                    grid: {
                        columns: [
                            {
                                display: "物料编码", name: "SP_CODE", width: 150, type: "text",
                                totalSummary: { render: function (column, data) { return "<span style='color:red'>&emsp;合计：</span>" } }
                            },
                            { display: "物料名称", name: "SP_NAME", width: 150, type: "text", },
                            { display: "型号规格", name: "SP_SIZE", width: 150, type: "text", },
                            { display: "品牌、厂家", name: "PRODUCE", width: 150, type: "text", },
                            { display: "计量单位", name: "UNIT", width: 150, type: "text", },
                            {
                                display: "订单数量", name: "DDCOUNT", minWidth: 80, type: "int", totalSummary:
                                {
                                    type: 'sum',
                                    align: 'center'
                                },
                            },
                            {
                                display: "中止数量", name: "STOP_NUM", minWidth: 80, type: "int", totalSummary:
                                {
                                    type: 'sum',
                                    align: 'center'
                                },
                            },
                            {
                                display: "待收数量", name: "DSCOUNT", minWidth: 80, type: "int", totalSummary:
                                {
                                    type: 'sum',
                                    align: 'center'
                                },
                            },
                            {
                                display: "数量", name: "COUNT", minWidth: 80, type: "int",
                                editor: {
                                    type: 'int',
                                    onChange: function (rowdata, rowIndex) {
                                        if (rowdata.value < 0) {
                                            LG.showError("数量不能为负数！");
                                        }
                                    },
                                }, validate: { required: true }, totalSummary:
                                {
                                    type: 'sum',
                                    align: 'center'
                                },
                                render: function (rowdata, index, value) {
                                    if (value) {
                                        rowdata.MONEY = rowdata.PRICE * value;
                                        return value;
                                    } else {
                                        return value;
                                    }
                                }
                            },
                            { display: "送货单号", name: "DELIVERY_CODE", minWidth: 150, type: "text", editor: { type: 'text' }, validate: { required: true } },
                            {
                                display: "收货库位", name: "STOCK_ID", type: "select", minWidth: 150, editor: {
                                    type: 'select',
                                    data: me.spHouse,
                                    onChange: function (rowdata, rowIndex) {
                                        if (rowdata.value) {
                                            for (var i = 0; i < me.spHouse.length; i++) {
                                                if (rowdata.value == me.spHouse[i].ID) {
                                                    liger.get("maingrid").updateCell("STOCK_NAME", me.spHouse[i].TEXT, rowdata.record);
                                                    break;
                                                }
                                            }
                                        } else {
                                            liger.get("maingrid").updateCell("STOCK_NAME", "", rowdata.record);
                                        }
                                    },
                                }, validate: { required: true }
                            },

                            {
                                display: "成交单价", name: "PRICE", width: 120, type: "text", totalSummary:
                                {
                                    type: 'sum',
                                    align: 'center'
                                }
                            },
                            {
                                display: "成交金额", name: "MONEY", width: 100, type: "text", totalSummary:
                                {
                                    type: 'sum',
                                    align: 'center'
                                }
                            },
                            { display: "申请人", name: "APPLY_USER", width: 100, type: "text" },
                            { display: "申请单号", name: "APPLY_NO", width: 100, type: "text" },
                            { display: "用途", name: "USE_MEMO", minWidth: 200, type: "text" },
                            { display: "收货库位", name: "STOCK_NAME", width: 100, type: "text", editor: { type: 'text' }, hide: true },
                            { display: "外键", name: "RECEIVE_ID", width: 100, type: "text", editor: { type: 'text' }, hide: true },
                        ]
                    }
                };
            },
            mainform: null,
            buttons: null,
            loadComboxData: function () {
                var me = this;
                console.log(me.menuNo);
                LG.ajax({
                    async: false,
                    url: 'Material/SpReceive/OrderList',
                    loading: '正在获取中...',
                    success: function (data) {
                        for (var i = 0; i < data.length; i++) {
                            data[i].ORDER_DATE = data[i].ORDER_DATE.substr(0, 10);
                        }
                        me.order = data;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
                LG.ajax({
                    async: false,
                    url: 'Material/SpReceive/ComboxData',
                    loading: '正在获取中...',
                    success: function (data) {
                        me.spHouse = data.SpHouseName;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            loadData: function () {
                var me = this;
                function inner() {
                    var data = me.mainform.getData();
                    LG.getFormCombChanges(data, me.orginData, true);
                    delete me.orginData;
                    me.orginData = data;
                }
                if (!me.sid) {
                    me.mainform.setData({ AUDITING: "0" });
                    inner();
                }
                else {
                    LG.ajax({
                        async: false,
                        url: 'Material/SpReceive/Get',
                        loading: '正在获取中...',
                        data: { id: me.sid },
                        success: function (data, message) {
                            me.orderid = data[0].ORDER_ID;
                            me.mainform.setData(data[0]);
                            inner();
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                    if (me.isView) {
                        me.mainform.setReadonly(true);
                    }
                }
                var input = me.mainform.getEditor(me.config.form.fields[0].name).inputText;
                input.focus();
                input.select();
            },
            //保存
            save: function () { //保存
                var me = this;
                var flag = true;
                if (!me.mainform.valid()) {
                    me.mainform.showInvalid();
                    return;
                }
                function handle(data) {
                    return data;
                }
                var data = handle(me.mainform.getData());
                var original = handle(me.orginData);

                var changeRow = new Object();
                if (!me.sid) {
                    changeRow["added"] = [data];
                }
                else {
                    changeRow["updated"] = [data];
                    changeRow["original"] = [original];
                }
                var changeRowDet = me.grid.getChangedRows();
                for (var i = 0; i < changeRowDet.updated.length; i++) {
                    var row = changeRowDet.updated[i];
                    if (row.DSCOUNT < row.COUNT) {
                        flag = false;
                        LG.showSuccess('数量不可大于待收数量！');
                        break;
                    }
                    if (row.COUNT < 0) {
                        flag = false;
                        LG.showSuccess('数量不可为负数！');
                        break;
                    }
                }
                if (flag) {
                    LG.ajax({
                        jsToken: true,
                        url: 'Material/SpReceive/Save',
                        loading: '正在保存中...',
                        data: { request: changeRow, requestdet: changeRowDet },
                        success: function (result) {
                            LG.showSuccess('保存成功', function () {
                                me.isAddNew = false;
                                if (me.dialog) me.dialog.close();
                            });
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }
            },
            //保存
            savedet: function () { //保存
                var me = this;
                var changeRowDet = me.grid.getChangedRows();
                if (changeRowDet.deleted.length > 0 && changeRowDet.updated.length > 0) {
                    changeRowDet["updated"] = [];
                    changeRowDet["original"] = [];
                }
                LG.ajax({
                    jsToken: true,
                    url: 'Material/SpReceive/Save',
                    data: { request: null, requestdet: changeRowDet },
                    success: function (result) {
                        me.reloadDet();
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            close: function () {
                var me = this;
                function inner(callback) {
                    var data = me.mainform.getData();
                    var updateFields = LG.getFormCombChanges(data, me.orginData, true);
                    if (updateFields) {
                        $.ligerDialog.confirm($.ligerDefaults.GridString.isContinueByDataChanged, function (confirm) {
                            if (confirm) {
                                if (callback) callback(2);
                            }
                            else {
                                if (callback) callback(0);
                            }
                        });
                        if (callback) return callback(-1);
                        return false;
                    }
                    if (callback) return callback(1);
                    return true;
                }
                inner(function (status) {
                    if (status > 0) {
                        if (me.dialog) me.dialog.close();
                        if (me.callback) me.callback(false);
                    }
                });
            },
            setFormDefaultBtn: function (cancleCallback, savedCallback) {
                var me = this;
                //表单底部按钮
                var buttons = [];
                buttons.push({ text: '关闭', icon: 'fa fa-window-close', onclick: me.close.bind(me) });
                if (!me.isView) buttons.push({ text: '保存', icon: 'fa fa-save', onclick: me.save.bind(me) });

                LG.addFormButtons(buttons);
                me.formButtons = buttons;
            },
            setForm: function () {
                var me = this;
                me.config.form.fields.removeNull();
                var $formsearch = $("#mainform")
                //搜索表单应用ligerui样式
                me.mainform = $formsearch.ligerForm({
                    EnterMoveNextControl: true,
                    labelAlign: 'right',
                    space: 3,
                    validate: true,
                    fields: me.config.form.fields,
                    labelWidth: 120,
                    onAfterSetFields: function (g) {
                        me.mainform = g;
                        me.buttons = g.options.buttons;
                    }
                });
                me.setFormDefaultBtn();
            },
            grid: null,
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    dateFormat: "yyyy-MM-dd hh:mm",
                    autoWidth: true,
                    delayLoad: true,
                    usePager: true,
                    columns: me.config.grid.columns,
                    dataAction: 'local',
                    toolbar: { group: "det" },
                    url: 'Material/SpReceive/DetList',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: [{ field: 'RECEIVE_ID', op: 'equal', value: $('#RECEIVE_ID').val() }]
                        })
                    },
                    //sortName: 'MODIFY_DATE',
                    //sortOrder: 'desc',
                    width: '99%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: true,
                    clickToEdit: true,
                    onBeforeEdit: function (editParm) {
                        switch (editParm.column.name) {
                            case "":
                                if (editParm.record.__status == "add") return true;
                                else return false;
                                break;
                        }
                    },
                    onSuccess: function (data, g) {
                        //me.iframeloading.hide();
                    }
                });
                me.grid.isValid = true;
                if (!me.isView) {
                    me.loadToolbar();
                }
                me.bindGridEvent();
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Word',
                        text: '导出Word',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-word-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "add":
                            me.add();
                            break;
                        case "delete":
                            me.delete();
                            break;
                        case "save":
                            me.save();
                            break;
                        case "Excel":
                            $.ligerDialog.open({
                                url: "../../../System/Export.html?exporttype=xls&MenuNo=" + me.menuNo,
                                modal: true
                            });
                            break;
                        case "Word":
                            $.ligerDialog.open({
                                url: "../../../System/Export.html?exporttype=doc&MenuNo=" + me.menuNo,
                                modal: true
                            });
                            break;
                    }
                }
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },
            //刷新
            reloadDet: function () {
                var me = this;
                me.grid.loadData();
            },
            //新增
            addGrid: function (row = {}) {
                var me = this;
                $.extend(row, {
                    EXE_ID: me.EXE_ID,
                    DONEITEM_ID: me.DONEITEM_ID,
                });
                me.grid.addEditRow(row, true);
            },

            //增加
            add: function () {
                var me = this;
                var gridData = me.grid.getData();
                var orderdet_id = [];
                for (var item of gridData) {
                    orderdet_id.push(item.ORDERDET_ID);
                }
                $.ligerDialog.open({
                    width: 820,
                    height: 500,
                    title: '物料挑选',
                    url: "sp-select.html",
                    isResize: true,
                    slide: false,
                    data: {
                        values: orderdet_id,
                        sid: $('#ORDER_ID').val(),
                        options: {
                            sortName: 'NAME', rowKey: "ORDERDET_ID",
                        },
                        callback: function (values, rows) {
                            var currentSet = new Set(orderdet_id);
                            for (let item of rows) {
                                if (!currentSet.has(item.ORDERDET_ID)) {
                                    var row = {
                                        SP_CODE: item.SP_CODE,
                                        SP_NAME: item.SP_NAME,
                                        SP_SIZE: item.SP_SIZE,
                                        PRODUCE: item.PRODUCE,
                                        UNIT: item.UNIT,
                                        DDCOUNT: item.COUNT,
                                        STOP_NUM: item.STOP_NUM,
                                        DSCOUNT: item.DSCOUNT,
                                        COUNT: "",
                                        DELIVERY_CODE: "",
                                        MEMO: "",
                                        PRICE: item.PRICE,
                                        MONEY: 0,
                                        APPLY_USER: item.APPLY_USER,
                                        APPLY_NO: item.APPLY_NO,

                                        SP_ID: item.SP_ID,
                                        ORDERDET_ID: item.ORDERDET_ID,
                                    };
                                    me.grid.addEditRow(row, true);
                                }
                            }
                        },
                    }
                });
            },
            //删除
            delete: function () { //删除
                var me = this;
                if (me.grid.endEdit() != false) {
                    var selected = me.grid.getSelectedRows();
                    if (selected.length > 0) {
                        $.ligerDialog.confirm('确定删除吗?', function (confirm) {
                            if (confirm) {
                                for (var i = 0, len = (selected || []).length; i < len; i++) {
                                    me.grid.deleteRow(selected[i]);
                                }
                                me.save();
                            }
                        });
                    } else {
                        LG.tip('请选择行!');
                    }
                }
            },
            showSelect: function () {
                var me = this;

                if (me.isView) {
                    return;
                }
                var me = this;
                var orderid = me.mainform.getData().ORDER_ID || "";
                $.ligerDialog.open({
                    width: 1000,
                    height: 500,
                    title: '订单选择',
                    url: window.gksybConfigs.urlBase + "popup-select/common.html",
                    isResize: true,
                    slide: false,
                    data: {
                        values: [orderid],
                        options: {
                            url: 'Material/SpReceive/OrderList', rowKey: "ORDER_ID", isSingleCheck: true,
                            columns: [{ display: "订单号", name: "ORDER_CODE", dbname: "ORDER_CODE", minWidth: 300, type: "text", align: "center" },
                            { display: "订单号ID", name: "ORDER_ID", dbname: "ORDER_ID", minWidth: 300, hide: true },
                            { display: "物料编码", name: "SP_CODE", dbname: "SP_CODE", minWidth: 300, type: "text", align: "center" },
                            { display: "型号规格", name: "SP_NAME", dbname: "SP_NAME", minWidth: 300, type: "text", align: "center" },
                            { display: "申请部门", name: "SP_SIZE", dbname: "SP_SIZE", minWidth: 300, type: "text", align: "center" },
                            { display: "下单日期", name: "ORDER_DATE", dbname: "ORDER_DATE", minWidth: 300, type: "date", align: "center" },
                            { display: "申请部门", name: "DEPT_NAME", dbname: "DEPT_NAME", minWidth: 300, type: "date", align: "center" },
                            { display: "供应商", name: "PROVIDER_NAME", dbname: "PROVIDER_NAME", minWidth: 300, type: "text", align: "center" },
                            { display: "采购人", name: "BUY_USER", dbname: "BUY_USER", minWidth: 300, type: "text", align: "center" },],
                        },
                        fields: [
                            { display: "订单号", name: "ORDER_CODE", width: 100, type: "text" },
                            { display: "型号规格", name: "SP_NAME", width: 100, type: "text" },
                            { display: "申请部门", name: "DEPT_NAME", width: 100, type: "text" },
                            { display: "物料编码", name: "SP_CODE", width: 100, type: "text" }
                        ],
                        callback: function (values, rows) {
                            if (rows.length < 1) {
                                me.mainform.setData({
                                    "ORDER_ID": null,
                                    "PROVIDER_NAME": null,
                                    "PUR_USER": null,
                                    "ORDER_CODE": null,
                                    "DEPT_NAME": null
                                });
                                return;
                            }
                            var row = rows[0];
                            me.neworderid = row.ORDER_ID;
                            me.mainform.setData({
                                "ORDER_ID": row.ORDER_ID,
                                "PROVIDER_NAME": row.PROVIDER_NAME,
                                "PUR_USER": row.BUY_USER,
                                "DEPT_NAME": row.DEPT_NAME,
                                "ORDER_CODE": row.ORDER_CODE
                            });
                        }
                    }
                });

            },
            init: function () {
                var me = this;
                if (frameElement && frameElement.dialog) {
                    me.dialog = frameElement.dialog;
                    me.dialogData = me.dialog.get('data');
                    me.callback = me.dialogData.callback;
                    if (me.dialogData.sid) me.sid = me.dialogData.sid;
                    if (me.dialogData.isAddNew != undefined) me.isAddNew = me.dialogData.isAddNew;
                    if (me.dialogData.isView != undefined) me.isView = me.dialogData.isView;
                }
                me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.loadData();
                me.setGrid();
                me.reloadDet();
                if (me.dialogData.isView == true) {
                    const commonGridOptions = {
                        enabledEdit: false,
                    };
                    me.grid.setOptions(commonGridOptions);
                }
                $("#ORDER_CODE").css("float", "left").css("width", "90%").after("<div class='l-trigger' id='checkloadorder'><div class='fa fa-superpowers'></div></div>");
                $("#checkloadorder").click(function () {
                    me.showSelect();
                });
                return me;
            }
        };
        business.init();
    </script>
</body>

</html>
