
<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title> 明细</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <form id="mainform">
    </form>
    <script type="text/javascript">
        'use strict';
        var business = {
            dialogData: {},
            isView: true,
            sid: getQueryStringByName("sid"),
            dataCorp: [],
            setConfig: function () {
                var me = this;
                me.config = {
                    form: {
                        fields: [
                            { display: "记录状态", name: "AUDITING", newline: false, upper: true, type: "text", options: {} },
                            { display: "送货单号", name: "DELIVERY_CODE", newline: false, upper: true, type: "text", options: {} },
                            { display: "登记单号", name: "RECEIVE_CODE", newline: false, upper: true, type: "text", options: {} },
                            { display: "收货日期", name: "RECEIVE_DATE", newline: false, upper: true, type: "date", options: {} },
                            { display: "收货人ID", name: "USER_ID", newline: false, upper: true, type: "text", options: {} },
                            { display: "收货人", name: "USER_NAME", newline: false, upper: true, type: "text", options: {} },
                            { display: "供应商ID", name: "PROVIDER_ID", newline: false, upper: true, type: "text", options: {} },
                            { display: "供应商", name: "PROVIDER_NAME", newline: false, upper: true, type: "text", options: {} },
                            {
                                display: "订单ID", name: "ORDER_ID", newline: false, upper: true, type: "select", options: {
                                    data: me.order,
                                    autocomplete: true,
                                    selectBoxWidth: 400,
                                    valueField: "ORDER_ID",
                                    textField: "ORDER_CODE",
                                    columns: [
                                        { header: "订单号", name: "DEVICE_NAME", width: 100 },
                                        { header: "物料编码", name: "DEVICE_NO", width: 100 },
                                        { header: "物料名称", name: "DEPT_NAME", width: 100 },
                                        { header: "规格型号", name: "WSEC_DEPT", width: 100 },
                                        { header: "申请人", name: "USER_NAME", width: 100 },
                                        { header: "申请部门", name: "DEPT_NAME", width: 100 },
                                        { header: "供应商", name: "PROVIDER_NAME", width: 100 },
                                    ],
                                    onChangeValue: function (input, value, g) {
                                        if (g.selected != undefined) {
                                            $("#ORDER_ID").val(g.selected.ORDER_ID);
                                            $("#ORDER_CODE").val(g.selected.ORDER_CODE);
                                            $("#USER_NAME").val(g.selected.USER_NAME);
                                            $("#PROVIDER_NAME").val(g.selected.PROVIDER_NAME);
                                            $("#DEPT_NAME").val(g.selected.DEPT_NAME);
                                        }
                                    }
                                }
                            },
                            { display: "订单号", name: "ORDER_CODE", newline: false, upper: true, type: "text", options: {} },
                            { display: "验收部门", name: "DEPT_NAME", newline: false, upper: true, type: "text", options: {} },
                            { display: "采购人", name: "PUR_USER", newline: false, upper: true, type: "text", options: {} },
                            { display: "申请人", name: "CHK_USER", newline: false, upper: true, type: "text", options: {} },
                            { display: "备注", name: "REG_MEMO", newline: false, upper: true, type: "text", options: {} },
                            { display: "主键", name: "RECEIVE_ID", newline: false, upper: true, type: "text", options: {} },
                        ]
                    }
                };
            },
            mainform: null,
            buttons: null,
            order: null,
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'Material/SpRecive/ComboxData',
                    loading: '正在获取中...',
                    success: function (data) {
                        me.order = data.corpData;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            loadData: function () {
                var me = this;
                if (!me.sid) {
                    me.mainform.setOrginData({});
                }
                else {
                    LG.ajax({
                        async: false,
                        url: 'Material/SpRecive/Get',
                        loading: '正在获取中...',
                        data: { id: me.sid },
                        success: function (data, message) {
                            me.mainform.setOrginData(data);
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                    if (me.isView) {
                        me.mainform.setReadonly(true);
                    }
                }
                me.mainform.focus();
            },
            save: function () { //保存
                var me = this;
                if ($.isEmptyObject(me.mainform.getChanges())) {
                    LG.showSuccess('无修改');
                    return;
                }
                if (!me.mainform.valid()) {
                    me.mainform.showInvalid();
                    return;
                }
                function handle(data) {
                    return data;
                }
                var data = handle(me.mainform.getData());
                var original = handle(me.mainform.getOrginData());
                var changeRow = new Object();
                if (!me.sid) {
                    changeRow["added"] = [data];
                }
                else {
                    changeRow["updated"] = [data];
                    changeRow["original"] = [original];
                }
                LG.ajax({
                    jsToken: true,
                    url: 'Material/SpRecive/Save',
                    loading: '正在保存中...',
                    data: changeRow,
                    success: function () {
                        LG.showSuccess('保存成功', function () {
                            location.reload(true);
                        });
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            close: function (skipConfirm) {
                var me = this;
                function inner(callback) {
                    if (!skipConfirm && !$.isEmptyObject(me.mainform.getChanges())) {
                        $.ligerDialog.confirm($.ligerDefaults.GridString.isContinueByDataChanged, function (confirm) {
                            if (confirm) {
                                if (callback) callback(2);
                            }
                            else {
                                if (callback) callback(0);
                            }
                        });
                        if (callback) return callback(-1);
                        return false;
                    }
                    if (callback) return callback(1);
                    return true;
                }
                inner(function (status) {
                    if (status > 0) {
                        if (me.dialog) {
                            me.dialog.close();
                            return;
                        }
                        var win = parent || window;
                        if (win.closeCurrentTab) win.closeCurrentTab();
                        else win.close();
                    }
                });
            },
            setFormDefaultBtn: function () {
                var me = this;
                //表单底部按钮
                var buttons = [];
                if (!me.isView) {
                    buttons.push({
                        text: '重置', onclick: function () {
                            $.ligerDialog.confirm("确定重置数据吗?", function (confirm) {
                                if (confirm) {
                                    location.reload(true);
                                }
                            });
                        }
                    });
                }
                buttons.push({ text: '关闭', onclick: me.close.bind(me) });
                if (!me.isView) buttons.push({ text: '保存', onclick: me.save.bind(me) });
                LG.addFormButtons(buttons);
                me.formButtons = buttons;
            },
            setForm: function () {
                var me = this;
                me.config.form.fields.removeNull();
                var $mainform = $("#mainform")
                //搜索表单应用ligerui样式
                me.mainform = $mainform.ligerForm({
                    EnterMoveNextControl: true,
                    labelAlign: 'right',
                    space: 3,
                    validate: true,
                    fields: me.config.form.fields,
                    labelWidth: 60,
                    onAfterSetFields: function (g) {
                        me.mainform = g;
                        me.buttons = g.options.buttons;
                    }
                });
                me.setFormDefaultBtn();
            },
            init: function () {
                var me = this;
                if (frameElement && frameElement.dialog) {
                    me.dialog = frameElement.dialog;
                    me.dialogData = me.dialog.get('data') || {};
                    if (me.dialogData.callback) me.callback = me.dialogData.callback;
                    if (me.dialogData.sid) me.sid = me.dialogData.sid;
                    if (me.dialogData.isView) me.isView = me.dialogData.isView === "1";
                }
                me.isView = false;
                me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.loadData();
                return me;
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>

</html>
