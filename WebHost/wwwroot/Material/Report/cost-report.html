<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Cache-control" content="no-cache">
    <meta http-equiv="Cache" content="no-cache">
    <title>单船成本统计</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <div id="mainsearch" style="width: 98%">
        <form action="" id="formsearch" class="l-form">
        </form>
    </div>
    <form action="" id="mainform">
        <div id="maingrid">
        </div>
    </form>
    <script type="text/javascript">
        'use strict';
        var business = {
            MenuNo: getQueryStringByName("MenuNo"),
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            { display: "放行日期", name: "_search_BDATE", userSearch: false, newline: false, showTime: false, labelWidth: 90, width: 130, op: 'greaterorequal', type: "date" },
                            { display: "至", name: "_search_EDATE", userSearch: false, newline: false, showTime: false, labelWidth: 20, width: 130, op: 'lessorequal', type: "date" },
                         ]
                    },
                    grid: {
                        columns: [
                            { display: "船名(部门)", name: "DEPT_NAME", width: 80, type: "text", },
                            { display: "维修成本", name: "REP", width: 80, type: "text", },
                            { display: "维保成本", name: "PM", width: 80, type: "text", },
                            { display: "订单成本", name: "ORDER", width: 80, type: "text", },
                            { display: "物资消耗成本", name: "OUTSTORE", width: 80, type: "text", },
                            { display: "淡水消耗量", name: "DAILYCONSUMPTION", width: 80, type: "text", },
                            { display: "柴油消耗量", name: "MASTER", width: 80, type: "text", },
                            { display: "滑油消耗量", name: "LUBRICATE", width: 80, type: "text", },
                        ]
                    }
                };
            },
            grid: null,
            searchForm: null,
            buttons: null,
            loadComboxData: function () {
                var me = this;
            },
            setGrid: function () {
                var me = this;
                var columns = me.config.grid.columns;
                for (var i = columns.length - 1; i >= 0; i--) {
                    if (!columns[i]) columns.splice(i, 1);
                }
                me.grid = $("#maingrid").ligerGrid({
                    title: '单船成本统计',
                    autoWidth: true,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    dataAction: 'server',
                    toolbar: {},
                    url: 'device/Report/CostReport',
                    parms: {
                        dateFrom: "",
                        dateTo: "",
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    //sortName: 'HGFX_DATE',
                    //sortOrder: 'desc',
                    width: '100%',
                    height: '100%',
                    dateFormat: 'yyyy-MM-dd',
                    checkbox: false,
                    enabledEdit: false,
                    clickToEdit: false,
                    onSuccess: function (data, g) {
                        if (data && data.Rows) {
                            var rows = data.Rows;
                            for (var i = 0, len = (rows || []).length; i < len; i++) {
                                rows[i].OLDSID = rows[i].SID;
                            }
                        }
                    },
                    rowAttrRender: function (rowdata, rowid) {

                    }

                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();

            },

            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "Excel":
                            $.ligerDialog.open({ url: "../../System/Export.html?exporttype=xls&MenuNo=" + me.menuNo, modal: true });
                            break;

                    }
                }
                LG.loadToolbar(me.grid, me.toolbarBtnItemClick);
            },

            reload: function () { //刷新
                var me = this;
                me.buttons[0].click();
            },

            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });

            },


            setForm: function () {
                var me = this;
                var columns = me.config.search.fields;
                for (var i = columns.length - 1; i >= 0; i--) {
                    if (!columns[i]) columns.splice(i, 1);
                }
                var $formsearch = $("#formsearch")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            me.grid.options.parms = { dateFrom: liger.get('_search_BDATE').getValue().format('yyyy-MM-dd'), dateTo: liger.get('_search_EDATE').getValue().format('yyyy-MM-dd') };
                            LG.commonSearch($formsearch, me.grid);
                        }
                    },
                    {
                        text: '重置',
                        width: 60,
                        click: function () {
                            me.searchForm.reset();
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                        var nowDate = new Date();
                        var beginDate = nowDate.getFullYear() + "-" + (nowDate.getMonth() + 1) + "-01";
                        var day = new Date(nowDate.getFullYear(), nowDate.getMonth() + 1, 0);
                        var endDate = nowDate.getFullYear() + "-" + (nowDate.getMonth() + 1) + "-" + day.getDate();
                        me.searchForm.setData({ "_search_BDATE": beginDate });
                        me.searchForm.setData({ "_search_EDATE": endDate });
                    }
                });
                 me.buttons[0].click(); //查询
            },
            init: function () {
                var me = this;
                me.loadComboxData();
                me.setConfig();
                me.setGrid();
                me.setForm();
                return me;
            }
        };
        business.init();
    </script>
</body>
</html>
