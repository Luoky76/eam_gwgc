<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <script src="../lib/LGboot.js?ver=<%=SystemService.JsVersion %>" type="text/javascript"></script>
    <link href="../lib/dist/css/viewer.css" rel="stylesheet" />
    <script src="../lib/dist/js/viewer.js" type="text/javascript"></script>
    <title></title>
</head>
<body style="text-align: center;">
    <div>
        <ul id="images">
        </ul>
    </div>
    <script type="text/javascript">
        //相对路径
        var rootPath = "../";
        var CurrentUserName = "<%= gksyyb.Common.SysContext.CurrentUserName %>";
        var IsAdmin = ('<%=gksyyb.Common.SysContext.IsAdmin %>' == "True" ? true : false);
        //初始化下拉框数据（在config之前）
        var dialog;
        var dialogData;
        var attachs;
        var sRowId;
        var width;
        var height;

        if (frameElement && frameElement.dialog) dialog = frameElement.dialog;
        if (dialog) {
            dialogData = dialog.get('data');
            callback = dialogData.callback;
            attachList = dialogData.ATTACHLIST;
            sRowId = dialogData.SROWID || 0;
            width = dialog._width;
            height = dialog._height;
        }

        //检测文件是否有效
        function fileExist(FileURL) {
            if (window.ActiveXObject) {
                xmlhttp = new ActiveXObject("Microsoft.XMLHTTP");
            } else if (window.XMLHttpRequest) {
                xmlhttp = new XMLHttpRequest();
            }
            xmlhttp.open("GET", FileURL, false);
            xmlhttp.send();
            if (xmlhttp.readyState == 4) {

                if (xmlhttp.status == 200) {
                    return "1";
                } else if (xmlhttp.status == 404) {
                    return "2";
                } else {
                    return "3";
                }
            }
        }

        //显示图片
        function showPicture() {
            if (attachList) {
                if (attachList.length > 0) {
                    var picHtml = "";
                    for (var i = 0; i < attachList.length; i++) {
                        var attachInfo = attachList[i];
                        var filePath = '../' + attachInfo.attach_urlpath;
                        var isExist = fileExist(filePath);
                        picHtml += '<li style="display:none"><img src="' + (isExist == "1" ? filePath : 'noImage.jpg') + '" alt="' + attachInfo.ATTACH_NAME + '" ></li>';
                    }

                    $('#images').append($(picHtml));
                    const viewer = new Viewer($('#images')[0], {
                        inline: true,
                        initialViewIndex: sRowId,
                        fullscreen: false,
                        minWidth: width,
                        minHeight: height,
                        viewed: function () {
                            //viewer.zoomTo(0.5);
                        },
                    });

                    viewer.show();

                }
            }
        }
        showPicture();

    </script>
</body>
</html>
