<!DOCTYPE html>

<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="renderer" content="webkit">
    <title>日志查看</title>
    <link href="lib/dist/css/normalize.css" rel="stylesheet" />
    <link href="lib/dist/css/bootstrap.css" rel="stylesheet" />
</head>

<body class="panel panel-info">
    <div class="panel-heading">运行日志 <button id="update-cache" type="button" class="btn btn-danger btn-sm pull-right">更新缓存</button></div>
    <div class="panel-body">
        <ul id="logs" class="list-group">
        </ul>
    </div>
    <script src="lib/jquery/jquery.js" type="text/javascript"></script>
    <script src="lib/js/common.js" type="text/javascript"></script>
    <script>
        var logPath = getQueryStringByName("p");
        var GetLogs = function () {
            $.post("auth/logs", { logPath: logPath}, function (result) {
                if (!result.IsError) {
                    var data = result.Data;
                    var array = [];
                    for (var i = data.length - 1; i >= 0; i--) {
                        array.push('<li class="list-group-item"><p>' + data[i].replace(/[<">']/g,
                            function (a) {
                                return {
                                    '<': '&lt;',
                                    '"': '&quot;',
                                    '>': '&gt;',
                                    "'": '&#39;'
                                }[a]
                            }) + '</p></li>');
                    }
                    $("#logs").html(array.join(""));
                }
                delete result;
            }, "json");
        }
        GetLogs();
        var auto = getQueryStringByName("auto");
        if (auto === "1") {
            setInterval(function () { //定时刷新日志
                GetLogs();
            }, 3 * 1000);
        }
        $("#update-cache").click(function () {
            if (window.confirm("确定更新缓存么？")) {
                $.post("auth/updatecache", { }, function (result) {
                    alert(result.Message);
                }, "json");
            }
        });
    </script>
</body>
</html>
