<!DOCTYPE html>

<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="renderer" content="webkit">
    <title>服务查看</title>
    <link href="lib/dist/css/normalize.css" rel="stylesheet" />
    <link href="lib/dist/css/bootstrap.css" rel="stylesheet" />
</head>

<body class="panel panel-info">
    <div class="panel-heading"></div>
    <div class="panel-body">
        <ul id="content" class="list-group">
        </ul>
    </div>
    <script src="lib/jquery/jquery.js" type="text/javascript"></script>
    <script src="lib/js/common.js" type="text/javascript"></script>
    <script>
        var search = getQueryStringByName("p");
        var GetContent = function () {
            $.post("auth/services", { search: search }, function (result) {
                if (!result.IsError) {
                    var data = result.Data;
                    var array = [];
                    $(".panel-heading").html('服务数：<b style="color:red;">' + data.length + '</b>');
                    for (var i = data.length - 1; i >= 0; i--) {
                        array.push('<li class="list-group-item"><p>' + data[i] + '</p></li>');
                    }
                    $("#content").html(array.join(""));
                }
                delete result;
            }, "json");
        }
        GetContent();
    </script>
</body>
</html>
