    <script>

        var upperUrl = "common/jsonvalue";
        var timeFlag = false;
        var _YearStandBoxNum;
        var _NowYear;
        var layout = $("#layout").ligerLayout({
            topHeight: 300,
            heightDiff: -6
        });

        var portal = $("#portalMain").ligerPortal({
            rows: [{
                columns: [
                    { width: '100%', height: '100%', panels: [{ title: '待处理事项', height: '100%', width: '100%', showToggle: false, showMax: false, url: 'Home/HomeReminder.html' }] }
                ]
            }]
        });
        var app = {
            percentEchartData: null,
            outInEchartData: null,
            inventoryData: null,
            //设备维修情况（月）图表
            percentEchart: function (data) {
                var ChartPercent = echarts.init(document.getElementById("percent"));
                ChartPercent.clear(this.option);//清空数据缓存

                let option = {
                    tooltip: {
                        trigger: 'axis',
                        axisPointer: {
                            type: 'cross',
                            crossStyle: {
                                color: '#999'
                            }
                        }
                    },
                    toolbox: {
                        feature: {
                            dataView: { show: true, readOnly: false },
                            magicType: { show: true, type: ['line', 'bar'] },
                            restore: { show: true },
                            saveAsImage: { show: true }
                        }
                    },
                    legend: {
                        data: ['维修时长', '维修次数']
                    },
                    xAxis: [
                        {
                            type: 'category',
                            data: ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'],
                            axisPointer: {
                                type: 'shadow'
                            }
                        }
                    ],
                    yAxis: [
                        {
                            type: 'value',
                            name: '维修时长',
                            min: 0,
                            max: 50,
                            interval: 10,
                            axisLabel: {
                                formatter: '{value} 小时'
                            }
                        },
                        {
                            type: 'value',
                            name: '维修次数',
                            min: 0,
                            max: 50,
                            interval: 5,
                            axisLabel: {
                                formatter: '{value} 次'
                            }
                        }
                    ],
                    series: [
                        {
                            name: '维修时长',
                            type: 'bar',
                            data: data != null ? data.HourList : []
                        },
                        {
                            name: '维修次数',
                            type: 'bar',
                            data: data != null ? data.RepairList : []
                        },
                        //{
                        //    name: '平均温度',
                        //    type: 'line',
                        //    yAxisIndex: 1,
                        //    data: [2.0, 2.2, 3.3, 4.5, 6.3, 10.2, 20.3, 23.4, 23.0, 16.5, 12.0, 6.2]
                        //}
                    ]
                };


                option && ChartPercent.setOption(option, true);
                ChartPercent.getZr().off('click');
                ChartPercent.getZr().on('click', function (params) {
                    let pointInPixel = [params.offsetX, params.offsetY];
                    if (ChartPercent.containPixel('grid', pointInPixel)) {
                        let pointInGrid = ChartPercent.convertFromPixel({
                            seriesIndex: 0
                        }, pointInPixel);
                        let xIndex = pointInGrid[0];
                        let handleIndex = Number(xIndex);
                        var op = ChartPercent.getOption();
                        var month = op.xAxis[0].data[handleIndex].replace("月", "");
                        app.deviceUpBarGetData(month);
                        ChartPercent.resize()
                    };
                });
                window.addEventListener("resize", function () {
                    ChartPercent.resize();
                });

            },
            // 点击后触发月份的图表
            deviceUpBarEchart: function (data) {
                var ChartinventoryBar = echarts.init(document.getElementById("deviceUpBar"));
                ChartinventoryBar.clear(this.option);//清空数据缓存
                let option = {
                    color: ['#003366', '#006699', '#4cabce', '#e5323e'],
                    tooltip: {
                        trigger: 'axis',
                        axisPointer: {
                            type: 'shadow'
                        }
                    },
                    legend: {
                        data: ['维修时长', '维修次数']
                    },
                    toolbox: {
                        show: true,
