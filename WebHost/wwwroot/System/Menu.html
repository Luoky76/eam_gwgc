<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="renderer" content="webkit" />
    <title>菜单管理</title>
    <script src="../lib/LGboot.js" type="text/javascript"></script>
    <script src="iconify-icon.js" type="text/javascript"></script>
    <style type="text/css">
        @font-face {
            font-family: "Material Icons";
            font-style: normal;
            font-weight: 400;
            src: url(../m/dist/Framework7/fonts/MaterialIcons-Regular.eot);
            /* For IE6-8 */
            src: local("Material Icons"), local("MaterialIcons-Regular"), url(../m/dist/Framework7/fonts/MaterialIcons-Regular.woff2) format("woff2"), url(../m/dist/Framework7/fonts/MaterialIcons-Regular.woff) format("woff"), url(../m/dist/Framework7/fonts/MaterialIcons-Regular.ttf) format("truetype");
        }

        .material-icons {
            font-family: "Material Icons";
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            /* Preferred icon size */
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
            /* Support for all WebKit browsers. */
            -webkit-font-smoothing: antialiased;
            /* Support for Safari and Chrome. */
            text-rendering: optimizeLegibility;
            /* Support for Firefox. */
            -moz-osx-font-smoothing: grayscale;
            /* Support for IE. */
            font-feature-settings: "liga";
        }

        @font-face {
            font-family: "Framework7 Icons";
            font-style: normal;
            font-weight: 400;
            src: url("../m/dist/Framework7/fonts/Framework7Icons-Regular.eot");
            src: url("../m/dist/Framework7/fonts/Framework7Icons-Regular.woff2") format("woff2"), url("../m/dist/Framework7/fonts/Framework7Icons-Regular.woff") format("woff"), url("../m/dist/Framework7/fonts/Framework7Icons-Regular.ttf") format("truetype");
        }

        .f7-icons {
            font-family: "Framework7 Icons";
            font-weight: normal;
            font-style: normal;
            font-size: 25px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
            -moz-osx-font-smoothing: grayscale;
            -webkit-font-feature-settings: "liga";
            -moz-font-feature-settings: "liga=1";
            -moz-font-feature-settings: "liga";
            font-feature-settings: "liga";
            text-align: center;
        }
    </style>
</head>

<body style="padding: 2px; height: 100%;">
    <div id="layout">
        <div position="left" title="主菜单模块" id="mainmenu">
            <ul id="maintree"></ul>
        </div>
        <div position="center" title="子菜单列表">
            <div id="iframeloading" class='l-loading'>
            </div>
            <form id="mainform">
                <div id="maingrid"></div>
            </form>
        </div>
    </div>
    <ul class="iconlist"></ul>
    <script type="text/javascript">
        'use strict';
        var business = {
            iconifyReg: /[a-z0-9]+(?:-[a-z0-9]+)*:[a-z0-9]+(?:-[a-z0-9]+)*/i,
            menuNo: getQueryStringByName("MenuNo"),
            appname: getQueryStringByName("AppName"),
            iframeloading: $("#iframeloading"),
            selectNode: null,
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                        ]
                    },
                    grid: {
                        columns: [
                            { display: '菜单名', name: 'MENUNAME', width: 150, validate: { required: true }, editor: { type: 'text' } },
                            { display: '菜单编号', name: 'MENUNO', width: 130, validate: { required: true }, editor: { type: 'text' } },
                            { display: '上级菜单', name: 'MENUPARENTNO', width: 130, formatType: "select", editor: { type: 'select', data: [] } },
                            { display: '链接地址', name: 'MENUURL', width: 450, editor: { type: 'text' } },
                            {
                                display: '图标', name: 'MENUICON', width: 150, minWidth: 150, editor: { type: 'text' },
                                render: function (rowdata, rowindex, value, column) {
                                    if (!value) return "";
                                    var array = value.split(" ");
                                    if (me.iconifyReg.test(value)) {
                                        var color = array.length > 1 ? ' style="color: ' + array[array.length - 1] + '"' : "";
                                        return '<iconify-icon icon="' + array[0] + '"' + color + '></iconify-icon>';
                                    }
                                    if (value.indexOf("fa") >= 0) {
                                        return '<i class="fa ' + value + '"aria-hidden="true"></i>';
                                    }
                                    if (value.indexOf(".") >= 0) {
                                        return "<div style='width:100%;height:100%;'><img src='../" + value + "' /></div>";
                                    }
                                    return '<i class="' + value + '">' + array[array.length - 1] + '</i>';
                                }
                            },
                            { display: '菜单顺序', name: 'MENUORDER', width: 80, validate: { required: true }, editor: { type: 'int' } },
                            {
                                display: '可见', name: 'ISVISIBLE', align: 'center', width: 80, type: "text", formatType: 'chk', editor: {
                                    type: 'chkStr',
                                    data: [{ ID: true, TEXT: 1 }, { ID: false, TEXT: 0 }]
                                }
                            }
                        ]
                    }
                };
            },
            grid: null,
            searchForm: null,
            buttons: null,
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    title: '图标库 <a href="http://192.168.22.24/font/" target="_blank">http://192.168.22.24/font/</a>',
                    usePager: false,
                    autoWidth: true,
                    delayLoad: true,
                    rowKey:"MENUID",
                    columns: me.config.grid.columns,
                    dataAction: 'server',
                    toolbar: {},
                    url: 'menu/list',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: 'MENUORDER',
                    sortOrder: 'asc',
                    width: '100%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: true,
                    clickToEdit: true,
                    onSuccess: function (data, g) {
                        me.iframeloading.hide();
                    }
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "add":
                            me.add();
                            break;
                        case "delete":
                            me.delete();
                            break;
                        case "save":
                            me.save();
                            break;
                        case "buttons":
                            me.buttons();
                            break;
                        case "order":
                            me.order();
                            break;
                        case "generate":
                            me.generate();
                            break;
                        case "Excel":
                            $.ligerDialog.open({ url: "../System/Export.html?exporttype=xls&MenuNo=" + me.menuNo, modal: true });
                            break;
                        case "Pdf":
                            $.ligerDialog.open({ url: "../System/Export.html?exporttype=pdf&MenuNo=" + me.menuNo, modal: true });
                            break;
                    }
                }
                me.grid.set({
                    toolbar: {
                        "items": [
                            { id: "refresh", text: '刷新', click: me.toolbarBtnItemClick},
                            { line: true },
                            { id: "add", text: '增加', click: me.toolbarBtnItemClick },
                            { line: true },
                            { id: "save", text: '保存', click: me.toolbarBtnItemClick},
                            { line: true },
                            { id: "delete", text: '删除', click: me.toolbarBtnItemClick },
                            { line: true },
                            { id: "buttons", text: '操作按钮', click: me.toolbarBtnItemClick},
                            { line: true },
                            { id: "order", text: '自动序号', click: me.toolbarBtnItemClick},
                            { line: true },
                            { id: "generate", text: '生成图标', click: me.toolbarBtnItemClick}
                        ]
                    }
                });
            },
            buttons: function () {
                var me = this;
                var selected = me.grid.getSelected();
                if (!selected) {
                    var node = me.tree.getSelected();
                    if (node) {
                        var nodeData = node.data;
                        selected = { MENUNO: nodeData.ID, MENUNAME: nodeData.TEXT, APPNAME: nodeData.APPNAME };
                    }
                }
                if (!selected) return;
                $.ligerDialog.open({
                    width: 800,
                    height: 400,
                    allowClose: true,
                    title: selected.MENUNAME + ' 操作按钮管理',
                    url: 'MenuButton.html?MenuNo=' + selected.MENUNO + '&AppName=' + selected.APPNAME,
                    isHidden: false,
                    showMax: false,
                    showToggle: false,
                    showMin: false,
                    isResize: true,
                    slide: false,
                    data: {}
                });
            },
            add: function () { //新增
                var me = this;
                me.grid.addEditRow({ "APPNAME": me.appname, "MENUPARENTNO": me.currentMenuParentNo, "ISVISIBLE": 1 }, true);
            },
            generate: function () { //保存
                var me = this;
                LG.ajax({
                    jsToken: true,
                    url: 'menu/generate',
                    data: { appname: me.appname },
                    loading: '正在生成中...',
                    success: function () {
                        LG.showSuccess('生成成功');
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            order: function () {
                var me = this;
                var rows = me.grid.rows;
                var order = 0;
                for (var i = 0, l = rows.length; i < l; i++) {
                    var row = rows[i];
                    order += 10;
                    me.grid.updateRow(row, { MENUORDER: order });
                }
            },
            save: function () { //保存
                var me = this;
                if (me.grid.endEdit() != false) {
                    if (!me.grid.isDataChanged) {
                        LG.showSuccess('无修改');
                        return;
                    }
                    if (!me.grid.validChangeRows()) return false;
                    var changeRow = me.grid.getChangedRows();
                    LG.ajax({
                        jsToken: true,
                        url: 'menu/save',
                        loading: '正在保存中...',
                        data: changeRow,
                        success: function () {
                            LG.showSuccess('保存成功', function () {
                                me.grid.isDataChanged = false;
                                me.selectNode = me.tree.getSelected();
                                me.tree.reload();
                            });
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }

            },
            reload: function () { //刷新
                var me = this;
                me.grid.loadData();
            },
            delete: function () { //删除
                var me = this;
                if (me.grid.endEdit() != false) {
                    var selected = me.grid.getSelectedRows();
                    if (selected.length > 0) {
                        $.ligerDialog.confirm('确定删除吗?', function (confirm) {
                            if (confirm) {
                                for (var i = 0, len = (selected || []).length; i < len; i++) {
                                    me.grid.deleteRow(selected[i]);
                                }
                                me.save();
                            }
                        });
                    } else {
                        LG.tip('请选择行!');
                    }
                }
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Pdf',
                        text: '导出Pdf',
                        click: function (item) {
                            me.me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-word-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            setTree: function () {
                var me = this;
                var rootValue = "ROOT";
                me.tree = $("#maintree").ligerTree({
                    url: "menu/tree",
                    parms: {
                        appname: me.appname
                    },
                    slide: false,
                    checkbox: false,
                    single: true,
                    needCancel: false,
                    parentIDFieldName: 'PARENTID',
                    //iconClsFieldName: "ICON",
                    isExpand: 2,
                    filter: true,
                    onSuccess: function (data) {
                        var combData = [];
                        for (var i = 0, l = data.length; i < l; i++) {
                            var item = data[i];
                            if (item.ID !== rootValue) {
                                combData.push({ ID: item.ID, TEXT: item.TEXT });
                            }
                        }
                        me.grid.getColumnByName("MENUPARENTNO").editor.data = combData;
                        if (me.selectNode && me.selectNode.data) this.selectNode(me.selectNode.data.ID);
                    },
                    onSelect: function (node) {
                        me.iframeloading.show();
                        var nodeData = node.data;
                        var where = {};
                        if (nodeData) {
                            var parentNo = nodeData.ID;
                            where = {
                                rules: [{ field: "APPNAME", op: "equal", value: nodeData.APPNAME }],
                                groups: [{
                                    rules: [], op: "or"
                                }], op: "and"
                            };
                            if (parentNo === rootValue) {
                                parentNo = "";
                                where.groups[0].rules.push({ field: "MENUPARENTNO", op: "isnull" });
                            }
                            where.groups[0].rules.push({ field: 'MENUPARENTNO', value: parentNo, op: 'equal' });
                            me.grid.set('parms', { "where": JSON2.stringify(where) });
                            me.currentMenuParentNo = parentNo;
                            me.reload();
                        }
                    }
                });
            },
            init: function () {
                var me = this;
                $("#layout").ligerLayout({ leftWidth: 240 });
                me.iframeloading.show();
                me.setConfig();
                me.setGrid();
                me.setTree();
                return me;
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>
</html>
