<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="renderer" content="webkit" />
    <title></title>
    <script src="../lib/LGboot.js" type="text/javascript"></script>
    <script src="../lib/echarts/echarts.expand.js?ver=1" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <div id="mainsearch">
        <form action="" id="formsearch" class="l-form">
        </form>
    </div>
    <form action="" id="mainform">
        <div id="maingrid">
        </div>
    </form>
    <script type="text/javascript">
        'use strict';
        var business = {
            rows: null,
            columns: null,
            options: {},
            setGrid: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        icon: "fa fa-file-excel-o",
                        click: function (item) {
                            $.ligerDialog.open({
                                url: "../System/Export.html?exporttype=xls",
                                modal: true
                            });
                        }
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Pdf',
                        text: '导出Pdf',
                        icon: "fa fa-file-pdf-o",
                        click: function (item) {
                            $.ligerDialog.open({
                                url: "../System/Export.html?exporttype=pdf",
                                modal: true
                            });
                        }
                    }
                    ]
                });
                me.reportGrid = $("#maingrid").ligerGrid({
                    dateFormat: me.grid.options.dateFormat,
                    autoWidth: true,
                    columns: [],
                    checkbox: false,
                    usePager: false,
                    dataAction: 'local',
                    width: '100%',
                    height: '100%',
                    onContextmenu: function (_, e) {
                        menu.show({
                            top: e.pageY,
                            left: e.pageX
                        });
                        return false;
                    }
                });
            },
            getFormData: function () {
                var me = this;
                var formData = me.chartForm.getData();
                formData["category"] = me.chartForm.getEditor("category").getRows();
                formData["values"] = me.chartForm.getEditor("values").getRows();
                return formData;
            },
            handleGroupData: function (groups, values) {
                var data = [];
                for (var i = 0, l = groups.length; i < l; i++) {
                    var rows = groups[i];
                    var model = rows[0];
                    for (var j = 0, l2 = values.length; j < l2; j++) {
                        var item = values[j];
                        var sum = 0, maxScale = 0, sacle = maxScale;
                        for (var k = 0, l3 = rows.length; k < l3; k++) {
                            var row = rows[k];
                            var val = row[item.name] === undefined ? 1 : (parseFloat(row[item.name] || 0));
                            sacle = val.getScale();
                            if (sacle > maxScale) maxScale = sacle;
                            sum += val;
                        }
                        sacle = sum.getScale();
                        if (sacle > maxScale) {
                            sum = parseFloat(sum.toFixed(maxScale));
                        }
                        model[item.name] = sum;
                    }
                    data.push(model);
                }
                return data;
            },
            reload: function () {
                var me = this;
                if (!me.rows) return;
                var formData = me.getFormData();
                var data = window.__convertGroupData(me.rows, formData["category"]);
                var reportData = me.handleGroupData(data.group, formData["values"]);
                var columns = [].concat(formData["category"], formData["values"]);
                me.reportGrid.set({ columns: columns });
                me.reportGrid.set({ data: { Rows: reportData, Total: reportData.length } });
            },
            loadData: function () {
                var me = this;
                me.rows = me.grid.getDisplayRows();
                me.reload();
            },
            handleColumns: function () {
                var me = this;
                var columns = me.columns || [], categoryColumns = [], numberColumns = [{ name: "数量", display: "数量", type: "string" }];
                for (var i = 0, l = columns.length; i < l; i++) {
                    var column = columns[i];
                    var type = column.type;
                    if (type === "float" || type === "int") {
                        numberColumns.push($.extend(true, {}, column, { mergeColumn: false, totalSummary: { type: 'sum' } }));
                    }
                    else {
                        categoryColumns.push(column)
                    }
                }
                return { numberColumns: numberColumns, categoryColumns: categoryColumns };
            },
            setForm: function () {
                var me = this, opt = me.options;
                var obj = me.handleColumns(), numberColumns = obj.numberColumns, categoryColumns = obj.categoryColumns;
                me.chartForm = $("#formsearch").ligerForm({
                    fields: [{
                        display: "组", name: "category", type: "select", width: 200, options: {
                            render: function (_value, text) { return text; }, autocomplete: false,
                            valueField: "name", textField: "display", value: (categoryColumns.length === 1 ? categoryColumns[0].name : undefined),
                            data: categoryColumns, isMultiSelect: true, split: ",",
                            onChangeValue: me.loadData.bind(me)
                        }
                    }, {
                        display: "值", name: "values", type: "select", width: 200, options: {
                            render: function (_value, text) { return text; }, autocomplete: false,
                            valueField: "name", textField: "display", value: (numberColumns.length === 2 ? numberColumns[1].name : undefined),
                            data: numberColumns, isMultiSelect: true, split: ",",
                            onChangeValue: me.loadData.bind(me)
                        }
                    }],
                    space: 3,
                    validate: true,
                    buttons: [{
                        text: '刷新',
                        type: "primary",
                        width: 60,
                        click: function () {
                            me.loadData();
                        }
                    }]
                });
                if (opt.data) {
                    var formData = {};
                    if (opt.data.x !== undefined) formData.category = opt.data.x;
                    if (opt.data.y !== undefined) formData.values = opt.data.y;
                    me.chartForm.setOrginData(formData, false);
                }
            },
            initDialog: function () {
                var me = this;
                if (me.dialog.options.title === $.ligerDefaults.Dialog.title) {
                    var title = me.grid.get("title");
                    title = title ? title + "——" : "";
                    me.dialog.set({ title: title + "统计报表" });
                }
                var width = $(parent).width() - 30, height = $(parent).height() - 60;
                if (!me.dialog.options.width) me.dialog.resize(Math.min(width, 900), Math.min(height, 800));
                me.dialog.show();
            },
            loadConfig: function () {
                var me = this;
                var gridId = me.dialogData.gridid || getQueryStringByName("gridid") || "maingrid";
                var g = me.grid = parent.liger.get(gridId);
                me.options = me.dialogData.reportOptions || g.options.reportOptions || me.options;
                var columns = [];
                for (var i = 0, l = g.columns.length; i < l; i++) {
                    var column = g.columns[i];
                    if (column.issystem) continue;
                    if (!column.display) continue;
                    var item = { name: column.name, mergeColumn: true, display: column.display, type: g.getColumnRealType(column), format: column.format };
                    columns.push(item);
                }
                me.columns = columns;
            },
            init: function () {
                if (!frameElement || !frameElement.dialog) return;
                var me = this;
                me.dialog = frameElement.dialog;
                me.dialogData = me.dialog.get('data') || {};
                me.loadConfig();
                me.initDialog();
                me.setGrid();
                me.setForm();
                return me;
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>
</html>
