<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title> 数据表格打印</title>
    <script src="../lib/LGboot.js" type="text/javascript"></script>
    <script src="../lib/third-party/print/print.js" type="text/javascript"></script>
    <link rel="stylesheet" type="text/css" href="../../lib/third-party/print/print.css">
</head>

<body>
    <div>
        正在生成打印预览，请稍后...
    </div>
    <form id="printdiv"></form>
    <script type="text/javascript">
        var dialog = null;
        var dialogData = null;
        var waitTime = 3000;
        var callBack = null;
        if (frameElement && frameElement.dialog) dialog = frameElement.dialog; //调用页面的dialog对象(ligerui对象)
        if (dialog) {
            dialogData = dialog.get('data') || {}; //获取data参数
            waitTime = dialogData.waitTime || waitTime;
            var matchType = /^(chk|checkbox)/;
            var matchchk = /^(0|1)$/;
            var gridid = "";
            var title = "";

            function gethtml(g) {
                var managergrid = parent.liger.get(g);
                var columns = null;
                var rows = null;
                if (managergrid.exportExcel) {
                    var obj = managergrid.exportExcel();
                    if (obj && obj.columns) {
                        columns = obj.columns;
                    }
                    if (obj && obj.rows) {
                        rows = obj.rows;
                    }
                }
                if (!columns) {
                    columns = managergrid.columns;
                }
                if (!rows) {
                    rows = managergrid.rows;
                }
                var eColumns = [],
                    dColumns = [];
                for (var i = 0, l = columns.length; i < l; i++) {
                    var column = columns[i];
                    if (column && !column.isdetail && !column.ischeckbox && !column._hide) {
                        eColumns.push(column);
                    } else {
                        dColumns.push(column);
                    }
                }
                columns = eColumns;
                var gridhtmlarr = [];
                gridhtmlarr.push("<html xmlns:x=\"urn:schemas-microsoft-com:office:excel\"><head><meta http-equiv=\"Content-Type\" content=\"text/html; charset=UTF-8\"/></head><body>");
                gridhtmlarr.push("<table border = '1px'>");
                if (managergrid.options.title) {
                    gridhtmlarr.push("<tr><td colspan=\"" + columns.length + "\" style=\"text-align:center;\">" + managergrid.options.title + "</td></tr>");
                }
                if (managergrid._columnMaxLevel > 1) {
                    var $dom = $("<tbody>" + $("tbody", managergrid.gridheader).html() + "</tbody>");
                    $dom.find("td").filter(function (i, o) {
                        for (var l = dColumns.length - 1; l >= 0; l--) {
                            if (dColumns[l].__domid == o.id) {
                                return true;
                            }
                        }
                        return false;
                    }).remove();
                    gridhtmlarr.push($dom.html());
                } else {
                    gridhtmlarr.push("<tr>");
                    $(columns).each(function (columnindex, column) {
                        gridhtmlarr.push("<th>" + (column.display == undefined ? "" : column.display) + "</th>");
                    });
                    gridhtmlarr.push("</tr>");
                }
                for (var i = 0, len = (rows || []).length; i < len; i++) {
                    var row = rows[i];
                    gridhtmlarr.push("<tr ");
                    if (managergrid.options.rowAttrRender) gridhtmlarr.push(managergrid.options.rowAttrRender(row, row['__id']));
                    gridhtmlarr.push(">");
                    $(columns).each(function (columnindex, column) {
                        if (column.editor && column.editor.type && column.editor.type.match(matchType)) {
                            temp = (row[column.name] || "0").toString();
                            if (temp.match(matchchk)) {
                                gridhtmlarr.push("<td>" + (temp == "1" ? "是" : "否") + "</td>");
                            } else {
                                gridhtmlarr.push("<td >" + (temp) + "</td>");
                            }
                        } else {
                            gridhtmlarr.push("<td " + (column.type === "text" ? "x:str  t='s'" : "") + ">" + managergrid._getCellContent(row, column) + "</td>");
                        }
                    });
                    gridhtmlarr.push("</tr>");
                }
                var $totalsummary = $("tr.l-grid-totalsummary", (managergrid.enabledFrozen() ? managergrid.f.gridbody : managergrid.gridbody)).clone();
                $totalsummary.find("td.l-grid-totalsummary-cell-checkbox,td.l-grid-totalsummary-cell-detail").remove();
                gridhtmlarr.push($totalsummary.prop("outerHTML"));
                gridhtmlarr.push("</table>");
                gridhtmlarr.push($(".l-panel-bar-total", managergrid.element).html());
                gridhtmlarr.push("</body></html>");
                return gridhtmlarr.join('');
            }

            $(function () {
                
                gridid = getQueryStringByName("gridid");
                var title = getQueryStringByName("title");
                if (dialogData.gridid) gridid = dialogData.gridid;
                if (gridid) {
                    if (gridid == "") gridid = "maingrid";
                } else {
                    gridid = "maingrid";
                }
                var htmlContent = gethtml(gridid);
                var start = htmlContent.indexOf("<table");
                var end = htmlContent.indexOf("</table>") + 8;
                var tableStr = htmlContent.substring(start,end);
                var printDom = $("#printdiv");
                printDom.append(tableStr);
                printJS({ printable: 'printdiv', type: 'html', header: '<h3 class="custom-h3" style="text-align:center;">'+title+'</h3>', scanStyles: false,  css: '/print.css'});
                //var managergrid = parent.liger.get(gridid);
                //var columns = null;
                //var rows = null;
                //if (!rows) {
                //    rows = managergrid.rows;
                //}
                //if (!columns) {
                //    columns = managergrid.columns;
                //}
                //var properties = [];
                //var startTag = 0;
                ////grid如果有显示checkbox则过滤第一列checkbox
                //var isCheckBox = managergrid.options.checkbox;
                //if (isCheckBox) {
                //    startTag = 1;
                //}
                //for (var i = startTag, len = (columns || []).length; i < len; i++) {
                //    properties.push({ field: columns[i].name || "", displayName: columns[i].display || "" });
                //}
                ////处理数据中的null和undefind
                //for (var i = 0, len = (rows || []).length; i < len; i++) {
                //    var obj = rows[i];
                //    for (var key in obj) {
                //        if (obj[key] == null || obj[key] == undefined ) {
                //            obj[key] = "";
                //        }
                //    }
                //    rows[i] = obj;
                //}
                ////打印
                //printJS({
                //    printable: rows,
                //    properties: properties,
                //    type: 'json',
                //    header: '<h3 class="custom-h3">'+title+'</h3>',
                //});
                setTimeout(function () {
                    if (dialog) dialog.close();
                }, waitTime);
            });
        }
    </script>
</body>

</html>
