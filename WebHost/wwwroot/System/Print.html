<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title> 数据表格打印</title>
    <script src="../lib/LGboot.js" type="text/javascript"></script>
    <script src="../lib/js-export/html2canvas.js?ver=2" type="text/javascript"></script>
    <script src="../lib/third-party/print/print.all.js" type="text/javascript"></script>
    <link rel="stylesheet" type="text/css" href="../../lib/third-party/print/print.css">
</head>

<body>
    <div id="printdiv"></div>
    <div>
        正在生成打印预览，请稍后...
    </div>
    <script type="text/javascript">
        'use strict';
        var business = {
            grid: null,
            getHex: function (rgb) {
                if (rgb.indexOf("rgb") < 0) return rgb;
                var rgbs = rgb.match(/\d+/g);
                if (rgbs.length < 3) return rgb;
                return "#" + ((1 << 24) + (parseInt(rgbs[0]) << 16) + (parseInt(rgbs[1]) << 8) + parseInt(rgbs[2])).toString(16).slice(1);
            },
            getRowHtml: function (item, index, columns, data) {
                var me = this, g = me.grid, p = g.options;
                var rowid = item['__id'], colspan = columns.length;
                var isTreeGroupTemp = item['___treeGroupTemp'] === true;
                var gridhtmlarr = [], rowContent = "";
                gridhtmlarr.push("<tr ");
                gridhtmlarr.push(' class="l-grid-row');
                if (p.alternatingRow && item['__index'] % 2 == 1) gridhtmlarr.push(' l-grid-row-alt');
                if (p.rowClsRender) {
                    var rowcls = p.rowClsRender(item, rowid);
                    rowcls && gridhtmlarr.push(' ' + rowcls);
                }
                gridhtmlarr.push('" ');
                if (p.rowAttrRender) gridhtmlarr.push(p.rowAttrRender(item, rowid));
                gridhtmlarr.push(">");
                if (p.rowRender) {//行渲染器
                    rowContent = p.rowRender(item, rowid);
                    if (rowContent) {
                        gridhtmlarr.push('<td colspan="' + colspan + '">');
                        gridhtmlarr.push(rowContent);
                        gridhtmlarr.push('</td>');
                    }
                }
                if (isTreeGroupTemp) {
                    rowContent = g._getHtmlFromTreeGroupRow(item);
                }
                if (rowContent) {
                    gridhtmlarr.push(rowContent);
                    gridhtmlarr.push('</tr>');
                    return gridhtmlarr.join('');
                }
                for (var i = 0, l = columns.length; i < l; i++) {
                    var column = columns[i], rowSpan = 0;
                    if (column.mergeColumn) {
                        var name = (typeof column.mergeColumn === "string" && column.mergeColumn.length > 1) ? column.mergeColumn : column.name;
                        var toIndex = data.length - 1;
                        if (index > 0) {
                            var lastItem = data[index - 1];
                            if (item[name] == lastItem[name] && item['___groupindex'] === lastItem['___groupindex']) {
                                continue;
                            }
                        }
                        if (index < toIndex) {
                            var nextItem = data[index + 1];
                            if (item[name] == nextItem[name] && item['___groupindex'] === nextItem['___groupindex']) {
                                rowSpan = 2;
                                for (var k = index + 2; k <= toIndex; k++) {
                                    if (item[name] != data[k][name]) break;
                                    rowSpan++;
                                }
                            }
                        }
                    }
                    var content = column.export ? column.export.call(g, item[column.name], item, column) : g._getCellContent(item, column);
                    content = content || "";
                    if (content.indexOf && content.indexOf("l-checkbox") >= 0) {
                        content = content.indexOf("l-checkbox-checked") >= 0 ? "是" : "否";
                    }
                    gridhtmlarr.push('<td align="' + (column.align || "center") + '" ');
                    if (rowSpan > 0) gridhtmlarr.push(' rowspan="' + rowSpan + '" ');
                    var colType = column.exportType || column.type;
                    switch (colType) {
                        case "text":
                        case "string":
                            gridhtmlarr.push(' x:str ');
                            break;
                        case "float":
                        case "int":
                        case "number":
                            gridhtmlarr.push(' x:num ');
                            break;
                    }
                    gridhtmlarr.push('>' + content + '</td>');
                }
                gridhtmlarr.push('</tr>');
                return gridhtmlarr.join('');
            },
            getSummaryHtml: function (columns, data) {
                var me = this, g = me.grid;
                var gridhtmlarr = [];
                gridhtmlarr.push('<tr bgcolor="' + me.bgcolor + '">');
                for (var i = 0, l = columns.length; i < l; i++) {
                    var column = columns[i];
                    var content = g._getTotalCellContent(column, data);
                    gridhtmlarr.push('<td align="' + (column.align || "center") + '" ');
                    gridhtmlarr.push('>' + content + '</td>');
                }
                gridhtmlarr.push('</tr>');
                return gridhtmlarr.join('');
            },
            getTableHtml: function () {
                var me = this, g = me.grid, p = g.options;
                var oldColumns = g.columns;
                try {
                    var columns = g.columns || [];
                    var rows = g.rows || [];
                    me.bgcolor = me.getHex(g.gridheader.css("background-color"));
                    if (g.exportExcel) {
                        var obj = g.exportExcel();
                        if (obj) {
                            columns = obj.columns || columns;
                            rows = obj.rows || rows;
                            me.bgcolor = obj.bgcolor || me.bgcolor;
                        }
                    }
                    var eColumns = [], dColumns = [];
                    for (var i = 0, l = columns.length; i < l; i++) {
                        var column = columns[i];
                        if (column && !column.isdetail && !column.ischeckbox && !column._hide) {
                            eColumns.push(column);
                        } else {
                            dColumns.push(column);
                        }
                    }
                    columns = eColumns;
                    g.columns = columns;
                    var gridhtmlarr = [];
                    gridhtmlarr.push('<table id="export-table" border="3"><thead>');
                    var $head = $("tbody", g.gridheader).clone();
                    var $frozenHead = $("tbody>tr:first>td", g.f.gridheader).clone();
                    $frozenHead.attr("frozen", "1");
                    $("tr:first", $head).prepend($frozenHead);
                    $head.find("td").filter(function (i, o) {
                        if (!o.id) return true;
                        for (var l = dColumns.length - 1; l >= 0; l--) {
                            if (dColumns[l].__domid == o.id) {
                                return true;
                            }
                        }
                        return false;
                    }).remove();
                    $("tr", $head).attr("bgcolor", me.bgcolor);
                    if (p.title) {
                        gridhtmlarr.push('<tr bgcolor="' + me.bgcolor + '"><td colspan="' + columns.length + '" style="text-align:center;">' + p.title + '</td></tr>');
                    }
                    gridhtmlarr.push($head.html());
                    gridhtmlarr.push("</thead><tbody>");
                    for (var i = 0, len = rows.length; i < len; i++) {
                        var row = rows[i];
                        var rowHtml = me.getRowHtml(row, i, columns, rows);
                        var groupIndex = row["___groupindex"];
                        if (groupIndex !== undefined) {
                            var group = g.groups[groupIndex];
                            var lastIndex = i > 0 ? rows[i - 1]['___groupindex'] : null;
                            if (lastIndex !== groupIndex) {//第一行
                                gridhtmlarr.push(g._getHtmlFromGroupRow(row, i, false));
                            }
                            if (row === group[group.length - 1]) {//最后一行
                                gridhtmlarr.push(rowHtml);
                                rowHtml = "";
                                gridhtmlarr.push(me.getSummaryHtml(columns, group));
                            }
                        }
                        if (rowHtml) gridhtmlarr.push(rowHtml);
                    }
                    gridhtmlarr.push("</tbody><tfoot>");
                    if (g.isTotalSummary()) gridhtmlarr.push(me.getSummaryHtml(columns, rows));
                    var totalHtml = $(".l-panel-bar-total", g.element).html();
                    if (totalHtml) {
                        gridhtmlarr.push('<tr bgcolor="' + me.bgcolor + '"><td colspan="' + columns.length + '">');
                        gridhtmlarr.push(totalHtml);
                        gridhtmlarr.push('</td></tr>');
                    }
                    gridhtmlarr.push("</tfoot></table>");
                    return gridhtmlarr.join('');
                }
                catch (e) {
                    console.error(e);
                }
                finally {
                    g.columns = oldColumns;
                }
            },
            print: function (p) {
                var me = this;
                p = p || {};
                if (!p.header && me.title) {
                    p.header = '<h3 class="custom-h3" style="text-align:center;">' + me.title + '</h3>';
                }
                p.type = p.type || "html";
                if (p.onLoadingEnd) p._onLoadingEnd = p.onLoadingEnd;
                p.onLoadingEnd = function (a, b, c) {
                    if (p._onLoadingEnd) p._onLoadingEnd();
                    setTimeout(function () {
                        me.dialog.close();
                    }, 200);
                };
                if (p.type === "canvas") {
                    if (!p.printable) {
                        me.grid.body.css("width", (me.grid.gridtablebody.outerWidth() + 10) + "px");
                        p.printable = me.grid.body[0];
                        p._rever = true;
                    }
                    html2canvas(p.printable).then(function (canvas) {
                        if (p._rever) me.grid.body.css("width", "");
                        p.printable = canvas.toDataURL('image/png');
                        p.type = "image";
                        printJS(p);
                    });
                    return;
                }
                if (p.scanStyles === undefined) p.scanStyles = false;
                if (p.css === undefined) p.css = '/print.css';
                if (!p.printable) {
                    var tableHtml = me.getTableHtml();
                    $("#printdiv").html(tableHtml);
                    p.printable = "printdiv";
                }
                printJS(p);
            },
            init: function () {
                if (!frameElement || !frameElement.dialog) return;
                var me = this;
                me.dialog = frameElement.dialog;
                me.dialogData = me.dialog.get('data') || {};
                var gridId = me.dialogData.gridid || getQueryStringByName("gridid") || "maingrid";
                var type = me.dialogData.type || getQueryStringByName("type");//canvas截图打印
                me.grid = parent.liger.get(gridId);
                me.title = me.dialogData.title || getQueryStringByName("title");
                if (me.grid && me.grid.options) me.title = me.grid.options.title;
                var opt = $.extend({ type: type }, me.dialogData.options);
                me.print(opt);
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>

</html>
