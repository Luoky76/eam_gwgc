<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title>数据导出</title>
    <script src="../lib/LGboot.js" type="text/javascript"></script>
    <script src="../lib/js-export/shim.min.js" type="text/javascript"></script>
    <script src="../lib/js-export/xlsx.full.min.js" type="text/javascript"></script>
    <script src="../lib/js-export/Blob.js" type="text/javascript"></script>
    <script src="../lib/js-export/FileSaver.js" type="text/javascript"></script>
</head>

<body>
    <div>
        正在导出文件，请稍后...
    </div>
    <script type="text/javascript">
        var dialog = null;
        var dialogData = null;
        var waitTime = 3000;
        var callBack = null;
        if (frameElement && frameElement.dialog) dialog = frameElement.dialog; //调用页面的dialog对象(ligerui对象)
        if (dialog) {
            dialogData = dialog.get('data') || {}; //获取data参数
            waitTime = dialogData.waitTime || waitTime;
            callBack = dialogData.callBack;
            var gridid = "";
            var matchType = /^(chk|checkbox)/;
            var matchchk = /^(0|1)$/;
            var temp = "";

            function gethtml(g) {
                var managergrid = parent.liger.get(g);
                var columns = null;
                var rows = null;
                if (managergrid.exportExcel) {
                    var obj = managergrid.exportExcel();
                    if (obj && obj.columns) {
                        columns = obj.columns;
                    }
                    if (obj && obj.rows) {
                        rows = obj.rows;
                    }
                }
                if (!columns) {
                    columns = managergrid.columns;
                }
                if (!rows) {
                    rows = managergrid.rows;
                }
                var eColumns = [],
                    dColumns = [];
                for (var i = 0, l = columns.length; i < l; i++) {
                    var column = columns[i];
                    if (column && !column.isdetail && !column.ischeckbox && !column._hide) {
                        eColumns.push(column);
                    } else {
                        dColumns.push(column);
                    }
                }
                columns = eColumns;
                var gridhtmlarr = [];
                gridhtmlarr.push("<html xmlns:x=\"urn:schemas-microsoft-com:office:excel\"><head><meta http-equiv=\"Content-Type\" content=\"text/html; charset=UTF-8\" /></head><body>");
                gridhtmlarr.push("<table border = '3px'>");
                if (managergrid.options.title) {
                    gridhtmlarr.push("<tr><td colspan=\"" + columns.length + "\" style=\"text-align:center;\">" + managergrid.options.title + "</td></tr>");
                }
                if (managergrid._columnMaxLevel > 1) {
                    var $dom = $("<tbody>" + $("tbody", managergrid.gridheader).html() + "</tbody>");
                    $dom.find("td").filter(function (i, o) {
                        for (var l = dColumns.length - 1; l >= 0; l--) {
                            if (dColumns[l].__domid == o.id) {
                                return true;
                            }
                        }
                        return false;
                    }).remove();
                    gridhtmlarr.push($dom.html());
                } else {
                    gridhtmlarr.push("<tr>");
                    $(columns).each(function (columnindex, column) {
                        gridhtmlarr.push("<th>" + (column.display == undefined ? "" : column.display) + "</th>");
                    });
                    gridhtmlarr.push("</tr>");
                }
                for (var i = 0, len = (rows || []).length; i < len; i++) {
                    var row = rows[i];
                    gridhtmlarr.push("<tr ");
                    if (managergrid.options.rowAttrRender) gridhtmlarr.push(managergrid.options.rowAttrRender(row, row['__id']));
                    gridhtmlarr.push(">");
                    $(columns).each(function (columnindex, column) {
                        var content = column.export ? column.export.call(managergrid, row[column.name], row, column) : managergrid._getCellContent(row, column);
                        content = content || "";
                        if (content.indexOf && content.indexOf("l-checkbox") >= 0) {
                            content = content.indexOf("l-checkbox-checked") >= 0 ? "是" : "否";
                        }
                        gridhtmlarr.push("<td " + (column.type === "text" ? "x:str  t='s'" : "") + ">" + content + "</td>");
                    });
                    gridhtmlarr.push("</tr>");
                }
                var $totalsummary = $("tr.l-grid-totalsummary", (managergrid.enabledFrozen() ? managergrid.f.gridbody : managergrid.gridbody)).clone();
                $totalsummary.find("td.l-grid-totalsummary-cell-checkbox,td.l-grid-totalsummary-cell-detail").remove();
                gridhtmlarr.push($totalsummary.prop("outerHTML"));
                gridhtmlarr.push("</table>");
                gridhtmlarr.push($(".l-panel-bar-total", managergrid.element).html());
                gridhtmlarr.push("</body></html>");
                return gridhtmlarr.join('');
            }

            $(function () {
                gridid = getQueryStringByName("gridid");
                if (dialogData.gridid) gridid = dialogData.gridid;
                if (gridid) {
                    if (gridid == "") gridid = "maingrid";
                } else {
                    gridid = "maingrid";
                }
                var htmlContent = gethtml(gridid);
                var exportType = getQueryStringByName("exporttype") || dialogData.exporttype;
                var exportHtml = getQueryStringByName("exportHtml") || dialogData.exportHtml || "";
                if (exportType === "xls") exportType = "xlsx";
                if (exportType !== "doc" && (!exportHtml)) {
                    try {
                        var wb = XLSX.utils.table_to_book($(htmlContent).filter("table")[0], dialogData);
                        if (callBack) {
                            callBack(wb);
                        }
                        XLSX.writeFile(wb, (new Date()).format("yyyyMMddhhmmss.") + exportType);
                        setTimeout(function () {
                            if (dialog) dialog.close();
                        }, waitTime);
                        return;
                    } catch (e) {
                        exportType = "xlsx";
                    }
                }
                htmlContent = encrypt(htmlContent);
                var form = $('<form></form>');
                form.attr("action", '../Common/Export');
                form.attr("method", "post");
                form.attr("display", "none");
                form.append('<input type="hidden" name="exportType" value = "' + exportType + '"></input>');
                form.append('<input type="hidden" name="htmlContent" value = "' + htmlContent + '"></input>');
                for (var name in dialogData) {
                    form.append('<input type="hidden" name="' + name + '" value = "' + dialogData[name] + '"></input>');
                }
                $(document.body).append(form);
                form.submit();
                setTimeout(function () {
                    if (dialog) dialog.close();
                }, waitTime);
            });
        }
    </script>
</body>
</html>
