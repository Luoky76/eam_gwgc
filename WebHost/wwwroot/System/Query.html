<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title>报表</title>
    <script src="../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <div id="mainsearch">
        <form action="" id="formsearch" class="l-form">
        </form>
    </div>
    <form action="" id="mainform">
        <div id="maingrid">
        </div>
    </form>
    <script type="text/javascript">
        //初始化下拉框数据（在config之前）
        var IsOurCompany = window.session.IsOurCompany;
        var IsAdmin = window.session.IsAdmin;
        var MenuNo = getQueryStringByName("MenuNo");
        var config = {
            Grid: {},
            Form: {}
        };
        LG.ajax({
            async: false,
            url: 'common/queryconfig',
            loading: '努力加载中...',
            data: { viewName: MenuNo },
            success: function (data) {
                eval("config.Form=" + (data.FORM || "{}"));
                eval("config.Grid=" + (data.GRID || "{}"));
                if (!config.Grid.columns) {
                    var fields = data.Fields;
                    var columns = [];
                    for (var i = 0, l = fields.length; i < l; i++) {
                        var item = fields[i];
                        columns.push({ "display": item.Key, "name": item.Key, "type": item.Value });
                    }
                    if (!config.Grid.sortName && fields.length > 0) {
                        config.Grid.sortName = fields[0].Key;
                    }
                    config.Grid.columns = columns;
                }
            },
            error: function (message) {
                LG.showError(message);
            }
        });

        //相对路径
        var rootPath = "../";

        //右键菜单
        menu = $.ligerMenu({
            items:
                [
                    { id: 'Excel', text: '导出Excel', click: toolbarBtnItemClick, icon: "fa fa-file-excel-o" },
                    { line: true },
                    { id: 'Word', text: '导出Word', click: toolbarBtnItemClick, icon: "fa fa-file-word-o" }
                ]
        });

        $.extend($.ligerDefaults.Grid, {
            delayLoad: true,
            AutoWidth: true,
            checkbox: false,
            usePager: false,
            pageSize: 100,
            sortName: '1',
            sortOrder: 'asc',
            url: 'common/query',
            parms: {
                view: MenuNo,
            },
            ajaxOptions: {
                jsToken: true
            },
            width: '100%',
            height: '100%',
            onContextmenu: function (parm, e) {
                menu.show({ top: e.pageY, left: e.pageX });
                return false;
            }
        });

        //自动处理列2014年9月5日
        (function () {
            if (!config.Grid) return;
            config.Grid.usePager = config.Grid.usePager || false;
            if (!config.Grid.columns) return;
            for (var i = config.Grid.columns.length - 1; i >= 0; i--) {
                var column = config.Grid.columns[i];
                if (column.display.indexOf("隐藏") >= 0) {
                    config.Grid.columns.splice(i, 1);
                    return;
                }
                if (config.Grid.columnsAppend) {
                    for (var j = config.Grid.columnsAppend.length - 1; j >= 0; j--) {
                        var append = config.Grid.columnsAppend[j];
                        if (column.name == append.name) {
                            $.extend(column, append);
                            config.Grid.columnsAppend.splice(j, 1);
                            break;
                        }
                    }
                }
            }
        })();

        var formsearch = null;
        var buttons = [{ text: '查询', newline: false, width: 60, click: function () { LG.commonSearch($("#formsearch"), grid, config.Form.limit); } }];

        $.extend($.ligerDefaults.Form, {
            EnterMoveNextControl: true,
            validate: true,
            SearchClick: false,
            buttons: buttons,
            onAfterSetFields: function (g) {
                formsearch = g;
            }
        });
        if (!config.Form) config.Form = {};
        //表单
        formsearch = $("#formsearch").ligerForm(config.Form);
        //表格
        var grid = $("#maingrid").ligerGrid(config.Grid);
        //查询按钮
        if (config.Form.SearchClick) buttons[0].click();
        //工具条事件
        function toolbarBtnItemClick(item) {
            switch (item.id) {
                case "Excel":
                    $.ligerDialog.open({ url: "../System/Export.html?exporttype=xls", modal: true }); break;
                case "Word":
                    $.ligerDialog.open({ url: "../System/Export.html?exporttype=doc", modal: true }); break;
            }
        }
    </script>
</body>
</html>
