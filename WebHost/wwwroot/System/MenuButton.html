<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title>按钮管理</title>
    <script src="../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <form action="" id="mainform">
        <div id="maingrid">
        </div>
    </form>
    <script type="text/javascript">
        'use strict';
        var business = {
            menuNo: getQueryStringByName("MenuNo"),
            appname: getQueryStringByName("AppName"),
            setConfig: function () {
                var me = this;
                this.config = {
                    search: {
                        fields: [
                        ]
                    },
                    grid: {
                        columns: [
                            { display: '按钮编号', name: 'BTNNO', validate: { required: true }, editor: { type: 'text' } },
                            { display: '按钮名称', name: 'BTNNAME', validate: { required: true }, editor: { type: 'text' } },
                            { display: '序号', name: 'SEQNO', validate: { required: true }, editor: { type: 'int' } },
                            {
                                display: '图标', name: 'BTNICON', minWidth: 150, editor: { type: 'text' },
                                render: function (rowdata, rowindex, value, column) {
                                    if (!value) return "";
                                    if (value.indexOf("fa") >= 0) {
                                        return '<i class="fa ' + value + '"aria-hidden="true"></i>';
                                    }
                                    else if (value.indexOf(".") >= 0) {
                                        return "<div style='width:100%;height:100%;'><img src='../" + value + "' /></div>";
                                    }
                                    else {
                                        var array = value.split(" ");
                                        return '<i class="' + value + '">' + array[array.length - 1] + '</i>';

                                    }
                                }
                            },
                            { display: '样式', name: 'BTNCLASS', editor: { type: 'text' } },
                            { display: '组', name: 'INITSTATUS', editor: { type: 'text' } },
                            { display: '提示信息', name: 'BTNSCRIPT', editor: { type: 'text' } }
                        ]
                    }
                };
            },
            grid: null,
            searchForm: null,
            buttons: null,
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    usePager: false,
                    autoWidth: true,
                    delayLoad: false,
                    columns: me.config.grid.columns,
                    dataAction: 'server',
                    toolbar: {},
                    url: 'button/list',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: [{ field: 'APPNAME', op: 'equal', value: me.appname }, { field: 'MENUNO', value: me.menuNo, op: 'equal' }]
                        })
                    },
                    sortName: 'SEQNO',
                    sortOrder: 'asc',
                    width: '100%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: true,
                    clickToEdit: true
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "add":
                            me.add();
                            break;
                        case "delete":
                            me.delete();
                            break;
                        case "save":
                            me.save();
                            break;
                        case "batchAdd":
                            me.batchAdd();
                            break;
                        case "clear":
                            me.clear();
                            break;
                        case "Excel":
                            $.ligerDialog.open({ url: "../System/Export.html?exporttype=xls&MenuNo=" + me.menuNo, modal: true });
                            break;
                        case "Pdf":
                            $.ligerDialog.open({ url: "../System/Export.html?exporttype=pdf&MenuNo=" + me.menuNo, modal: true });
                            break;
                    }
                }
                me.grid.set({
                    toolbar: {
                        "items": [
                            { id: "refresh", text: '刷新', click: me.toolbarBtnItemClick, icon: "fa fa-refresh" },
                            { line: true },
                            { id: "add", text: '增加', click: me.toolbarBtnItemClick, icon: "fa fa-plus" },
                            { line: true },
                            { id: "save", text: '保存', click: me.toolbarBtnItemClick, icon: "fa fa-save" },
                            { line: true },
                            { id: "delete", text: '删除', click: me.toolbarBtnItemClick, icon: "fa fa-times" },
                            { line: true },
                            { id: "batchAdd", text: '快速增加 【增删改查】', click: me.toolbarBtnItemClick, icon: "fa fa-bolt" },
                            { line: true },
                            { id: "clear", text: '清空按钮', click: me.toolbarBtnItemClick, icon: "fa fa-eraser" }
                        ]
                    }
                });
            },
            batchAdd: function () {
                var me = this;
                $.ligerDialog.confirm('确定增加多个按钮吗?', function (confirm) {
                    if (!confirm) return;
                    LG.ajax({
                        url: 'button/batchAdd',
                        loading: '正在增加按钮中...',
                        data: { appname: me.appname, menuNo: me.menuNo },
                        success: function () {
                            LG.showSuccess('快速增加按钮成功', function () {
                                me.reload();
                            });
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                });
            },
            clear: function () {
                var me = this;
                $.ligerDialog.confirm('确定清空按钮吗?', function (confirm) {
                    if (!confirm) return;
                    LG.ajax({
                        url: 'button/clear',
                        loading: '正在增加按钮中...',
                        data: { appname: me.appname, menuNo: me.menuNo },
                        success: function () {
                            LG.showSuccess('清空按钮成功', function () {
                                me.reload();
                            });
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                });
            },
            add: function () { //新增
                var me = this;
                me.grid.addEditRow({ "APPNAME": me.appname, "MENUNO": me.menuNo }, true);
            },
            save: function () { //保存
                var me = this;
                if (me.grid.endEdit() != false) {
                    if (!me.grid.isDataChanged) {
                        LG.showSuccess('无修改');
                        return;
                    }
                    if (!me.grid.validChangeRows()) return false;
                    var changeRow = me.grid.getChangedRows();
                    LG.ajax({
                        jsToken: true,
                        url: 'button/save',
                        loading: '正在保存中...',
                        data: changeRow,
                        success: function () {
                            LG.showSuccess('保存成功', function () {
                                me.grid.isDataChanged = false;
                                me.reload();
                            });
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }

            },
            reload: function () { //刷新
                var me = this;
                me.grid.loadData();
            },
            delete: function () { //删除
                var me = this;
                if (me.grid.endEdit() != false) {
                    var selected = me.grid.getSelectedRows();
                    if (selected.length > 0) {
                        $.ligerDialog.confirm('确定删除吗?', function (confirm) {
                            if (confirm) {
                                for (var i = 0, len = (selected || []).length; i < len; i++) {
                                    me.grid.deleteRow(selected[i]);
                                }
                                me.save();
                            }
                        });
                    } else {
                        LG.tip('请选择行!');
                    }
                }
            },
            bindGridEvent: function () {
                var me = this;
                var menu = $.ligerMenu({
                    items: [{
                        id: 'Excel',
                        text: '导出Excel',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-excel-o"
                    },
                    {
                        line: true
                    },
                    {
                        id: 'Pdf',
                        text: '导出Pdf',
                        click: function (item) {
                            me.toolbarBtnItemClick(item);
                        },
                        icon: "fa fa-file-word-o"
                    }
                    ]
                });
                me.grid.bind("contextmenu", function (parm, e) {
                    menu.show({
                        top: e.pageY,
                        left: e.pageX
                    });
                    return false;
                });
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            init: function () {
                var me = this;
                me.setConfig();
                me.setGrid();
                return me;
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>
</html>
