<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title>页面配置信息 明细</title>
    <script src="../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <form id="mainform">
    </form>
    <script type="text/javascript">
        'use strict';
        var business = {
            dialogData: {},
            isAddNew: false,
            isView: true,
            sid: getQueryStringByName("sid"),
            setConfig: function () {
                var me = this;
                var width = $(window).width() - 200, height = ($(window).height() - 120) / 3;
                me.config = {
                    form: {
                        fields: [
                            { name: "CONFIGID", type: "hidden" },
                            { display: "视图名/表名", name: "VIEWS", newline: true, type: "text" },
                            {
                                display: "grid配置信息(js)", name: "GRID", newline: true, width: width, type: "textarea", options: {
                                    height: height
                                }
                            },
                            {
                                display: "search配置信息(sql)", name: "SEARCH", newline: true, width: width, type: "textarea", options: {
                                    height: height
                                }
                            },
                            {
                                display: "form配置信息(js)", name: "FORM", newline: true, width: width, type: "textarea", options: {
                                    height: height
                                }
                            }
                        ]
                    }
                };
            },
            mainform: null,
            buttons: null,
            loadComboxData: function () {
            },
            loadData: function () {
                var me = this;
                me.loadComboxData();
                if (me.isAddNew) {
                    me.mainform.setOrginData({});
                }
                else {
                    LG.ajax({
                        async: false,
                        url: 'configuration/get',
                        loading: '正在获取中...',
                        data: { id: me.sid },
                        success: function (data) {
                            data.OLDCONFIGID = data.CONFIGID;
                            data.OLDMODIFYDATE = data.MODIFYDATE;
                            me.mainform.setOrginData(data);
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                    if (me.isView) {
                        me.mainform.setReadonly(true);
                    }
                }
                me.mainform.focus();
            },
            save: function () { //保存
                var me = this;
                if ($.isEmptyObject(me.mainform.getChanges())) {
                    LG.showSuccess('无修改');
                    return;
                }
                if (!me.mainform.valid()) {
                    me.mainform.showInvalid();
                    return;
                }
                function handle(data) {
                    data.GRID = encrypt(data.GRID);
                    data.SEARCH = encrypt(data.SEARCH);
                    data.FORM = encrypt(data.FORM);
                    return data;
                }
                var data = handle(me.mainform.getData());
                var original = handle(me.mainform.getOrginData());
                var changeRow = new Object();
                if (me.isAddNew) {
                    changeRow["added"] = [data];
                }
                else {
                    changeRow["updated"] = [data];
                    changeRow["original"] = [original];
                }
                LG.ajax({
                    jsToken: true,
                    url: 'configuration/save',
                    loading: '正在保存中...',
                    data: changeRow,
                    success: function () {
                        LG.showSuccess('保存成功', function () {
                            location.reload(true);
                        });
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            closeQuery: function (callback) {
                var me = this;
                if (me._skipConfirm === true || $.isEmptyObject(me.mainform.getChanges())) {
                    callback();
                    delete me._skipConfirm;
                    return;
                }
                $.ligerDialog.confirm($.ligerDefaults.GridString.isContinueByDataChanged, function (confirm) {
                    if (!confirm) return;
                    callback();
                });
            },
            close: function (skipConfirm) {
                var me = this;
                me._skipConfirm = skipConfirm === true ? true : false;
                if (me.dialog) {
                    me.dialog.close();
                    return;
                }
                me.closeQuery(function () {
                    var win = parent || window;
                    if (win.closeCurrentTab) win.closeCurrentTab();
                    else win.close();
                });
            },
            setFormDefaultBtn: function () {
                var me = this;
                //表单底部按钮
                var buttons = [];
                if (!me.isView) {
                    buttons.push({
                        text: '重置', onclick: function () {
                            $.ligerDialog.confirm("确定重置数据吗?", function (confirm) {
                                if (confirm) {
                                    me.loadData();
                                }
                            });
                        }
                    });
                }
                buttons.push({ text: '关闭', onclick: function () { me.close(); } });
                if (!me.isView) buttons.push({ text: '保存', onclick: function () { me.save() } });
                LG.addFormButtons(buttons);
                me.formButtons = buttons;
            },
            setForm: function () {
                var me = this;
                me.config.form.fields.removeNull();
                var $formsearch = $("#mainform")
                //搜索表单应用ligerui样式
                me.mainform = $formsearch.ligerForm({
                    enterMoveNextControl: true,
                    labelAlign: 'right',
                    space: 3,
                    validate: true,
                    fields: me.config.form.fields,
                    labelWidth: 150,
                    onAfterSetFields: function (g) {
                        me.mainform = g;
                        me.buttons = g.options.buttons;
                    }
                });
                me.setFormDefaultBtn();
            },
            init: function () {
                var me = this;
                if (frameElement && frameElement.dialog) {
                    me.dialog = frameElement.dialog;
                    if (me.closeQuery) me.dialog.options.closeQuery = me.closeQuery.bind(me);
                    me.dialogData = me.dialog.get('data');
                    me.callback = me.dialogData.callback;
                    if (me.dialogData.sid) me.sid = me.dialogData.sid
                    me.isView = me.dialogData.view === "1";
                }
                if ((me.sid || "0") === "0") me.sid = "";
                me.isAddNew = (me.sid === "");
                me.isView = false;
                me.setConfig();
                me.setForm();
                me.loadData();
                return me;
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>
</html>
