<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title>统计图表</title>
    <script src="../lib/echarts/echarts.js?ver=1" type="text/javascript"></script>
    <script src="../lib/LGboot.js" type="text/javascript"></script>
    <script src="../lib/echarts/echarts.expand.js?ver=1" type="text/javascript"></script>
    <style type="text/css">
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            box-sizing: border-box;
            padding: 1px 3px;
        }

        .l-form {
            margin-top: 3px;
            margin-bottom: 0px;
        }

        .full {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <form action="" id="char-form"></form>
    <div id="layout-panel">
        <div position="center">
            <div id="main" class="full"></div>
        </div>
    </div>
    <script type="text/javascript">
        'use strict';
        var business = {
            rows: null,
            columns: null,
            chartOpt: {},
            charTypes: [{ name: "bar", display: "柱状图" }, { name: "stack", display: "堆叠柱状图" }, { name: "line", display: "折线图" }, { name: "pie", display: "饼图" }, { name: "scatter", display: "散点图" }],
            handleColumns: function () {
                var me = this;
                var columns = me.columns || [], categoryColumns = [], numberColumns = [{ name: "数量", display: "数量", type: "string" }];
                for (var i = 0, l = columns.length; i < l; i++) {
                    var column = columns[i];
                    var type = column.type;
                    var item = { name: column.name, display: column.display, type: type };
                    if (type === "float" || type === "int") {
                        numberColumns.push(item)
                    }
                    else {
                        categoryColumns.push(item)
                    }
                }
                return { numberColumns: numberColumns, categoryColumns: categoryColumns };
            },
            setChartForm: function () {
                var me = this, chartOpt = me.chartOpt;
                var obj = me.handleColumns(), numberColumns = obj.numberColumns, categoryColumns = obj.categoryColumns;
                me.chartForm = $("#char-form").ligerForm({
                    fields: [{
                        display: "类型", name: "type", type: "select", width: 120, options: {
                            valueField: "name", textField: "display",
                            data: me.charTypes, autocomplete: true, isMultiSelect: false, split: ",", value: "bar",
                            onChangeValue: me.reload.bind(me)
                        }
                    }, {
                        display: "组", name: "category", type: "select", width: 200, options: {
                            render: function (_value, text) { return text; }, autocomplete: false,
                            valueField: "name", textField: "display", value: (categoryColumns.length === 1 ? categoryColumns[0].name : undefined),
                            data: categoryColumns, isMultiSelect: true, split: ",",
                            onChangeValue: me.reload.bind(me)
                        }
                    }, {
                        display: "值", name: "values", type: "select", width: 200, options: {
                            render: function (_value, text) { return text; }, autocomplete: false,
                            valueField: "name", textField: "display", value: (numberColumns.length === 2 ? numberColumns[1].name : undefined),
                            data: numberColumns, isMultiSelect: true, split: ",",
                            onChangeValue: me.reload.bind(me)
                        }
                    }],
                    space: 3,
                    validate: true,
                    buttons: [{
                        text: '刷新',
                        type: "primary",
                        width: 60,
                        click: function () {
                            me.loadData();
                        }
                    }]
                });
                if (chartOpt.data) {
                    var formData = {};
                    if (chartOpt.data.x !== undefined) formData.category = chartOpt.data.x;
                    if (chartOpt.data.y !== undefined) formData.values = chartOpt.data.y;
                    me.chartForm.setOrginData(formData, false);
                }
                if (chartOpt.show === false) me.chartForm.form.hide();
            },
            getFormData: function () {
                var me = this;
                var formData = me.chartForm.getData();
                formData["category"] = me.chartForm.getEditor("category").getRows();
                formData["values"] = me.chartForm.getEditor("values").getRows();
                formData.type = (formData.type || "").split(",");
                return formData;
            },
            reload: function () {
                var me = this, chartOpt = me.chartOpt;
                if (!me.rows) return;
                var formData = me.getFormData();
                var options = echarts.getOptionsFromData(me.rows, formData);
                if (chartOpt.options) {
                    if (typeof chartOpt.options === "function") {
                        options = chartOpt.options(options, me) || options;
                    }
                    else {
                        $.extend(true, options, chartOpt.options);
                    }
                }
                me.chart.setOption(options, true);
            },
            loadData: function () {
                var me = this;
                me.rows = me.grid.getDisplayRows();
                me.reload();
            },
            loadConfig: function () {
                var me = this;
                var gridId = me.dialogData.gridid || getQueryStringByName("gridid") || "maingrid";
                var g = me.grid = parent.liger.get(gridId);
                me.chartOpt = me.dialogData.chartOptions || g.options.chartOptions || me.chartOpt;
                var columns = [];
                for (var i = 0, l = g.columns.length; i < l; i++) {
                    var column = g.columns[i];
                    if (column.issystem) continue;
                    if (!column.display) continue;
                    var item = { name: column.name, display: column.display, type: g.getColumnRealType(column) };
                    columns.push(item);
                }
                me.columns = columns;
            },
            initDialog: function () {
                var me = this;
                if (me.dialog.options.title === $.ligerDefaults.Dialog.title) {
                    var title = me.grid.get("title");
                    title = title ? title + "——" : "";
                    me.dialog.set({ title: title + "统计图表" });
                }
                var width = $(parent).width() - 30, height = $(parent).height() - 60;
                if (!me.dialog.options.width) me.dialog.resize(Math.min(width, 900), Math.min(height, 800));
                me.dialog.show();
            },
            initLayout: function () {
                var me = this;
                me.setChartForm();
                me.layout = $("#layout-panel").ligerLayout({
                    onResize: function () {
                        me.chart.resize();
                    }
                });
                me.chart = echarts.init(document.getElementById('main'), null, { renderer: (me.chartOpt.renderer || 'svg') });
            },
            init: function () {
                if (!frameElement || !frameElement.dialog) return;
                var me = this;
                me.dialog = frameElement.dialog;
                me.dialogData = me.dialog.get('data') || {};
                me.loadConfig();
                me.initDialog();
                me.initLayout();
                me.loadData();
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>
</html>
