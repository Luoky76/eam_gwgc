<body style="overflow-y:hidden">

    <script type="text/javascript">
        var acceptListData = [], deptListData = [], leaderListData = [], userListData = [], ArticleListData = [];
        var dict = {
            "acceptList": acceptListData,
            "deptList": deptListData,
            "leaderList": leaderListData,
            "userList": userListData,

            "visitList": VisitorList

        var tab = $("#tabContainer").ligerTab({ type: "brief" });
        var acceptList = $("#acceptList").ligerListBox({ width: '100%', height: '100%', isShowCheckBox: false, filter: false, onSelected: f_openMenu, data: [] });
        var deptList = $("#deptList").ligerListBox({ width: '100%', height: '100%', isShowCheckBox: false, filter: false, onSelected: f_openMenu, data: [] });
        var leaderList = $("#leaderList").ligerListBox({ width: '100%', height: '100%', isShowCheckBox: false, filter: false, onSelected: f_openMenu, data: [] });
        var userList = $("#userList").ligerListBox({ width: '100%', height: '100%', isShowCheckBox: false, filter: false, onSelected: f_openMenu2, data: [] });
        var ArticleList = $("#ArticleList").ligerListBox({ width: '100%', height: '100%', isShowCheckBox: false, filter: false, onSelected: opendialog, data: [] });
        var VisitorList = $("#visitList").ligerListBox({ width: '100%', height: '100%', isShowCheckBox: false, filter: false, onSelected: f_openMenu3, data: [] });
        tab.setHeader("RecentRelease", "近期发布<span style=\" color: red\">[10]</span>");
        //在tab选择的时候才加载数据
        tab.bind('afterSelectTabItem', function (tabid) {
           
            //f_loadListData(tabid);
        });

        function opendialog(value, text, data) {
          top.$.ligerDialog.open({
                width: 960,
                height: 700,
                allowClose: true,
                title: '[查看]',
                url: "/public/bulletin-view.html",
                isHidden: false,
                showMax: false,
                showToggle: false,
                showMin: false,
                isResize: true,
                slide: false,
                onClosed: null,
                data: { "sid": data.ID, source: data.TABLE_NAME }
            });
        }
        function createdata(tabdata,id,chooseData) {
            var selectTextList = { chooseNo: "", No: [] };
            if (id == "acceptList" || id == "deptList" || id == "leaderList") {
                let pattern = /（(.*?)）/;
                let chooseNoobj = chooseData.TEXT.match(/（(.*?)）/);
                let chooseNo = chooseNoobj ? chooseNoobj[1] : chooseData.TEXT.substr(14, 14)
                let type = chooseData.TABLE_NAME;
                tabdata.forEach((item) => {
                    if (type == item.TABLE_NAME) {
                        let text = item.TEXT;
                        let result = text.match(pattern);
                        let number = '';
                        if (result && result.length >= 2) {
                            number = result[1];
                            if (number == chooseNo) {
                                selectTextList.chooseNo = number
                                selectTextList.No.push(number);

                            }

                        }
                        else {
                            number = chooseData.TEXT.substr(14, 14);
                            if (number == chooseNo) {
                                selectTextList.chooseNo = number;
                                selectTextList.No.push(number);

                            }
                        }

                    }

                });

                sessionStorage.removeItem('selectText');
                sessionStorage.setItem('selectText', JSON.stringify(selectTextList));

                return selectTextList;
                

            }

        }


        //点击待处理事项，打开功能菜单
        function f_openMenu(value, text, data) {
           
            
            var applyNO = data.TEXT.substr(14, 14);
            if (applyNO && data.ValueFieldID)
                deploy2(data.ValueFieldID, applyNO);
            createdata(dict[this.id], this.id, data);
        };

        function f_openMenu2(value, text, data) {
            var selected = data.TEXT.match(/【(\S*)】/)[1];
            if (selected && data.ValueFieldID)
                deploy2(data.ValueFieldID, escape(selected));
        };

        function f_openMenu3(value, text, data) {
            var selected = data.ID;
            if ( data.ValueFieldID)
               deploy2(data.ValueFieldID, escape(selected));
        };
        function deploy2(menuNo, selected) {
            if (menuNo) {
                let menuListJSon = JSON.stringify(top.menuList);
                let menuList = JSON.parse(menuListJSon);
                let menuobj = menuList.find(x => x.MENUNO == menuNo);
                if (menuobj) {
                    menuobj.title = menuobj.text;
                    menuobj.close = true;
                    if (menuobj.url.includes('&selectedText=')) {
                        var currentValue = menuobj.url.split('&selectedText=')[1];
                        var updatedValue = selected;
                        menuobj.url = menuobj.url.replace('&selectedText=' + currentValue, '&selectedText=' + updatedValue);
                    } else {
                        menuobj.url = menuobj.url + '&selectedText=' + selected;
                    }

                    // 添加Tabs
                    top.addTabs(menuobj);
                }

            }
        }
        //setInterval(function () {
        //    f_loadListData("ApplyAccept");

                if (typeId == "ApplyAccept") {

                }
                else if (typeId == "ApplyDept") {
                    deptListData = data.listData;

                else if (typeId == "ApplyLeader") {

                }

                tab.setHeader("ApplyAccept", "待受理申请<span style=\" color: red\">[" + data.listCount.AcceptNum + "]</span>");
                tab.setHeader("ApplyDept", "待部门审核申请<span style=\" color: red\">[" + data.listCount.DeptNum + "]</span>");

        $("#layout", parent.document).css("height", "300px")
        $(".l-layout-center", parent.document).css("height", "300px")
