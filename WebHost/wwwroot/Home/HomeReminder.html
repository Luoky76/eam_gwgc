<body style="overflow-y:hidden">
    <div id="tabContainer" style="margin: 2px; ">
        <div title="维修计划[0]" tabid="exe" style=" overflow-y: auto; ">
            <div>
                <div id="exeList"></div>
            </div>
        </div>
        <div title="维修计划验收[0]" tabid="check" style="  overflow-y: auto; ">

        <div title="委外维修验收[0]" tabid="ExtMainteCheck" style=" overflow-y: auto; ">
            <div>
                <div id="ExtMainteCheckList"></div>

        </div>
        <div title="码头维修实施[0]" tabid="RepDockExe" style=" overflow-y: auto; ">
            <div>
                <div id="RepDockExeList"></div>
            </div>
        </div>
        <div title="码头维修确认[0]" tabid="RepDockConfirm" style=" overflow-y: auto; ">
            <div>
                <div id="RepDockConfirmList"></div>
            </div>
        </div>
        <div title="维保实施[0]" tabid="PmPlanExe" style=" overflow-y: auto; ">
            <div>
                <div id="PmPlanExeList"></div>
            </div>
        </div>
    </div>
    <script type="text/javascript">

        var tab = $("#tabContainer").ligerTab({ type: "brief" });
        var business = {};
        var idLIst = ['exe', 'check', 'ExtMainteCheck', 'ExtCheck', 'RepDockExe', 'RepDockConfirm', 'PmPlanExe']
        //在tab选择的时候才加载数据
        tab.bind('afterSelectTabItem', function (tabid) {

            f_loadListData(tabid);
        });

        function createdata(key, chooseData) {
            var selectTextList = { chooseNo: "", IDKEY: "" };
            selectTextList.chooseNo = chooseData;
            selectTextList.IDKEY = key;
            sessionStorage.removeItem('selectText');
            sessionStorage.setItem('selectText', JSON.stringify(selectTextList));
            return selectTextList;



        }


        //点击待处理事项，打开功能菜单
        function f_openMenu(arg, ID, TEXT, data, key) {
            var applyNO = TEXT.split(",")[0];
            deploy2(data.MENUNAME, applyNO);
            createdata(key, applyNO);
        };



        function deploy2(menuNo, selected) {
            if (menuNo) {
                let menuListJSon = JSON.stringify(top.menuList);
                let menuList = JSON.parse(menuListJSon);
                let menuobj = menuList.find(x => x.MENUNO == menuNo);
                if (menuobj) {
                    menuobj.title = menuobj.text;
                    menuobj.close = true;
                    if (menuobj.url.includes('&selectedText=')) {
                        var currentValue = menuobj.url.split('&selectedText=')[1];
                        var updatedValue = selected;
                        menuobj.url = menuobj.url.replace('&selectedText=' + currentValue, '&selectedText=' + updatedValue);
                    } else {
                        menuobj.url = menuobj.url + '&selectedText=' + selected;
                    }

                    // 添加Tabs
                    top.addTabs(menuobj);
                }

            }
        }
        //setInterval(function () {
        //    f_loadListData("ApplyAccept");
        //}, 60000)

        //加载数据

        f_loadListData()


        function f_loadListData() {
            LG.ajax({
                async: false,
                url: 'welcome/GetTodoListData',
                loading: '正在获取中...',
                success: function (data) {
                    if (data) {
                        for (let i = 0; i < idLIst.length; i++) {
                            let key = idLIst[i];
                            let keyList = key + 'List';
                            var count = data[key] ?? 0;
                            var dataList = data[keyList] ?? null;
                            tab.setHeader(key, `${data[(key + 'Title')]}<span style=\" color: red\">[${count}]</span>`);
                            $("#" + keyList).ligerListBox({ width: '100%', height: '100%', isShowCheckBox: false, filter: false, onSelected: f_openMenu, data: dataList });
                        }
                    }

                },
                error: function (message) {
                    LG.showError(message);
                }
            });
        }
        $("#layout", parent.document).css("height", "300px")
        $(".l-layout-center", parent.document).css("height", "300px")
        $('#portalMain', parent.document).css("height", "300px")
        $('.l-tab-content').css("height", "300px")
        $(".l-panel-content-frame", parent.document).css("height", "300px")

            //}
