<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title>查看数据表</title>
    <script src="../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <div id="mainsearch" style="display:none;">
        <form action="" id="formsearch" class="l-form">
        </form>
    </div>
    <form action="" id="mainform">
        <div id="maingrid">
        </div>
    </form>
    <script type="text/javascript">
        'use strict';
        var business = {
            dataStatus: [{ ID: true, TEXT: true }, { ID: false, TEXT: false }],
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            { display: "名称", name: "_search_Name", dbname: "Name", type: "text" }
                        ]
                    },
                    grid: {
                        columns: [
                            { display: "名称", name: "Name", type: "text" },
                            { display: "描述", name: "Comment", type: "text" },
                            { display: "类型", name: "CsType", type: "text" },
                            { display: "主键", name: "IsPrimary", type: "chk", editor: { data: me.dataStatus } },
                            { display: "自增", name: "IsIdentity", type: "chk", editor: { data: me.dataStatus } },
                            { display: "可空", name: "IsNullable", type: "chk", editor: { data: me.dataStatus } },
                            { display: "长度", name: "MaxLength", type: "int" },
                            { display: "数值精度", name: "Precision", type: "int" },
                            { display: "数值范围", name: "Scale", type: "int" },
                            { display: "默认值", name: "DefaultValue", type: "text" }
                        ]
                    }
                };
            },
            grid: null,
            searchForm: null,
            buttons: null,
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    autoWidth: true,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    usePager: false,
                    dataAction: 'local',
                    toolbar: {},
                    contentType: "application/json",
                    url: 'codeGen/columns',
                    parms: me.dialogData,
                    sortName: 'Position',
                    sortOrder: 'asc',
                    width: '100%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: false
                });
            },
            reload: function () { //刷新
                var me = this;
                me.buttons[0].click();
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch = $("#formsearch")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        click: function () {
                            LG.commonSearch($formsearch, me.grid, function (form) {
                                var parms = me.grid.options.parms;
                                var data = form.getData();
                                delete parms.link;
                                if (data._search_Dblink) parms.link = data._search_Dblink;
                                return true;
                            }, true);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                    }
                });
                me.buttons[0].click(); //查询
            },
            init: function () {
                var me = this;
                if (frameElement && frameElement.dialog) {
                    me.dialog = frameElement.dialog;
                    me.dialogData = me.dialog.get('data') || {};
                }
                me.setConfig();
                me.setGrid();
                me.setForm();
                return me;
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>
</html>
