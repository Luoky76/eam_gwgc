<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title>代码生成</title>
    <script src="../lib/LGboot.js" type="text/javascript"></script>
    <style type="text/css">
        .full {
            margin: 0;
            padding: 3px 5px;
            width: 100%;
            height: 100%;
            overflow: auto;
            box-sizing: border-box;
            border: none;
        }
    </style>
</head>

<body style="padding: 5px; height: 100%;">
    <div id="model-pannel">
    </div>
    <script type="text/javascript">
        'use strict';
        var business = {
            load: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'codeGen/codeContent',
                    loading: '正在生成中...',
                    data: me.dialogData,
                    success: function (data, message) {
                        me.initTab(data);
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            initTab: function (data) {
                var me = this;
                var $tab = $("#model-pannel");
                me.data = data || [];
                var htmls = [];
                for (var i = 0, l = me.data.length; i < l; i++) {
                    var item = me.data[i];
                    htmls.push('<div title="' + item.Key + '">');
                    htmls.push('    <textarea class="full">' + item.Value + '</textarea></div>');
                }
                $tab.html(htmls.join(''));
                me.tab = $tab.ligerTab({
                    heightDiff: -45,
                    cls: "l-tab-auto",
                    height: "100%",
                    pill: true,
                    showSwitch: true
                });
            },
            build: function () {
                var me = this;
                $.ligerDialog.prompt("请输入模块", "", function (isOk, val) {
                    if (!isOk) return;
                    var rows = $.extend(true, [], me.dialogData || []);
                    for (var i = 0, l = rows.length; i < l; i++) {
                        var item = rows[i];
                        item.Module = val;
                    }
                    LG.ajax({
                        url: 'codeGen/codeBuild',
                        loading: '正在生成中...',
                        data: rows,
                        success: function (data) {
                            LG.showSuccess("生成路径：" + data, function () {
                                me.dialog.close();
                            });
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                });
            },
            download: function () {
                var me = this;
                $.ligerDialog.prompt("请输入模块", "", function (isOk, val) {
                    if (!isOk) return;
                    var rows = $.extend(true, [], me.dialogData || []);
                    for (var i = 0, l = rows.length; i < l; i++) {
                        var item = rows[i];
                        item.Module = val;
                    }
                    LG.download({
                        url: "codeGen/codeDownload",
                        type: "post",
                        contentType: "application/json",
                        data: rows
                    });
                });
            },
            copy: function () {
                var me = this;
                var html = me.tab.getSelectedTabItem().find("pre").text();
                navigator.clipboard.writeText(html);
            },
            setFormDefaultBtn: function () {
                var me = this;
                var buttons = [];
                buttons.push({ text: '下载', onclick: function () { me.download(); } });
                buttons.push({ text: '本地生成', onclick: function () { me.build(); } });
                buttons.push({ text: '复制', onclick: function () { me.copy(); } });
                LG.addFormButtons(buttons);
            },
            init: function () {
                var me = this;
                if (frameElement && frameElement.dialog) {
                    me.dialog = frameElement.dialog;
                    me.dialogData = me.dialog.get('data') || [];
                }
                me.setFormDefaultBtn();
                me.load();
                return me;
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>
</html>
