<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title>管理数据源</title>
    <script src="../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <form action="" id="mainform">
        <div id="maingrid">
        </div>
    </form>
    <script type="text/javascript">
        'use strict';
        var business = {
            dataType: "oracle|mysql|sqlite|dameng|sqlserver|pgsql",
            setConfig: function () {
                var me = this;
                this.config = {
                    search: {
                        fields: [
                        ]
                    },
                    grid: {
                        columns: [
                            { display: '名称', name: 'LINKNAME', validate: { required: true }, editor: { type: 'text' } },
                            { display: '描述', name: 'CORPID', editor: { type: 'text' } },
                            { display: '类型', name: 'LINKTYPE', dictionary: me.dataType, validate: { required: true }, editor: { type: 'select' } },
                            { display: '连接字符串', name: 'CONNSTR', validate: { required: true }, editor: { type: 'text' } }
                        ]
                    }
                };
            },
            grid: null,
            searchForm: null,
            buttons: null,
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    usePager: false,
                    autoWidth: true,
                    delayLoad: false,
                    columns: me.config.grid.columns,
                    dataAction: 'local',
                    toolbar: {},
                    url: 'codeGen/linklist',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: 'LINKNAME',
                    sortOrder: 'asc',
                    width: '100%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: true,
                    clickToEdit: true
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "add":
                            me.add();
                            break;
                        case "delete":
                            me.delete();
                            break;
                        case "save":
                            me.save();
                            break;
                        case "encrypt":
                            me.encrypt();
                            break;
                    }
                }
                me.grid.set({
                    toolbar: {
                        "items": [
                            { id: "refresh", text: '刷新', click: me.toolbarBtnItemClick, icon: "fa fa-refresh" },
                            { line: true },
                            { id: "add", text: '增加', click: me.toolbarBtnItemClick, icon: "fa fa-plus" },
                            { line: true },
                            { id: "save", text: '保存', click: me.toolbarBtnItemClick, icon: "fa fa-save" },
                            { line: true },
                            { id: "delete", text: '删除', click: me.toolbarBtnItemClick, icon: "fa fa-times" },
                            { line: true },
                            { id: "encrypt", text: '密文', click: me.toolbarBtnItemClick, icon: "fa fa-eye" }
                        ]
                    }
                });
            },
            add: function () { //新增
                var me = this;
                me.grid.addEditRow({ VALIDFLAG: "1" }, true);
            },
            save: function () { //保存
                var me = this;
                if (me.grid.endEdit() != false) {
                    if (!me.grid.isDataChanged) {
                        LG.showSuccess('无修改');
                        return;
                    }
                    if (!me.grid.validChangeRows()) return false;
                    var changeRow = me.grid.getChangedRows();
                    LG.ajax({
                        jsToken: true,
                        url: 'codeGen/linksave',
                        loading: '正在保存中...',
                        data: changeRow,
                        success: function () {
                            LG.showSuccess('保存成功', function () {
                                me.grid.isDataChanged = false;
                                me.reload();
                            });
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                }

            },
            encrypt: function () { //保存
                var me = this;
                $.ligerDialog.prompt("请输入", "", function (isOk, val) {
                    if (isOk) {
                        LG.ajax({
                            jsToken: true,
                            url: 'codeGen/doEncrypt',
                            loading: '正在处理中...',
                            data: { data: val },
                            success: function (data) {
                                $.ligerDialog.open({
                                    type: "success",
                                    content: '密文为' + data,
                                    buttons: [{
                                        text: "复制并关闭",
                                        onclick: function () {
                                            var g = this, p = g.options;
                                            p.parent.close();
                                            navigator.clipboard.writeText(data);
                                        }
                                    }]
                                });
                            },
                            error: function (message) {
                                LG.showError(message);
                            }
                        });
                    }
                });
            },
            reload: function () { //刷新
                var me = this;
                me.grid.loadData();
            },
            delete: function () { //删除
                var me = this;
                if (me.grid.endEdit() != false) {
                    var selected = me.grid.getSelectedRows();
                    if (selected.length > 0) {
                        $.ligerDialog.confirm('确定删除吗?', function (confirm) {
                            if (confirm) {
                                for (var i = 0, len = (selected || []).length; i < len; i++) {
                                    me.grid.deleteRow(selected[i]);
                                }
                                me.save();
                            }
                        });
                    } else {
                        LG.tip('请选择行!');
                    }
                }
            },
            bindGridEvent: function () {
                var me = this;
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            init: function () {
                var me = this;
                me.setConfig();
                me.setGrid();
                return me;
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>
</html>
