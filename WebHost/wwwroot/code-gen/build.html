<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title>代码生成</title>
    <script src="../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <div id="mainsearch">
        <form action="" id="formsearch" class="l-form">
        </form>
    </div>
    <form action="" id="mainform">
        <div id="maingrid">
        </div>
    </form>
    <script type="text/javascript">
        'use strict';
        var business = {
            setConfig: function () {
                var me = this;
                me.config = {
                    search: {
                        fields: [
                            { display: "数据源", name: "_search_Dblink", userSearch: false, width: 280, type: "select", type: "select", options: { data: me.dataLink, autocomplete: true, onChangeValue: me.changeDblink.bind(me) } },
                            { display: "名称", name: "_search_Name", dbname: "Name", type: "text" }
                        ]
                    },
                    grid: {
                        columns: [
                            {
                                display: "名称", name: "Name", align: "left", width: 300, type: "text", render: function (_rowdata, _rowindex, value) {
                                    return '<a class="l-grid-row-button" href="javascript:business.view()">' + value + '</a>';
                                }
                            },
                            { display: "描述", name: "Description", width: 300, type: "text" },
                            { display: "类型", name: "Type", width: 300, type: "text" }
                        ]
                    }
                };
            },
            grid: null,
            searchForm: null,
            buttons: null,
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'codeGen/comboxdata',
                    loading: '正在获取中...',
                    success: function (data, message) {
                        me.dataLink = data.LinkData;
                        var editor = null;
                        if (me.searchForm) {
                            editor = me.searchForm.getEditor("_search_Dblink");
                            if (editor) editor.setData(me.dataLink);
                        }
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            setGrid: function () {
                var me = this;
                me.config.grid.columns.removeNull();
                me.grid = $("#maingrid").ligerGrid({
                    autoWidth: true,
                    delayLoad: true,
                    columns: me.config.grid.columns,
                    usePager: false,
                    dataAction: 'local',
                    toolbar: {},
                    url: 'codeGen/list',
                    parms: {
                        where: JSON.stringify({
                            op: 'and',
                            rules: []
                        })
                    },
                    sortName: 'NAME',
                    sortOrder: 'asc',
                    width: '100%',
                    height: '100%',
                    checkbox: true,
                    enabledEdit: false
                });
                me.grid.isValid = true;
                me.loadToolbar();
                me.bindGridEvent();
            },
            loadToolbar: function () {
                var me = this;
                me.toolbarBtnItemClick = function (item) {
                    switch (item.id) {
                        case "refresh":
                            me.reload();
                            break;
                        case "dblink":
                            me.dblink();
                            break;
                        case "modelBuild":
                            me.build('实体生成', 'model.html');
                            break;
                        case "codeBuild":
                            me.build('代码生成', 'code.html');
                            break;
                        case "templateBuild":
                            me.build('模板生成', 'template.html');
                            break;
                    }
                }
                me.grid.set({
                    toolbar: {
                        "items": [
                            { id: "dblink", text: '管理数据源', click: me.toolbarBtnItemClick, type: "primary", icon: "fa fa-database" },
                            { id: "modelBuild", text: '实体生成', click: me.toolbarBtnItemClick, type: "primary", icon: "fa fa-database" },
                            { id: "codeBuild", text: '代码生成', click: me.toolbarBtnItemClick, type: "primary", icon: "fa fa-folder-open" },
                            { id: "templateBuild", text: '模板生成', click: me.toolbarBtnItemClick, type: "primary", icon: "fa fa-clipboard" }
                        ]
                    }
                });
            },
            changeDblink: function (input, value, g) {
                var me = this;
                me.buttons[0].click();
            },
            dblink: function () { //新增
                var me = this;
                $.ligerDialog.open({
                    width: 800,
                    height: 600,
                    allowClose: true,
                    title: '管理数据源',
                    url: 'dblink.html',
                    isHidden: false,
                    showMax: false,
                    showToggle: false,
                    showMin: false,
                    isResize: true,
                    slide: false,
                    onClosed: me.loadComboxData.bind(me),
                    data: {}
                });
            },
            view: function () {
                var me = this;
                var row = me.grid.getSelectedRow(true);
                $.ligerDialog.open({
                    width: 800,
                    height: 600,
                    allowClose: true,
                    title: '查看列信息',
                    url: 'columns.html',
                    isHidden: false,
                    showMax: false,
                    showToggle: false,
                    showMin: false,
                    isResize: true,
                    slide: false,
                    data: row
                });
            },
            build: function (title,url) {
                var me = this;
                var rows = me.grid.getSelectedRows(true);
                $.ligerDialog.open({
                    width: 800,
                    height: 600,
                    allowClose: true,
                    title: title,
                    url: url,
                    isHidden: false,
                    showMax: false,
                    showToggle: false,
                    showMin: false,
                    isResize: true,
                    slide: false,
                    data: rows
                });
            },
            reload: function () { //刷新
                var me = this;
                me.buttons[0].click();
            },
            bindGridEvent: function () {
                var me = this;
                me.grid.bind('beforeSubmitEdit', function (e) {
                    if (this.isValid) {
                        if (!LG.validator.form()) {
                            LG.showInvalidTip();
                            return false;
                        }
                    } else {
                        $(".l-verify-tip").remove();
                    }
                    return true;
                });
                LG.validate($("#mainform"), {
                    debug: true
                });
            },
            setForm: function () {
                var me = this;
                me.config.search.fields.removeNull();
                var $formsearch = $("#formsearch")
                //搜索表单应用ligerui样式
                me.searchForm = $formsearch.ligerForm({
                    fields: me.config.search ? me.config.search.fields : [],
                    validate: true,
                    buttons: [{
                        text: '查询',
                        width: 60,
                        type: "primary", 
                        click: function () {
                            LG.commonSearch($formsearch, me.grid, function (form) {
                                var parms = me.grid.options.parms;
                                var data = form.getData();
                                delete parms.link;
                                if (data._search_Dblink) parms.link = data._search_Dblink;
                                return true;
                            }, true);
                        }
                    }],
                    onAfterSetFields: function (g) {
                        me.searchForm = g;
                        me.buttons = g.options.buttons;
                    }
                });
                me.buttons[0].click(); //查询
            },
            init: function () {
                var me = this;
                me.loadComboxData();
                me.setConfig();
                me.setGrid();
                me.setForm();
                return me;
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>
</html>
