<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>上传示例</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
    <script src="../../lib/js-export/FileSaver.js" type="text/javascript"></script>
    <style type="text/css">
        body {
            margin: 10px;
        }
    </style>
</head>
<body>
    <div class="groupTitle">
        <span>上传示例</span>
    </div>
    <button id="b1"></button>
    <button id="b2"></button>
    <button id="b3"></button>
    <div class="groupTitle">
        <span>下载示例</span>
    </div>
    <button id="b4"></button>
    <button id="b5"></button>
    <button id="b6"></button>
    <button id="b7"></button>
    <button id="b8"></button>
    <button id="b9"></button>
    <button id="b10"></button>
    <button id="b11"></button>
    <div class="groupTitle">
        <span>参数处理</span>
    </div>
    <button id="b12"></button>
    <script>
        'use strict';
        $("#b1").ligerButton({
            text: "上传失败",
            onClick: function () {
                LG.showUpload({
                    title: "图片上传",
                    server: "Demo/Upload",
                    multiple: false,
                    extensions: 'gif,jpg,jpeg,bmp,png',
                    mimeTypes: 'image/*',
                    compress: {
                        width: 1920
                    },
                    showSuccess: true,
                    data: { folder: 'Adv' },
                    callback: function (status, data) {
                        if (status) LG.showSuccess(JSON.stringify(data));
                        else LG.showError(JSON.stringify(data));
                    }
                });
            }
        });
        $("#b2").ligerButton({
            text: "上传Excel",
            onClick: function () {
                LG.showUpload({
                    title: "图片上传",
                    server: "Demo/Upload",
                    mouldFileName: "Demo/ExportExcelHeader",
                    multiple: false,
                    extensions: 'xlsx',
                    mimeTypes: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
                    compress: {
                        width: 1920
                    },
                    showSuccess: false,
                    data: { folder: '../../Adv' },
                    callback: function (status, data) {
                        if (status) LG.showSuccess(data.Message);
                        else LG.showError(data.Message);
                    }
                });
            }
        });
        $("#b3").ligerButton({
            text: "多文件上传,调用多次接口",
            onClick: function () {
                LG.showUpload({
                    title: "图片上传",
                    server: "Demo/Upload",
                    multiple: true,
                    extensions: 'gif,jpg,jpeg,bmp,png',
                    mimeTypes: 'image/*',
                    compress: {
                        width: 1920
                    },
                    showSuccess: false,
                    data: { folder: 'Adv' },
                    callback: function (status, data) {
                        if (status) LG.showSuccess(data.Message);
                        else LG.showError(data.Message);
                    }
                });
            }
        });

        $("#b4").ligerButton({
            text: "下载EXCEL模板",
            onClick: function () {
                LG.download({
                    url: "Demo/ExportExcelHeader",
                    type: "post",
                    data: { filename: "导出测试.xlsx" }
                });
            }
        });

        $("#b5").ligerButton({
            text: "导出EXCEL模板",
            onClick: function () {
                LG.download({
                    url: "Demo/ExportExcelTemplate",
                    type: "post",
                    data: { filename: "导出测试.xlsx" }
                });
            }
        });

        $("#b6").ligerButton({
            text: "List导出EXCEL",
            onClick: function () {
                LG.download({
                    url: "Demo/ListToExcel",
                    type: "post",
                    data: { filename: "导出测试.xlsx" }
                });
            }
        });

        $("#b7").ligerButton({
            text: "DataTable导出EXCEL",
            onClick: function () {
                LG.download({
                    url: "Demo/DataTableToExcel",
                    type: "post",
                    data: { filename: "导出测试.xlsx" }
                });
            }
        });

        $("#b8").ligerButton({
            text: "导出Word",
            onClick: function () {
                LG.download({
                    url: "Demo/ExportToWord",
                    type: "post",
                    data: { filename: "导出测试.docx" }
                });
            }
        });

        $("#b9").ligerButton({
            text: "导出PDF",
            onClick: function () {
                LG.download({
                    url: "Demo/ExportToPdf",
                    type: "post",
                    data: { filename: "导出测试.pdf" }
                });
            }
        });

        $("#b10").ligerButton({
            text: "导出HTML",
            onClick: function () {
                LG.download({
                    url: "Demo/ExportToHtml",
                    type: "post",
                    data: { filename: "导出测试.html" }
                });
            }
        });

        $("#b11").ligerButton({
            text: "列表导出PDF",
            onClick: function () {
                LG.download({
                    url: "Demo/ListToPdf",
                    type: "post",
                    data: { filename: "导出测试.pdf" }
                });
            }
        });

        $("#b12").ligerButton({
            text: "参数测试",
            onClick: function () {
                var request = { Names: [encrypt("加密")], Parameters: [], Data: { "AA": encrypt("Value"), "BB": [encrypt("array")] } };
                for (var i = 0; i < 100; i++) {
                    var model = {
                        Names: [encrypt(i)], Parameters: [], Data: { "AA": encrypt("Value"), "BB": [encrypt("array")] }
                    };
                    for (var j = 0; j < 100; j++) {
                        model.Parameters.push({ Names: [encrypt("底层" + j)], Parameters: [] });
                    }
                    request.Parameters.push(model);
                }
                LG.ajax({
                    url: 'Demo/ParameterHandle',
                    data: request,
                    success: function (_data, _message) {
                        debugger;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            }
        });
    </script>
</body>
</html>
