<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title>借款</title>
    <script src="../../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <form id="mainform">
    </form>
    <script type="text/javascript">
        'use strict';
        var business = {
            isStart: getQueryStringByName("isStart") === "1",
            isView: getQueryStringByName("isView") === "1",
            setConfig: function () {
                var me = this;
                me.config = {
                    form: {
                        fields: [
                            {
                                display: "借款金额", name: "money", newline: false, width: 180, validate: { required: true }, type: "float", options: {}
                            }
                        ]
                    }
                };
            },
            mainform: null,
            buttons: null,
            loadData: function () {
                var me = this;
                if (me.isStart) {
                    me.mainform.setOrginData({ money: 500 }, true);
                    if (me.isView) {
                        me.mainform._setDisabled(true);
                    }
                    else {
                        me.mainform.focus();
                    }
                    return;
                }
                me.mainform.setOrginData(JSON.parse((parent.window.business.data.FormData || "{}")), true);
                me.mainform._setDisabled(true);
            },
            add: function () {
                var me = this;
                if (!me.mainform.valid()) {
                    me.mainform.showInvalid();
                    return;
                }
                var formData = me.mainform.getData();
                parent.window.business.add(formData);
            },
            setForm: function () {
                var me = this;
                me.config.form.fields.removeNull();
                var $formsearch = $("#mainform");
                var buttons = me.isOper ? [
                    {
                        text: '提交', type: "primary", newline: true, click: function () {
                            me.add();
                        }
                    }, {
                        text: '重置', type: "ghost", click: function () {
                            $.ligerDialog.confirm("确定重置数据吗?", function (confirm) {
                                if (confirm) {
                                    me.mainform.reset();
                                }
                            });
                        }
                    }] : null;
                //搜索表单应用ligerui样式
                me.mainform = $formsearch.ligerForm({
                    validate: true,
                    fields: me.config.form.fields,
                    onAfterSetFields: function (g) {
                        me.mainform = g;
                        me.buttons = g.options.buttons;
                    },
                    buttons: buttons
                });
            },
            init: function () {
                var me = this;
                me.isOper = me.isStart && !me.isView;
                me.setConfig();
                me.setForm();
                me.loadData();
                return me;
            }
        };
        business.init();
    </script>
</body>
</html>
