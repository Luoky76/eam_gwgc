<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2196f3">
    <title>微信绑定</title>
    <link rel="stylesheet" href="../dist/Framework7/mobile.css?v=1" />
</head>

<body>
    <div id="app">
        <div class="view view-main">
            <div class="page" data-name="weixin-binding">
                <div class="toolbar toolbar-bottom-md">
                    <div class="toolbar-inner">
                        <a href='javascript:app.methods.toUrl("back")' class="link external">
                            <i class="f7-icons">arrow_left</i>
                            <span class="ios-only">返回</span>
                        </a>
                        <a href='javascript:app.methods.toUrl("/Index/")' class="link external">
                            <i class="f7-icons">home</i>
                            <span class="ios-only">主页</span>
                        </a>
                    </div>
                </div>
                <div class="page-content">
                    <div class="block block-strong">
                        <p class="row">
                            <button target="wxImage" class="col button button-fill color-red">图片上传</button>
                            <button target="wxPay" class="col button button-fill color-green">微信支付</button>
                            <button class="col button button-fill color-blue">Blue</button>
                        </p>
                        <p class="row">
                            <button class="col button button-fill color-pink">Pink</button>
                            <button class="col button button-fill color-yellow">Yellow</button>
                            <button class="col button button-fill color-orange">Orange</button>
                        </p>
                        <p class="row">
                            <button class="col button button-fill color-gray">Gray</button>
                            <button class="col button button-fill color-black">Black</button>
                            <button class="col button button-fill color-white text-color-black">White</button>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="text/javascript" src="../../m/dist/Framework7/mobile.js?v=1"></script>
    <script type="text/javascript" src="http://res.wx.qq.com/open/js/jweixin-1.6.0.js"></script>
    <script type="text/javascript" src="../../m/dist/Framework7/app.js?v=1"></script>
    <script id="scriptBlock" type="text/javascript">
        'use strict';
        var business = {
            wxImage: function () {

                wx.chooseImage({
                    count: 1, // 默认9
                    sizeType: ['original', 'compressed'], // 可以指定是原图还是压缩图，默认二者都有
                    sourceType: ['album', 'camera'], // 可以指定来源是相册还是相机，默认二者都有
                    success: function (res) {
                        var localIds = res.localIds; // 返回选定照片的本地ID列表，localId可以作为img标签的src属性显示图片
                        wx.getLocalImgData({
                            localId: localIds[0], // 图片的localID
                            success: function (res) {
                                var base64 = res.localData; // localData是图片的base64数据，可以用img标签显示
                                var arr = base64.split(',');
                                var mime = arr.length > 1 ? arr[0].match(/:(.*?);/)[1] : "image/jpeg";
                                var bstr = atob(arr[arr.length - 1]),
                                    n = bstr.length,
                                    u8arr = new Uint8Array(n);
                                while (n--) {
                                    u8arr[n] = bstr.charCodeAt(n);
                                }
                                var file = new File([u8arr], "upload.jpg", {
                                    type: mime
                                });
                                var formData = new FormData();
                                formData.append("formFile", file);
                                formData.append("folder", "SealImg");
                                formData.append("data", "123123");
                                app.ajax({
                                    url: "Demo/Upload",
                                    contentType: "multipart/form-data",
                                    data: formData,
                                    success: function (data) {
                                    }
                                });
                            }
                        });
                    }
                });
            },
            wxPay: function () {
                app.ajax({
                    url: 'Demo/Transactions',
                    success: function (data) {
                        function onBridgeReady() {
                            WeixinJSBridge.invoke(
                                'getBrandWCPayRequest', data,
                                function (res) {
                                    if (res.err_msg == "get_brand_wcpay_request:ok") {
                                        // 使用以上方式判断前端返回,微信团队郑重提示：
                                        //res.err_msg将在用户支付成功后返回ok，但并不保证它绝对可靠。
                                    }
                                });
                        }
                        if (typeof WeixinJSBridge == "undefined") {
                            if (document.addEventListener) {
                                document.addEventListener('WeixinJSBridgeReady', onBridgeReady, false);
                            }
                        } else {
                            onBridgeReady();
                        }
                    }
                });
            },
            init: function () {
                var me = this;
                $$(".page-current button[target]").off("click").click(function () {
                    var $this = $$(this);
                    var target = $this.attr("target");
                    $this.addClass("disabled");
                    app.methods.initWX(function () {
                        me[target]();
                    });
                    $this.removeClass("disabled");
                });
            }
        };
        business.init();
    </script>
</body>
</html>
