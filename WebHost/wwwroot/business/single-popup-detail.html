
<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <title> 明细</title>
    <script src="../lib/LGboot.js" type="text/javascript"></script>
</head>

<body style="padding: 5px; height: 100%;">
    <form id="mainform">
    </form>
    <script type="text/javascript">
        'use strict';
        var business = {
            dialogData: {},
            isAddNew: false,
            isView: true,
            sid: getQueryStringByName("sid"),
            dataRole: [],
            setConfig: function () {
                var me = this;
                me.config = {
                    form: {
                        fields: [
                            { display: "名称", name: "STRING_COLUMN", newline: false, upper: true, type: "text", validate: { required: true }, options: {} },
                            { display: "整数", name: "INT_COLUMN", newline: false, upper: true, type: "int", options: {} },
                            { display: "小数", name: "FLOAT_COLUMN", newline: false, upper: true, type: "float", options: { precision: 3 } },
                            { display: "日期", name: "DATE_COLUMN", newline: false, upper: true, type: "date", validate: { required: true }, options: { format: "yyyy-MM-dd hh:mm" } },
                            { display: "下拉", name: "COMB_COLUMN", newline: false, upper: true, type: "select", options: { data: function () { return me.dataRole; } } },
                            { display: "职业", name: "DIFF_COMB_COLUMN", newline: false, upper: true, type: "select", options: { canDifferent: true, data: function () { return me.dataStation; } } },
                            { display: "公司", name: "CORPID", newline: false, upper: true, type: "select", validate: { required: true }, options: { data: function () { return me.dataCorp; } } }
                        ]
                    }
                };
            },
            mainform: null,
            buttons: null,
            loadComboxData: function () {
                var me = this;
                LG.ajax({
                    async: false,
                    url: 'business/single/comboxdata',
                    loading: '正在获取中...',
                    success: function (data) {
                        me.dataRole = data.roleData;
                        me.dataStation = data.BCCode;
                        me.dataCorp = data.corpData;
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            loadData: function () {
                var me = this;
                if (me.isAddNew) {
                    var dateSysDate = {};
                    LG.getSysdate({ idfield: "sysdate - 3", textfield: "sysdate" }, dateSysDate);
                    var corp = me.dataCorp.length > 0 ? me.dataCorp[0].ID : "";
                    me.mainform.setOrginData({ CORPID: corp, DATE_COLUMN: dateSysDate.TEXT });
                }
                else {
                    LG.ajax({
                        async: false,
                        url: 'business/single/get',
                        loading: '正在获取中...',
                        data: { id: me.sid },
                        success: function (data) {
                            me.mainform.setOrginData(data);
                        },
                        error: function (message) {
                            LG.showError(message);
                        }
                    });
                    if (me.isView) {
                        me.mainform.setReadonly(true);
                    }
                }
                me.mainform.focus();
            },
            save: function () { //保存
                var me = this;
                if ($.isEmptyObject(me.mainform.getChanges())) {
                    LG.showSuccess('无修改');
                    return;
                }
                if (!me.mainform.valid()) {
                    me.mainform.showInvalid();
                    return;
                }
                function handle(data) {
                    return data;
                }
                var data = handle(me.mainform.getData());
                var original = handle(me.mainform.getOrginData());
                var changeRow = new Object();
                if (me.isAddNew) {
                    changeRow["added"] = [data];
                }
                else {
                    changeRow["updated"] = [data];
                    changeRow["original"] = [original];
                }
                LG.ajax({
                    jsToken: true,
                    url: 'business/single/save',
                    loading: '正在保存中...',
                    data: changeRow,
                    success: function () {
                        LG.showSuccess('保存成功', function () {
                            location.reload(true);
                        });
                    },
                    error: function (message) {
                        LG.showError(message);
                    }
                });
            },
            close: function () {
                var me = this;
                function inner(callback) {
                    var data = me.mainform.getChanges();
                    if (!$.isEmptyObject(data)) {
                        $.ligerDialog.confirm($.ligerDefaults.GridString.isContinueByDataChanged, function (confirm) {
                            if (confirm) {
                                if (callback) callback(2);
                            }
                            else {
                                if (callback) callback(0);
                            }
                        });
                        if (callback) return callback(-1);
                        return false;
                    }
                    if (callback) return callback(1);
                    return true;
                }
                inner(function (status) {
                    if (status > 0) {
                        if (me.dialog) me.dialog.close();
                        var win = parent || window;
                        if (win.closeCurrentTab) win.closeCurrentTab();
                        else win.close();
                    }
                });
            },
            setFormDefaultBtn: function (cancleCallback, savedCallback) {
                var me = this;
                //表单底部按钮
                var buttons = [];
                if (!me.isView) {
                    buttons.push({
                        text: '重置', onclick: function () {
                            $.ligerDialog.confirm("确定重置数据吗?", function (confirm) {
                                if (confirm) {
                                    me.loadData();
                                }
                            });
                        }
                    });
                }
                buttons.push({ text: '关闭', onclick: me.close.bind(me) });
                if (!me.isView) buttons.push({ text: '保存', onclick: me.save.bind(me) });
                LG.addFormButtons(buttons);
                me.formButtons = buttons;
            },
            setForm: function () {
                var me = this;
                me.config.form.fields.removeNull();
                var $formsearch = $("#mainform")
                //搜索表单应用ligerui样式
                me.mainform = $formsearch.ligerForm({
                    EnterMoveNextControl: true,
                    labelAlign: 'right',
                    space: 3,
                    validate: true,
                    fields: me.config.form.fields,
                    labelWidth: 60,
                    onAfterSetFields: function (g) {
                        me.mainform = g;
                        me.buttons = g.options.buttons;
                    }
                });
                me.setFormDefaultBtn();
            },
            init: function () {
                var me = this;
                if (frameElement && frameElement.dialog) {
                    me.dialog = frameElement.dialog;
                    me.dialogData = me.dialog.get('data');
                    if (me.dialogData) {
                        me.callback = me.dialogData.callback;
                        me.sid = me.dialogData.sid
                        me.isView = me.dialogData.view === "1";
                    }
                }
                if ((me.sid || "0") === "0") me.sid = "";
                me.isAddNew = (me.sid === "");
                me.isView = false;
                me.loadComboxData();
                me.setConfig();
                me.setForm();
                me.loadData();
                return me;
            }
        };
        business.init();
    </script>
</body>

</html>
