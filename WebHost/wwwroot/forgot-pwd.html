<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, minimal-ui, viewport-fit=cover">
    <title>忘记密码</title>
    <script src="lib/jquery/jquery.js" type="text/javascript"></script>
    <script src="lib/js/common.js?v=1" type="text/javascript"></script>
    <style type="text/css">
        * {
            padding: 0;
            margin: 0;
        }

        html {
            background: #F6F5F6;
            overflow: hidden;
        }

        body {
            overflow: hidden;
        }

        #div-head {
            height: 80px;
            text-align: left;
        }

        #img-logo {
            margin: 10px;
            height: 60px;
        }

        #div-center {
            width: 100%;
            height: 520px;
            background-image: url("lib/images/login/login-bg.jpg?v=1");
            background-position: center;
            background-size: cover;
            position: relative;
            padding-top: 60px;
        }

        #div-login-panel {
            float: right;
            margin-right: 20%;
            text-align: left;
            width: 383px;
            height: 337px;
            position: relative;
            background-image: url("lib/images/login/login-panel.png?v=1");
        }

            #div-login-panel .login-title {
                display: none;
                text-align: center;
                color: #1A58A1;
                line-height: 1.2em;
                font-size: 28px;
                font-weight: bold;
                letter-spacing: 2px;
            }

            #div-login-panel .login-panel {
                position: absolute;
                left: 40px;
                top: 48px;
            }

        #div-footer {
            width: 100%;
            position: fixed;
            bottom: 30px;
            text-align: center;
            color: #2B2B2B;
            font-size: 12px;
        }

        .login-input {
            position: relative;
            text-align: left;
            width:290px;
            height: 42px;
            line-height: 42px;
            margin-bottom: 10px;
        }

        .login-text {
            padding-left: 20px;
            position: absolute;
            left: 5px;
            top: 0px;
            height: 42px;
            line-height: 42px;
            width: 270px;
            border: none;
            font-size: 18px;
            outline: none;
            background-color: white;
            border-radius: 8px;
            -webkit-box-shadow: inset 0 1px 1px rgba(0, 0, 0, .075);
            box-shadow: inset 0 1px 1px rgba(0, 0, 0, .075);
            -webkit-transition: border-color ease-in-out .15s, -webkit-box-shadow ease-in-out .15s;
            -o-transition: border-color ease-in-out .15s, box-shadow ease-in-out .15s;
            transition: border-color ease-in-out .15s, box-shadow ease-in-out .15s;
        }

        .login-null {
            font-size: 16px;
            color: #9B9B9B;
            cursor: text;
            white-space: nowrap;
            z-index: 10;
            padding-left: 20px;
            width: 230px;
        }

        #btnLogin {
            margin-left: 20px;
            width: 240px;
            height: 41px;
            line-height: 41px;
            background-color: #2e75e3;
            border: 1px solid #2e75e3;
            border-radius: 20px;
            text-align: center;
            color: white;
            z-index: 999;
            font-size: 20px;
            letter-spacing: 3px;
        }

        .none {
            display: none;
        }

        .hidden {
            visibility: hidden;
        }

        .disabled {
            cursor: not-allowed !important;
            color: #bbbec4 !important;
            border-color: #dddee1 !important;
            background-color: #f7f7f7 !important;
            pointer-events: none;
        }

        a.abutton {
            font-size: 16px;
            color: rgb(30, 128, 255);
            cursor: pointer;
            user-select: none;
        }

        #sms-code {
            display:inline;
            position: absolute;
            top: 0px;
            right: 5px;
            z-index: 999;
        }

        @media(max-width:800px) {
            #div-login-panel {
                float: none;
                margin-right: 0;
            }
        }
        /*** 弹出框*****/
        .myModa {
            position: fixed;
            z-index: 9000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            _height: expression(document.body.offsetHeight+"px");
            pointer-events: auto;
            background-color: rgba(0, 0, 0, .3);
            _position: absolute;
        }

            .myModa .myAlertBox {
                font-size: 16px;
                width: 300px;
                border-radius: 5px;
                border: 1px solid #d9d9d9;
                background-color: #fff;
                -webkit-background-clip: content;
                box-shadow: 1px 1px 50px rgba(0, 0, 0, .3);
                -webkit-overflow-scrolling: touch;
                margin: 0 auto;
            }

                .myModa .myAlertBox h6 {
                    font-size: 16px;
                    line-height: 42px;
                    overflow: hidden;
                    height: 42px;
                    padding: 0 80px 0 20px;
                    white-space: nowrap;
                    text-overflow: ellipsis;
                    color: #333;
                    border-bottom: 1px solid #eee;
                    border-radius: 2px 2px 0 0;
                    background-color: #f8f8f8;
                }

                .myModa .myAlertBox p {
                    padding: 20px;
                    line-height: 26px;
                    font-size: 16px;
                    overflow: hidden;
                    overflow-x: hidden;
                    overflow-y: auto;
                    word-break: break-all;
                }

                .myModa .myAlertBox .btn {
                    display: block;
                    text-align: center;
                    vertical-align: middle;
                    -ms-touch-action: manipulation;
                    touch-action: manipulation;
                    cursor: pointer;
                    background-image: none;
                    border: 1px solid #2d8cf0;
                    white-space: nowrap;
                    -webkit-user-select: none;
                    -moz-user-select: none;
                    -ms-user-select: none;
                    user-select: none;
                    width: 80px;
                    border-radius: 5px;
                    line-height: 36px;
                    text-align: center;
                    font-size: 16px;
                    margin: 0 auto 20px;
                    color: #fff;
                    background-color: #2d8cf0;
                }

                    .myModa .myAlertBox .btn:active, .myModa .myAlertBox .btn:focus {
                        outline: 0;
                    }

        .myLoadding {
            border-radius: 8px;
            position: fixed;
            max-width: 280px;
            _width: expression(this.offsetWidth > 280 ? '280px': 'auto');
            *width: expression(this.offsetWidth > 280 ? '280px': 'auto');
            padding: 10px;
            text-align: center;
            background-color: #fff;
        }
    </style>
</head>

<body class="page-current">
    <center>
        <div id="div-head">
            <img id="img-logo" src="lib/images/login/logo.png?v=1" alt="logo" />
        </div>
        <div id="div-center">
            <div id="div-login-panel">
                <div class="login-title">忘记密码</div>
                <div class="login-panel">
                    <div class="login-input">
                        <input type="text" name="txtUsername" id="txtUsername" value="" class="login-text" />
                        <span class="login-text login-null">
                            请输入手机号或账号
                        </span>
                    </div>
                    <div class="login-input">
                        <a id="sms-code" class="abutton none">获取验证码</a>
                        <input type="password" name="txtOld" id="txtOld" value="" class="login-text" />
                        <span class="login-text login-null">
                            验证码
                        </span>
                    </div>
                    <div class="login-input">
                        <input type="password" name="txtNew" id="txtNew" value="" class="login-text" />
                        <span class="login-text login-null">
                            请输入新密码
                        </span>
                    </div>
                    <div class="login-input">
                        <input type="password" name="txtAgain" id="txtAgain" value="" class="login-text" />
                        <span class="login-text login-null">
                            请再次输入新密码
                        </span>
                    </div>
                    <div id="btnLogin">
                        确定
                    </div>
                </div>
            </div>
        </div>
        <div id="div-footer">
            技术支持：厦门自贸试验区电子口岸有限公司
        </div>
    </center>
    <script type="text/javascript">
        var myAlert = function (options) {
            var option = {
                title: "提示",
                message: "",
                callback: function () { }
            };
            if (typeof (options) == "string") {
                option.message = options
            } else {
                option = $.extend(option, options)
            }
            var top = $(window).height() * 0.3;
            $('body').append('<div class="myModa"><div class="myAlertBox"  style="margin-top:' + top + 'px"><h6>' +
                option.title + '</h6><p>' + option.message + '</p><button class="btn sure">确定</button></div></div>');
            $('.btn.sure').keydown(function (e) {
                if (e.keyCode == 13) {
                    e.preventDefault();
                    $(this).click();
                }
            }).click(function () {
                $('.myModa').remove();
                option.callback()
            }).focus();
        };
        var myLoadding = function (message) {
            var m = message || '加载中...';
            var top = $(window).height() * 0.3;
            $('body').append(
                '<div class="myModa"><div class="myLoadding"><img src="data:image/gif;base64,R0lGODlhIAAgALMAAP///7Ozs/v7+9bW1uHh4fLy8rq6uoGBgTQ0NAEBARsbG8TExJeXl/39/VRUVAAAACH/C05FVFNDQVBFMi4wAwEAAAAh+QQFBQAAACwAAAAAIAAgAAAE5xDISSlLrOrNp0pKNRCdFhxVolJLEJQUoSgOpSYT4RowNSsvyW1icA16k8MMMRkCBjskBTFDAZyuAEkqCfxIQ2hgQRFvAQEEIjNxVDW6XNE4YagRjuBCwe60smQUDnd4Rz1ZAQZnFAGDd0hihh12CEE9kjAEVlycXIg7BAsMB6SlnJ87paqbSKiKoqusnbMdmDC2tXQlkUhziYtyWTxIfy6BE8WJt5YEvpJivxNaGmLHT0VnOgGYf0dZXS7APdpB309RnHOG5gDqXGLDaC457D1zZ/V/nmOM82XiHQjYKhKP1oZmADdEAAAh+QQFBQAAACwAAAAAGAAXAAAEchDISasKNeuJFKoHs4mUYlJIkmjIV54Soypsa0wmLSnqoTEtBw52mG0AjhYpBxioEqRNy8V0qFzNw+GGwlJki4lBqx1IBgjMkRIghwjrzcDti2/Gh7D9qN774wQGAYOEfwCChIV/gYmDho+QkZKTR3p7EQAh+QQFBQAAACwBAAAAHQAOAAAEchDISWdANesNHHJZwE2DUSEo5SjKKB2HOKGYFLD1CB/DnEoIlkti2PlyuKGEATMBaAACSyGbEDYD4zN1YIEmh0SCQQgYehNmTNNaKsQJXmBuuEYPi9ECAU/UFnNzeUp9VBQEBoFOLmFxWHNoQw6RWEocEQAh+QQFBQAAACwHAAAAGQARAAAEaRDICdZZNOvNDsvfBhBDdpwZgohBgE3nQaki0AYEjEqOGmqDlkEnAzBUjhrA0CoBYhLVSkm4SaAAWkahCFAWTU0A4RxzFWJnzXFWJJWb9pTihRu5dvghl+/7NQmBggo/fYKHCX8AiAmEEQAh+QQFBQAAACwOAAAAEgAYAAAEZXCwAaq9ODAMDOUAI17McYDhWA3mCYpb1RooXBktmsbt944BU6zCQCBQiwPB4jAihiCK86irTB20qvWp7Xq/FYV4TNWNz4oqWoEIgL0HX/eQSLi69boCikTkE2VVDAp5d1p0CW4RACH5BAUFAAAALA4AAAASAB4AAASAkBgCqr3YBIMXvkEIMsxXhcFFpiZqBaTXisBClibgAnd+ijYGq2I4HAamwXBgNHJ8BEbzgPNNjz7LwpnFDLvgLGJMdnw/5DRCrHaE3xbKm6FQwOt1xDnpwCvcJgcJMgEIeCYOCQlrF4YmBIoJVV2CCXZvCooHbwGRcAiKcmFUJhEAIfkEBQUAAAAsDwABABEAHwAABHsQyAkGoRivELInnOFlBjeM1BCiFBdcbMUtKQdTN0CUJru5NJQrYMh5VIFTTKJcOj2HqJQRhEqvqGuU+uw6AwgEwxkOO55lxIihoDjKY8pBoThPxmpAYi+hKzoeewkTdHkZghMIdCOIhIuHfBMOjxiNLR4KCW1ODAlxSxEAIfkEBQUAAAAsCAAOABgAEgAABGwQyEkrCDgbYvvMoOF5ILaNaIoGKroch9hacD3MFMHUBzMHiBtgwJMBFolDB4GoGGBCACKRcAAUWAmzOWJQExysQsJgWj0KqvKalTiYPhp1LBFTtp10Is6mT5gdVFx1bRN8FTsVCAqDOB9+KhEAIfkEBQUAAAAsAgASAB0ADgAABHgQyEmrBePS4bQdQZBdR5IcHmWEgUFQgWKaKbWwwSIhc4LonsXhBSCsQoOSScGQDJiWwOHQnAxWBIYJNXEoFCiEWDI9jCzESey7GwMM5doEwW4jJoypQQ743u1WcTV0CgFzbhJ5XClfHYd/EwZnHoYVDgiOfHKQNREAIfkEBQUAAAAsAAAPABkAEQA                 m + '</p></div></div>');
            var top = ($(window).height() - $('.myLoadding').height()) / 2;
            var left = ($('body').width() - $('.myLoadding').width()) / 2;
            $('.myLoadding').css({
                'top': top + 'px',
                'left': left + 'px'
            })
        };
        var business = {
            submit: function () { //提交
                var me = this;
                var FromUrl = getQueryStringByName("FromUrl");
                if (((FromUrl || "").toLowerCase().indexOf("http") >= 0) && (FromUrl.indexOf(location.host) < 0)) FromUrl = "";
                FromUrl = FromUrl || "login.html";
                var passwordagain = $.trim($("#txtAgain").val() || "")
                var formData = {
                    username: $.trim($("#txtUsername").val() || ""),
                    oldpassword: $.trim($("#txtOld").val() || ""),
                    newpassword: $.trim($("#txtNew").val() || "")
                };
                if (!formData.username) {
                    myAlert({
                        "message": '请输入手机号或账号!',
                        callback: function () {
                            $("#txtUsername").focus();
                        }
                    });
                    return;
                }
                if (!formData.oldpassword) {
                    myAlert({
                        "message": '请输入旧密码!',
                        callback: function () {
                            $("#txtOld").focus();
                        }
                    });
                    return;
                }
                if (!formData.newpassword) {
                    myAlert({
                        "message": '请输入新密码!',
                        callback: function () {
                            $("#txtNew").focus();
                        }
                    });
                    return;
                }

                if (!passwordagain) {
                    myAlert({
                        "message": '请输入确认密码!',
                        callback: function () {
                            $("#txtAgain").focus();
                        }
                    });
                    return;
                }
                if (formData.newpassword !== passwordagain) {
                    myAlert("两次密码输入不一致");
                    return;
                }
                formData.username = encrypt(formData.username.toUpperCase());
                formData.oldpassword = encrypt(formData.oldpassword);
                formData.newpassword = encrypt(formData.newpassword);
                $.ajax({
                    noGlobal: true,
                    type: 'post',
                    cache: false,
                    dataType: 'json',
                    url: 'auth/resetpassword',
                    jsToken: {
                        url: "auth/logintoken"
                    },
                    data: formData,
                    success: function (result) {
                        $('.myModa').remove();
                        if (result && !result.IsError) {
                            myAlert({
                                "message": '密码操作成功!',
                                callback: function () {
                                    location.href = FromUrl;
                                }
                            });
                        } else {
                            myAlert({
                                "message": result.Message,
                                callback: function () {
                                    $("#txtOld").focus().select();
                                }
                            });
                        }
                    },
                    error: function () {
                        $('.myModa').remove();
                        myAlert('发送系统错误,请与系统管理员联系!');
                    },
                    beforeSend: function () {
                        $("#btnLogin").attr("disabled", true);
                        myLoadding();
                    },
                    complete: function () {
                        $("#btnLogin").attr("disabled", false);
                    }
                });
            },
            smsCode: function () {
                var me = this;
                var phone = $.trim($("#txtUsername").val() || "");
                if (!phone) {
                    myAlert({ "message": "请输入手机号或账号" });
                    return;
                }
                $.ajax({
                    noGlobal: true,
                    jsToken: true,
                    tokenOptions: {
                        url: "auth/smstoken"
                    },
                    type: 'post',
                    dataType: 'json',
                    url: 'auth/smscode',
                    data: { phone: encrypt(phone) },
                    success: function (result) {
                        if (!result || result.IsError) {
                            myAlert({ "message": result ? result.Message : "发送失败" });
                            return;
                        }
                        var time = 120;
                        var handler = null;
                        var inner = function () {
                            time = time - 1;
                            if (time == 0) {
                                me.$sms.text("获取验证码");
                                me.$sms.removeClass("disabled");
                                clearInterval(handler);
                                return;
                            }
                            me.$sms.text("(" + time + ")秒后重新发送");
                        }
                        me.$sms.addClass("disabled");
                        me.$sms.text("(" + time + ")秒后重新发送");
                        handler = setInterval(inner, 1000);
                    }
                });
            },
            eventBind: function () {
                var me = this;
                $(".login-null").bind('click', function () {
                    $(this).prev(".login-text").focus();
                });
                $(".login-text").bind('focus.textBox', function () {
                    $(this).next(".login-null").hide();
                }).bind('blur.textBox', function () {
                    if (!$(this).val()) {
                        $(this).next(".login-null").show();
                    } else {
                        $(this).next(".login-null").hide();
                    }
                }).focus(function () {
                    $(this).addClass("login-text-focus");
                }).blur(function () {
                    $(this).removeClass("login-text-focus");
                });

                $("#btnLogin").off("click").click(function () {
                    me.submit();
                });
                $("#txtUsername").keydown(function (e) {
                    if (e.keyCode == 13) {
                        e.preventDefault();
                        $("#txtOld").focus().select();
                    }
                });
                $("#txtOld").keydown(function (e) {
                    if (e.keyCode == 13) {
                        e.preventDefault();
                        $("#txtNew").focus().select();
                    }
                });
                $("#txtNew").keydown(function (e) {
                    if (e.keyCode == 13) {
                        e.preventDefault();
                        $("#txtAgain").focus().select();
                    }
                });
                $("#txtAgain").keydown(function (e) {
                    if (e.keyCode == 13) {
                        e.preventDefault();
                        me.submit();
                    }
                });
                me.$sms = $("#sms-code");
                me.$sms.click(function (e) {
                    me.smsCode();
                });
            },
            init: function () { //初始化
                var me = this;
                me.eventBind();
            }
        };
        $(function () {
            business.init();
        });
    </script>
</body>
</html>
